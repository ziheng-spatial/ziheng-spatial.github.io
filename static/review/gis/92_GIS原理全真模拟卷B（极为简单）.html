<script type="text/plain" id="md-raw"># 92 GIS 原理全真模拟卷 B（极为简单）

**适用课程与考纲**：山东理工大学（SDUT）《地理信息系统原理》期末全真模拟（极为简单 · 严格对齐 `18-12-10-30-30` 结构 · 与 A 卷完全互补零重复）

**背诵自测说明**：点击页面顶部「**背诵自测模式**」开关，所有答案区将自动模糊遮盖，作答后点击单题即可揭晓核对。参考答案保持极简得分风格（**核心关键词 + 1～2 句解释即可拿满**）。

| 题号 | 题型 | 题量与分值 | 来源分布 |
| :---: | :--- | :---: | :--- |
| **一** | 名词解释 | 6 题 × 3 分 = 18 分 | 100% 取自 `00` 圈画重点主库 |
| **二** | 填空题 | 12 空 × 1 分 = 12 分 | 11 题取自 `00` 主库 + 1 题最基础补充 |
| **三** | 判断题 | 10 题 × 1 分 = 10 分 | 9 题取自 `00` 主库 + 1 题最基础补充 |
| **四** | 简答题 | 5 题 × 6 分 = 30 分 | 100% 取自 `00` 圈画重点主库 |

## 一、名词解释（共 6 小题，每小题 3 分，共 18 分）

### 1. 地图投影（3 分）

> **【参考答案与分步采分点】**：
> 1. **数学本质**（1.5 分）：按一定数学法则将不可展的地球椭球面经纬网展绘到平面上，建立地理坐标 $(B, L)$ 与平面坐标 $(X, Y)$ 一一对应函数的方法；
> 2. **必然特性**（1.5 分）：展平过程必然伴随长度、面积或角度变形。

### 2. 场模型（域模型）（3 分）

> **【参考答案与分步采分点】**：
> 1. **定义**（1.5 分）：将连续分布的地理现象视为充满空间的属性变量或体，记作 $A = f(x, y)$ 或 $f(x, y, z)$；
> 2. **表达载体**（1.5 分）：常采用规则格网、TIN、等值线或离散样点近似表达（如高程、温度）。

### 3. 栅格数据结构（3 分）

> **【参考答案与分步采分点】**：
> 1. **定义**（1.5 分）：以规则排列的像元阵列表示空间对象的数据结构，以行列号定位置、像元值表属性；
> 2. **核心特点**（1.5 分）：特点为 **“属性明显、定位隐含”**，每单元仅存单值，易于空间叠置与地理模拟。

### 4. 元数据（Metadata）（3 分）

> **【参考答案与分步采分点】**：
> 1. **定义**（1.5 分）：关于数据的描述数据，用于记载地理数据集的内容、质量、表示方式、空间参考与管理方式；
> 2. **核心作用**（1.5 分）：是实现空间信息检索共享、数据集成与空间数据质量控制的核心标准。

### 5. 数字高程模型（DEM）（3 分）

> **【参考答案与分步采分点】**：
> 1. **狭义与广义定义**（2 分）：用有限高程数据对地形曲面作数字化模拟——**狭义**指区域地表海拔高程的数字化表达，**广义**泛指地理对象海拔高度表达（含海底、岩层、等压面）；
> 2. **与 DTM 关系**（1 分）：DEM 是数字地面模型（DTM）最核心的基础子集。

### 6. 基于位置的服务（LBS）（3 分）

> **【参考答案与分步采分点】**：
> 1. **定义**（1.5 分）：在移动计算环境下融合 GIS、空间定位（如 GPS）与无线通信技术，为移动对象提供位置相关信息的网络服务；
> 2. **三大业务类型**（1.5 分）：主要分为**查询、监控和导航**三类服务。

## 二、填空题（共 12 小题，每空 1 分，共 12 分）

### 7. 地理信息区别于其他类型信息的最显著标志是具有【　　】特征。（1 分）

> **【参考答案与采分点】**：**空间定位**（1 分）。

### 8. 空间数据抽象的三层模型由高到低依次为【　　】、逻辑模型和物理模型。（1 分）

> **【参考答案与采分点】**：**概念模型**（1 分）。

### 9. 空间拓扑关系核心包括邻接、关联、包含和【　　】四类。（1 分）

> **【参考答案与采分点】**：**连通**（1 分）。

### 10. 矢量数据结构的基本特点是“【　　】、属性隐含”。（1 分）

> **【参考答案与采分点】**：**定位明显**（1 分）。

### 11. 影像金字塔数据结构在 GIS 中主要有两大应用：一是栅格数据的【　　】与快速显示；二是互联网地图组织地图切片数据。（1 分）

> **【参考答案与采分点】**：**有损压缩**（1 分）。

### 12. 空间数据重构是为实现多源数据共享而执行的处理，具体包括【　　】和数据格式转换两个方面。（1 分）

> **【参考答案与采分点】**：**数据结构转换**（或矢量与栅格互转）（1 分）。

### 13. 空间数据采集与处理的基本流程为：数据源选择 $\to$ 采集方法确定 $\to$ 数据编辑与处理 $\to$ 【　　】 $\to$ 数据入库。（1 分）

> **【参考答案与采分点】**：**数据质量控制与评价**（1 分）。

### 14. 栅格窗口分析包含中心点、【　　】和运算方式三大核心要素。（1 分）

> **【参考答案与采分点】**：**分析窗口大小与类型**（1 分）。

### 15. 矢量网络分析的四大典型应用为路径分析、资源分配、【　　】和地址匹配。（1 分）

> **【参考答案与采分点】**：**最佳选址**（1 分）。

### 16. 在地图视觉变量中，定量变量含大小、方向、亮度等，而定性视觉变量主要为【　　】和色调。（1 分）

> **【参考答案与采分点】**：**形状**（1 分）。

### 17. 在标准差椭圆分析中，椭圆的【　　】越大，说明数据空间分布的方向趋势越明显。（1 分）

> **【参考答案与采分点】**：**扁率**（1 分）。

### 18. 在 OGC 空间信息网络服务标准中，用于向客户端返回带坐标与属性的原始矢量要素数据的服务是【　　】。（1 分）

> **【参考答案与采分点】**：**WFS**（或网络要素服务）（1 分）。

## 三、判断题（共 10 小题，每小题 1 分，共 10 分，正确的打 `√`，错误的打 `×`）

### 19. 强调全球范围内大地水准面与地球椭球面最佳符合的定位称为绝对定位，如 WGS84 坐标系。（　）

> **【参考答案与采分点】**：**（√）**（1 分）。局部最佳符合称为参考定位（如西安 80）。

### 20. 单纯坐标值的数值变换方程建立之后，可以无限制地直接适用于全球任意空间区域。（　）

> **【参考答案与采分点】**：**（×）**（1 分）。单纯数值变换方程仅适用于当前空间区域，跨区须重新建立。

### 21. 链码数据结构非常适合直接对多边形进行区域叠加空间分析以及边界合并编辑。（　）

> **【参考答案与采分点】**：**（×）**（1 分）。链码边界合并编辑困难且不具区域性质，极不利于区域叠置分析。

### 22. 通用关系数据库管理系统（DBMS）可直接高效支持 GIS 复杂图形显示与空间拓扑叠加运算。（　）

> **【参考答案与采分点】**：**（×）**（1 分）。空间数据具有非结构化、变长坐标与复杂空间关系特征，通用 DBMS 难以直接支持，需借助空间数据库引擎 SDE。

### 23. 在矢量网络中，道路曲线的弯曲度 $S = L / l$ 越小（越接近 1），说明道路越平直、交通越便利。（　）

> **【参考答案与采分点】**：**（√）**（1 分）。弯曲度为曲线长与两端直线距之比，越小越接近直线。

### 24. 广义上的数字高程模型（DEM）不仅能表达地表高程，还可延伸表达海底地形、下伏岩层和大气等压面。（　）

> **【参考答案与采分点】**：**（√）**（1 分）。狭义 DEM 仅指地表海拔高程，广义可推广至任意连续高度场。

### 25. 当数据集的偏度系数与峰度系数均等于 0 时，其分布形态为标准正态分布。（　）

> **【参考答案与采分点】**：**（√）**（1 分）。偏度管对称性、峰度管尖平程度，双零即标准正态分布。

### 26. 利用 Voronoi 图查找局部离群值时，熵值是专门用来度量相邻单元相似性的指标。（　）

> **【参考答案与采分点】**：**（×）**（1 分）。**熵值是度量相邻单元相异性的指标**，高熵值区代表与邻居差异显著的局部离群值。

### 27. 在专题地图符号配置中，各县总人口等原始绝对总量数据最适合直接采用等值区域图（分级设色）表示。（　）

> **【参考答案与采分点】**：**（×）**（1 分）。原始绝对总量受面积差异干扰大，**等值区域图应用于人口密度等派生比率数据**，绝对数据宜用分级符号图。

### 28. WebGIS 采用 B/S（浏览器/服务器）架构，浏览器充当“瘦客户端”，核心空间存储与复杂分析运算主要在服务器端执行。（　）

> **【参考答案与采分点】**：**（√）**（1 分）。瘦客户端仅负责发请求与结果展示，跨平台且免维护。

## 四、简答题（共 5 小题，每小题 6 分，共 30 分）

### 29. 简述空间数据的三层抽象模型，并比较对象、场、网络三种概念模型的特点。（6 分）

> **【参考答案与分步采分点】**：
> 1. **三层抽象模型与中介**（2 分）：由高到低依次为**概念模型**（最高层，面向人的语义抽象）、**逻辑模型**（中间层，表达实体及关系）和**物理模型**（最底层，磁盘存取机制）；**空间数据结构**是逻辑映射为物理的中间媒介。
> 2. **对象模型特点**（1.5 分）：将空间视为空域，把边界清晰的离散实体抽象为**点、线、面、体** 4 种基本对象，强调标识、属性与拓扑关系（如建筑、道路）。
> 3. **场模型特点**（1.5 分）：将连续现象视为空间变量函数 $A=f(x,y)$ 或 $f(x,y,z)$，常以格网、TIN 或样点表达（如高程、气温）。
> 4. **网络模型特点**（1 分）：由**结点与环链**构成通道系统（本质是对象模型特例），专门强调对象间通过路径流动的**交互作用**（如交通、管网）。

### 30. 什么是空间数据库？它有哪些特点？为什么通用 DBMS 难以直接管理空间数据？（6 分）

> **【参考答案与分步采分点】**：
> 1. **空间数据库定义**（1.5 分）：某区域内关于地理要素特征的数据集合，即 GIS 在存储介质上保存的与应用相关的空间数据总和。
> 2. **空间数据库四大特点**（1.5 分）：**数据量特别大、数据结构复杂、数据关系多样、数据应用广泛**。
> 3. **通用 DBMS 难以直接管理的四大原因**（3 分）：因空间数据具非结构化（变长坐标串）与复杂空间关系，通用 DBMS ① 不支持复杂图形显示；② 难直接执行关联、连通、叠加等空间操作；③ 单实体需多记录表达，一致性与安全难维护；④ 一般关系库仅适定长结构化记录。

### 31. 简述空间数据无缝组织的三种途径，以及空间数据库引擎（SDE）的用途和两种实现方式。（6 分）

> **【参考答案与分步采分点】**：
> 1. **几何无缝**（1.5 分）：统一分幅坐标框架并接边，使查询显示在**视觉和形式上连续**，但底层存储边界仍断续有缝。
> 2. **逻辑无缝**（1.5 分）：在几何无缝基础上对跨幅要素做**逻辑接边并建唯一标识与索引**，物理仍分块但逻辑上保证实体完整。
> 3. **物理无缝**（1 分）：在底层物理存储彻底打破图幅边界，连续存为一体，实现全透明访问。
> 4. **SDE 用途与两种实现方式**（2 分）：用途是**解决关系库中空间数据与 GIS 应用程序间的数据接口问题**；分为**中间件方式**（如 ArcSDE，可管复杂拓扑与几何网络）和**嵌入式方式**（如 Oracle Spatial，内置简单要素检索）。

### 32. 简述矢量网络分析的基本组成与四大应用，并说明基于规则格网 DEM 提取流域的主要步骤。（6 分）

> **【参考答案与分步采分点】**：
> 1. **矢量网络六大组成**（1.5 分）：由**站点、结点、拐角点、中心、链、障碍**六要素构成的带流动约束线网。
> 2. **矢量网络四大应用**（1.5 分）：**路径分析**（最短/最佳/动态）、**资源分配**（服务区划分）、**最佳选址**和**地址匹配**。
> 3. **流域定义与格网 DEM 提取四步**（3 分）：流域是分水线以内的地表集水区；格网提取步骤依次为：① **DEM 洼地填充**（防断流） $\to$ ② **水流方向确定**（如 D8 单流向） $\to$ ③ **汇流累积量计算** $\to$ ④ **河网与流域提取**。

### 33. 简述地理信息可视化的定义、三大特点与视觉变量分类，以及地理信息网络服务的四大内容。（6 分）

> **【参考答案与分步采分点】**：
> 1. **可视化定义与意义**（1.5 分）：依托计算机与多媒体动态直观表现和传输地理信息的技术，为认识和解释人地关系提供理性工具（支撑 ST-DIKW 转化）。
> 2. **可视化三大特点**（1.5 分）：**可视化过程的多样性、信息表达的动态性、信息表达载体的多维性**。
> 3. **视觉变量分类**（1.5 分）：分为**定量视觉变量**（大小、方向、透视高度、属性值、亮度）和**定性视觉变量**（形状、色调）。
> 4. **网络服务四大内容**（1.5 分）：**地理数据分发服务、制图服务、查询分析与辅助决策服务、基于位置的服务（LBS）**。

## 五、论述题（共 2 小题，每小题 15 分，共 30 分）

### 34. 论述 GIS 的定义、五大组成部分及各部分作用，并结合地理空间数学基础说明空间参考框架的工程意义。（15 分）

> **【参考答案与分步采分点】**：
>
> **总起定义**（2 分）：地理信息系统（GIS）是在计算机软硬件支持下采集、存储、管理、运算、分析与描述地理分布数据的技术系统，其一切定位与空间分析均须建立在严密的地理空间数学基础之上。
>
> 1. **维度一：GIS 五大组成部分及协同作用**（3 分）：由**计算机硬件系统、软件系统、空间数据、地学模型和应用人员**组成。软硬件提供算力平台，空间数据反映地理内容（工程占比最高），地学模型支撑分析决策，**应用人员是最关键和极具能动性的核心因素**。
> 2. **维度二：地球表面四类模型与椭球定位**（2.5 分）：地球几何模型依次为自然表面、大地水准面、地球椭球面和数学模型；椭球定位需短轴平行地球自转轴，分为局部吻合的**参考定位**（如西安 80）和全球吻合的**绝对定位**（如 WGS84）。
> 3. **维度三：高程基准体系与垂向统一**（2.5 分）：严格区分以大地水准面起算的**正高**、以似大地水准面起算的**正常高**（我国法定）和以椭球面起算的**大地高**（GNSS 测定），跨系统须转换统一。
> 4. **维度四：地图投影实质与变形权衡**（2.5 分）：因椭球面不可展，地图投影建立 $(B,L)$ 与 $(X,Y)$ 映射必然伴随长度、面积或角度变形，工程须按等角（地形图）、等面积（面积统计）或任意投影选型。
> 5. **维度五：空间坐标转换、尺度与地理格网**（2.5 分）：多源叠加前须经**投影转换**（跨椭球基准）或**单纯坐标值变换**（局部当前区）统一框架，并配合空间尺度/分辨率匹配与标准地理格网实现精准套合。

### 35. 从“数据采集质控 $\to$ 空间建库索引 $\to$ 空间统计挖掘 $\to$ 可视化与网络/LBS 服务”全链路论述 GIS 工程技术体系。（15 分）

> **【参考答案与分步采分点】**：
>
> **总起定义**（2 分）：现代 GIS 工程是一套贯穿数据全生命周期的闭环体系，打通采集质控、空间建库、统计挖掘到可视化与社会化网络服务的全链路价值转化。
>
> 1. **维度一：多源采集加工与全过程质量控制**（2.5 分）：遵循“数据源选择 $\to$ 采集方法 $\to$ 编辑处理 $\to$ 质控评价 $\to$ 入库”流程；执行几何纠正、**栅格重采样**（离散用最邻近、连续用双线性、影像用双三次）与数据重构，严控误差、准确度、偏差、精密度与不确定性，并配齐**元数据**支撑溯源与共享。
> 2. **维度二：空间数据库无缝组织与引擎索引**（3 分）：针对非结构化海量空间数据，采用**几何/逻辑/物理无缝组织**消除分幅割裂，借**空间数据库引擎**（中间件 ArcSDE 或嵌入式 Oracle Spatial）打通关系库接口，并以**MBR、格网、四叉树或 R/$\mathrm{R}^+$ 树空间索引**作图形“目录”加速查询。
> 3. **维度三：探索性统计与空间格局挖掘**（2.5 分）：结合集中/离散/偏峰度统计量及直方图、半变异云图（找整体离群值）与 Voronoi 图熵值（找局部离群值）探查数据，利用 **Moran's I** 判聚集性、**标准差椭圆**看方向趋势，借确定性/地统计空间插值与分区统计生成专题分布。
> 4. **维度四：地理信息可视化与符号配置**（2.5 分）：遵循可视化**过程多样性、表达动态性、载体多维性**三大特点，科学选用定量与定性视觉变量，严格区分“派生比率用等值区域图、绝对总量用分级符号图”。
> 5. **维度五：地理信息网络与 LBS 服务发布**（2.5 分）：形成**数据分发、在线制图、查询分析与辅助决策、基于位置的服务（LBS）** 四大服务体系；LBS 融合 GIS、定位与无线通信，面向大众与行业提供**查询、监控和导航**三类实时移动服务。</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
</body>
