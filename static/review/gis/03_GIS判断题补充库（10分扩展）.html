<script type="text/plain" id="md-raw"># 03 GIS 判断题补充库（10 分扩展）

> **补充库声明**：本篇为 `00` 圈画主库的同题型扩展补充库，已自动剔除 `00` 已收录核心考点（`00` 已覆盖 40 条标星判断），将原版 66 条命题排雷铁律、25 道真题变式易错点及易混概念对比全面转化为 **75 条**“一句话正误辨析”。
> **复习用法**：开启顶部 **「背诵自测模式」**，先自行判 `√ / ×`，再点击逐条揭晓纠错理由！

## 模块一：第 1～2 章 概论与地理空间数学基础（15 条）

* **01. 1963 年由 Goodchild 在加拿大主持建立的 CGIS 是世界第一个地理信息系统。**：**（×）** 1963 年加拿大 CGIS 的主持者是“GIS 之父”**Roger Tomlinson**；Goodchild 是 1992 年提出“地理信息科学（GISc）”的学者。
* **02. 在规范化 GIS 工程系统的总投资中，硬件、软件与空间数据三者的经验比重通常约为 7∶2∶1。**：**（×）** 恰好相反！空间数据采集建库成本最高，经验比重为**硬件∶软件∶空间数据 $\approx 1:2:7$**。
* **03. GIS 与 CAD 的本质区别在于 GIS 具备严密地理参考投影、拓扑关系和强大空间分析能力。**：**（√）** CAD 侧重局部笛卡尔无拓扑工程制图，缺乏地理坐标基准与空间分析建模能力。
* **04. 我国 1954 北京坐标系和 1980 西安坐标系均属于以地球质心为原点的地心坐标系。**：**（×）** 北京 54（克拉索夫斯基椭球）与西安 80（1975 国际椭球）均为区域**参心坐标系**；CGCS2000 与 WGS84 才是地心坐标系。
* **05. 我国现行 1985 国家高程基准的水准原点高程为 $72.260\ \mathrm{m}$，高于原 1956 黄海高程系的 $72.289\ \mathrm{m}$。**：**（×）** 数值关系说反！1985 国家高程基准原点为 $72.260\ \mathrm{m}$，**低于** 1956 黄海高程系的 $72.289\ \mathrm{m}$。
* **06. GNSS 卫星定位直接测得的高程是正常高，可直接当作我国法定海拔高程使用。**：**（×）** GNSS 直接测得的是至参考椭球面的**大地高**，需减去高程异常才能转为我国法定的**正常高**。
* **07. 高斯-克吕格投影属于横轴等角割圆柱投影，其中央子午线长度比例因子为 $0.9996$。**：**（×）** 混淆了高斯与 UTM！高斯投影是横轴等角**切**圆柱（中央经线变形比 $1$）；**UTM** 才是横轴等角**割**圆柱（比例因子 $0.9996$）。
* **08. 高斯-克吕格投影在同一经线上，长度变形随纬度降低而增大，在赤道处达到最大。**：**（√）** 同纬线上则随离中央子午线的经差增大而迅速增大，6° 带内最大长度变形 $\le 0.14\%$。
* **09. 我国基本比例尺地形图规定 1∶1 万比例尺采用 6° 分带，1∶2.5 万～1∶50 万采用 3° 分带。**：**（×）** 恰好颠倒！大比例尺 **1∶1 万采用 3° 分带**（精度更高），**1∶2.5 万～1∶50 万采用 6° 分带**。
* **10. 在我国陆地范围内，某点 8 位高斯横坐标 $Y = 20425800\ \mathrm{m}$，说明其位于 6° 带第 20 带、中央子午线以西 $74.2\ \mathrm{km}$。**：**（√）** 前两位 `20 <= 23` 判为 6° 带，$425800 - 500000 = -74200\ \mathrm{m}$，即中央经线以西 $74.2\ \mathrm{km}$。
* **11. 高斯 6° 带与 UTM 投影均按经差 6° 全球分 60 带，且两者同一地区的带号完全一致。**：**（×）** 高斯自 $0^\circ$ 起算，UTM 自 $180^\circ\mathrm{W}$ 起算，同一地区两者带号**相差 30 带**（如高斯 20 带对应 UTM 50N 带）。
* **12. 兰勃特（Lambert）正轴等角割圆锥投影在双标准纬线上无变形，适合中纬度东西延伸区域制图。**：**（√）** 我国 1∶100 万地形图及省级政区图常采用兰勃特等角投影。
* **13. 将北京 54 坐标系数据转换为 CGCS2000 坐标系时，只需在二维平面内做平移和旋转即可精确完成。**：**（×）** 跨不同椭球基准的转换必须在三维空间直角坐标下采用**布尔沙七参数模型**（3 平移 + 3 旋转 + 1 尺度）。
* **14. 在 GIS 软件中将一幅低分辨率栅格影像的显示比例尺不断放大，即可有效提高其真实空间信息精度。**：**（×）** 空间分辨率是数据固有的最小可辨单元尺寸，放大显示比例尺**绝不能增加真实信息精度**。
* **15. Web Mercator（网络墨卡托）投影可以完整无变形地投影包含南北极点在内的全球区域。**：**（×）** Web Mercator 在高纬度面积与长度极度放大，无法投影极点，通常截断于 $\pm 85.05^\circ$。

## 模块二：第 3～4 章 空间数据模型、拓扑与数据结构（16 条）

* **16. 九交模型（9IM）相比四交模型（4IM）增加了对象的外部点集，可精确区分二维简单面间的 8 种基本拓扑关系。**：**（√）** 9IM 为 $3\times 3$ 矩阵，理论 $2^9 = 512$ 种组合中具几何意义的二维简单面拓扑关系共 8 种。
* **17. 线性参照系统通过沿线状实体记录里程 $M$ 值，支持在不切分基础路网几何的前提下实现动态分段。**：**（√）** 避免了因路面材质、限速等属性分段而频繁打断路网拓扑几何。
* **18. 时空数据模型中，序列快照模型数据冗余最小，而基态修正模型冗余最大。**：**（×）** 恰好相反！**序列快照**每时点全量存图冗余极大；**基态修正**仅存初始基态与增量变化，存储高效。
* **19. 实体（面条）数据结构虽显式记录了全部拓扑关系，但相邻多边形的共享边界仍然会被重复存储。**：**（×）** 面条结构**不存储任何拓扑关系**，正因独立记录各多边形坐标串才导致共享边重复存储与缝隙重叠。
* **20. 链状双重独立编码结构将连续折线合并为弧段（链），有效克服了 DIME 结构对弯曲复杂折线表达臃肿的缺点。**：**（√）** 弧段仅记起止结点与左右面，中间坐标点串集中存放，消除公共边冗余。
* **21. 拓扑四表中的虚多边形 $P_0$ 代表图幅外部背景面，在单连通欧拉公式 $V - E + F = 2$ 检核时必须计入面数 $F$。**：**（√）** 若漏算外部背景面 $P_0$，单连通图将误算为 $V - E + F = 1$；若有 $k$ 个连通分支则为 $V - E + F = 1 + k$。
* **22. 矢量多边形转栅格赋值时，若需防止细长重要小地物被大片背景吞没，应优先选用重要性法或长度占优法。**：**（√）** 中心点法和面积占优法易遗漏面积占比小但意义重大的狭长要素。
* **23. 游程长度编码（RLE）的压缩率与图像斑块破碎复杂程度成正比，最适合剧烈连续变化的 DEM 数据。**：**（×）** RLE 压缩率与图面均质度正相关、与破碎度**反相关**，最适于大面积均质专题图，极不适于连续剧变 DEM。
* **24. 常规四叉树每个节点通常只需存储 2 个变量，因此比线性四叉树更节省内存空间。**：**（×）** **常规四叉树每节点需存 6 个变量**（1 父 + 4 子指针 + 1 值）；**线性四叉树**仅存叶节点 MD 码与值，存储量仅为常规的 $2\% \sim 25\%$。
* **25. Freeman 8 方向链码既记录多边形外部轮廓方向，也完整记录多边形内部的所有栅格像元值。**：**（×）** 链码仅追踪记录边界起点与 `0～7` 方向码串，**不存储区域内部像元**。
* **26. 将栅格数据转换为矢量线状要素时，必先经过 $3\times 3$ 窗口细化提取单像素骨架线，且细化过程必须保持原有拓扑连通性。**：**（√）** 细化后沿 8 邻域搜索追踪并拓扑化，避免宽线出现双边或断裂。
* **27. 在栅格线矢量化 8 邻域搜索追踪中，若中心前景像素的 8 邻域恰有 3 个及以上前景像元，则该像素应判为线端点。**：**（×）** 8 邻域判别规则：0 个为孤立点、**1 个为端点**、2 个为中间点、**$\ge 3$ 个为拓扑结点（分叉汇合点）**。
* **28. 构建影像金字塔能显著提升海量影像缩放浏览速度，且不会增加任何额外的磁盘存储空间。**：**（×）** 多分辨率降采样副本会额外增加约 **$1/3$** 的存储空间，属于“以空间换时间”的有损多尺度组织。
* **29. Voronoi 图（泰森多边形）中，每个多边形内部任意一点到其所属中心母点的距离都小于到其他所有母点的距离。**：**（√）** 泰森多边形是离散母点集最邻近影响域的精确几何剖分。
* **30. 在三维 GIS 数据结构中，八叉树适合表达城市建筑物的精细外观轮廓，而 B-rep 更适合表达地下非均质矿体内部属性。**：**（×）** 恰好颠倒！**八叉树**基于体素划分适合表达地下非均质地质体内部；**B-rep（边界表示法）** 适合精细三维建筑外观建模。
* **31. 矢栅一体化数据结构通过三级线性四叉树 `(M0, M1, M2)` 兼顾矢量高精度定位与栅格高效分析。**：**（√）** 三级格网依次对应粗格网、基本格网与细分格网，减少频繁矢栅转换失真。

---

## 模块三：第 5～6 章 空间数据库、索引与数据采集质控（14 条）

* **32. 空间数据检索普遍采用“空间索引粗过滤（MBR 包络交叠排除）→ 精密几何求交”两阶段策略。**：**（√）** 利用极简外接矩形预先筛除绝大多数无关目标，大幅降低磁盘 I/O 与几何求交开销。
* **33. R 树空间索引严禁同层兄弟节点的最小外接矩形（MBR）相互重叠，因此点查询只需遍历单条路径。**：**（×）** **R 树允许兄弟 MBR 重叠**、不拆分实体但点查询可能走多路径；**$\mathrm{R}^+$ 树**才强制严禁兄弟 MBR 重叠并支持单路径点查。
* **34. $\mathrm{R}^+$ 树索引因严禁兄弟节点矩形重叠，不会对跨越分解界线的空间实体进行拆分，故无存储冗余。**：**（×）** 恰好相反！为保证兄弟矩形不重叠，$\mathrm{R}^+$ 树**必须切分跨界实体并由多个叶节点冗余引用**。
* **35. 早期 ArcInfo 采用的“文件-关系数据库混合管理模式”在多用户并发控制与数据损坏恢复方面十分完善。**：**（×）** 图形与属性分离存储，仅靠 ID 关联，存在共享困难以及并发控制、一致性与故障恢复能力弱的明显缺陷。
* **36. 地理配准选取控制点时，只需将全部控制点集中在地图中央区域即可获得全图最优配准精度。**：**（×）** 控制点必须选取清晰明确的特征交点，且**均匀分布覆盖全图及四个边角**，防止边缘外推畸变。
* **37. 在线状矢量数据压缩算法中，道格拉斯-普克（Douglas-Peucker）法属于局部三点抽稀，不具备旋转和尺度不变性。**：**（×）** 道格拉斯-普克法通过连首末点求最大垂距递归分裂，具有**全局最优形态保真度及旋转、尺度不变性**。
* **38. 矢量数字化中，单条均质连续弧段中间出现只连接两条弧段的多余 2 度节点，在拓扑上称为悬挂结点。**：**（×）** 多余的 2 度连接点称为**伪结点（Pseudo Node）**；未闭合的孤立 1 度线端才称为**悬挂结点（Dangling Node）**。
* **39. 悬挂结点分为“欠头（未接上）”和“过头（伸出线外）”两种，会直接导致多边形无法自动构面或路网断头。**：**（√）** 修复时在容差内对过头自动裁剪（Trim）、对欠头延伸捕捉（Extend）。
* **40. 碎屑多边形主要产生于不同数据源边界微偏或未开启捕捉的共享边数字化，可通过设置模糊容差或按面积比合并消除。**：**（√）** 碎屑多边形会严重歪曲图斑个数和地类面积统计结果。
* **41. 不正规多边形（如边界呈“8”字形自相交）不会影响梯形法面积计算和质心提取的正确性。**：**（×）** 自相交折返会导致有向面积正负抵消甚至为负、质心跑出面外以及叠置算法崩溃。
* **42. 图幅拼接时只需完成几何接边消除边界错位即可，无需检查跨幅同一地物的属性编码是否一致。**：**（×）** 必须同时完成**几何接边**（消除几何裂缝，回缩 2～3 点防折角）和**逻辑接边**（统一编码属性并消融伪边界）。
* **43. 空间数据质量评价的五大核心指标是数据完整性、逻辑一致性、位置精度、时间精度和属性精度。**：**（√）** 评价途径分为针对成品抽检的直接评价和基于误差传播模型的间接评价。
* **44. 美国联邦地理数据委员会颁布的第二版 CSDGM 元数据标准共包含 7 个主要子集、3 个次要子集和 460 个元素。**：**（√）** 是国际地理空间元数据最具代表性的经典标准之一。
* **45. 纸质地图扫描后即可直接入库参与叠置分析，无需进行去噪、配准、矢量化和拓扑检查。**：**（×）** 扫描图须经去噪纠偏 → 二值化 → 细化追踪 → 地理配准 → 分层矢量化与拓扑纠错 → 挂接元数据后方可入库。

## 模块四：第 7～8 章 空间分析、网络与数字地形分析（16 条）

* **46. 矢量多边形面积采用梯形法计算，当多边形内部含有岛（空洞）时，总面积应等于外包多边形面积加上内岛面积。**：**（×）** 含内岛时应为**外包多边形面积减去内岛面积**（$S_{\text{总}} = S_{\text{外}} - \sum S_{\text{岛}}$）。
* **47. 利用水平射线法判断点是否在多边形内部时，若射线与多边形边界交点总数为偶数，则该点位于多边形内部。**：**（×）** 交点数为**奇数在多边形内部，偶数在多边形外部**（遇到顶点用半开区间规则避免重复计数）。
* **48. 矢量叠置分析中的“裁剪（Clip）”与“求交（Intersect）”输出完全相同，都会同时继承输入图层和叠加图层的全部属性字段。**：**（×）** **Intersect** 继承双方全部字段；**Clip** 仅裁切外形，**只保留源图层 $A$ 的原有属性，不附加裁剪层 $B$ 的属性**。
* **49. 在 SuperMap 矢量叠置中，“同一（Identity）”算子会完整保留源图层 $A$ 的全域范围，仅对与 $B$ 重叠的部分挂接 $B$ 属性。**：**（√）** SuperMap 中的“同一”即 ArcGIS 的标识叠加（Identity），非重叠区 $B$ 属性留空。
* **50. 在选址分析中，若要求新设施必须避开森林周围 $1000\ \mathrm{m}$ 禁建带，应优先使用“合并（Union）”算子实现避让排除。**：**（×）** 避让排除条件应用**擦除（Erase，$A - A\cap B$）** 算子从候选区中挖去禁建缓冲带。
* **51. 矢量线缓冲区端头仅支持圆头缓冲，且道路左右两侧的缓冲半径必须严格相等。**：**（×）** 线缓冲端头分**圆头**和**平头**，且可按属性字段设置**左右不等半径**或单侧缓冲。
* **52. 栅格窗口分析中，焦点统计（Focal）相邻窗口互不重叠具有降尺度聚合效果，而块统计（Block）逐格重叠移动保持细节。**：**（×）** 恰好颠倒！**Focal** 逐像元移动、窗口重叠保持细节；**Block** 互不重叠分块赋同值，具降尺度概括效果。
* **53. $3\times 3$ 窗口权重全取 $1/9$ 的卷积算子属于高通滤波，主要用于锐化凸显图像突变边缘。**：**（×）** 全 $1/9$ 均权（权和为 1）是**低通平滑滤波**，用于平滑去噪；中心正高权、四周负权才是高通滤波。
* **54. 网络分析中，“最佳路径分析”和“旅行商分析（TSP）”完全等价，都会自动调整中间必经站点的访问顺序。**：**（×）** **最佳路径（Dijkstra）严格按指定站点顺序**求解最小阻力路径；**TSP** 才自动重排无序多点的最优访问次序。
* **55. 数字高程模型（DEM）包含地面建筑物屋顶与森林树冠的顶部高程，而数字表面模型（DSM）只表达裸露地表高程。**：**（×）** 恰好颠倒！**DEM** 仅表达裸露地表高程，**DSM** 包含建筑物屋顶与树冠表层包络。
* **56. 构建不规则三角网（TIN）遵循的 Delaunay 三角剖分准则，要求生成的全部三角形边长必须严格相等。**：**（×）** TIN 边长随采样点疏密自适应变化；Delaunay 三准则为**最大化最小内角、空外接圆与唯一性**。
* **57. 比较 IDW、样条函数（Spline）和克里金（Kriging）三大插值法，计算速度最快且估值不会超出已知样本极值的是克里金法。**：**（×）** **IDW** 速度最快且估值严守样本极值区间（但易生“牛眼”）；**克里金**计算最慢但细节精度最优且能评估方差。
* **58. 地形曲率中，剖面曲率沿等高线方向控制径流的汇聚与发散，平面曲率沿最大坡降方向控制水流的加速与减速。**：**（×）** 恰好相反！**剖面曲率**沿最大坡降方向控水流加减速，**平面曲率**沿等高线方向控径流汇散。
* **59. 地表粗糙度定义为真实曲面面积与水平投影面积之比，可近似表示为坡度余弦的倒数 $R \approx 1/\cos S$，平坦地表 $R = 1$。**：**（√）** 坡度越大，地表粗糙度 $R$ 越大，反映地表起伏与破碎程度越高。
* **60. D8 单流向算法的流向栅格取值范围是 $0 \sim 7$，且计算对角邻域落差时无需考虑距离权重。**：**（×）** D8 流向码为 2 的幂次 **`1, 2, 4, 8, 16, 32, 64, 128`**（无 0,3,5,6,7），且对角高差**必须除以 $\sqrt{2}$**。
* **61. 在基于 DEM 的水文分析中，山脊线处的汇流累积量最大，而河谷沟道处的汇流累积量恒为 0。**：**（×）** 恰好相反！山脊线无上游来水，汇流累积量为 **`0`**；河谷沟道汇集大量上游像元，汇流累积量骤增达最大。

## 模块五：第 9～11 章 空间统计、可视化、网络 GIS 及上机实验（14 条）

* **62. Getis-Ord $G_i^*$ 局部热点分析中，显著正 $z$ 得分代表高值集聚“热点”，显著负 $z$ 得分代表低值集聚“冷点”。**：**（√）** 弥补了 Global Moran's I 无法直接区分高高聚类与低低聚类的不足。
* **63. 在半变异函数图中，若待插点到所有已知采样点的距离均大于变程（Range），说明空间相关性最强、插值精度最高。**：**（×）** 超出变程 $h > a$ 时半变异值达基台平稳，**空间相关性已消失**，不能用这些点进行有效内插。
* **64. 半变异函数的块金值（Nugget）反映了测量仪器误差和小于采样间距尺度的微观随机变异。**：**（√）** 基台值减去块金值所得的偏基台值则反映空间结构性变异。
* **65. 自然断裂法（Jenks）的分级目标是最大化类内方差、最小化类间方差。**：**（×）** 恰好相反！自然断裂法旨在**最大化类间差异、最小化类内差异**，使同类要素最相似。
* **66. 核密度估计（KDE）中，搜索半径（带宽）越大，生成的密度表面越宏观平滑；带宽越小则越凸显局部微观聚类。**：**（√）** 带宽选取直接决定核密度表面的平滑尺度。
* **67. 地理加权回归（GWR）通过将空间坐标嵌入回归系数，有效克服了经典全局回归（OLS）忽略空间非平稳性的缺陷。**：**（√）** GWR 可揭示同一自变量在不同地理位置的作用强度甚至方向差异。
* **68. 地理探测器（Geodetector）严格要求自变量满足正态分布和线性关系，无法直接处理定性类别因子。**：**（×）** 地理探测器**无需正态与线性假设、天然直接支持定性类别因子且免疫多重共线性**。
* **69. 在第 10 章三维符号选取规范中，对于 3 维要素的定量渲染最不推荐使用的视觉变量是“透视高度”。**：**（√）** 3 维要素自身已具真实高度几何，再用透视高度属于视觉冗余；2.5 维要素则不推荐定性及方向/形状变量。
* **70. 地形晕渲图中，斜照晕渲的宏观立体感最强，直照晕渲能准确体现坡度变化但缺乏立体感，综合晕渲兼顾二者。**：**（√）** 实际制图常将彩色 DEM 分层设色图以半透明（如 60%）叠盖于晕渲图之上。
* **71. B/S 模式（WebGIS）采用“瘦客户端”架构，核心空间存储与复杂分析计算主要运行在用户本地浏览器中。**：**（×）** 瘦客户端仅负责请求发送与结果展示，**核心存储与复杂 GIS 算法全部集中于服务器端**。
* **72. 若需远程获取未经渲染的原始高精度浮点型 DEM 高程矩阵并在本地计算坡度，应选用 OGC 的 WMS 服务接口。**：**（×）** WMS 只返回只读渲染图片；获取保留原始物理像元值的科学栅格必须选用 **WCS（网络覆盖服务）**，获取可编辑矢量则选 **WFS（WFS-T）**。
* **73. 在 SuperMap 上机实验中，只需在数据集属性面板修改“投影设置”，即可将 WGS84 数据重投影为目标投影坐标。**：**（×）** 修改属性中的“投影设置”仅更改元数据参考标签而不重算坐标，**必须执行“投影转换”** 才能真正完成数学重投影。
* **74. 在 SuperMap 矢量转栅格时，若结果像素格式误设为“4 位无符号整型”，则属性值为 20 的像元会被自动截断保存为 15。**：**（×）** 4 位像素仅存 $[0, 15]$，超界值（$20 > 15$）不会被截断为 15，而是被**统一强制置 `0`**！
* **75. SuperMap 中将 `.tif` 转为 `.ecw` 后体积骤减是因为采用了小波压缩，且减小矢栅转换的像元分辨率尺寸可明显改善锯齿。**：**（√）** 同时“追加行”要求两数据集几何类型必须一致，可视域观测总高 $=$ 地表高程 $+$ 附加高程。

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
