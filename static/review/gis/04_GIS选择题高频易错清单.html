> **适用课程与考纲**：山东理工大学（SDUT）《地理信息系统原理》期末冲刺（汤国安《地理信息系统教程（第二版）》全 11 章 + 韩芳老师第 1～8 章 PPT + 2026-2027 期中自测卷 + SuperMap 4 次上机实验）
> **试卷现状说明**：`2026-2027 学年第 1 学期《地理信息系统》期中测试试卷` 共 5 道主观简答与编码大题（**不含原生单选题**）。本清单首先将**期中 5 道真题全部核心采分点转化为高频单选陷阱解析**，随后按全书章节汇总**四大必背数字常数宽表、66 条命题排雷铁律与 25 道全真高仿真单选题**，助力客观题稳拿满分！

## 第一部分：期中真题 5 题核心考点拆解与客观题变式解析

| 期中真题原题 | 原题满分核心骨架 | 单选题最常见挖坑干扰选项 |
| :--- | :--- | :--- |
| **一、GIS 系统组成及各部分作用** | 硬件、软件、空间数据、地学/应用模型、人员；数据占成本主导（$1:2:7$），人员最活跃 | 混淆“**硬件∶软件∶数据 $= 1:2:7$**”比例；误把 CAD/DBMS 等同于 GIS（缺地理坐标、拓扑与空间分析）；漏掉**地学模型**或**人员** |
| **二、地图投影定义与按变形性质分类** | 按数学法则将不可展椭球面 $(B,L)$ 转为平面 $(x,y)$；变形性质分**等角（正形）、等面积、任意（含等距）**三类 | 混淆变形性质分类（如等角/等积/任意）与辅助投影面分类（方位/圆锥/圆柱）；误认为存在“同时等角又等面积”的地图投影 |
| **三、空间数据拓扑关系的意义** | 橡皮变换不变量（不随投影缩放改变）；消冗余与查拓扑错；加速邻接查询；重构多边形与网络路径 | 误认为“拓扑关系会随地图投影或比例尺放大改变”；把**邻接（同类）/关联（异类）/包含/连通**与**顺序/度量关系**混淆 |
| **四、矢量与栅格数据优缺点对比** | 矢量“定位明显、属性隐含”，精度高但叠置复杂；栅格“属性明显、定位隐含”，易代数与遥感融合但数据量大有锯齿 | 颠倒“**定位明显、属性隐含（矢量）**”与“**属性明显、定位隐含（栅格）**”；误认为多边形叠置在矢量下比栅格更简单 |
| **五、Freeman 8 方向链码编码** | 仅记边界起点与 `0～7` 方向序列（`0` 东、`2` 北、`4` 西、`6` 南），不存内部像元；原题 2 条要素：`6,5,6,5,6,7,7` 与 `4,5,5,6,7,0,1,2,2,2` | 误以为链码记录区域内部像元；误认为链码非常便于做区域叠置分析（实际**链码仅利边界周长、面积与拐角检测，区域叠置极其困难**） |

### 【期中真题改编客观题精练（5 题）】
1. **【真题一改编】** 在一个规范化 GIS 工程系统的总建设成本投资结构中，硬件、软件与空间数据三者的经验比重通常约为（ ）。
   - A. $7:2:1$ &emsp; B. $2:7:1$ &emsp; C. **$1:2:7$** &emsp; D. $3:3:4$
   - **解析**：选 **C**。第 6 章 PPT 明确给出工程成本构成经验比 `硬件∶软件∶数据 = 1∶2∶7`，数据采集与建库是成本最高、周期最长的环节。
2. **【真题二改编】** 下列关于地图投影变形性质的说法，**错误**的是（ ）。
   - A. 等角投影（正形投影）能保持微分图形相似且角度变形为零
   - B. 等面积投影平面面积与椭球面对应面积相等，适用于资源面积量算
   - C. **同一幅地图投影可以在全球范围内同时实现既等角又等面积**
   - D. 我国 1∶1 万～1∶50 万地形图统一采用横轴等角切圆柱的高斯-克吕格投影
   - **解析**：选 **C**。等角条件与等面积条件在几何上相互矛盾（除非仅在无变形点/线极小邻域），任何地图投影都不可能同时既等角又等面积。
3. **【真题三改编】** 下列空间关系中，经过不同的地图投影变换、比例尺缩放和仿射拉伸后**仍保持绝对不变**的是（ ）。
   - A. 两地之间的欧氏直线距离 &emsp; B. 两点之间的正北方位角 &emsp; C. 多边形的面积与周长 &emsp; D. **相邻多边形的拓扑邻接与包含关系**
   - **解析**：选 **D**。度量关系（距离、面积）和顺序方位关系均随投影变换和缩放发生改变，唯有**拓扑空间关系**（“绘在橡皮上的几何关系”）在连续变形下保持绝对不变。
4. **【真题四改编】** 在空间数据结构中，具有“**属性明显、定位隐含**”鲜明特征，且每一个存储单元通常只能记录单一属性的数据结构是（ ）。
   - A. DIME 拓扑数据结构 &emsp; B. 链状双重独立编码 &emsp; C. **规则栅格数据结构** &emsp; D. 实体（面条）数据结构
   - **解析**：选 **C**。栅格阵列直接存储属性值，空间位置根据像元行列号和左上角坐标推算而得，即“属性明显、定位隐含”；矢量则相反，为“定位明显、属性隐含”。
5. **【真题五改编】** 已知一闭合多边形边界采用标准 Freeman 8 方向链码（`0` 东、`1` 东北、`2` 北、`3` 西北、`4` 西、`5` 西南、`6` 南、`7` 东南）编码为 `4, 5, 5, 6, 7, 0, 1, 2, 2, 2`，关于链码数据结构的特点，下列说法正确的是（ ）。
   - A. 链码需要重复记录多边形内部的所有像元值
   - B. **链码压缩率接近矢量结构，且非常方便计算边界周长与检测急弯拐角**
   - C. 链码特别适合直接执行多图层区域叠置分析
   - D. 局部边界修改不会影响链码后续记录结构
   - **解析**：选 **B**。链码只存外轮廓方向码（不存内部像元），对周长、凹凸度、急弯识别极其便利，但区域叠置很困难且相邻共享边界存在重复存储冗余、局部修改影响链串后续结构。

## 第二部分：考前必背四大“数字常数与分类”秒杀宽表

### 总表 1：地球参考系、高斯/UTM 投影分带与国家基本比例尺地形图常数表（第 1～2 章）

| 考点条目 | 考场必背标准数字 / 公式 / 规律 | 单选题高频干扰项排雷 |
| :--- | :--- | :--- |
| **世界首个 GIS 诞生标志** | **1963 年**，加拿大 **Roger Tomlinson** 主持建立 **CGIS** | 勿与 1992 年 Goodchild 提出“地理信息科学（GISc）”混淆 |
| **我国三大参考椭球与基准** | **北京 54**：克拉索夫斯基椭球（参心，原点前苏联普尔科沃）；**西安 80**：1975 国际椭球（参心，原点陕西泾阳永乐镇）；**CGCS2000 / WGS84**：地心系（原点地球质心，CGCS2000 扁率 $1/298.257222101$，WGS84 $1/298.257223563$） | 现代全球基准（CGCS2000/WGS84）椭球中心与地球质心重合；前两者属区域参心系，不可不经转换混用 |
| **我国高程基准水准原点** | **1956 黄海高程系**：$72.289\ \mathrm{m}$；**1985 国家高程基准**（1952～1979 青岛大港验潮）：**$72.260\ \mathrm{m}$** | 卫星 GNSS 直接测得的是**大地高**（至参考椭球面），我国法定地形高程为**正常高**（至似大地水准面） |
| **高斯-克吕格 6° 分带** | 起始经线 **$0^\circ$**，全球 **$60$** 带；中央经线 **$L_0 = 6n - 3^\circ$**；我国处于 **13～23 带**；最大长度变形 $\le 0.14\%$；适用 **1∶2.5 万～1∶50 万** | 给经度求带号 $n = \lfloor L/6^\circ \rfloor + 1$（如 $118^\circ\mathrm{E} \to 20$ 带，$L_0 = 117^\circ$）；切圆柱投影中央子午线变形比为 **$1$** |
| **高斯-克吕格 3° 分带** | 起始经线 **$1.5^\circ$**，全球 **$120$** 带；中央经线 **$L_0 = 3n$**；我国处于 **24～45 带**；适用 **1∶1 万**（及更大比例尺） | 如 $118^\circ\mathrm{E}$ 对应 3° 带 $n = \operatorname{round}(118/3) = 39$ 带，$L_0 = 117^\circ$ |
| **高斯 8 位 $Y$ 坐标判带法** | 纵轴西移 **$500\ \mathrm{km}$** + 前置 2 位带号；我国陆地 8 位坐标前两位 **$\le 23$ 为 6° 带，$\ge 24$ 为 3° 带** | 若 $Y$ 坐标仅 6 位（非 8 位），说明**不含带号**（如 `576000` 为脱带坐标，真实距中央经线东 $+76\ \mathrm{km}$） |
| **UTM 投影关键常数** | **横轴等角割圆柱投影**；中央子午线比例因子 **$0.9996$**；6° 带最大变形 $\le 0.04\%$；适用 **$80^\circ\mathrm{S} \sim 84^\circ\mathrm{N}$**；从 **$180^\circ\mathrm{W}$** 起向东分 60 带（第 1 带中央经线 $177^\circ\mathrm{W}$） | UTM 带号自 $180^\circ\mathrm{W}$ 起算，高斯带号自 $0^\circ$ 起算，相差 **30 带**（如我国某地高斯 6° 带 20 带对应 UTM 50N 带） |
| **国家 7 种基本比例尺** | **1∶100 万、1∶50 万、1∶25 万、1∶10 万、1∶5 万、1∶2.5 万、1∶1 万**（另扩展 1∶5000）；新图号共 **10 位** | 我国 1∶100 万分幅均为**经差 $6^\circ$、纬差 $4^\circ$**（高纬 $60^\circ\sim 76^\circ$ 经差 $12^\circ$，$76^\circ\sim 88^\circ$ 经差 $24^\circ$） |

### 总表 2：空间关系、数据结构与实验高精度数字常数表（第 3～8 章 + 实验）

| 考点条目 | 考场必背标准数字 / 公式 | 单选题高频干扰项排雷 |
| :--- | :--- | :--- |
| **九交模型（9IM）维数与拓扑数** | $3\times 3$ 交集矩阵（内部/边界/外部）；理论 $2^9 = \mathbf{512}$ 种；简单面与面可实际区分 **8 种**拓扑关系 | 4IM 为 $2\times 2$（缺外部 $A^-$）；9IM 下点-点仅 **2** 种（相离、重合），点-面 **3** 种（相离、相邻、包含） |
| **四叉树深度、节点与变量数** | 图像尺寸 $2^n \times 2^n$ 时树最大深度为 **$n$**；满四叉树总节点数 $= \sum_{k=0}^n 4^k = \dfrac{4^{n+1}-1}{3}$ | **常规四叉树每节点 6 个变量**（1 父 + 4 子 + 1 值）；**线性四叉树仅存叶节点，存储占常规 $2\% \sim 25\%$** |
| **Freeman 链码与 D8 流向编码** | Freeman：8 方向 **`0～7`**；D8 流向：**`2^0 ~ 2^7`**（`1, 2, 4, 8, 16, 32, 64, 128` 东起顺时针） | D8 **不出现 `0, 3, 5, 6, 7` 等非 2 次幂数**；计算对角权落差必须除以 **$\sqrt{2} \approx 1.414$** |
| **矢量拓扑检核欧拉公式** | 单连通平面图 **$V - E + F = 2$**；$k$ 个连通分支时 **$V - E + F = 1 + k$** | **面数 $F$ 极易漏掉外部虚多边形 $P_0$**（只算内部面会少 1，错成 $V-E+F=1$） |
| **瓦片尺寸、细化矩阵与 CSDGM** | 瓦片常规 **$256\times 256$** 或 $512\times 512$ 像素；栅格细化 $3\times 3$ 窗口共 $2^8 = \mathbf{256}$ 种邻域态（旋转去重为 51 种）；FGDC 元数据 **7 主 3 次共 460 元素** | 矢量化线追踪 8 邻域判别：1 个前景像元=**端点**、$\ge 3$ 个=**结点**、0 个=**孤立点** |
| **SuperMap 实验硬性数值门槛** | 线性配准至少 **4 个**控制点；多项式配准实验要求 **$\ge 10$ 个**，中误差调至 **$< 1$**；**4 位像素格式**存储区间 **$[0, 15]$**（越界 20 归 0）；构网节点容限 `2.0` | 线/面图形数字化必须开**捕捉（Snapping）**防止缝隙重叠；实验 3D 晕渲透明叠加设 **60% 不透明度** |

### 总表 3：Bertin / 教材视觉变量分类与几何要素符号选取表（第 10 章重点）

| 要素维度 | 视觉变量分类体系（教材标准） | 定性表达（类型差异） | 定量表达（数量大小/等级） | 禁忌与核心制图规则 |
| :--- | :--- | :--- | :--- | :--- |
| **视觉变量总纲** | **定性**：形状、色调；**定量**：大小、方向、透视高度、属性值、亮度、饱和度 | 形状（强隐喻）、色调（分类首选） | 大小、亮度、饱和度、属性值（深浅）、透视高度、方向 | **字体**也可充当变量：字样/颜色/斜体表定性，字号/粗细表定量 |
| **点要素** | 0 维符号（居中或点描法） | 首选：**色调、形状**；次选：方向 | 首选：**大小、值、亮度**；次选：透视高度 | 点注记习惯置于符号**右上方** |
| **线要素** | 1 维带状或线性符号 | 首选：**色调、形状** | 首选：**大小（线宽）**；次选：透视高度、值、亮度 | 线注记呈条块状**平行于要素走向**；水系用斜体 |
| **面要素** | 2 维填充/轮廓符号 | 首选：**色调、形状**；次选：方向 | 首选：**值、亮度、饱和度、大小** | **派生比率数据（如人口密度）用等值区域图；绝对总量用分级符号/统计图** |
| **2.5 维要素** | 连续表面高程/透视柱 | **不推荐定性变量**（不推荐形状/方向） | 首选：**透视高度、亮度、值**；次选：饱和度 | — |
| **3 维要素** | 立体体块模型 | 首选：**方向、形状**；次选：色调 | 首选：**亮度、值、饱和度**；次选：大小 | **不推荐使用“透视高度”渲染 3 维要素**（重复冗余）；需配合 **LOD** 优化帧率 |

### 总表 4：OGC 标准服务与网络 GIS 架构速查表（第 11 章重点）

| 服务 / 模式标准 | 核心定义与传输内容 | 关键区分标志 |
| :--- | :--- | :--- |
| **WMS**（网络地图服务） | 返回服务端渲染完毕的**静态地图图像**（PNG/JPEG） | 只读展示图片，无法获取矢量坐标与属性表进行几何分析 |
| **WMTS**（地图瓦片服务） | 返回服务端预先切好的**固定层级静态栅格瓦片** | 牺牲动态定制灵活性以换取互联网极高并发秒开性能 |
| **WFS**（网络要素服务） | 返回**矢量几何坐标与属性表**（GML / GeoJSON） | **支持要素查询、下载与在线事务级几何属性编辑（WFS-T）** |
| **WCS**（网络覆盖服务） | 返回**原始未渲染科学数值栅格**（多波段影像、DEM） | **保留原始高程/光谱物理像元值**，可供客户端作代数与地形计算 |
| **WPS / CSW / GML** | **WPS**（在线空间处理算子）、**CSW**（目录元数据检索）、**GML**（基于 XML 的地理数据编码传输语言） | Web Service 三大底盘协议：**SOAP（调用）、WSDL（描述）、UDDI（发布发现）** |
| **C/S vs B/S vs Grid** | **C/S**：专用胖客户端、响应快维护差；**B/S（WebGIS）**：浏览器**瘦客户端**、跨平台免维护；**Grid GIS**：网格算力整合实现 **4A（Anyevent/Anytime/Anywhere/Anyone）** | **LBS 三类业务**：位置查询、轨迹监控、实时导航 |

## 第三部分：全书第 1～11 章 + SuperMap 实验高频扫雷（66 条判断铁律）

### 一、第 1～2 章：概论与空间数学基础（14 条）
1. 地理信息区别于其它信息的最显著标志是**空间定位特征**（关联坐标）。
2. GIS 区别于 CAD 的本质在于 GIS 具备**严密地理参考投影、拓扑关系与复杂空间分析能力**；区别于 DBMS 在于管理空间几何与空间分析。
3. 中国 GIS 奠基人（提出“3S”系统与研发吉奥之星）：陈述彭 / 王之卓 / 李德仁等（PPT 专页：李德仁提出 3S，超图创始人钟耳顺等）；世界首个 GIS 为 1963 年加拿大 CGIS。
4. 工程投资分配经验铁律：硬件∶软件∶空间数据 $= 1:2:7$。
5. 大地水准面是**物理重力等位面**（正高起算面，围成大地体）；参考椭球是**规则几何数学面**（大地高起算面）；似大地水准面是正常高起算面。
6. 我国 **1985 国家高程基准**水准原点高程为 **$72.260\ \mathrm{m}$**，采用 1952～1979 年青岛大港验潮资料；1956 黄海高程系原点为 $72.289\ \mathrm{m}$。
7. 1954 北京采用**克拉索夫斯基椭球**（参心），1980 西安采用 **1975 国际椭球**（参心，陕西泾阳大地原点），CGCS2000 与 WGS84 均为**地心坐标系**。
8. 高斯投影是**横轴等角切圆柱投影**（中央经线变形比 $1$）；UTM 是**横轴等角割圆柱投影**（中央经线比例因子 $0.9996$）；兰勃特是**正轴等角割圆锥投影**（双标准纬线无变形，适合中纬度东西延伸区）。
9. 高斯投影在同一经线上，长度变形**随纬度降低而增大，在赤道最大**；同一纬线上，随经差增加而迅速增大。
10. 我国地形图规定 **1∶2.5 万～1∶50 万**采用 **6° 带**（$L_0 = 6n-3^\circ$，13～23 带），**1∶1 万**采用 **3° 带**（$L_0 = 3n$，24～45 带）。
11. 在我国陆地范围内，8 位高斯横坐标前两位**$\le 23$ 必为 6° 带、$\ge 24$ 必为 3° 带**；不足 8 位则说明未带带号；脱带真实坐标需将 $Y$ 减去 $500\ \mathrm{km}$。
12. 跨椭球基准转换（如北京 54 转 CGCS2000）必须在三维空间直角坐标 $(X,Y,Z)$ 下采用**布尔沙七参数模型**（3 平移+3 旋转+1 尺度），不可直接在平面 $(x, y)$ 下只做平移旋转。
13. 空间分辨率指栅格像元对应的地面实际线性尺度（$5\ \mathrm{m}$ 比 $30\ \mathrm{m}$ 分辨率高）；放大低分辨率图幅的显示比例尺**绝不能增加真实信息精度**。
14. 我国国家基本比例尺地形图有 **7 种**核心系列，1∶100 万行号自赤道向两极按 $4^\circ$ 用 `A~V`（22 行），列号自 $180^\circ$ 向东按 $6^\circ$ 用 `1~60`（60 列），子比例尺采用 **10 位行列新图号**。

### 二、第 3～4 章：空间数据模型与空间数据结构（14 条）
15. 空间实体具备**空间位置、属性、时间与空间关系**四大特征；空间抽象由高到低为**概念模型 $\to$ 逻辑模型 $\to$ 物理模型**，数据结构处于逻辑向物理映射之间。
16. **对象模型**适合边界清晰的离散要素（建筑、道路、湖泊、宗地），**场模型**适合连续变化属性 $A=f(x,y)$（高程、温度、大气污染）；**网络模型**实为强连通通道化的对象模型特例。
17. **拓扑关系**是“橡皮变形”不变量（不随投影、旋转、缩放改变）；**顺序（方位）关系和度量（距离）关系**随投影与几何变换而改变，故 GIS 通常不显式存储。
18. 拓扑关系分四类：**邻接**（同类间）、**关联**（异类间如结点-弧段）、**包含**（面与内岛）、**连通**（弧段间）。
19. 9IM（九交模型）比 4IM 多引入了**外部点集 $A^-$**，构成 $3\times 3$ 矩阵，可精确分辨二维简单面间的 **8 种**拓扑谓词（相离、相接、交叠、相等、包含、覆盖、被包含、被覆盖）。
20. **面条（实体）数据结构**无拓扑，共享边重复存储易产生缝隙重叠；**DIME** 以直线段联结两结点与左右面；**链状双重独立编码**（Coverage）将折线合并为弧段，克服曲线存储笨重缺点。
21. 拓扑四表中弧段带**负号**常表示该面域内部含**岛（空洞）**，或弧段反向引用；虚多边形 **$P_0$** 代表图幅外部背景面。
22. 矢量结构特点：**定位明显、属性隐含**；栅格结构特点：**属性明显、定位隐含**，且每个像元只存单个属性值。
23. 矢量转栅格赋值时，细长重要小地物易被周围大背景吞没应优先用**重要性法或长度占优法**，大面积地类分类常用**中心点法或面积占优法**。
24. 游程长度编码（RLE）压缩效率与图斑简单程度成正比、与变化碎杂度成反比；最适于大面积均质专题图，不适合连续剧变 DEM。
25. 常规四叉树每个节点须存 **6 个变量**（父指针、4 子指针、属性值）；线性四叉树丢弃非叶节点只存叶节点 **十进制 Morton（MD）码 + 属性值**，存储空间仅为常规的 $2\% \sim 25\%$。
26. 栅格转矢量处理线要素必经**“$3\times 3$ 窗口细化（保持拓扑连通提取单像素骨架线） $\to$ 8 邻域搜索跟踪 $\to$ 拓扑化”**三步；而面要素矢量化只需直接跟踪内外轮廓边界。
27. **影像金字塔**与**瓦片金字塔**虽加快显示但属**有损/多尺度冗余组织**，增加约 $1/3$ 额外空间存储多层降采样副本。
28. **八叉树**沿 $X,Y,Z$ 三轴八等分体素适合非均质地下地质体表达；**三维边界表示法（B-rep）**通过点-边-面精确边界围合体，适合城市三维建筑外观建模。

### 三、第 5～6 章：空间数据库与数据采集处理（12 条）
29. 空间数据库之所以难于直接套用传统关系表，根源在于**空间实体变长非结构化（顶点数量不定）**及复杂拓扑。
30. 早期 ArcInfo 采用**文件-关系混合管理**（文件存图形、RDBMS 存属性）；现代 **ArcSDE（中间件）**可存复杂拓扑与几何网络，而**Oracle Spatial（嵌入式）**擅长简单要素 SQL 检索但原生不支持复杂拓扑网。
31. **空间无缝组织**分三种实现：**几何无缝**（投影统一并精确接边）、**逻辑无缝**（物理分块、索引动态视图拼接）、**物理无缝**（打散图廓统一连续入库）。
32. 空间检索必经**“空间索引粗过滤（基于 MBR 包络外接矩形交叠排除）$\to$ 精密几何求交”**两阶段。
33. **R 树**允许同层兄弟节点 MBR 重叠、对象不拆分、检索可能多路径；**$\mathrm{R}^+$ 树**强制兄弟节点 MBR 互不重叠、跨越边界对象切分多叶引用、点查询仅走单路径极快。
34. 地理配准中线性配准至少需 **4 个**控制点，多项式拟合需更多点（SuperMap 实验要求 $\ge 10$ 点），控制点须选**特征明确交点且均匀覆盖全图四角**。
35. 遥感分类专题图重采样**只能用最邻近法**（严禁使用双线性/双三次内插，否则会产生不存在的中间混合类别编号！）。
36. 矢量线压缩算法中，**道格拉斯-普克（Douglas-Peucker）法**按曲线首末连线最大垂距与阈值 $L$ 比较递归分裂，形态保真最好且具旋转缩放不变性。
37. 常见四类拓扑错误：**伪结点**（冗余 2 度连接点）、**悬挂结点**（过头/欠头导致构面失败或路网断头）、**碎屑多边形**（公用边微偏狭长伪面）、**不正规多边形**（自相交 8 字形或逆序）。
38. 图幅拼接须同时做**几何接边**（回缩边缘 2～3 点容差对齐防突变折角）与**逻辑接边**（统一编码属性并消融公共伪边界）。
39. 空间数据质量五大核心评价指标：**完整性、逻辑一致性、位置精度、时间精度、属性精度**；精度（Accuracy，近真值度）不可混同于精密度（Precision，重复离散度）。
40. 扫描数字化结果一般须经历“去噪纠偏 $\to$ 二值化 $\to$ 细化追踪 $\to$ 地理配准 $\to$ 分层矢量化与拓扑纠错 $\to$ 挂接元数据入库（FGDC CSDGM 7 主 3 次 460 元素）”。

### 四、第 7～8 章：空间分析与数字地形分析（12 条）
41. 矢量多边形面积采用**梯形法**（含内岛则外减内），判断点在多边形内常用 **MBR 排除 + 射线法**（交点奇数在内、偶数在外）。
42. 矢量多边形叠置分析严格执行三步：**几何求交（打断生成新结点） $\to$ 拓扑重构 $\to$ 属性传递**；必须设置模糊容差剔除沿共用边界产生的**碎屑多边形**。
43. **Intersect（$A\cap B$）**同时继承双方全部字段；**Clip（裁剪）**虽截取共同外形但**仅保留被裁剪源图层 $A$ 原属性**；**Erase（$A - A\cap B$）**专用于避让排除条件；**Identity（标识/SuperMap 同一）**保留 $A$ 全域并在交区挂接 $B$ 属性。
44. 矢量缓冲区中，线缓冲分**圆头缓冲**与**平头缓冲**，并可依字段设**左右不等半径**；面缓冲分内缓冲、外缓冲与内外缓冲；多要素缓冲常需融合消除自叠。
45. 窗口分析中**Focal 统计**逐像元移动窗口（窗口相互重叠，保分辨率），**Block 统计**按不重叠块聚合赋值；**低通滤波**（全 $1/9$ 均权）消除噪点平滑，**高通滤波**增强陡变边缘。
46. 网络分析构建拓扑网络前须做线拓扑处理并设节点容限；**最佳路径（Dijkstra）**按既定站点访问顺序算最短路，**旅行商（TSP）**会自动优化多站点的最优访问排序。
47. **DEM** 只表达裸露地表高程 $H=f(x,y)$，**DSM** 包含树冠建筑物屋顶表层，**DTM** 涵盖坡度、水文、土地利用等广义地面信息。
48. **Delaunay 三角剖分**满足三大唯一与最优准则：最大化最小内角（近正三角形）、**空外接圆**（外接圆内不含第四点）、非四点共圆时网络唯一。
49. 第 8 章 PPT 对三大插值法性能排序：**速度最快** IDW $>$ Spline $>$ Kriging；**细节最好** Kriging $>$ Spline $>$ IDW；**最光滑** IDW 最差而 Spline/Kriging 光滑；**整体精度** Spline / Kriging 高于 IDW；**对异常值最敏感**的是 IDW。
50. **坡度**为切面与水平面夹角（法线与铅垂线夹角，范围 $[0^\circ, 90^\circ]$）；**坡向**为最陡下坡投影自正北顺时针方位角（$[0^\circ, 360^\circ)$，北半球南坡为阳坡）。
51. **剖面曲率**沿最大坡降方向控制水流加减速，**平面曲率**沿等高线方向控制径流汇聚或发散；**地表粗糙度 $R = S_{\text{曲面}}/S_{\text{水平}} \approx 1/\cos S$**（平地 $R = 1$）。
52. **D8 水文流向提取前提是必须先“洼地填充（Fill Sinks）”**；流向判定比较中心向 8 邻域的距离权落差（对角高差除以 **$\sqrt{2}$**），流向码仅取 `1,2,4,8,16,32,64,128`。

### 五、第 9～11 章及 SuperMap 上机实验（14 条）
53. 探索性数据分析（ESDA）中使用**正态 QQ 图**检验克里金插值前数据是否服从正态分布；半变异图用于诊断距离相关性与异常点。
54. **Global Moran's I** 显著大于 0 为空间正聚集，小于 0 为负离散，近期望 $-1/(n-1)$ 为随机；**Getis-Ord $G_i^*$** 专门区分高值集聚**热点（正 $z$）**与低值集聚**冷点（负 $z$）**。
55. 半变异函数四参数：**块金值**反映测量误差与亚尺度微变异，**基台值**是趋稳总变异上限，**偏基台值 $=$ 基台 $-$ 块金**，**变程**是空间自相关作用上限距离（超出不可插值）。
56. **IDW** 预测值绝对不会超出已知采样点的最大值和最小值，孤立极值点周围易产生**“牛眼”状**；**样条函数**在突变崖边可能外推出超过样本极值的值。
57. **自然断裂法（Jenks）**通过最大化类间差异、最小化类内差异实现偏态数据的最佳自然分段；**核密度（KDE）**带宽越大表面越宏观平滑。
58. **GWR（地理加权回归）**允许回归系数随空间位置变化克服**空间非平稳性**（对比全局 OLS）；**地理探测器**通过 $q$ 值测度分异性，无需正态/线性假设且直接兼容定性类型数据。
59. **等值区域（分级设色）面图**必须用于面积归一化的**派生比率数据（如人口密度）**；原始**绝对总量数据（如总人口）**只能用分级符号图或点值法，否则大面积行政区会产生视觉欺骗。
60. 地图图面配置原则：主图放**光学中心**（几何中心偏上）；点名放右上、线名沿走向、面名居中，**水系用斜体、政区用粗体**；非正北向地图**必须加指北针**。
61. **斜照晕渲**立体感最强但阴坡难辨坡度，**直照晕渲**准确体现坡度但缺乏立体感，**综合晕渲**兼顾二者；SuperMap 实验 3D 常设 DEM 专题图 **60% 不透明度**叠盖晕渲图。
62. **B/S 模式（WebGIS）**采用**瘦客户端**（浏览器只管请求与呈现，复杂计算全留服务端）；**Grid GIS** 实现任何源/时/地/人的 **“4A”**服务目标。
63. **OGC 标准区分**：`WMS`=动态地图图片、`WMTS`=静态预切瓦片、`WFS`=矢量要素（含 `WFS-T` 编辑）、`WCS`=原始科学数值栅格、`WPS`=在线分析算子、`GML`=XML 空间编码。
64. **SuperMap 实验 1 铁律**：在数据集属性界面修改“投影设置”只改参考标签不改坐标数据；必须执行**投影转换**才能真正把 WGS84 数据重投影为 Sinusoidal 等目标投影。
65. **SuperMap 实验 2 & 3A 铁律**：`.tif` 转 `.ecw` 体积骤减因为 ECW 采用高效小波压缩；矢量转栅格设 **4 位像素格式**时仅能存 $[0, 15]$，越界值 $20$ 会直接归 $0$；缩小像元分辨率尺寸可改善矢栅转换锯齿。
66. **SuperMap 实验 3B～4 铁律**：`追加行`要求两数据集几何类型必须相同；路网分析构网容限设 `2.0`；刘庄村地类提取除`裁剪（Clip）`外也可用`求交（Intersect）`；可视域观测高程 $=$ 地表高程 $+$ 附加高程；实验 4B 三维淹没（$3000\ \mathrm{m}$）与飞行（`.fpf` 路径高度 $5000\ \mathrm{m}$）须在平面/球面场景窗口操作。

## 第四部分：期末全真高仿真单选题演练（25 题含逐项排雷）

1. **我国 1∶1 万比例尺地形图采用的高斯-克吕格投影分带方式及全球总带数分别是（ ）。**
   - A. 6° 分带，60 带 &emsp; B. 6° 分带，120 带 &emsp; **C. 3° 分带，120 带** &emsp; D. 3° 分带，60 带
   - **解析**：选 **C**。我国规定 1∶2.5 万～1∶50 万用 6° 带（60 带），1∶1 万及更大比例尺用 3° 带（120 带）。
2. **某点 6° 带高斯平面坐标 $Y = 20425800\ \mathrm{m}$，则该点所在带号、中央子午线经度及真实相对中央子午线横坐标分别是（ ）。**
   - A. 20 带，$120^\circ\mathrm{E}$，偏西 $74.2\ \mathrm{km}$ &emsp; **B. 20 带，$117^\circ\mathrm{E}$，偏西 $74.2\ \mathrm{km}$** &emsp; C. 20 带，$117^\circ\mathrm{E}$，偏东 $425.8\ \mathrm{km}$ &emsp; D. 42 带，$126^\circ\mathrm{E}$，偏西 $74.2\ \mathrm{km}$
   - **解析**：选 **B**。前两位 `20 <= 23` 判为 6° 带第 20 带，$L_0 = 6 \times 20 - 3^\circ = 117^\circ\mathrm{E}$；去掉带号得 $425800\ \mathrm{m}$，再减伪偏移 $500000\ \mathrm{m}$ 得 $-74200\ \mathrm{m}$（中央子午线以西 $74.2\ \mathrm{km}$）。
3. **UTM 投影与高斯-克吕格投影在几何构型与变形上的最大区别在于（ ）。**
   - A. UTM 是等面积投影而高斯是等角投影 &emsp; **B. UTM 是横轴等角割圆柱投影，中央经线比例因子为 $0.9996$** &emsp; C. UTM 不采用 6° 分带 &emsp; D. UTM 中央经线无任何长度变形
   - **解析**：选 **B**。高斯是横轴等角**切**圆柱（中央经线比 $1$），UTM 是横轴等角**割**圆柱（中央经线比 $0.9996$，带内最大变形降至 $0.04\%$）。
4. **在空间抽象与数据模型中，关于概念模型、逻辑模型、物理模型与数据结构的关系，正确的是（ ）。**
   - A. 物理模型是最抽象层，直接对应 E-R 语义设计 &emsp; **B. 数据结构是逻辑模型向物理模型映射的中间媒介** &emsp; C. 场模型只能用矢量结构表达 &emsp; D. 对象模型最适合表达连续分布的地表温度
   - **解析**：选 **B**。三层抽象自顶向下为概念 $\to$ 逻辑 $\to$ 物理，数据结构衔接逻辑模型与磁盘物理实现。
5. **在 Egenhofer 提出的九交模型（9IM）中，两个二维简单面对象之间理论上可区分的具有几何意义的拓扑关系共有（ ）种。**
   - A. 4 &emsp; **B. 8** &emsp; C. 16 &emsp; D. 512
   - **解析**：选 **B**。$3\times 3$ 布尔矩阵共有 $2^9 = 512$ 种理论矩阵，排除三维几何不可行组合后，二维简单面间实际可区分 8 种标准拓扑关系。
6. **下列空间数据结构中，通过引入“弧段”记录中间坐标串、彻底解决 DIME 模型对弯曲复杂折线表达臃肿问题，且被 ArcInfo Coverage 采用的是（ ）。**
   - A. 实体（面条）数据结构 &emsp; **B. 链状双重独立编码结构** &emsp; C. 四叉树数据结构 &emsp; D. 二维行程编码
   - **解析**：选 **B**。链状双重独立结构将连续直线段合并成弧段（链），弧段记录起止结点与左右面，彻底消除了多边形共有边冗余与碎线难题。
7. **一幅 $16 \times 16$（$2^4 \times 2^4$）的二值栅格矩阵采用常规四叉树编码时，树的深度（根算第 0 层）最大可达 $4$，且每个四叉树节点通常需要占用的变量个数为（ ）。**
   - A. 2 个 &emsp; B. 4 个 &emsp; **C. 6 个** &emsp; D. 8 个
   - **解析**：选 **C**。常规四叉树每个节点存储 `1 个父指针 + 4 个子指针 + 1 个属性值 = 6 个变量`。
8. **将栅格数据转换为矢量线状数据时，必须先通过 $3\times 3$ 窗口执行“细化”处理提取单像素中轴线；在随后 8 邻域搜索追踪时，若中心像素的 8 邻域中恰有 3 个或以上前景值像元，该像素应识别为（ ）。**
   - A. 孤立点 &emsp; B. 线端点 &emsp; C. 普通中间点 &emsp; **D. 拓扑结点（交叉汇合点）**
   - **解析**：选 **D**。第 4 章 PPT 明确规则：8 邻域有 0 个值像元为孤立点、1 个为端点、2 个为普通线中点、$\ge 3$ 个为分叉结点。
9. **在对比 ArcSDE 与 Oracle Spatial 两种空间数据库管理技术时，下列说法正确的是（ ）。**
   - A. 两者都只能在局域网文件模式下运行 &emsp; B. Oracle Spatial 可以原生直接存储复杂的拓扑几何网络 &emsp; **C. ArcSDE 作为中间件，能管理复杂拓扑关系并构建空间几何网络** &emsp; D. ArcSDE 无法将空间几何存入商用关系数据库
   - **解析**：选 **C**。嵌入式 Oracle Spatial 仅擅长点线面简单要素存储与 SQL 检索，中间件型 ArcSDE 才具备复杂拓扑、网络与版本长事务管理能力。
10. **下列关于 R 树与 $\mathrm{R}^+$ 树空间索引的对比描述，错误的是（ ）。**
    - A. R 树和 $\mathrm{R}^+$ 树均采用最小外接矩形（MBR）自底向上分层组织 &emsp; B. R 树允许同层兄弟节点的 MBR 相互重叠 &emsp; C. $\mathrm{R}^+$ 树要求同层兄弟矩形互不重叠，能沿单路径快速点查询 &emsp; **D. $\mathrm{R}^+$ 树不会对跨越边界的空间对象进行拆分，故无对象冗余**
    - **解析**：选 **D**。正因 $\mathrm{R}^+$ 树严禁兄弟矩形重叠，跨越分区边界的空间对象必须被拆开并同时由多个叶节点引用，必然产生存储冗余。
11. **在 SuperMap 中对一幅土地利用分类离散栅格图进行重采样以改变分辨率时，为避免产生不存在的虚假地类编号，必须选用的重采样算法是（ ）。**
    - **A. 最邻近像元法** &emsp; B. 双线性内插法 &emsp; C. 双三次卷积法 &emsp; D. 克里金法
    - **解析**：选 **A**。只有最邻近法原封不动继承像元原始整数分类编码；双线性与双三次会产生浮点平均新数值，破坏离散分类属性语义。
12. **在矢量地图数字化的拓扑检查中，两条本应严密对接的公路中心线因未启用捕捉而在交点附近微幅错开留下一段未闭合小线头，该错误在拓扑上称为（ ）。**
    - A. 伪结点 &emsp; **B. 悬挂结点（欠头/过头）** &emsp; C. 碎屑多边形 &emsp; D. 不正规多边形
    - **解析**：选 **B**。未接入目标线或越界伸出的孤立端点均为悬挂结点，伪结点则是整条单线中间的多余 2 度节点。
13. **以下线实体数据压缩算法中，能够全局最优保留曲线曲折骨架形态且具有旋转与尺度不变性的是（ ）。**
    - A. 等间隔取点法 &emsp; B. 三点局部垂距法 &emsp; **C. 道格拉斯-普克（Douglas-Peucker）分裂法** &emsp; D. 曼哈顿逼近法
    - **解析**：选 **C**。1973 年提出的 Douglas-Peucker 递归分裂法综合全局最大垂距，形态保持度公认最优。
14. **在 SuperMap 矢量数据叠置分析（输入源图层 $A$、叠加控制图层 $B$）中，若希望在输出中完整保留 $A$ 图层全部分布边界，同时给与 $B$ 重叠子区挂接 $B$ 的属性信息，应选用的算子是（ ）。**
    - A. 擦除（Erase） &emsp; B. 求交（Intersect） &emsp; C. 裁剪（Clip） &emsp; **D. 同一 / 标识叠加（Identity）**
    - **解析**：选 **D**。第 7 章 PPT 明确指出 `SuperMap 中，标识 == 同一`（即 Identity），保留输入全集 $A$ 并为交集部分附加 $B$ 属性；裁剪/求交只剩交集，擦除挖去交集。
15. **在某市森林采伐规划中，规定只能在“森林范围 $F$ 内、距离公路 $R$ 周围 $5\ \mathrm{km}$ 可达带 $B_R$ 内，且距离河流 $W$ 周围 $1\ \mathrm{km}$ 保护带 $B_W$ 以外”采伐，该区域对应的矢量集合表达式为（ ）。**
    - A. $(F \cup B_R) - B_W$ &emsp; **B. $(F \cap B_R) - B_W$** &emsp; C. $(F - B_R) \cap B_W$ &emsp; D. $F \cap B_R \cap B_W$
    - **解析**：选 **B**。先用 Intersect 求森林与公路 $5\ \mathrm{km}$ 缓冲区的交集，再用 Erase 擦除河流 $1\ \mathrm{km}$ 缓冲禁区。
16. **关于空间网络分析中的“最佳路径分析”和“旅行商分析（TSP）”的对比，正确的是（ ）。**
    - A. 两者完全等价，都会自动改变必经点顺序 &emsp; B. 旅行商分析要求起点终点中间站点必须严格按固定顺序经过 &emsp; **C. 最佳路径按指定站点次序求解，而旅行商分析可自动重排中间多个无序站点次序以求总阻最小** &emsp; D. 两者都不需要提前对路网线图层做拓扑构网
    - **解析**：选 **C**。见实验 3B 思考题：最佳路径严格按指定站点序号串联求最小代价，TSP 专为无序多点巡游重排最优顺序。
17. **不规则三角网（TIN）构建最经典的 Delaunay 三角剖分准则，不包含以下哪项？（ ）**
    - A. 空外接圆准则（任一三角形外接圆内无第四点） &emsp; B. 最大化最小内角（尽量接近正三角形） &emsp; C. 无四点共圆时剖分结构唯一 &emsp; **D. 所有三角形边长必须严格相等**
    - **解析**：选 **D**。TIN 边长随原始离散点疏密自适应变化，绝不要求边长严格相等。
18. **基于第 8 章教材与 PPT 总结，比较 IDW（反距离加权）、Spline（样条函数）和 Kriging（克里金）三大插值法，下列说法错误的是（ ）。**
    - A. 计算速度最快的是 IDW &emsp; B. 细节表达能力最强的是克里金 &emsp; C. 对孤立异常高程点最敏感的是 IDW（易生牛眼） &emsp; **D. 克里金估计值一定不能比已知采样点更平滑，且比 IDW 更快**
    - **解析**：选 **D**。Kriging 基于半变异矩阵求最优线性无偏估计，速度是最慢的（比 IDW 慢得多），且具备天然的局部平滑与误差方差估算能力。
19. **在基于规则格网 DEM 提取地表水文流域网络时，针对 D8 单流向算法与前期准备，下列叙述正确的是（ ）。**
    - **A. 计算流向之前必须先对 DEM 进行“洼地填充（Fill Sinks）”，且对角方向高差需除以 $\sqrt{2}$** &emsp; B. D8 流向栅格的取值范围是 $0 \sim 7$ &emsp; C. 山脊线处的汇流累积量通常达到全局最大值 &emsp; D. 若某相邻格网与中心格网高程差为负值（邻格更高），说明水流自中心流入该邻格
    - **解析**：选 **A**。D8 流向值为 $2^0 \sim 2^7$（`1,2,4,8,16,32,64,128`），山脊处汇流累积量为 `0`（无上游来水），高差为负值说明是上游流入而非流出。
20. **某地理现象全局空间自相关统计得 Global Moran's I $= +0.68$（$p < 0.001,\ z = +8.4$），且局部热点分析在某区输出 Getis-Ord $G_i^*$ 呈极显著负 $z$ 得分（$z = -4.2$），这说明（ ）。**
    - A. 全局呈随机离散分布，局部为高值热点 &emsp; **B. 全局呈显著正空间聚类，且该局部属于“低值聚集冷点区”** &emsp; C. 全局呈负相关，且该局部为异常孤立高值 &emsp; D. 数据完全不具备空间相关性
    - **解析**：选 **B**。正 Moran's I 表示全局高高/低低同类聚集；$G_i^*$ 显著负 $z$ 值精准指示低值集聚冷点（Cold Spot）。
21. **在克里金插值的半变异函数图中，若待插点到所有已知采样点的距离均大于“变程（Range）”，则说明（ ）。**
    - A. 测量仪器随机误差为零（块金值为零） &emsp; B. 该区域地形坡度恰好达到 $90^\circ$ &emsp; **C. 样点与待插点之间的空间相关性已消失，不能直接用这些点进行有效内插** &emsp; D. 此时样条函数也必须停止计算
    - **解析**：选 **C**。变程表征观测尺度下空间相关性的有效作用距离，超出变程则 $\gamma(h)$ 达基台值稳定，空间相关性不再存在。
22. **欲在国家级地图上同时制作“各省总人口数”与“各省人口密度”两幅专题图，最符合制图视觉感知科学规范的搭配是（ ）。**
    - A. 两者都直接用行政区边界填绘渐变色（等值区域图） &emsp; B. 总人口用等值区域填色，人口密度用分级圆点符号 &emsp; **C. 人口密度（派生比率数据）用等值区域分级填色，总人口（绝对总量数据）用分级点符号或饼柱统计图** &emsp; D. 两者都必须关闭图例并去掉比例尺
    - **解析**：选 **C**。等值区域面图面积会干扰绝对数量视觉感知，专用于密度/比率等派生数据；绝对总量必须用分级符号或统计图表。
23. **某三维景观模型需表示建筑高度（定量属性）与建筑用途分类（定性属性），且尽量避免视觉变量冲突；依据第 10 章符号选取原则，对于“3 维要素”定量表达最不推荐选用的视觉变量是（ ）。**
    - A. 亮度 &emsp; B. 饱和度 &emsp; C. 属性值颜色深浅 &emsp; **D. 透视高度**
    - **解析**：选 **D**。第 10 章明确指出：对于 3 维要素本身已含真实三维高度几何，**不推荐使用“透视高度”**对其符号化渲染；对 2.5 维要素则不推荐定性与“方向、形状”变量。
24. **某防汛指挥系统需要从远程服务器获取“原始高精度浮点型 DEM 高程矩阵”并在本地客户端直接动态计算任意阈值淹没坡度，最适合选用的 OGC 标准化服务接口是（ ）。**
    - A. WMS &emsp; B. WMTS &emsp; C. WFS &emsp; **D. WCS**
    - **解析**：选 **D**。WMS/WMTS 返回的是只读渲染图像/瓦片，WFS 返回矢量要素，唯有 **WCS（网络覆盖服务）**返回保留原始科学物理像元值的栅格覆盖数据。
25. **在 SuperMap 上机实验中，将属性表某整型字段取值范围含 `20` 的矢量多边形栅格化时，若误将结果栅格的像素格式设为“4 位无符号整型”，则字段值为 `20` 所在区域的像元最终会被处理为（ ）。**
    - A. 自动截断为最大值 `15` &emsp; B. 自动升级为 8 位存储 `20` &emsp; **C. 越界置 `0`（背景零值）** &emsp; D. 报错中断无法生成任何文件
    - **解析**：选 **C**。实验 3A 指导书明确强调：4 位像素仅存 $[0, 15]$，一旦源栅格字段值超出结果像素格式存储范围（如 $20 > 15$），对应像元栅格值将被统一处理成 **`0`**！
</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
