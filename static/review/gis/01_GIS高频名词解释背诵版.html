## 零、考前速览：十组极易混淆核心概念一句话秒杀宽表

| 对比组 | 概念 A | 概念 B | 一句话核心采分差异点 |
| :--- | :--- | :--- | :--- |
| **1. 符号与语义** | **地理数据（Geodata）** | **地理信息（Geoinformation）** | **数据**是未经解释的原始物理记录（数字、坐标、符号）；**信息**是经加工解释后对决策有用的知识（数据是载体，信息是内涵）。 |
| **2. 椭球基准** | **参心坐标系** | **地心坐标系** | **参心系**原点在参考椭球中心（局部吻合，如北京 54、西安 80）；**地心系**原点在地球质心（全球一致，如 WGS84、CGCS2000）。 |
| **3. 抽象层次** | **概念模型 / 逻辑模型** | **物理模型 / 数据结构** | **概念模型**面向人脑语义（对象、场、网络）；**逻辑模型**面向 GIS 软件记录结构；**物理模型**是磁盘存储；**数据结构**是逻辑向物理映射的媒介。 |
| **4. 空间视角** | **对象模型（要素模型）** | **场模型（域模型）** | **对象模型**将空间视为空域，离散抽象为点、线、面、体；**场模型**将地理现象视为连续分布函数 $A = f(x, y)$（如 DEM、温度场）。 |
| **5. 基本结构** | **矢量数据结构** | **栅格数据结构** | **矢量**“定位明显、属性隐含”，边界精度高但叠置算法复杂；**栅格**“属性明显、定位隐含”，结构简单易代数运算但存在混合像元与锯齿。 |
| **6. 空间关系** | **拓扑 / 顺序关系** | **度量空间关系** | **拓扑**描述相邻、关联、包含、连通（橡皮变换不变量）；**顺序**描述上下左右东西南北方位；**度量**定量或定性描述距离远近。 |
| **7. 四叉树变体** | **常规四叉树** | **线性四叉树（MD 码）** | **常规四叉树**保留中间节点（每节点 6 变量，指针冗余大）；**线性四叉树**仅存叶节点十进制 Morton 码与属性值，存储量仅为常规的 $2\% \sim 25\%$。 |
| **8. 图幅接边** | **几何接边** | **逻辑接边** | **几何接边**消除跨图幅边界点位错位、缝隙与重叠（几何裂缝）；**逻辑接边**统一跨幅同一地物的编码与属性差异（逻辑裂缝）。 |
| **9. 窗口算子** | **焦点统计（Focal）** | **块统计（Block）** | **Focal** 以每个像元为中心逐格移动窗口计算，可重叠并保持细节；**Block** 将区域划分为互不重叠块，整块赋同一值，有降尺度聚合效果。 |
| **10. OGC 服务** | **WMS / WMTS** | **WFS / WCS** | **WMS** 返回静态地图渲染图像，**WMTS** 返回预切瓦片；**WFS** 返回 GML/GeoJSON 矢量要素及属性；**WCS** 返回原始多维科学栅格像元值。 |

## 模块一：第 1 章 概论（5 条）

### 1. 数据、信息与地理信息
* **标准定义**：**数据（Data）**是对客观事物定性或定量描述的未经加工的原始符号记录；**信息（Information）**是用文字、数字、符号、图像等形式表现的、经过处理解释后对客观世界和决策有用的知识。**地理信息**是指表征地理系统诸要素（自然、生态、社会、经济等）的数量、质量、分布特征、相互联系和变化规律的数字、文字、图像和图形等的总称，其最显著标志是**具有空间定位特征**，并兼具空间性、属性性、时序性与区域综合性。
* **【4分采分点】**：① 数据是原始记录载体，信息是解释后的有用知识；② 地理信息是对地理数据（含空间与属性）的解释；③ 最显著标志是空间定位标识（关联地理坐标）；④ 具有空间分布、多维属性、动态时序与海量性特征。

### 2. 地理信息系统（GIS）
* **标准定义**：**地理信息系统（Geographic Information System，GIS）**是在计算机硬、软件系统支持下，对整个或部分地球表层（包括大气层）空间中的有关地理分布数据进行采集、储存、管理、运算、分析、显示和描述的技术系统。它既是一门跨越地球科学、空间科学与信息科学的边缘应用学科，也是一项以地学原理为依托、空间分析为核心的工程应用技术（1963 年加拿大 Roger Tomlinson 建成的 CGIS 为世界第一个 GIS）。
* **【4分采分点】**：① 属类：计算机硬软件支持的地球表层空间信息系统；② 数据全链路功能：采集、存储、管理、运算、分析、显示与描述；③ 核心标志：具备强大空间分析与地学建模能力（区别于 CAD/DBMS）；④ 学科属性与起源：多学科交叉，1963 年加拿大 CGIS 标志诞生。

### 3. GIS 的基本构成（五要素）
* **标准定义**：一个完整的实用 GIS 由五个核心部分有机组成：① **硬件系统**（主机、存储、扫描仪/GNSS 等输入设备、绘图仪/显示器等输出设备）；② **软件系统**（系统软件、GIS 基础平台软件、空间数据库软件及专业应用软件）；③ **空间数据**（系统核心与“血液”，含几何、像素、属性与元数据，在工程成本中占比最高，硬件∶软件∶数据约为 $1:2:7$）；④ **应用（地学）模型**（连接 GIS 工具与专业领域的纽带，决定分析深度）；⑤ **人员**（系统组织管理、开发人员与最终用户，是系统中最活跃的要素）。
* **【4分采分点】**：① 硬件系统提供物理算力与输入输出平台；② 软件系统（基础平台+数据库+应用模块）实现管理与分析；③ 空间数据是核心血液（工程投资占主导）；④ 应用模型决定解决专业问题能力，人员是最活跃的关键要素。

### 4. 地理信息科学（GISc）与地球信息科学（GISi）
* **标准定义**：**地球信息科学（GISi）**是地球系统科学的重要组成部分，是以 RS、GNSS、GIS（“3S”）集成技术为主要手段，研究地球表层资源环境与经济社会综合信息流的学科；**地理信息科学（GISc）**由 Goodchild 于 1992 年提出，是信息时代的地理学，专门研究地理信息的本质特征、表达机理、不确定性与运动规律，为地理信息系统（GIS）软件工程和地理信息服务（GIService）提供基础理论支撑。
* **【4分采分点】**：① GISi 研究地球表层综合信息流，“3S”对地观测是核心技术手段；② GISc 由 Goodchild 提出，是研究地理信息本质与规律的基础科学；③ GIS（System）侧重工程软件实现，GISc（Science）侧重底层理论方法；④ 三者共同服务于地理信息社会化服务（GIService）。

### 5. “3S”集成技术与数字地球
* **标准定义**：**“3S”集成**是将遥感（RS，大范围实时动态获取地表电磁波影像数据源）、全球导航卫星系统（GNSS，全天候高精度三维实时定位与授时）与地理信息系统（GIS，空间数据管理、融合分析与决策模拟的中枢）有机融合的对地观测与信息处理技术体系。**数字地球（Digital Earth）**是以地球坐标为基准、海量多分辨率多尺度多维地理信息为内容、网络与虚拟现实等高技术为支撑的地球虚拟数字化再现系统。
* **【4分采分点】**：① RS 提供高时空分辨率面状动态数据源；② GNSS 提供实时精确空间位置与时间基准；③ GIS 承担多源空间数据管理、综合分析与决策输出中枢；④ 三者协同构建数字地球与时空大数据智慧城市底座。

## 模块二：第 2 章 地理空间数学基础（9 条）

### 6. 大地水准面与地球椭球
* **标准定义**：**大地水准面（Geoid）**是指假想静止平均海水面延伸穿过陆地内部而形成的封闭重力等位面，它处处与铅垂线正交，是正高的起算基准面，其所包围的形体称为**大地体**。**地球椭球**是为了在数学上逼近大地体而选定的、围绕短轴旋转的规则几何椭球体（由长半轴 $a$、短半轴 $b$ 或扁率 $f = (a-b)/a$ 描述）；当选定椭球中心位置和方向使之与某区域或全球大地水准面最佳拟合时，称为**椭球定位**，由此确定的椭球称为**参考椭球**。
* **【4分采分点】**：① 大地水准面是平均海面延伸的重力等位面（正高基准，围成大地体）；② 地球椭球是规则数学旋转几何体（参数 $a, b, f$）；③ 椭球定位确立椭球中心与坐标轴指向以逼近大地水准面；④ 大地水准面是物理参考面，参考椭球是数学计算参考面。

### 7. 大地地理坐标系与地心空间直角坐标系
* **标准定义**：**大地地理坐标系（Geodetic Coordinate System）**以参考椭球面为基准，由过地面点的椭球法线与赤道面夹角**大地纬度 $B$**、法线所在子午面与起始子午面夹角**大地经度 $L$** 及点沿法线至椭球面距离**大地高 $H$** 构成。**地心空间直角坐标系**以地球质心为原点 $O$，$Z$ 轴指向协议地球极（CTP），$X$ 轴指向起始子午面与赤道交点，$Y$ 轴按右手法则构成（如 WGS84、CGCS2000），坐标记为 $(X, Y, Z)$。
* **【4分采分点】**：① 大地坐标 $(B, L, H)$ 基于参考椭球面与椭球法线定义；② 空间直角坐标 $(X, Y, Z)$ 以质心（地心系）或椭球心（参心系）为原点；③ 我国 1954 北京（克拉索夫斯基椭球）与 1980 西安（1975 国际椭球）为参心系，CGCS2000 与 WGS84 为地心系；④ 空间直角系便于三维坐标转换与卫星定位解算。

### 8. 高程基准与高程系统（大地高 / 正高 / 正常高）
* **标准定义**：**高程基准**包括高程起算基准面及相对于该基准面的水准原点高程；我国现行 **1985 国家高程基准**采用青岛大港验潮站 1952～1979 年验潮资料确定的黄海平均海面为基准面（水准原点高程 $72.260\ \mathrm{m}$，原 1956 黄海高程系为 $72.289\ \mathrm{m}$）。按参考面不同分为三类高程：① **大地高**（沿椭球法线至参考椭球面，GNSS 直接测得）；② **正高**（沿铅垂线至大地水准面，受真实重力异常影响）；③ **正常高**（沿正常铅垂线至似大地水准面，我国法定高程系统）。
* **【4分采分点】**：① 高程基准含起算水准面与水准原点高程（1985 基准原点 $72.260\ \mathrm{m}$）；② 大地高以参考椭球面为基准（卫星定位直接获取）；③ 正高以大地水准面为基准（重力等位面）；④ 正常高以似大地水准面为基准（大地高 $-$ 高程异常 $=$ 正常高）。

### 9. 地图投影与变形椭圆
* **标准定义**：**地图投影（Map Projection）**是按照一定的数学法则，将不可展的地球椭球面上的经纬网点 $(B, L)$ 精确转换到可展的平面直角坐标 $(x, y)$ 上的理论与方法，表达式为 $x = f_1(B, L),\ y = f_2(B, L)$。由于球面不可无变形展平，地球面上的微小圆投影到平面后一般变为椭圆，称为**变形椭圆（Tissot 指示椭圆）**，通过其长短半轴和面积直接度量长度、面积与角度三类变形；按变形性质可分为**等角（正形）投影、等面积投影和任意（含等距）投影**。
* **【4分采分点】**：① 数学法则建立椭球面 $(B, L)$ 与平面 $(x, y)$ 的一一映射；② 地球椭球面不可展是产生投影变形的根本原因；③ 变形椭圆直观表征长度、面积与角度变形；④ 按变形性质分为等角、等面积与任意投影三大类。

### 10. 高斯-克吕格投影与 6° / 3° 分带
* **标准定义**：**高斯-克吕格投影**是一种**横轴等角切圆柱投影**，假想一圆柱面横切于椭球体某一中央子午线，在等角条件下展开成平面。其投影特点是：中央子午线和赤道为互相垂直的直线；**中央子午线无长度变形（变形比 $1$）**，离中央子午线越远变形越大，6° 带内最大长度变形不超过 $0.14\%$。为防止边缘变形过大，采用按经差 **6° 分带**（起始经线 $0^\circ$，全球 60 带，$L_0 = 6n - 3^\circ$，我国跨 13～23 带，用于 1∶2.5 万～1∶50 万地形图）和 **3° 分带**（起始经线 $1.5^\circ$，全球 120 带，$L_0 = 3n$，我国跨 24～45 带，用于 1∶1 万地形图）；为避免横坐标出现负值，纵轴向西平移 **$500\ \mathrm{km}$** 并在 $Y$ 坐标前加 2 位带号。
* **【4分采分点】**：① 投影实质：横轴等角切圆柱投影，中央子午线长度变形比为 $1$；② 分带公式：6° 带 $L_0 = 6n - 3^\circ$，3° 带 $L_0 = 3n$；③ 我国地形图尺度规范：1∶2.5 万～1∶50 万用 6° 带，1∶1 万用 3° 带；④ 坐标伪偏移：横坐标东移 $500\ \mathrm{km}$ 并前置 2 位带号形成 8 位带号坐标。

### 11. UTM 投影与兰勃特（Lambert）等角投影
* **标准定义**：① **UTM 投影（通用横轴墨卡托投影）**实质为**横轴等角割圆柱投影**，圆柱面割于两条等变形线，**中央子午线长度变形比为 $0.9996$**，6° 带内最大长度变形不超过 $0.04\%$，适用纬度范围为 $80^\circ\mathrm{S} \sim 84^\circ\mathrm{N}$，带号自 $180^\circ\mathrm{W}$ 起向东每隔 6° 编号（第 1 带中央经线 $177^\circ\mathrm{W}$）；② **兰勃特等角投影**在双标准纬线下为**正轴等角割圆锥投影**，投影后纬线为同心圆弧、经线为交于极点的直线且正交于纬线，两标准纬线上无变形，适合中低纬度东西延伸区域（如我国百万分之一或省级政区图）。
* **【4分采分点】**：① UTM 为横轴等角割圆柱投影，中央子午线比例因子 $0.9996$；② UTM 自 $180^\circ\mathrm{W}$ 起分 60 个 6° 带，最大变形优于高斯投影（$\le 0.04\%$）；③ 兰勃特为正轴等角割圆锥投影，双标准纬线无变形；④ 兰勃特经线为直线、纬线为同心圆弧，适合中纬度东西向制图。

### 12. 空间坐标转换（七参数布尔沙模型）
* **标准定义**：**空间坐标转换**是将空间数据从一种参考椭球、基准面或地图投影转换到另一种基准面或投影下的计算过程。当**椭球相同、投影不同**时，仅需通过“原投影反解 $\to$ 大地坐标 $(B, L)$ $\to$ 新投影正解”的**投影解析转换**完成；当**参考椭球或基准面不同**（如北京 54 / 西安 80 转 CGCS2000 / WGS84）时，需先将 $(B, L, H)$ 转为三维空间直角坐标 $(X, Y, Z)$，利用包含 **3 个平移参数 $(\Delta X, \Delta Y, \Delta Z)$、3 个旋转角 $(\varepsilon_X, \varepsilon_Y, \varepsilon_Z)$ 和 1 个尺度因子 $m$** 的**布尔沙七参数模型**完成基准转换，再反算 $(B, L, H)$ 与新投影坐标。无法获知投影参数时则采用同名点多项式**数值拟合转换**。
* **【4分采分点】**：① 同椭球不同投影采用“反解至大地坐标再正解”的解析转换；② 跨椭球基准转换需借助三维空间直角坐标 $(X, Y, Z)$；③ 布尔沙七参数含 3 平移 + 3 旋转 + 1 尺度（至少需 3 个公共三维控制点）；④ 未知投影信息时退化为控制点多项式数值拟合。

### 13. 空间尺度与空间分辨率
* **标准定义**：**空间尺度（Spatial Scale）**反映空间现象表达的详细程度与综合概括水平，包含观测尺度（如地图比例尺、传感器分辨率）与操作尺度。**比例尺**指图上距离与地面对应水平距离之比（大区域指地球半径缩小率）；**空间分辨率**对栅格或遥感影像而言指单个像元在地面上覆盖的线性尺寸（如 $5\ \mathrm{m} \times 5\ \mathrm{m}$ 像元分辨率为 $5\ \mathrm{m}$）。**关键区分**：比例尺是展示视图缩放比，空间分辨率是数据本身固有的最小可辨识单元尺寸——高分辨率数据可以小比例尺显示，但低分辨率数据放大显示比例尺并不能提高其真实信息精度。
* **【4分采分点】**：① 空间尺度决定地理现象抽象、采集与分析的粒度；② 比例尺反映图面与实地长度缩小比率（数字/文字/图解式）；③ 空间分辨率指单个像元对应的地面覆盖尺寸（像元越小分辨率越高）；④ 分辨率决定数据内在详略上限，与显示比例尺概念独立（成反比直观习惯须分清）。

### 14. 地理格网与国家基本比例尺地形图分幅编号
* **标准定义**：**地理格网**是按一定数学规则对地球表面进行系统划分与编码的空间参照框架，分为经纬度格网、直角坐标格网与地理象限格网，满足科学性、系统性、实用性与可扩展性。我国规定 **1∶100 万、1∶50 万、1∶25 万、1∶10 万、1∶5 万、1∶2.5 万、1∶1 万** 7 种地形图为国家基本比例尺系列，均以 1∶100 万国际分幅（我国范围经差 $6^\circ$、纬差 $4^\circ$，行自赤道起每 $4^\circ$ 用 `A~V` 22 行，列自 $180^\circ$ 起向东每 $6^\circ$ 用 `1~60` 60 列）为基础，采用 **10 位行列新编号法**：前 3 位为百万分幅图号 + 第 4 位比例尺代码 + 后 6 位为图幅在百万分幅内的 3 位行号与 3 位列号。
* **【4分采分点】**：① 地理格网实现空间区域的层次化离散定位与统一编码；② 国家 7 种基本比例尺地形图以 1∶100 万（$6^\circ \times 4^\circ$）为基础；③ 百万分幅行号自赤道起每 $4^\circ$ 用字母 `A~V`，列号自 $180^\circ$ 起向东每 $6^\circ$ 用 `1~60`；④ 现行 10 位新图号由“百万图号(3位)+比例尺代码(1位)+图内行列号(3位+3位)”构成。

## 模块三：第 3 章 空间数据模型（8 条）

### 15. 空间实体与地理空间抽象三层模型
* **标准定义**：**空间实体（Spatial Entity）**是现实世界中不可再分的地理现象抽象体，具有**空间位置特征、属性特征、时间特征和空间关系特征**四大基本特征。计算机表达现实地理空间需经历由高到低的三层抽象：① **概念模型**（最高层，面向人的语义抽象，独立于计算机实现，如对象/场/网络模型）；② **逻辑模型**（中间层，GIS 软件描述实体及其关系的逻辑结构，如矢量拓扑表、关系表、UML）；③ **物理模型**（最底层，磁盘物理存储格式与存取机制）。**空间数据结构**则是将逻辑模型映射为物理模型的中间媒介。
* **【4分采分点】**：① 空间实体具有位置、属性、时间与空间关系四大基本特征；② 概念模型是最高层语义抽象（独立于软硬件实现）；③ 逻辑模型描述软件层面的结构与关系，物理模型对应底层磁盘存储；④ 空间数据结构充当逻辑模型向物理模型映射的桥梁。

### 16. 对象数据模型（要素模型）
* **标准定义**：**对象数据模型（Object Data Model）**又称要素模型，是将研究的整个地理空间视为一个连续空域，把具有明确边界的离散地理现象抽象为分布在该空域中的独立对象（空间要素）。按几何维度分为 **0 维点、1 维线、2 维面、3 维体**四种基本对象，可进一步组合为复杂对象并记录其关联属性与拓扑关系。一个合法空间要素须同时满足“可被标识、观察中具重要程度、特征明确可描述”三条件，最适于建筑物、道路、湖泊、行政区划等人文与清晰自然实体建模。
* **【4分采分点】**：① 属类：面向离散地理现象的空间概念模型；② 空间抽象：空域内分布的 0D 点、1D 线、2D 面、3D 体独立实体；③ 要素三条件：可标识、具重要性、属性与边界明确；④ 典型适用：边界清晰的离散实体（建筑、管网、宗地、政区）。

### 17. 场数据模型（域模型）
* **标准定义**：**场数据模型（Field Data Model）**又称域模型，把地理空间中的自然现象视为充满整个研究区域的连续变化变量或表面，即在二维空间 $R^2$（或三维 $R^3$）的任意位置均对应确定的连续属性值函数 $A = f(x, y)$ 或 $A = f(x, y, z)$。在静态二维 GIS 中，场模型主要通过**规则格网（栅格）、不规则分布点、规则分布点、不规则多边形、TIN 三角网、等值线**六种具体模型表达，典型应用于数字高程（DEM）、地表温度、大气污染浓度、土壤湿度等无明确突变边界的连续现象建模。
* **【4分采分点】**：① 属类：面向空间连续分布现象的概念模型；② 数学本质：空间位置到属性值的连续函数 $A = f(x, y)$；③ 表达载体：常用规则格网、TIN、等值线、离散采样点等六类表达；④ 典型适用：地形高程、气象温度、污染物扩散等渐变连续场。

### 18. 网络数据模型与线性参照系统
* **标准定义**：① **网络数据模型（Network Data Model）**是以对象模型为基础、专门刻画通过路径相互连通的离散要素流动系统的概念模型，由欧氏空间中的**结点（Node）**和连接结点的**链/弧段（Link）**构成有向或无向连通图，赋予弧段阻力与转向约束后用于道路交通、电力水网等路径优化；② **线性参照系统（Linear Referencing）**沿线状实体引入**一维里程量度（Measure，$M$ 值）**对事件进行相对定位（如“国道 G107 线 $\mathrm{K}35+200\ \mathrm{m}$”），从而在不分割路网拓扑几何的前提下高效管理路段属性与点/线动态事件（动态分段）。
* **【4分采分点】**：① 网络模型由结点与互连的链构成，侧重实体间的拓扑连通性与流量阻力；② 网络模型可视为强调通道连通性的对象模型特例；③ 线性参照沿线状要素起点累积里程（$M$ 值）定位点/线事件；④ 支持动态分段，避免因属性分段频繁切分基础路网几何。

### 19. 时空数据模型（TGIS）
* **标准定义**：**时空数据模型（Spatio-Temporal Data Model）**是在三维空间维基础上显式引入**时间维 $T$**（即 $O = f(X, Y, Z, T)$），以描述、存储和推理地理实体几何形态、空间位置及属性随时间演变过程的概念模型。常见逻辑实现包括**序列快照模型**（按时间片完整存储图层，直观但冗余极大）、**基态修正模型**（仅存初始基态与后续增量变化）、**时空复合模型**（记录状态变化的最小公共时空单元）及**面向对象时空模型**。
* **【4分采分点】**：① 在空间特征基础上耦合时间维 $T$ 刻画地理演化过程；② 能够表达空间实体的诞生、扩张、分裂、合并与消亡；③ 代表模型：序列快照（冗余大）、基态修正（增量高效）、时空复合与事件驱动；④ 广泛用于土地利用变迁追踪、灾害演进与轨迹大数据分析。

### 20. 空间关系与拓扑关系（含橡皮变换性质）
* **标准定义**：**空间关系**指地理空间实体之间相互作用的联系，包括**拓扑空间关系**（相邻、关联、包含、连通）、**顺序空间关系**（前后、上下、左右、东南西北方位）和**度量空间关系**（欧氏/曼哈顿等距离远近）。其中，**拓扑空间关系**指图形在连续弹性变形（缩放、旋转、拉伸，即所谓“绘在橡皮上的几何图形”）下保持不变的逻辑结构性质，不依赖具体坐标与距离函数；同类元素间称**邻接关系**（多边形-多边形），不同类元素间称**关联关系**（结点-弧段、弧段-多边形），嵌套关系称**包含关系**，弧段串接关系称**连通关系**。
* **【4分采分点】**：① 空间关系分拓扑、顺序（方位）与度量（距离）三大类；② 拓扑关系是连续变形下保持不变的空间逻辑关系（不随投影与缩放改变）；③ 包含四类具体关系：邻接（同类）、关联（异类）、包含（嵌套）、连通（弧段）；④ 比几何坐标更稳定，是空间查询、拓扑检错与多边形/网络重构的基础。

### 21. 四交模型（4IM）与九交模型（9IM）
* **标准定义**：Egenhofer 等提出的形式化表达点集拓扑关系的数学模型。**四交模型（4IM）**将简单空间对象 $A$ 划分为**内部（$A^\circ$）**与**边界（$\partial A$）**两部分，构造 $2 \times 2$ 交集矩阵；**九交模型（9IM）**进一步引入**外部（$A^-$）**，通过比较对象 $A$ 和 $B$ 的内部、边界、外部两两交集是否为空（$\emptyset$ 或 $\neg\emptyset$）及维度（DE-9IM），构建 $3 \times 3$ 拓扑判断矩阵：

  $$R(A, B) = \begin{pmatrix} A^\circ \cap B^\circ & A^\circ \cap \partial B & A^\circ \cap B^- \\ \partial A \cap B^\circ & \partial A \cap \partial B & \partial A \cap B^- \\ A^- \cap B^\circ & A^- \cap \partial B & A^- \cap B^- \end{pmatrix}$$

  9IM 理论共 $2^9 = 512$ 种布尔组合，去除几何无意义状态后可精确区分二维简单面之间的 **8 种基本拓扑关系**（相离、相接、交叠、相等、包含、覆盖、被包含、被覆盖）。
* **【4分采分点】**：① 将空间对象形式化划分为内部 $^\circ$、边界 $\partial$、外部 $^-$ 三个点集；② 4IM 为 $2\times 2$ 矩阵（仅内部与边界），9IM 为 $3\times 3$ 矩阵（引入外部完整刻画）；③ 通过矩阵元素空/非空（或维数扩展 DE-9IM）判定八大空间拓扑谓词；④ 是 OGC Simple Features 与空间 SQL（`ST_Contains`、`ST_Touches` 等）的数学基础。

## 模块四：第 4 章 空间数据结构（10 条）

### 22. 实体数据结构（面条数据结构 Spaghetti）
* **标准定义**：**实体数据结构**又称**面条数据结构**或简单坐标序列结构，是最基本的矢量数据结构，直接以点实体 $(x,y)$、线实体坐标串 $((x_1,y_1),\dots,(x_n,y_n))$ 和闭合多边形坐标串独立记录每个空间对象，**不显式存储结点、弧段与多边形之间的任何拓扑关系**（如早期 AutoCAD DXF 与简单 Shapefile）。其优点是结构简单、直观、输出绘图快、增删单个实体无需重建全图；缺点是**相邻多边形公共边界重复存储造成数据冗余与缝隙/重叠隐患**，且无法直接支持邻接查询、碎屑检测与网络路径分析。
* **【4分采分点】**：① 属类：非拓扑的简单矢量坐标串结构；② 核心机制：独立记录各点/线/面完整坐标，无显式拓扑表；③ 优点：结构简明、读写与局部增删快捷；④ 缺点：公共边界冗余存储易产生缝隙重叠，难以高效完成邻接与网络分析。

### 23. 拓扑数据结构（DIME 与链状双重独立编码）
* **标准定义**：**拓扑数据结构**在记录几何坐标的同时显式构建点、线、面间的拓扑关联与邻接表。代表结构有：① **DIME（双重独立地图编码）**：最早由美国人口普查局提出，每条直线段同时用**起止结点序号**和**左右多边形编号**双重定义，但复杂曲线需切分为大量短直线段；② **链状双重独立编码结构**：对 DIME 的改进，将连续折线合并为**弧段（链）**统一存储中间坐标点序列，弧段文件仅记录起止结点与左右多边形（如 ESRI ArcInfo Coverage 模型）。优点是彻底**消除共享边界冗余**、支撑快速拓扑检索与网络分析；缺点是结构复杂、编辑维护代价高。
* **【4分采分点】**：① 属类：显式维护几何与拓扑表（多边形-弧段-结点）的矢量数据结构；② DIME 以直线段为单位同时绑定起止结点与左右多边形；③ 链状双重独立编码将折线聚合为弧段（解决曲线冗余，Coverage 核心）；④ 消除公共边重复存储，强力支撑空间查询、质量检错与网络分析。

### 24. 栅格数据结构（Raster Data Structure）
* **标准定义**：**栅格数据结构**以按行、列规则排列的二维网格阵列（矩阵）表达空间对象，每个格网单元（像元/Pixel）的行列号 $(i, j)$ 隐含对应地理坐标，像元值 $V$ 直接记录地物的类别、等级或高程等属性。其最显著特点是**“属性明显、定位隐含”**且每个像元通常仅能存单一值。常用像元取值方法包括**中心点法、面积占优法、重要性法与长度占优法**。其优点是数据结构简单、易于与遥感影像融合、叠置与地图代数运算高效；缺点是存在锯齿变形、边界与图形精度受像元大小制约，高分辨率下数据量庞大。
* **【4分采分点】**：① 属类：基于规则格网阵列的空间离散表达结构；② 核心特征：“属性明显、定位隐含”，每个像元仅存单个属性；③ 像元赋值规则：中心点法、面积占优法、重要性法等；④ 易与遥感融合及进行空间代数运算，但分辨率决定精度且易产生数据冗余。

### 25. 游程长度编码（RLE）与二维行程编码
* **标准定义**：① **游程长度编码（Run-Length Encoding，RLE）**是逐行扫描栅格矩阵，将连续相同属性值的像元序列压缩为`(属性值 s_i, 连续像元数 l_i)`或`(属性值 s_i, 终止列号 pos_i)`数对的无损压缩结构。图面均质大块越多压缩比越高，图形越碎杂压缩效果越差甚至倒增，易用于检索与叠置但未利用列向二维相关性；② **二维行程编码**是对一维 RLE 与线性四叉树叶节点的升级，直接沿二维空间合并相同属性的方形子块（记录`起始地址/MD码 + 边长 + 属性值`），在多时相与面积计算上压缩率和运算效率显著高于一维游程编码与线性四叉树。
* **【4分采分点】**：① RLE 按行将连续等值像元合记为`(属性值, 游程长度)`或`(属性值, 止列号)`；② 压缩比与图面均质面积成正比、与复杂破碎度成反比；③ 一维 RLE 仅利用行内一维相关性，不适合高频连续变化地形；④ 二维行程编码以方形块或归并 MD 码扩展二维相关性，压缩率更高。

### 26. 四叉树与线性四叉树（Morton 码 / MD 码）
* **标准定义**：**四叉树（Quadtree）**是将 $2^n \times 2^n$ 栅格矩阵按四象限（NW、NE、SW、SE）递归四等分，直至子块内属性值完全一致或达最小分辨率为止的树状可变分辨率结构。① **常规四叉树**存储树中全部内部与叶节点，每个节点需 **6 个变量**（父指针、4 个子指针、属性值），指针开销大；② **线性四叉树**丢弃中间节点与指针，仅顺序存储有效叶节点的**地址码 + 属性值**（如龚健雅多级网格基础），通常采用二进制行列号按“先列后行/交叉插位”转换出的**十进制 Morton 码（MD 码）**作为叶节点唯一地址码，存储空间仅为常规四叉树的 $2\% \sim 25\%$。
* **【4分采分点】**：① 对 $2^n \times 2^n$ 矩阵递归四等分直至子区均质，实现可变空间分辨率；② 常规四叉树含中间节点（每节点 6 变量：1 父 + 4 子 + 1 值），指针冗余大；③ 线性四叉树仅存叶节点地址码与属性，大幅压缩存储（占常规 $2\% \sim 25\%$）；④ 地址码常采用行列二进制位交叉生成的十进制 Morton（MD）码。

### 27. Freeman 链码（Chain Code）
* **标准定义**：**弗里曼（Freeman）链码**是一种仅记录线状要素或面状多边形外部轮廓边界像素走向、而**不存储区域内部像元**的边界压缩结构。从给定起始点行列号出发，依据预先约定的 **8 邻域方向码（通常 `0` 代表正东，逆时针 `1` 东北、`2` 北、`3` 西北、`4` 西、`5` 西南、`6` 南、`7` 东南）**依次记录每一步向相邻边界像元移动的方向数字序列，并组织为含`特征码、起点行、起点列、链码串`的链码结构文件。其优点是压缩率接近矢量结构、易于计算周长/面积/凹凸度与拐点探测；缺点是难以直接开展区域叠置运算且相邻边界存在重复存储冗余。
* **【4分采分点】**：① 仅追踪并编码线或多边形边界走向，忽略内部均质像元；② 编码元素为“特征码 + 起始像元行列 + 0～7 八方向码串”；③ 压缩效率接近矢量，极其便于边界周长、拐角与形状特征提取；④ 缺乏区域内部表达，叠置合并困难且共享边有冗余。

### 28. 影像金字塔与瓦片金字塔结构
* **标准定义**：① **影像金字塔**是将同一幅原始高分辨率影像或栅格数据逐级按 $2\times 2$ 降采样（如分辨率逐级减半）生成一系列不同分辨率副本并呈塔状分层存储的多尺度数据结构（分不保留完整像素树的 **M-金字塔**与包含完整像素树的 **T-金字塔**），用于渐进式传输与快速多级缩放浏览；② **瓦片金字塔**在影像金字塔基础上，将每层影像按固定规则尺寸（如 $256 \times 256$ 或 $512 \times 512$ 像素）切割为矩阵瓦片，并按层级/行/列编号（`z/y/x`）组织存储，是 WebGIS 在线高速地图渲染与缓存的核心数据结构。
* **【4分采分点】**：① 影像金字塔按逐级降采样构建多分辨率副本（M-金字塔/T-金字塔）；② 解决海量影像概貌浏览时的 I/O 瓶颈，实现渐进显示与有损多尺度组织；③ 瓦片金字塔将各金字塔层再切分为 $256\times 256$ 等规则瓦片并按 `z/row/col` 索引；④ 是 WebGIS 预缓存加速显示的核心，但存在跨瓦片分析需拼接与局部更新粒度粗等局限。

### 29. 矢栅一体化数据结构
* **标准定义**：**矢栅一体化数据结构**是指在同一套底层存储框架下同时兼具矢量数据高精度定位与栅格数据高效空间分析能力的数据组织方式（如龚健雅提出的三级格网线性四叉树方案）。核心机理是在矢量空间实体记录中引入格网空间索引与区域填充属性标识，或采用多级 Morton 码 `(M0, M1, M2)` 同时表达点/线穿过的粗格网、基本格网与细分格网坐标精度，从而在无需频繁矢栅格式互转的前提下，在同一数据结构中直接支持高精制图与快速叠置/邻近分析。
* **【4分采分点】**：① 旨在融合矢量定位精度高与栅格分析简单高效的双重优势；② 典型实现如三级精细格网线性四叉树 `(M0, M1, M2)` 编码；③ 点、线、面实体共享面向格网的地址索引与拓扑/属性关联；④ 避免频繁矢栅转换带来的几何失真与时间开销。

### 30. Voronoi 图（泰森多边形）与不规则三角网（TIN）
* **标准定义**：① **Voronoi 图（泰森多边形）**由一组离散母点对平面进行互不重叠剖分而成，每个多边形内部任意点到所属母点的欧氏距离严格小于到其余所有母点的距离（垂直平分线构网），是对空间最邻近影响域的精确几何划分（常用邻接表、顶点表与单元顶点组成表存储）；② **不规则三角网（TIN）**通过连接离散采样高程点构成互不重叠的最优连续三角面片来逼近地形表面，其标准拓扑剖分准则遵循 **Delaunay 三角剖分**（空外接圆准则与最大最小角准则），能自适应地形复杂程度分配采样点密度并顾及山脊、谷底等地形结构线。
* **【4分采分点】**：① Voronoi 多边形内任一点距中心母点最近，天然划分最近邻影响区；② TIN 以互不重叠连续三角面片离散表达地形曲面（可融合特征线）；③ TIN 通常遵循 Delaunay 剖分（空外接圆与最大化最小内角，使三角形最接近正三角形）；④ 分辨率可变、冗余小且保结构特征，但拓扑存储与维护比规则格网复杂。

### 31. 八叉树与三维边界表示法（B-rep）
* **标准定义**：三维空间数据结构（3D GIS）的两种主流表示模型：① **八叉树（Octree）**是二维四叉树向三维体素空间的直接推广，将三维立方体区域沿 $X, Y, Z$ 轴中点递归八等分，直至子立方体全满、全空或达最小体素分辨率为止，适于地质体、矿山等内部非均质实体建模；② **三维边界表示法（Boundary Representation，B-rep）**属于三维矢量表达，通过显式记录三维物体闭合外表面的**顶点坐标、边拓扑以及围成体表面的面片集合**（如 TIN 表面或多面体 Multipatch）来精确界定三维实体外部形态，广泛用于城市三维建筑建模。
* **【4分采分点】**：① 八叉树将三维空间沿 $X, Y, Z$ 递归八等分（二维四叉树的三维体素推广）；② 八叉树内部体素属性连续可查，适于地质/地下三维实体分析；③ B-rep 通过“点 $\to$ 边 $\to$ 面 $\to$ 闭合多面体”精确表达三维表面轮廓；④ B-rep 几何边界清晰、渲染高效，广泛用于 3D 城市建筑外观建模。

## 模块五：第 5 章 空间数据组织与管理（5 条）

### 32. 空间数据库与空间数据管理模式
* **标准定义**：**空间数据库（Spatial Database）**是按照一定数据模型在计算机内长期存储、有组织、可共享的空间数据及对应属性数据的集合；相比传统数据库，它具有**数据量海量、空间与非空间（属性）强耦合、数据非结构化变长（点线面顶点不定长）、空间关系复杂、多尺度与多时相并存**五大特征。其底层管理模式演进为四类：**纯文件管理、文件-关系数据库混合管理**（文件存几何、RDBMS 存属性，如早期 ArcInfo）、**全关系/扩展关系管理**（BLOB 变长字段或 SQL 空间扩展类型）、**面向对象/对象关系数据库管理（ORDBMS）**。
* **【4分采分点】**：① 属类：统一存储管理海量空间几何与属性数据的专用数据库；② 核心难点：几何坐标变长非结构化、空间拓扑复杂与空间自相关；③ 演进路线：文件-关系混合 $\to$ 扩展关系型（SDE/BLOB） $\to$ 对象关系型（ORDBMS）；④ 设计须历经需求分析、概念设计、逻辑设计、物理设计与原型测试入库。

### 33. 空间数据的无缝组织（几何 / 逻辑 / 物理无缝）
* **标准定义**：**空间数据无缝组织**是为消除传统按行政区或标准图幅分幅、分块存储带来的跨图幅地理要素割裂与接边不一致问题，向用户提供连续、整体、透明空间视图的组织技术。主要通过三种途径实现：① **几何无缝**（所有分幅转换至统一坐标框架并完成精确几何接边处理）；② **逻辑无缝**（底层仍分幅分块存储，但借助空间索引与元数据视图由 GIS 平台在查询显示时动态拼接，对外呈现单库逻辑视图）；③ **物理无缝**（打散图幅界线，将全球或大区域实体统一连续存入大型空间数据库中，彻底消除分幅边界）。
* **【4分采分点】**：① 目的：消除分幅分块导致的跨幅要素割裂，提供连续透明访问；② 几何无缝：统一空间参考并完成边界几何与属性接边；③ 逻辑无缝：物理分块存储、索引动态关联呈现统一逻辑视图；④ 物理无缝：破除图幅物理界线，海量实体直接连续入库（依赖强索引）。

### 34. 空间数据库引擎（SDE：ArcSDE 与 Oracle Spatial 对比）
* **标准定义**：**空间数据库引擎（Spatial Database Engine，SDE）**是架设在商用大型关系数据库（RDBMS）与 GIS 前端应用之间、实现非结构化空间几何与关系表属性统一高效存取和并发控制的核心驱动中间件或内置扩展（1996 年 ESRI 首先推出）。典型对比：① **“中间件”型（如 ArcSDE）**：以独立服务层运行于数据库之上，**可完整维护复杂拓扑关系与空间几何网络**，并通过空间索引和特殊表结构实现空间属性无缝集成与长事务版本控制；② **“嵌入式”型（如 Oracle Spatial）**：直接在数据库内核扩展空间对象类型（如 `SDO_GEOMETRY`），适于点线面简单要素存储检索，但原生难以存储复杂拓扑网络。
* **【4分采分点】**：① 定位：打通大型 RDBMS 与 GIS 应用的中间驱动层或内核扩展引擎；② 解决非结构化变长空间数据在关系数据库中的统一存储、索引与并发访问；③ 中间件模式（ArcSDE）支持复杂拓扑关系、几何网络与长事务版本管理；④ 嵌入式模式（Oracle Spatial）原生支持简单要素 SQL 空间查询但拓扑能力弱。

### 35. 空间索引、MBR 与格网索引
* **标准定义**：**空间索引（Spatial Index）**是依据空间对象的位置、形状或空间关系按特定规则排序的辅助数据结构（存储对象标识、范围包络与实体指针），介于空间算法与底层实体之间，用于快速过滤无关目标、缩小磁盘 I/O 检索范围。其中，**对象范围索引（MBR 索引）**以每个实体在水平/垂直方向上的**最小外接矩形（Minimum Bounding Rectangle，MBR，仅存 $(X_{\min}, Y_{\min}, X_{\max}, Y_{\max})$ 四值）**作为粗过滤代理；**格网索引（Grid Index）**将研究区域划分为规则或多级网格，记录各网格包含或跨过的空间实体 ID 列表（如 ArcSDE 多级格网索引），检索极快但跨格大对象易产生重复指针。
* **【4分采分点】**：① 属类：加速空间范围查询与空间连接检索的辅助数据结构；② MBR（最小外接矩形）以极简四坐标快速粗过滤不相交实体；③ 格网索引通过空间规则剖分映射“格网-实体 ID”，定位时间近乎常数；④ 格网索引对分布极不均匀或跨格大对象存在冗余检索与格网尺度选择难点。

### 36. R 树与 $\mathrm{R}^+$ 树空间索引
* **标准定义**：**R 树（R-Tree）**是 B 树向多维空间自然推广的高度平衡树状索引结构，非叶节点存储其所有子节点边界的聚簇最小外接矩形（MBR）及子指针，叶节点指向真实空间对象 MBR 及数据指针，插入删除动态平衡，**允许兄弟节点的外接矩形互相重叠**，但检索可能需遍历多条分支路径；**$\mathrm{R}^+$ 树**在 R 树基础上**强制要求同层兄弟节点的最小外接矩形互不重叠**，当某空间实体跨越多个区域矩形时将其边界切分指向多个叶节点，从而保证点查询只需追踪单条根-叶路径，显著提升检索速度但增加了插入分裂与空间冗余。
* **【4分采分点】**：① R 树是平衡多维索引树，基于聚簇最小外接矩形（MBR）自底向上分层组织；② R 树允许中间节点 MBR 相互重叠，无实体冗余但点查询可能触发多路径回溯；③ $\mathrm{R}^+$ 树强制兄弟节点矩形互不重叠，跨越实体会被分割并冗余引用；④ $\mathrm{R}^+$ 树支持单路径快速点检索，但构建与动态维护代价高于 R 树。

## 模块六：第 6 章 空间数据采集与处理（6 条）

### 37. 地理配准与几何纠正（线性 / 仿射 / 多项式 / 橡皮页）
* **标准定义**：**地理配准（Georeferencing）与几何纠正**是通过建立原始图像/数字化图坐标 $(x, y)$ 与标准地理/投影坐标 $(X, Y)$ 之间的数学映射关系，消除扫描变形、比例尺误差与投影偏差并赋予数据真实地理坐标的过程（屏幕矢量化的前提）。核心方法包括：**线性（仿射）变换**（至少 4 个控制点，消除平移、旋转、缩放与错切变形，SuperMap 线性配准要求 $\ge 4$ 点）、**多项式变换**（拟合非线性扭曲，二次需 $\ge 6$ 点，SuperMap 实验建议 $\ge 10$ 点）、**三角网分片/橡皮页拉伸（Rubber-Sheeting）**（局部三角网分块微调用于图幅精确接边）。控制点应选清晰明显地物交点且**均匀分布于全图及四角**。
* **【4分采分点】**：① 目的：消除纸质扫描与传感器几何畸变，赋予栅格/矢量真实空间参考；② 核心模型：仿射/线性配准（$\ge 4$ 点）、多项式配准（高次需更多点）、分块橡皮页校正；③ 控制点选取铁律：点位清晰可辨（如交点/边界拐点）、数量充足且全局均匀覆盖；④ 需计算控制点中误差（RMS）调整刺点（可存为 `.drfu` 等配准文件复用）。

### 38. 栅格重采样（最邻近法 / 双线性内插法 / 双三次卷积法）
* **标准定义**：**栅格重采样（Resampling）**是在投影变换、几何配准或分辨率改变后，反算回原始栅格的浮点位置 $(i', j')$ 时，依据周围整数像元值重新计算新格网像元值的插值过程。三种经典算法：① **最邻近像元法**：直接取最近单个像元值赋入，速度最快且**严格保留原始离散分类值或光谱特征**，但易产生半像素偏移与锯齿；② **双线性内插法**：取周围 $2\times 2 = 4$ 个像元按距离反比线性加权，边缘光滑无锯齿，具一定低通平滑效应；③ **双三次卷积法**：利用周围 $4\times 4 = 16$ 个像元三次多项式卷积，精度最高、细节最锐利，但计算最慢且可能产生过冲值。
* **【4分采分点】**：① 目的：解决几何变换或尺度转换后非整数网格位置的像元重新赋值问题；② 最邻近法（1 点）：不改变原始灰度/分类编码，适合专题分类图但有锯齿；③ 双线性法（$2\times 2$）：精度与速度平衡，适合 DEM 与常规影像重采样；④ 双三次法（$4\times 4$）：保边缘锐度最佳但计算开销大，适合高清遥感影像制图。

### 39. 拓扑编辑与常见四类矢量拓扑错误
* **标准定义**：**拓扑编辑**是指利用节点捕捉、自动构面、打断与容差融合等手段检查并消除矢量数字化过程中产生的几何拓扑缺陷，确保多边形闭合且共享边唯一。最常见的四类矢量拓扑错误为：① **伪结点（Pseudo Node）**：本该连续的单条弧段上出现多余的 2 度节点（除非属性改变，应合并弧段）；② **悬挂结点（Dangling Node）**：线未接至目标线（**欠头/短头 Undershoot**）或伸出目标线外（**过头/长头 Overshoot**）形成的孤立端点，在容差范围内裁剪或延伸捕捉修复；③ **碎屑多边形（Sliver Polygon）**：因边界数字化误差或不同精度图层叠置沿公共边界产生的狭长无用小面，可按面积/宽长比或模糊容差消除；④ **不正规多边形（Weird Polygon）**：因顶点自相交（“8”字形反转）或未闭合导致面积方向异常的多边形。
* **【4分采分点】**：① 伪结点：非交汇分叉处的冗余中间节点；② 悬挂结点：线未闭合或过冲/欠冲形成的悬空端点（影响构面与路网连通）；③ 碎屑多边形：公用边微偏或叠加产生的狭长伪面（模糊容差与合并去除）；④ 不正规多边形：边界自相交或逆序引发的无效多边形（数字化开启捕捉预防）。

### 40. 道格拉斯-普克（Douglas-Peucker）矢量线简化算法
* **标准定义**：**道格拉斯-普克法**（1973 年提出）是目前公认保留曲线形态特征最优秀的递归矢量线压缩/化简算法。核心步骤：① 在曲线首末两点间虚连一条直线段；② 计算曲线上所有中间顶点到该直线的垂直距离，找出最大垂距 $d_{\max}$；③ 若 $d_{\max} < L$（预设阈值），则将首末点间全部中间点舍去；④ 若 $d_{\max} \ge L$，则保留该最大垂距点作为分裂拐点，将原曲线切分为两段并**递归重复步骤 ①～③**，直至所有子段均满足阈值要求。阈值 $L$ 越大压缩比越高、细节损失越多。
* **【4分采分点】**：① 属类：全局分治递归的矢量线状要素节点抽稀压缩算法；② 判据：连接首末点成弦，计算各中间顶点至弦的垂直距离并与阈值 $L$ 比较；③ 分裂机制：小于 $L$ 全舍，大于等于 $L$ 则于最大垂距点分裂为两段递归执行；④ 优点：高度保留特征拐点、旋转与尺度不变；阈值 $L$ 权衡压缩比与形态保真。

### 41. 空间数据质量评价（五项指标）与误差传播
* **标准定义**：**空间数据质量**是指空间数据对特定分析与应用需求的适用程度（衡量标准：准确性、精密度、分辨率、比例尺、误差、不确定性）。国家与国际标准通常从**五大核心质量元素**进行评价（含直接验收检测与间接预估评价）：① **数据完整性**（实体、属性、关系的冗余与遗漏）；② **逻辑一致性**（数据结构、拓扑规则、属性域约束的符合度）；③ **位置精度**（平面与高程绝对/相对坐标接近真值程度）；④ **时间精度**（现势性与时间标注准确度）；⑤ **属性精度**（定量值精度与定性分类正确性）。误差按性质分为随机误差、系统误差与粗差，且会在采集、转换、叠置等处理流程中不断累积与传播。
* **【4分采分点】**：① 空间数据质量指数据对特定应用分析的适用度（准确度 vs 精密度）；② 五大评价指标：完整性、逻辑一致性、位置精度、时间精度、属性精度；③ 评价途径分直接评价（抽样/全检验收）与间接评价（溯源误差传播预估）；④ 质量控制贯穿源选、限差数字化、拓扑校验与入库元数据全过程。

### 42. 元数据（Metadata）及其作用
* **标准定义**：**元数据（Metadata）**即“关于数据的数据”，是用于系统描述地理空间数据集的标识、内容、覆盖范围、数据质量、空间参考系、表示方式、管理与分发方式及更新历史等信息的标准化描述记录（经典代表为美国 FGDC 颁布的 CSDGM 第二版，包含 **7 个主要子集和 3 个次要子集，共 460 个元素**，以及 ISO 19115）。其核心作用包括：① 帮助用户快速检索、理解与评价数据适用性；② 支撑全流程空间数据质量控制与误差溯源；③ 规范异构多源数据集成与转换；④ 实现跨部门空间数据共享与网络目录服务（CSW）。
* **【4分采分点】**：① 定义：描述空间数据集内容、质量、空间参考与管理特征的“数据的数据”；② 代表标准：FGDC CSDGM（7 主 3 次共 460 元素）及国际标准 ISO 19115；③ 核心作用：数据发现与适用性判断、质量追踪、异构集成与共享互操作；④ 是空间数据入库成果库与 Web 目录检索的必备伴生档案。

## 模块七：第 7 章 GIS 基本空间分析（6 条）

### 43. 空间度量（梯形面积法、凸包与距离量算）
* **标准定义**：**空间度量**是定量计算空间对象几何形态、距离与方向的基础空间分析。① **矢量多边形面积（梯形法）**：沿多边形顶点顺序逐边计算与坐标轴围成的有向梯形面积并求代数和 $S = \frac{1}{2} \sum_{i=0}^{n-1} (x_{i+1}-x_i)(y_{i+1}+y_i)$（含内岛则外包面积减内岛面积）；② **最小边界几何**：包括**凸包**（包含所有点集的最小凸多边形）与**最小外接矩形（MBR）**；③ **空间距离量算**：匀质空间区分**欧氏距离** $\sqrt{\Delta x^2 + \Delta y^2}$ 与**曼哈顿距离** $\lvert \Delta x \rvert + \lvert \Delta y \rvert$（棋盘/城市街区路径）；非匀质空间则采用顾及摩擦阻力的**函数（成本/加权）距离**。
* **【4分采分点】**：① 矢量面积常用顶点序列梯形法代数和（带孔洞为外减内），栅格面积用像元计数；② 凸包是包围离散点集的最小凸多边形，MBR 是沿坐标轴方向的最小包络矩形；③ 匀质空间常见欧氏直线距离与曼哈顿（街区折线）距离；④ 非匀质空间根据通行代价（如坡度、用地阻力）计算各向同性/异性函数距离。

### 44. 矢量叠置分析（Union / Intersect / Erase / Identity）
* **标准定义**：**矢量叠置分析**是将同一坐标系统与相同基准面下的多个主题图层在空间上叠加，历经**“几何求交打断 $\to$ 拓扑重构 $\to$ 属性传递”**三阶段生成融合双方几何边界与双层属性表的新图层（按几何类型分点与多边形、线与多边形、多边形与多边形叠置）。常见集合算子：① **并（Union，$A \cup B$）**：保留 $A$ 与 $B$ 全部几何范围及双层属性；② **交（Intersect，$A \cap B$）**：仅保留 $A$ 与 $B$ 共同重叠区域及双方属性；③ **擦除（Erase，$A - A \cap B$）**：从 $A$ 中挖除落入 $B$ 范围的部分，保留其余部分及 $A$ 属性；④ **标识/同一（Identity，SuperMap 称“同一”）**：保留 $A$ 全部空间范围，仅对与 $B$ 重叠子区附加 $B$ 属性（非重叠区 $B$ 属性为空）。叠加时应设模糊容差消除**碎屑多边形**。
* **【4分采分点】**：① 前提：统一坐标系与空间基准；核心三步为几何求交、拓扑重构、属性传递；② Union（$A\cup B$）全保留；Intersect（$A\cap B$）取共同交集并继承双属性；③ Erase（$A - A\cap B$）挖去排除区；Identity/同一保留 $A$ 几何并在交集处挂接 $B$ 属性；④ 注意设置模糊容差消除边界数字化偏差引起的碎屑多边形。

### 45. 栅格叠置分析（地图代数与重分类）
* **标准定义**：**栅格叠置分析**（地图代数局部运算）在位置严格配准的多层同分辨率栅格数据间，逐像元按照代数、逻辑或条件函数 $E_{i,j} = f(A_{i,j}, B_{i,j}, \dots, N_{i,j})$ 计算生成新栅格图层。常与**栅格重分类（Reclassify）**配合使用：将连续数值或冗余多类别栅格按规则归并赋值为简洁整数或布尔掩膜（如 `0/1` 适宜性二值图），再通过栅格相乘/加权叠加快速筛选满足多条件约束的空间区域（如通用土壤流失方程 USLE 因子逐像元连乘、选址适宜性评价模型）。
* **【4分采分点】**：① 本质：基于严格空间配准的多图层逐像元一一对应代数/逻辑运算；② 数学模型：$E_{i,j} = f(L_1, L_2, \dots, L_n)$（算术、关系、布尔及加权叠加）；③ 关键配合：重分类（Reclassify）将连续/多类转为离散等级或 `0/1` 掩膜；④ 优点是算法简洁极快（无拓扑求交与碎屑问题），缺点是依赖分辨率且数据量大。

### 46. 缓冲区分析（Buffer Analysis）
* **标准定义**：**缓冲区分析**是根据点、线、面空间实体的几何形状与给定距离（定常半径或属性字段变半径），在其周围自动向外（或向内、内外两侧）生成一定宽度带状影响区，用以定量解决**空间临近度与辐射影响范围**问题的空间分析方法。**矢量缓冲**对点生成圆、对线生成双侧平行边带（分**圆头缓冲**与**平头缓冲**，并可设左右不等半径）、对面区分**外缓冲区、内缓冲区与内外缓冲区**（常需融合消除自相交叠区）；**栅格缓冲**主要通过计算全区像元至源目标的**欧氏距离栅格**或**成本加权距离栅格**后再行重分级截断获取。
* **【4分采分点】**：① 核心功能：根据点/线/面实体构建指定宽度带状影响区，解决临近度问题；② 矢量线缓冲支持等距/字段变距、圆头/平头与左右不等距，面缓冲分内/外/内外缓冲；③ 栅格缓冲借助欧氏距离栅格或成本距离栅格结合阈值重分类生成；④ 常与叠置分析及空间查询联合用于噪声保护区、道路拆迁与选址避让分析。

### 47. 窗口分析（邻域分析：Focal vs Block 与滤波运算）
* **标准定义**：**窗口分析（邻域分析）**是在栅格数据系统中开辟具有固定半径和形状（矩形、圆形、环形、扇形等）的移动窗口，对窗口内像元执行统计或函数计算并将结果赋回对应输出像元的水平方向扩展分析技术。按窗口移动方式分为：**焦点统计（Focal Statistics）**（窗口逐像元滑动、窗口彼此重叠，保持原细粒度）与**块统计（Block Statistics）**（将栅格切为互不重叠块，整块共赋统一统计值）。运算含**统计运算**（Mean/Max/Min/Median/Sum/Range/Majority/Std 等）与**函数运算**（如 $3\times 3$ 权重均取 $1/9$ 的**低通平滑滤波**去异常噪点，以及突出陡变边缘的**高通边缘增强滤波**）。
* **【4分采分点】**：① 原理：依托空间相关性，通过固定形状（矩形/圆形/环形/扇形）移动窗口扩展栅格特征；② 区分 Focal（逐像元重叠滑动赋值）与 Block（互不重叠分块整体赋值）；③ 统计运算含极值、均值、中值、极差（求起伏度）、众数、标准差等；④ 函数运算含低通滤波（$1/9$ 均权平滑去噪）、高通滤波（边缘增强）及坡度坡向差分。

### 48. 空间网络分析（构成要素、最佳路径与 TSP）
* **标准定义**：**空间网络分析**是以图论与网络拓扑关系（连通性与转向阻力）为基础，对抽象为**链（边）、结点、中心（源/汇）、站点、拐角点与障碍**的空间线网模拟资源流动并实现优化决策的分析技术。核心应用包括：① **最佳（最短）路径分析**：给定起终点及必经中间点与障碍，基于 **Dijkstra** 等算法沿弧段阻力累加寻求总耗费最小路径；② **旅行商问题（TSP）**：从某点出发访问一系列无固定顺序要求的目标点并求总阻力最小的次序；③ **资源分配与服务区分析**：按中心容量与最大阻力半径（如 3/5/10 分钟或 $1000\ \mathrm{m}$ 路网可达范围）划定各中心覆盖路网域；④ **地址匹配**（门牌号空间定位）。
* **【4分采分点】**：① 六大组成：链、结点、中心、站点、拐角点、障碍，并配置单双向阻力与拐角阻力；② 构建前提：必须经过拓扑检查与构网（建立结点-链连通关系与拓扑容限）；③ 最佳路径（Dijkstra）求解指定有序节点最小阻力路径，TSP 侧重自动优化多点访问顺序；④ 广泛用于紧急救援选径、设施服务区划定、物流配送与管网爆管关阀分析。

## 模块八：第 8 章 DEM 与数字地形分析（5 条）

### 49. 数字高程模型（DEM）与数字地形分析（DTA）
* **标准定义**：**数字高程模型（Digital Elevation Model，DEM）**是通过有限的地形高程数据实现对地球表面地形形态的数字化模拟与连续函数离散表达，数学上定义为二维空间连续高程函数 $H = f(x, y)$（若进一步包含坡度、水文、土地利用等地物因子则统称 **DTM**；若包含树冠、建筑屋顶等表层高程则称 **DSM**）。**数字地形分析（Digital Terrain Analysis，DTA）**是在 DEM 基础上自动提取**地形曲面参数**（坡度、坡向、曲率）、**地形形态特征**（山顶、脊谷线、流域）、**地形统计特征**与**复合水文地貌指数**的信息处理技术。
* **【4分采分点】**：① DEM 数学定义为 $H = f(x, y)$ 的离散地形高程数字化模拟；② 区分 DEM（裸露地面高程）、DSM（含房树表层包络）与 DTM（广义多维地面信息）；③ 主要组织结构为规则格网 DEM（Grid）与不规则三角网（TIN）；④ DTA 在 DEM 上派生坡面因子、特征线网、流域参数与可视域辅助工程决策。

### 50. 坡度、坡向与地形曲率
* **标准定义**：反映地表微地貌斜率与弯曲变化的基本坡面地形因子（通常在规则格网 $3\times 3$ 局部窗口中利用有限差分计算南北向高程变率 $f_y$ 与东西向高程变率 $f_x$）：① **坡度（Slope）**：地表单元过该点的切平面与水平面的夹角（即表面法线与铅垂线夹角），公式为 $S = \arctan\sqrt{f_x^2 + f_y^2}$（单位：度 $[0^\circ, 90^\circ]$ 或百分比）；② **坡向（Aspect）**：地表法线在水平面上投影与正北方向沿顺时针的夹角（$[0^\circ, 360^\circ)$，正北为 $0^\circ$、正东 $90^\circ$、正南 $180^\circ$、正西 $270^\circ$，平地无坡向记为 $-1$，北半球南坡为阳坡）；③ **地形曲率**：地面扭曲变化程度的二阶导数度量，沿最大坡降方向为**剖面曲率**（影响流速加速与侵蚀沉积），沿等高线切向为**平面曲率**（影响径流汇聚与发散）。
* **【4分采分点】**：① 坡度是法线与铅垂线夹角（$S = \arctan\sqrt{f_x^2+f_y^2}$），决定坡面水流动力；② 坡向是法线水平投影相对正北的顺时针方位角（$[0^\circ, 360^\circ)$，决定日照阴阳坡）；③ 曲率是地形表面的二阶导数弯曲度；④ 剖面曲率沿坡线方向控制径流加减速，平面曲率沿等高线方向控制径流汇散。

### 51. 宏观地形因子（起伏度 / 地表粗糙度 / 切割深度）
* **标准定义**：在大尺度窗口内刻画区域地貌破碎程度与水土流失侵蚀发育阶段的宏观地形因子：① **地形起伏度（Relief Amplitude）**：指定分析窗口内所有栅格最高海拔与最低海拔的差值 $H_{\max} - H_{\min}$，直观指示宏观地势高差；② **地表粗糙度（Surface Roughness）**：地表单元真实曲面面积与其在水平面上投影面积之比 $R = S_{\text{曲面}} / S_{\text{水平}}$，在 $3\times 3$ 窗内常近似表示为坡度的余弦倒数 $R \approx 1 / \cos S$（平坦地表 $R = 1$）；③ **地表切割深度（Cutting Depth）**：地面某点指定邻域范围的平均高程与最小高程之差 $H_{\text{mean}} - H_{\min}$，定量表征地表受流水下切侵蚀的程度。
* **【4分采分点】**：① 起伏度为邻域最大高程与最小高程差（$H_{\max} - H_{\min}$）；② 地表粗糙度为曲面面积与水平投影面积之比（近似 $1 / \cos S$）；③ 切割深度为邻域平均高程与最小高程差（$H_{\text{mean}} - H_{\min}$）；④ 三者共同用于水土流失评估、地貌类型区划与工程选线难度评价。

### 52. 基于 DEM 的流域分析与 D8 算法
* **标准定义**：**流域分析**利用地表径流漫流模型从规则格网 DEM 自动提取集水区边界、水流方向与河流网络的技术，核心四步流程为：**① 洼地填充（Fill Sinks）**（消除内插噪声导致的伪洼地保证径流连通）；**② 水流方向确定（D8 最大坡降算法）**：计算中心像元向 8 个邻域像元的距离权落差 $D = \Delta Z / L_i$（正交距 $L_i = 1$，对角距 $L_i = \sqrt{2}$），将水流唯一指向最大正落差方向并编码为 `2^0~2^7`（**1东、2东南、4南、8西南、16西、32西北、64北、128东北**）；**③ 汇流累积量矩阵计算**：累计流经每个像元的上游全部栅格数；**④ 河网与流域提取**：设定汇流阈值提取河网，配合出水口逆向追踪集水区边界。
* **【4分采分点】**：① 预处理必经“洼地填充”消除假闭塞洼地确保水流贯通；② D8 算法按最大距离权落差 $\Delta Z / L_i$（对角除以 $\sqrt{2}$）确定单一邻域流向；③ 流向采用 2 的幂次编码（1 东至 128 东北）；④ 统计上游汇流累积量并设置阈值划分河网水系与集水流域边界。

### 53. 可视性分析（两点通视与可视域分析）
* **标准定义**：**可视性分析（Visibility Analysis）**又称通视分析，基于 DEM 地形表面几何遮挡原理判断地形视线可达性的最优化分析，包含两类基本分析：① **两点通视分析（Line of Sight / Intervisibility）**：沿观察点 $O$（地面高程 + 附加观察高程）与目标点 $P$ 连线采样地形剖面，若中间各地形点对观察点的仰角均小于 $OP$ 连线仰角（或视线剖面均位于地形表面上方）则通视，否则被地形遮挡；② **可视域分析（Viewshed）**：以给定单点或多点为视点，结合观察高度、搜索半径及视角限制，在 DEM 上遍历计算所有通视像元组成的连续可见区域。广泛用于森林防火瞭望塔、通信基站、军事雷达及景观规划选址。
* **【4分采分点】**：① 分类：线状“两点通视分析”与面状“可视域（Viewshed）分析”；② 视点总高程为地面高程叠加塔高/人眼等附加高程；③ 数学判据：中间任一地形剖面点仰角均不超过视点至目标连线仰角（无地形凸起截断视线）；④ 常用于通信基站覆盖、瞭望塔选址、雷达盲区评估与景观视线控制。

## 模块九：第 9 章 GIS 空间统计分析（6 条）

### 54. 探索性空间数据分析（ESDA）与空间自相关（Moran's I）
* **标准定义**：**探索性空间数据分析（ESDA）**是结合空间可视化与统计图表检验数据分布、识别离群异常值、探测全局趋势并揭示空间依赖性的前沿统计诊断方法（常用工具：直方图、正态 QQ 图检验克里金正态前提、趋势分析透视图、半变异云图）。**空间自相关**源于 Tobler 地理学第一定律（“一切事物都相关，距离越近相关性越强”），定量衡量同一属性在相邻空间位置间的聚集或离散程度。最核心全局指标为 **Global Moran's I**：值域近似 $[-1, 1]$，结合 $z$ 得分与 $p$ 值检验，**$I > 0$ 且显著表示正相关（高-高/低-低聚集），$I < 0$ 表示负相关（高-低相间离散），接近期望值 $E[I] = -1/(n-1)$ 表示空间随机分布**；配合 Local Moran's I 可探测局部高值聚类与空间异常点（HH/LL/HL/LH）。
* **【4分采分点】**：① ESDA 通过直方图、QQ 图与全局趋势等工具探查分布特征、离群值与空间依赖；② 空间自相关定量表达地理学第一定律（近邻属性相似程度），依赖空间权重矩阵 $W_{ij}$；③ Global Moran's I 显著大于 0 为空间正聚集，小于 0 为分散负相关，近 0 为随机；④ 配合 $z$ 得分和 $p$ 值检验统计显著性，Local Moran's I 识别局部聚簇与异常点。

### 55. Getis-Ord $G_i^*$ 热点分析
* **标准定义**：**Getis-Ord 统计量**是用于探测高值或低值属性要素空间集聚程度的专门指标。其中局部统计量 **$G_i^*$（热点分析，Hot Spot Analysis）**对每个空间要素及其邻域范围内的要素属性值进行局部分析，通过输出具有统计显著性的 **$z$ 得分和 $p$ 值**进行判别：若某要素及其周围邻域均值显著高于全局平均，产生高度显著的正 $z$ 得分，则为**高值空间集聚“热点”（Hot Spot）**；若呈现高度显著的负 $z$ 得分，则为**低值空间集聚“冷点”（Cold Spot）**。常用于犯罪高发区、传染病聚集区与城市商业活力热区识别。
* **【4分采分点】**：① 属类：基于距离或邻接权重矩阵的局部空间高低值聚类分析指标；② 不同于 Moran's I 仅看相似度，$G_i^*$ 明确区分“高值聚集”与“低值聚集”；③ 显著正 $z$ 得分对应高值簇“热点”，显著负 $z$ 得分对应低值簇“冷点”；④ 单独的高值要素若周围无高值邻域响应，不能构成统计显著热点。

### 56. 半变异函数（块金值 / 基台值 / 偏基台值 / 变程）
* **标准定义**：**半变异函数（Semivariogram）** $\gamma(h) = \frac{1}{2N(h)} \sum [Z(x_i) - Z(x_i+h)]^2$ 是地统计分析（克里金插值）中将地理学相近相似规律定量化的核心函数（横轴为样点间距 $h$，纵轴为半变异值）。图中包含 **4 个关键参数**：① **块金值（Nugget，$C_0$）**：$h \to 0$ 时的非零截距，反映仪器测量误差与小于采样尺度的微观空间变异；② **基台值（Sill，$C_0 + C$）**：随距离 $h$ 增大，$\gamma(h)$ 趋近平稳后的常数上限，代表系统总变异；③ **偏基台值（Partial Sill，$C$）**：基台值减去块金值，反映结构性空间变异强度；④ **变程（Range，$a$）**：$\gamma(h)$ 达到基台值时的采样点间距，标志**空间相关性的最大有效作用距离**（$h > a$ 时样点间不再相关，不可用于内插或外推）。
* **【4分采分点】**：① 半变异函数定量刻画区域化变量随采样间距 $h$ 增大的空间变异度；② 块金值（$h=0$ 截距）由测量误差与亚采样尺度随机变异引起；③ 基台值是函数趋稳上限，偏基台值（基台减块金）衡量空间结构相关性部分；④ 变程是空间相关性的有效作用边界，超出变程的样本不再用于内插。

### 57. 反距离加权插值（IDW）与克里金插值（Kriging）
* **标准定义**：两种最核心的 GIS 空间连续表面内插方法：① **反距离加权法（IDW）**：属**确定性逐点内插法**，假设待插点受邻近已知点影响随距离增大而按幂次 $p$ 衰减，估计值为邻域样点值的加权平均（权重 $w_i = d_i^{-p} / \sum d_j^{-p}$），计算极快、精度严守极值区间不越界，但对聚类点与极端高程易生“牛眼”状且无法估计误差；② **克里金法（Kriging）**：由 Matheron 与 Krige 创立的**地统计学最佳线性无偏估计（BLUE）**方法，基于半变异函数同时顾及样点距离与空间方向结构相关性确定最优权重，不仅插值精度高、能平滑局部极值并给出估计方差图，还分**普通克里金（均值未知常数）、简单克里金（均值已知）、泛克里金（含确定性空间漂移趋势）**等变体，常要求数据近似正态分布。
* **【4分采分点】**：① IDW 属确定性逐点插值，权重严格反比于距离幂次 $d_i^{-p}$，速度最快；② IDW 估值必介于样本极值之间，孤立点附近易现“牛眼”现象且无误差评估；③ 克里金基于半变异函数实现最佳线性无偏估计（BLUE），同时输出预测方差图；④ 常用普通/简单/泛克里金，要求评估空间自相关与分布正态性，计算开销较大。

### 58. 自然断裂法（Jenks）与核密度估计（KDE）
* **标准定义**：① **自然断裂法（Jenks Natural Breaks）**是空间数据分级统计与专题图分段的核心分类方法，利用聚类优化思想寻找数据分布频率中的自然转折点（裂点），**最大化类间方差（组间差异）同时最小化类内方差（组内差异）**，使同一级别要素最具相似性；② **核密度估计（Kernel Density Estimation，KDE）**是一种非参数空间点/线密度聚类平滑方法，以每个要素点为中心在指定搜索半径（带宽 $h$）内构造随距离衰减的光滑核函数，将落入任一栅格中心带宽内的全部要素核值累加，生成连续光滑的热力密度表面（如城市商业热点、百度热力图）。
* **【4分采分点】**：① 自然断裂法基于数据分布自然拐点分组，实现类内差异最小、类间差异最大；② 极适于非均匀偏态分布专题数据的有效区间分割（结果不适用于跨图直接对比）；③ 核密度估计依托核函数与带宽在空间上将离散点/线平滑为连续密度场；④ 带宽（搜索半径）越大表面越平滑宏观，带宽越小则越突出局部微观聚类。

### 59. 地理加权回归（GWR）与地理探测器（Geodetector）
* **标准定义**：揭示空间要素关联驱动机制的两大高级空间统计建模工具：① **地理加权回归（GWR）**：针对全局普通最小二乘法（OLS）假设回归参数空间恒定而忽略**空间非平稳性**的缺陷，将要素空间位置坐标 $(u_i, v_i)$ 嵌入回归系数中，对研究区每一个局部位置构建带空间距离衰减权重的**局部线性回归方程** $y_i = \beta_0(u_i, v_i) + \sum_k \beta_k(u_i, v_i) x_{ik} + \varepsilon_i$，从而揭示自变量影响强度随地理位置变化的差异；② **地理探测器（Geodetector）**：我国学者王劲峰等提出的探测空间分异性并揭示驱动因子的非参数统计方法（核心统计量 $q = 1 - \dfrac{\sum N_h \sigma_h^2}{N \sigma^2} \in [0, 1]$），**擅长直接探测定性类别数据且无需线性假设**，包含**分异及因子探测、交互作用探测、风险区探测与生态探测**四个模块。
* **【4分采分点】**：① GWR 将空间坐标融入回归系数，是克服空间非平稳性的局部回归模型（对比全局 OLS）；② GWR 可视化各位置解释变量系数的空间差异，预测精度显著优于全局回归；③ 地理探测器基于 $q$ 值定量度量空间分异性与自变量对因变量分布的解释力；④ 地理探测器含分异因子、交互、风险与生态四探测器，天然兼容定性变量且免疫多重共线性。

## 模块十：第 10 章 地理信息可视化（4 条）

### 60. 地图符号与视觉变量（Bertin 及教材分类）
* **标准定义**：**视觉变量（Visual Variables）**是地图上能够引起视觉感知变化、构成地图符号的基本图形与色彩要素（法国学者 Bertin 经典提出形状、大小、方向、亮度、纹理、颜色六大变量）。《地理信息系统教程》按表达信息性质将其划分为两类：**定性视觉变量**（主要表达类别差异，含**形状**——具可视化隐喻效果、**色调/色相**——最适合线面等非点状类别区分）与**定量视觉变量**（主要表达数量等级与大小差异，含**大小/尺寸、方向、透视高度、属性值/色彩深浅、亮度、饱和度**；字体大小与粗细亦具定量视觉变量功能）。
* **【4分采分点】**：① 视觉变量是地图符号传递空间与属性编码的基本图形色彩维度；② 定性变量（形状、色调）区分要素类别，其中形状具直观隐喻性，线面分类首选色调；③ 定量变量（大小、方向、透视高度、亮度、饱和度等）表达数量级与序次差异；④ 正确匹配要素几何类型与定性/定量变量是保证专题图易读性与准确传达的前提。

### 61. 绝对数据与派生数据制图原则及专题图类型
* **标准定义**：专题地图制图必须严格区分**原始绝对数据**（如各县总人口）与**加工派生数据**（如人口密度、人均 GDP）：对面积不等的行政单元填绘**等值区域图（分级设色面图）**时，大面积区域天然产生更大视觉权重而歪曲数量对比，故**等值区域图必须用于表达面积归一化的派生比率数据（如人口密度）**，而**绝对总量数据应采用点状分级符号图、饼状/柱状统计图或点值法表达**。常见专题图类型还包括**单值专题图、多值专题图、等级符号图、点描法图和统计图表图**。
* **【4分采分点】**：① 原始绝对数据（如总人口、GDP 总量）易受行政区面积大小视觉干扰；② 派生数据（比率/密度/人均指标）消除了面积尺度偏差；③ 铁律：等值区域（分级填色）图专用于派生比率数据，分级符号/统计图/点值法用于绝对数据；④ 专题图只在底图上详尽突出 1～2 种主题要素并可动态刻画时空演变趋势。

### 62. 地图图面配置四原则与制图要素安排
* **标准定义**：**图面配置**是在有限幅面内对地图要素进行科学排版设计的视觉工程，应遵循四大核心原则：① **主题突出**（将主图焦点置于略高于几何中心的**地图光学中心**，并强化线划色彩对比）；② **图面平衡**（各要素重量、大小、色彩视觉分布协调，忌贴近图廓过紧过暗）；③ **图形-背景**（利用熟悉轮廓、色彩及留白提高图形-背景比率以衬托主体）；④ **视觉层次**（通过**插入、再分结构与对比**将重要要素置于视觉顶层）。标准地图配置内容必须齐全：**主图（含移图与扩大图）、副图（位置/补充图）、图名（区域+主题+时间）、图例、比例尺（宏观小比例尺可省）、指北针（非正北上向必加）与内外图廓参考格网**。
* **【4分采分点】**：① 四大原则：主题突出（置光学中心）、图面平衡、图形-背景比、视觉层次；② 视觉层次通过插入遮挡、主次再分结构（色相配纹理）与对比度构建；③ 标准制图构成：主图、副图、图名、图例、比例尺、指北针、图廓与经纬/方里格网；④ 注记需协调规范：水系斜体、政区粗体，点名右上、线名顺向、面名跨区居中。

### 63. 分层设色、地形晕渲与细节层次模型（LOD）
* **标准定义**：GIS 连续地形与三维可视化的核心表达形式：① **分层设色法**：在等高线间划分高程带并按由低到高色谱（绿 $\to$ 黄 $\to$ 棕 $\to$ 白，水下浅蓝 $\to$ 深蓝）填绘，兼具高程分级判读与立体感；② **地形晕渲法（Hillshade）**：模拟光源照射 DEM 计算坡面阴影明暗色调展示三维起伏，按光源分**斜照晕渲**（立体感最强，常用西北 315° 光源，背阴难比坡度）、**直照晕渲**（坡度晕渲，能比坡度但立体感差）与**综合光照晕渲**（结合二者）；③ **细节层次模型（LOD）**：三维大规模场景渲染关键优化技术，根据视点距离动态调度不同精度的地形/建筑网格与纹理模型，兼顾近景逼真与实时动态漫游帧率。
* **【4分采分点】**：① 分层设色依托等高线分层并按自然色序填色，立体醒目直观；② 斜照晕渲立体结构感最强，直照晕渲精确反映坡度差异，综合晕渲兼顾二者；③ 晕渲图常以半透明叠加彩色 DEM 分层设色图增强地貌表现力（SuperMap 实验 3D）；④ LOD 根据视距动态切换多精度三维模型，突破海量三维场景实时渲染瓶颈。

## 模块十一：第 11 章 网络 GIS 与地理信息服务（5 条）

### 64. 网络 GIS 架构（C/S 模式 vs B/S 模式与瘦客户端）
* **标准定义**：**网络地理信息系统（WebGIS / Network GIS）**是将互联网通信协议与分布式计算融入空间信息共享与处理的服务系统（广义包含局域网至云端的全部网络架构体系，狭义分 C/S、B/S、Web Service、移动嵌入式与 Grid GIS）。① **C/S（客户/服务器）模式**：服务器集中管库、复杂分析计算分散在专用胖客户端，局域网响应快、交互强但维护升级繁琐、跨平台性差；② **B/S（浏览器/服务器）模式（即 WebGIS 核心）**：以通用浏览器作为**瘦客户端**（无需安装专用软件、主要负责请求发起与结果渲染，核心 GIS 运算由云/服务端承担），通过 HTTP 协议全球跨平台透明共享数据与功能，极大降低维护成本并大众化 GIS。
* **【4分采分点】**：① C/S 模式面向局域网专用胖客户端，分析强、响应快但部署维护与跨平台性差；② B/S 模式以通用 Web 浏览器为瘦客户端，跨平台、免安装、易扩展且服务大众；③ 瘦客户端几乎不承担本地繁重地理计算，核心服务与存储集中部署于服务器端；④ 现代云 GIS 进一步整合门户控制层、微服务云端与桌面/Web/移动端统一应用层。

### 65. Web Service 与 OGC OWS 互操作规范
* **标准定义**：**Web Service** 是建立在开放 Internet 标准上的松散耦合跨平台可编程逻辑组件，依托 **SOAP**（简单对象访问协议用于调用）、**WSDL**（服务描述语言）、**UDDI**（统一描述发现与集成）实现异构语言与平台透明互操作。在此基础上，开放地理空间信息联盟（OGC）制定了 **OWS（OGC Web Services）**开放互操作框架，依托 XML 与 HTTP 技术标准化分布式的空间数据发现、访问、处理与渲染接口，彻底打破不同厂商 GIS 软件格式封闭壁垒。
* **【4分采分点】**：① Web Service 依托 SOAP/WSDL/UDDI 实现跨平台跨语言的松散耦合接口调用；② OGC 是制定全球开放地理空间互操作标准的国际权威联盟；③ OWS（OGC Web Services）将空间数据、处理与位置服务标准统一至 Web 服务框架；④ 核心价值在于破除异构 GIS 平台与数据格式孤岛，实现网络环境下数据与功能共享。

### 66. OGC 核心地理信息网络服务标准（WMS / WFS / WCS / WMTS / WPS / GML）
* **标准定义**：OGC OWS 框架下最重要的一组空间信息接口与编码标准：① **WMS（网络地图服务）**：在服务器端动态渲染生成静态栅格地图图片（PNG/JPEG）返回客户端浏览；② **WMTS（网络地图瓦片服务）**：按预切固定尺度瓦片矩阵提供高并发缓存地图服务；③ **WFS（网络要素服务）**：直接返回带有完整坐标几何与属性结构的矢量要素数据（GML/GeoJSON），支持要素级查询与在线事务编辑（WFS-T）；④ **WCS（网络覆盖服务）**：返回未渲染的原始多波段遥感影像、DEM 等科学栅格像元矩阵供数值计算；⑤ **WPS（网络处理服务）**：发布远程缓冲区、叠置等在线空间分析算子；⑥ **GML（地理标记语言）**：基于 XML 的空间数据编码与传输规范（CSW 则负责元数据目录检索）。
* **【4分采分点】**：① WMS 动态生成只读地图图片，WMTS 分发静态预切瓦片以换取极致高并发；② WFS 传输底层矢量要素坐标与属性（支持要素编辑），WCS 传输原始数值栅格覆盖；③ WPS 提供标准化的远程在线空间分析模型与处理算子；④ GML 是基于 XML 的空间几何与属性编码传输通用语言。

### 67. 空间信息网格（Grid GIS）与“4A”服务目标
* **标准定义**：**基于 Grid 的网络地理信息系统（网格 GIS / 空间信息网格 SIG）**是将分布于广域网中的异构高性能计算机、海量空间数据服务器与软件分析资源，基于网格计算技术虚拟化集成成对用户透明的超级协同计算处理基础设施（采用 W3C 标准并支持 HTTPS/SSL，可跨防火墙协同并行计算）。其核心愿景是实现空间信息服务的 **“4A”目标**：来自任何信息源的任意地理事件信息（**Anyevent**）经处理后，能在任意时刻（**Anytime**）安全发送给处于任意地点（**Anywhere**）的任何有需求及权限的用户（**Anyone**）。
* **【4分采分点】**：① 属类：依托网格计算架构集成广域异构算力与存储的分布式空间基础设施；② 不同于 WebGIS 偏重现有网络数据展示，Grid GIS 侧重计算、存储与知识资源全面协同共享；③ 具备强大并行处理能力，可突破防火墙并依托透明接口执行大规模空间计算；④ 终极服务愿景是实现“Anyevent、Anytime、Anywhere、Anyone”的 4A 目标。

### 68. 云 GIS 与基于位置的服务（LBS）
* **标准定义**：① **云 GIS（Cloud GIS）**：将云计算虚拟化、弹性伸缩与海量时空大数据流处理能力融入 GIS，形成“云端服务层（存储/分析/实时接入）+ 门户控制层（Portal 鉴权整合）+ 多端应用（桌面/Web/移动）”一体化平台，代表如 SuperMap iServer/Online 与 ArcGIS Enterprise；② **基于位置的服务（Location-Based Service，LBS）**：在移动无线通信环境下，综合运用 **GIS 技术、GNSS/无线空间定位技术与移动通信网络**，根据移动终端实时上传的位置坐标与业务需求，由云端/中心 GIS 服务器完成空间查询分析并回传可视化结果的实时服务，主要分为**位置查询、轨迹监控与实时导航**三大类应用。
* **【4分采分点】**：① 云 GIS 融合云计算弹性算力与时空流大数据，实现“云服务 + Portal 门户 + 多端协同”；② LBS 是“空间定位（GNSS/基站）+ 无线网络 + 移动终端 + GIS 服务中心”的集成产物；③ 工作链路：终端定位上传坐标需求 $\to$ 服务器空间分析 $\to$ 结果下传移动屏显；④ 三大典型业务：周边设施查询、目标动态监控与路径规划导航（功能虽便携但受限于移动终端算力与网络）。
</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
