## 模块一：概论与空间数学基础（第 1～2 章）

### 【问答 01】请简述 GIS 系统的五个基本组成部分及各自作用，并对比 GIS 与 CAD、DBMS、MIS、RS 的异同。（期中真题一 · 五星必考）

**【6 大核心采分点】**：
1. **硬件系统（物理载体与外设支撑）**：由计算机主机、海量存储设备、数据输入设备（扫描仪、数字化仪、全站仪、GNSS 接收机）和输出设备（高精度绘图仪、显示屏、打印机）构成，是 GIS 运行的物理运算底座。
2. **软件系统（核心引擎与平台支撑）**：包括操作系统等系统软件、**GIS 基础平台软件**（如 SuperMap iDesktop、ArcGIS，负责采集编辑与空间分析）、**空间数据库软件**及针对具体行业的 **GIS 二次开发应用软件**。
3. **空间数据（系统的“血液”与工程成本主体）**：指经过抽象编码的地理空间定位数据、拓扑关系、属性数据、像素数据及元数据，直接决定系统分析潜力；工程投资比中**硬件∶软件∶数据 $\approx 1:2:7$**。
4. **地学/应用模型（连接工具与专业决策的纽带）**：是针对特定地学或行业机理构建的数学与分析模型（如水土流失、最佳选址、洪水淹没模型），决定 GIS 能否从简单制图跃升为科学决策支持。
5. **人员（系统中最活跃的关键要素）**：涵盖系统开发工程师、数据建库维护人员与最终行业决策用户；缺少高素质专业人员支撑，软硬件与数据无法协同发挥效能。
6. **GIS 的本质识别特征**：GIS 并非单纯的绘图工具或表格数据库，其区别于其它信息系统的最显著标志是**具有严密的地理空间定位基准、空间拓扑关系表达以及强大空间分析与地学建模能力**。

| 对比维度 | GIS（地理信息系统） | CAD（计算机辅助设计） | DBMS / MIS（通用数据库/管理信息系统） | RS（遥感图像处理系统） |
| :--- | :--- | :--- | :--- | :--- |
| **核心处理对象** | 带地理坐标与拓扑的矢量/栅格空间及属性数据 | 无地理坐标与拓扑的工程设计几何图形 | 结构化文本、数值与业务属性表格记录 | 多波段高维电磁波栅格数字影像 |
| **坐标参考与投影** | **严密地球椭球与地图投影体系**（支持动态投影） | 局部笛卡尔直角坐标系（无地球曲率概念） | 无空间坐标概念（或仅存行政区名字段） | 侧重像元传感器几何成像模型与几何精纠正 |
| **拓扑与属性耦合** | **强拓扑关系 + 几何与属性双向联动检索** | 无拓扑关系，仅附带简单图层颜色/线型标注 | 擅长关系表联结查询，缺乏几何运算与空间索引 | 侧重光谱特征分类、图像增强与辐射定标 |
| **核心分析能力** | **缓冲、叠置、网络、DEM 地形、空间统计建模** | 精细二维/三维工程制图、碰撞检测与尺寸标注 | 统计汇总、财务/办公流程事务处理 | 地物识别、变化检测、定量反演提取 |
| **系统互补定位** | **“3S”空间分析与多源融合决策中枢** | 可作为 GIS 大比例尺工程底图前端数据源 | 为 GIS 空间数据库提供底层关系存储与事务并发 | 为 GIS 提供实时、周期性动态面状监测数据源 |

### 【问答 02】什么是地图投影？为什么会产生投影变形？简述按变形性质和辅助投影面分类的常见地图投影及选型原则。（期中真题二 · 五星必考）

**【6 大核心采分点】**：
1. **地图投影的定义与数学本质**：按照一定数学法则将不可展开的地球椭球面上的经纬网点坐标 $(B, L)$ 精确映射到可展的平面直角坐标 $(x, y)$ 上的理论与方法，即 $x = f_1(B, L),\ y = f_2(B, L)$。
2. **投影变形产生的根本原因**：地球椭球面是**非零高斯曲率的不可展曲面**，无法在不发生拉伸或撕裂的前提下无缝展平为平面，故投影必然产生**长度变形、面积变形与角度变形**（可用 Tissot 变形椭圆直观度量）。
3. **按投影变形性质分类**：① **等角（正形）投影**：微小局部形状相似、角度变形为零（如高斯、UTM、兰勃特，适合地形图与导航）；② **等面积投影**：投影前后图面与椭球面面积严格相等（适合土地资源面积统计）；③ **任意投影（含等距投影）**：长、面、角均有变形但折中平衡（等距投影主方向无长度变形，常用于政区或交通教学图）。
4. **按辅助投影面（构成方法）分类**：利用平面（**方位投影**，多用于极区与半球）、圆锥面（**圆锥投影**，适合中纬度东西延伸区域）、圆柱面（**圆柱投影**，适合赤道或经线带状区）按正轴、横轴或斜轴与地球相切/相割，以及解析改造的**伪方位/伪圆柱/伪圆锥/多圆锥投影**。
5. **我国基本比例尺地形图投影规范**：1∶1 万～1∶50 万国家基本比例尺地形图统一采用**高斯-克吕格投影**（横轴等角切圆柱），其中 **1∶2.5 万～1∶50 万用 6° 分带**（$L_0 = 6n-3^\circ$），**1∶1 万用 3° 分带**（$L_0 = 3n$）；横轴加西移 **$500\ \mathrm{km}$** 并前置 2 位带号避免负坐标。
6. **地图投影选择与坐标转换原则**：选择投影首先考虑**制图区域范围、形状与地理位置**（中低纬东西向选圆锥，南北带状选横轴圆柱，极区选方位），其次顾及地图用途（面积测算必选等面积）；同一椭球不同投影间可通过“反解至 $(B, L) \to$ 正解至新投影”转换，跨椭球则需借三维直角坐标用**布尔沙七参数模型**转换。

| 常见核心投影 | 投影几何与变形性质实质 | 标准/无变形线位置 | 变形分布规律与极值控制 | 典型适用场景与重要参数 |
| :--- | :--- | :--- | :--- | :--- |
| **高斯-克吕格投影** | **横轴等角切圆柱投影** | 中央子午线（长度比 $m_0 = 1$）与赤道正交 | 离中央经线越远长度变形越大；6° 带内最大长度变形 $\le 0.14\%$ | **中国 1∶1 万～1∶50 万地形图**；6° 带（13～23 带），3° 带（24～45 带） |
| **UTM 投影（通用横轴墨卡托）** | **横轴等角割圆柱投影** | 圆柱面割于中央经线两侧约 $180\ \mathrm{km}$ 的两条等变形线 | 中央子午线长度比 **$0.9996$**；6° 带内最大长度变形 $\le 0.04\%$ | 国际通用遥感影像（如 Landsat/Sentinel）与 $80^\circ\mathrm{S}\sim 84^\circ\mathrm{N}$ 制图；自 $180^\circ\mathrm{W}$ 起分 60 带 |
| **兰勃特（Lambert）等角投影** | **正轴等角割（或切）圆锥投影** | 双标准纬线（无任何变形） | 纬线为同心圆弧，经线为交于极点的直线且正交于纬线 | 我国 **1∶100 万地形图**、省级及全国东西延伸中纬度区域政区图 |
| **Web Mercator（网络墨卡托）** | **正轴等角切圆柱投影（正球近似）** | 赤道 | 高纬度长度与面积极度放大（无法投影极点，截断于 $\pm 85.05^\circ$） | 天地图、OSM、高德/百度等 WebGIS 瓦片地图（保持局部正交美观） |

## 模块二：空间数据模型与空间数据结构（第 3～4 章）

### 【问答 03】简述地理空间抽象的三层数据模型，并对比对象模型、场模型、网络模型与时空模型的核心特征。（第 3 章重点）

**【6 大核心采分点】**：
1. **三层空间数据抽象递进体系**：现实地理世界向计算机内部编码需经历三层抽象——**概念模型**（最高层，面向人的领域语义抽象，独立于软硬件）、**逻辑模型**（中间层，GIS 软件对实体及关系的逻辑组织结构，如矢量拓扑表或 UML 类图）、**物理模型**（最底层，文件或数据库磁盘存储字节格式与存取机制）。
2. **数据结构的中介作用**：**空间数据结构**位于逻辑模型与物理模型之间，负责把逻辑模型定义的实体和关系高效地转换为计算机底层存储格式并决定算法性能。
3. **对象数据模型（要素模型）**：将地理空间视为空域，把离散且有明确边界的实体抽象为 **0 维点、1 维线、2 维面、3 维体**四种基本对象，重点表达单个实体的独立标识、多维属性及对象间拓扑关系。
4. **场数据模型（域模型）**：将无明确边界的连续分布地理现象抽象为定义在整个空间域上的连续函数 $A = f(x, y)$（或三维 $f(x, y, z)$），二维静态常通过规则格网、TIN、等值线、离散点、规则/不规则点与多边形六种场载体实现。
5. **网络数据模型**：以对象模型为基础、侧重描述离散通道连通系统，由欧氏空间中的**结点（Node）**和互连的**链（Link）**构成有向/无向图，并赋予边阻强、转向与容量约束，服务于物流路径与管网资源流分析。
6. **时空模型与模型选择原则**：时空模型引入时间维 $T$ 追踪实体生成、分裂、合并与演进（常见**序列快照、基态修正、时空复合**）；实际建库须遵循**对象边界离散选对象模型、连续梯度渐变选场模型、通道流量约束选网络模型、历史演化追踪选时空模型**的原则。

| 对比维度 | 对象模型（要素模型） | 场模型（域模型） | 网络模型 | 时空模型（TGIS） |
| :--- | :--- | :--- | :--- | :--- |
| **空间认知哲学** | 空域中分布离散、独立的地理实体 | 充满空间且随位置连续变化的属性场 | 由节点与通道连接构成的资源流动系统 | 四维时空连续体中随时间演化的实体/场 |
| **核心数学表达** | $(X_i, Y_i)$ 坐标串 + 实体 ID + 属性集 | $A = f(x, y)$ 或 $A = f(x, y, z)$ | 图论 $G = (V, E)$ + 阻力权重矩阵 $W$ | $O = f(X, Y, Z, T)$ + 时态事件状态机 |
| **典型逻辑/数据结构** | 简单实体结构、DIME/链状拓扑矢量 | 规则栅格阵列、TIN 三角网、等值线 | 结点-弧段连通表、转向表、线性参照 | 序列快照、基态修正、时空复合、事件图 |
| **优势分析方向** | 精确界定几何边界、缓冲区、矢量叠置 | 连续坡度坡向、水文径流、空间插值与代数 | Dijkstra 最短路径、TSP、服务区与资源分配 | 土地利用变迁追踪、灾情动态演进、轨迹挖掘 |
| **典型应用对象** | 宗地、建筑物、湖泊边界、行政区划 | DEM 地形高程、降雨量、PM2.5 浓度场 | 城市交通路网、供水管网、电网、燃气管道 | 城市扩张监测、台风路径演进、网约车轨迹 |

### 【问答 04】什么是空间数据的拓扑关系？简述其对数据处理和空间分析的重要意义，并说明拓扑关系的表示与形式化模型。（期中真题三 · 五星必考）

**【6 大核心采分点】**：
1. **空间拓扑关系定义与四大类型**：指图形在连续弹性变换（缩放、旋转、拉伸）下保持不变的空间逻辑属性（“橡皮平面几何”），核心包括**邻接关系**（同类元素间如面-面）、**关联关系**（异类元素间如结点-弧段、弧段-面）、**包含关系**（嵌套岛屿）和**连通关系**（弧段串联）。
2. **比几何坐标具有更高的稳定性**：拓扑关系只依赖要素间的逻辑结构而不依赖坐标距离与角度函数，因此**不随地图投影变换、比例尺缩放和仿射拉伸而改变**，确保了空间逻辑推理的恒定性。
3. **大幅减少数据冗余与保证数据质量**：拓扑结构下相邻多边形共享同一条弧段仅存储一次，不仅消除公共边重复存储带来的冗余，还可通过起止结点闭合检查与左右多边形一致性检验**自动发现悬挂线、未闭合多边形、碎屑多边形等数字化错误**。
4. **极大加速复杂空间查询与逻辑推理**：借助显式拓扑关系表，无需耗费巨量浮点坐标求交计算即可秒级回答“某条河流流经哪些县”“某宗地的全部邻接宗地”“多边形内的岛屿面积扣减”等拓扑查询。
5. **支撑地理实体重构与网络分析**：根据拓扑关系表可由打断的弧段自动重构封闭多边形（矢量叠置的核心环节），并通过结点-弧段连通关系支持最短路径、服务区及水系拓扑追踪分析。
6. **逻辑四表表示与点集九交形式化**：实际建库通常采用**“多边形-弧段表、结点-弧段表、弧段-结点表、弧段-多边形表（含左/右多边形与外包 $P_0$，负号表内岛）”**四表结构表达（其中部分关系可互相推导）；形式化分类则基于 Egenhofer 的**四交模型（4IM）**与**九交模型（9IM，$3\times 3$ 内部/边界/外部交集矩阵）**精确区分 8 种简单面拓扑谓词。

| 拓扑表达表 / 模型名称 | 记录主体与核心字段组成 | 隐含的工程约定与规则 | 主要用途与是否可省略 |
| :--- | :--- | :--- | :--- |
| **表 1：多边形-弧段表** | 多边形号 + 组成该多边形的有序弧段序列 | **外边界逆/顺方向一致；若弧段前带负号表示面域内含岛（空洞）** | 多边形几何重构、计算面积（外包减内岛）与周长 |
| **表 2：结点-弧段表** | 结点号 + 与该结点直接相连的所有弧段号列表 | 反映结点在路网或图边界中的度数（如度为 1 即悬挂，度为 2 疑为伪结点） | **网络连通性分析**与局部拓扑编辑纠错 |
| **表 3：弧段-结点表** | 弧段号 + **起始结点（From-Node）+ 终止结点（To-Node）** | 确定弧段走向，进而唯一确定“左邻面”与“右邻面” | **网络分析极重要（不可省）**；仅面状制图系统常配合表 4 使用 |
| **表 4：弧段-多边形表** | 弧段号 + **左邻多边形 + 右邻多边形** | 沿弧段起点至终点前进方向的左侧为左邻面，右侧为右邻面；**图廓外为虚多边形 $P_0$** | 快速邻接多边形检索与图幅接边拓扑校验 |
| **空间关系三元组比较** | **拓扑关系**：邻接、关联、包含、连通（投影不变） | **顺序关系**：上下、左右、东南西北（投影与形状敏感，GIS 通常不显式存） | **度量关系**：欧氏/曼哈顿距离（随投影与几何变化，GIS 一般按需实时算） |

### 【问答 05】全面对比矢量数据结构与栅格数据结构的优缺点，并简述矢栅相互转换的核心算法。（期中真题四 · 五星必考）

**【6 大核心采分点】**：
1. **核心表达哲学截然相反**：矢量数据结构通过 $(x,y)$ 坐标序列描述离散几何实体，特点是**“定位明显、属性隐含”**；栅格数据结构通过规则行列矩阵存储属性值，特点是**“属性明显、定位隐含”**（位置由行列号推算，每个像元仅能存单值）。
2. **矢量数据结构核心优缺点**：**优点**为空间位置精度高（无锯齿）、图形输出美观、数据存储量小（尤其均质大片面域）、能显式记录拓扑关系故适于网络分析与精确定位检索；**缺点**为多边形叠置与连续场空间分析算法极其复杂、数学模拟困难且不直接兼容遥感影像。
3. **栅格数据结构核心优缺点**：**优点**为结构简单一致、空间分析与地图代数/叠置算法极易实现、天然与遥感影像和 DEM 地形融合、容易开展窗口滤波与连续模拟；**缺点**为存在混合像元与边界锯齿失真、高分辨率下数据冗余庞大、建立网络拓扑与精细几何量测（如窄线周长）较困难。
4. **矢量转栅格（栅格化）核心算法**：① **点转换**：坐标除以像元分辨率直接取整得行列号 $(i, j)$；② **线转换**：采用 **DDA（数值微分）或 Bresenham 八连通/四连通算法**逐格插值加密；③ **面转换**：常用**射线法/内部点扩散（种子填充）法**、**扫描线法**或**边界代数算法**，像元值按**中心点法、面积占优法、重要性法或长度占优法**分配（注意像素位深必须覆盖属性取值范围，否则像 SuperMap 中 4 位像素越界会被强制置 0）。
5. **栅格转矢量（矢量化）核心算法**：① **点转换**：计算像元中心地理坐标；② **线转换**：必先经 **$3\times 3$ 窗口细化（骨架提取）**保留保持拓扑连通的中轴单像素线，再经 **8 邻域搜索跟踪**（区分 8 邻域 1 个值=端点、$\ge 3$ 个值=结点、0 个值=孤立点）并拓扑化；③ **面转换**：提取各相同属性值斑块轮廓边缘，沿 8 邻域顺次追踪闭合多边形外/内轮廓线并简化。
6. **选型与矢栅一体化融合策略**：高精度地籍管网与交通路径选矢量，连续地貌、遥感分类与适宜性评价选栅格；工程上常采用**矢栅一体化数据结构**（如三级线性四叉树多级格网）或按分析环节合理单向转换（转栅格分辨率宜选得足够细小以抑制锯齿失真）。

| 对比维度 | 矢量数据结构（Vector） | 栅格数据结构（Raster） | 工程融合与转换注意事项 |
| :--- | :--- | :--- | :--- |
| **定位与属性特点** | **定位明显、属性隐含**（外挂属性表关联） | **属性明显、定位隐含**（行列号反算坐标） | 矢栅一体化结构试图同时保留高精度索引与快速定位 |
| **几何与边界精度** | 极高，由精确坐标点串定义，任意缩放不失真 | 受限于像元尺寸，边界呈阶梯**锯齿状** | 矢量转栅格时**分辨率设小（像元细化）可显著减轻锯齿** |
| **数据存储效率** | 对稀疏离散点线面存储紧凑、压缩高效 | 均质区域存在大量同值重复存储，随精度平方级膨胀 | 栅格必须辅以 RLE、四叉树或小波压缩（如 ECW） |
| **空间叠置与分析** | 多边形求交需“求交-拓扑重构-碎屑处理”，极复杂 | 逐像元代数/逻辑运算，算法极其简洁高速 | 复杂多因子综合评价宜转栅格用地图代数求解 |
| **网络与地形适用性** | 道路管网拓扑分析、地籍精确宗地量算首选 | DEM 坡度/水文流域模拟、遥感图像分析首选 | SuperMap 实验 3A 中矢栅互转需匹配像素位深防溢出归 0 |

### 【问答 06】简述栅格数据常见压缩编码方式（游程编码、四叉树、线性四叉树、二维行程、链码、金字塔）的基本原理与适用场景。（第 4 章必考）

**【6 大核心采分点】**：
1. **游程长度编码（RLE）**：逐行扫描栅格矩阵，将连续相同像元压缩记录为 `(属性值, 游程长度)` 或 `(属性值, 终止列号)`。编解码极简、易于行向叠置检索，但仅利用一维行相关性，图像破碎变化剧烈时压缩率急剧恶化甚至膨胀。
2. **常规四叉树数据结构**：对 $2^n \times 2^n$ 栅格矩阵递归按四象限分割直至子区均质。实现可变分辨率、自然过滤大片背景且方便表达多边形内“洞”，但需保存全部内部非叶节点，每个节点占 **6 个变量**（1 父指针 + 4 子指针 + 1 属性值），指针冗余巨大。
3. **线性四叉树（MD 码）**：彻底舍弃中间节点与指针，仅顺序存储最终叶节点的**地址码与属性值**。地址码采用将叶节点二进制行列号按位交叉生成的**十进制 Morton 码（MD 码）**，存储量骤降至常规四叉树的 **$2\% \sim 25\%$**，旋转、叠置与连通检测高效，是矢栅一体化的核心基础。
4. **二维行程编码**：游程编码向二维空间的升级或线性四叉树同值叶节点的二次归并，直接以“起始位置 + 方形边长 + 属性值”记录均质块，进一步压缩空间并加速面积与时空多时相叠加分析，但区域划分和重构逻辑较复杂。
5. **Freeman 链码数据结构**：丢弃面域内部像元，仅从起点行列出发沿边界用 `0～7` 八方向码顺次记录轮廓走向（含特征码、起点行列与链码串）。压缩率接近矢量结构，利于计算周长、面积与探测拐角急弯，但难于直接执行区域叠置且相邻边界被重复存储。
6. **影像金字塔与瓦片金字塔**：按 $2\times 2$ 逐级重采样建立多分辨率层次副本（M-金字塔/T-金字塔），再切分为 $256\times 256$ 等规则瓦片按 `z/y/x` 存储，是海量影像快速漫游缩放与 WebGIS 缓存分发（WMTS）的基石，但属于**有损压缩组织**且局部更新需重切瓦片。

| 压缩/组织结构 | 记录单元与编码要素 | 压缩效果决定因素 | 主要核心优势 | 核心局限与适用场景 |
| :--- | :--- | :--- | :--- | :--- |
| **游程编码 (RLE)** | 逐行 `(属性值, 长度/止列)` | 与图面斑块均质度正相关、碎杂度反相关 | 算法最简单、直接支持行逻辑叠加 | 未利用列向相关性；**适用大面积分类专题图** |
| **常规四叉树** | 全树节点 `(父,4子指针,值)` | 异质边界长度决定树深度与分裂数 | 变分辨率、易处理多边形嵌套空洞 | 6 变量指针开销大；**适用图形拓扑教学与图幅索引** |
| **线性四叉树 (MD)** | 仅叶节点 `(MD 码, 属性值)` | 同上，但彻底消灭非叶中间节点 | 存储仅为常规 $2\% \sim 25\%$，运算极快 | 跨层分析与随机存取需遍历；**大规模 GIS 索引与压缩** |
| **二维行程编码** | 方形区域 `(起点/MD, 边长, 值)` | 二维大面积连片方形均质块数量 | 压缩率常优于一维 RLE 与线性四叉树 | 划分策略复杂、部分分析须解码；**时空遥感栅格压缩** |
| **Freeman 链码** | 边界 `(特征码, 起点行/列, 0～7 码)` | 边界折线长度（内部面积不耗存储） | 接近矢量高压缩、极利于形状/急弯识别 | 难作区域叠置、相邻边有冗余；**边缘识别与边界提取** |
| **影像/瓦片金字塔** | 分辨率降采样层 + `z/y/x` 瓦片 | 额外增加约 $1/3$ 层级缓存（换取速度） | **海量数据秒级概貌加载与渐进传输** | 有损多尺度副本、跨瓦片分析不便；**WebGIS 与影像浏览** |

## 模块三：空间数据库与数据采集处理（第 5～6 章）

### 【问答 07】简述空间数据库的特点、设计步骤、矢栅存储管理模式（含空间数据库引擎 SDE 对比）以及常见空间索引技术。（第 5 章核心）

**【6 大核心采分点】**：
1. **空间数据库的五大鲜明特点**：相较传统商业数据库，空间数据库具有**数据量极其庞大（TB/PB 级）、空间几何与非空间属性强耦合、空间实体变长且非结构化（顶点数量不等）、空间拓扑与自相关关系复杂、多尺度与多时相并存**五大特征。
2. **空间数据库标准设计流程**：依次经历**需求分析与专题确定 $\to$ 概念设计（对象/场抽象与 E-R 建模）$\to$ 逻辑设计（分层定义图层、拓扑规则与属性表结构）$\to$ 物理设计（空间参考、文件组与索引配置）$\to$ 原型构建测试与优化 $\to$ 文档归档入库**。
3. **空间数据管理模式演进**：历经“**纯文件管理** $\to$ **文件-关系混合管理**（文件存几何+RDBMS 存属性，用 ID 关联，并发与一致性弱） $\to$ **全关系/扩展关系管理**（BLOB 二进制变长字段或 SQL 空间扩展） $\to$ **面向对象/对象关系数据库（ORDBMS）**”，并通过几何/逻辑/物理无缝组织消除图幅割裂。
4. **空间数据库引擎（SDE）两种技术路线**：1996 年起出现的 SDE 解决了关系数据库统一管存非结构化空间数据的难题——**中间件型（如 ArcSDE）**运行于 RDBMS 之上，**可管理复杂拓扑与几何网络、支持版本控制与并发长事务**；**嵌入式型（如 Oracle Spatial）**内置空间数据类型，**SQL 简单要素检索便捷但难以直接维护复杂拓扑与几何网络**。
5. **空间索引的核心机理与“粗过滤+精判”两阶段检索**：空间索引按对象位置提取**最小外接矩形（MBR）**等外包轮廓建立树状或格网目录，先通过极低代价的矩形交叠测试**排除绝大部分无关目标（粗过滤）**，再对候选实体做精确几何求交计算（精过滤）。
6. **常用空间索引算法对比**：包括**对象范围索引（线性 MBR）**、**格网索引（如 ArcSDE 多级格网）**、**四叉树索引**、**BSP 树**以及最主流的平衡树索引——**R 树（允许兄弟 MBR 重叠，无对象拆分但检索可能多路径）**与 **$\mathrm{R}^+$ 树（强制兄弟 MBR 互不重叠，跨越对象切分引用以实现单路径极速检索）**。

| 空间索引算法 | 空间剖分策略 | 是否允许区域/MBR 重叠 | 跨区大型实体处理 | 核心优点与缺点对比 |
| :--- | :--- | :--- | :--- | :--- |
| **对象范围索引 (MBR)** | 直接用各实体外接矩形顺序扫描 | 允许 | 不拆分 | 实现极简但数据量大时线性扫描过慢 |
| **格网索引 (Grid/多级格网)** | 固定规则或 1～3 级嵌套矩形格网 | 格网互不重叠 | 跨越多个格网时**多格重复记录 ID** | 定位极快（近似 $O(1)$）；数据极不均或跨格多时性能下降 |
| **四叉树空间索引** | 空间按 $2^n\times 2^n$ 递归四等分 | 叶块互不重叠 | 需存入较高层非叶节点或多次引用 | 适应不均分布但静态划分对非均匀更新树深不平衡 |
| **R 树 (R-Tree)** | 自底向上聚簇实体 MBR 构建平衡树 | **允许同层兄弟 MBR 重叠** | **不拆分实体**（完整存于单个叶节点） | 空间利用率高、动态插删平衡好；点查询可能遍历多条分支 |
| **$\mathrm{R}^+$ 树 ($\mathrm{R}^+$-Tree)** | 强制非重叠矩形空间分解 | **严禁同层兄弟 MBR 重叠** | 跨越分解界线的实体**切分并被多叶引用** | 点检索保证单条路径极速到达；构建复杂且存在实体冗余 |

### 【问答 08】简述空间数据采集后的几何纠正/地理配准、栅格重采样、矢量线压缩（道格拉斯-普克法）及图幅接边的主要流程与原理。（第 6 章重点）

**【6 大核心采分点】**：
1. **GIS 多源数据与采集成因**：GIS 工程经费呈**硬件∶软件∶数据 $= 1:2:7$**，数据源涵盖野外全站仪/GNSS 实测、纸图扫描矢量化、遥感解译、已有统计与众包轨迹大数据；原始扫描件与局部测量常含变形、错位与缺失坐标，必须经过系统几何与拓扑加工方能入库。
2. **几何纠正与地理配准原理**：通过选取清晰且全局均匀分布的同名控制点建立数学映射，消除扫描扭曲与投影变形——**线性（仿射）配准**（$\ge 4$ 点，改正平移/旋转/缩放/错切）、**二次或高次多项式配准**（拟合复杂非线性畸变，SuperMap 建议 $\ge 10$ 点）、**三角网分片橡皮页拉伸（Rubber-Sheeting）**（保控制点严格不动用于局部精细套合）。
3. **三种栅格重采样算法对比**：变换后回落原图的非整数像素坐标需重采样赋值——**最邻近法**（取最近 1 像素，速度最快且不改动原始离散分类编码，但有锯齿半像素偏移）、**双线性内插法**（取 $2\times 2 = 4$ 像素加权，消除锯齿、精度速度平衡，略微平滑边缘）、**双三次卷积法**（取 $4\times 4 = 16$ 像素卷积，边缘最锐利精确但耗时大）。
4. **矢量线数据压缩核心算法**：消除坐标串冗余抽稀节点，常用**间隔取点法、垂距法/偏角法**及公认最优的**道格拉斯-普克（Douglas-Peucker）递归分裂法**——虚连线首末点求最大垂距 $d_{\max}$，若 $d_{\max} < L$ 全部舍去，否则以该极值点分裂为两段递归执行，完整保留曲折骨架。
5. **图幅拼接（几何接边与逻辑接边）**：多小组或分幅数字化对接时必然出现**几何裂缝**（跨图廓端点错位偏移）与**逻辑裂缝**（同一地物跨越图廓后编码、高程或路面宽属性不一致）。须依次完成：**识别相邻图幅 $\to$ 回缩边缘 2～3 点容差捕捉平滑几何接边 $\to$ 统一属性编码与合并同类邻接公共边界（消融）**。
6. **扫描数字化质量控制全流程**：扫描图像入库前必须经历**纠正去噪 $\to$ 二值化 $\to$ 细化追踪 $\to$ 地理配准（检查控制点 RMS 中误差）$\to$ 分层矢量化（开启节点捕捉）$\to$ 拓扑检查与接边 $\to$ 挂载元数据入成果库**七大步骤。

| 处理环节 | 核心方法 / 算子 | 关键输入 / 参数条件 | 优缺点与工程注意铁律 |
| :--- | :--- | :--- | :--- |
| **地理配准模型** | 矩形（2 点）/ 线性仿射（$\ge 4$ 点）/ 多项式（$\ge 10$ 点） | 同名控制点均匀分布于全图及四角（交叉点/角点） | 配准后须看**控制点残差与中误差（如 $<1$）**，剔除/微调粗差点后导出 `.drfu` |
| **栅格重采样** | 最邻近（1 点）/ 双线性（$2\times 2$）/ 双三次（$4\times 4$） | 目标像元反算至源栅格浮点坐标 $(i', j')$ | 土地利用分类图**只能用最邻近**（防混合假类别）；DEM 与 DOM 首选双线性/双三次 |
| **矢量线简化** | 道格拉斯-普克分裂法（1973） | 垂距限差阈值 $L$ | **全局不变性与特征拐点保真最佳**；$L$ 越大压缩比越高、细节损失越多 |
| **图幅接边处理** | 几何接边 + 逻辑接边 | 边缘回缩 2～3 节点、捕捉容差、属性一致性检查 | 先几何接边消除缝隙断裂（防突变折角），再核查属性并消除同属性伪边界 |

### 【问答 09】如何评价与控制 GIS 空间数据质量？详述矢量数据常见四类拓扑错误的成因、危害与拓扑检查修复策略。（第 6 章高频）

**【6 大核心采分点】**：
1. **空间数据质量评价的五大核心指标**：① **数据完整性**（实体、属性及关系的过剩或遗漏）；② **逻辑一致性**（数据结构、拓扑关系与属性域规则的遵循度）；③ **位置精度**（平面与高程坐标对真值的逼近度）；④ **时间精度**（数据时效现势性与时间标注准确性）；⑤ **属性精度**（定量值精度与定性分类正确率）。
2. **质量评价方法与术语区分**：分**直接评价**（对成品数据集全检或抽样验收度量）与**间接评价**（依数据源和误差传播模型预估）；须严格区分**准确性（Accuracy，接近真值程度）**与**精密度（Precision，多次观测的离散稳定度）**。
3. **误差源与全过程误差传播**：空间数据包含随机误差、系统误差与粗差，源自**地理现象本身模糊性、采集设备与人为解译偏差、坐标投影变换/矢栅互转/叠置分析中的累积传播、以及比例尺失配误用**四大环节。
4. **矢量四类典型拓扑错误机理**：① **伪结点（Pseudo Node）**：连续弧段多余 2 度断开点（非属性变化或交叉点应合并）；② **悬挂结点（Dangling Node）**：线端悬空未闭合——**欠头（Undershoot）**或**过头（Overshoot）**，直接破坏构面闭合与路网连通；③ **碎屑多边形（Sliver Polygon）**：共用边界微偏产生的狭长伪面；④ **不正规多边形（Weird Polygon）**：自相交（8 字交叉）或折返造成的无效面。
5. **数字化预防与拓扑规则自动查错**：数据采集中强制开启**节点/端点/线捕捉（Snapping）**与严格拓扑限差；采集后借助 GIS 拓扑检查器按规则（如`面不能重叠`、`面不能有缝隙`、`线不能有悬挂点`、`线不能有伪结点`、`线不能自相交`）批量扫描定位。
6. **综合质量控制与元数据归档**：通过“选择可靠底图源 $\to$ 控制数字化限差 $\to$ 模糊容差融并碎屑、延伸/裁剪悬挂线 $\to$ 地理相关法（如水系与等高线吻合检验）$\to$ 绑定完整 **元数据（FGDC CSDGM 7 主 3 次共 460 元素）**”形成全链路质量闭环，并将成果、历史与运行三库分离管理。

| 拓扑错误类型 | 几何特征表现 | 常见产生原因 | 对空间分析的危害 | 标准检查规则与修复方式 |
| :--- | :--- | :--- | :--- | :--- |
| **伪结点 (Pseudo Node)** | 单条均质弧段上出现只连接 2 条弧段的冗余结点 | 矢量化中途停顿接续、删除交汇支线后未清理 | 冗余弧段切分属性查询效率低、线长统计分散 | 查“线不能有伪结点”；若两侧属性相同则**合并弧段（Dissolve/Merge）** |
| **悬挂结点 (Dangling Node)** | 孤立端点未落至其它线或自身闭合（过头/欠头） | 手工跟踪未开捕捉、扫描细化断裂或噪声毛刺 | **多边形无法自动构面、网络路径在此截断死路** | 查“线不能有悬挂点”；设容差**过头自动裁剪（Trim）、欠头延伸捕捉（Extend）** |
| **碎屑多边形 (Sliver)** | 沿共有边界或叠置接边处生成的狭长极小微多边形 | 不同数据源精度差异、未启用共享边捕捉分别采边 | 严重歪曲图斑个数、土地面积统计与分类汇总结果 | 查“面不能有缝隙/重叠”；设置**模糊容差（Cluster Tolerance）**或按面积比合并至邻面 |
| **不正规多边形 (Weird)** | 边界自身交叉成“8”字形或顺逆时针节点折返 | 鼠标误双击折返打结、坐标导入错序 | 梯形法求出面积为负或失真、质心跑出面外、叠置崩溃 | 拓扑自相交校验；**打断相交点、剔除重复折返点并重建闭合环** |

## 模块四：空间分析与数字地形分析（第 7～8 章）

### 【问答 10】简述缓冲区分析的分类与构建原理，并全面对比矢量叠置分析四大核心算子（Union、Intersect、Erase、Identity）的区别（含 SuperMap 术语映射）。（第 7 章高频必考）

**【6 大核心采分点】**：
1. **缓冲区分析的定义与核心用途**：根据点、线、面空间实体自动建立周围指定宽度带状区域以衡量实体对周边辐射或影响范围的工具，主要解决**空间临近度（Proximity）**评价与避让/覆盖选址问题。
2. **矢量缓冲区的几何形态与特殊处理**：① **点缓冲**生成圆；② **线缓冲**生成双侧带，端头分**圆头缓冲（Round，默认平滑）**与**平头缓冲（Flat，截齐端点）**，并支持**固定半径、属性字段变距及左右不等半径**（如道路扩建左侧 15 m、右侧 10 m）；③ **面缓冲**区分**外缓冲、内缓冲与内外缓冲**；多个相邻实体缓冲后常需**融合（Dissolve）**消除重叠区。
3. **栅格缓冲区的生成机理**：对于连续地理场更宜使用栅格缓冲——以源实体像元为起点，全图计算每个像元至最近源要素的**欧氏距离栅格**（或融合阻力权重的**成本距离栅格**），再结合**重分类（Reclassify）**截取阈值范围（如 $\le d$ 赋 1、$> d$ 赋 0）。
4. **矢量多边形叠置分析的标准三步机理**：前提是两图层**坐标系与基准面完全一致**；核心经由**① 几何求交（在边界交点处插入新结点打断弧段） $\to$ ② 拓扑重构（生成新多边形-弧段拓扑表） $\to$ ③ 属性传递（借标识点合并挂接双层属性，同时用模糊容差消除碎屑多边形）**完成。
5. **四大矢量叠置算子的集合本质（设输入源图层 $A$、叠加控制图层 $B$）**：① **并（Union，$A \cup B$）**保留双方全部区域与双方属性；② **交（Intersect，$A \cap B$）**仅提取双方重叠交集及双属性；③ **擦除（Erase，$A - A \cap B$）**在 $A$ 中挖去 $B$ 覆盖部分以实现避让排除；④ **标识/同一（Identity，SuperMap 称“同一”）**保留 $A$ 全域几何形状但为与 $B$ 相交的子块注入 $B$ 属性（非重叠区 $B$ 属性为空）。
6. **SuperMap 工程映射与附加常用算子**：SuperMap 叠置工具提供**裁剪（Clip，等价交集但仅保留 $A$ 原属性不挂 $B$ 属性）、合并（Union）、擦除（Erase）、求交（Intersect）、同一（Identity，即 ArcGIS 标识叠加）与对称差（Symmetrical Difference，$A \oplus B$，仅保留各自互不重叠部分）**；注记实验中用“裁剪”和“求交”均可提取某行政区（如刘庄村）内土地利用，区别在于求交会带出区划表字段。

| 叠置算子名称 | 集合代数表达 | 输出空间几何范围 | 输出属性表保留规则 | 典型工程与考试应用示例 |
| :--- | :---: | :--- | :--- | :--- |
| **合并 / 并 (Union)** | $A \cup B$ | **$A$ 与 $B$ 覆盖的并集全区域**（均须为面） | 保留 $A$ 和 $B$ 的全部字段（无重叠处对方字段为空） | 汇总多块不同年份或多种评估因子的全域完整空间分布 |
| **求交 / 交 (Intersect)** | $A \cap B$ | **仅 $A$ 与 $B$ 共同重叠的公共区域** | **同时继承 $A$ 和 $B$ 双方全部属性字段** | 求既在道路 $500\ \mathrm{m}$ 内又在发射塔 $3000\ \mathrm{m}$ 内的适宜交集 |
| **裁剪 (Clip)** | $A \cap B$（仅裁切外形） | 仅保留落入裁剪边界 $B$ 内部的 $A$ 部分 | **只保留源图层 $A$ 的原有属性，不附加 $B$ 的属性** | 用刘庄村界裁剪乡镇土地利用图，输出纯粹的村地类图斑 |
| **擦除 (Erase)** | $A - (A \cap B)$ | 保留 $A$ 中位于控制图层 $B$ **外部**的区域 | 保留源图层 $A$ 的原有属性字段 | **避让条件**：从候选区中挖除森林边缘 $1000\ \mathrm{m}$ 禁建缓冲带 |
| **标识 / 同一 (Identity)** | $A \cup (A \cap B)$ | **完整保留源图层 $A$ 的全部空间范围** | 与 $B$ 重叠部分同时挂接 $B$ 属性；$A$ 独有部分 $B$ 字段为空 | 在全域地块图上补充叠加洪涝风险等级属性同时不丢失安全地块 |
| **对称差 (SymDiff)** | $(A \cup B) - (A \cap B)$ | **仅保留 $A$ 独有与 $B$ 独有的非重叠区域** | 保留双方各自原属性（重叠区域被双向挖空删除） | 探测两期森林边界或湖泊水岸线的**扩张/退缩变化差异带** |

### 【问答 11】简述栅格窗口分析（Focal vs Block、低通/高通滤波）原理，并对比空间网络分析中的最佳路径（Dijkstra）、旅行商（TSP）与服务区分析。（第 7 章核心）

**【6 大核心采分点】**：
1. **窗口分析（邻域分析）的核心原理**：源于地表地理现象的空间相关性（位置 $(i,j)$ 像元受周围环境影响），在栅格矩阵上开辟固定大小与形状（**矩形、圆形、环形、扇形**）的分析窗口，提取统计或函数结果并赋给新图层对应像元，实现水平方向的邻域扩展分析。
2. **焦点统计（Focal）与块统计（Block）的本质区别**：**Focal Statistics** 以每个像元为中心逐格移动窗口，**相邻窗口高度重叠**，输出与输入保持同等空间分辨率与局部细节；**Block Statistics** 将全图划为**互不重叠的独立区块**，算出的单一统计值赋给块内所有像元，具有明显降尺度空间概括作用。
3. **窗口统计运算与滤波函数运算**：统计运算常用**均值（Mean）、极值（Max/Min）、极差（Range，提取地形起伏度）、中值（Median，抗椒盐噪点）、众数（Majority）与标准差**；函数运算中，**低通滤波（LOW）**通常取 $3\times 3$ 均权 $1/9 \approx 0.111$（权和为 1）平滑全图、消除孤立异常值，**高通滤波（HIGH）**通过中心正高权、四周负权抑制平滑背景而锐化凸显突变边缘。
4. **空间网络分析的六大基本要素与构网前提**：网络模型由**链（弧段）、结点、中心（源与汇）、站点、拐角点（转向耗时）和障碍（阻断点/边）**构成，弧段常区分为**单行道或双行道且正反向阻强不同**；开展网络分析前必须完成线拓扑处理并按节点容限（如 SuperMap `2.0`）**构建拓扑二维网络数据集**。
5. **最佳路径分析（Dijkstra）与旅行商问题（TSP）的核心区别**：**最佳路径分析**在给定起终点及严格按顺序经过的必经中间站点下（允许增设障碍点/边），基于图论最小阻力累加求解连接固定次序站点的最低代价路径；**旅行商问题（TSP）**给定一组无固定遍历次序的目标站点，**由算法自动排列最优访问顺序**使遍历所有点后的总路径阻力最小（常用于快递巡检与垃圾收运）。
6. **服务区分析与资源分配建模**：**服务区分析**围绕指定设施中心点按最大网络阻力阈值（如 $1000\ \mathrm{m}$ 距离或 5 分钟车程）沿道路网向外追踪生成实际可达的服务范围多边形与覆盖路段；**资源分配**则进一步综合中心点资源供应容量与各路段/门店的需求量，在互不冲突原则下优化划定各中心覆盖疆域并辅助设施**最佳选址**。

| 对比维度 | 焦点统计 (Focal) / 滤波 | 块统计 (Block) | 最佳路径分析 (Optimal Path) | 旅行商分析 (TSP) | 服务区与资源分配 |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **处理域 / 载体** | 规则栅格移动重叠窗口 | 规则栅格互不重叠区块 | 拓扑网络（链/结点/障碍） | 拓扑网络（无序多站点） | 拓扑网络（中心容量+路网阻力） |
| **核心计算目标** | 局部平滑（低通 $1/9$）、边缘增强（高通）、山顶提取 | 分块聚合降采样 | **按指定顺序**经起止/必经点的最小阻力路径 | **自动优化站点访问排序**的遍历最短回路 | 划定给定阻力阈值可达区域及供需最优匹配 |
| **典型制约参数** | 窗口形状与尺寸（如 $3\times 3$）、算子核权重 | 分块行列步长 | 弧段正逆阻强、拐点延误、障碍点/边 | 起终点是否固定、无序必经点集 | 中心服务半径（$1000\ \mathrm{m}$）/最大容量与链路需求 |
| **输出典型结果** | 去噪 DEM、地形起伏度、纹理增强栅格 | 粗化统计块栅格 | 有序导航最优路径与总代价 | 最优访问序列清单与巡游路线 | 等时/等距服务区多边形（3/5/10 min） |

### 【问答 12】对比规则格网 DEM 与不规则三角网 TIN（含 Delaunay 剖分三准则），并全面比较四大空间内插方法（整体趋势面、局部分块/样条、逐点 IDW、地统计克里金）的优缺点与适用性。（第 8～9 章重点）

**【6 大核心采分点】**：
1. **DEM 两种核心数据结构对比**：**规则格网 DEM（Grid）**以等间距矩阵存储高程，结构极简、易于与遥感影像配准叠加及提取水文坡度矩阵，但在平缓区冗余大且难以刻画断崖、山脊等地形突变特征线；**不规则三角网（TIN）**以互不重叠三角面片连接原始采样点，具有**可变分辨率**、可强制嵌入山脊/谷底断裂线、无冗余、高精度贴合复杂地貌，但拓扑构建与存储查询复杂。
2. **Delaunay 三角剖分的三大经典准则**：构建最优 TIN 必须满足：① **形状最佳准则**（最大化最小内角，使每个三角形尽量接近等边正三角形，避免狭长畸形三角片）；② **空外接圆与最近点准则**（任意三角形的外接圆内部不包含第四个采样点，保证最近三点优先联结）；③ **唯一性准则**（在无四点共圆退化时三角网构型完全唯一）。
3. **整体内插（趋势面法）原理与局限**：用全域高次多元多项式拟合所有控制点（最小二乘残差平方和最小），可揭示大尺度宏观空间趋势但计算极易病态振荡、丢失局部微地形细节，通常仅用于宏观趋势剥离而非精细 DEM 生成。
4. **局部分块与样条函数内插（Spline）**：将区域剖分为带重叠边界的局部小块拟合低阶光滑曲面（如三次样条函数，保证分块接缝处二阶导数连续），保留局部细部形态且曲面极为光滑自然（教材评价整体精度极高），但在突变断崖处可能出现过冲振铃且需解复杂线性方程组。
5. **逐点内插法（反距离加权 IDW）**：直接针对每个待插格网点搜寻邻域 $K$ 个已知点（通常 $4\sim 10$ 点，顾及象限均匀分布），按距离负幂次 $d_i^{-p}$ 定权求加权平均。**计算速度最快**，估值严格限定在已知极值之内（不会预测出超出极值的假山峰），但样本稀疏或孤立异常值周围易形成“牛眼”状同心圆且无法评估预测误差。
6. **地统计内插法（克里金 Kriging）**：Matheron 与 Krige 提出的**最佳线性无偏估计（BLUE）**模型，基于**半变异函数**同时考量样点距离与空间方向各向异性结构相关规律定权，不仅**细节刻画与估计精度极优**且能输出每个格网点的预测标准差图，但**速度最慢**、对极值较平滑、且通常要求数据具备空间自相关并先经 QQ 图检验近似正态分布。

| 对比模型 / 算法维度 | 速度 | 地形细节保持 | 曲面光滑度 | 整体精度（教材/PPT） | 核心数学前提与典型缺陷 |
| :--- | :---: | :---: | :---: | :---: | :--- |
| **1. 规则格网 DEM (Grid)** | 快 | 受格网步长制约 | 中等 | 取决于采样密度与内插方式 | 平缓区冗余、难表达垂直断崖；但水文与窗口矩阵运算最快 |
| **2. 不规则三角网 (TIN)** | 中 | **极高**（保结构线） | 呈平面分段折面 | 原采样点 100% 精确保真 | 须满足 Delaunay 三准则；存储拓扑复杂、难直接做 D8 流向矩阵 |
| **3. 反距离加权 (IDW)** | **最快 (第 1)** | 较弱 (第 3) | **最弱 (第 3)**（“牛眼”） | 较低 (第 3) | 确定性仅依赖距离幂次 $p$；易受聚类与异常点（最敏感）干扰 |
| **4. 样条函数 (Spline)** | 适中 (第 2) | 较强 (第 2) | **最光滑 (第 1)** | **极高 (第 1)** | 最小曲率弹性薄板假设；抗孤立异常值强，陡变崖边易过冲超界 |
| **5. 克里金 (Kriging)** | **最慢 (第 3)** | **细节最优 (第 1)** | 适中 (第 2) | **高且无偏 (第 2)** | 依赖半变异函数拟合与正态/平稳假设；唯一可量化插值预测方差 |

### 【问答 13】简述基于 DEM 提取基本坡面因子与宏观地形因子的原理，并详述基于规则格网 DEM 进行水文流域提取（D8 算法）和可视域分析的核心步骤。（第 8 章 + 实验 3D 必考）

**【6 大核心采分点】**：
1. **局部 $3\times 3$ 窗口坡度与坡向提取原理**：利用有限差分（如 Horn 三阶反距离平方权公式）计算中心像元东西向高程梯度 $f_x$ 与南北向高程梯度 $f_y$，求得**坡度 $S = \arctan\sqrt{f_x^2 + f_y^2}$（$[0^\circ, 90^\circ]$ 或百分比）**和**坡向 $\mathrm{Aspect}$（法线水平投影自正北顺时针度量 $[0^\circ, 360^\circ)$，决定北半球南坡为阳坡、北坡为阴坡）**。
2. **地形曲率与三大宏观地形因子**：沿最大坡降方向的**剖面曲率**控制径流加速与土壤侵蚀力，沿等高线的**平面曲率**控制水流汇聚发散；宏观评价常用**地形起伏度（$H_{\max}-H_{\min}$）、地表粗糙度（$R = S_{\text{曲面}}/S_{\text{水平}} \approx 1/\cos S$）与地表切割深度（$H_{\text{mean}}-H_{\min}$）**，其中提取山顶点需用“窗口局部最大值减 DEM 为 0 并结合独立闭合等高面排除噪声伪点”。
3. **水文流域提取第一步——洼地填充（Fill Sinks）**：原始 DEM 因内插误差或采样精度常存在周围高、中间低的“伪洼地”，会中断地表水流追踪；开展流向计算前必须先利用邻域溢出高程填平所有闭合伪洼地，生成无洼地的标准水文 DEM。
4. **水文流域提取第二步——D8 最大坡降流向计算**：检查中心像元与 8 个相邻像元的距离权高程落差 $D_k = (Z_{\text{中}} - Z_k)/L_k$（正交方向 $L_k = 1$，对角方向 $L_k = \sqrt{2} \approx 1.414$），选择最大正落差方向作为唯一出水方向，并按 2 的幂次编码为 **1 东、2 东南、4 南、8 西南、16 西、32 西北、64 北、128 东北**。
5. **水文流域提取第三至四步——汇流累积量、河网与流域划分**：沿流向矩阵逐格递推统计流经每个像元的上游全部栅格数生成**汇流累积量矩阵**（山脊线处为 0，谷底沟道值骤增）；给定临界汇流阈值提取连续**栅格水系河网**（可进一步河网分级与矢量化），并配合倾泻点（出水口）逆向追踪上游全部汇流像元生成最终**流域分水线边界**。
6. **可视性分析与可视域（Viewshed）计算**：**两点通视**沿观察点 $O$（地面高程 + 附加塔高，如 $430+100 = 530\ \mathrm{m}$）至目标点 $P$ 提取剖面，检查中间点仰角是否均小于 $OP$ 连线仰角；**可视域分析**则在给定观测半径、水平/垂直视角与附加高程约束下遍历扫描 DEM 射线剖面，批量输出视点可见区与遮挡盲区，广泛用于防火瞭望塔与基站覆盖优化。

| 地形/水文分析模块 | 依赖输入与预处理 | 核心数学公式 / 判据 | 输出结果与编码特点 |
| :--- | :--- | :--- | :--- |
| **坡度与地表粗糙度** | 规则格网 DEM（统一平面与高程单位） | $S = \arctan\sqrt{f_x^2 + f_y^2}$；$R \approx 1 / \cos S$ | 坡度 $[0^\circ, 90^\circ]$ 或百分比；平地 $S=0^\circ, R=1$ |
| **坡向与地形晕渲** | 规则格网 DEM + 太阳方位/高度角 | $\mathrm{Aspect}$ 以正北 $0^\circ$ 顺时针 $[0^\circ, 360^\circ)$ | 平地无方向记为 $-1$；斜照晕渲常以半透明叠加彩色 DEM |
| **水文流向 (D8 算法)** | **必先填洼（Fill Sinks）消除闭塞噪点** | 比较 $\max\left(\frac{Z_{\text{中}} - Z_k}{L_k}\right)$（对角 $L_k=\sqrt{2}$） | 单流向 8 编码：`1, 2, 4, 8, 16, 32, 64, 128`（东起顺时针 $2^{0\sim 7}$） |
| **汇流累积与河网流域** | D8 流向矩阵 + 汇流阈值 / 出水口 | 上游像元顺流向累加；`FlowAcc >= Threshold` | 山脊处汇流值为 $0$；河网矢量与集水区多边形 |
| **通视与可视域分析** | DEM + 观察点（地面高程 + **附加高程**） | 射线地形剖面中间点仰角 $\le$ 视点-目标连线仰角 | 两点通视结果 / 0-1 二值可视域栅格及障碍点 |

## 模块五：空间统计、可视化与网络 GIS 服务（第 9～11 章）

### 【问答 14】简述探索性空间数据分析（ESDA）的作用、空间自相关核心指标（Moran's I 与 Getis-Ord $G_i^*$）以及半变异函数参数含义，并对比空间回归与经典回归。（第 9 章高频）

**【6 大核心采分点】**：
1. **探索性空间数据分析（ESDA）的目的与核心工具**：在正式建立克里金或回归模型之前，综合利用可视化图形与统计检验探测数据特征，旨在**检验分布正态性（直方图、正态 QQ 图）、识别空间离群异常值（Voronoi 图、半变异云图）、剖析全局趋势方向（三维趋势透视图）并诊断空间自相关性**。
2. **空间权重矩阵与空间自相关（Moran's I）**：依 Tobler 第一定律构建二元对称邻接或距离权重矩阵 $W_{ij}$ 后，计算 **Global Moran's I**：$I > 0$ 且通过 $z$ 得分（$|z| > 1.96$）与 $p$ 值检验表示**高-高或低-低空间正聚集**，$I < 0$ 表示高-低相间负相关，接近期望 $-1/(n-1)$ 则为随机分布；**Local Moran's I** 进一步识别具体聚集（HH/LL）与空间异常点（HL/LH）。
3. **高低值聚类热点探测（Getis-Ord $G_i^*$）**：不同于 Moran's I 只管相似性而不能直接区分高值团与低值团，**$G_i^*$ 热点分析**输出每个要素及其邻域相对全局的 $z$ 得分：**显著正 $z$ 得分标志高值集聚“热点（Hot Spot）”，显著负 $z$ 得分标志低值集聚“冷点（Cold Spot）”**。
4. **半变异函数四大特征参数（Kriging 依据）**：半变异值 $\gamma(h)$ 随样点距 $h$ 增大而上升并趋于平稳——**块金值（Nugget）**是 $h\to 0$ 截距，源于测量误差与亚尺度微观变异；**基台值（Sill）**是平稳后的总变异上限；**偏基台值（Partial Sill）**是基台减块金，代表空间结构性变异；**变程（Range）**是达基台值的距离上限，**超出变程 $h > a$ 则空间相关性消失，不能用于内插**。
5. **空间回归（GWR）与经典全局回归（OLS）的本质差异**：经典最小二乘（OLS）假设参数全局恒定且残差独立同分布，忽略了**空间自相关与空间非平稳性**（同一变量在不同区域作用系数方向或强度可能完全不同）；**地理加权回归（GWR）**将采样点坐标 $(u_i, v_i)$ 嵌入回归系数，用核权重矩阵为每个局部位置单独建立线性方程，精准揭示驱动因子的空间异质性。
6. **地理探测器（Geodetector）的独特优势**：基于方差对比统计量 $q \in [0, 1]$ 度量空间分异性与驱动力，**不依赖线性假设、天然直接支持定性类别因子与数值离散化分析且免疫多重共线性**，通过**因子探测、交互作用探测（非线性增强等）、风险区探测与生态探测**四大组件完善定量归因。

| 统计模型 / 指标 | 核心关注问题 | 数学判据 / 关键阈值 | 相较传统统计的本质突破 |
| :--- | :--- | :--- | :--- |
| **Global / Local Moran's I** | 属性整体是否聚集；识别局部异常点 | $I > 0$ 正相关聚集；$I < 0$ 离散；$E[I]=-1/(n-1)$ | 通过空间权重矩阵 $W_{ij}$ 将几何邻接/距离引入相关检验 |
| **Getis-Ord $G_i^*$** | 严格区分“高值簇热点”与“低值簇冷点” | 显著正 $z$ 为热点（HH）；显著负 $z$ 为冷点（LL） | 克服 Moran's I 无法单独分离高高聚类与低低聚类的不足 |
| **半变异函数 $\gamma(h)$** | 度量区域化变量随距离衰减的结构规律 | 块金（误差+微变异）、偏基台、基台、**变程（最大相关性半径）** | 克里金最佳无偏插值权重求解的直接理论依据 |
| **GWR（地理加权回归）** | 揭示自变量对因变量影响的**空间非平稳性** | 局部系数 $\beta_k(u_i, v_i)$ 随空间坐标动态变化 | 打破全局 OLS “全区统一单一回归系数”的刚性假设 |
| **地理探测器** | 探测空间分异性与单/双因子驱动交互 | $q = 1 - \frac{\sum N_h \sigma_h^2}{N \sigma^2} \in [0, 1]$（越大解释力越强） | **无需正态与线性前提，直接兼容类别定性变量且免疫共线性** |

### 【问答 15】简述地理信息可视化中视觉变量的分类与选取原则、绝对数据与派生数据的专题符号配置差异，以及地图图面配置原则与三维地形显示形式比较。（第 10 章高频）

**【6 大核心采分点】**：
1. **视觉变量分类体系**：地图符号的基本图形色彩变量在经典理论（Bertin）基础上，教程按语义划分为**定性视觉变量**（主要是**形状**——具可视化隐喻效果、**色调/色相**——除点外线面分类均优于形状）与**定量视觉变量**（**大小/尺寸、方向、透视高度、属性值/色彩深浅、亮度、饱和度**）。
2. **不同几何维度的符号选取规则**：点要素定性首选色调/形状、定量首选大小/亮度；线要素定性首选色调/形状、定量首选线宽大小；面要素定性首选色调/形状、定量首选明度/饱和度/值；**2.5 维要素不推荐用于定性及方向/形状变量；3 维要素不推荐使用透视高度变量**。
3. **绝对数据与派生数据的制图配置铁律**：原始绝对数量（如总人口）受行政区面积大小强烈干扰视觉平衡，**绝不能直接用于填绘等值区域（分级设色）图**——**等值区域图必须用来表达面积归一化的派生比率数据（如人口密度、单位产值）**，而**绝对总量数据应采用点状分级符号图、统计图表图或点值法**表示。
4. **字体注记与视觉规范**：字体变化本身兼具视觉变量属性（字样/颜色/斜体表定性，字号/粗细/大小写表定量）。一幅图宜控 1～2 种核心字样，习惯上**水系用斜体、政区用粗体**；摆放上**点名放右上、线名沿走向平行、面名置于内部主轴覆盖范围**。
5. **图面配置四大视觉原则与全要素构成**：须同时满足**主题突出（主图置于光学中心即几何中心偏上）**、**图面平衡（避免亮暗偏重或紧贴图廓）**、**图形-背景比率鲜明**、**视觉层次清晰（插入遮挡、初/二级再分结构、对比度）**；完整图面需配齐**主图（及移图/扩大图）、副图、图名（含区域+主题+时间）、图例、比例尺、指北针（非上北下南必加）与图廓格网**。
6. **连续地形与三维可视化形式比较**：**等值线**定量量测精度最高但需读图判读立体；**分层设色**色彩鲜艳直观分级清楚；**地形晕渲（斜照立体感最强、直照坡度明确、综合光照兼顾二者）**立体感震撼但无法读取具体高程；**透视立体图（配合 LOD 细节层次模型）**纵深逼真但存在背面地形遮挡且不可直接量距。

| 三维地形可视化形式 | 核心表达机制 | 核心优点 | 主要局限性 | 工程典型配合用法 |
| :--- | :--- | :--- | :--- | :--- |
| **等值线图（等高线）** | 连接等高程点形成连续封闭曲线 | **几何与高程定量量算精度最高**、可配合明暗等高线增强立体 | 缺乏直观连续光影立体感，密坡处线条粘连难读 | 制作基础工程地形底图、与坡度图叠加校核 |
| **分层设色法** | 按等高距分级并按自然色谱（绿黄棕白）填色 | 高程带边界一目了然、宏观地势起伏直观鲜明 | 级内微小地形起伏被均质色块抹平 | 与晕渲图或等高线结合制作区域挂图与自然地理图集 |
| **地形晕渲图（Hillshade）** | 模拟光照计算坡面漫反射阴影灰阶或彩色 | **地貌结构与宏观立体感极为逼真震撼**（尤以斜照晕渲） | **无法直接反查绝对高程值**；斜照法阴坡信息易压缩 | **半透明（如 60%）叠加彩色 DEM 分层设色图**（实验 3D） |
| **立体透视与 3D 景观** | 中心透视投影 + 纹理映射 + **LOD 动态调度** | 贴近人眼真实沉浸感、可结合淹没模拟与三维飞行 | 存在山体前遮后盲区、图面比例尺随景深非恒定 | 智慧城市 BIM/CIM、防洪淹没三维演练、飞行巡检 |

### 【问答 16】简述网络 GIS 架构（C/S、B/S 瘦客户端、Web Service、Grid GIS）的演变与特点，并对比 OGC 核心地理信息服务标准（WMS、WFS、WCS、WMTS、WPS、GML）及 LBS 原理。（第 11 章高频）

**【6 大核心采分点】**：
1. **广义与狭义网络 GIS 演进脉络**：计算架构的每一次革新重塑 GIS——从单机桌面演进为局域网 **C/S 架构**、互联网 **B/S（WebGIS）**、松耦合 **Web Service / OGC OWS 互操作框架**、无线 **移动嵌入式 GIS**、**网格 Grid GIS** 乃至当今“云服务 + Portal 门户 + 多端”的**云 GIS**。
2. **C/S 模式 vs B/S 模式与“瘦客户端”概念**：**C/S 模式**服务器集中管库、计算落在专用胖客户端，响应极快但维护升级复杂且跨平台性差；**B/S 模式（WebGIS）**以标准 Web 浏览器充当**瘦客户端**（免安装、几乎不跑重型 GIS 算法、仅发请求并渲染视图），核心存储与分析全归服务器端，实现真正跨平台、大众化、低成本维护与广域透明共享。
3. **Web Service 与 OGC OWS 互操作基石**：Web Service 通过 **SOAP（调用）、WSDL（描述）、UDDI（发现）**实现跨语言平台松耦合交互；OGC 据此建立 **OWS（OGC Web Services）**标准体系，利用 HTTP 与 XML 让不同厂商软件得以透明共享空间数据与功能服务。
4. **OGC 四大核心数据/地图服务精准区分**：**WMS** 服务端动态绘图返回只读静态图片（PNG/JPEG）；**WMTS** 分发预渲染好的固定尺度栅格瓦片实现高并发秒开；**WFS** 返回带完整坐标和属性的底层矢量要素（GML/GeoJSON，**WFS-T 支持在线空间编辑**）；**WCS** 返回未经可视渲染的原始科学数值栅格矩阵（如高程 DEM、多波段遥感值）供客户端二次定量分析。
5. **Grid GIS（空间信息网格）与“4A”目标**：基于网格计算虚拟化整合广域异构超级算力与海量存储，支持 HTTP/SSL 穿透防火墙并具备海量并行空间计算能力，其终极愿景是实现 **“4A”服务目标：Anyevent（任意源事件）在 Anytime（任意时刻）安全发送给 Anywhere（任意地点）的 Anyone（任意授权用户）**。
6. **基于位置的服务（LBS）三段工作闭环**：在移动计算与无线网络环境下融合 **GIS + GNSS 定位 + 移动通信**——终端采集自身位置与查询条件上传 $\to$ 中心 GIS 服务器完成空间检索或路网分析 $\to$ 结果下传移动端实时显示；涵盖**位置查询、实时监控与导航规划**三大类业务。

| OGC 标准 / 架构名词 | 返回/传输实体本质 | 核心操作/协议关键词 | 是否支持客户端二次分析/编辑 | 典型应用场景 |
| :--- | :--- | :--- | :--- | :--- |
| **WMS（网络地图服务）** | 渲染好的**栅格图片**（PNG/JPEG） | `GetCapabilities`, `GetMap`, `GetFeatureInfo` | 仅浏览与点选查表，**不可编辑几何** | 动态专题图浏览、叠加多源只读底图 |
| **WMTS（地图瓦片服务）** | 预切分的**金字塔矩阵瓦片**（`z/y/x`） | `GetTile`（极易 CDN 静态缓存） | 仅高速地图背景浏览，不可改样式 | 高并发公众互联网电子地图（天地图） |
| **WFS（网络要素服务）** | 原始**矢量坐标与属性**（GML/GeoJSON） | `GetFeature`, `Transaction`（WFS-T） | **支持要素级几何下载、查询与在线编辑** | 跨部门矢量协同采集更新、前端空间分析 |
| **WCS（网络覆盖服务）** | 原始**未渲染数值栅格/多维覆盖** | `GetCoverage`（保留原始像素物理值） | **支持客户端直接作坡度/波段代数运算** | 遥感反演数据分发、DEM 科学计算共享 |
| **WPS / CSW / GML** | 在线处理模型 / 元数据目录 / XML 编码 | 标准化在线算子调用与元数据结构检索 | **WPS** 将缓冲区/叠置等算法云端化服务 | 远程空间分析微服务流水线与资源目录检索 |

## 模块六：SuperMap 4 次上机实验原理与思考题精解

### 【问答 17】系统总结《地理信息系统原理》四次 SuperMap iDesktop 11i 上机实验的核心工艺流程、关键技术参数及全部实验思考题。（实验实战综合必考）

**【6 大核心采分点】**：
1. **实验一（软件基础与重投影：UDX + 坐标系变换）**：掌握工作空间（`.smwu`）与文件型数据源（`.udx`/`.udbx`）管理、矢量/栅格（`.shp`/`.tif`）入库；在**数据源与数据集级别**区分定义坐标系与**重投影变换**（如由 `WGS 1984` 地理坐标系投影为 `Sinusoidal` 正弦等面积投影）。**思考题要点**：在仅修改数据集属性中“投影设置”只改变元标签会造成显示错位，**必须在数据/投影转换层面进行数学重投影计算**才真正重新算得目标投影坐标。
2. **实验二（数据采集编辑与地图配准：格式互转 + `.drfu` + 分层矢量化）**：掌握 **CAD (`.dxf`) $\leftrightarrow$ Shapefile** 及 **GeoTIFF $\to$ ECW** 压缩转换（ECW 采用离散小波有损压缩致体积大幅缩小）；通过“追加行（要求点/线/面几何类型必须一致）”与“追加列”整合数据，使用**精确定点（参数化 Tab 键）与捕捉设置（防止相邻边界产生缝隙或重叠）**编辑几何；扫描纸图经**线性配准（$\ge 4$ 点）或多项式配准（$\ge 10$ 点）**计算残差并锁定微调刺点（导出 `.drfu` 文件复用）后完成点/线/面分层采集。
3. **实验三 A（栅格处理与窗口统计）**：理解**影像金字塔**提升大数据平滑浏览与显示效率；验证**矢栅互转**产生锯齿根源在于网格离散化（**减小像元分辨率尺寸可改善锯齿**），且务必保证**栅格值字段数值落入像素位深范围**（如 4 位像素仅存 $[0, 15]$，超界值 20 将被强制置 0）；串联**任意多边形裁剪 $\to$ 重分级（Reclassify，将连续 DEM 转为 `0/1` 掩膜）$\to$ 栅格代数运算（`[dem]*[demReclassify2]`）$\to$ 三种重采样算法对比 $\to$ $3\times 3$ 邻域均值统计（Focal）**。
4. **实验三 B（矢量缓冲、叠置与网络分析）**：针对道路扩建使用 SQL（`SmID = 60`）筛选目标后执行**等距圆头缓冲（$15\ \mathrm{m}/10\ \mathrm{m}$）**与**左右字段不等距平头缓冲**并空间查询拆迁建筑；用**裁剪（Clip）**与**擦除（Erase）**提取刘庄村内/外土地利用（思考题：还可用**求交 Intersect** 提取村内利用）；通过**线拓扑处理 $\to$ 构建二维拓扑网络（节点容限 `2.0`）**实现两点/必经点/障碍点**最佳路径分析**、与 **TSP 旅行商分析**对比及 $1000\ \mathrm{m}$ **服务区分析**。
5. **实验三 C & D（距离栅格综合选址 + DEM 数字地形与水文分析）**：**实验 3C** 统一分析范围环境后，构建**欧氏距离栅格 $\to$ 重分级为 `0/1` 布尔图层 $\to$ 栅格代数相加/相乘**解决水源污染分级（`DOP01 + DOP02`）与城镇避让保护区选址（`Dist_NatureRC * Dist_ResRC`）；**实验 3D** 由离散点（TIN）/等高线建 DEM 后，计算**坡度（$[0^\circ, 90^\circ]$）、坡向、提取等值线、三维晕渲（60% 不透明度 DEM 分段专题图叠加晕渲）与可视域（观察高程 $=$ 地面高程 $+$ 附加高程）**，并完成**填洼 $\to$ D8 流向（$2^{0\sim 7}$ 距离权落差，对角除以 $\sqrt{2}$） $\to$ 汇流累积量 $\to$ 汇水点 $\to$ 流域划分**全链路。
6. **实验四（专题制图输出与 3D 场景演练）**：巩固扫描地图地理配准与分层采编并结合标签/范围/单值专题图完成水系交通专题地图排版输出（误差来源：底图图纸伸缩、扫描畸变、控制点刺点与算法误差、手点跟踪抖动）；并在三维平面场景中配置相对地面高度实现**多边形区域淹没模拟（如设高程 $3000\ \mathrm{m}$）与飞行路径（`.fpf` 站点高度 $5000\ \mathrm{m}$）三维动态漫游**。

| :--- | :--- | :--- | :--- |
| **实验 1 (A/B)** | `world.smwu`、`reproj.udx`、WGS84 $\to$ 正弦投影 | 新建文件型 UDX/UDBX；矢量/栅格数据集投影转换 | 投影设置仅修改参考标签不改坐标；**必须执行数据集投影转换**才重算几何并显出投影变形 |
| **实验 2 (A/B)** | `map.dxf` $\to$ `.shp`、`.tif` $\to$ `.ecw`、江苏扫描图 | 线性配准 $\ge 4$ 点、多项式 $\ge 10$ 点、导出 `.drfu`；追加行列 | **`.ecw` 体积骤减原因**：ECW 是基于小波变换的高压缩率有损栅格格式；**捕捉作用**：防缝隙/重叠保拓扑；**控制点原则**：特征明显交点、全局均匀覆盖、数量达标、残差 $<1$ |
| **实验 3A** | `ex3A.udb`（`dem`, `Slope1`, `china`） | 金字塔；矢栅互转；重分级；代数乘法；重采样；邻域统计 | **锯齿成因**：网格离散化近似斜线，调小像元分辨率可改善；**4 位像素越界**：仅存 $[0,15]$，超界被置 0；不同窗口形状/函数直接控制平滑度与极值响应 |
| **实验 3B** | `ex3B`（道路拆迁、刘庄村土地、路网中心线） | SQL `SmID=60`；圆头/平头不等距缓冲；裁剪/擦除；拓扑构网容限 `2.0` | **提取村内地类除裁剪外可用“求交”**；**最佳路径 vs TSP**：前者按固定站点先后顺序算最小阻力，后者自动规划最优访问次序 |
| **实验 3C** | `ex3C.udb`（水源点、`urbanNP`/`urbanNew`） | 统一分析范围 $\to$ 生成欧氏距离栅格 $\to$ 重分级 0/1 $\to$ 代数乘加 | `Dist_NatureRC`（保护区外 0.05 赋 1 内赋 0）乘 `Dist_ResRC`（城镇 0.06 内赋 1 外赋 0）即得**满足双向避让约束的合法拓展区** |
| **实验 3D** | `ex3D1`/`ex3D2.udb`（高程点、等高线、DEM） | TIN/DEM 构建 $\to$ 坡度坡向/晕渲(60%透明度)/可视域 $\to$ 填洼+D8 水文 | **为何先填洼**：消除噪声假洼地保证径流连通；**D8 距离权落差**：正交除 $1$、对角除 $\sqrt{2}$；**观测点总高** $=$ 地表高程 $+$ 附加高程 |
| **实验 4 (A/B)** | `reg01`/`reg02`、水系交通图、`ex4B.udb` 3D | 分层矢量化专题出图 $\to$ 平面三维场景 $\to$ 淹没 $3000\ \mathrm{m}$ / `.fpf` 飞行 | **数字化误差源**：原图伸缩、扫描畸变、配准控制点残差、人工跟踪抖动与抽稀误差（通过严选底图、均匀多点配准与开捕捉微调减小） |
</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
</body>
