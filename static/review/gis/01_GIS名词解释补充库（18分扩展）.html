## 零、易混淆核心概念一句话差异补充表

| 对比组 | 概念 A | 概念 B | 一句话核心采分差异点 |
| :--- | :--- | :--- | :--- |
| **1. 椭球基准** | **参心坐标系** | **地心坐标系** | 参心系原点在参考椭球中心（局部吻合，如北京 54、西安 80）；地心系原点在地球质心（全球一致，如 WGS84、CGCS2000）。 |
| **2. 四叉树变体** | **常规四叉树** | **线性四叉树（$M_D$ 码）** | 常规四叉树存全部中间节点（每节点 6 变量、指针冗余大）；线性四叉树仅存叶节点十进制 Morton 码与属性值（占常规 $2\% \sim 25\%$）。 |
| **3. 图幅接边** | **几何接边** | **逻辑接边** | 几何接边消除跨图幅边界点位错位、缝隙与重叠（几何裂缝）；逻辑接边统一跨幅同一地物的编码与属性差异（逻辑裂缝）。 |
| **4. 窗口算子** | **焦点统计（Focal）** | **块统计（Block）** | Focal 逐像元移动窗口、相邻窗口重叠且保持细节；Block 划为互不重叠区块整块赋同值，具降尺度聚合效果。 |
| **5. OGC 服务** | **WMS / WMTS** | **WFS / WCS** | WMS 返回动态渲染地图图片，WMTS 返回预切静态瓦片；WFS 返回矢量要素及属性，WCS 返回原始科学数值栅格矩阵。 |

## 模块一：第 1～2 章 概论与空间数学基础扩展（10 词）

| 补充名词 | “1 句本质定义 + 1 句核心特征/用途”极简满分答案（40～70 字） |
| :--- | :--- |
| **1. GISc 与 GISi** | GISi 以“3S”研究地球表层信息流；GISc（1992 年 Goodchild 提出）研究地理信息规律，为 GIS 工程提供理论支撑。 |
| **2. “3S”集成技术** | 将遥感（RS 动态面状数据源）、卫星导航定位（GNSS 精准时空基准）与 GIS（融合分析决策中枢）有机集成的对地观测综合技术体系。 |
| **3. 数字地球** | 以地球地理坐标为基准、海量多分辨率多维地理信息为内容、网络与虚拟现实技术为支撑，对真实地球进行全数字化虚拟再现的巨系统。 |
| **4. 大地与地心直角系** | 大地坐标系以参考椭球面及法线定义 $(B,L,H)$；地心空间直角系以地球质心为原点建立右手系 $(X,Y,Z)$，便于卫星定位与三维坐标转换。 |
| **5. 变形椭圆** | 又称 Tissot 指示椭圆，是地球椭球面上的微小圆经地图投影展平后形成的椭圆，通过长短半轴与面积直观度量长度、面积和角度变形。 |
| **6. 高斯-克吕格投影** | 横轴等角切圆柱投影，中央经线比 $1$。我国分 6°（1∶2.5 万～50 万）与 3° 带（1∶1 万），横轴西移 $500\ \mathrm{km}$ 加带号。 |
| **7. UTM 投影** | 横轴等角割圆柱投影，中央经线比 $0.9996$，6° 带变形 $\le 0.04\%$，自 $180^\circ\mathrm{W}$ 起分 60 带，广泛用于遥感影像与国际制图。 |
| **8. 兰勃特等角投影** | 双标准纬线下为正轴等角割圆锥投影，两标准纬线上无变形、纬线为同心圆弧且与经线正交，极适于中低纬度东西延伸区（如我国 1∶100 万图）。 |
| **9. 布尔沙七参数模型** | 跨参考椭球基准三维空间直角坐标转换模型，含 3 个平移、3 个旋转角和 1 个尺度因子共 7 参数，至少需 3 个公共三维控制点求解。 |
| **10. 地形图分幅编号** | 我国 7 种基本比例尺均以 1∶100 万（$6^\circ\times 4^\circ$）为基础，10 位新图号由“百万图号 3 位+比例尺码 1 位+行列 6 位”构成。 |

## 模块二：第 3～4 章 空间数据模型与数据结构扩展（12 词）

| 补充名词 | “1 句本质定义 + 1 句核心特征/用途”极简满分答案（40～70 字） |
| :--- | :--- |
| **11. 空间实体** | 现实世界中不可再分的地理现象抽象体，是 GIS 建模的基本单元，完整具备空间位置、属性、时间和空间关系四大基本特征。 |
| **12. 线性参照与动态分段** | 线性参照沿线状实体引入一维里程值（$M$ 值）相对定位事件（如桩号）；借此实现动态分段，无需切分基础路网几何即可管理多属性路段。 |
| **13. 时空数据模型（TGIS）** | 在三维空间基础上显式引入时间维 $T$ 刻画实体演化的数据模型，常见逻辑实现有序列快照（冗余大）、基态修正（存增量）与时空复合模型。 |
| **14. 四交与九交模型** | 点集拓扑形式化模型：4IM 仅考内部与边界（$2\times 2$ 矩阵）；9IM 增入外部成 $3\times 3$ 矩阵，可精确区分二维简单面 8 种拓扑关系。 |
| **15. 实体（面条）结构** | 非拓扑的简单矢量坐标串结构，独立记录每个点、线、面的完整坐标。读写简单直观，但相邻多边形公共边重复存储，易产生缝隙与重叠。 |
| **16. DIME 与链状双重独立** | DIME 以直线段同时绑定起止结点与左右面；链状双重独立编码将连续折线合并为弧段（链），彻底消除共享边冗余并克服曲线表达臃肿。 |
| **17. 游程与二维行程编码** | RLE 逐行将连续等值像元压缩为`(值, 长度)`对，适于大块均质专题图；二维行程编码沿二维合并均质方形块或同值叶节点，压缩率更高。 |
| **18. 常规四叉树** | 对 $2^n\times 2^n$ 栅格递归四等分至子块均质的可变分辨率树，保留全部中间节点，每节点占 6 变量（1 父、4 子指针及 1 属性值）。 |
| **19. 瓦片金字塔结构** | 在影像金字塔基础上，将每层按固定尺寸（如 $256\times 256$）切分为瓦片并按 `z/y/x` 索引，是 WebGIS 高并发地图缓存基石。 |
| **20. 矢栅一体化结构** | 在同一结构中融合矢量高精度定位与栅格快速分析的组织方式，如三级线性四叉树 `(M0, M1, M2)`，可避免频繁矢栅互转失真。 |
| **21. Voronoi 图与 TIN** | Voronoi 图按最近母点剖分影响域；TIN 以互不重叠三角片逼近地形，遵循 Delaunay 准则（空外接圆、最大最小角）并保特征线。 |
| **22. 八叉树与 B-rep** | 三维 GIS 两大结构：八叉树沿三轴递归八等分体素，适于非均质地下地质体；B-rep 用点、边、面闭合轮廓定义实体，适于三维城市建筑建模。 |

## 模块三：第 5～6 章 空间数据库与数据采集处理扩展（8 词）

| 补充名词 | “1 句本质定义 + 1 句核心特征/用途”极简满分答案（40～70 字） |
| :--- | :--- |
| **23. 空间数据管理模式** | 空间几何与属性的存储协同架构，历经纯文件、文件-关系混合、全关系（BLOB）到对象-关系型数据库（ORDBMS）四阶段演进。 |
| **24. MBR 与格网索引** | MBR 用实体最小外接矩形四坐标粗过滤无关目标；格网索引将空间剖分为规则或多级网格映射实体 ID，定位极快但跨格大对象会重复记录。 |
| **25. R 树与 $\mathrm{R}^+$ 树索引** | 基于聚簇 MBR 的多维平衡树：R 树允许兄弟 MBR 重叠、不拆对象；$\mathrm{R}^+$ 树严禁重叠、切分跨界对象以实现单路径极速点查。 |
| **26. 地理配准与几何纠正** | 借同名控制点建立图像坐标与真实地理坐标的映射以消除扫描畸变的过程，常用线性（$\ge 4$ 点）、多项式（$\ge 10$ 点）及分块橡皮页拉伸模型。 |
| **27. 矢量四类拓扑错误** | 常见几何拓扑缺陷：伪结点（多余 2 度点）、悬挂结点（过/欠头悬空端）、碎屑多边形（公边微偏伪面）和不正规多边形（8 字自交）。 |
| **28. 道格拉斯-普克算法** | 经典的全局递归矢量线简化算法：连首末点求中间点最大垂距 $d_{\max}$，小于阈值 $L$ 全舍，否则在极值点分裂递归，最完整保留曲线形态骨架。 |
| **29. 图幅接边** | 消除相邻图幅拼接缝隙与属性冲突的编辑处理，包含几何接边（边缘回缩 2～3 点容差捕捉对齐）与逻辑接边（统一跨幅地物编码并消融伪边界）。 |
| **30. 空间数据质量五指标** | 衡量空间数据对应用适用度的五大标准：数据完整性、逻辑一致性、位置精度、时间精度和属性精度，评价分为直接抽检与间接误差传播预估。 |

---

## 模块四：第 7～8 章 空间分析与数字地形分析扩展（12 词）

| 补充名词 | “1 句本质定义 + 1 句核心特征/用途”极简满分答案（40～70 字） |
| :--- | :--- |
| **31. 空间度量与距离** | 定量测算空间对象几何形态与间隔的基础分析：多边形面积常用梯形法，边界包络用凸包/MBR；距离分欧氏、曼哈顿及非匀质成本阻力距离。 |
| **32. 矢量叠置核心算子** | 多边形叠加算子：Union 全保，Intersect 取重叠双属性，Clip 留源属性，Erase 挖禁区，Identity 保源挂新属性。 |
| **33. 地图代数与重分类** | 地图代数在配准栅格间逐像元执行算术或逻辑函数运算；重分类将连续值或多类归并为等级或 `0/1` 掩膜，二者联用支撑多因子选址评价。 |
| **34. 焦点统计与块统计** | 栅格窗口两种扫描方式：焦点统计（Focal）逐格重叠移动、保分辨率细节；块统计（Block）划互不重叠块赋同值、具降尺度聚合效果。 |
| **35. 低通与高通滤波** | 栅格邻域卷积函数运算：低通滤波（如 $3\times 3$ 均权 $1/9$）平滑全图并滤除孤立噪点；高通滤波以中心正高权、四周负权锐化凸显突变边缘。 |
| **36. 最佳路径、TSP 与服务区** | 最佳路径（Dijkstra）按固定站点次序求最小阻路；旅行商（TSP）自动优化无序多点遍历顺序；服务区沿路网按时间或距离阻力划定可达范围。 |
| **37. DTA、DSM 与 DTM** | DTA 是基于 DEM 提取地形因子的技术；DEM 仅表裸露地表，DSM 含建筑树冠表层包络，DTM 涵盖坡度、水文等广义地面信息。 |
| **38. 坡度与坡向** | 坡度是地表切面与水平面夹角（$S=\arctan\sqrt{f_x^2+f_y^2}$）；坡向是法线水平投影自正北顺时针角（$[0^\circ,360^\circ)$，平地记 $-1$）。 |
| **39. 剖面曲率与平面曲率** | 刻画地形表面弯曲变化的二阶导数因子：剖面曲率沿最大坡降方向控制坡面水流加减速与侵蚀力；平面曲率沿等高线方向控制径流汇聚与发散。 |
| **40. 宏观地形因子** | 刻画区域地貌破碎度的三项大尺度指标：起伏度为窗内 $H_{\max}-H_{\min}$，地表粗糙度为曲面与投影面积比（$\approx 1/\cos S$），切割深度为 $H_{\text{mean}}-H_{\min}$。 |
| **41. D8 水文流向算法** | 格网 DEM 单流向算法：算中心向 8 邻域距离权落差（对角除 $\sqrt{2}$），指向最大正落差方向，按 $2^0\sim 2^7$（1～128）编码。 |
| **42. 可视性分析** | 基于 DEM 地形遮挡判断视线通达性的优化分析，分为检验两固定点视线是否被截断的“两点通视分析”，以及计算视点全域可见区的“可视域分析”。 |

## 模块五：第 9～11 章 空间统计、可视化与网络 GIS 扩展（17 词）

| 补充名词 | “1 句本质定义 + 1 句核心特征/用途”极简满分答案（40～70 字） |
| :--- | :--- |
| **43. ESDA 与空间自相关** | ESDA 借直方图、QQ 图与云图探查分布与离群值；空间自相关量化 Tobler 第一定律，依空间权重矩阵度量近邻属性聚集度。 |
| **44. Getis-Ord $G_i^*$ 热点分析** | 探测属性高低值局部空间集聚的专门统计量：通过邻域检验输出 $z$ 得分，显著正 $z$ 标示高值聚集“热点”，显著负 $z$ 标示低值聚集“冷点”。 |
| **45. 半变异函数四参数** | 地统计定量刻画空间变异随间距 $h$ 衰减的核心函数：含块金值（误差+微变异）、基台值（平稳上限）、偏基台值（结构变异）和变程（有效相关半径）。 |
| **46. 反距离加权插值（IDW）** | 确定性逐点插值法，按距离负幂次 $d_i^{-p}$ 对邻域样点加权平均。计算最快、估值必落于已知极值内，但孤立点易生“牛眼”且无法估算误差。 |
| **47. 克里金插值（Kriging）** | 基于半变异函数的地统计最佳线性无偏估计（BLUE），兼顾距离与方向相关性并输出预测方差图，含普通、简单与泛克里金，计算较慢常需正态检验。 |
| **48. 自然断裂法（Jenks）** | 专题地图与统计数据的聚类优化分级法，自动寻找分布频率自然拐点，使类间差异最大化、类内差异最小化，极适于偏态非均匀分布数据分段。 |
| **49. 核密度估计（KDE）** | 非参数空间点/线聚类平滑方法，以各要素为中心在搜索半径（带宽）内累加光滑核函数生成连续热力密度场，带宽越大结果越宏观平滑。 |
| **50. 地理加权回归（GWR）** | 将坐标 $(u_i,v_i)$ 嵌入回归系数、为每个局部位置建带权方程的局部回归模型，克服 OLS 参数恒定假设，刻画空间非平稳性。 |
| **51. 地理探测器** | 王劲峰等提出的探测空间分异性与驱动因子的非参数统计工具（核心量 $q\in[0,1]$），含因子、交互、风险与生态四模块，兼容定性变量且免疫共线性。 |
| **52. 绝对与派生数据制图** | 原始绝对总量（如总人口）受行政区面积干扰，须用分级符号或统计图表示；面积归一化的派生比率数据（如人口密度）才可用等值区域图分级填色。 |
| **53. 图面配置四原则** | 专题地图排版的四大视觉准则：主题突出（主图置光学中心）、图面平衡、图形-背景比鲜明及视觉层次清晰（插入、再分结构、对比度），并配齐制图要素。 |
| **54. 分层设色、晕渲与 LOD** | 分层设色按高程带自然色谱填色；晕渲模拟光照显立体（分斜照、直照、综合三类）；LOD 按视点距离动态调度多精度三维模型以保障流畅渲染帧率。 |
| **55. C/S、B/S 与瘦客户端** | C/S 用专用胖客户端、响应快但维护差；B/S 以浏览器为瘦客户端（免安装、不跑重型计算），跨平台共享且维护成本极低。 |
| **56. Web Service 与 OWS** | Web Service 借 SOAP/WSDL/UDDI 松耦合交互；OGC 据此建 OWS 框架，借 XML/HTTP 破除异构软件壁垒。 |
| **57. OGC 核心服务标准** | OGC 互操作接口：WMS 供地图图片，WMTS 供预切瓦片，WFS 供矢量及在线编辑，WCS 供原始数值栅格，WPS 供在线算子。 |
| **58. Grid GIS 与“4A”目标** | 依托网格计算虚拟化整合广域异构算力与存储的分布式空间基础设施，终极愿景为“4A”目标：任意事件在任意时刻安全送达任意地点的任意授权用户。 |
| **59. 云 GIS（Cloud GIS）** | 融合云计算弹性算力与时空大数据流处理的一体化平台，由“云服务层+门户控制层+多端应用”构成（如 SuperMap Online）。 |
</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
</body>
</html>
