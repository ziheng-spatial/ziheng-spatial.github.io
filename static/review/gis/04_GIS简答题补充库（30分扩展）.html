## 模块一：概论、地图投影与拓扑编码（第 1～4 章扩展）

### 简答 01：对比 GIS 与 CAD、DBMS/MIS、RS 系统的核心异同（第 1 章扩展）

* **1. 与 CAD（计算机辅助设计）对比**：CAD 仅处理无地理坐标、无拓扑的局部工程几何图元，擅长精细建筑/机械制图；GIS 具备严密地球椭球投影与空间拓扑，强于空间查询与地学分析。
* **2. 与 DBMS/MIS（数据库/管理信息系统）对比**：DBMS/MIS 仅管理结构化属性表格与办公事务，无空间坐标与几何算子；GIS 将空间几何与属性强耦合，支持缓冲区、叠置与空间索引。
* **3. 与 RS（遥感图像处理系统）对比**：RS 侧重多波段电磁波数字影像的辐射校正、分类解译与定量反演；GIS 侧重矢栅多源数据综合管理与决策建模，RS 常为 GIS 提供动态面状数据源。
* **4. GIS 的本质识别特征**：GIS 区别于其他系统的最显著标志是**具有严密地理空间定位基准、空间拓扑关系表达及强大空间分析与地学建模能力**，是“3S”融合决策中枢。

### 简答 02：为什么地图投影会产生变形？对比四大常见投影（高斯、UTM、兰勃特、Web Mercator）及选型原则（第 2 章扩展）

* **1. 投影变形产生的根本原因**：地球椭球面是非零高斯曲率的**不可展曲面**，无法在不拉伸或撕裂前提下展平为平面，故必然伴随长度、面积或角度变形（等角与等面积互斥）。
* **2. 高斯-克吕格投影与 UTM 对比**：高斯为**横轴等角切圆柱投影**（中央经线变形比 $1$，我国 1∶2.5 万～50 万用 6° 带、1∶1 万用 3° 带，横轴西移 $500\ \mathrm{km}$ 加带号）；UTM 为**横轴等角割圆柱投影**（中央经线比 $0.9996$，最大变形 $\le 0.04\%$，自 $180^\circ\mathrm{W}$ 起分 60 带，多用于国际遥感影像）。
* **3. 兰勃特与 Web Mercator 投影特点**：兰勃特为**正轴等角割圆锥投影**，双标准纬线无变形，适合我国 1∶100 万及中纬度东西延伸区域；Web Mercator 为正轴等角切圆柱正球近似投影，高纬截断于 $\pm 85.05^\circ$，专用于 WebGIS 瓦片地图。
* **4. 地图投影选型与跨椭球转换原则**：先看制图区位置与形状（中低纬东西向选圆锥、南北带状选横轴圆柱、极区选方位），再看用途（面积统计必选等面积、地形导航选等角）；同椭球换投影走“反解 $(B,L)$ 再正解”，跨椭球需经三维直角坐标用**布尔沙七参数模型**转换。

### 简答 03：简述矢量拓扑关系的四表逻辑表达以及点集四交（4IM）/ 九交（9IM）形式化模型（第 3 章扩展）

* **1. 多边形-弧段表**：记录每个多边形由哪些有序弧段围成；若弧段前带**负号**，通常表示反向引用或该面域内部含**岛（空洞）**，用于多边形重构与面积计算（外减内）。
* **2. 结点-弧段表与弧段-结点表**：结点-弧段表记录各结点连接的所有弧段（度数 1 判悬挂、度数 2 查伪结点）；弧段-结点表记录每条弧段的**起结点与终结点**，确定弧段走向，是网络分析不可省的核心表。
* **3. 弧段-多边形表**：沿弧段起点至终点前进方向，记录**左邻多边形与右邻多边形**（图廓外部统一记为虚多边形 $P_0$），实现毫秒级邻接多边形查询与接边校验。
* **4. 四交模型（4IM）与九交模型（9IM）**：4IM 将空间对象分为内部 $A^\circ$ 与边界 $\partial A$ 构成 $2\times 2$ 交集矩阵；9IM 引入外部 $A^-$ 构成 $3\times 3$ 矩阵，从 $2^9 = 512$ 种理论态中精确区分二维简单面间的 **8 种标准拓扑关系**（相离、相接、交叠、相等、包含、覆盖、被包含、被覆盖）。

### 简答 04：简述六种常见栅格压缩编码方式（RLE、常规四叉树、线性四叉树、二维行程、链码、金字塔）的原理与适用性（第 4 章核心）

* **1. 游程长度编码（RLE）**：逐行合并连续同值像元记为 `(属性值, 游程长度)`。编解码极简且易行向叠置，但仅用一维相关性，**适合大面积均质专题图，不适连续剧变 DEM**。
* **2. 常规四叉树与线性四叉树（$M_D$ 码）**：对 $2^n\times 2^n$ 栅格递归四等分至子区均质。常规四叉树保留全部非叶节点（每节点占 **6 变量**，指针开销大）；线性四叉树仅存叶节点十进制 **Morton 码（$M_D$ 码）+ 属性值**，存储仅为常规的 **$2\% \sim 25\%$**。
* **3. 二维行程编码**：对一维 RLE 或线性四叉树同值叶节点的二维归并，按`(起点/MD码, 边长, 属性值)`记录均质方形块，压缩率通常优于一维 RLE，适于多时相遥感栅格压缩。
* **4. Freeman 8 方向链码**：不存内部像元，仅记起点行列与沿轮廓 `0～7` 方向码串。压缩率接近矢量、极利算周长与急弯检测，但区域叠置困难且相邻共享边界存在重复存储。
* **5. 影像与瓦片金字塔**：按 $2\times 2$ 逐级降采样构建多分辨率层并切分为 $256\times 256$ 瓦片按 `z/y/x` 存储，额外增加约 $1/3$ 空间换取海量数据秒级缩放与 WebGIS 缓存分发（属有损多尺度组织）。

### 简答 05：简述矢量转栅格（栅格化）与栅格转矢量（矢量化）的核心算法及工程注意事项（第 4 章扩展）

* **1. 矢量转栅格——点与线转换**：点转换直接将地理坐标除以像元分辨率取整得行列号 $(i,j)$；线转换采用 **DDA（数值微分）或 Bresenham 算法**沿线段逐格插值生成四连通或八连通像元链。
* **2. 矢量转栅格——面填充与赋值规则**：常用**内部点扩散（种子填充）法、射线法、扫描线法或边界代数法**完成多边形填充；混合像元赋值选用**中心点法、面积占优法、重要性法或长度占优法**（重要小地物优先用重要性/长度占优法防吞没）。
* **3. 栅格转矢量——线要素三步矢量化**：先经 **$3\times 3$ 窗口细化**在保持拓扑连通前提下抽出单像素中轴骨架；再按 **8 邻域搜索跟踪**（1 个前景格=端点、$\ge 3$ 个=拓扑结点、0 个=孤立点）；最后执行曲线平滑与拓扑化。
* **4. 栅格转矢量——点面转换与工程避坑**：点转换直接反算像元中心地理坐标，面转换沿相同属性值斑块外/内边界追踪闭合轮廓线；工程中须**减小栅格分辨率尺寸减轻锯齿**，并确保像素位深覆盖属性最大值（如 4 位像素仅存 $[0,15]$，超界将被强制置 `0`）。

## 模块二：空间数据库、数据采集与质量控制（第 5～6 章扩展）

### 简答 06：简述空间数据库的设计步骤、存储管理模式演进，以及 R 树与 $\mathrm{R}^+$ 树索引的本质区别（第 5 章扩展）

* **1. 空间数据库标准设计步骤**：依次经由**需求分析与确定专题 $\to$ 概念设计（对象/场抽象与 E-R 建模） $\to$ 逻辑设计（分层定义要素类、拓扑规则与属性表） $\to$ 物理设计（空间参考与索引配置） $\to$ 原型构建测试优化 $\to$ 文档归档入库**。
* **2. 存储管理模式的四阶段演进**：从**纯文件管理**，演进到**文件-关系混合管理**（文件存几何、RDBMS 存属性，并发与一致性弱），再发展到**全关系管理**（拆表或 BLOB 二进制块），最终走向**对象-关系数据库（ORDBMS）** 与空间数据库引擎（SDE）统一管存。
* **3. R 树空间索引机理**：自底向上聚簇空间实体最小外接矩形（MBR）构建高度平衡树；**允许同层兄弟 MBR 相互重叠**、不拆分空间实体，空间利用率高但点查询可能触发多条分支回溯。
* **4. $\mathrm{R}^+$ 树空间索引机理**：在 R 树基础上**强制严禁同层兄弟 MBR 相互重叠**，跨越分解界线的实体被切分并由多个叶节点冗余引用，从而确保点查询沿**单条路径极速到达**，但构建与动态维护较复杂。

### 简答 07：简述地理配准模型、道格拉斯-普克（Douglas-Peucker）线简化算法以及图幅接边流程（第 6 章核心）

* **1. 地理配准常用数学模型与选点铁律**：消除扫描扭曲与投影偏差常用**线性（仿射）配准**（$\ge 4$ 点，纠平移/旋转/缩放/错切）、**多项式配准**（拟合非线性畸变，SuperMap 建议 $\ge 10$ 点）和**橡皮页分片拉伸**；控制点必须选清晰特征交点、全局及四角均匀分布并控 RMS 中误差达标（如 $< 1$）。
* **2. 道格拉斯-普克（Douglas-Peucker）算法步骤**：虚连曲线首末点成直线段，求所有中间点到该直线的最大垂距 $d_{\max}$；若 $d_{\max} < L$（限差）则舍弃全部中间点；若 $d_{\max} \ge L$ 则保留该极值点并将曲线分裂为两段**递归重复**。
* **3. 道格拉斯-普克法特点**：属全局分治算法，形态骨架保留度公认最优且具旋转、尺度不变性；阈值 $L$ 越大压缩比越高但细节损失越多。
* **4. 图幅拼接（几何接边与逻辑接边）流程**：先识别相邻图幅并核查**几何裂缝**（边界错位）与**逻辑裂缝**（跨幅同地物编码属性不一）；接着将边缘回缩 2～3 节点按容差捕捉平滑完成**几何接边**（防生硬折角）；最后统一属性编码并消融同属性公共伪边界完成**逻辑接边**。

### 简答 08：简述空间数据质量的五大评价指标，以及矢量数据常见四类拓扑错误的成因与修复方法（第 6 章高频）

* **1. 空间数据质量五大核心评价指标**：① **数据完整性**（实体、属性及关系的冗余或遗漏）；② **逻辑一致性**（数据结构、拓扑与属性域规则的遵循度）；③ **位置精度**（平面与高程坐标近真值度）；④ **时间精度**（现势性与时间标注准确度）；⑤ **属性精度**（定量值精度与定性分类正确率）。
* **2. 伪结点（Pseudo Node）**：单条均质弧段中间出现只连 2 条弧段的冗余点（因采集中途停顿或删支线未清理所致）；检查规则“线不能有伪结点”，属性相同时直接**合并弧段**修复。
* **3. 悬挂结点（Dangling Node）**：线端悬空未闭合的 1 度孤立点，分**欠头（未接上）** 与**过头（伸出线外）**，会导致构面失败与路网断头；在容差内对过头自动**裁剪（Trim）**、欠头**延伸捕捉（Extend）** 修复。
* **4. 碎屑多边形（Sliver Polygon）**：共用边界微偏或不同精度图层叠置沿边界生成的狭长伪面，严重歪曲图斑数与面积统计；通过设置**模糊容差（Cluster Tolerance）** 或按面积比并入邻面消除。
* **5. 不正规多边形（Weird Polygon）**：边界自相交呈“8”字形或节点折返导致的无效面（致梯形面积为负、质心外溢）；校验自相交后**打断交点、剔除折返重复点并重建闭合环**，数字化时开启捕捉可从源头预防。

## 模块三：空间分析、DEM 与空间统计（第 7～9 章扩展）

### 简答 09：简述矢量多边形叠置三步机理、六大常用叠置算子的区别及栅格缓冲机理（第 7 章高频）

* **1. 矢量多边形叠置标准三步机理**：在两图层坐标系与基准面一致前提下，依次执行**① 几何求交**（交点处插新结点打断弧段）→ **② 拓扑重构**（生成新多边形-弧段拓扑表）→ **③ 属性传递**（借标识点合并挂接双层属性，并用模糊容差剔除碎屑多边形）。
* **2. 并（Union）与交（Intersect）对比**：**Union（$A\cup B$）** 保留双方全部区域与字段；**Intersect（$A\cap B$）** 仅提取双方共同重叠区域并**同时继承 $A$ 和 $B$ 全部属性字段**。
* **3. 裁剪（Clip）与擦除（Erase）对比**：**Clip** 虽同样裁切出 $A\cap B$ 几何外形，但**只保留源图层 $A$ 原属性、不附 $B$ 属性**；**Erase（$A - A\cap B$）** 从 $A$ 中挖去 $B$ 覆盖部分，专用于避让禁区排除。
* **4. 标识/同一（Identity）与对称差（SymDiff）**：**Identity**（SuperMap 称“同一”）完整保留 $A$ 全域几何并仅为与 $B$ 重叠子块挂接 $B$ 属性；**SymDiff** 仅保留各自互不重叠部分，常用于两期土地变化差异检测。
* **5. 栅格缓冲区生成机理**：以源目标像元为起点计算全图**欧氏距离栅格**（或加权阻力**成本距离栅格**），再经**重分类（Reclassify）** 将阈值内赋 `1`、阈值外赋 `0` 生成连续缓冲带。

### 简答 10：对比窗口分析的焦点统计（Focal）与块统计（Block）、低通/高通滤波，以及网络最佳路径与旅行商（TSP）的区别（第 7 章核心）

* **1. 焦点统计（Focal）与块统计（Block）区别**：**Focal** 以每个像元为中心逐格移动窗口，相邻窗口高度重叠，输出保持原空间分辨率与局部细节；**Block** 将全图划为互不重叠的独立区块，整块赋统一统计值，具降尺度空间聚合效果。
* **2. 低通滤波与高通滤波对比**：**低通滤波**（如 $3\times 3$ 均权 $1/9$，权和为 1）通过邻域平均消除孤立噪点、平滑图像；**高通滤波**以中心正高权、四周负权抑制平滑背景，锐化凸显突变边缘。
* **3. 最佳路径分析（Dijkstra）**：给定起终点及**严格按固定顺序经过**的必经中间站点（允许设障碍点/边），基于图论最小阻强累加求解连接有序站点的最低代价路径。
* **4. 旅行商分析（TSP）与服务区分析**：**TSP** 给定一组无固定次序要求的必经站点，由算法**自动重排最优访问顺序**使遍历总阻力最小（用于快递巡检）；**服务区分析**按最大时间或距离阻力阈值沿路网向外追踪生成设施实际可达多边形。

### 简答 11：对比规则格网 DEM 与不规则三角网 TIN（含 Delaunay 三准则），并比较四大空间内插方法的优缺点（第 8～9 章重点）

* **1. 规则格网 DEM vs 不规则三角网 TIN**：**格网 DEM** 矩阵结构极简、易与遥感叠加及提取坡度水文矩阵，但在平缓区冗余大且难表达垂直断崖；**TIN** 分辨率可变、可强制嵌入山脊/谷底断裂线且无冗余，但拓扑存储复杂、难直接做 D8 流向矩阵。
* **2. Delaunay 三角剖分三大准则**：构建最优 TIN 须满足① **形状最佳准则**（最大化最小内角，尽量接近等边正三角形）；② **空外接圆准则**（任一三角形外接圆内不含第四个采样点）；③ **唯一性准则**（无四点共圆退化时剖分唯一）。
* **3. 整体趋势面与局部分块/样条内插（Spline）**：趋势面用全域高次多项式拟合宏观趋势但易病态振荡丢细节；**样条函数（Spline）** 分块保证边界导数连续，**曲面最光滑且整体精度高**，但在突变陡崖处可能过冲超界。
* **4. 逐点反距离加权（IDW）与地统计克里金（Kriging）**：**IDW** 按距离负幂次 $d_i^{-p}$ 加权，**计算速度最快**、估值严守已知极值区间，但对异常点最敏感易生“牛眼”且无误差评估；**Kriging** 为基于半变异函数的最佳线性无偏估计（BLUE），**细节刻画最优且可输出预测方差图**，但计算最慢且常需正态检验。

### 简答 12：简述基于 DEM 提取基本坡面因子、宏观地形因子以及两点通视/可视域分析的原理（第 8 章重点）

* **1. 坡度与坡向提取（$3\times 3$ 窗口差分）**：利用 Horn 三阶反距离平方权公式算东西梯度 $f_x$ 与南北梯度 $f_y$，得**坡度** $S = \arctan\sqrt{f_x^2 + f_y^2}$（$[0^\circ, 90^\circ]$ 或百分比）和**坡向**（法线水平投影自正北顺时针 $[0^\circ, 360^\circ)$，平地记 $-1$，决定北半球南阳北阴）。
* **2. 剖面曲率与平面曲率**：均属地形表面二阶导数——**剖面曲率**沿最大坡降方向度量坡形凹凸，控制水流加减速与侵蚀沉积；**平面曲率**沿等高线方向度量水平弯曲，控制地表径流的汇聚与发散。
* **3. 三大宏观地形因子**：**地形起伏度**为分析窗内最大高差 $H_{\max}-H_{\min}$；**地表粗糙度**为真实曲面与水平投影面积比 $R \approx 1/\cos S$（平地 $R=1$）；**地表切割深度**为窗内均值与最小值差 $H_{\text{mean}}-H_{\min}$。
* **4. 两点通视与可视域（Viewshed）分析**：视点总高程 $=$ 地面高程 $+$ 附加塔高；**两点通视**检查 $OP$ 剖面上所有中间地形点仰角是否均小于 $OP$ 连线仰角（无遮挡则通视）；**可视域**则在搜索半径与视角限制下批量遍历射线输出可见区与盲区，用于基站与防火瞭望塔选址。

### 简答 13：简述 ESDA 核心工具、Getis-Ord $G_i^*$ 热点分析、半变异函数四参数，以及 GWR 与地理探测器的优势（第 9 章高频）

* **1. ESDA 核心诊断工具与作用**：正式建模前用于探查数据分布与空间结构——**直方图**查分布与整体离群值，**正态 QQ 图**检验数据是否服从正态分布（点呈直线即正态，决定克里金前是否需变换），**半变异云图**查距离相关与异常，**Voronoi 图**查局部离群值。
* **2. Getis-Ord $G_i^*$ 热点分析**：弥补 Global Moran's I 只能看相似性而不能直接分高低值簇的不足；通过输出显著 $z$ 得分明确区分**高值集聚“热点”（显著正 $z$）** 与**低值集聚“冷点”（显著负 $z$）**。
* **3. 半变异函数四大参数（Kriging 依据）**：**块金值**（$h\to 0$ 截距，源于测量误差与亚尺度微变异）、**基台值**（平稳总变异上限）、**偏基台值**（基台减块金，表空间结构变异）和**变程**（达基台值的距离上限，**超出变程空间相关性消失、不可内插**）。
* **4. 地理加权回归（GWR）与地理探测器优势**：**GWR** 将坐标 $(u_i,v_i)$ 嵌入回归系数，打破全局 OLS 参数恒定假设以刻画**空间非平稳性**；**地理探测器**基于方差统计量 $q\in[0,1]$，**无需线性/正态假设、直接支持定性类别因子且免疫多重共线性**（含因子、交互、风险、生态四模块）。

## 模块四：可视化、网络 GIS 及 SuperMap 上机实验（第 10～11 章 + 实验）

### 简答 14：简述专题图绝对/派生数据符号配置原则、图面配置四原则，以及常见三维地形可视化形式的对比（第 10 章高频）

* **1. 绝对数据与派生数据配置铁律**：面积不等的行政区若用原始**绝对总量**（如总人口）直接填绘等值区域图会产生严重视觉误导；故**等值区域图必须表达面积归一化的派生比率数据（如人口密度）**，而**绝对总量数据应采用点状分级符号图、统计图表或点值法**。
* **2. 地图图面配置四原则与要素规范**：须兼顾**主题突出**（主图置略高于几何中心的**光学中心**）、**图面平衡**、**图形-背景比鲜明**和**视觉层次清晰**；完整图面配齐主图、副图、图名、图例、比例尺、指北针（非正北必加）与图廓格网，注记习惯**水系斜体、政区粗体、点名放右上**。
* **3. 等值线与分层设色对比**：**等值线**几何与高程定量量测精度最高但立体感弱；**分层设色**按自然色谱（绿黄棕白）填充高程带，宏观地势醒目直观但级内微小起伏被抹平。
* **4. 地形晕渲与 3D 透视（LOD）对比**：**地形晕渲**（斜照立体最强、直照坡度最明、综合兼顾二者）地貌震撼但无法直读绝对高程，常半透明叠加彩色 DEM；**三维透视景观**沉浸逼真且须用 **LOD（细节层次模型）** 按视距动态调度精度保障帧率，但存在山体遮挡盲区。

### 简答 15：简述网络 GIS 架构（C/S vs B/S 瘦客户端、Grid GIS）及 OGC 核心服务标准（WMS、WMTS、WFS、WCS、WPS）的区分（第 11 章高频）

* **1. C/S 模式 vs B/S 模式与瘦客户端**：**C/S** 依赖专用胖客户端、响应快但跨平台和维护差；**B/S（WebGIS）** 以浏览器作**瘦客户端**（免安装、仅发请求和显示，重型空间运算全留服务端），跨平台、易维护且大众化。
* **2. Web Service 与 OGC OWS 互操作基石**：Web Service 依托 **SOAP（调用）、WSDL（描述）、UDDI（发现）** 松耦合交互；OGC 据此建立 OWS 标准体系，借 XML 与 HTTP 破除不同厂商 GIS 数据格式与功能孤岛。
* **3. OGC 四大地图/数据服务核心区分**：**WMS** 动态绘图返回只读静态图片（PNG/JPEG）；**WMTS** 分发预切静态栅格瓦片实现高并发秒开；**WFS** 返回带坐标与属性的原始矢量要素（GML/GeoJSON，**WFS-T 支持在线编辑**）；**WCS** 返回未渲染的原始科学数值栅格（如 DEM/遥感像元值）供二次定量分析。
* **4. WPS、GML 与 Grid GIS“4A”目标**：**WPS** 发布远程在线空间分析算子，**GML** 是基于 XML 的空间数据编码语言；**Grid GIS** 虚拟化整合广域超级算力，追求 **4A 目标**（Anyevent、Anytime、Anywhere、Anyone）。

### 简答 16：汇总《地理信息系统原理》SuperMap iDesktop 11i 四次上机实验的核心工艺流程与高频思考题结论（上机实验必考）

* **1. 实验一（基础管理与投影转换）**：管理 `.smwu` 工作空间与 `.udx`/`.udbx` 数据源；**思考题核心**：仅在数据集属性改“投影设置”只改元数据标签、坐标未重算易错位，**必须执行“数据集投影转换”** 才能真正将 WGS84 重投影为目标投影（如 Sinusoidal）。
* **2. 实验二（格式互转、地理配准与分层采编）**：`.tif` 转 `.ecw` 体积骤减因 ECW 采用**小波高压缩率格式**；“追加行”要求两数据集几何类型必须一致；扫描图**线性配准至少 4 点、多项式至少 10 点**（均匀分布、中误差 $< 1$、导出 `.drfu`）；矢量化开启**捕捉（Snapping）** 防止缝隙重叠。
* **3. 实验三 A & B（栅格统计 + 矢量缓冲/叠置/路网）**：矢栅互转锯齿源于网格离散化（**减小像元分辨率可改善**）；**4 位像素仅存 $[0,15]$，越界值 20 会被强制置 `0`**；提取刘庄村内地类除**裁剪（Clip）** 外也可用**求交（Intersect）**（多带出区划字段）；路网分析须先线拓扑处理再按节点容限 `2.0` 构网，区分固定顺序的**最佳路径**与自动排顺序的 **TSP**。
* **4. 实验三 C & D（距离选址 + DEM 地形水文）**：实验 3C 统一分析范围后经“欧氏距离栅格 $\to$ 重分级 0/1 $\to$ 栅格代数乘加”求解选址；实验 3D 用 **60% 不透明度** DEM 叠盖晕渲，可视域观测总高 $=$ **地表高程 $+$ 附加高程**，水文分析必先**填充伪洼地**再算 **D8 流向**（对角高差除 $\sqrt{2}$）。
* **5. 实验四（专题制图与 3D 场景）**：扫图数字化误差源于图纸伸缩、扫描畸变、配准残差与人工跟踪抖动，通过严选底图、均匀多点配准与捕捉微调降低；三维平面场景中配置相对地面高程完成**淹没模拟（$3000\ \mathrm{m}$）** 与 **`.fpf` 飞行漫游（$5000\ \mathrm{m}$）**。

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
