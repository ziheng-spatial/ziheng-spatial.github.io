## 一、名词解释（共 6 小题，每小题 3 分，共 18 分）

### 1. 地理信息系统（GIS）（3 分）

> **【参考答案与分步采分点】**：
> 1. **核心定义**（1.5 分）：在计算机软硬件支持下，对地球表层地理分布数据进行采集、存储、管理、运算、分析与显示的技术系统；
> 2. **学科特征**（1.5 分）：兼具学科与工程技术双重性质，是处理空间定位信息的专用系统。

### 2. 大地水准面（3 分）

> **【参考答案与分步采分点】**：
> 1. **物理定义**（1.5 分）：假想静止平衡海面延伸至大陆下部、与地球重力方向处处正交的连续闭合重力等位面；
> 2. **几何特征**（1.5 分）：包围大地体，受地质密度影响存在局部起伏，并非严格规则的数学曲面。

### 3. 空间拓扑关系（3 分）

> **【参考答案与分步采分点】**：
> 1. **定义**（1.5 分）：图形在保持连续弹性变形（缩放、旋转、拉伸）下逻辑关系不变的性质，俗称“橡皮几何”；
> 2. **分类与性质**（1.5 分）：核心包括**邻接、关联、包含和连通**四类，比几何坐标更稳定，不随地图投影改变。

### 4. 矢量数据结构（3 分）

> **【参考答案与分步采分点】**：
> 1. **定义**（1.5 分）：在连续坐标空间中直接用 $(x, y)$ 坐标序列精确表达点、线、面实体的数据结构；
> 2. **核心特点**（1.5 分）：特点为 **“定位明显、属性隐含”**，图形精度高、冗余小，但多边形叠置算法较复杂。

### 5. 空间数据索引（3 分）

> **【参考答案与分步采分点】**：
> 1. **定义**（1.5 分）：依据空间对象位置、形状或空间关系按序排列的辅助数据结构，相当于为空间图形集合做的一个 **“目录”**；
> 2. **核心作用**（1.5 分）：通过最小外接矩形等预先过滤无关对象，显著提高图形检索效率。

### 6. 缓冲区分析（3 分）

> **【参考答案与分步采分点】**：
> 1. **定义与集合表达**（1.5 分）：依据点、线、面实体自动建立周围一定宽度 $r$ 影响区域的水平扩展分析，公式为 $P = \{x \colon d(x, A) \le r\}$；
> 2. **分类与用途**（1.5 分）：分为点、线、面缓冲区，常用于服务辐射区或生态避让保护带度量。

## 二、填空题（共 12 小题，每空 1 分，共 12 分）

### 7. GIS 运行环境包括计算机硬件系统、软件系统、空间数据、地学模型和【　　】五大部分，其中最后一个因素是系统建设中的关键和能动性因素。（1 分）

> **【参考答案与采分点】**：**应用人员**（1 分）。

### 8. 强调局部地区大地水准面与地球椭球面符合较好的椭球定位称为【　　】（如我国 1980 西安坐标系）。（1 分）

> **【参考答案与采分点】**：**参考定位**（1 分）。

### 9. 在三类常见高程系统中，我国法定采用的正常高是以【　　】为参考基准面的。（1 分）

> **【参考答案与采分点】**：**似大地水准面**（1 分）。

### 10. 地图投影按变形性质通常划分为等角投影、等面积投影和【　　】三大类。（1 分）

> **【参考答案与采分点】**：**任意投影**（1 分）。

> **【参考答案与采分点】**：**最邻近像元法**（1 分）。

### 14. 参与矢量叠置分析的多个专题图层，必须基于同一地理区域以及【　　】。（1 分）

> **【参考答案与采分点】**：**相同的坐标系统**（1 分）。

> **【参考答案与采分点】**：**`NOT`**（或“非”）（1 分）。

> **【参考答案与采分点】**：**DEM 洼地填充**（或填洼）（1 分）。

> **【参考答案与采分点】**：**正空间相关性**（1 分）。

> **【参考答案与采分点】**：**$3^\circ$ 分带**（1 分）。

## 三、判断题（共 10 小题，每小题 1 分，共 10 分，正确的打 `√`，错误的打 `×`）

### 19. 数据本身就是信息，无需经过加工解释即可自动呈现其意义。（　）

> **【参考答案与采分点】**：**（×）**（1 分）。数据是信息的载体，必须经统计、解译或编码解释后才能成为信息。

### 20. 大地水准面因地质条件存在局部不规则起伏，因此并非严格的数学曲面。（　）

> **【参考答案与采分点】**：**（√）**（1 分）。地球椭球面才是规则的数学曲面。

### 21. 通过精心设计投影公式，可以构造出同时保持等角性与等面积性的地图投影。（　）

> **【参考答案与采分点】**：**（×）**（1 分）。地球椭球面不可展，等角与等面积条件几何互斥，无法同时满足。

### 22. 空间概念模型中，对象模型最适合用来表达地表温度、大气污染等连续分布的地理现象。（　）

> **【参考答案与采分点】**：**（×）**（1 分）。连续分布现象应用**场模型**；对象模型适合边界明确的离散实体。

### 23. 空间拓扑关系比几何坐标更稳定，不会随着地图投影变换、比例尺缩放和连续弹性变形而改变。（　）

> **【参考答案与采分点】**：**（√）**（1 分）。拓扑关系属于“橡皮变换”不变量。

### 24. 空间数据的几何无缝组织已在底层物理存储上彻底消除了图幅或分块边界的断续缝隙。（　）

> **【参考答案与采分点】**：**（×）**（1 分）。几何无缝仅是形式与视觉上的连续；**物理无缝**才是存储层面的彻底合并。

### 25. 测量数据的精密度高，说明多次重复测量值离散程度小，因此其整体准确度也一定很高。（　）

> **【参考答案与采分点】**：**（×）**（1 分）。若存在较大系统偏差，测量值虽集中（精密度高）但整体准确度仍然很低。

### 26. 平均数、中位数和众数是用来反映数据集中趋势的基本统计量。（　）

> **【参考答案与采分点】**：**（√）**（1 分）。极差、方差、标准差、变差系数才反映离散程度。

### 27. 在直方图中孤立存在或被一群显著不同的值包围的样点，一定都是空间数据的离群值。（　）

> **【参考答案与采分点】**：**（×）**（1 分）。直方图中孤立或被包围的样点**不一定**是离群值，需结合空间位置复核。

### 28. GIS 与 CAD 的本质区别在于 GIS 具备严密地理参考投影、空间拓扑关系和强大的空间分析与地学建模能力。（　）

> **【参考答案与采分点】**：**（√）**（1 分）。CAD 侧重无地理基准与无拓扑的工程制图。

## 四、简答题（共 5 小题，每小题 6 分，共 30 分）

### 29. 什么是空间拓扑关系？简述其重要意义，并说明为什么 GIS 中通常不显式存储顺序空间关系？（6 分）

> **【参考答案与分步采分点】**：
> 1. **空间拓扑关系定义**（1.5 分）：图形在连续弹性变形（缩放、旋转、拉伸）下保持不变的逻辑关系（“橡皮几何”），包括**邻接、关联、包含、连通**四类。
> 2. **拓扑意义一（逻辑稳定）**（1 分）：比几何坐标更稳定，**不随地图投影变换而改变**。
> 3. **拓扑意义二（加速查询）**（1 分）：无需耗时几何求交，靠拓扑表即可快速回答邻接、经过等复杂空间查询。
> 4. **拓扑意义三（实体重建）**（1 分）：可由弧段-结点-多边形拓扑表自动重构多边形，并支撑路网分析。
> 5. **不常用顺序空间关系的原因**（1.5 分）：① 顺序关系（上下左右、东南西北）须经复杂方位计算，**缺乏简洁通用的构建方法**；② 结果会**随地图投影和几何变换而改变**，不稳定。

### 30. 什么是空间索引？简述四种常见空间数据索引算法的基本原理。（6 分）

> **【参考答案与分步采分点】**：
> 1. **定义与作用**（2 分）：依据空间对象位置、形状或关系排序的辅助数据结构，相当于**为空间图形集合做的一个“目录”**；通过外接矩形预先过滤无关对象，显著提高检索效率。
> 2. **对象范围索引（MBR）**（1 分）：记录包围实体的最小外接矩形坐标，检索时先排除未落入查询窗的外接矩形再精判。
> 3. **格网空间索引**（1 分）：将区域划分为规则或不规则网格并记录格内实体，常按 **Morton 码（Peano 码）** 建线性索引表。
> 4. **四叉树空间索引**（1 分）：递归四分区域建立树状索引，大实体近树根、小实体在叶端，按编码与边长快速检索。
> 5. **R 树与 $\mathrm{R}^+$ 树空间索引**（1 分）：用外接矩形自底向上聚簇形成平衡树；R 树允许兄弟矩形重叠、不拆实体，$\mathrm{R}^+$ 树禁止重叠、拆分跨界实体以加速单路径点查。

### 31. 什么是栅格数据重采样？比较三种常用重采样方法的原理与适用数据类型。（6 分）

> **【参考答案与分步采分点】**：
> 1. **重采样定义**（1.5 分）：在栅格分辨率匹配、几何纠正或投影变换中，目标格网反算回原栅格非整数位置时，重新估算该点像元值的插值方法。
> 2. **最邻近像元法**（1.5 分）：取距待采点最近的像元值直接赋值（$I(P)=I(N)$）。**速度最快且不改变原始像元值**，**适用于离散分类专题数据**（如土地利用）。
> 3. **双线性插值法**（1.5 分）：取周围 **4 个邻近像元（$2\times 2$）** 按距离加权平均。结果较光滑但改变原值，**适用于连续属性、多规模采样数据**（如 DEM、气温、降雨量）。
> 4. **双三次卷积法**（1.5 分）：取周围 **16 个邻近像元（$4\times 4$）** 做三次曲面卷积插值。保留微特征且图像锐利，计算量大，**适用于航片和遥感影像**。

### 32. 简述叠置分析、缓冲区分析与窗口分析的概念及核心分类（或三要素）。（6 分）

> **【参考答案与分步采分点】**：
> 1. **叠置分析**（2 分）：将**相同坐标系、同一区域**的多专题图层叠加生成新图层，综合属性并产生新空间关系；分为**矢量叠置**（点-面、线-面、面-面）和**栅格叠置**（**布尔逻辑运算**、**重分类**、**数学运算复合法**）。
> 2. **缓冲区分析**（2 分）：依据点、线、面实体建立周围一定宽度影响区的水平扩展分析，公式为 $P=\{x\colon d(x,A)\le r\}$；分为**点缓冲区**、**线缓冲区**（对称/不对称/单侧）和**面缓冲区**（外、内、内外）。
> 3. **窗口分析**（2 分）：对栅格数据开辟固定半径移动窗口在窗内作统计或滤波计算；包含**中心点、分析窗口大小与类型、运算方式**三要素，窗口形状分**矩形、圆形、环形、扇形及其他（如正六边形）** 五类。

### 33. 【重点】如何寻找空间数据的离群值？整体离群值与局部离群值各用什么方法？（6 分）

> **【参考答案与分步采分点】**：
> 1. **两类离群值区分**（1.5 分）：离群值是明显偏离正常规律的异常观测值，按范围分为**整体离群值**（相对全区异常）和**局部离群值**（相对周围邻域显著异常）。
> 2. **直方图法（查整体离群值）**（1.5 分）：将数据分级绘成柱状图，离群值表现为孤立或被显著不同值包围的条柱（注意直方图孤立点不一定都是离群值，须地图刷亮核查）。
> 3. **半变异 / 协方差函数云图法（查整体离群值）**（1.5 分）：绘出样点对距离与半变异值，若某点异常高，则**凡与该点配对的点对无论距离远近都会呈极高数值**，据此识别。
> 4. **Voronoi 图聚类与熵法（查局部离群值）**（1.5 分）：构建 Voronoi 图计算熵值与聚类——**熵值是度量相邻单元相异性的指标**，高熵值区域代表与邻居差异极大，据此揪出局部离群值。

## 五、论述题（共 2 小题，每小题 15 分，共 30 分）

### 34. 全面论述矢量数据结构与栅格数据结构的特征、优缺点对比，以及矢栅数据重构转换与工程选型应用。（15 分）

> **【参考答案与分步采分点】**：
>
> **总起定义**（2 分）：矢量与栅格是 GIS 最基础的两大空间数据组织方式——矢量在连续空间用坐标串精确描述离散点线面（“定位明显、属性隐含”），栅格用规则行列像元阵列近似表达地表（“属性明显、定位隐含”），二者优劣互补并常经数据重构协同应用。
>
> 1. **维度一：表达与存储压缩特征**（2.5 分）：矢量直接记录坐标与拓扑表，冗余小、存储紧凑；栅格每单元仅存单值，数据量随分辨率平方膨胀，常借**游程编码、线性四叉树（$M_D$ 码）、链码或影像金字塔**（有损压缩快速显示与地图切片）压缩。
> 2. **维度二：矢量数据结构优缺点**（3 分）：**优点**为结构严密冗余小、空间拓扑清晰利网络分析、面向对象易存详尽属性、易更新综合、成图精度高；**缺点**为算法复杂、多边形叠置及与栅格组合难、连续数学模拟难、软硬件要求高、绘图成本高。
> 3. **维度三：栅格数据结构优缺点**（3 分）：**优点**为结构简单算法易实现、空间叠置组合极易且利与遥感融合、连续地理现象模拟容易、输出快成本低；**缺点**为数据量大（减体积会丢精度）、难建网络连接、投影变换困难、图形输出不精美有锯齿。
> 4. **维度四：矢栅数据重构与互转机制**（2.5 分）：工程中通过**数据重构**（数据结构转换 + 数据格式转换）实现融合——矢量转栅格便于多因子叠置与适宜性评价，栅格转矢量经细化追踪恢复拓扑便于精细出图，转换时须控分辨率与重采样减少失真。
> 5. **维度五：工程选型与一体化趋势**（2 分）：地籍确权、管网拓扑与路网导航首选矢量结构；遥感土地覆被、DEM 水文流域与连续场模拟首选栅格结构；现代平台向**矢栅一体化多级格网**融合发展。

### 35. 论述 GIS 基本空间分析方法与 DEM 数字地形分析的核心机理，并结合典型测绘或规划案例说明综合应用流程。（15 分）

> **【参考答案与分步采分点】**：
>
> **总起定义**（2 分）：空间分析是 GIS 区别于普通制图与通用数据库的核心灵魂，通过量算、缓冲、叠置、窗口、网络分析与 DEM 数字地形分析挖掘空间规律，赋能测绘与规划科学决策。
>
> 1. **维度一：缓冲区分析与邻近度量**（2.5 分）：按 $P=\{x\colon d(x,A)\le r\}$ 对点、线、面建立一定宽度影响或避让带（含外/内/双侧缓冲），在规划中常用于划定高速噪声带、水源地红线与医院服务圈。
> 2. **维度二：叠置分析与多因子筛选**（3 分）：在相同坐标系、同一区域前提下叠加多专题图层——矢量叠置（求交、擦除等）精确界定属性与边界，栅格叠置用**布尔逻辑（AND/OR/XOR/NOT）、重分类和数学运算复合法**高效筛选适宜地块（如新址选址综合避让禁区与交通可达区）。
> 3. **维度三：窗口分析与局部表面计算**（2.5 分）：以中心点、窗口形状（矩形、圆形、环形、扇形等）和运算方式为三要素，对连续栅格逐格移动统计或滤波（如 $3\times 3$ 均值去噪、提取坡度坡向与地形起伏度）。
> 4. **维度四：矢量网络分析与资源优化**（2.5 分）：依托站点、结点、拐角点、中心、链与障碍六要素，开展**路径分析、资源分配、最佳选址与地址匹配**，如应急消防站选址与救护车避障最佳路径导航。
> 5. **维度五：DEM 构建与水文流域提取应用**（2.5 分）：狭义/广义 DEM 经整体、局部或逐点内插建立后，在山洪防汛案例中严格按**① DEM 洼地填充 $\to$ ② 水流方向确定（D8） $\to$ ③ 汇流累积量计算 $\to$ ④ 河网与流域分水线提取**流程划定集水区，并叠加居民点矢量预测淹没风险区。</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
