## 第一专题：数字影像采样、重采样与核线重排列（第 5 章核心）

### 【问答 01】什么是数字影像重采样？试写出双线性插值的原理与公式，并全面对比三种常用灰度重采样方法的优缺点与适用场景。（必考五星 · 对应第 5 章 PPT 课后题 1）

**【7分标准分点作答】**：
1. **重采样的定义与提出背景（1.5分）**：
   在数字影像核线重排列、数字微分纠正及最小二乘匹配窗口变形中，由几何变换公式反算回原始数字影像上的待求点位置 $(x, y)$ 往往是**浮点坐标（不位于原始整数采样像素中心上）**。利用周围已知整数采样像素的灰度值内插计算该非采样点处灰度的过程，称为**数字影像重采样（Resampling）**。
2. **双线性插值（双曲抛物面插值）原理与公式（2.5分）**：
   - **核心思想**：取待插点 $(x, y)$ 周围最近的 **$2 \times 2 = 4$ 个相邻整数像素**，遵循**“离哪个已知像素位置越近，所赋权重越大”**的原则，先后沿行、列两个方向各做一次一阶线性内插。
   - **标准公式**：设浮点坐标整数部分为 $(i, j) = (\lfloor x \rfloor, \lfloor y \rfloor)$，局部归一化小数偏移量为 $\Delta x = x - i \in [0, 1),\ \Delta y = y - j \in [0, 1)$（局部四角记为 $(0,0),(1,0),(0,1),(1,1)$），则：

     $$g(x, y) = (1 - \Delta x)(1 - \Delta y)g(0,0) + \Delta x(1 - \Delta y)g(1,0) + (1 - \Delta x)\Delta y\,g(0,1) + \Delta x\Delta y\,g(1,1)$$

3. **三种灰度重采样方法全方位对比（3分）**：

| 对比维度 | 最邻近像元法（Nearest Neighbor） | 双线性内插法（Bilinear） | 双三次卷积法（Bicubic） |
| :--- | :--- | :--- | :--- |
| **参与邻域像素** | 最近的 **$1$ 个**像素（坐标四舍五入取整） | 周围 **$2 \times 2 = 4$ 个**相邻像素 | 周围 **$4 \times 4 = 16$ 个**相邻像素 |
| **数学模型本质** | 零阶矩形脉冲核直接赋值 | 双向一阶线性插值（双曲抛物面） | 三次样条多项式逼近理想 $\operatorname{sinc}$ 低通核 |
| **计算速度** | **最快**（仅取整，无浮点乘加） | **适中**（4 项乘加，性价比最高） | **最慢**（16 点卷积，耗时约双线性的 4 倍） |
| **优点** | **完全不破坏原始影像灰度数值**（保光谱特征与分类标签） | 灰度连续自然过渡，消除锯齿阶梯效应，几何精度较好 | 一阶导数连续，**几何精度与边缘锐度保持最好** |
| **缺点** | 几何精度差（最大 $\pm 0.5\ \mathrm{px}$ 位置偏移），斜边缘呈**明显锯齿状** | 具有一定**低通平滑效应**，高频边缘细节轻微变柔和 | 计算费时，强突变边缘可能出现轻微过冲振铃 |
| **工程适用场景** | 遥感分类专题图重采样、快速粗预览 | **核线重排列、DOM 数字微分纠正、LSM 匹配（一般工程首选）** | 高精度出版级正射影像制图、高保真几何精纠正 |

### 【问答 02】什么是核线与核线影像？简述生成核线影像的三种主要原理，并写出共面方程法生成核线的核心思路。（必考五星 · 对应第 5 章 PPT 课后题 2）

**【7分标准分点作答】**：
1. **核线与核线影像定义（1.5分）**：
   通过摄影基线 $S_1 S_2$ 与物方地面点 $P$ 所作的平面称为**核面**，核面与左、右像平面的交线称为**同名核线**（同名像点必定位于同名核线上）。在原始左、右数字影像上，按照同名核线方向重新投影排列并做灰度重采样生成的左、右新影像称为**核线影像**。其核心作用是**彻底消除上下视差（$q = 0$）**供立体观察，并将二维影像匹配降维为**一维同行搜索**。
2. **方法一：借助“水平”像片生产核线影像（1.5分）**：
   利用已知的双像外方位元素（或单独法相对定向元素），先通过二维中心射影变换将倾斜的原始左、右像片投影纠正为**严格平行于摄影基线的理想“水平像片”**；在水平像片上，所有核线天然互相平行且平行于摄影基线方向，只需沿基线方向按固定采样间隔 $\Delta$ 逐行映射回原始倾斜像片重采样即可。
3. **方法二：利用共面条件方程生产核线影像（2分）**：
   - 在完成**单独像对相对定向**后，像空间辅助坐标系以摄影基线为 $X$ 轴（$B_Y = B_Z = 0,\ \omega_1 = 0$）。由共面条件行列式 $\mathbf{B} \cdot (\mathbf{R}_1 \times \mathbf{R}_2) = 0$ 化简得同一核面的不变量常数：

     $$K = \frac{Y_1}{Z_1} = \frac{Y_2}{Z_2} = \mathrm{const}$$

   - 以左片上给定像点 $p(x_p, y_p)$ 为例，先由 $[X_p, Y_p, Z_p]^{\mathrm{T}} = R_1 [x_p, y_p, -f]^{\mathrm{T}}$ 算出该核面的常数 $K = Y_p / Z_p$；代入左片辅助坐标关系 $Y_1 - K Z_1 = 0$（即 $(b_1 - K c_1)x_1 + (b_2 - K c_2)y_1 - (b_3 - K c_3)f = 0$，右片用 $R_2$ 同理），直接得到过该点的左、右同名核线在原始像平面上的**显式直线方程**，沿该核线直线轨迹按等步长采样坐标并双线性内插灰度即生成该行核线像素。
4. **方法三：利用投影（旋转）矩阵生产核线影像（2分）**：
   核线重排列的几何本质是将左、右原始影像空间旋转重投影到同一个与基线 $AB$ 平行的虚拟像平面上。构造由三个正交单位向量组成的核线坐标基 $R_E = [\mathbf{X}, \mathbf{Y}, \mathbf{Z}]^{\mathrm{T}}$（令 $\mathbf{X}$ 沿基线向量 $\overrightarrow{AB}$ 方向，临时光轴 $\mathbf{Z}'$ 取两原始主光轴均值，经叉积 $\mathbf{Y} = \mathbf{X} \times \mathbf{Z}',\ \mathbf{Z} = \mathbf{X} \times \mathbf{Y}$ 正交归一化），结合左右原始旋转矩阵构成核线投影变换矩阵（如 $R_L = R_{\mathrm{aopL}} R_E,\ R_R = R_{\mathrm{aopR}} R_E$），按二维射影矩阵直接完成整图核线重采样。

### 【问答 03】简述数字影像点特征提取的一般步骤，并对比 Moravec 算子与 Förstner 算子的原理与特点。（四星重点 · 对应第 5 章 `5.2`）

**【7分标准分点作答】**：
1. **点特征（兴趣点）提取通用三步流程（2分）**：
   ① **计算兴趣值**：在每个像素局部窗口内设计微分梯度或方差算子计算特征响应值（兴趣值）；② **阈值化初筛**：给定经验阈值剔除均匀背景与低反差噪声点，保留候选点；③ **局部非极大值抑制（抑制簇拥）与子像素定位**：在一定抑制窗口内仅保留兴趣值最大的唯一极值点作为特征点，必要时拟合子像素精确坐标。
2. **Moravec 角点算子原理与优缺点（2.5分）**：
   - **原理**：在以 $(r, c)$ 为中心的方形窗口（如 $5 \times 5$）内，分别计算**水平、垂直、主对角线、副对角线四个方向**相邻像素灰度差的平方和 $V_1, V_2, V_3, V_4$，取四者的**最小值** $\mathrm{IV} = \min(V_1, V_2, V_3, V_4)$ 作为兴趣值（确保角点在所有方向灰度均有剧烈变化，从而排除仅单方向变化的直线边缘）。
   - **优缺点**：计算极简快速；缺点是仅考虑 4 个离散方向故**不具备旋转不变性**，对噪声较敏感，且只能达到**整像素级**定位精度。
3. **Förstner 算子原理与优缺点（2.5分）**：
   - **原理**：利用窗口内 Roberts 对角梯度 $(g_u, g_v)$ 构建 $2 \times 2$ 协方差法方程矩阵 $N = \begin{bmatrix}\sum g_u^2 & \sum g_u g_v \\ \sum g_u g_v & \sum g_v^2\end{bmatrix}$，计算误差椭圆的**圆度** $q = \dfrac{4\det N}{(\operatorname{tr} N)^2} \in [0,1]$ 和**权重** $w = \dfrac{\det N}{\operatorname{tr} N}$。当 $q$ 接近 $1$ 且 $w$ 大于阈值时，表明误差椭圆小且接近正圆，判为高精度角点或圆心。
   - **优缺点**：理论严密、具旋转不变性，能严格区分角点（$q$ 大 $w$ 大）、直线边缘（$q \to 0$）与均匀区（$w \to 0$），且可通过窗口内切线/正交线最小二乘交会实现**高精度子像素级特征定位**，但计算开销明显大于 Moravec 算子。

## 第二专题：影像相关、特征匹配与物方 VLL 匹配（第 6 章核心 `√`）

### 【问答 04】简述基于像方的五种常见相似性匹配测度及其向量几何意义，并说明为什么归一化相关系数（NCC）在实际工程中最常用。（四星重点 · 对应第 6 章 PPT）

**【7分标准分点作答】**：
1. **五种像方灰度匹配相似性测度及几何意义（4.5分）**（将含 $N$ 个像素的目标窗口与搜索候选窗口视为 $N$ 维空间中的两个灰度矢量 $\mathbf{X}$ 与 $\mathbf{Y}$）：
   - ① **互相关函数 $R = \sum x_i y_i$（取最大）**：几何上等价于两矢量的**数量积（内积）最大**（矢量 $\mathbf{Y}$ 在 $\mathbf{X}$ 上投影乘模最大，二维等值线为超平面），直接受图像局部平均亮度和对比度支配，极易在高亮区产生伪峰值；
   - ② **协方差函数 $C = \frac{1}{N}\sum (x_i - \bar{x})(y_i - \bar{y})$（取最大）**：减去窗口均值相当于滤除了信号的直流分量，几何上为去均值矢量的投影最大；当两影像**平均灰度相差一个常数偏移量 $b$ 时不受影响**，但仍受对比度缩放影响；
   - ③ **归一化相关系数 $\rho = \dfrac{\sum(x_i-\bar{x})(y_i-\bar{y})}{\sqrt{\sum(x_i-\bar{x})^2\sum(y_i-\bar{y})^2}} \in [-1,1]$（取最大）**：几何上严格等价于两去均值灰度矢量的**空间夹角 $\theta$ 最小**（$\rho = \cos\theta \to 1$）；
   - ④ **差平方和 SSD $S_2 = \sum (x_i - y_i)^2$（取最小）**：几何上等价于 $N$ 维空间两点间的**欧氏距离（差矢量模平方）最小**（二维等值面为圆）；
   - ⑤ **差绝对值和 SAD $S = \sum \lvert x_i - y_i \rvert$（取最小）**：几何上等价于差矢量各分量绝对值和（曼哈顿距离）最小（二维等值线为对角线平行坐标轴的正方形），无乘法运算、硬件计算最快，但与 SSD 一样对曝光亮度差敏感。
2. **NCC 最常用的核心原因——线性辐射不变性（2.5分）**：
   不同航摄视角、日照与传感器增益常引起左右窗口存在线性亮度和对比度差异 $y_i = a x_i + b\ (a > 0)$。此时 $y_i - \bar{y} = a(x_i - \bar{x})$，代入 $\rho$ 定义式分子分母中的常数偏移 $b$ 被减均值彻底消去，对比度比例因子 $a$ 在分子分母中完全约分抵消（$\rho \equiv +1$），且取值归一化在 $[-1, 1]$ 之间便于统一设定相关合格阈值（如 $\rho > 0.75$）。

### 【问答 05】对比归一化相关系数匹配（NCC）与最小二乘影像匹配（LSM）的原理、数学模型及优缺点，并说明工程上如何配合使用。（必考五星 · 用户指定核心题）

**【7分标准分点作答】**：
1. **基本原理与数学模型对比（3分）**：
   - **NCC（相关系数法）**：假设目标窗口与候选窗口之间**仅有纯整像素平移而无几何形状畸变**，直接滑动矩形窗口计算灰度归一化协方差寻找相关峰值（辅以抛物线拟合求子像素）；
   - **LSM（最小二乘影像匹配）**：考虑地形起伏和摄影倾角造成的窗口透视变形，同时建立窗口间的 **6 参数一阶仿射几何变换模型**（$x_2 = a_0 + a_1 x_1 + a_2 y_1,\ y_2 = b_0 + b_1 x_1 + b_2 y_1$）和 **2 参数线性辐射畸变模型**（$g_1 = h_0 + h_1 g_2$），列出灰度差线性化误差方程 $v = dh_0 + g_2^0 dh_1 + g_x da_0 + x_1 g_x da_1 + y_1 g_x da_2 + g_y db_0 + x_1 g_y db_1 + y_1 g_y db_2 - \Delta g$，在每轮迭代中对搜索窗口做双线性灰度重采样，按最小二乘严密解算最佳子像素位置。
2. **精度、收敛域与优缺点横向对比（2.5分）**：

| 对比维度 | 归一化相关系数匹配（NCC） | 最小二乘影像匹配（LSM） |
| :--- | :--- | :--- |
| **几何变形适应力** | **弱**：假设刚性矩形平移，旋转 $>15^\circ$ 或比例尺差异大时迅速失配 | **强**：6 参数仿射重采样可自适应补偿旋转、缩放与切变透视变形 |
| **理论定位精度** | 整像素约 **$0.3\ \mathrm{px}$**，抛物线拟合达 **$0.15 \sim 0.2\ \mathrm{px}$** | **极高**：可达 **$0.01 \sim 0.1\ \mathrm{px}$**（子像素精度天花板），且自带协因数内部精度评定 |
| **收敛拉入范围** | 搜索窗口可自由开大，拉入范围较宽 | **极窄（仅 $1 \sim 2$ 个像素）**！初值偏差超过 2 像素极易迭代发散或陷入伪极值 |
| **计算耗时** | 无需每步重采样与解 8 阶法方程，速度较快 | 需反复双线性重采样、算图像梯度与矩阵求逆，单点计算开销较大 |

3. **工程协同范式（1.5分）**：
   在数字摄影测量系统中采用**“金字塔 NCC / 特征粗匹配 + LSM 精匹配”串联机制**：先用影像金字塔分层 NCC（或 SIFT 特征匹配）在大搜索范围内稳健锁定误差在 $1$ 像素以内的初始同名点，再将该点输入 **LSM 最小二乘匹配**迭代 3～5 次精化至 $0.05\ \mathrm{px}$ 级超高精度连接点。

### 【问答 06】结合维纳-辛钦定理（谱分析）说明相关窗口大小的选择矛盾，并阐述“金字塔影像相关”的构建方法与核心优势。（必考五星 · 对应第 6 章 PPT 小结题）

**【7分标准分点作答】**：
1. **维纳-辛钦定理谱分析揭示的窗口大小矛盾（3分）**：
   由维纳-辛钦定理，随机影像信号的相关函数 $R(\tau)$ 与其功率谱 $S(f)$ 构成一对傅里叶变换对（影像功率谱近似呈指数衰减曲线）：
   - **当匹配窗口 $a$ 较小时**：功率谱 $S(f)$ 较平缓，窗口内**高频细节信息丰富** $\implies$ 傅里叶反变换后的相关函数峰值 $R(\tau)$ **非常陡峭，定位精度高**（且局部几何透视变形小）；但包含总信息量少、信噪比低，导致**收敛拉入范围极小、误匹配出错率高**；
   - **当匹配窗口 $a$ 较大时**：功率谱 $S(f)$ 较陡峭，**低频概貌信息占优势** $\implies$ 相关函数峰值 $R(\tau)$ **较平缓宽阔，拉入范围大、抗噪强、出错率低**；但高频细节被淹没且窗口内高差变形显著，导致**相关定位精度较差且计算量剧增**。
2. **影像金字塔的构建方法（2分）**：
   将原始全分辨率数字影像作为第 $0$ 层，逐层对其进行**低通平滑滤波并增大采样间隔**（如每 $2 \times 2 = 4$ 个相邻像素取灰度均值合成为上一层 1 个像素，第 $k$ 层 1 个像素对应第 $0$ 层 $2^k \times 2^k$ 个像素），叠置成像素总数逐层按 $1/4$ 递减的多分辨率塔式影像序列（金字塔层数可由窗口大小约束 $w < \operatorname{INT}(n / l^k + 0.5) < l \cdot w$ 或最大先验视差确定）。
3. **金字塔“从粗到精”分频相关的三大优势（2分）**：
   - ① **化解精度与拉入范围矛盾**：顶层实现“**小影像、等效大物理窗口**”（利用低频信息获极大拉入范围和低出错率），逐层将视差乘以倍率向下层传递作为精确初值，底层实现“**大影像、精细小窗口**”（利用高频信息获陡峭相关峰与高定位精度）；
   - ② **计算速度提升数十至数百倍**：顶层像素极少，传至底层后仅需在初值周围 $\pm 2 \sim 3$ 像素极小邻域内精搜，彻底免除了原图大范围盲目滑动搜索；
   - ③ **有效抑制重复纹理歧义性**：粗层宏观上下文约束避免底层细小窗口跳入相邻相似地物伪极值。

### 【问答 07】什么是地面元影像匹配？详述铅垂线轨迹法（VLL）影像匹配的基本原理与完整解算步骤。（必考五星 · 对应目录 `6.3.4` `√` 及第 6 章 PPT）

**【7分标准分点作答】**：
1. **基本原理（2分）**：
   能够不经过像方同名点搜索再前方交会的分步过程，直接在物方三维空间建立待求点坐标与多幅影像窗口相似性函数、一步确定物体表面点三维坐标的方法称为**地面元影像匹配（基于物方的匹配）**。**铅垂线轨迹法（VLL，Vertical Line Locus）**利用“平面位置 $(X, Y)$ 已知的地面点必定位于过 $(X, Y)$ 的一条空间铅垂线上，该铅垂线段在左右像片上的中心投影为两条直线轨迹”的几何约束，沿铅垂线离散搜索高程 $Z$ 直至左右反投影像窗口相关系数达到极大值。
2. **VLL 五步标准计算流程（4分）**：
   - **① 设定铅垂线高程搜索序列**：给定待求地面点（如规则 DEM 格网节点）的平面坐标 $(X, Y)$、测区近似最低高程 $Z_{\min}$、最高高程 $Z_{\max}$ 以及由目标高程精度决定的步距 $\Delta Z$，构造候选高程序列：

     $$Z_i = Z_{\min} + i \cdot \Delta Z \qquad (i = 0, 1, 2, \dots, n)$$

   - **② 共线方程正算左右像方投影坐标**：对当前高程步 $Z_i$，将三维物点 $(X, Y, Z_i)$ 与已知的左、右像片内外方位元素分别代入**共线条件方程**，直接计算出其在左、右原始像片上的对应像点坐标 $(x_i', y_i')$ 与 $(x_i'', y_i'')$；
   - **③ 提取灰度窗口计算相似性测度**：分别以 $(x_i', y_i')$ 和 $(x_i'', y_i'')$ 为中心，在左、右数字影像上开取局部影像窗口（经灰度重采样），计算两窗口的**归一化相关系数 $\rho_i$**；
   - **④ 搜索离散相关峰值**：令 $i$ 从 $0$ 遍历至 $n$ 重复步骤 ②～③，获得一维高程相关曲线 $\{\rho_0, \rho_1, \dots, \rho_n\}$，找出最大相关系数 $\rho_k = \max\{\rho_0, \rho_1, \dots, \rho_n\}$；
   - **⑤ 抛物线子步距拟合求精确高程**：利用峰值 $\rho_k$ 及其上下相邻相关系数（如 $\rho_{k-1}, \rho_k, \rho_{k+1}$）拟合二次抛物线 $f(s) = A + Bs + Cs^2$，求抛物线极值顶点对应的高程 $Z_A = Z_k + \dfrac{\rho_{k-1} - \rho_{k+1}}{2(\rho_{k-1} - 2\rho_k + \rho_{k+1})}\Delta Z$ 作为最终地面高程。
3. **方法优势总结（1分）**：
   **无需预先生成核线影像，也无需再做空间前方交会**，天然适合直接在规则格网平面坐标 $(X,Y)$ 上自动化生成格网 DEM，且可轻松扩展至三视及多视影像联合相关以提高可靠性。

### 【问答 08】在数字影像匹配中需要考虑并克服哪四类核心困难问题？试分析其成因与解决对策。（四星重点 · 对应第 6 章 PPT 小结题）

**【7分标准分点作答】**：
1. **问题一：几何变形（尺度差异、旋转与透视仿射畸变）（2分）**
   - **成因**：不同摄站方位角倾角差异、光学镜头畸变，以及竖直航摄下显著的**地形起伏高差与建筑物陡变**引起的局部尺度拉伸与仿射扭曲。
   - **对策**：预先做相机畸变改正与核线重排列；无序大倾角影像采用具备尺度旋转不变性的 **SIFT/ORB 特征匹配**（或利用 POS 单应矩阵预先纠正视角）；精匹配阶段采用含 **6 参数仿射变换的最小二乘匹配（LSM）**。
2. **问题二：辐射变形（色调暗淡、亮度反差不一致）（1.5分）**
   - **成因**：太阳照明角与被摄坡面反射方向差异（前视逆光 vs 后视顺光）、大气散射与镜头渐晕衰减、传感器曝光增益及数字化误差。
   - **对策**：避免使用 SSD/SAD，改用抗线性辐射变化的**归一化相关系数（NCC）**，或对非线性曝光剧变高度鲁棒的 **Census 变换（汉明距离）与互信息（MI）**，匹配前可做 Wallis 滤波增强反差。
3. **问题三：重复纹理与弱纹理（匹配多值歧义性）（2分）**
   - **成因**：规则农田地块、成排相似住宅屋顶等周期性重复结构产生多个高度相似的相关伪峰值；水面、白墙、阴影等缺乏灰度梯度导致相关峰平坦无解。
   - **对策**：利用**核线几何约束**缩小一维搜索带；采用**金字塔“从粗到精”分层约束**传递宏观视差初值；引入 **SGM 半全局平滑能量约束**、多视影像几何一致性检核（GCCC）或 Transformer 全局注意力匹配（LoFTR）。
4. **问题四：遮挡现象（地形遮挡与地物遮挡）（1.5分）**
   - **成因**：高山深谷陡坡（地形遮挡）或城市高大建筑物（地物遮挡）导致某一部分地面在左片可见而在右片被完全挡住，根本不存在同名像点，强行匹配必产生粗差。
   - **对策**：在密集匹配中交换左右基准片执行**左右一致性检查（$\lvert D_L(p) - D_R(p - D_L(p)) \rvert \le 1$）**精准识别并剔除遮挡点，并结合高重叠度（$\ge 80\%$）**多视影像互补匹配**消除单立体对盲区。

## 第三专题：数字高程模型 DEM 建立、内插与存储（第 8 章核心 `√`）

### 【问答 09】辨析 DTM、DEM 与 DSM 的概念差异，并简述 DEM 数据采集的四类途径及数字摄影测量中的六种采样方式。（四星重点 · 对应目录 `8.1`、`8.2` 及第 8 章 PPT）

**【7分标准分点作答】**：
1. **DTM、DEM 与 DSM 三者概念辨析（2.5分）**：
   - **DTM（数字地面模型）**：广义上是定义在区域 $D$ 上描述地形三维坐标及土地利用、土壤、资源等多种地面信息的 $m$ 维向量有限序列；在狭义工程中特指**剔除了植物、建筑物、桥梁等一切非地面物体后的纯净裸露地表模型**；
   - **DEM（数字高程模型）**：DTM 中最基础的高程子集，是用离散三维向量序列 $\{(X_i, Y_i, Z_i)\}$ 对地面地形高程的数字表示；
   - **DSM（数字表面模型）**：包含地表建筑物屋顶、桥梁、森林树冠等高度在内的最表层包络高程模型。由密集影像匹配或机载 LiDAR 首回波直接获得的是 **DSM**，必须经过**地形滤波（点云分类滤波）**滤除非地面点后才能转化为 **DEM/DTM**。
2. **DEM 数据获取的四大途径（1.5分）**：
   ① **野外地面测量**（全站仪、RTK 实测碎部高程点，精度最高但仅适合小范围）；② **现有纸质地形图数字化**（扫描矢量化等高线与高程点，成本低但受原图现势性与概括误差限制）；③ **主动空间传感器**（机载/星载激光雷达 **LiDAR** 脉冲测距穿透植被林冠、InSAR 干涉雷达）；④ **数字摄影测量方法**（航空/航天立体影像自动匹配 + 前方交会/VLL 生产大面积高密度点云，主流方法）。
3. **数字摄影测量六种 DEM 采样方式特点（3分）**：
   - ① **沿等高线采样**：固定测标高程沿模型表面跟踪记录平面坐标，但等高线间平坦区缺数据、陡坡区过密；
   - ② **沿断面扫描采样**：效率较高，但在地形坡度突变处因人为滞后常产生系统误差，精度较差；
   - ③ **规则格网采样**：按固定 $(X,Y)$ 格网点测高，方法简单、效率高，但**易丢失山顶、陡坎等关键地形特征点**；
   - ④ **渐进采样**：由疏到密，利用**高程二阶差分（或中点二次与线性内插之差）**超阈值判别，在破碎地形处自动局部加密；
   - ⑤ **选择采样**：专门采集山顶/洼地极值点、山脊/山谷线、断裂线、水涯线等地形骨架特征（专为构建 TIN 设计）；
   - ⑥ **混合采样 / 全自动密集匹配采样**：将规则格网自动匹配采样与人工/半自动特征点线选择采样相结合，兼顾高效率与地貌细部保真。

### 【问答 10】详细对比规则矩形格网 DEM（Grid）与不规则三角网（TIN）的数据结构特征与各自优缺点，并区分 DEM 建模与应用中的“两个内插过程”。（必考五星 · 用户指定核心题）

**【7分标准分点作答】**：
1. **规则矩形格网 DEM（Grid）与不规则三角网（TIN）全方位对比（4.5分）**：

| 对比维度 | 规则矩形格网 DEM（Grid） | 不规则三角网 DEM（TIN） |
| :--- | :--- | :--- |
| **空间采样与节点来源** | 将离散采样点内插拟合成 $X, Y$ 方向等间距 $(\Delta X, \Delta Y)$ 的规则矩阵节点 | **直接使用原始离散采样点及地形特征线顶点**按 Delaunay 准则连接成互不重叠的三角形网 |
| **数据存储结构** | **极其简单、存储量最小**：仅需文件头记录起点 $(X_0, Y_0)$ 与步距 $(\Delta X, \Delta Y)$，内部用**二维数组只存高程值 $Z$**（平面坐标由 $X_i = X_0 + i\Delta X$ 隐式推算） | **数据结构复杂、存储量较大**：不仅要显式存储所有顶点的三维坐标 $(X, Y, Z)$，还必须存储网点连接指针、三角形顶点表及邻接三角形拓扑关系表 |
| **地形特征表达精度** | **受固定格网间距制约**：平坦区存在大量冗余点，而在山脊、深谷、陡坎处**容易丢失微地貌特征细节**（出现削峰填谷平滑失真） | **复杂地形保真度极高**：可根据地形起伏自适应调整三角形疏密，并能将**山脊线、山谷线、断裂线作为强约束三角形边**精确嵌入，不损失原始测点精度 |
| **算法处理与管理难度** | 本质等同于保存 $Z$ 值的单波段数字影像，分幅接边、矩阵滤波、数字微分纠正内插等**计算与管理极其便捷高效** | 拓扑构建、动态局部修改、快速空间点定位检索及跨图幅接边算法均较为复杂（故 Ebner 提出一般区用格网、特征区附加 TIN 的 **Grid-TIN 混合网**） |

2. **严格区分不能混淆的“两个 DEM 内插过程”（2.5分）**：
   - **第一类内插（DEM 建模生产阶段——离散点 $\to$ 规则格网节点）**：由不规则分布的原始测量/匹配采样点，通过**移动曲面拟合法、多面函数法、有限元法或先构 TIN 后平面插值法**，拟合计算出规则格网各个节点 $(X_i, Y_j)$ 上的高程值；
   - **第二类内插（DEM 工程应用阶段——已知 DEM $\to$ 任意待定点高程）**：在已建好规则格网 DEM 或 TIN 之后（如反解法数字微分纠正查高程），求解测区内**任意非节点位置 $P(X, Y)$** 的高程：矩形格网常用**双线性多项式（双曲抛物面，保证接边连续但一阶导数不光滑，最快最常用）**或**双三次多项式（16 参数保证跨格网连续且一阶导数光滑）**；TIN 则先用**面积法（$S_{abc} = S_{abp}+S_{apc}+S_{pbc}$）或向量叉积同向法**判定点 $P$ 落在哪个三角形内，再按三顶点平面共面方程线性内插高程。

### 【问答 11】简述由离散采样点内插建立规则格网 DEM 的四种常用方法基本思想与适用特点，并说明有限元内插中如何处理地形断裂线。（四星重点 · 对应目录 `8.3.1` 及第 8 章 PPT）

**【7分标准分点作答】**：
1. **四种格网 DEM 建模内插方法核心原理与适用性（5分）**：
   - ① **移动曲面拟合法（逐点局部函数拟合法）**：对每个待求格网点 $P(X_P, Y_P)$，将局部坐标原点平移至该点，以半径 $R$ 搜索周围邻近采样点（要求点数 $n > 6$ 且均匀分布在四个象限），按距离越近权越大的距离衰减函数赋权，用最小二乘拟合二次曲面 $Z = Ax^2 + Bxy + Cy^2 + Dx + Ey + F$，解出的**常数项 $F$ 即直接为该格网点高程 $Z_P$**。特点：**灵活简单、不占大内存，对高密度点云处理非常有效**；
   - ② **多面函数内插法（整体函数拟合法）**：基于“任何光滑数学表面均可由一系列规则简单核曲面线性叠加逼近”的思想，以 $n$ 个数据点为中心构造圆锥面或双曲面核函数 $q(X,Y,X_j,Y_j) = \sqrt{(X-X_j)^2 + (Y-Y_j)^2 + \delta}$，列立全局方程组解出叠加系数 $c_j$ 后求任意格网点高程。特点：**整体连续光滑，在采样数据点较少且较稀疏时尤为实用**；
   - ③ **有限元内插法（局部样条整体平差法）**：将测区划分为双线性或样条网格单元，以全部格网节点高程为未知数，同时列立“已知采样点高程内插观测方程”与“相邻格网节点二阶差分曲率最小虚拟平滑观测方程”整体最小二乘解算。特点：**能严密顾及地形断裂线与陡坎区域**；
   - ④ **先构 TIN 后平面插值法（当前工程主流实用方法）**：先用全体采样点和特征线构建 Delaunay 不规则三角网（TIN），再遍历每个规则格网点检索其所属三角形，利用三角形三顶点共面平面方程直接算出格网高程。特点：**速度极快、无矩阵病态风险且能精准保留特征线地貌**。
2. **有限元内插中地形断裂线的四步处理要点（2分）**：
   ① 沿断裂线线性加密特征点，求取断裂线与 DEM 格网线的精确交点三维坐标；② 按断裂线与边界将计算单元划分为互不跨越的独立子区；③ 采用**“跌落法”或符号判断法**严格隔离数据：凡与待插点分处断裂线两侧（不属于同一子区）的数据点绝不参与该子区的平差与平滑；④ 分独立子区各自解算高程，防止陡坎被平滑拉缓。

### 【问答 12】简述构建不规则三角网（TIN）的两种主要方法，并对比 TIN 的三种常用存储结构优缺点。（四星重点 · 对应目录 `8.4.1`、`8.4.2` 及第 8 章 PPT）

**【7分标准分点作答】**：
1. **构建 TIN 的两种主要算法（3.5分）**：
   - ① **角度判断法（直接构网扩展法）**：先对原始离散点分块建立空间索引并确定初始基线边（第一个三角形）；随后对已生成三角形每条新扩展边 $AB$，在扩展侧邻近备选点集中利用**余弦定理计算各备选第三顶点 $C$ 对应的张角 $\angle ACB$，选取内角最大者**构成新三角形（等价于局部最大化张角、避免狭长锐角三角形），循环向外扩展并进行三角形重复性检测直至覆盖全区；
   - ② **泰森多边形（Voronoi 图）与狄洛尼（Delaunay）三角网对偶法**：先将区域按最近邻距离唯一划分为互不重叠的凸多边形——**泰森多边形**（每个多边形内仅含一个离散点），再将每两个共享公共边的相邻泰森多边形内的离散点用直线段相连，即生成唯一且最优的**狄洛尼三角网**（满足空外接圆与最大最小角准则，并可加入地形特征线/断裂线强约束边）。
2. **TIN 的三种常用存储结构及优缺点对比（3.5分）**：
   - ① **直接表示网点邻接关系的结构**（存“网点三维坐标表 + 邻接网点指针链”）：**优点是存储量最小，网点增删编辑非常方便**；缺点是三角形面片及其拓扑邻接关系需实时动态重算生成，计算开销大，**不便于 TIN 快速检索与实时显示**；
   - ② **直接表示三角形及邻接关系的结构**（存“网点三维坐标表 + 三角形三顶点编号表 + 三个邻接三角形编号表”）：**优点是网点与面片拓扑检索效率极高**，极便于 TIN 快速渲染显示、局部地形结构分析与等高线追踪；**缺点是数据冗余存储量较大，局部动态修改编辑不方便**；
   - ③ **混合表示网点及三角形邻接关系的结构**（存“带指针网点坐标表 + 网点邻接指针链 + 三角形顶点表”）：存储量与第 ② 种相当，但**同时兼顾了动态编辑便利性与快速拓扑检索的高效率**（此外还可通过转化为规则三角网索引实现 TIN 压缩存储）。

## 第四专题：数字微分纠正与正射影像 DOM 制作（第 9 章核心 `√`）

### 【问答 13】什么是数字微分纠正？其必备的三要素是什么？区分点元素纠正、线元素纠正与面元素纠正，并指出数字微分纠正属于哪一种。（必考五星 · 对应第 9 章 PPT 习题 1、4）

**【7分标准分点作答】**：
1. **数字微分纠正的基本含义（2分）**：
   对于起伏地形上的倾斜航空或航天数字影像，传统的二维平面射影纠正只能消除像片倾角变形而无法消除地形起伏投影差。**数字微分纠正**是依据严密构像数学模型与测区数字高程模型（DEM），将原始非正射数字影像分割为无数微小的像素单元，逐像元进行投影几何反算与灰度重采样，**同时消除因像片倾斜和地形高程起伏引起的全部像点位移**，将其严密转换为正射投影影像（DOM）的过程。
2. **数字微分纠正的三要素（2.5分）**：
   - ① **原始数字影像及其定向参数**（经相机检校与空中三角测量解算的内方位元素 $(x_0, y_0, f)$、镜头畸变参数及外方位元素 $(X_S, Y_S, Z_S, \varphi, \omega, \kappa)$）；
   - ② **数字地面模型（DEM）**（提供测区逐点连续起伏高程 $Z$；实际生产中还需指定输出 DOM 的地面采样距离 **GSD**，通常 DEM 格网间距约为 DOM 分辨率的 10 倍）；
   - ③ **传感器严密或通用成像几何模型**（如框幅式相机的**共线条件方程**、线阵推扫卫星的轨道姿态共线方程或 **有理函数模型 RPC**）。
3. **三种纠正单元类型区分及归属（2.5分）**：
   - **面元素纠正**：以微小平面格网或 TIN 三角形面片为单元，严密解算面片角点像坐标后，面片内部像素用双线性或二维仿射变换线性映射（现代实用快速纠正与三维模型 Mesh 贴纹理的核心原理）；
   - **线元素纠正**：以微小窄条线段为单元消除变形（早期模拟/解析正射投影仪缝隙扫描纠正）；
   - **点元素纠正**：以**单个独立的数字像素点**为最小几何纠正单元，逐点独立解算三维物方与二维像方的投影映射——**严格理论意义上的数字微分纠正属于“点元素纠正”**！

### 【问答 14】详细阐述框幅式航空影像“反解法（间接法）”与“正解法（直接法）”数字微分纠正的原理、处理流程及各自优缺点，并简述工程流行的两种快速实用解法。（压轴必考五星 · 对应目录 `9.2` `√` 及第 9 章 PPT 习题 2、3）

**【7分标准分点作答】**：
1. **反解法（间接法：由地面算影像，$x = f_x(X,Y),\ y = f_y(X,Y)$）原理与五步流程（2.5分）**：
   从空白的输出正射影像规则格网出发反向寻取原片灰度：
   > **流程框图**：`① 确定输出 DOM 有效范围 (X0, Y0) 与分辨率 M (GSD)` $\longrightarrow$ `② 遍历正射格网行列 (X', Y') 算地面平面坐标 X = X0 + M·X', Y = Y0 + M·Y'，并由 DEM 内插高程 Z = DEM(X, Y)` $\longrightarrow$ `③ 将 (X, Y, Z) 与内外方位元素代入【共线条件正算式】直接算出原片浮点像坐标 (x, y) 及像素行列号` $\longrightarrow$ `④ 在原始数字影像周围 2×2 邻域执行【双线性灰度内插】得 g(x, y)` $\longrightarrow$ `⑤ 灰度直接赋给正射像素 G(X, Y) = g(x, y)`。
2. **正解法（直接法：由影像算地面，$X = \varphi_x(x,y),\ Y = \varphi_y(x,y)$）原理与流程（1.5分）**：
   从原始数字影像的每个整数像素 $(x, y)$ 出发正向投射到地面：因共线反算式 $X = X_S + (Z - Z_S)\frac{X_a}{Z_a}$ 右端依赖未知高程 $Z$，而 $Z = \mathrm{DEM}(X, Y)$ 又依赖 $(X, Y)$，故**必须迭代求解高程**（给定 $Z_0 \to$ 算 $(X_1, Y_1) \to$ 查 DEM 得 $Z_1 \to$ 循环直至 $\lvert Z_k - Z_{k-1} \rvert < \varepsilon$），算出地面落点后按面积权重向周围正射格网分解与合并灰度，并对未落入像素的空白漏洞做二次插值拟合。
3. **正解法与反解法核心优缺点对比（2分）**：

| 对比维度 | 反解法 / 间接法（工程生产绝对主流） | 正解法 / 直接法 |
| :--- | :--- | :--- |
| **高程迭代与速度** | **框幅式完全无需迭代**，计算简单、数值极稳定，极易逐格网分块并行 | 每颗像素均需**光线与 DEM 曲面迭代求交**，计算复杂耗时 |
| **输出图像完整性** | 正射格网被逐像素遍历，**每个像素必定算出灰度，100% 无空白空洞与堆积** | 落点在地面分布疏密不均，导致**部分正射像素根本无灰度（空洞漏洞），必须二次拟合**，且需复杂灰度分解合并 |
| **遮挡判别与重影** | 仅用裸地 DEM 时**存在映射歧义、无法直接判定遮挡**（高楼屋顶与背阴盲区反算出同一个原片屋顶像素，产生重影鬼影） | 顺着真实摄影光线投射，**可根据空间深度信息自然判定遮挡关系**，无重影歧义像素，保真度高 |

4. **现代流行的两种工程实用快速解法（面元素加速法，1分）**：
   ① **DEM 矩形格网角点内插法**：仅对较稀疏的 DEM 格网四个角点用共线方程严密计算原片像坐标，格网内部密集的 DOM 像素直接用双线性多项式快速内插像坐标再采样灰度；② **基于 TIN（Mesh）的仿射变换 GPU 法**：直接用共线方程算出 TIN 三角面片三个顶点的原片像坐标，三角形内部像素满足线性矩阵仿射变换 $[x', y']^{\mathrm{T}} = A_{2 \times 3}[X, Y, 1]^{\mathrm{T}}$，可直接调用 **GPU 图形学硬件纹理映射管线**极速完成纠正（与三维实景 Mesh 贴纹理同源）。

### 【问答 15】为什么传统 DOM 上高大建筑物会出现倾倒和重影？简述真正射影像（TDOM）及线阵列推扫影像数字微分纠正的核心原理。（四星重点 · 对应目录 `9.2.3`、`9.3` 及第 9 章 PPT）

**【7分标准分点作答】**：
1. **传统 DOM 高大建筑物倾倒与双重“鬼影”成因（2分）**：
   传统反解法 DOM 使用的是滤除了房屋高度的**裸露地表 DEM**。一方面，屋顶高出地面 $\Delta h$ 存在中心投影辐射位移，DEM 因缺失房高未能将其拉回垂直位置，导致**建筑物向像底点外侧倾倒并遮挡相邻街道**；另一方面，当遍历到真实屋顶位置与被遮挡的地面盲区位置时，代入低高程后反投回原片会**重复命中同一片屋顶纹理**，从而在图上印出两个屋顶（**重影/鬼影**）。
2. **真正射影像（TDOM）制作三步核心原理（2.5分）**：
   ① **高精度数字表面模型驱动**：采用精细表达建筑物三维几何轮廓的 **DSM 或 DBM（数字建筑模型）** 代替裸地 DEM 执行微分纠正，将屋顶严格改正回真实正射位置；② **遮挡盲区精确检测**：利用 **Z-buffer（深度缓冲器距离比较法）**或投影光线倾角可见性分析，逐像素判别被高楼遮挡的不可见盲区并置为空白（禁止填入屋顶伪纹理，彻底根除重影）；③ **多视重叠影像纹理补偿与匀光镶嵌**：自动搜索高重叠度（$\ge 80\%$）相邻多视从影像中对该盲区无遮挡的最佳视角提取真实地面纹理填补，最后经 Wallis 匀光与绕建筑物最佳接缝线镶嵌输出 TDOM。
3. **线阵列推扫式影像（如卫星三线阵）的两种数字微分纠正模型（2.5分）**：
   线阵影像在垂轨扫描行方向为中心投影、沿轨飞行方向近似平行投影，**每一扫描行均有独立的一组外方位元素**。反解法纠正时地面点 $(X, Y, Z)$ 到底成在哪一扫描行 $t$ 未知，主要有两类方法：
   - ① **基于共线条件方程的严密物理纠正**：将行外方位元素表示为扫描时间（行号）的低阶多项式或由“定向片”拉格朗日内插表达，对每个正射格网点 $(X,Y,Z)$ 通过**一维牛顿迭代确定最佳扫描行号 $r$**（使该行系下航向坐标 $x \to 0$），再算列号 $c$ 重采样；
   - ② **基于有理函数模型（RFM/RPC）的通用纠正**：利用卫星提供的 **78 个 RPC 三次多项式比值系数**（经少量地面控制点解算像方 6 参数仿射变换消除系统偏置），直接将归一化大地经纬高 $(P, L, H)$ 正向代入有理分式**一步非迭代算出扫描行列坐标 $(r, c)$** 并重采样灰度，简单高效、精度极高，是现代高分卫星 DOM 生产的标准方法。

## 第五专题：解析基础、CV 构像模型与自动空三（第 3、4、7 章核心 `√`）

### 【问答 16】对比矩阵形式的构像模型（投影矩阵 $P$ / DLT）与传统共线条件方程（线元素 + 角元素模型）的异同及各自优缺点。（四星重点 · 对应目录 `4.1.1` `√`、`4.3` `√`）

**【7分标准分点作答】**：
1. **底层物理本质的一致性（1.5分）**：
   两者几何本质完全等价，均建立在**理想针孔相机中心投影（投影中心、像点、物方点三点共线）**基础之上，考虑光学畸变时均采用径向畸变 + 切向畸变多项式修正。
2. **数学形式与求解特性的显著差异（3.5分）**：
   - **传统共线条件方程**：显式以 3 个线元素 $(X_S, Y_S, Z_S)$ 和 3 个欧拉角 $(\varphi, \omega, \kappa)$ 的三角函数构建**强非线性分式方程**。**缺点**是必须给定较好的未知数近似初值才能泰勒线性化迭代收敛，且在大倾角（如无人机俯冲侧翻 $\omega = \pm 90^\circ$）时会遭遇**万向锁（Gimbal Lock）奇异性**；**优点**是参数最少（仅 6 个独立外参，无冗余约束），每个参数具有**极其直观明确的测绘物理与几何意义**。
   - **矩阵形式构像模型（$s\mathbf{u} = K[R \mid T]\mathbf{X} = P\mathbf{X}$）與 DLT**：将内外参合并为 $3 \times 4$ 投影矩阵 $P$（11 个独立线性元素），在齐次坐标下呈**代数线性映射**。**优点**是利用 $\ge 6$ 个不共面空间控制点即可通过**直接线性变换（DLT）**列线性方程组直接求解，**完全不需要任何位姿初值，彻底不受相机大倾角限制**，且适合未知内参的非量测相机；**缺点**是矩阵元素多达 11～12 个，未显式强加旋转矩阵的 6 个正交约束，抗噪精度略低于严密非线性光束法，且矩阵元素缺乏直观几何意义。
3. **现代数字摄影测量中的融合应用（2分）**：
   前端初始化阶段利用 **矩阵模型（DLT / 本质矩阵 $E$ / 基础矩阵 $F$）** 在无初值、大倾角无序条件下快速稳健解出全局初始位姿（经 QR/SVD 分解恢复正交阵 $R$），后端平差精化采用无奇异四元数/李代数光束法整体优化，最终成果交付与立体测图交互再换算回直观的**线元素与角元素**。

### 【问答 17】简述自动空中三角测量的完整作业流程，并详细说明“航带法建自由网”与“基于控制点的刚体变换”的原理与作用。（必考五星 · 用户指定核心题 · 对应目录 `7.4.1` `√`、`7.5.1` `√`）

**【7分标准分点作答】**：
1. **自动空中三角测量四大核心阶段（2分）**：
   `① 影像邻接关系检索`（利用 POS 覆盖范围或视觉词汇树 BOVW / 感知哈希快速找出重叠像对，避免 $O(N^2)$ 盲目匹配）$\longrightarrow$ `② 自动连接点提取与匹配`（金字塔特征/相关匹配、聚类均匀选点 + RANSAC 几何检核剔除误匹配 + 跨片转点构网）$\longrightarrow$ `③ 建立区域自由网`（航带法建自由网或 SfM 建自由网，统一相对比例尺与局部坐标系）$\longrightarrow$ `④ 引入地面控制点执行刚体（相似）变换与整体光束法区域网平差`（输出全网精确外方位元素与加密点绝对三维坐标）。
2. **航带法建自由网（Strip Free-Net）的原理与步骤（2.5分）**：
   - **核心思想**：在不依赖任何地面控制点的情况下，以航带第 1 个立体像对建立局部基准坐标系，将后续像对逐一按统一比例尺连续拼接成整条自由航带模型。
   - **实现步骤**：① 对第 1 像对执行相对定向（给定主基线 $B_{X_1}$）和前方交会，建立首模型；② 对第 $k\ (k \ge 2)$ 个像对执行**连续法相对定向**（令本像对左片直接继承上一像对已定向好的右片旋转矩阵 $R_{k-1}$，保证姿态基准连续一致），暂给初值基线算得初始模型；③ 利用相邻两模型**三度重叠区内的公共连接点及公共摄站投影中心**计算相邻模型间的**比例尺归化系数** $\lambda_k = \frac{1}{m}\sum \frac{S_{\text{前模型间距}}}{S_{\text{后模型间距}}}$，缩放当前基线与模型坐标并刚体平移衔接至首模型坐标系中，递推完成整条自由航带建网。
3. **基于控制点的刚体变换（相似变换绝对定向）原理与作用（2.5分）**：
   - **原理**：无论是航带法还是 SfM 建立的自由网，其内部相对几何形状已经正确，但整体处于任意的局部坐标系与任意比例尺下。利用网内刺入的**至少 2 个平高控制点和 1 个高程控制点（不共线）**，建立自由网坐标 $(X_f, Y_f, Z_f)$ 到地面控制系 $(X_t, Y_t, Z_t)$ 的**三维空间正形相似变换（尺度因子 $\lambda$ + 三维刚体旋转矩阵 $R(\Phi, \Omega, K)$ + 三维平移向量 $T$，共 7 参数）**：先将坐标**重心化**消去平移参数，由控制点重心距比值直接算出精确尺度 $\lambda$，再解算刚体旋转矩阵将全部自由网点云与摄站外方位元素整体转换至绝对地面坐标系。
   - **核心作用**：一步消除自由网的整体尺度、旋转与平移基准偏差，为紧接着进行的非线性**整体光束法区域网平差（Bundle Adjustment）提供高精度、全局必收敛的绝对初值**（同时在此阶段可快速检验外业控制点是否存在刺点号错误等粗差）。

### 【问答 18】对比解析空中三角测量中航带法、独立模型法与光束法区域网平差的异同，并说明光束法为什么要构建“改化法方程”及其矩阵结构特点。（四星重点 · 对应目录 `3.5`、`7.5.2`）

**【7分标准分点作答】**：
1. **三种区域网平差方法核心对比（4分）**：

| 对比维度 | 航带法区域网平差 | 独立模型法区域网平差 | 光束法区域网平差 |
| :--- | :--- | :--- | :--- |
| **基本平差单元** | **单条航带自由网** | **单个立体像对独立模型**（含投影中心） | **单张像片的一束摄影光线** |
| **平差观测值与模型** | 航带模型坐标；三维相似变换 + **二次/三次非线性多项式曲面改正系统变形** | 独立模型三维坐标；每个单元模型 **7 参数三维相似变换**整体平差 | **原始像点坐标 $(x, y)$**；严密**共线条件方程**（每片 6 外参 + 地面点 3 坐标） |
| **理论严密性与精度** | **精度最低**（连接误差沿航带累积，多项式仅为经验拟合） | **精度较高**（消除了航带累积变形，但相对定向与平差分离） | **理论最严密、精度最高**（直接对最原始像点观测值最小二乘平差，无中间误差传递） |
| **粗差定位与扩展性** | 难定位具体出错像点，无法做相机自检校 | 较强（注意必须把投影中心纳入模型连接点以传递俯仰角） | **最强**：可直接对像点残差做数据探测剔粗差，极易引入**自检校附加参数与 GNSS/POS 联合平差** |

2. **光束法构建“改化法方程”的原因与矩阵结构特征（3分）**：
   - **原因**：在自动空三中，未知加密连接点数量 $n_p$（未知数 $3n_p$）往往成千上万，远超像片外方位元素未知数（$6m$），直接对 $(6m + 3n_p)$ 阶总法方程求逆内存与耗时难以承受；
   - **约化机理與结构特征**：总法方程 $\begin{bmatrix}N_{tt} & N_{tX} \\ N_{Xt} & N_{XX}\end{bmatrix}\begin{bmatrix}t \\ X\end{bmatrix} = \begin{bmatrix}U_t \\ U_X\end{bmatrix}$ 中，由于不同地面点之间无直接观测联系，地面点子块 **$N_{XX}$ 是由无数独立 $3 \times 3$ 小矩阵组成的严格分块对角阵**，逐点求逆成本几乎为零！利用高斯消元（舒尔补）消去 $X$ 后得到阶数骤降为 $6m \times 6m$、仅含外方位元素改正数 $t$ 的**改化法方程** $(N_{tt} - N_{tX}N_{XX}^{-1}N_{Xt})t = U_t - N_{tX}N_{XX}^{-1}U_X$。在规则航带网中按跨航带短边优先给像片编号时，改化法方程系数阵呈极佳的**对称正定带状稀疏结构**（引入自检校或 POS 漂移参数则为**带状边块矩阵**），可高效采用带状乔列斯基分解或共轭梯度法极速求解。

## 第六专题：上机实验与实操核心原理问答（保留旧版 04 实操精华）

### 【问答 19】简述【实验一：单像空间后方交会】的算法迭代步骤、控制点布设要求，并解释为什么常规竖直航摄下高程线元素 $Z_S$ 的解算精度显著高于水平线元素 $X_S, Y_S$？（必考五星 · 实验一核心原理）

**【7分标准分点作答】**：
1. **单像空间后方交会六步标准解算流程（3分）**：
   - ① 读入内方位元素 $(x_0, y_0, f)$、标称比例尺分母 $m$ 及 $n \ge 4$ 个地面控制点的 $(X_i, Y_i, Z_i)$ 与像平面坐标 $(x_i, y_i)$（若地面给大地高斯北东左旋坐标，须先互换 $X, Y$ 化为右旋系）；
   - ② 设定初值：$\varphi^0 = \omega^0 = \kappa^0 = 0$，$X_S^0 = \bar{X},\ Y_S^0 = \bar{Y},\ Z_S^0 = \bar{Z} + m f$（注意将 $f$ 换算为米！）；
   - ③ 由当前角元素构建 $3 \times 3$ 旋转矩阵 $R$，逐点代入共线方程正算近似像坐标 $(x_i), (y_i)$ 及常数项 **$l_{x_i} = x_i - (x_i),\ l_{y_i} = y_i - (y_i)$**（严格“观测值减近似值”）；
   - ④ 逐点计算 $2 \times 6$ 严密偏导数系数行 $A_i$（注意 $a_{16} = y - y_0,\ a_{26} = -(x - x_0)$），组成误差方程 $V = A\Delta X - L$；
   - ⑤ 组建法方程求逆解算 $\Delta X = (A^{\mathrm{T}}A)^{-1}A^{\mathrm{T}}L$ 并累加更新 6 个外方位元素；
   - ⑥ 检验角元素改正数 $\lvert \Delta\varphi \rvert, \lvert \Delta\omega \rvert, \lvert \Delta\kappa \rvert < 10^{-6}\ \mathrm{rad}$（约 $0.2''$），收敛后计算单位权中误差 $\sigma_0 = \sqrt{\dfrac{V^{\mathrm{T}}V}{2n-6}}$ 与各未知数中误差 $m_k = \sigma_0\sqrt{Q_{kk}}$。
2. **控制点数量与空间几何危险面要求（1.5分）**：
   理论上最少需 **3 个不共线**的平高控制点（生产至少布设在**像片四角共 4 个以上**以扩大交会张角并提供多余观测 $r = 2n - 6 \ge 2$）；控制点绝对不能共线，且不能与摄影中心 $S$ 共处于同一**空间危险圆柱面**上，否则法方程秩亏奇异。
3. **为什么 $m_{Z_S}$ 精度明显高于 $m_{X_S}, m_{Y_S}$？（2.5分）**：
   在常规窄视场竖直航摄下，观察微倾偏导数：$a_{11} = -f/H$ 与 $a_{14} = -(f + x^2/f) \approx -f$ 近似成常数比例，意味着**摄站水平平移 $\Delta X_S$ 与航向倾角旋转 $\Delta\varphi$ 引起的像点移动方向高度一致（同理 $\Delta Y_S$ 与 $\Delta\omega$ 强相关）**，导致法方程中 $(X_S, \varphi)$、$(Y_S, \omega)$ 存在强烈参数代数耦合，显著放大了水平线元素的协因数 $\sqrt{Q_{11}}, \sqrt{Q_{22}}$；而航高变动 $\Delta Z_S$ 引起四角控制点沿向径呈中心对称放射状伸缩，与其他 5 个参数几乎完全正交解耦，故 $Z_S$ 的解算精度最高（如实验一标准算例中 $m_{Z_S} = 0.49\ \mathrm{m}$，明显优于 $m_{X_S} = 1.11\ \mathrm{m}$ 和 $m_{Y_S} = 1.25\ \mathrm{m}$）。

### 【问答 20】简述【实验二：相关系数法影像匹配】的实现步骤、窗口尺寸与搜索区设定原则，并总结数字摄影测量生产 DEM 与 DOM 的核心质量检查指标。（四星重点 · 实验二与生产实操）

**【7分标准分点作答】**：
1. **相关系数法（NCC）上机匹配五步流程与编程防错要点（3分）**：
   - **步骤**：① 用通用图像库解码读入左、右灰度像对；② 在左片重叠区内选取纹理显著的特征角点 $(x_L, y_L)$ 开取 $(2k+1) \times (2k+1)$ 目标窗口，预计算左窗口累加统计量；③ 根据先验视差在右片划定搜索区（**若原始像对未经核线重采样存在纵视差 $q \neq 0$，必须开二维矩形搜索框而非仅同行搜索**）；④ 滑动候选窗口按单遍实用公式计算相关系数矩阵 $\rho(x_R, y_R)$；⑤ 检验峰值 $\rho_{\max} > T$（如 $0.75$）后，取整数峰值左右 3 点做**抛物线拟合**输出子像素同名点坐标。
   - **编程防错要点**：单遍公式中 $(\sum g)^2$ 在较大窗口下易超出 32 位 `int` 上限溢出变负，累加器必须采用 `double` 或 64 位整型；遇纯白或阴影均匀区方差趋于 $0$ 时必须做除零保护跳过。
2. **模板窗口尺寸的权衡原则（1.5分）**：
   窗口过小（如 $3 \times 3$）信噪比低、易生多峰误匹配；窗口过大（如 $> 31 \times 31$）不仅耗时剧增，且违背窗口内视差恒定假设、产生地形平滑变形。航空影像工程最优模板窗口一般取 **$9 \times 9 \sim 15 \times 15$ 像素**。
3. **数字摄影测量全流程成果核心质检指标（2.5分）**：
   - ① **空三阶段**：像点验后单位权中误差 $\sigma_0$（通常要求 $< 0.3 \sim 0.5\ \mathrm{px}$）、控制点残差，以及**不参与平差的独立外业检查点（Check Points）平面与高程中误差**（严禁仅用控制点内符合残差代替外符合精度！）；
   - ② **相对定向与核线阶段**：同名点残余上下视差中误差 $m_q < 0.5\ \mathrm{px}$（最大 $< 1\ \mathrm{px}$）；
   - ③ **DEM 与 DOM 质检**：利用预留独立高程检查点评定 $\sigma_{\mathrm{DEM}} = \sqrt{\frac{1}{n}\sum (Z_{\mathrm{DEM},k} - Z_k)^2}$ 及图幅接边较差；DOM 检查地物平面位置中误差、整体色调匀光一致性、镶嵌接缝线两侧道路地物错位量（$< 1\ \mathrm{px}$）及高大建筑有无重影拉花。</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
</body>
</html>
