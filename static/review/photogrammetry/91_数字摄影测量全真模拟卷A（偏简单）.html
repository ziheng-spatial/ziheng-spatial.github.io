<script type="text/plain" id="md-raw"># 91 数字摄影测量全真模拟卷 A（偏简单）

**适用课程与考纲**：山东理工大学（SDUT）《数字摄影测量学》期末全真模拟（偏基础难度 · 覆盖第 3～9 章核心内容）

**背诵自测说明**：点击页面顶部「**背诵自测模式**」开关，所有答案区将自动模糊遮盖，作答后点击单题即可揭晓核对。

| 题号 | 题型 | 题量与分值 | 考查侧重 |
| :---: | :--- | :---: | :--- |
| **一** | 单项选择题 | 10 题 × 2 分 = 20 分 | 基础概念、坐标原点、窗口矛盾与自由度常数 |
| **二** | 名词解释 | 5 题 × 4 分 = 20 分 | 投影基础、内方位、共线方程、核线与 DEM/DSM |
| **三** | 简答题 | 5 题 × 7 分 = 35 分 | 重采样、金字塔谱分析、VLL、Grid/TIN、反/正解 DOM |
| **四** | 综合计算题 | 13 分 + 12 分 = 25 分 | **共线方程单像后方交会** + **共面方程相对定向上下视差** |

## 一、单项选择题（共 10 小题，每小题 2 分，共 20 分）

### 1. 由 CCD/CMOS 数字传感器直接曝光获取的影像与由传统光学模拟胶片经扫描仪数字化处理得到的影像，在术语上分别称为（　）

A. 模拟影像、数字影像<br>
B. 数字影像、数字化影像<br>
C. 数字化影像、数字影像<br>
D. 航摄像片、正射影像

> **【参考答案与分步采分点】**：**B**（2 分）。由 CCD/CMOS 传感器直接曝光获取的称**数字影像**；由传统光学模拟胶片经扫描仪离散化处理的称**数字化影像**。

### 2. 在摄影测量解析计算采用的像空间坐标系 $S$-xyz 中，任意像点在 $z$ 轴上的坐标恒等于（　）

A. $+f$<br>
B. $0$<br>
C. $-f$<br>
D. $+H$

> **【参考答案与分步采分点】**：**C**（2 分）。像空间坐标系 $S$-xyz 为右旋系，$z$ 轴沿主光轴背离像平面向上（指向摄影中心上方），故像平面上任意像点坐标为 $(x - x_0,\ y - y_0,\ -f)$。

### 3. 在倾斜航空像片上，地面高差引起的地形起伏投影差 $\delta_h$ 与像片倾角引起的像点位移 $\delta_\alpha$ 的辐射中心分别是（　）

A. 像主点 $o$、像底点 $n$<br>
B. 像底点 $n$、等角点 $c$<br>
C. 等角点 $c$、像主点 $o$<br>
D. 像底点 $n$、像主点 $o$

> **【参考答案与分步采分点】**：**B**（2 分）。**地形起伏投影差**以**像底点 $n$** 为辐射中心（$n$ 处 $r=0$ 无起伏投影差）；**像片倾斜位移**以**等角点 $c$** 为辐射中心（$c$ 处保持方向角不变）。

### 4. 在数字影像获取的“采样、量化、编码”三步骤中，直接决定影像空间分辨率和辐射分辨率的分别是（　）

A. 量化、采样<br>
B. 编码、采样<br>
C. 采样、量化<br>
D. 采样、编码

> **【参考答案与分步采分点】**：**C**（2 分）。**采样**是对连续空间坐标按像素间隔离散化，决定**空间分辨率**；**量化**是对辐射亮度幅值离散化为有限级整数灰度（如 8 bit），决定**辐射分辨率**。

### 5. 在经典数字摄影测量与计算机视觉中，数字影像像素坐标系的原点通常分别定义在（　）

A. 图像中心、左下角像素中心<br>
B. 左下角像素中心、左上角像素中心<br>
C. 左上角像素中心、左下角像素中心<br>
D. 框标连线交点、图像中心

> **【参考答案与分步采分点】**：**B**（2 分）。经典数字摄影测量以**左下角像素中心**为原点（$y$ 轴向上）；计算机视觉与通用图像文件以**左上角像素中心**为原点（行号向下）。

### 6. 根据维纳-辛钦定理对影像相关窗口进行谱分析，当匹配窗口尺寸较小时，下列说法正确的是（　）

A. 低频信息占优势，相关峰平缓，精度差、拉入范围大<br>
B. 高频信息丰富，相关峰陡峭，定位精度高、拉入范围小、出错率高<br>
C. 高频信息丰富，相关峰平缓，定位精度高、拉入范围大<br>
D. 低频信息占优势，相关峰陡峭，定位精度低、拉入范围小

> **【参考答案与分步采分点】**：**B**（2 分）。窗口较小时高频细节丰富 $\implies$ 相关函数峰值陡峭 $\implies$ **定位精度高，但拉入范围小且误匹配出错率高**。

### 7. 在数字影像灰度相关（NCC）中，整像素级相关的理论定位中误差约为（　），经三点抛物线峰值拟合后子像素精度可达（　）

A. $1.0$ 像素、$0.5$ 像素<br>
B. $0.5$ 像素、$0.3$ 像素<br>
C. $0.3$ 像素、$0.15\sim 0.2$ 像素<br>
D. $0.1$ 像素、$0.01$ 像素

> **【参考答案与分步采分点】**：**C**（2 分）。整像素均匀量化误差理论中误差 $\Delta / \sqrt{12} \approx 0.3$ 像素；相关系数三点抛物线拟合可达 $0.15\sim 0.2$ 子像素（LSM 可达 $0.01\sim 0.1$ 像素）。

### 8. 对立体像对执行连续法或单独法相对定向时，理论上至少需要（　）对同名像点，且（　）地面控制点。

A. $3$、需要<br>
B. $4$、需要<br>
C. $5$、不需要<br>
D. $6$、不需要

> **【参考答案与分步采分点】**：**C**（2 分）。相对定向求解 $5$ 个相对定向元素，**不依赖任何地面控制点**，最少只需 $5$ 对同名像点（工程常布设冯·格鲁伯标准 $6$ 点，$r = 1$）。

### 9. 由密集影像匹配点云直接生成、包含建筑物屋顶和树冠高度的模型称为（　），经地形滤波剔除非地面点后可获得裸露地表模型（　）

A. DEM、DSM<br>
B. DSM、DEM（或 DTM）<br>
C. DOM、DEM<br>
D. TIN、DSM

> **【参考答案与分步采分点】**：**B**（2 分）。包含房屋、桥梁、树冠表层包络的模型是**数字表面模型（DSM）**，经地形滤波去除非地面点后转化为裸露地表 **DEM/DTM**。

### 10. 按几何变换的基本微分单元划分，严格理论意义上的数字微分纠正属于（　）

A. 面元素纠正<br>
B. 线元素纠正<br>
C. 区域整体纠正<br>
D. 点元素纠正

> **【参考答案与分步采分点】**：**D**（2 分）。严格理论意义上的数字微分纠正以单个独立数字像素（点）为单元解算投影映射，属于**点元素纠正**（基于格网或 TIN 仿射的快速算法属面元素纠正）。

## 二、名词解释（共 5 小题，每小题 4 分，共 20 分）

### 11. 中心投影与正射投影（4 分）

> **【参考答案与分步采分点】**：
> 1. **中心投影定义**（1 分）：投射线全部汇聚于空间唯一固定点（摄影中心 $S$）的投影，是框幅式航摄像片的构像基础；
> 2. **中心投影特征**（1 分）：比例尺随地面高程起伏与像片倾角变化，存在像片倾斜位移和地形起伏投影差；
> 3. **正射投影定义**（1 分）：投射线互相平行且严格垂直于水平投影基准面的投影，是地形图与 DOM 的几何基础；
> 4. **正射投影特征**（1 分）：图面比例尺处处恒定，不存在倾斜变形与地形起伏投影差。

### 12. 影像内方位元素与内定向（4 分）

> **【参考答案与分步采分点】**：
> 1. **内方位元素定义**（1 分）：确定摄影物镜后节点（投影中心 $S$）相对于像平面几何位置的参数；
> 2. **参数组成**（1 分）：共含 **3 个参数**——像主点在框标系中的坐标 $(x_0, y_0)$ 及摄影机主距（焦距）$f$；
> 3. **几何作用**（1 分）：用于恢复摄影瞬间的内部摄影光束形状，通常由实验室相机检校测定；
> 4. **数字影像内定向**（1 分）：利用框标理论坐标与扫描像素行列坐标解算二维仿射变换（6 参数），并扣除主点偏移转化为像平面坐标的过程。

### 13. 共线条件方程（4 分）

> **【参考答案与分步采分点】**：
> 1. **核心几何条件**（1 分）：表达理想中心投影构像瞬间，摄影中心 $S$、像点 $a$ 及其对应物方地面点 $A$ 三点严格位于同一条空间直线上；
> 2. **数学表达式**（2 分）：
>
> $$x - x_0 = -f \frac{a_1(X-X_S)+b_1(Y-Y_S)+c_1(Z-Z_S)}{a_3(X-X_S)+b_3(Y-Y_S)+c_3(Z-Z_S)}, \quad y - y_0 = -f \frac{a_2(X-X_S)+b_2(Y-Y_S)+c_2(Z-Z_S)}{a_3(X-X_S)+b_3(Y-Y_S)+c_3(Z-Z_S)}$$
>
> 3. **工程地位**（1 分）：联系像方坐标、内外方位元素与物方三维坐标共 12 个量，是空间后方交会、前方交会、光束法区域网平差与数字微分纠正的通用基础方程。

### 14. 核线与核线影像（4 分）

> **【参考答案与分步采分点】**：
> 1. **核面与同名核线**（1 分）：包含摄影基线 $S_1 S_2$ 与地面点 $P$ 的平面称为核面，核面与左、右像平面的交线互称为同名核线（同名像点必在同名核线上）；
> 2. **核线影像生成**（1 分）：利用定向参数将原始倾斜左、右影像重新投影至与摄影基线平行的公共虚拟平面上并按核线方向重采样生成的新影像；
> 3. **消除上下视差**（1 分）：核线影像上同名点行号严格相等（上下视差 $q = 0$），供人工舒适立体观测；
> 4. **匹配降维作用**（1 分）：将二维全图同名点匹配搜索严格降维为一维同行搜索。

### 15. 数字高程模型（DEM）与数字表面模型（DSM）（4 分）

> **【参考答案与分步采分点】**：
> 1. **数字高程模型（DEM）**（1.5 分）：数字地面模型（DTM）最核心的子集，专指用三维有限序列 $\{(X_i, Y_i, Z_i)\}$ 对剔除了建筑、植被等附着物后的**裸露地表地形高程**的数字表达；
> 2. **数字表面模型（DSM）**（1.5 分）：包含地表建筑物屋顶、桥梁和森林树冠等一切地表物体顶面高度在内的最表层包络高程模型；
> 3. **相互转换关系**（1 分）：密集影像匹配或机载 LiDAR 首回波直接获得 DSM，经**地形滤波**剔除非地面点后可转化为裸露地表 DEM。

## 三、简答题（共 5 小题，每小题 7 分，共 35 分）

### 16. 什么是数字影像重采样？写出双线性插值的原理与公式，并对比三种常用灰度重采样方法的优缺点与适用场景。（7 分）

> **【参考答案与分步采分点】**：
> 1. **重采样定义与背景**（1.5 分）：在核线重排列、数字微分纠正与 LSM 匹配中，几何变换反算回原始影像的坐标 $(x, y)$ 常为非整数浮点坐标；利用周围已知整数采样像元灰度内插计算该非采样点灰度的过程称为数字影像重采样。
> 2. **双线性插值原理与公式**（2.5 分）：取待插点 $(x, y)$ 周围最近的 $2 \times 2 = 4$ 个整数像素，按“离得越近权越大”分别沿行、列做一阶线性内插。设 $(i,j)=(\lfloor x\rfloor,\lfloor y\rfloor)$、小数偏移 $\Delta x=x-i,\ \Delta y=y-j$，则：
>
> $$g(x, y) = (1 - \Delta x)(1 - \Delta y)g(0,0) + \Delta x(1 - \Delta y)g(1,0) + (1 - \Delta x)\Delta y\,g(0,1) + \Delta x\Delta y\,g(1,1)$$
>
> 3. **三种方法优缺点与适用场景对比**（3 分）：
>    - **最邻近像元法**（$1\times 1$ 四舍五入）：计算最快、**完全不破坏原始像元灰度数值**，但几何精度最差（最大 $\pm 0.5\ \mathrm{px}$ 偏移）且斜边缘呈锯齿状；适于**遥感分类专题图重采样**。
>    - **双线性内插法**（$2\times 2$ 加权）：平滑无锯齿、计算量适中、几何精度较好，但有轻度低通平滑使边缘略柔化；适于**核线重排列、DOM 微分纠正等一般工程首选**。
>    - **双三次卷积法**（$4\times 4$ 三次样条）：一阶导数连续、**几何精度与边缘锐度最高**，但计算最耗时；适于**高精度出版级正射制图**。

### 17. 结合维纳-辛钦定理（谱分析）说明影像相关窗口大小的选择矛盾，并简述影像金字塔的构建方法与“从粗到精”策略的优势。（7 分）

> **【参考答案与分步采分点】**：
> 1. **维纳-辛钦定理揭示的窗口大小矛盾**（3 分）：随机影像信号的相关函数 $R(\tau)$ 与其功率谱 $S(f)$ 互为傅里叶变换对（功率谱近似指数衰减）：
>    - **窗口较小时**：高频细节丰富 $\implies$ 相关峰陡峭，**定位精度高**（且透视变形小），但总信息量少、信噪比低，导致**拉入范围小、出错率高**；
>    - **窗口较大时**：低频概貌占优 $\implies$ 相关峰平缓宽阔，**拉入范围大、抗噪强、出错率低**，但高频细节被淹没且受高差变形影响大，导致**定位精度差、计算量大**。
> 2. **影像金字塔构建方法**（2 分）：以原始全分辨率影像作第 $0$ 层，逐层先做**低通平滑滤波再增大采样间隔**（如 $2\times 2$ 四像元求均值合成为上层 1 像素），叠置成像素数逐层按 $1/4$ 递减的多分辨率塔式影像序列。
> 3. **“从粗到精”分层相关的三大优势**（2 分）：① 顶层实现“小影像、大物理窗口”获大拉入范围与高可靠性，逐层传递视差初值到底层“大影像、精细小窗口”获高子像素精度，**化解精度与拉入范围矛盾**；② 底层仅在初值邻域 $\pm 2\sim 3$ 像素内精搜，**速度提升数十至数百倍**；③ 粗层宏观约束**抑制重复纹理伪峰值误匹配**。

### 18. 什么是地面元影像匹配？详述铅垂线轨迹法（VLL）影像匹配的基本原理与五步解算步骤。（7 分）

> **【参考答案与分步采分点】**：
> 1. **基本原理**（2 分）：不经像方匹配再前方交会，直接在物方三维空间建立待求点坐标与多幅影像窗口相似性关系、一步求定三维坐标的方法称为**地面元影像匹配（物方匹配）**。**铅垂线轨迹法（VLL）** 利用“平面位置 $(X,Y)$ 已知的点必在铅垂线上，该铅垂线段投影至左右像片为两条直线轨迹”的约束，沿铅垂线步进高程 $Z$ 寻找左右反投窗口相关极值。
> 2. **VLL 五步解算流程**（4 分）：
>    - ① **设定高程搜索序列**：给定地面平面坐标 $(X,Y)$、近似最低高程 $Z_{\min}$、最高高程 $Z_{\max}$ 与步距 $\Delta Z$，构造 $Z_i = Z_{\min} + i\cdot\Delta Z$；
>    - ② **共线方程正算像坐标**：将 $(X,Y,Z_i)$ 与左右片内外方位元素代入共线方程，正算左、右原始像坐标 $(x_i',y_i')$ 与 $(x_i'',y_i'')$；
>    - ③ **开窗算相关系数**：以左右投影点为中心在原片重采样取窗，计算归一化相关系数 $\rho_i$；
>    - ④ **搜索离散峰值**：遍历 $i=0\dots n$ 得到相关序列，找出最大相关系数 $\rho_k$；
>    - ⑤ **抛物线拟合求高程**：用 $\rho_{k-1}, \rho_k, \rho_{k+1}$ 拟合二次抛物线，求峰值对应精确高程 $Z^* = Z_k + \frac{\rho_{k-1}-\rho_{k+1}}{2(\rho_{k-1}-2\rho_k+\rho_{k+1})}\Delta Z$。
> 3. **主要优势**（1 分）：**无需生成核线影像，也无需再做前方交会**，天然契合规则格网 DEM 自动生成，且易扩展至多视联合匹配。

### 19. 详细对比规则矩形格网 DEM（Grid）与不规则三角网（TIN）的数据结构特征与优缺点，并区分 DEM 建模与应用中的“两个内插过程”。（7 分）

> **【参考答案与分步采分点】**：
> 1. **Grid 与 TIN 数据结构及优缺点对比**（4.5 分）：
>    - **规则矩形格网（Grid）**：按等间距 $(\Delta X,\Delta Y)$ 排列，文件头记起点与步距，内部用**二维数组只存高程 $Z$**（平面坐标由 $X_i=X_0+i\Delta X$ 隐式推算），**存储量最小、算法极简高效**（如滤波与 DOM 查高程）；缺点是平缓区冗余大，**山脊、沟谷、陡坎易丢失微地貌细节**。
>    - **不规则三角网（TIN）**：直接使用原始离散点与特征线连接为互不重叠三角形，**能嵌入山脊、山谷、断裂线精确保真复杂地形**，不丢原始点精度；缺点是须显式存三维坐标与拓扑邻接表，**数据量大、拓扑与接边算法复杂**。
> 2. **严格区分“两个 DEM 内插过程”**（2.5 分）：
>    - **第一类内插（DEM 建模生产：离散点 $\to$ 规则格网节点）**：由离散采样点通过移动曲面法、多面函数法、有限元法或先构 TIN 平面插值计算规则格网节点高程；
>    - **第二类内插（DEM 工程应用：已知 DEM $\to$ 任意非节点高程）**：规则格网常用**双线性（连续不光滑，最快最常用）** 或双三次多项式；TIN 先用面积法或叉积法定位所属三角形，再按三点共面方程线性内插高程。

### 20. 详述框幅式航空影像“反解法（间接法）”与“正解法（直接法）”数字微分纠正的原理、处理流程及各自优缺点对比。（7 分）

> **【参考答案与分步采分点】**：
> 1. **反解法（间接法：地面 $\to$ 影像）原理与流程**（2.5 分）：从空白输出 DOM 规则格网出发：① 确定起点 $(X_0,Y_0)$ 与分辨率 $M$；② 对格网像素 $(I,J)$ 算平面坐标 $(X,Y)$ 并由 DEM 内插高程 $Z$；③ 代入**共线条件正算式**求原片浮点坐标 $(x,y)$；④ 在原片 $2\times 2$ 邻域做双线性重采样；⑤ 灰度直接赋给正射像素 $G(I,J)$。
> 2. **正解法（直接法：影像 $\to$ 地面）原理与流程**（1.5 分）：从原片每个整数像元 $(x,y)$ 出发，因共线反算式右端依赖未知高程 $Z$，须与 DEM **迭代求交**得出地面坐标 $(X,Y,Z)$，再按面积权重向周围正射格网分配灰度，并对未落入像素的空白区二次拟合。
> 3. **两法优缺点全面对比**（3 分）：
>    - **反解法**：框幅式**完全无需迭代**，计算简单稳定，输出像素 **100% 填满无空白漏洞**，是生产主流；缺点是裸地 DEM 下**无法直接判定遮挡**，易产生高楼屋顶重影。
>    - **正解法**：顺真实光线投射，**可根据深度信息自然判别遮挡关系**、无重影歧义；缺点是**必须高程迭代**，且落点疏密不均导致输出图像**易出现空白漏洞、灰度分配复杂**。

### 21. 【必考 · 共线条件方程与单像空间后方交会】（13 分）

已知某竖直航空像片的内方位元素为 $f = 150.00\ \mathrm{mm},\ x_0 = y_0 = 0$，标称摄影比例尺为 $1:8000$。在像片四角共布设 $n = 4$ 个平高地面控制点，其地面摄影测量坐标平均值为 $(\bar{X},\ \bar{Y},\ \bar{Z}) = (3000.00,\ 4000.00,\ 100.00)\ \mathrm{m}$。其中 1 号控制点地面坐标为 $(X_1,\ Y_1,\ Z_1) = (2520.00,\ 3640.00,\ 100.00)\ \mathrm{m}$，量测像平面坐标为 $(x_1,\ y_1) = (-60.80,\ -44.60)\ \mathrm{mm}$。

（1）指出该单像空间后方交会的观测方程总数 $N$、未知数个数 $u$ 与多余观测数 $r$，并确定 6 个外方位元素的迭代初值；（4 分）<br>
（2）计算第 1 轮迭代时 1 号控制点的近似像平面坐标 $(x_1)^0,\ (y_1)^0$、常数项 $l_{x_1}^0,\ l_{y_1}^0$ 以及微倾近似下的 $2 \times 6$ 偏导数系数矩阵 $A_1^{(1)}$；（6 分）<br>
（3）写出合并全网控制点后的最小二乘迭代改正公式以及收敛后验后单位权中误差 $\sigma_0$ 的评定公式。（3 分）

> **【参考答案与分步采分点】**：
>
> **（1）自由度清点与外方位元素初值确定（4 分）**：
> - $n = 4$ 个平高点，每点列 2 个共线方程，故观测方程总数 $N = 2 \times 4 = \mathbf{8}$ 个，未知外方位元素 $u = \mathbf{6}$ 个，多余观测数 $r = 8 - 6 = \mathbf{2}$。（2 分）
> - 角元素初值取 $\varphi^0 = \omega^0 = \kappa^0 = \mathbf{0\ \mathrm{rad}}$（此时初始旋转矩阵 $R^0 = I_3$）。（1 分）
> - 线元素初值（注意 $f = 150.00\ \mathrm{mm} = 0.150\ \mathrm{m}$）：$X_S^0 = 3000.00\ \mathrm{m},\ Y_S^0 = 4000.00\ \mathrm{m},\ Z_S^0 = 100.00 + 8000 \times 0.150 = \mathbf{1300.00\ \mathrm{m}}$。（1 分）
>
> **（2）计算 1 号点近似像坐标、常数项与偏导数系数矩阵 $A_1^{(1)}$（6 分）**：
> - 在 $R^0 = I_3$ 下计算像空间辅助坐标：$\bar{X}_1^0 = 2520.00 - 3000.00 = -480.00\ \mathrm{m}$，$\bar{Y}_1^0 = 3640.00 - 4000.00 = -360.00\ \mathrm{m}$，$\bar{Z}_1^0 = 100.00 - 1300.00 = -1200.00\ \mathrm{m}$（相对航高 $H_1 = -\bar{Z}_1^0 = 1200.00\ \mathrm{m}$）。（1 分）
> - 代入共线方程求首轮近似像坐标：
>
> $$\tilde{x}_1 = (x_1)^0 = -150.00 \times \frac{-480.00}{-1200.00} = \mathbf{-60.00\ \mathrm{mm}}, \qquad \tilde{y}_1 = (y_1)^0 = -150.00 \times \frac{-360.00}{-1200.00} = \mathbf{-45.00\ \mathrm{mm}}$$
>
> - 计算常数项（观测值减近似值，1 分）：
>
> $$l_{x_1}^0 = x_1 - (x_1)^0 = -60.80 - (-60.00) = \mathbf{-0.80\ \mathrm{mm}}, \qquad l_{y_1}^0 = y_1 - (y_1)^0 = -44.60 - (-45.00) = \mathbf{+0.40\ \mathrm{mm}}$$
>
> - 代入微倾首轮近似偏导数公式（共 3 分）：
>   - $a_{11} = -\dfrac{150.00}{1200.00} = -0.1250,\quad a_{12} = 0,\quad a_{13} = -\dfrac{-60.00}{1200.00} = +0.0500$；
>   - $a_{14} = -\left(150.00 + \dfrac{(-60.00)^2}{150.00}\right) = -(150.00 + 24.00) = -174.00,\quad a_{15} = -\dfrac{(-60.00)(-45.00)}{150.00} = -18.00,\quad a_{16} = -45.00$；
>   - $a_{21} = 0,\quad a_{22} = -0.1250,\quad a_{23} = -\dfrac{-45.00}{1200.00} = +0.0375$；
>   - $a_{24} = -18.00,\quad a_{25} = -\left(150.00 + \dfrac{(-45.00)^2}{150.00}\right) = -(150.00 + 13.50) = -163.50,\quad a_{26} = -(-60.00) = +60.00$。
> - 组成 1 号点 $2\times 6$ 系数矩阵：
>
> $$A_1^{(1)} = \begin{bmatrix} -0.1250 & 0 & +0.0500 & -174.00 & -18.00 & -45.00 \\ 0 & -0.1250 & +0.0375 & -18.00 & -163.50 & +60.00 \end{bmatrix}$$
>
> **（3）最小二乘迭代与精度评定公式（3 分）**：
> - 合并 4 个点组成 $8\times 6$ 矩阵 $A$ 与 $8\times 1$ 向量 $L$，按 $\Delta X = (A^{\mathrm{T}}A)^{-1}A^{\mathrm{T}}L$ 解算改正数并更新 $X^{(k+1)} = X^{(k)} + \Delta X^{(k)}$，直至角改正数小于限差（如 $10^{-5}\ \mathrm{rad}$）。（1.5 分）
> - 收敛后计算像点残差 $V = A\Delta X - L$，单位权中误差 $\sigma_0 = \sqrt{\dfrac{V^{\mathrm{T}}V}{2n - 6}} = \sqrt{\dfrac{V^{\mathrm{T}}V}{2}}$，各参数中误差 $m_k = \sigma_0\sqrt{Q_{kk}}$。（1.5 分）

### 22. 【必考 · 共面条件方程与连续像对相对定向计算】（12 分）

某竖直航空数字摄影测量立体像对，相机焦距 $f = 100.00\ \mathrm{mm},\ x_0 = y_0 = 0$，像元尺寸 $d = 10\ \mu\mathrm{m} = 0.010\ \mathrm{mm}$。

（1）在像空间辅助坐标系中，已知基线向量 $\mathbf{B} = [400.00,\ 6.00,\ 10.00]^{\mathrm{T}}\ \mathrm{m}$，某同名像点的左、右光线辅助方向向量分别为 $\mathbf{S}_1\mathbf{a}_1 = [20.00,\ 40.00,\ -100.00]^{\mathrm{T}}\ \mathrm{mm}$、$\mathbf{S}_2\mathbf{a}_2 = [-20.00,\ 39.00,\ -100.00]^{\mathrm{T}}\ \mathrm{mm}$。试由共面条件三阶行列式 $F$ 判别两光线是否严格共面，并求该点处的模型上下视差 $Q$（同时用点投影系数 $N_1, N_2$ 交叉验算）；（5 分）<br>
（2）在水平初值（所有相对定向元素初值为 $0$）下布设标准像片基线 $b = 50.00\ \mathrm{mm}$，量测某同名像点左片坐标 $(x_1, y_1) = (+30.00,\ +40.40)\ \mathrm{mm}$、右片坐标 $(x_2, y_2) = (-20.00,\ +40.00)\ \mathrm{mm}$，求初始竖直视差 $q^0$，并列立**连续像对法**相对定向首轮线性化误差方程 $v_q$；（4 分）<br>
（3）采用冯·格鲁伯标准 6 点完成相对定向收敛后，测得 6 个点的残余上下视差依次为 $v_{q_1}=+0.004,\ v_{q_2}=-0.003,\ v_{q_3}=+0.003,\ v_{q_4}=-0.001,\ v_{q_5}=-0.001,\ v_{q_6}=0.000\ \mathrm{mm}$。求多余观测数 $r$ 与上下视差中误差 $\sigma_q$（同时换算为像素），并依据“$\sigma_q \le 1.0\ \text{像素}$ 且 $\lvert v_{q_i} \rvert_{\max} \le 2\sigma_q$”评定是否合格。（3 分）

> **【参考答案与分步采分点】**：
>
> **（1）共面条件三阶行列式判别与模型上下视差计算（5 分）**：
> - 列出三阶行列式并按第一行展开计算三个二阶余子式（2 分）：
>
> $$F = \begin{vmatrix} 400.00 & 6.00 & 10.00 \\ 20.00 & 40.00 & -100.00 \\ -20.00 & 39.00 & -100.00 \end{vmatrix}$$
>
>   - $Y_1 Z_2 - Z_1 Y_2 = 40.00\times(-100.00) - (-100.00)\times 39.00 = -4000.00 + 3900.00 = -100.00\ \mathrm{mm}^2$；
>   - $Z_1 X_2 - X_1 Z_2 = (-100.00)\times(-20.00) - 20.00\times(-100.00) = 2000.00 + 2000.00 = +4000.00\ \mathrm{mm}^2$；
>   - $X_1 Y_2 - Y_1 X_2 = 20.00\times 39.00 - 40.00\times(-20.00) = 780.00 + 800.00 = +1580.00\ \mathrm{mm}^2$。
> - 求共面行列式并判别（1 分）：$F = 400.00\times(-100.00) + 6.00\times 4000.00 + 10.00\times 1580.00 = -40000.00 + 24000.00 + 15800.00 = \mathbf{-200.00\ \mathrm{m\cdot mm}^2} \neq 0$，故**两光线不严格共面**。
> - 求模型上下视差 $Q$（1 分）：分母 $X_1 Z_2 - Z_1 X_2 = 20.00\times(-100.00) - (-100.00)\times(-20.00) = -4000.00\ \mathrm{mm}^2$，故
>
> $$Q = \frac{F}{X_1 Z_2 - Z_1 X_2} = \frac{-200.00}{-4000.00} = \mathbf{+0.050\ \mathrm{m}}$$
>
> - 点投影系数交叉验算（1 分）：$N_1 = \dfrac{400\times(-100)-10\times(-20)}{-4000} = \dfrac{-39800}{-4000} = 9.950\ \mathrm{m/mm}$，$N_2 = \dfrac{400\times(-100)-10\times 20}{-4000} = \dfrac{-40200}{-4000} = 10.050\ \mathrm{m/mm}$，验算 $Q = N_1 Y_1 - N_2 Y_2 - B_Y = 9.950\times 40.00 - 10.050\times 39.00 - 6.00 = 398.00 - 391.95 - 6.00 = \mathbf{+0.050\ \mathrm{m}}$，完全一致。
>
> **（2）初始竖直视差与连续像对法首轮误差方程（4 分）**：
> - 初始竖直视差：$q^0 = y_1 - y_2 = 40.40 - 40.00 = \mathbf{+0.40\ \mathrm{mm}}$（1 分）。
> - 连续法误差方程公式：$v_q = b\Delta\mu + \dfrac{y_2}{f}b\Delta\nu + \dfrac{x_2 y_2}{f}\Delta\varphi + \left(f + \dfrac{y_2^2}{f}\right)\Delta\omega + x_2\Delta\kappa - q^0$（1 分）。
> - 代入 $b = 50.00,\ f = 100.00,\ x_2 = -20.00,\ y_2 = 40.00\ \mathrm{mm}$：$\dfrac{y_2}{f}b = \dfrac{40}{100}\times 50 = +20.00$，$\dfrac{x_2 y_2}{f} = \dfrac{-20\times 40}{100} = -8.00$，$f + \dfrac{y_2^2}{f} = 100 + \dfrac{1600}{100} = +116.00$，$x_2 = -20.00$，得（2 分）：
>
> $$v_q = 50.00\Delta\mu + 20.00\Delta\nu - 8.00\Delta\varphi + 116.00\Delta\omega - 20.00\Delta\kappa - 0.40$$
>
> **（3）多余观测数、上下视差中误差与合格评定（3 分）**：
> - 多余观测数 $r = n - 5 = 6 - 5 = \mathbf{1}$（1 分）。
> - 残差平方和 $\sum_{i=1}^6 v_{q_i}^2 = (16 + 9 + 9 + 1 + 1 + 0)\times 10^{-6} = 36\times 10^{-6}\ \mathrm{mm}^2$，上下视差中误差（1 分）：
>
> $$\sigma_q = \sqrt{\frac{36\times 10^{-6}}{1}} = \mathbf{\pm 0.006\ \mathrm{mm}} = \pm\frac{0.006}{0.010} = \mathbf{\pm 0.6\ \text{像素}} \le 1.0\ \text{像素}$$
>
> - 最大残余上下视差 $\lvert v_{q_i} \rvert_{\max} = 0.004\ \mathrm{mm} < 2\sigma_q = 0.012\ \mathrm{mm}$，无粗差残留，**该相对定向精度合格**（1 分）。</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
