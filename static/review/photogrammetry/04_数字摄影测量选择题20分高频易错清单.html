## 第一部分：考前必背三大“数字与属性”秒杀宽表

### 总表 3：五种像方匹配相似性测度的数学特性与几何意义对比（对应第 6 章 PPT）

| 匹配测度名称 | 极值判据 | $N$ 维/二维空间几何意义 | 抗常数亮度偏移（$+b$） | 抗线性对比度缩放（$\times a$） | 核心特点备注 |
| :--- | :---: | :--- | :---: | :---: | :--- |
| **1. 互相关函数 $R = \sum x_i y_i$** | 取**最大** | 矢量数积最大（二维为**直线/超平面**） | 否 | 否 | 易被局部高亮背景主导产生误匹配 |
| **2. 协方差函数 $C = \frac{1}{N}\sum(x_i-\bar{x})(y_i-\bar{y})$** | 取**最大** | 去直流分量后在平行方向上**矢量投影最大** | **是**（减均值去直流分量） | 否 | 两影像平均亮度相差常量时不受影响 |
| **3. 相关系数 $\rho$（NCC）** | 取**最大** | 去均值矢量**空间夹角 $\theta$ 最小**（$\cos\theta \to 1$） | **是** | **是**（$a > 0$ 严格不变） | 归一化于 $[-1, 1]$，最稳健通用 |
| **4. 差平方和 SSD $S_2 = \sum(x_i - y_i)^2$** | 取**最小** | $N$ 维空间两点欧氏距离最小（二维等值线为**圆**） | 否 | 否 | 是最小二乘匹配的目标函数原型 |
| **5. 差绝对值和 SAD $S = \sum\lvert x_i - y_i \rvert$** | 取**最小** | 曼哈顿距离最小（二维为**对角线平行坐标轴的正方形**） | 否 | 否 | 仅含加减与绝对值，无乘法，计算极快 |

## 第二部分：分章高频易错命题点逐条扫雷（60 条判断铁律）

### 一、第 3 章：数字摄影测量解析基础（14 条）
1. **坐标系旋向陷阱**：国家大地高斯平面坐标系（$X$ 北、$Y$ 东、$Z$ 上）是**左旋坐标系**；摄影测量解析计算采用的像空间系、像空间辅助系、模型系和地面摄影测量系**全部是三维笛卡尔右旋坐标系**。
2. **像空间第三维坐标**：在像空间坐标系 $S$-$xyz$ 中，$z$ 轴沿主光轴背离像平面向上，故任意像点的 $z$ 坐标恒等于常数 **$-f$**（而非 $+f$）。
3. **两大像点位移辐射中心区分**：**地形起伏投影差** $\delta_h$ 以**像底点 $n$** 为辐射中心（像底点处 $r = 0$，永远无地形投影差）；**像片倾斜引起的像点位移** $\delta_\alpha$ 以**等角点 $c$** 为辐射中心（等角点处保持方向角无变形）。
4. **主纵线与等比线**：过摄影中心的主光轴与铅垂线构成的平面称为主垂面，其与像平面的交线为**主纵线**，**像主点 $o$、等角点 $c$、像底点 $n$ 三点必共处于主纵线上**；过等角点 $c$ 垂直于主纵线的**等比线**上摄影比例尺恒等于 $f/H$，不受倾角 $\alpha$ 影响。
5. **铅垂像片直线投影变形规律**：地面上的水平直线在倾斜像片上投影仍为直线；但地面直线若经过**高低起伏不平的地形**，在中心投影航片上的构像会变成**折线或曲线**（唯独通过地面底点 $N$ 的直线在铅垂像片上仍为辐射直线）。
6. **主次旋转轴顺序**：我国经典摄影测量转角系统以 **$Y$ 轴为第一主轴**，旋转顺序严格为 $\varphi$（绕 $Y$ 轴）$\to \omega$（绕新 $X_\varphi$ 轴）$\to \kappa$（绕像片主光轴 $z$ 轴），矩阵连乘不可交换顺序（$R = R_\varphi R_\omega R_\kappa$）。
7. **微倾偏导数的物理变形对应**：外方位元素微小变化中，$dX_S, dY_S$ 引起像点整体**平移**；$dZ_S$ 引起像点向主点径向**均匀缩放**；$d\kappa$ 引起像片绕主点**纯旋转**；$d\varphi, d\omega$ 引起正方形网格变为**透视梯形**。
8. **后方交会线角耦合规律**：常规竖直窄视场航片做单像空间后方交会时，因 $(X_S, \varphi)$ 与 $(Y_S, \omega)$ 强线性相关，解算精度恒有**高程线元素 $Z_S$ 精度高于水平线元素 $X_S, Y_S$**（即 $m_{Z_S} < m_{X_S}, m_{Y_S}$）。
9. **正、反、零立体判别**：正常观察为正立体；将左右像片**位置左右对调**或**各自在平面内旋转 $180^\circ$** 会产生**反立体**（山峰变山谷、房屋向地下凹陷）；将两张像片**同向旋转 $90^\circ$** 使摄影基线垂直于眼基线，左右视差全部变为上下视差，产生**零立体**（无三维深度感）。
10. **高程误差与基高比关系**：由 $m_Z = \dfrac{H}{B}\cdot\dfrac{H}{f} m_p = \dfrac{H^2}{B f} m_p$ 可知，立体测图高程中误差与**航高 $H$ 的平方成正比**，与**基高比 $B/H$ 成反比**（基高比越大，光线交会角越大，高程精度越高）。
11. **两套相对定向元素辨析**：**连续法相对定向**以左像空间系为辅助系（$R_1 = I$），5 个未知数为 $(B_Y, B_Z, \varphi_2, \omega_2, \kappa_2)$ 或 $(\mu, \nu, \varphi_2, \omega_2, \kappa_2)$，最适合航带模型连续拼接；**单独法相对定向**以摄影基线为 $X$ 轴（恒有 $B_Y = B_Z = \omega_1 = 0$），5 个未知数全为角元素 $(\varphi_1, \kappa_1, \varphi_2, \omega_2, \kappa_2)$，定向后基线天然平行于 $X$ 轴，最适合核线重排列与独立模型平差。
12. **相对定向不需要任何地面控制点**，建立的自由立体模型比例尺是任意的（由人为给定的 $B_X$ 决定）。
13. **绝对定向控制点底线**：最少需 **2 个平高控制点 + 1 个高程控制点**（或 2 个平面点 + 3 个高程点），且**提供高程约束的至少 3 个点绝对不能共线**，否则模型绕该控制点连线的横滚旋转角无法确定。
14. **重心化坐标的双重作用**：绝对定向采用重心化坐标后，① 消除大数值地面坐标引起的法方程病态；② 使平移未知数改正数为零，将 $7 \times 7$ 法方程正交解耦为**平移、单变量尺度 $\lambda$、$3 \times 3$ 旋转角**三个独立子块。

### 二、第 4 & 7 章：计算机视觉几何与自动空中三角测量（12 条）
15. **相机内参矩阵 $K$ 结构**：标准上三角矩阵 $K = \begin{bmatrix} f_x & s & c_x \\ 0 & f_y & c_y \\ 0 & 0 & 1 \end{bmatrix}$，一般数字相机像素正交无扭斜（$s = 0$）且正方形像元（$f_x = f_y = f / d$）。
16. **光学镜头畸变分类**：透镜球面曲率制造误差引起沿向径对称伸缩的**径向畸变**（桶形畸变或枕形畸变，系数 $k_1, k_2, k_3$）；多片透镜光轴组装不共线引起**切向（偏心）畸变**（系数 $p_1, p_2$）。越靠近像幅四周边缘，畸变量越大，像主点处畸变为零。
17. **DLT 与传统共线后交的核心差异**：DLT 将构像线性化为 11 参数投影矩阵 $P$，**不需要任何外方位初值、不受相机大倾角限制、无需预先知道内参**，但要求至少 **6 个控制点绝不能共平面**，分解 $P$ 恢复内参 $K$ 与旋转阵 $R$ 采用 **QR 分解**。
18. **基础矩阵 $F$ 与单应矩阵 $H$ 映射差异**：基础矩阵 $F$ 秩为 2（不可逆），只能将左片一个点映射为右片的一条**同名核线**（不能直接将整张图像做透视变换）；单应矩阵 $H$ 满秩为 3（可逆），实现点到点的平面透视映射，但仅在**场景共平面或纯旋转摄影**下严格无视差。
19. **视觉词汇树（Vocabulary Tree）原理**：利用**层次 K-means 聚类**离线生成树状视觉词典，采用 **TF-IDF（词频—逆文档频率）**加权编码影像特征向量，将无序无人机影像重叠像对搜索复杂度从 $O(N^2)$ 降至近线性检索。
20. **RANSAC 挑粗差机制**：随机抽取**最小必要样本子集**解算模型并统计全体匹配点中符合模型的**内点（Inliers）数量**，取内点最多的模型剔除误匹配，可抵御超过 $50\%$ 的高外点率（而传统最小二乘平差一旦含单个大粗差就会将误差分摊污染全网）。
21. **航带法建自由网的比例尺传递**：相邻立体模型之间必须通过**三度重叠区**（航向重叠 $> 53\%$，常规 $60\%\sim 65\%$）内的公共连接点（及公共投影中心）计算比例尺归化系数 $\lambda_k$ 实现统一比例尺拼接。
22. **三种解析空三精度排序**：**光束法最高**（以原始像点坐标为观测值，理论最严密）$>$ **独立模型法次之**（消除航带累积变形，但必须将**投影中心**纳入模型连接点以传递航向倾角！）$>$ **航带法最低**（误差沿航带逐模型累积，靠二次/三次多项式经验拟合消除挠曲变形）。
23. **光束法改化法方程结构**：总法方程中地面点子块 $N_{XX}$ 是 **$3 \times 3$ 分块对角矩阵**；消去地面点未知数后得到的 $6m \times 6m$ **改化法方程**在规则航带网（按跨航带短边方向优先编号）中呈**对称正定带状稀疏矩阵**。
24. **自检校附加参数相关性陷阱**：在平坦地面且单一航高竖直摄影条件下，相机主距误差 $\Delta f$ 与摄站航高误差 $\Delta Z_S$ 完全线性耦合不可分，主点偏移 $(\Delta x_0, \Delta y_0)$ 与水平线元素 $(\Delta X_S, \Delta Y_S)$ 强相关，盲目引入会导致**过度参数化**病态。
25. **GNSS/POS 辅助空三的空间偏心**：相机投影中心相对机载 GNSS 天线相位中心的空间偏移向量称为**偏心分量（杆臂值 Lever-Arm）**；像空间系相对 IMU 坐标系的三轴安装夹角称为**偏心角（视准轴误差 Boresight）**。仅用动态 GPS（无 IMU）单航带无法确定绕摄影基线轴的横滚旋转，需加构架航线或四角控制点。
26. **增量式 SfM vs 全局式 SfM**：增量式 SfM 逐张像片注册并反复执行局部/全局光束法平差，稳健抗粗差但耗时且易在长链条产生尺度漂移；全局式 SfM 一次性对全图相对位姿做旋转一致性与平移平均滤波后仅做一次全局 BA，速度极快但对初始相对姿态图粗差较敏感。

### 三、第 5 章：数字影像采样、重采样与核线重排列（11 条 · 紧扣 PPT）
27. **数字影像 vs 数字化影像（PPT 原话辨析）**：由 CCD/CMOS 等传感器**直接获取**的影像称为**数字影像**；由传统光学模拟相片经扫描仪等数字化设备处理后获得的数字影像称为**数字化影像**。
28. **采样、量化与编码三步骤**：**采样**是对连续空间坐标离散化（像素大小即采样间隔，决定**空间分辨率**）；**量化**是把采样信号幅值经舍入或截尾变为有限有效数字（决定**辐射分辨率**，如 8 bit 有 $2^8 = 256$ 个灰度级）；**编码**是将量化后的离散幅值转为二进制数字。
29. **三大坐标系原点约定差异（PPT 重点必考！）**：标准笛卡尔系以图像**中心**为原点；**经典数字摄影测量以【左下角像素中心】为原点**；**计算机视觉（CV）与通用图像存储以【左上角像素中心】为原点**（行向下、列向右）。
30. **三种分辨率参考面区分**：**像素分辨率**以成像传感器平面为参考；**空间分辨率 / 地面采样距离（GSD）**以物方地面平面为参考；**辐射分辨率**度量传感器区分微弱反射能量差异的量化比特位数。
31. **最邻近重采样的唯一独特优势**：在三种重采样中，唯有**最邻近像元法（四舍五入）完全不破坏原始影像的真实灰度数值**（不会产生原图不存在的新灰度级），计算最快，但几何精度最差（最大误差 $0.5$ 像素，边缘呈锯齿状）。
32. **双线性与双三次重采样权衡**：双三次插值（$4 \times 4$ 邻域三次样条/卷积）几何精度和边缘保持最好，但计算最费时；**一般情况下工程首选双线性插值法（$2 \times 2$ 邻域，离得越近权越大）**，兼顾几何精度与计算效率。
33. **核线几何三大基本性质**：① 同名像点必定位于同名核线上；② 同一张倾斜像片上的所有核线必定交汇于本片**核点**（摄影基线与像平面的交点）；③ 当理想正直摄影（像平面平行于摄影基线）时，核点位于无穷远处，**所有核线互相平行且平行于摄影基线**。
34. **核线重排列的几何本质**：将左、右原始倾斜影像通过空间旋转（二维平面射影变换）重投影到**同一个与摄影基线平行的虚拟平面**上，使重采样后的核线影像满足同名点行号相等（上下视差 $q = 0$）。
35. **共面方程生成核线的不变量**：在以基线为 $X$ 轴的单独相对定向辅助系下，对同一条核线（同一核面）而言，比值 **$K = \dfrac{Y_1}{Z_1} = \dfrac{Y_2}{Z_2}$ 是一个常数**。
36. **Moravec 算子为什么取最小值 `min` 而非最大值 `max`？**：若在直线边缘上，沿垂直边缘方向灰度差平方和极大，但沿平行边缘方向灰度差几乎为 $0$！只有取四个方向的**最小值** $\mathrm{IV} = \min(V_1, V_2, V_3, V_4)$ 仍大于阈值，才能确保四个方向均有显著灰度变化（真角点），从而滤除直线边缘。
37. **Förstner 算子的圆度 $q$ 物理意义**：$q = \dfrac{4\det N}{(\operatorname{tr} N)^2} \in [0, 1]$ 表征权误差椭圆接近正圆的程度——理想各向同性角点或圆心处两特征值相等，$q \to 1$；直线边缘处单向梯度为零，$\det N \to 0 \implies q \to 0$。

### 四、第 6 章：影像匹配原理与核心算法（11 条 · 紧扣 PPT）
38. **维纳-辛钦定理（谱分析核心）**：随机影像信号的**自/互相关函数与其功率谱是一对傅里叶变换对**，自然影像的功率谱近似呈**指数衰减曲线**。
39. **相关窗口大小的反比铁律（单选题最高频陷阱！）**：
    - 匹配窗口 $a$ **较小时**：高频信息丰富 $\implies$ 相关函数峰值**陡峭** $\implies$ **相关定位精度高，但拉入范围小、出错率高**；
    - 匹配窗口 $a$ **较大时**：低频信息占优势 $\implies$ 相关函数峰值**平缓** $\implies$ **拉入范围大、出错率低，但相关定位精度差**！
40. **金字塔影像分层相关口诀**：构建金字塔需先做**低通平滑滤波**再增大采样间隔（如 $2 \times 2$ 四像元平均）；匹配遵循“从粗到精”策略——顶层是**“小影像、大窗口”**（保拉入范围与可靠性），底层是**“大影像、小窗口”**（保子像素高精度）。
41. **NCC 对哪种辐射变形失效？**：NCC 对**线性**亮度和对比度变化 $g' = a g + b\ (a > 0)$ 严格不变（$\rho = +1$）；但若 $a < 0$（正负片灰度反转，如红外与可见光异源反转）则 $\rho = -1$，对剧烈**非线性辐射畸变**则需改用**互信息（MI）或 Census 变换**。
42. **物方匹配代表——铅垂线轨迹法（VLL）四大特征**：① 属于**基于物方的“地面元影像匹配”**；② 铅垂线在中心投影影像上的轨迹是一条直线；③ **不需要预先制作核线影像，也不需要再做空间前方交会**；④ 直接通过相关系数序列的抛物线极值一步确定地面点高程 $Z$。
43. **影像匹配面临的四大核心难题（PPT 原话）**：① **几何变形**（竖直航摄下**地形高差**是造成尺度与仿射变形的主要因素）；② **辐射变形**；③ **重复纹理**（产生多极值歧义性）；④ **遮挡**（地形遮挡与地物遮挡）。
44. **二值特征描述子的距离度量**：SIFT 等浮点向量描述子用**欧氏距离**匹配；ORB、BRIEF 及 Census 变换生成的二进制比特串一律采用**按位异或（XOR）统计汉明距离（Hamming Distance）**匹配。
45. **ORB vs SIFT 不变性边界**：SIFT 兼具尺度不变性与旋转不变性；基础 BRIEF 既无尺度也无旋转不变性；**ORB** 通过 FAST 角点灰度质心法主方向实现了**旋转不变性**，但默认单尺度下不具备尺度不变性（需配合图像金字塔）。
46. **SGM 半全局匹配惩罚项关系**：能量函数中恒有 **$P_2 > P_1 > 0$**——小惩罚 $P_1$ 允许视差变化 1 像素以适应**连续倾斜或弯曲表面**；大惩罚 $P_2 = \dfrac{P_2'}{\lvert I_p - I_q \rvert}$ 随图像边缘灰度差增大而自适应减小，目的是**保护建筑物等高程断裂边缘不被平滑模糊**。
47. **遮挡点检测的标准手段**：密集匹配中采用**左右一致性检查（Left-Right Consistency Check）**，交换左、右影像分别作为基准片生成两张视差图，若对应点视差之差超过 1 像素则判定为遮挡点或误匹配点予以剔除。
48. **LSM 理论定位中误差与纹理梯度的关系**：由 $\hat{\sigma}_x = \dfrac{\hat{\sigma}_0}{\sqrt{\sum (g'_x)^2}}$ 可知，最小二乘匹配的定位中误差与窗口内**灰度梯度平方和的平方根成反比**——纹理反差越强、梯度越大，子像素定位精度越高！

### 五、第 8 & 9 章：DEM 建立与数字微分纠正 DOM（12 条 · 跳过 8.3.4/8.3.5/8.4.5）
49. **DTM 提出者与 DSM 转换关系**：数字地面模型 DTM 由美国麻省理工学院 **Miller 教授**（1956/1958 年）首次提出；密集匹配直接获取的是含房树的 **DSM**，必须经过**地形滤波（去除非地面点）**才能得到裸露地表 **DEM / DTM**。
50. **DEM 六种采样方式关键定性结论（PPT 原话）**：① **沿断面扫描采样**精度比其他方法差，在地形坡度趋势改变处常存在系统误差；② **渐进采样**利用**高程二阶差分**（或两点中点二次内插与线性内插之差）超阈值判断是否局部加密；③ **选择采样**专门采集地形特征点线，是为构建 **TIN** 专门设计的；④ **数据采集是 DEM 的关键，任何内插方法都不能弥补取样不当造成的信息损失**！
51. **四大格网 DEM 建模内插适用场景对比（PPT 小结原话）**：① **移动曲面法**对**密集点云**处理非常有效；② **多面函数法**属于全局整体插值，在**采样数据点较少**时较实用；③ **有限元法**擅长处理含**地形断裂线**的区域（采用**“跌落法”**和符号判断法分子区隔离平差）；④ **先构 TIN 后平面插值法**是目前工程**最主流实用**的方法。
52. **格网 DEM 数据压缩三法**：① **整型量存储**（先将高程减去基准常数 $Z_0$ 再量化为短整型）；② **差分映射**（存储相邻格网高程一阶/二阶差值）；③ **无损压缩编码**（如游程编码、霍夫曼编码）。
53. **泰森多边形与狄洛尼三角网性质**：泰森多边形（Voronoi 图）的划分是**唯一的**，每个泰森多边形都是**凸多边形**且互不重叠；连接相邻泰森多边形离散点生成的**狄洛尼（Delaunay）三角网**满足**空外接圆准则**和**最大最小角准则**，能有效避免狭长和过小锐角三角形（角度判断法构网则是每次用余弦定理选张角最大的第三顶点扩展）。
54. **TIN 三种存储结构优劣辨析**：① **直接存网点邻接指针链**：存储量最小、编辑最方便，但三角形需实时重算，不便于快速检索与显示；② **直接存三角形及邻接三角形表**：拓扑检索与显示极快，但存储量大、编辑不便；③ **混合结构**：兼顾快速检索与动态编辑。
55. **格网任意点高程内插连续性辨析（PPT 易错原话！）**：在已建好矩形格网 DEM 上求任意点高程时，**双线性多项式（双曲抛物面）内插只能保证相邻格网接边处的【连续】，不能保证【光滑】（跨边界一阶偏导数不连续）**，但因计算量小最常用；**双三次多项式（16 系数三次曲面）**利用节点高程、一阶偏导与二阶混合导数，可**同时保证跨格网边界的连续与光滑**！
56. **TIN 三角形点包含判别的等价性**：判断平面点 $P$ 落在哪个三角形 $\triangle abc$ 内最常用的**面积法**（$S_{abc} = S_{abp} + S_{apc} + S_{pbc}$）与**向量叉积同向法**（$\overrightarrow{ab}\times\overrightarrow{ap},\ \overrightarrow{ap}\times\overrightarrow{ac},\ \overrightarrow{pb}\times\overrightarrow{pc}$ 平行同向）在数学本质上完全等价。
57. **数字微分纠正的三要素与单元归属**：三要素为 **① 原始影像及定向参数、② 数字地面模型 DEM、③ 成像构像模型**（外加指定输出 GSD）。严密数字微分纠正按几何单元划分属于 **点元素纠正**；而现代基于 DEM 小格网或 **TIN（Mesh）三顶点算像坐标、内部用 $2 \times 3$ 仿射矩阵直接交由 GPU 贴纹理**的流行实用算法属于 **面元素纠正**。
58. **反解法 vs 正解法核心性质反差（必考！）**：
    - **反解法（间接法：地面 $\to$ 影像）**：框幅式**无需迭代**，计算简单稳定，**输出正射影像每个像素必定有灰度值（绝无空洞漏洞）**，缺点是在裸地 DEM 下不同地面点可能反算出同一原片像素（存在**映射歧义，无法直接判定遮挡**）；
    - **正解法（直接法：影像 $\to$ 地面）**：因 $X, Y$ 依赖 DEM 的 $Z$，**必须迭代求解高程 $Z$**，且地面落点不规则导致部分输出像素没有灰度（**存在空白空洞，必须二次插值拟合**），但优点是**能根据空间深度自然判定遮挡，无重影歧义**。
59. **传统 DOM 房屋重影与 TDOM 根治机理**：传统反解法 DOM 用裸地 DEM 纠正高楼会产生**房屋倾倒与双重屋顶鬼影**；真正射影像 **TDOM** 必须使用包含建筑物高度的 **DSM/DBM**，配合 **Z-buffer 深度缓冲遮挡检测**与高重叠度多视从影像纹理补偿。
60. **线阵推扫影像纠正差异**：框幅式整张照片共用 6 个外方位元素，反解法无需迭代；线阵列推扫卫星影像（垂轨中心投影、沿轨近似平行投影）**每一扫描行都有独立外方位元素**，若用严密共线方程反解需迭代确定最佳扫描行时间 $t$，若用 **78 参数 RPC 有理函数模型**则可直接正向一步算出扫描行列号。

### 【15 道自测题标准答案与一句话秒杀解析】
1. **B**（PPT 第 5 章原话：经典摄影测量左下角像素中心为原点，计算机视觉左上角像素中心为原点。）
2. **C**（香农定理：最高频率每周期至少采样 2 个样本，即 $f_s \ge 2 f_{\max}$。）
3. **A**（最邻近法仅对浮点坐标四舍五入取整，完全保留原像素灰度值不变。）
4. **B**（单独法以基线为 $X$ 轴故 $B_Y = B_Z = 0$，左片主垂面重合 $XZ$ 面故 $\omega_1 = 0$。）
5. **B**（小窗口高频丰富 $\to$ 相关峰陡峭 $\to$ 精度高、拉入范围小、易出错；大窗口完全相反。）
6. **C**（协方差仅抗 $+b$ 偏移，唯有归一化相关系数 NCC 同时抗线性偏移 $+b$ 与缩放 $\times a$。）
7. **C**（张祖勋推导整像素均匀误差标准差 $1/\sqrt{12} \approx 0.3\ \mathrm{px}$，抛物线拟合达 $0.15\sim 0.2\ \mathrm{px}$，LSM 达 $0.01\sim 0.1\ \mathrm{px}$。）
8. **B**（VLL 直接将物方候选点用共线方程投回原始左右像片取窗相关，无需核线重排列！）
9. **D**（11 个未知数每点列 2 式需 $\ge 6$ 点；若全共面则退化为 8 自由度单应矩阵 $H$ 导致秩亏。）
10. **B**（7 个绝对定向参数至少需 $2\times 3 + 1\times 1 = 7$ 个坐标分量，且 3 个高程点不共线。）
11. **B**（包含地表房屋树木的是数字表面模型 DSM，滤波去非地面点后得 DEM/DTM。）
12. **C**（渐进采样判据：高程二阶差分超限，或两点中点二次内插与线性内插差值超限。）
13. **B**（PPT 第 8-4 章小结重点：双线性连续但不光滑；双三次 16 参数既连续又光滑。）
14. **A**（只存点坐标和点邻接指针链最省空间易编辑，但无显式三角形表故检索显示慢。）
15. **D**（严密数字微分纠正属点元素纠正；反解法由地面算影像不迭代无空洞，正解法由影像算地面需迭代有空洞但可判遮挡。）</script>
