<script type="text/plain" id="md-raw"># 92 数字摄影测量全真模拟卷 B（偏简单）

**适用课程与考纲**：山东理工大学（SDUT）《数字摄影测量学》期末全真模拟（偏基础难度 · 与 A 卷完全互补零重复）

**背诵自测说明**：点击页面顶部「**背诵自测模式**」开关，所有答案区将自动模糊遮盖，作答后点击单题即可揭晓核对。

| 题号 | 题型 | 题量与分值 | 考查侧重 |
| :---: | :--- | :---: | :--- |
| **一** | 单项选择题 | 10 题 × 2 分 = 20 分 | 采样定理、转角系统、匹配模型、绝对定向与 DOM 原理 |
| **二** | 名词解释 | 5 题 × 4 分 = 20 分 | 外方位元素、视差、共面方程、NCC 与数字微分纠正 |
| **三** | 简答题 | 5 题 × 7 分 = 35 分 | 核线生成、NCC/LSM 协同、空三自由网、DEM 内插、TDOM |
| **四** | 综合计算题 | 13 分 + 12 分 = 25 分 | **共线方程旋转矩阵与反解法 DOM** + **共面条件核线与单独相对定向** |

## 一、单项选择题（共 10 小题，每小题 2 分，共 20 分）

### 1. 根据香农（Shannon）采样定理，为由离散采样数据无失真地完全恢复原连续图像函数，采样频率至少应大于最高空间频率 $f_{\max}$ 的（　）

A. $0.5$ 倍<br>
B. $1$ 倍<br>
C. $2$ 倍<br>
D. $4$ 倍

> **【参考答案与分步采分点】**：**C**（2 分）。香农采样定理规定最高空间频率内每周期至少采集 $2$ 个样本，即 $\Delta x \le \frac{1}{2f_{\max}}$（$f_s \ge 2f_{\max}$）。

### 2. 我国经典摄影测量采用的 $\varphi\text{--}\omega\text{--}\kappa$ 转角系统中，第一主轴是（　），由此构成的 $3\times 3$ 正交旋转矩阵 $R$ 共有（　）个独立参数。

A. $X$ 轴、$9$ 个<br>
B. $Y$ 轴、$3$ 个<br>
C. $Z$ 轴、$6$ 个<br>
D. $Y$ 轴、$6$ 个

> **【参考答案与分步采分点】**：**B**（2 分）。我国转角系统以 **$Y$ 轴为第一主轴**（旋转顺序 $\varphi \to \omega \to \kappa$）；$R$ 的 9 个元素受 6 个正交归一化约束，仅含 **3 个独立自由度**。

### 3. 在进行立体像对人工观察时，若将正常摆放的左、右两张像片各自在平面内同向旋转 $90^\circ$（使摄影基线垂直于眼基线），人眼看到的立体效应为（　）

A. 正立体<br>
B. 反立体<br>
C. 零立体<br>
D. 高程夸张正立体

> **【参考答案与分步采分点】**：**C**（2 分）。两片同向旋转 $90^\circ$ 后左右视差全部转为上下视差，产生无三维深度感的**零立体**（左右对调或各转 $180^\circ$ 则产生反立体）。

### 4. 在三种常用数字影像灰度重采样方法中，运算速度最快且百分之百保留原始像元灰度值不变的是（　）

A. 最邻近像元法<br>
B. 双线性内插法<br>
C. 双三次卷积法<br>
D. 移动曲面拟合法

> **【参考答案与分步采分点】**：**A**（2 分）。**最邻近像元法**仅对坐标四舍五入取整赋值，完全不改变原像元灰度值。

### 5. 在单独像对相对定向建立的像空间辅助坐标系（以摄影基线为 $X$ 轴、左片主垂面为 $XZ$ 平面）中，恒等于零的三个参数是（　）

A. $\varphi_1, \omega_1, \kappa_1$<br>
B. $B_Y, B_Z, \omega_1$<br>
C. $B_Y, B_Z, \varphi_1$<br>
D. $B_X, B_Y, \kappa_1$

> **【参考答案与分步采分点】**：**B**（2 分）。单独法以基线为 $X$ 轴故 $B_Y = B_Z = 0$，左片主垂面与 $XZ$ 平面重合故 $\omega_1 = 0$。

### 6. 在基于像方的五种相似性匹配测度中，几何意义等价于去均值灰度矢量夹角最小，且对两影像线性辐射变形 $g'=ag+b\ (a>0)$ 严格不变的是（　）

A. 互相关函数<br>
B. 协方差函数<br>
C. 归一化相关系数（NCC）<br>
D. 差平方和（SSD）

> **【参考答案与分步采分点】**：**C**（2 分）。**NCC** 通过减均值消除偏移 $b$、除以标准差约去比例因子 $a$，对线性亮度和对比度变化具有严格不变性。

### 7. 最小二乘影像匹配（LSM）的子像素理论定位精度极高（可达 $0.01\sim 0.1$ 像素），但其收敛拉入范围极窄，通常仅为（　）

A. $1\sim 2$ 像素<br>
B. $5\sim 8$ 像素<br>
C. $15\sim 20$ 像素<br>
D. $50$ 像素以上

> **【参考答案与分步采分点】**：**A**（2 分）。LSM 迭代线性化收敛拉入范围仅 **$1\sim 2$ 像素**，必须依靠金字塔 NCC 或特征匹配提供精确初值。

### 8. 对相对定向建立的单元自由立体模型执行基于控制点的绝对定向（7 参数刚体相似变换），最少需要（　）地面控制点。

A. $3$ 个平面控制点<br>
B. $2$ 个平高控制点和 $1$ 个高程控制点（不共线）<br>
C. $1$ 个平高控制点和 $2$ 个高程控制点<br>
D. $5$ 对同名连接点

> **【参考答案与分步采分点】**：**B**（2 分）。7 个绝对定向参数至少需 $2\times 3 + 1\times 1 = 7$ 个坐标分量，即不共线的 **2 个平高点 + 1 个高程点**。

### 9. 在数字摄影测量 DEM 数据采集中，先按稀疏格网采样，再依据（　）是否超限动态局部加密格网的方法称为渐进采样。

A. 地形高程一阶差分<br>
B. 高程二阶差分（或中点二次与线性内插之差）<br>
C. 像元灰度方差<br>
D. 上下视差残差

> **【参考答案与分步采分点】**：**B**（2 分）。**渐进采样**通过**高程二阶差分**（或中点二次与线性内插之差）超阈值判断是否对局部地形复杂区逐级加密。

### 10. 关于框幅式航空影像数字微分纠正的反解法（间接法）与正解法（直接法），下列表述正确的是（　）

A. 反解法必须与 DEM 迭代求交才能确定原片像坐标<br>
B. 反解法输出正射影像易产生空白像素漏洞<br>
C. 正解法无需高程迭代即可一步算出地面坐标<br>
D. 反解法无需迭代且输出图像无空洞，正解法需迭代但能依据深度自然判别遮挡

> **【参考答案与分步采分点】**：**D**（2 分）。反解法由地面 $(X,Y)$ 查 DEM 得 $Z$ 后直接正算原片 $(x,y)$，**无需迭代、无空洞**；正解法由像方求地面须迭代且易生空洞，但可据深度判遮挡。

## 二、名词解释（共 5 小题，每小题 4 分，共 20 分）

### 11. 影像外方位元素与正交旋转矩阵 $R$（4 分）

> **【参考答案与分步采分点】**：
> 1. **定义**（1 分）：确定摄影曝光瞬间像片及摄影中心 $S$ 在地面摄影测量坐标系中空间位置与姿态的参数；
> 2. **6 个参数构成**（1 分）：包括描述摄影中心三维坐标的 **3 个线元素** $(X_S, Y_S, Z_S)$ 和描述像片空间姿态的 **3 个角元素** $(\varphi, \omega, \kappa)$；
> 3. **正交矩阵性质**（1 分）：由 $(\varphi, \omega, \kappa)$ 连乘构成 $3\times 3$ 方向余弦矩阵 $R$，满足正交条件 $R^{\mathrm{T}}R = I$（即 $R^{-1} = R^{\mathrm{T}}$）且 $\det R = +1$；
> 4. **独立自由度**（1 分）：9 个方向余弦元素受 6 个正交归一化条件约束，故仅有 **3 个独立自由度**。

### 12. 左右视差（$p$）与上下视差（$q$）（4 分）

> **【参考答案与分步采分点】**：
> 1. **左右视差（横视差）$p$**（1.5 分）：立体像对左、右同名像点横坐标之差 $p = x_1 - x_2$，随地面高程起伏而变化，是产生人造立体视觉和反演地面高差的源泉；
> 2. **上下视差（纵视差）$q$**（1.5 分）：同名像点纵坐标之差 $q = y_1 - y_2$，主要由两张像片相对倾角误差引起，会阻碍双眼立体融像；
> 3. **定向与核线关系**（1 分）：消除全部同名点上下视差（$q = 0$）是立体像对相对定向的准则，核线重排列影像上恒有 $q = 0$。

### 13. 共面条件方程与立体像对相对定向（4 分）

> **【参考答案与分步采分点】**：
> 1. **共面条件定义**（1.5 分）：立体像对左、右同名光线相交于同一物方点的充要条件是摄影基线向量 $\mathbf{B}$ 与左、右同名光线向量 $\mathbf{R}_1, \mathbf{R}_2$ 三向量共处于同一核平面，即混合积 $\mathbf{B}\cdot(\mathbf{R}_1\times\mathbf{R}_2)=0$（等价于模型上下视差 $Q=0$）；
> 2. **相对定向概念**（1.5 分）：不依赖任何地面控制点，利用像对上**至少 5 对同名像点**（常取 6 点）按共面条件解算 **5 个相对定向元素**（连续法或单独法）；
> 3. **目的与成果**（1 分）：恢复两摄影光束间的相对方位关系，建立任意比例尺的自由立体模型。

### 14. 归一化相关系数匹配（NCC）（4 分）

> **【参考答案与分步采分点】**：
> 1. **定义与测度公式**（1.5 分）：基于像方灰度区域的经典匹配算法，计算目标窗口与搜索候选窗口去均值后的归一化协方差 $\rho = \dfrac{\sum(x_i-\bar{x})(y_i-\bar{y})}{\sqrt{\sum(x_i-\bar{x})^2\sum(y_i-\bar{y})^2}} \in [-1, 1]$；
> 2. **几何意义**（0.5 分）：等价于两去均值灰度矢量在 $N$ 维空间中的夹角最小；
> 3. **核心优势**（1 分）：对两影像间的线性亮度和对比度变化（$g'=ag+b,\ a>0$）具有严格数学不变性；
> 4. **定位精度**（1 分）：整像素相关理论精度约 $0.3$ 像素，三点抛物线峰值拟合可达 $0.15\sim 0.2$ 子像素（但对大旋转、缩放敏感）。

### 15. 数字微分纠正及其三要素（4 分）

> **【参考答案与分步采分点】**：
> 1. **定义与功能**（1.5 分）：依据严密成像几何模型与 DEM，将原始非正射数字影像划分为微小像元单元，逐像元同时消除像片倾斜和地形起伏引起的全部几何变形，重采样生成正射影像（DOM）的过程；
> 2. **三要素之一**（0.5 分）：原始数字影像及其内外定向参数；
> 3. **三要素之二**（1 分）：测区数字地面模型 DEM（及指定输出 DOM 的地面采样距离 GSD）；
> 4. **三要素之三**（1 分）：严密或通用构像数学模型（如共线条件方程或 RPC 有理函数模型）。

## 三、简答题（共 5 小题，每小题 7 分，共 35 分）

### 16. 什么是核线与核线影像？简述生成核线影像的三种主要原理，并说明核线影像的两大核心作用。（7 分）

> **【参考答案与分步采分点】**：
> 1. **定义与两大作用**（2 分）：过摄影基线 $S_1 S_2$ 与地面点 $P$ 的平面称核面，核面与左右像面交线为同名核线；按核线方向重投影重采样生成的左右新影像称核线影像。两大作用：① **消除上下视差（$q=0$）** 供舒适立体观测；② 将二维影像匹配**降维为一维同行搜索**。
> 2. **方法一：借助“水平”像片生产**（1.5 分）：利用外方位或单独法相对定向元素，先通过二维射影变换将原始倾斜像片投影纠正为平行于摄影基线的“水平像片”，再沿基线方向等间隔逐行重采样。
> 3. **方法二：利用共面条件方程生产**（2 分）：在基线为 $X$ 轴的单独相对定向辅助系下，由共面条件得同一核面不变量 $K = \dfrac{Y_1}{Z_1} = \dfrac{Y_2}{Z_2}$；由左片已知像点算出 $K$ 后反代辅助坐标关系直接得出左右原始像面上的同名核线直线方程，沿核线等步长双线性重采样即得。
> 4. **方法三：利用投影（旋转）矩阵生产**（1.5 分）：构造以基线方向为 $\mathbf{X}$ 轴的正交核线坐标基 $R_E = [\mathbf{X},\mathbf{Y},\mathbf{Z}]^{\mathrm{T}}$，结合左右原始旋转矩阵构成核线投影变换矩阵（$R_L=R_{\mathrm{aopL}}R_E,\ R_R=R_{\mathrm{aopR}}R_E$）直接完成整图重采样。

### 17. 对比归一化相关系数匹配（NCC）与最小二乘影像匹配（LSM）的原理、数学模型及优缺点，并说明工程上如何协同使用。（7 分）

> **【参考答案与分步采分点】**：
> 1. **原理与数学模型对比**（3 分）：
>    - **NCC**：假设两窗口间仅有纯平移而无几何形状畸变，滑动矩形窗计算去均值归一化协方差寻找相关峰值；
>    - **LSM**：联合引入窗口间的 **6 参数一阶仿射几何变换**（补偿平移、旋转、缩放与切变透视畸变）和 **2 参数线性辐射畸变**（$g_1=h_0+h_1 g_2$），在每轮迭代中对搜索窗口双线性重采样与算梯度，按最小二乘求解最佳子像素位置。
> 2. **精度、收敛域与速度对比**（2.5 分）：
>    - **精度**：NCC 整像素约 $0.3\ \mathrm{px}$（抛物线拟合 $0.15\sim 0.2\ \mathrm{px}$）；LSM 高达 **$0.01\sim 0.1\ \mathrm{px}$** 且自带内部精度评定；
>    - **收敛拉入范围**：NCC 搜索区可开大、拉入范围宽；LSM 拉入范围极窄，**仅 $1\sim 2$ 像素**，初值偏差过大极易发散；
>    - **速度与抗畸变**：NCC 计算较快但抗大旋转和透视变形弱；LSM 需反复重采样与矩阵求逆耗时大，但抗局部仿射变形极强。
> 3. **工程协同机制**（1.5 分）：采用 **“金字塔 NCC / 特征粗匹配 + LSM 精匹配”串联**：先用金字塔 NCC 在大范围锁定误差 $< 1$ 像素的初值，再送入 LSM 迭代精化至 $0.05\ \mathrm{px}$ 级超高精度。

### 18. 简述自动空中三角测量的四大作业阶段，并详细说明“航带法建自由网”与“基于控制点的刚体变换”的原理与作用。（7 分）

> **【参考答案与分步采分点】**：
> 1. **自动空三四大作业阶段**（2 分）：① **影像邻接关系检索**（POS 覆盖或视觉词汇树 BOVW 克服 $O(N^2)$ 穷举）；② **自动连接点提取与匹配**（金字塔匹配 + RANSAC 剔粗差 + 转点构网）；③ **建立区域自由网**（航带法或 SfM）；④ **基于控制点的刚体变换与整体光束法区域网平差**。
> 2. **航带法建自由网原理**（2.5 分）：不依赖地面控制点，对首像对执行相对定向与前方交会建立基准模型；后续第 $k$ 像对执行**连续法相对定向**（继承前一像对右片旋转矩阵保证姿态基准一致），并利用三度重叠区内公共连接点与公共投影中心计算**比例尺归化系数 $\lambda_k$**，逐模型缩放平移拼接构成统一比例尺的自由航带网。
> 3. **基于控制点的刚体（相似）变换原理与作用**（2.5 分）：利用网内至少 **2 个平高控制点 + 1 个高程控制点（不共线）**，先将坐标重心化消去平移，解算 **7 参数三维空间相似变换**（$1$ 尺度 $\lambda$ + $3$ 旋转角 + $3$ 平移），将自由网整体纳入绝对地面坐标系。**核心作用**：消除自由网总体尺度、旋转与位置基准偏差，为随后非线性光束法区域网平差提供高精度、必收敛的初值，并可预检控制点粗差。

### 19. 简述由离散采样点内插建立规则格网 DEM 的四种常用方法基本思想与适用特点。（7 分）

> **【参考答案与分步采分点】**：
> 1. **移动曲面拟合法（逐点局部拟合，2 分）**：将局部坐标原点移至待插格网点，在半径 $R$ 内搜寻 $n > 6$ 个分布于四象限的邻近采样点，按距离衰减定权用最小二乘拟合二次曲面 $Z = Ax^2+Bxy+Cy^2+Dx+Ey+F$，常数项 $F$ 即为格网高程 $Z_P$。**特点**：灵活、占内存小，对**密集点云**非常有效。
> 2. **多面函数法（全局核叠加，1.5 分）**：以 $n$ 个数据点为中心构造圆锥面或双曲面核函数，通过全局方程组将地形表示为各核曲面的线性叠加。**特点**：整体连续光滑，在**采样点较少且稀疏**时尤为实用。
> 3. **有限元内插法（局部样条整体平差，2 分）**：划分局部多项式单元，联合采样点高程观测方程与格网曲率平滑虚拟观测方程整体平差；可采用 **“跌落法”** 分子区隔离数据，**擅长严密处理地形断裂线与陡坎**。
> 4. **先构 TIN 后平面插值法（工程主流，1.5 分）**：先对全区采样点与特征线构建 Delaunay 不规则三角网，再检索格网点所属三角形并用三点共面方程直接线性求高程。**特点**：速度极快、无矩阵病态风险且精准保真地形特征线。

### 20. 为什么传统 DOM 上高大建筑物会出现倾倒和双重重影？简述真正射影像（TDOM）制作的核心原理。（7 分）

> **【参考答案与分步采分点】**：
> 1. **传统 DOM 高楼倾倒与重影成因**（2.5 分）：传统反解法 DOM 使用滤除房屋高度的**裸露地表 DEM**。① 屋顶高出地面 $\Delta h$ 存在中心投影辐射位移，裸地 DEM 未能将屋顶拉回正射位置，导致**房屋向外侧倾倒并遮挡相邻街道**；② 遍历真实屋顶位置与被遮挡的地面盲区位置时，代入低高程反投回原片会**重复命中同一屋顶像素**，从而产生两个屋顶（**双重重影/鬼影**）。
> 2. **真正射影像（TDOM）三步制作原理**（4.5 分）：
>    - ① **高精度表面模型驱动**（1.5 分）：采用精确表达建筑物三维几何轮廓的 **DSM 或 DBM（数字建筑模型）** 代替裸地 DEM 进行微分纠正，将倾斜屋顶严格拉回真实垂直正射位置；
>    - ② **Z-buffer 遮挡盲区检测**（1.5 分）：利用深度缓冲器比较或光线可见性分析，识别被高楼遮挡的地面不可见盲区并置为空白（禁止填入屋顶纹理，彻底根除重影）；
>    - ③ **多视重叠影像补偿与匀光镶嵌**（1.5 分）：自动搜索高重叠度（$\ge 80\%$）相邻从影像中对该盲区无遮挡的视角提取真实地面纹理填补盲区，经 Wallis 匀光与最佳接缝线镶嵌输出 TDOM。

### 22. 【必考 · 共面条件核线、单独法相对定向与正直像对视差测高】（12 分）

已知某航摄相机焦距 $f = 150.00\ \mathrm{mm},\ x_0 = y_0 = 0$，像元尺寸 $d = 10\ \mu\mathrm{m} = 0.010\ \mathrm{mm}$。

（1）在以摄影基线为 $X$ 轴的单独相对定向辅助系中，基线向量 $\mathbf{B} = [500.00,\ 0,\ 0]^{\mathrm{T}}\ \mathrm{m}$，测得某同名点的左、右光线辅助方向向量为 $\mathbf{S}_1\mathbf{a}_1 = [40.00,\ 30.00,\ -150.00]^{\mathrm{T}}\ \mathrm{mm}$、$\mathbf{S}_2\mathbf{a}_2 = [-20.00,\ 30.00,\ -150.00]^{\mathrm{T}}\ \mathrm{mm}$。试由共面条件行列式 $F$ 判别两光线是否共面，并求该核面不变量 $K = Y_1 / Z_1$；（3 分）<br>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
