## 零、考前速览：八组极易混淆核心概念一句话秒杀表

| 对比组 | 概念 A | 概念 B / C | 核心采分差异点 |
| :--- | :--- | :--- | :--- |
| **1. 影像源** | **数字影像** | **数字化影像** | 前者由 CCD/CMOS 数字传感器**直接曝光获取**；后者由传统光学模拟胶片经扫描仪**数字化离散处理**获得。 |
| **2. 离散化** | **采样（Sampling）** | **量化（Quantization）** | **采样**是对二维空间位置坐标离散化，决定**空间分辨率**；**量化**是对辐射亮度幅值离散化，决定**辐射分辨率**。 |
| **3. 投影系** | **中心投影（原始航片）** | **正射投影（DOM/地形图）** | 中心投影光线汇聚于 $S$，比例尺随高程和倾角变化，存在**倾斜位移与地形起伏投影差**；正射投影光线平行且垂直基准面，比例尺处处恒定。 |
| **4. 视差类** | **左右视差 $p = x_1 - x_2$** | **上下视差 $q = y_1 - y_2$** | **左右视差**反映地面高程起伏，是产生人造立体深度的源泉；**上下视差**由两片相对外方位倾角误差引起，核线重采样后恒有 $q = 0$。 |
| **5. 匹配域** | **像方匹配（NCC / LSM）** | **物方匹配（VLL 铅垂线轨迹法）** | 像方匹配先在影像窗口找同名点再前方交会求三维坐标；**VLL 物方匹配**直接从地面平面点 $(X,Y)$ 沿铅垂线步进高程 $Z_i$ 反投影像算相关极值，一步解出高程。 |
| **6. 地形面** | **DTM（数字地面模型）** | **DEM** / **DSM（数字表面模型）** | **DTM** 含地形及多维地表属性（广义）或特指裸露地表；**DEM** 仅表达裸露地面高程（不含房树）；**DSM** 包含建筑物屋顶、桥梁、树冠等表层包络高程（DSM 经地形滤波得 DEM）。 |
| **7. 纠正颗粒** | **点元素纠正（数字微分纠正）** | **面元素纠正（TIN/格网仿射）** | **数字微分纠正属于点元素纠正**（逐像素严密解算投影变换）；实用快速算法以微小矩形格网或 TIN 三角面片做仿射纹理映射，属**面元素纠正**。 |
| **8. DOM 解法** | **反解法（间接法：地面 $\to$ 影像）** | **正解法（直接法：影像 $\to$ 地面）** | **反解法**无需迭代、输出正射格网绝无空洞漏洞，但裸地 DEM 下无法直接判遮挡；**正解法**需与 DEM 迭代求交、易生空白空洞，但能按深度自然判别遮挡。 |

## 模块一：摄影测量解析基础（对应第 3 章核心 `√`）

### 1. 数字摄影测量（Digital Photogrammetry）与 4D 产品
* **标准定义**：以**数字影像**（或数字化影像）为输入数据源，依托通用计算机硬件，综合运用摄影测量几何原理、数字图像处理与计算机视觉技术，**以自动影像匹配代替人眼立体量测**，自动或半自动提取被测目标三维几何与语义信息并生产数字测绘产品的学科。核心成果为 **4D 产品**：**DEM**（数字高程模型）、**DOM**（数字正射影像图）、**DLG**（数字线划图）和 **DRG**（数字栅格地图）。
* **【4分采分点】**：① 数字影像为输入；② 计算机视觉与影像匹配替代人工量测；③ 中心投影向正射投影解析转换；④ 输出 DEM/DOM/DLG/DRG 数字成果。

### 2. 中心投影（Central Projection）与正射投影（Orthogonal Projection）
* **标准定义**：投射线全部汇聚于空间唯一固定点（**摄影中心 $S$**）的投影称为**中心投影**（框幅式航摄像片的构像基础，比例尺随地面高程 $h$ 与像片倾角 $\alpha$ 变化）；投射线**互相平行且严格垂直于水平投影基准面**的投影称为**正射投影**（地形图与 DOM 的几何基础，图面比例尺处处一致，无倾斜变形与地形起伏投影差）。
* **【4分采分点】**：① 中心投影光线交汇于投影中心 $S$；② 中心投影比例尺非恒定且含投影差；③ 正射投影光线平行且垂直投影面；④ 正射投影比例尺恒定、无投影差。

### 3. 像主点（$o$）、像底点（$n$）、等角点（$c$）与等比线
* **标准定义**：倾斜航摄像片上的核心透视特征点线：① **像主点 $o$** 为摄影中心 $S$ 向像平面所作垂线（主光轴）的垂足；② **像底点 $n$** 为过 $S$ 的铅垂线与像平面的交点，是**地形起伏投影差的辐射中心**；③ **等角点 $c$** 为主光轴与铅垂线夹角 $\alpha$ 的分角线与像平面的交点，是**像片倾斜位移的辐射中心且保持方向角不变**；过等角点 $c$ 且垂直于主纵线的水平线称为**等比线**，其上摄影比例尺恒等于 $f/H$。
* **【4分采分点】**：① 主光轴垂足为像主点 $o$；② 铅垂线交点及起伏投影差中心为像底点 $n$；③ 倾角分角线交点及保角中心为等角点 $c$；④ 过等角点水平线的比例尺恒为 $f/H$（等比线）。

### 4. 像点位移与地形起伏投影差（Relief Displacement）
* **标准定义**：因像片倾斜（$\alpha \neq 0$）或地面相对基准面存在高差（$h \neq 0$），使中心投影像点偏离理想水平面正射投影位置的量值称为**像点位移**。其中，纯粹由地面高差 $h$ 引起的沿像底点向径方向的辐射状位移称为**投影差**，在铅垂像片上满足 $\delta_h = \dfrac{r \cdot h}{H}$（$r$ 为塔顶像点至像底点向径，$H$ 为相对基准面航高）。高出基准面（$h > 0$）向外移，低于基准面（$h < 0$）向内移，像底点处 $r = 0$ 故无投影差。
* **【4分采分点】**：① 中心投影相对理想正射位置的偏差；② 投影差公式 $\delta_h = r h / H$；③ 以像底点 $n$ 为辐射中心；④ 高出外移、低于内移、像底点处为零。

### 5. 影像内方位元素（Interior Orientation Elements）与内定向
* **标准定义**：确定摄影物镜后节点（**投影中心 $S$**）相对于**像平面**几何位置的参数称为**内方位元素**，包含 **3 个参数**：像主点在框标坐标系中的坐标 $(x_0, y_0)$ 以及摄影机主距（焦距）$f$，用于恢复摄影瞬间的**内部摄影光束形状**，通常由实验室相机检校测定。利用框标理论坐标与扫描像素行列坐标解算二维仿射变换（6 参数）并扣除主点偏移转化为像平面坐标的过程称为**数字影像内定向**。
* **【4分采分点】**：① 确定投影中心相对像平面位置；② 含 $(x_0, y_0, f)$ 共 3 个参数；③ 恢复摄影内部光束形状；④ 内定向将像素行列系转为像平面系。

### 6. 影像外方位元素（Exterior Orientation Elements）与正交旋转矩阵 $R$
* **标准定义**：确定摄影曝光瞬间**像片及摄影中心 $S$** 在地面摄影测量坐标系中空间位置与姿态的参数称为**外方位元素**，每张像片含 **6 个独立参数**：描述投影中心三维坐标的 **3 个线元素** $(X_S, Y_S, Z_S)$，以及描述像空间系相对物方系空间朝向的 **3 个角元素** $(\varphi, \omega, \kappa)$。由 $(\varphi, \omega, \kappa)$ 按主次轴连乘构成 $3 \times 3$ **正交方向余弦矩阵 $R$**，其 9 个元素受 6 个正交归一化条件约束（$R^{\mathrm{T}}R = I,\ \det R = +1$），故仅有 **3 个独立自由度**。
* **【4分采分点】**：① 确定摄影瞬间像片在物方系的位置与姿态；② 3 个线元素 $(X_S, Y_S, Z_S)$ + 3 个角元素 $(\varphi, \omega, \kappa)$；③ 旋转矩阵 $R$ 满足 $R^{-1} = R^{\mathrm{T}}$；④ 9 个方向余弦仅含 3 个独立参数。

### 7. 共线条件方程（Collinearity Condition Equations）
* **标准定义**：表达理想中心投影构像瞬间，**摄影中心 $S$、像点 $a$ 及其对应物方地面点 $A$ 三点严格位于同一条空间直线上**的解析方程：

  $$x - x_0 = -f \frac{a_1(X-X_S)+b_1(Y-Y_S)+c_1(Z-Z_S)}{a_3(X-X_S)+b_3(Y-Y_S)+c_3(Z-Z_S)}, \quad y - y_0 = -f \frac{a_2(X-X_S)+b_2(Y-Y_S)+c_2(Z-Z_S)}{a_3(X-X_S)+b_3(Y-Y_S)+c_3(Z-Z_S)}$$

  它是解析与数字摄影测量最核心的基础方程，空间后方交会、前方交会、光束法区域网平差与数字微分纠正均建立在其之上。
* **【4分采分点】**：① 投影中心 $S$、像点 $a$、地面点 $A$ 三点共线；② 准确写出分式构像方程形式；③ 联系像方坐标、内外方位元素与物方三维坐标共 12 个量；④ 空三与数字微分纠正的通用基础模型。

### 8. 单像空间后方交会（Single-Image Space Resection）
* **标准定义**：在已知相机内方位元素 $(x_0, y_0, f)$ 的条件下，利用单张像片覆盖范围内**至少 3 个不共线的地面平高控制点**（生产常取四角 $\ge 4$ 点）的已知三维地面坐标 $(X, Y, Z)$ 及量测像点坐标 $(x, y)$，将非线性的**共线条件方程一阶泰勒级数线性化**，通过最小二乘迭代平差解算该像片 **6 个外方位元素**的方法。
* **【4分采分点】**：① 已知内方位元素与控制点三维坐标及像坐标；② 最少需 3 个不共线平高控制点（多余观测 $r = 2n - 6$）；③ 共线条件方程泰勒线性化最小二乘迭代；④ 求解单张像片 6 个外方位元素。

### 9. 人造立体视觉、左右视差（$p$）与上下视差（$q$）
* **标准定义**：双眼分像观察从不同摄站摄取的立体像对，在视觉中枢融合产生三维高低起伏感的现象称为**人造立体视觉**（需满足异站摄取、分像观察、比例尺差 $<15\%$、眼基线平行于摄影基线四条件）。同名像点横坐标之差 $p = x_1 - x_2$ 称为**左右视差（横视差）**，随地面高程变化，用于反演地面高差；同名像点纵坐标之差 $q = y_1 - y_2$ 称为**上下视差（纵视差）**，由两片相对倾角误差引起，用于解算相对定向元素。
* **【4分采分点】**：① 满足立体观察四条件融合生成三维景深；② 左右视差 $p = x_1 - x_2$ 度量高程起伏；③ 上下视差 $q = y_1 - y_2$ 阻碍立体融像；④ 消除上下视差是立体像对相对定向的准则。

### 10. 立体像对空间前方交会（Space Intersection）
* **标准定义**：在已知立体像对左、右两张像片的内方位元素和 **12 个外方位元素**的前提下，根据量测或匹配得到的同名像点坐标 $(x_1, y_1)$ 与 $(x_2, y_2)$，利用**点投影系数法**或**共线条件方程最小二乘法**（每对同名点列 4 个方程解 3 个未知坐标，多余观测数 $r = 1$），交会解算对应地面点三维空间坐标 $(X, Y, Z)$ 的过程。
* **【4分采分点】**：① 已知双像内外方位元素与同名像点坐标；② 两条同名空间光线交会定位；③ 点投影系数法或共线方程最小二乘解算；④ 4 个方程求解物方 $(X, Y, Z)$ 三个未知数（$r = 1$）。

### 11. 共面条件方程与立体像对相对定向（Relative Orientation）
* **标准定义**：立体像对左、右同名光线相交于同一物方点的充要条件是**摄影基线向量 $\mathbf{B}$ 与左、右同名光线向量 $\mathbf{R}_1, \mathbf{R}_2$ 三向量共处于同一核平面**（混合积三阶行列式 $\mathbf{B} \cdot (\mathbf{R}_1 \times \mathbf{R}_2) = 0$，等价于模型上下视差 $Q = 0$），称为**共面条件方程**。**相对定向**即不依赖地面控制点，利用像对上**至少 5 对同名像点**（常取标准 6 点位）按共面条件解算 **5 个相对定向元素**（连续法 $(\mu, \nu, \varphi_2, \omega_2, \kappa_2)$ 或单独法 $(\varphi_1, \kappa_1, \varphi_2, \omega_2, \kappa_2)$），建立任意比例尺自由立体模型的过程。
* **【4分采分点】**：① 基线与左右同名光线三向量共面（混合积为零 / 上下视差为零）；② 无需地面控制点；③ 最少 5 对同名像点解算 5 个相对定向元素；④ 恢复两光束相对方位以建立自由立体模型。

### 12. 单元模型绝对定向（Absolute Orientation）与重心化坐标
* **标准定义**：在相对定向建立自由立体模型后，利用模型内**至少 2 个平高控制点和 1 个高程控制点**（三点不共线，提供 $\ge 7$ 个已知坐标分量），通过三维空间相似变换解算 **7 个绝对定向元素**（1 个尺度因子 $\lambda$、3 个模型旋转角 $\Phi, \Omega, K$、3 个平移量 $\Delta X, \Delta Y, \Delta Z$），将自由模型缩放、旋转、平移纳入绝对地面坐标系的过程。计算中将坐标减去控制点重心化为**重心化坐标**，可消去平移未知数并使法方程正交分块解耦、消除大坐标数值病态。
* **【4分采分点】**：① 三维空间正形相似变换求 7 个绝对定向参数；② 最少需不共线的 2 个平高点 + 1 个高程点；③ 将自由立体模型纳入绝对地面坐标系；④ 重心化坐标消去平移参数并实现法方程解耦。

## 模块二：计算机视觉几何与自动空中三角测量（对应第 4、7 章 `√`）

### 13. 矩阵形式的构像模型（相机投影矩阵）与直接线性变换（DLT）
* **标准定义**：在齐次坐标下将中心投影构像表示为线性矩阵映射 $s [u, v, 1]^{\mathrm{T}} = K [R \mid T] [X, Y, Z, 1]^{\mathrm{T}} = P [X, Y, Z, 1]^{\mathrm{T}}$（其中 $K$ 为 $3 \times 3$ 内参矩阵，$P$ 为含 **11 个独立元素**的 $3 \times 4$ 投影矩阵），称为**矩阵形式构像模型**。利用**至少 6 个不共面的空间控制点**建立线性方程组 $Ax = b$ 直接求解投影矩阵 $P$，再经 **QR 分解**分离出内参 $K$ 与外参 $(R, T)$ 的方法称为**直接线性变换（DLT）**，无需外方位初值、不受大倾角限制，适合非量测相机初值解算。
* **【4分采分点】**：① 齐次坐标投影矩阵 $P = K[R \mid T]$ 含 11 个独立参数；② 最少需 6 个不共面的三维控制点；③ 线性直接求解无需初值且不受大倾角限制；④ 经 QR 分解恢复内参矩阵与正交旋转矩阵。

### 14. 本质矩阵（$E$）、基础矩阵（$F$）与单应矩阵（$H$）
* **标准定义**：计算机视觉双视图几何的三大代数矩阵：① **本质矩阵 $E = \hat{T}R$**：作用于已知内参的归一化相机坐标（$x_2^{\mathrm{T}} E x_1 = 0$），**自由度为 5**（最少 5 点解算）；② **基础矩阵 $F = K_2^{-\mathrm{T}} E K_1^{-1}$**：直接作用于未知内参的像素齐次坐标（$u_2^{\mathrm{T}} F u_1 = 0$，$\det F = 0$），描述点到同名核线的代数约束，**自由度为 7**（非线性 7 点法 / 线性 8 点法）；③ **单应矩阵 $H$**：描述物方共平面或纯旋转摄影下两视图间的二维平面射影变换（$x_2 \simeq H x_1$），**自由度为 8**（最少 4 对不共线点）。
* **【4分采分点】**：① 本质矩阵 $E$ 需已知内参、自由度 5；② 基础矩阵 $F$ 无需内参表达像素核线约束、自由度 7；③ 单应矩阵 $H$ 适用于平面场景视角变换、自由度 8；④ 均可通过 SVD 分解与 RANSAC 稳健估计。

### 15. 自动空中三角测量与视觉词汇树检索（Vocabulary Tree）
* **标准定义**：仅在野外布设少量控制点，利用计算机自动完成影像邻接检索、连接点特征匹配、自由网构建与区域网整体平差，统一解算测区所有像片外方位元素和加密点三维坐标的技术称为**自动空中三角测量**。为避免海量无序无人机影像 $O(N^2)$ 两两穷举匹配，采用层次 K-means 聚类构建树状视觉字典并结合 **TF-IDF 赋权**将每张影像编码为词袋向量，通过向量相似度极速筛选重叠像对建立**影像邻接关系表**的方法称为**视觉词汇树检索**。
* **【4分采分点】**：① 少量野外控制点室内自动加密全网外方位元素与加密点坐标；② 层次 K-means 聚类构建树状视觉词典；③ TF-IDF 词袋向量检索克服 $O(N^2)$ 穷举匹配耗时；④ 快速建立无序影像邻接关系矩阵。

### 16. 航带法建自由网与运动恢复结构（SfM，Structure from Motion）
* **标准定义**：自动空三建立初始自由网的两类核心方法：① **航带法建自由网**：以首像对建立基准模型，后续像对执行连续法相对定向并利用相邻模型公共连接点计算比例尺归化系数，逐模型拼接构成统一比例尺的自由航带网；② **运动恢复结构（SfM）**：无需相机内参与外方位初值，从多视无序重叠影像中自动匹配同名点，通过增量式（逐像注册 + 局部/全局 BA）或全局式（旋转平移一致性滤波 + 单次全局 BA）策略同步恢复相机位姿与稀疏三维点云结构。
* **【4分采分点】**：① 航带法靠连续相对定向与公共连接点比例尺归化串联自由网；② SfM 无需相机内参与位姿初值；③ 最小化重投影误差同步恢复相机内外参与稀疏三维结构；④ 含增量式 SfM 与全局式 SfM 两种建网机制。

### 17. 基于控制点的刚体变换与光束法区域网平差（Bundle Adjustment）
* **标准定义**：利用区域网内少量地面控制点（最少 2 平高 + 1 高程）解算 **7 参数三维相似变换**（尺度缩放 $\lambda$ + 三维刚体旋转 $R$ + 平移 $T$），将空三自由网整体转换至绝对地面坐标系的过程称为**基于控制点的刚体（相似）变换**。随后以**单张像片摄影光束**为基本单元、以**共线条件方程**为误差方程，联合所有像片外方位元素与加密点三维坐标（可扩展相机自检校参数与 GNSS/POS 观测值）进行整体最小二乘优化的严密平差方法称为**光束法区域网平差**。
* **【4分采分点】**：① 刚体（相似）变换利用控制点将自由网整体纳入地面系提供平差初值；② 光束法以单光束为单元、共线条件方程为基础；③ 消去分块对角地面点未知数构建对称正定带状改化法方程；④ 理论最严密、精度最高且易扩展自检校与 POS 辅助平差。

## 模块三：数字影像采样、重采样与核线重排列（对应第 5 章及 PPT）

### 18. 数字影像、数字化影像与采样、量化、编码
* **标准定义**：由数字传感器（CCD/CMOS）直接曝光获取的二维离散像素矩阵称为**数字影像**；由传统光学模拟相片经扫描数字化转换得到的数字矩阵称为**数字化影像**。模拟信号数字化包含三步：① **采样**：对连续空间坐标平面按固定像素间隔离散化，决定**空间分辨率**；② **量化（幅值量化）**：将连续辐射强度舍入离散化为有限级整数灰度（如 8 bit 为 $0\sim 255$），决定**辐射分辨率**；③ **编码**：将量化后的离散整数转换为计算机存储的二进制码流。
* **【4分采分点】**：① 区分传感器直采（数字影像）与模拟片扫描（数字化影像）；② 空间位置离散化为采样（定空间分辨率）；③ 辐射幅值离散化为量化（定辐射分辨率）；④ 离散幅值转二进制数字为编码。

### 19. 香农采样定理（Shannon Sampling Theorem）与地面采样距离（GSD）
* **标准定义**：**香农（奈奎斯特）采样定理**指出：对于有限带宽连续图像函数 $g(x)$，当空间采样间隔 $\Delta x$ 能够保证在原始信号存在的**最高空间频率 $f_{\max}$ 内每周期至少采集 2 个样本**（即 $\Delta x \le \dfrac{1}{2 f_{\max}}$）时，由离散采样序列即可无失真地完全恢复原连续函数。以物方地面为参考平面，单个传感器像元（尺寸 $d$）经中心投影对应的地表像素实地间距称为**地面采样距离（GSD）**，满足 $\mathrm{GSD} = m \cdot d = \dfrac{H}{f} \cdot d$。
* **【4分采分点】**：① 最高空间频率每周期至少采样 2 次（$\Delta x \le \frac{1}{2f_{\max}}$）；② 满足条件可由采样数据无失真完全恢复原连续信号；③ GSD 为地表相邻像素中心实地间距；④ 计算式 $\mathrm{GSD} = (H/f) \cdot d$ 表征物方空间分辨率。

### 20. 数字影像重采样（Image Resampling）与双线性插值
* **标准定义**：在几何纠正、核线重排或最小二乘匹配中，当反算出的待求点坐标 $(x, y)$ **不位于原始数字影像的整数采样像素中心上**时，利用周围整数像元灰度内插计算该浮点位置灰度的过程称为**重采样**。常用方法有三种：① **最邻近法**（四舍五入取最近像元灰度，保原始光谱但有锯齿）；② **双线性插值**（利用周围 $2 \times 2$ 邻域像素按距离远近双向线性加权：$g(x,y) = (1-\Delta x)(1-\Delta y)g_{00} + \Delta x(1-\Delta y)g_{10} + (1-\Delta x)\Delta y\,g_{01} + \Delta x\Delta y\,g_{11}$，平滑无锯齿，工程最常用）；③ **双三次卷积插值**（$4 \times 4$ 邻域三次样条逼近 $\operatorname{sinc}$ 核，精度与锐度最高但最耗时）。
* **【4分采分点】**：① 求解非整数采样点位置灰度的内插过程；② 准确写出或简述双线性插值“离得越近权越大”的 $2\times 2$ 加权机理；③ 对比最邻近（快、保灰度、有锯齿）与双三次（$4\times 4$ 精度最高、耗时）；④ 双线性插值兼顾几何精度与效率，工程最宜采用。

### 21. 核线（Epipolar Line）与核线影像（核线重排列）
* **标准定义**：包含摄影基线 $S_1 S_2$ 与地面点 $P$ 的平面称为**核面**，核面与左、右像平面的交线互称为**同名核线**（同名像点必定位于同名核线上）。利用立体像对定向参数将原始倾斜左、右影像重新投影至**与摄影基线平行的公共水平虚拟平面**上，并按核线方向重新采样生成的左、右新影像称为**核线影像（核线重排列）**。核线影像彻底消除了上下视差（同名点行号严格相等 $y_1'' = y_2''$），使立体观测舒适无重影，并将二维影像匹配严格降维为**一维同行搜索**。
* **【4分采分点】**：① 核面与像平面交线为核线，同名点必在同名核线上；② 重投影至平行于摄影基线的平面并重采样生成核线影像；③ 消除上下视差（$q = 0$）供人工立体观测；④ 将二维全图同名点匹配降维为一维行向搜索。

### 22. 点特征提取算子（Moravec 算子与 Förstner 算子）
* **标准定义**：从数字影像中自动定位角点、圆心等灰度显著变化孤立特征点的算法：① **Moravec 算子**在候选窗口内计算水平、垂直、主对角、副对角**四个方向相邻像素灰度差平方和** $V_1\sim V_4$，取最小值 $\mathrm{IV} = \min(V_1, V_2, V_3, V_4)$ 作为兴趣值并经局部非极大值抑制提取角点；② **Förstner 算子**基于 Roberts 交叉梯度构建协方差法矩阵 $N$，同时计算权误差椭圆的**圆度** $q = \dfrac{4\det N}{(\operatorname{tr} N)^2}$ 与**权重** $w = \dfrac{\det N}{\operatorname{tr} N}$，可精确区分角点与边缘并实现**子像素级特征定位**。
* **【4分采分点】**：① 提取图像中局部灰度剧烈变化的显著定位点（兴趣点）；② Moravec 算四方向灰度差平方和之最小值排除单一边缘；③ Förstner 利用梯度法矩阵的圆度 $q$ 与权重 $w$ 筛选各向同性角点；④ 结合局部极值抑制与子像素定位提高特征提取精度。

## 模块四：影像匹配理论与核心算法（对应第 6 章 `√` 及 PPT）

### 23. 影像匹配（Image Matching）与数字影像相关（Image Correlation）
* **标准定义**：利用计算机自动在两幅或多幅重叠影像之间识别并确定**同一地面点所成同名像点**的过程称为**影像匹配**（是自动空中三角测量稀疏匹配与自动生成 DSM 密集匹配的核心基础）。其中，分别在基准片取**目标区窗口**、在待配片滑动**搜索区候选窗口**，利用互相关函数或相关系数等数值统计测度定量评价两块灰度阵列相似程度以定位同名点的方法，称为**数字影像相关**。
* **【4分采分点】**：① 自动寻找多幅影像间同一物方点的同名像点；② 自动空三与自动生成 DSM 的基础；③ 数字相关基于目标窗口与搜索窗口的灰度统计相似性测度；④ 核线影像上由二维相关简化为一维相关。

### 24. 维纳-辛钦定理（功率谱分析）与影像金字塔（Image Pyramid）相关
* **标准定义**：**维纳-辛钦定理**指出随机信号的相关函数 $R(\tau)$ 与其功率谱 $S(f)$ 是一对傅里叶变换对：匹配窗口较小时高频丰富、相关峰陡峭、**定位精度高但拉入范围小且出错率高**；窗口较大时低频占优、相关峰平缓、**拉入范围大且出错率低但定位精度差**。为化解该矛盾，对原始影像逐次进行低通滤波并增大采样间隔（如 $2 \times 2$ 四像元平均）构成像元数逐层递减的**金字塔影像序列**，采用**“从粗到精（小影像大窗口 $\to$ 大影像小窗口）”**多级分频传递初值的相关策略，兼顾大拉入范围、低误匹配率与高子像素精度。
* **【4分采分点】**：① 维纳-辛钦定理揭示相关函数与功率谱互为傅里叶变换对；② 小窗口精度高但拉入范围小易出错，大窗口拉入范围大但精度低；③ 低通滤波降采样构建多分辨率金字塔影像结构；④ “从粗到精”逐层传递视差初值缩小搜索范围并兼顾精度与稳健性。

### 25. 归一化相关系数匹配（NCC，Normalized Cross-Correlation）
* **标准定义**：基于像方灰度区域的经典匹配算法，通过计算目标窗口 $g$ 与候选搜索窗口 $g'$ 扣除各自均值后的归一化协方差 $\rho \in [-1, 1]$ 来寻找同名点（几何意义等价于 $N$ 维灰度空间中两中心化灰度矢量的**夹角最小**）。因减均值消除了直流亮度偏移、除标准差消除了幅度缩放，**NCC 对两影像间的线性辐射变形（$g' = a g + b,\ a > 0$）具有严格数学不变性**；整像素相关理论精度约为 **$0.3$ 像素**，经三点抛物线峰值拟合可达 **$0.15 \sim 0.2$ 子像素**。
* **【4分采分点】**：① 灰度矢量去均值归一化内积最大（矢量夹角最小）；② 对线性亮度和对比度辐射变化严格不变；③ 对大旋转角、大尺度差异与遮挡敏感；④ 整像素理论精度约 $0.3\ \mathrm{px}$，抛物线拟合达 $0.15\sim 0.2\ \mathrm{px}$。

### 26. 最小二乘影像匹配（LSM，Least Squares Image Matching）
* **标准定义**：Ackermann 提出的超高精度子像素级区域灰度匹配算法。它在匹配窗口间同时引入**一阶 6 参数仿射几何变形模型**（补偿平移、旋转、缩放、切变透视畸变）与 **2 参数线性辐射畸变模型**（$h_0 + h_1 g_2$），以两窗口对应像素灰度残差平方和最小为平差准则，每轮迭代对搜索窗口执行双线性灰度重采样与梯度更新，直至收敛解算最佳同名点（理论定位精度高达 **$0.01 \sim 0.1$ 像素**，但收敛拉入范围仅 **$1 \sim 2$ 像素**，需金字塔或特征匹配提供初值）。
* **【4分采分点】**：① 6 参数几何仿射变换 + 2 参数线性辐射畸变联合最小二乘平差；② 迭代双线性灰度重采样补偿局部地形透视变形；③ 子像素定位精度极高（$0.01 \sim 0.1\ \mathrm{px}$）；④ 拉入范围极窄（$1 \sim 2\ \mathrm{px}$），依赖精确初值。

### 27. 铅垂线轨迹法匹配（VLL，Vertical Line Locus / 地面元影像匹配）
* **标准定义**：最具代表性的**基于物方的影像匹配算法（地面元影像匹配）**。给定待求地面点平面坐标 $(X, Y)$ 及近似最低高程 $Z_{\min}$，沿物方空间铅垂线轨迹按高程步距 $\Delta Z$ 离散取值 $Z_i = Z_{\min} + i \cdot \Delta Z$；每次将三维候选物点 $(X, Y, Z_i)$ 代入共线条件方程正算出左、右像片上的投影坐标 $(x_i', y_i')$ 与 $(x_i'', y_i'')$，提取两侧影像窗口计算相关系数 $\rho_i$；取最大相关系数 $\rho_k$ 及其邻近点进行**抛物线拟合**，极值对应的高程即直接确定为该地面点的真实高程 $Z$。
* **【4分采分点】**：① 基于物方空间直接确定地面点三维坐标（地面元影像匹配）；② 固定 $(X, Y)$ 沿铅垂线按 $Z_i = Z_{\min} + i \Delta Z$ 步进高程；③ 由共线方程反投左右像片提取窗口计算相关系数序列；④ 峰值抛物线拟合一步求得地面高程（无需核线采样与后续前方交会）。

### 28. SIFT 特征匹配、ORB 特征匹配与半全局密集匹配（SGM）
* **标准定义**：① **SIFT（尺度不变特征变换）**：构建高斯差分（DoG）尺度空间检测极值点、主方向对齐后生成 **128 维梯度直方图描述子**，按最近邻/次近邻欧氏距离比值匹配，对大缩放与大旋转高度不变；② **ORB**：结合 FAST 角点与带方向的二值 BRIEF 描述子，用按位异或**汉明距离**极速匹配，具旋转不变性；③ **SGM（半全局匹配）**：在核线影像上构建含数据代价项、小视差渐变惩罚 $P_1$ 与边缘自适应大跳变惩罚 $P_2$ 的全局能量函数，沿 **8/16 方向一维动态规划路径聚合代价**并结合左右一致性去遮挡，实现逐像素高精度密集匹配。
* **【4分采分点】**：① SIFT 基于 DoG 尺度空间与 128 维向量抗大尺度旋转变形；② ORB 基于二值比特串与汉明距离实现高速旋转不变匹配；③ SGM 通过 $P_1, P_2$ 双惩罚项兼顾斜面平滑与建筑边缘保真；④ SGM 用多方向一维动态规划近似二维全局优化生成稠密视差图。

## 模块五：数字高程模型 DEM 建立与存储（对应第 8 章 `√` 及 PPT）

### 29. 数字地面模型（DTM）、数字高程模型（DEM）与数字表面模型（DSM）
* **标准定义**：**DTM（Miller, 1956）** 是定义在区域 $D$ 上描述地形表面形态及资源、土壤、土地利用等多种属性信息的 $m$ 维向量有限序列（测绘中亦常特指**不含任何房屋、植被、桥梁等非地面物体的裸露地表模型**）；**DEM** 是 DTM 最核心的子集，专指用三维有限序列 $\{(X_i, Y_i, Z_i)\}$ 对区域裸露地形高程的数字表达；**DSM** 则是包含地表建筑物、桥梁和森林树冠等一切地表物体顶面高度的表层高程模型（密集匹配生成的 DSM 点云经**地形滤波**剔除非地面点后即可得到 DEM/DTM）。
* **【4分采分点】**：① DTM 为多维地面属性数字阵列（或特指裸露地表）；② DEM 专指裸露地形三维高程序列；③ DSM 包含建筑物、桥梁、树木等表层物体高度；④ DSM 经地形滤波去除非地面点转化为 DEM。

### 30. 规则矩形格网 DEM（Grid）、不规则三角网（TIN）与 Grid-TIN 混合网
* **标准定义**：DEM 的三种空间数据组织形式：① **规则矩形格网（Grid）**：在 $X, Y$ 方向按固定间隔 $(\Delta X, \Delta Y)$ 排列地形点，内部仅用二维数组存储高程 $Z$（平面坐标由起点 $(X_0, Y_0)$ 与行列号隐式推算），存储量最小、管理计算极简，但易丢失地形特征细部；② **不规则三角网（TIN）**：将按地形特征采集的离散点与特征线连接成互不重叠的三角形网，能精确顾及山脊、山谷、断裂线等复杂地貌，但需显式存储坐标与拓扑邻接表，结构与管理较复杂；③ **Grid-TIN 混合网（Ebner 提出）**：一般平坦缓坡区采用规则矩形格网，沿陡坎断裂线等地形特征带附加局部三角网，兼顾存储效率与地貌保真度。
* **【4分采分点】**：① 规则格网只存高程二维数组，存储量最小但难表征微地貌；② TIN 连接特征点线精确表达复杂地形，但拓扑复杂数据量大；③ Grid-TIN 混合网在一般区用格网、特征区附加 TIN；④ 准确写出格网坐标推算式 $X_i = X_0 + i\Delta X,\ Y_j = Y_0 + j\Delta Y$。

### 31. 渐进采样（Progressive Sampling）、选择采样与混合采样
* **标准定义**：数字摄影测量采集 DEM 数据点的代表性策略：① **渐进采样**：先按较稀疏的预定格网采样，再通过计算**高程二阶差分**（或两点中点的二次内插值与线性内插值之差）判别是否超限，超限时自动在地形复杂区局部逐级加密格网；② **选择采样**：人工或半自动专门沿山脊线、山谷线、断裂线、水涯线及山顶洼地特征点进行采集（专为构建 TIN 设计）；③ **混合采样**：将规则格网自动采样与地形特征点线选择采样相结合的工程实用方法。
* **【4分采分点】**：① 渐进采样由疏到密按地形复杂度动态加密；② 渐进加密判据为高程二阶差分或二次/线性内插差超阈值；③ 选择采样专门采集极值点、地形线与断裂线供构 TIN 使用；④ 混合采样融合规则格网的高效率与选择采样的特征保真度。

### 32. 泰森多边形（Voronoi 图）与狄洛尼三角网（Delaunay Triangulation）
* **标准定义**：将平面离散点集 $P$ 所在区域划分为 $n$ 个互不重叠的凸多边形，使每个多边形仅含一个离散点 $P_i$ 且其内部任意点到 $P_i$ 的距离均小于到其他离散点的距离，所得唯一划分称为**泰森多边形（Voronoi 图）**；用直线段连接每两个共享公共边的相邻泰森多边形内的离散点所生成的对偶三角网即为**狄洛尼（Delaunay）三角网**。它具有**唯一性**，并严格满足**空外接圆准则**与**最大最小角准则**，可有效避免产生病态狭长和过小锐角三角形，是构建 TIN 的最优标准。
* **【4分采分点】**：① 泰森多边形按最近邻距离唯一划分为凸多边形；② 连接相邻泰森多边形离散点构成对偶 Delaunay 三角网；③ 满足空外接圆准则与最大最小角准则；④ 避免狭长锐角三角形且支持嵌入地形断裂线约束。

### 33. 格网 DEM 四大内插方法（移动曲面法、多面函数法、有限元法、构 TIN 插值法）
* **标准定义**：由离散采样点拟合内插规则格网节点高程的四类方法：① **移动曲面拟合法**：以待插格网点为局部原点，在半径 $R$ 内搜寻 $\ge 6$ 个邻近点按距离定权最小二乘拟合二次曲面，常数项 $F$ 即为待求高程（适合密集点云）；② **多面函数法（Hardy）**：将光滑地形表示为以各数据点为中心的正圆锥/双曲面核函数的全局线性叠加（适合稀疏采样点）；③ **有限元法（HIFI）**：划分局部多项式单元，联合采样点观测方程与格网曲率平滑虚拟观测方程整体平差，可用“跌落法”分子区顾及**地形断裂线**；④ **构 TIN 平面插值法**：先将全体点构 Delaunay 三角网，再检索格网点落入哪个三角形并按三点共面方程求高程（当前主流实用方法）。
* **【4分采分点】**：① 移动曲面法为局部重心化距离加权二次曲面拟合（$Z_P = F$）；② 多面函数法为全局核函数线性叠加；③ 有限元法结合平滑虚拟观测与断裂线分区处理；④ 先构 TIN 再按三角形平面内插是当前工程主流方法。

## 模块六：数字微分纠正与正射影像 DOM（对应第 9 章 `√` 及 PPT）

### 34. 数字微分纠正（Digital Differential Rectification）及其三要素
* **标准定义**：依据严密成像几何模型与测区数字地面模型（DEM），将原始非正射投影（中心投影或线阵推扫投影）的数字影像划分为无数微小像素单元，**逐像元消除因像片倾斜和地形起伏共同引起的几何变形**，重采样生成正射投影数字影像（DOM）的过程。数字微分纠正必须具备**三大核心要素**：① **原始数字影像及其内外定向参数**；② **数字地面模型 DEM**（及输出地面采样距离 GSD）；③ **严密或通用构像数学模型**（共线条件方程或 RPC 有理函数模型）。
* **【4分采分点】**：① 将原始中心投影数字影像逐像元转换为正射影像 DOM；② 同时消除像片倾角变形与地形起伏投影差；③ 准确答出“原始影像及定向参数 + DEM + 成像模型”三要素；④ 额外指定输出正射格网分辨率 GSD。

### 35. 面元素纠正、线元素纠正与点元素纠正
* **标准定义**：按几何变换基本微分单元划分的三类纠正方式：① **面元素纠正**：将影像划分为微小矩形格网或 TIN 三角面片，先严密计算面片顶点坐标，面片内部采用双线性或二维仿射变换近似映射采样（可直接利用 GPU 矩阵运算并行贴纹理）；② **线元素纠正**：以微小窄条线段为单元消除变形（早期光学缝隙正射投影仪及线阵行纠正）；③ **点元素纠正**：以**单个数字像元（点）**为最小单元独立解算物方与像方的严密投影映射——**经典严密数字微分纠正即属于点元素纠正**。
* **【4分采分点】**：① 面元素纠正以微小格网或 TIN 三角形为仿射变换单元（适配 GPU）；② 线元素纠正以窄条线元为纠正单元；③ 点元素纠正以单个独立像素为纠正单元；④ 明确指出严格意义上的数字微分纠正属于**点元素纠正**。

### 36. 反解法（间接法）与正解法（直接法）数字微分纠正
* **标准定义**：框幅式影像数字微分纠正的两种相反映射路径：① **反解法（间接法：由地面算影像）**：从输出正射影像规则格网点 $(X, Y)$ 出发，由 DEM 内插得 $Z$，代入共线正算式直接算出原片浮点坐标 $(x, y)$ 并双线性内插灰度赋回 $(X, Y)$——**计算简单稳定、无需迭代、输出像素 100% 填满无空洞，但裸地 DEM 下无法自动判别建筑遮挡**；② **正解法（直接法：由影像算地面）**：从原片整数像素 $(x, y)$ 出发，结合共线反算式与 DEM **迭代求解 $(X, Y, Z)$** 并分配合并灰度——**能根据深度信息自然判定遮挡、无重影歧义，但需迭代且正射格网上易出现空白无灰度空洞**。
* **【4分采分点】**：① 反解法“由地面 $(X,Y) \to$ 查 DEM 得 $Z \to$ 算原片 $(x,y)$ 重采样”；② 反解法无需迭代、无像素空洞，是生产主流，但有遮挡重影歧义；③ 正解法“由原片 $(x,y) \to$ 与 DEM 迭代求交得 $(X,Y,Z)$”；④ 正解法能依据深度判别遮挡，但计算复杂且存在空白像素漏洞。

### 37. 真正射影像（TDOM，True Orthophoto）与有理函数模型（RFM/RPC）纠正
* **标准定义**：① **真正射影像（TDOM）**：利用包含建筑物精细三维几何的 **DSM/DBM** 代替裸地 DEM 进行微分纠正，将倾斜倒伏的建筑物屋顶严格拉回垂直正射位置，并通过 **Z-buffer 深度缓冲遮挡检测**识别背阴盲区，自动调用相邻高重叠度多视影像提取真实地面纹理进行补偿，彻底消除建筑倾倒与双重屋顶重影；② **有理函数模型（RFM）数字纠正**：针对高分辨率线阵推扫卫星影像，利用 **78 个有理多项式系数（RPC，两个 20 项三次多项式之比）**结合像方 6 参数仿射系统误差补偿，直接建立大地坐标 $(B, L, H)$ 与扫描行列号 $(r, c)$ 的映射，配合 DEM 按反解法快速生产卫星 DOM。
* **【4分采分点】**：① TDOM 用高精度 DSM/DBM 改正房屋屋顶倾倒位移；② TDOM 用 Z-buffer 检测遮挡盲区并用多视重叠影像补偿纹理去重影；③ RFM 用两个三次多项式比值（78 个 RPC 系数）屏蔽复杂线阵物理成像几何；④ 辅以少量控制点像方仿射改正即可按反解法高效纠正线阵卫星影像。</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
</body>
</html>
