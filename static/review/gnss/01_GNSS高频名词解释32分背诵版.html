## 零、考前速览：八组极易混淆核心概念一句话秒杀表

| 对比组 | 概念 A | 概念 B / C | 核心采分差异点 |
| :--- | :--- | :--- | :--- |
| **1. 限制政策** | **SA 政策（选择可用性）** | **AS 政策（反电子欺骗）** | **SA** 通过 $\varepsilon$ 星历注入误差与 $\delta$ 星钟高频抖动人为降低普通用户精度（2000.5.2 已取消）；**AS** 将精码 P 码模二加保密 W 码加密为 Y 码（仍在实施，用 **Z 跟踪技术**克服）。 |
| **2. 多址体制** | **码分多址（CDMA）** | **频分多址（FDMA）** | **GPS / BDS / Galileo** 采用同频不同伪随机码区分卫星（CDMA，双差易恢复模糊度整数性）；传统 **GLONASS** 采用不同频点区分卫星（FDMA，存在频间偏差）。 |
| **3. 时间基准** | **UTC（协调世界时）** | **GPST** / **BDT** | 三者秒长均等于原子时秒；**UTC 随地球自转跳秒（阶跃不连续）**；**GPST 与 BDT 连续累计不跳秒**，且恒有 $\mathrm{TAI}-\mathrm{GPST}=19\ \mathrm{s}$、$\mathrm{TAI}-\mathrm{BDT}=33\ \mathrm{s}$、$\mathrm{GPST}-\mathrm{BDT}=14\ \mathrm{s}$。 |
| **4. 地球定向** | **岁差与章动** | **极移（Polar Motion）** | **岁差**（长期进动）与**章动**（主周期 $18.6$ 年短周期摆动）改变自转轴在**天球惯性空间**指向，不改地面经纬度；**极移**是瞬时地极相对**地球本体（CIO）** 移动，直接改变地面点经纬度。 |
| **5. 轨道产品** | **卫星历书（Almanac）** | **广播星历** / **精密星历** | **历书**含全星座简化参数（百米～公里级，辅助快速捕星）；**广播星历**为电文播发的 16 参数实时预报轨道（$\sim 1\ \mathrm{m}$）；**精密星历（SP3）** 为 IGS 事后实测解算轨道（$\sim 2.5\ \mathrm{cm}$，需拉格朗日内插）。 |
| **6. 大气折射** | **电离层折射延迟** | **对流层折射延迟** | **电离层**（$60\sim 1000\ \mathrm{km}$）为**色散介质**，伪距延迟 $+I$、载波超前 $-I$，可用双频无电离层组合消除 $>99\%$；**对流层**（$<50\ \mathrm{km}$）为**非色散介质**，双频无法消除，干延迟模型化、湿延迟参数估计。 |
| **7. 闭合环检核** | **同步观测环** | **异步环（独立环）** | **同步环**由同时段同步基线构成，理论闭合差恒为 $0$，**仅检核软件与数据同步性，不能发现对中或量高粗差**；**异步环**由不同时段独立基线构成，**全面检核外业安置量高与观测真实质量**。 |
| **8. 高程系统** | **大地高 $H$** | **正高 $H_g$** / **正常高 $H_\gamma$** | **大地高 $H$** 沿法线至参考椭球面（纯几何量）；**正高 $H_g$** 沿铅垂线至大地水准面（差大地水准面差距 $N$）；**正常高 $H_\gamma$** 沿铅垂线至似大地水准面（差高程异常 $\zeta$，$H = H_\gamma + \zeta$，我国法定高程）。 |

## 模块一：绪论、GPS 政策与四大 GNSS 系统（对应第 1 章）

### 1. 子午卫星系统（NNSS / Transit）
* **标准定义**：美国海军研制的第一代低轨极轨道卫星导航定位系统（6 颗星，轨道高约 $1075\ \mathrm{km}$），采用**多普勒频移测量原理**（测定卫星信号多普勒计数换算两时刻距离差，构成旋转双曲面交会定位）。因卫星数少、轨道低，存在**观测不连续（平均间隔 $1.5\ \mathrm{h}$）、单次定位耗时长（$8\sim 18\ \mathrm{min}$）、无法满足高动态需求及精度偏低**等局限，后被 GPS 取代。
* **【4分采分点】**：① 第一代低轨卫星导航系统；② 多普勒频移测量（距离差双曲面交会）；③ 不连续、耗时长、非高动态；④ 精度受大气阻力与电离层影响偏低。

### 2. SA 政策（Selective Availability，选择可用性）
* **标准定义**：美国国防部曾为限制非特许民用用户实时定位精度而实施的人为干扰政策（已于 **2000 年 5 月 2 日**正式取消）。包含两项技术：① **$\varepsilon$ 技术**：在广播星历中人为注入轨道误差；② **$\delta$ 技术**：人为使卫星钟频率产生高频随机抖动，将普通单点定位精度劣化至平面 $\pm 100\ \mathrm{m}$、高程 $\pm 156\ \mathrm{m}$（可通过同步差分定位有效削弱）。
* **【4分采分点】**：① 人为降低民用单点定位精度的限制政策；② $\varepsilon$ 技术（广播星历注入误差）；③ $\delta$ 技术（星钟高频抖动）；④ 2000 年 5 月已取消，差分法可削弱。

### 3. AS 政策（Anti-Spoofing，反电子欺骗）与 Z 跟踪技术
* **标准定义**：美国国防部自 1994 年起持续实施至今的军用码加密防欺骗政策。具体做法是在精码 **P 码上模二叠加严格保密的 W 码**生成保密 **Y 码**（$\mathrm{P} \oplus \mathrm{W} = \mathrm{Y}$），阻止非授权用户直接利用 P 码测距和码相关重建 $L_2$ 载波。现代测量型接收机普遍采用 **Z 跟踪技术**（利用 W 码码率比 P 码低约 20 倍的特性分段估计剥离 W 码），恢复双频精密伪距与全波长 $L_2$ 载波相位。
* **【4分采分点】**：① 防电子欺骗加密措施（至今仍在实施）；② P 码模二加保密 W 码生成 Y 码；③ 限制非授权用户直接用 P 码重建 $L_2$ 载波；④ 现代接收机用 Z 跟踪技术恢复全波长 $L_2$ 载波。

### 4. 北斗卫星导航系统（BDS）混合星座与有源/无源定位
* **标准定义**：我国自主建设运行的全球卫星导航系统，遵循“三步走”战略（北斗一号试验、北斗二号亚太区域、北斗三号全球系统），采用 CGCS2000 坐标系与北斗时（BDT）。其空间段独创由 **地球静止轨道（GEO）、倾斜地球同步轨道（IGSO）和中圆地球轨道（MEO）** 组成的**混合星座**（显著增强亚太地区高仰角可见星数），同时兼具**全球连续无源定位**与独有的**有源定位及短报文通信**特色服务。
* **【4分采分点】**：① 遵循“三步走”建成的我国全球导航系统；② GEO + IGSO + MEO 三类轨道混合星座；③ 采用 CGCS2000 坐标系、BDT 时间与 CDMA 体制；④ 融合连续无源定位与特色短报文通信功能。

## 模块二：时间系统与天球/地球坐标系统（对应第 2 章作业核心）

### 5. 世界时（Universal Time，UT）
* **标准定义**：以**地球自转周期**为物理基准建立的时间系统，定义为格林尼治起始子午线处的平太阳时。天文实测直接获得 **UT0**；加入**极移改正**后得到真正反映地球空间自转角度的 **UT1**（天球系与地球系转换的核心参数）；再加入地球自转季节性变化改正后为 **UT2**。因地球自转存在长期减慢与不规则波动，世界时是**不均匀的时间系统**。
* **【4分采分点】**：① 以地球自转为基准（格林尼治平太阳时）；② UT0 加极移改正得 UT1（反映真实地球自转角）；③ UT1 加季节性改正得 UT2；④ 随地球自转不规则变化，属不均匀时间系统。

### 6. 国际原子时（International Atomic Time，TAI）
* **标准定义**：以原子内部能级跃迁辐射电磁波频率为基准建立的**均匀连续时间系统**。其秒长定义为位于海平面上的**铯 133（$\mathrm{Cs}^{133}$）原子基态两个超精细能级在零磁场中跃迁振荡 $9\,192\,631\,770$ 周所持续的时间**；时间起点定于 **1958 年 1 月 1 日 $\mathrm{UT}\ 0^{\mathrm{h}}00^{\mathrm{m}}00^{\mathrm{s}}$**，由国际计量局（BIPM）综合全球原子钟维持，连续累计、不跳秒。
* **【4分采分点】**：① 原子能级跃迁频率基准；② 海平面零磁场 $\mathrm{Cs}^{133}$ 振荡 $9\,192\,631\,770$ 周定义秒长；③ 起点为 1958 年 1 月 1 日 $0^{\mathrm{h}}$；④ 高稳定度、均匀连续、不跳秒。

### 7. 协调世界时（Coordinated Universal Time，UTC）与闰秒
* **标准定义**：兼顾原子时高均匀秒长与世界时贴近地球自转时刻的国际通用标准时间系统。**UTC 秒长严格等于国际原子时 TAI 秒长**；在时刻上通过人为增减整秒的**闰秒（跳秒）机制**，强制保持 UTC 与世界时 UT1 之差满足 **$\lvert \mathrm{UT1} - \mathrm{UTC} \rvert < 0.9\ \mathrm{s}$**。因此 UTC 是**秒长均匀但时刻阶跃不连续**的时间系统，北京时间即为 $\mathrm{UTC} + 8^{\mathrm{h}}$。
* **【4分采分点】**：① 秒长严格等于国际原子时 TAI 秒长；② 引入闰秒（跳秒）机制兼顾地球自转时刻；③ 始终维持 $\lvert \mathrm{UT1} - \mathrm{UTC} \rvert < 0.9\ \mathrm{s}$；④ 秒长均匀但时刻阶跃不连续（北京时间 $=\mathrm{UTC}+8^{\mathrm{h}}$）。

### 8. GPS 时（GPST）与北斗时（BDT）
* **标准定义**：分别由 GPS 和北斗系统的地面监控网与星载原子钟共同维持的专用原子时系统，两者均采用 SI 原子时秒长、**连续累计不跳秒**，电文中以**周数（WN）+ 周内秒（SOW，每周日 $0^{\mathrm{h}}$ 起算）** 表达。**GPST 起点为 1980 年 1 月 6 日 $\mathrm{UTC}\ 0^{\mathrm{h}}$**，恒满足 $\mathrm{TAI} - \mathrm{GPST} = 19\ \mathrm{s}$；**BDT 起点为 2006 年 1 月 1 日 $\mathrm{UTC}\ 0^{\mathrm{h}}$**，恒满足 $\mathrm{TAI} - \mathrm{BDT} = 33\ \mathrm{s}$，故两者恒相差固定整秒常数 **$\mathrm{GPST} - \mathrm{BDT} = 14\ \mathrm{s}$**。
* **【4分采分点】**：① 专用原子时系统，连续累计不跳秒；② GPST 起点 1980.1.6 $0^{\mathrm{h}}$（$\mathrm{TAI}-\mathrm{GPST}=19\ \mathrm{s}$）；③ BDT 起点 2006.1.1 $0^{\mathrm{h}}$（$\mathrm{TAI}-\mathrm{BDT}=33\ \mathrm{s}$）；④ 恒定换算关系 $\mathrm{GPST} - \mathrm{BDT} = 14\ \mathrm{s}$。

### 9. 岁差（Precession）与章动（Nutation）
* **标准定义**：日月及行星对地球赤道隆起部分施加万有引力矩引起地球自转轴在**天球惯性空间**指向变化的两种运动：① **岁差**：引力矩长期分量使北天极绕北黄极作周期约 $25\,800$ 年的长期圆锥进动、春分点沿黄道长期西移（仅顾及岁差得瞬时平天球系）；② **章动**：日月相对地球位置周期变化使瞬时真北天极在平均岁差轨迹上叠加微小周期性摆动（主周期 **$18.6$ 年**、交角振幅 **$9.2''$**，含黄经章动与交角章动，同时顾及岁差和章动得瞬时真天球系）。
* **【4分采分点】**：① 日月行星对地球赤道隆起引力矩所致；② 岁差为自转轴长期圆锥进动与春分点西移；③ 章动为叠加在岁差上的短周期摆动（主周期 $18.6$ 年）；④ 仅改变惯性空间轴向，不改变地面测站经纬度。

### 10. 极移（Polar Motion）
* **标准定义**：由于大气环流、洋流海潮及地球内部地核地幔物质运动，导致**地球瞬时自转轴与地面的交点（瞬时北极）在地球本体内部相对于国际协议原点（CIO / IERS 参考极）发生缓慢漂移**的现象（摆动幅度一般小于 $0.5''$），用极移坐标参数 $(X_p, Y_p)$ 描述。极移直接引起地面测站瞬时天文经纬度和方位角的周期性变化，是瞬时真地球系转至协议地球系的必改参数。
* **【4分采分点】**：① 地球表层与内部物质迁移运动引起；② 瞬时地极相对于地球本体协议极（CIO）的移动；③ 用极移参数 $(X_p, Y_p)$ 定量描述；④ 直接引起地面点瞬时经纬度变化。

### 11. WGS-84 坐标系与 CGCS2000（2000 国家大地坐标系）
* **标准定义**：分别为美国 GPS 广播星历和我国法定（及北斗 BDS）采用的**全球协议地心地固直角坐标系**。两者原点与三轴指向定义完全遵循 ITRS 准则：**原点位于含海洋和大气的地球质量中心**；**$Z$ 轴**指向国际协议原点 CIO（IERS 参考极）；**$X$ 轴**指向 IERS 参考子午面与协议赤道面的交点；**$Y$ 轴**构成**右手直角系**。两者参考椭球长半轴均为 $a = 6\,378\,137\ \mathrm{m}$，仅扁率因 $J_2$ 微差导致极半径相差约 $0.1\ \mathrm{mm}$，同历元厘米级工程应用可直接视为等同。
* **【4分采分点】**：① 均为三维动态全球地心地固右手直角坐标系；② 原点位于含海洋与大气的地球质心；③ $Z$ 轴指向 CIO，$X$ 轴指向格林尼治协议子午面与赤道交点；④ 椭球长半轴相同，极半径仅差 $0.1\ \mathrm{mm}$，同历元工程可等效。

### 12. 参心坐标系与布尔莎（Bursa-Wolf）七参数转换模型
* **标准定义**：以局部地区与大地水准面最佳拟合的参考椭球几何中心为原点（不与地球质心重合，如我国停用的北京 54、西安 80 坐标系）建立的坐标系称为**参心坐标系**。将 GNSS 地心空间直角坐标严密转换至参心系（或不同框架地心系）常用**布尔莎三维相似变换七参数模型**，包含 **3 个坐标轴平移参数** $(T_X, T_Y, T_Z)$、**3 个微小欧拉旋转角** $(\omega_X, \omega_Y, \omega_Z)$ 和 **1 个尺度变化参数** $m$，至少需测区四周均匀分布的 **3 个不共线三维公共控制点**最小二乘求解。
* **【4分采分点】**：① 参心系以局部拟合椭球中心为原点，偏离地心数十至百米；② 布尔莎模型含 3 平移 + 3 旋转 + 1 尺度共 7 个参数；③ 用于不同三维空间直角坐标系间的基准转换；④ 理论上至少需 3 个不共线三维公共点解算。

## 模块三：系统组成、测距信号与卫星星历（对应第 3 章作业核心）

### 13. 载波（Carrier）与伪随机噪声码（PRN / 测距码）
* **标准定义**：**载波**是用于搭载调制测距码和导航电文的高频正弦微波（GNSS 采用 L 波段右旋圆极化波，如 GPS 的 $L_1 = 1575.42\ \mathrm{MHz},\ L_2 = 1227.60\ \mathrm{MHz},\ L_5 = 1176.45\ \mathrm{MHz}$，可直接实现毫米级相位测距与双频消电离层）。**测距码（伪随机噪声码 PRN）** 是调制在载波上测定信号传播时延的二进制序列，它兼具**类白噪声的尖锐自相关峰（精确对齐测时延）与近零互相关旁瓣（实现码分多址 CDMA）**，同时按确定移位寄存器数学法则周期生成、可在接收机内精确复制。
* **【4分采分点】**：① 载波为运载信号并直接用于精密测相的 L 波段正弦波；② 熟记 GPS 三频载波 $L_1, L_2, L_5$；③ PRN 码按确定数学规律生成、可复制但具随机白噪声相关特性；④ 尖锐自相关峰用于伪距测时，正交互相关实现 CDMA 多星识别。

### 14. C/A 码（粗码）与 P(Y) 码（精码）
* **标准定义**：GPS 传统核心测距码：① **C/A 码**仅调制于 $L_1$ 载波，码率 **$1.023\ \mathrm{Mbps}$**、周期 **$1\ \mathrm{ms}$**（码长 $1023\ \mathrm{bit}$）、码元宽度 **$293.05\ \mathrm{m}$**，民用公开，因周期极短易于快速搜索捕获并辅助交接捕获 P 码，测距精度约 $0.3\sim 3\ \mathrm{m}$；② **P 码**同时调制于 $L_1, L_2$ 双频，码率 **$10.23\ \mathrm{Mbps}$**、周期 **$7\ \text{天}$**、码元宽度 **$29.3\ \mathrm{m}$**，测距精度高（约 $0.3\ \mathrm{m}$）且抗干扰强，实施 AS 政策加 W 码后加密为军用 **Y 码**。
* **【4分采分点】**：① C/A 码仅在 $L_1$，码率 $1.023\ \mathrm{Mbps}$、周期 $1\ \mathrm{ms}$、码宽 $293\ \mathrm{m}$；② C/A 码公开易捕获，用于民用单点定位与导引捕获精码；③ P 码在 $L_1, L_2$ 双频，码率 $10.23\ \mathrm{Mbps}$、周期 $7$ 天、码宽 $29.3\ \mathrm{m}$；④ P 码精度高，AS 政策下加密为保密 Y 码。

### 15. 导航电文（Navigation Message）与卫星历书（Almanac）
* **标准定义**：**导航电文**是由卫星以 **$50\ \mathrm{bps}$** 速率调制在载波上向用户播发的数据帧流（GPS 每主帧 $1500\ \mathrm{bit}$ 耗时 $30\ \mathrm{s}$，含 5 个子帧：第 1 子帧为星钟改正与健康状态，第 2、3 子帧为本星广播星历，第 4、5 子帧为历书与电离层参数）。其中**卫星历书**包含空间全部在轨卫星的简化概略轨道根数与状态信息（精度数百米至数公里，有效期数月），用于测前卫星可见性/DOP 预报及**辅助接收机热启动快速捕获卫星**。
* **【4分采分点】**：① 导航电文速率 $50\ \mathrm{bps}$，含星钟、广播星历、历书与电离层参数；② 1 主帧分 5 个子帧（第 1 钟差、2/3 星历、4/5 历书）；③ 历书提供全星座概略轨道参数（精度百米至公里级）；④ 历书用于可见星预报与接收机缩短捕获时间。

### 16. 广播星历（Broadcast Ephemeris）与精密星历（Precise Ephemeris）
* **标准定义**：**广播星历**是由地面主控站根据监测站跟踪数据定轨并**外推预报**，注入卫星后通过导航电文（第 2、3 子帧）实时向用户广播的 **16 参数摄动开普勒轨道根数**（参考时刻 $t_{oe}$ + 6 个开普勒根数 + 9 个摄动项），实时性强，轨道精度约 **$1\ \mathrm{m}$**。**精密星历**是由 **IGS** 等分析中心利用全球数百跟踪站实测数据在事后（或准实时）严密动力学解算并按 **SP3 格式**（$15\ \mathrm{min}$ 间隔三维坐标与钟差表，需高阶拉格朗日多项式内插）网络发布的轨道产品，最终轨道精度达 **$2.5\ \mathrm{cm}$**，用于 PPP 与长基线精密定位。
* **【4分采分点】**：① 广播星历为主控站预报、电文实时播发的 16 参数根数（精度 $\sim 1\ \mathrm{m}$）；② 精密星历为 IGS 全球网实测严密解算、网络发布的 SP3 坐标表（精度 $\sim 2.5\ \mathrm{cm}$）；③ 广播星历按解析十步法算坐标，精密星历用高阶拉格朗日内插；④ 精密星历支撑 PPP 与高精度长基线控制网解算。

### 17. 开普勒轨道六根数（Keplerian Elements）
* **标准定义**：在二体中心引力假设下，唯一确定卫星椭圆轨道空间姿态、几何尺寸及卫星瞬时位置的 6 个独立参数：① **升交点赤经 $\Omega$** 与 ② **轨道倾角 $i$**（共同确定轨道平面在天球空间的方位）；③ **轨道长半轴 $a$** 与 ④ **轨道偏心率 $e$**（共同确定椭圆轨道的大小与形状）；⑤ **近地点角距 $\omega$**（确定椭圆长轴在轨道平面内的朝向）；⑥ **过近地点时刻 $t_0$** 或参考时刻**平近点角 $M_0$**（确定卫星在轨道上的瞬时位置）。
* **【4分采分点】**：① 二体问题下描述椭圆轨道与卫星位置的 6 个独立参数；② $(\Omega, i)$ 定轨道平面空间指向；③ $(a, e)$ 定椭圆大小与扁平形状；④ $\omega$ 定长轴面内定向，$t_0/M_0$ 定卫星瞬时位置。

### 18. 国际 GNSS 服务（IGS，International GNSS Service）
* **标准定义**：由国际大地测量协会（IAG）于 1994 年正式运行的非营利性国际科学协作组织，依托全球 400 余个连续运行跟踪站及各大分析中心，向全球用户**免费公开提供高精度精密卫星星历（$2.5\ \mathrm{cm}$）、精密卫星与测站钟差（$75\ \mathrm{ps}$）、地球自转参数（ERP）、全球跟踪站坐标与速度场、天顶对流层延迟及电离层 VTEC 格网产品**，承担维持精化国际地球参考框架（ITRF）与制定 RINEX/SP3 等国际数据标准的职能。
* **【4分采分点】**：① IAG 领导的国际非营利全球连续跟踪与数据服务组织；② 免费提供精密星历、精密钟差、ERP、大气延迟等精密产品；③ 维持与精化国际地球参考框架（ITRF）；④ 制定推广 RINEX、SP3、ANTEX 等通用数据标准。

## 模块四：GNSS 定位主要误差源（对应第 4 章作业核心）

### 19. 相对论效应（Relativistic Effect）与地球自转改正（Sagnac 效应）
* **标准定义**：① **相对论效应**：卫星高速运动（狭义相对论使钟变慢）与高空弱引力场（广义相对论使钟变快）叠加净效应使星载原子钟相对地面变快，常数频偏由出厂将基准频率 $10.23\ \mathrm{MHz}$ 预调低 $-4.4647 \times 10^{-10}$ 消除，椭圆轨道引起的**周期项偏差**（最大约 $6.9\ \mathrm{m}$）由用户按 $\Delta t_r = -\frac{2\sqrt{a\mu}}{c^2}e\sin E$ 公式改正；② **地球自转（Sagnac）效应**：信号传播 $\tau$（约 $0.07\ \mathrm{s}$）期间地固系绕 $Z$ 轴自转 $\omega_e \tau$ 角（赤道最大影响达 $36\ \mathrm{m}$），计算卫地几何距前必须将发射时刻卫星坐标绕 $Z$ 轴旋转归算至信号接收瞬间的地固系。
* **【4分采分点】**：① 狭义+广义相对论净效应使星钟变快；② 出厂调低星钟频率消常数项，用户公式改椭圆周期项；③ 信号传播期间地球自转引起地固系坐标旋转偏差（最大 $36\ \mathrm{m}$）；④ 须绕 $Z$ 轴旋转 $\omega_e\tau$ 归算卫星坐标。

### 20. 电离层折射延迟（Ionospheric Delay）与无电离层组合
* **标准定义**：高度 $60\sim 1000\ \mathrm{km}$ 高空大气电离产生的自由电子构成的**色散介质**（折射率与信号频率平方成反比），使电磁波传播速度改变而引起的测距误差（天顶白天 $5\sim 15\ \mathrm{m}$，低仰角可达 $50\ \mathrm{m}$ 以上）。其对伪距与载波相位**等大反向**：**测码伪距发生群延迟变长（$+I$），载波相位发生相超前变短（$-I$）**，一阶延迟量 $I = \frac{40.3}{f^2}\mathrm{TEC}$。利用双频观测构造**无电离层线性组合（LC/IF）** 可消除 $>99\%$ 的一阶电离层延迟（代价是噪声放大约 $3$ 倍且组合模糊度失去整数性）。
* **【4分采分点】**：① $60\sim 1000\ \mathrm{km}$ 色散介质，延迟与总电子含量 $\mathrm{TEC}$ 成正比、与 $f^2$ 成反比；② 伪距群延迟测距变长 $+I$，载波相超前测距变短 $-I$；③ 单频用 Klobuchar 模型改正 $60\%\sim 70\%$；④ 双频用无电离层线性组合消除 $>99\%$ 一阶项。

### 21. 对流层折射延迟（Tropospheric Delay）
* **标准定义**：高度 $50\ \mathrm{km}$ 以下中性大气层对 GNSS 信号产生的折射延迟（天顶约 $2.3\ \mathrm{m}$，$5^\circ$ 低仰角超 $20\ \mathrm{m}$）。对微波频段而言对流层属于**非色散介质**（折射率与信号频率无关），故测码伪距与载波相位受到完全相等的正延迟，**无法通过双频线性组合消除**！通常将其分为占 $90\%$ 且稳定易用气象模型（Saastamoinen/Hopfield 模型）精确改正的**干延迟（静力学延迟）**，以及占 $10\%$ 但水汽时空剧变需在精密平差中设**天顶湿延迟参数（ZWD）** 加以估计的**湿延迟**。
* **【4分采分点】**：① $50\ \mathrm{km}$ 以下中性大气非色散介质，码与相位同向延迟；② 无法利用双频观测值组合消除；③ 干延迟占 $90\%$ 用经验模型精确改正；④ 湿延迟占 $10\%$ 极不稳定，精密定位采用映射函数+天顶参数估计。

### 22. 多路径效应（Multipath Effect）
* **标准定义**：卫星直射信号与经测站周围水面、玻璃幕墙、金属面或地面反射后进入天线的**一束或多束反射波发生干涉叠加**，导致接收机锁定相位偏移而产生的测距误差（伪距可达米级至十米级，**载波相位理论最大值为 $\frac{1}{4}\lambda$**，对 $L_1$ 约为 **$4.8\ \mathrm{cm}$**）。因严格取决于测站局部反射环境，**毫无空间相关性，站间差分无法消除**！主要靠选点避开强反射物、设置截止高度角、采用右旋圆极化扼流圈（抑径板）天线及窄相关技术削弱。
* **【4分采分点】**：① 直射波与周围反射物反射波干涉叠加所致；② 伪距误差米级，载波相位最大误差为 $\frac{1}{4}\lambda$（$L_1$ 为 $4.8\ \mathrm{cm}$）；③ 局部环境强相关，单差/双差完全无法消除；④ 靠选点回避、抑径板右旋极化天线与截止高度角抑制。

### 23. 天线相位中心偏差（PCO）与变化（PCV）
* **标准定义**：GNSS 测量实际测定的几何中心是接收/发射天线的**瞬时电气相位中心**，而非物理几何中心或天线参考点（ARP）。**平均相位中心与天线参考点 ARP 之间的固定三维偏移向量称为相位中心偏差（PCO，接收机垂向常达 $5\sim 15\ \mathrm{cm}$，星端可达 $0.7\sim 2.6\ \mathrm{m}$）**；瞬时相位中心随卫星信号入射**高度角和方位角**变化的微小量称为**相位中心变化（PCV）**。短基线采用同型号天线统一指北安置可抵消机端 PCO/PCV，混用天线、长基线或 PPP 必须引入 IGS ANTEX 绝对模型改正。
* **【4分采分点】**：① 电气测量中心（瞬时相位中心）与物理参考点（ARP）不一致；② 平均相位中心相对 ARP 的固定偏移为 PCO；③ 随卫星高度角与方位角的变化量为 PCV；④ 短基线同型号天线指北可抵消，长基线与 PPP 须用 ANTEX 模型改正。

## 模块五：测距原理、差分模型、周跳模糊度与定位模式（对应作业 5.1～5.4 核心）

### 24. 测码伪距测量（Pseudorange）与载波相位测量（Carrier Phase）
* **标准定义**：GNSS 测定卫地距的两种基本方式：① **测码伪距**：接收机移动内部复制码与接收卫星测距码做自相关对齐（$R=\max$）测定传播时延乘以光速得 $\tilde{\rho} = c(t_R - t^S)$（因含星钟差、机钟差和大气延迟不等于真实几何距故称伪距），**无模糊度问题、单历元瞬时定全距，但精度仅分米至米级**；② **载波相位测量**：剥离调制码重建载波后与本振混频，由鉴相器测不足一周小数相位、计数器累计整周变化，加上初始未知**整周模糊度 $N$** 测距，**精度高达毫米级（$0.1\%\sim 1\%\lambda$），但存在模糊度解算与失锁周跳问题**。
* **【4分采分点】**：① 伪距靠复制码自相关对齐测时延，含钟差与大气延迟故称伪距；② 伪距无整周模糊度但精度较低（米级）；③ 载波相位靠鉴相器测小数周+计数器累整周，精度达毫米级；④ 载波相位存在初始整周模糊度求解与周跳难题。

### 25. 差分观测值及单差（SD）、双差（DD）、三差（TD）
* **标准定义**：将同类型非差观测值在**接收机间、卫星间、历元间**相减以抵消时空强相关误差的线性组合观测值：① **单差（站间一次差）**：**完全消除卫星钟差**与星端硬件延迟，大幅削弱星历和大气误差，噪声放大 $\sqrt{2}$ 倍；② **双差（站星二次差）**：进一步**完全消除接收机钟差与机端硬件延迟，严格恢复双差整周模糊度 $\Delta N_{ij}^{pq}$ 的整数特性**，是精密相对定位核心观测值（噪声放大 $2$ 倍，同历元相关系数 $0.5$）；③ **三差（站星历元三次差）**：在无周跳时**彻底消去整周模糊度参数**，用于探测修复周跳与求初始近似基线解（噪声放大 $\sqrt{8}$ 倍）。
* **【4分采分点】**：① 站间、星间、历元间三种求差抵消公共系统误差；② 单差彻底消卫星钟差，削弱轨道与大气延迟；③ 双差彻底消接收机钟差并恢复模糊度整数特性（噪声 $2$ 倍）；④ 三差消去整周模糊度，专用于探测周跳和求初始坐标。

### 26. 整周模糊度（Integer Ambiguity，$N$）、浮点解与固定解
* **标准定义**：接收机首次锁定卫星载波信号瞬间 $t_0$，鉴相器仅能测出不足一整周的小数相位，无法直接读出此刻卫地距所包含的**未知整周波长数 $N$**，称为**整周模糊度**。平差时先放弃整数约束将双差模糊度作普通实数与坐标联解得到分米级的**浮点解（实数解）**；再经 **LAMBDA 整数降相关搜索**与 **Ratio 显著性检验**（次优与最优方差比 $\ge 2.0\sim 3.0$）锁定正确整数值，作为已知整数常数回代方程解得厘米/毫米级的**固定解（整数解）**。
* **【4分采分点】**：① 初始锁定历元卫地间未知的载波整周波长数 $N$；② 视作连续实数平差所得分米级解为浮点解；③ 经 LAMBDA 降相关整数搜索并过 Ratio 检验锁定真整数；④ 回代整数常数求得厘米/毫米级解为固定解。

### 27. 周跳（整周跳变，Cycle Slip）
* **标准定义**：在载波相位连续跟踪过程中，因遮挡、强电磁干扰、电离层闪烁或高动态机动导致锁相环暂时失锁，多普勒整周计数器中断正常累积，重捕信号后使后续历元的**整周计数出现固定整数周 $\delta N$ 的阶跃偏差，而不足一整周的小数相位部分依然正确**的现象。周跳具有**整周性、向后历元持续继承累积性和严重粗差破坏性**，必须在平差前利用高次差、三差或双频 **M-W + GF 组合**精确探测并修复。
* **【4分采分点】**：① 信号暂时失锁导致整周计数丢失或跳变整数周；② 小数相位部分仍保持正确；③ 具整周性、阶跃继承性与严重粗差破坏性；④ 常用三差法或双频 M-W + GF 组合探测修复。

### 28. 精度衰减因子（DOP，Dilution of Precision）
* **标准定义**：在伪距单点定位中衡量**所观测卫星空间几何分布构型优劣对定位误差放大倍数**的无量纲纯几何指标（定位中误差 $m = m_0 \cdot \mathrm{DOP}$，由设计矩阵协因数阵 $\boldsymbol{Q} = (\boldsymbol{B}^{\mathrm{T}}\boldsymbol{B})^{-1}$ 主对角元平方和开方定义）。包含几何 **GDOP**、三维位置 **PDOP**、平面 **HDOP**、高程 **VDOP** 和时间 **TDOP**，满足恒等式 $\mathrm{GDOP}^2 = \mathrm{PDOP}^2 + \mathrm{TDOP}^2 = \mathrm{HDOP}^2 + \mathrm{VDOP}^2 + \mathrm{TDOP}^2$。卫星分布越开阔均匀（测站与四星单位矢量围成的**四面体体积越大**），DOP 值越小，定位精度越高。
* **【4分采分点】**：① 表征卫星空间几何分布对测距误差放大效应的无量纲因子（$m = m_0\cdot\mathrm{DOP}$）；② 包含 GDOP、PDOP、HDOP、VDOP、TDOP 五类；③ 满足 $\mathrm{GDOP}^2 = \mathrm{HDOP}^2 + \mathrm{VDOP}^2 + \mathrm{TDOP}^2$；④ 与测站—卫星单位矢量四面体体积成反比（受地表遮挡恒有 $\mathrm{VDOP} > \mathrm{HDOP}$）。

### 29. 精密单点定位（PPP，Precise Point Positioning）
* **标准定义**：仅使用**单台双频（或多频）GNSS 接收机**采集的非差载波相位与伪距观测值，引入 **IGS 精密卫星星历（厘米级）和精密卫星钟差（亚纳秒级）**，利用双频无电离层组合消除一阶电离层延迟，将天顶对流层湿延迟、接收机钟差与非差实数模糊度作为待估参数平差滤波，并对固体潮、海潮、PCO/PCV、天线相位缠绕、相对论等作严密模型改正，在全球任意地点无需基准站即可实现 **ITRF 框架下厘米级定位**的技术（常规需 $20\sim 30\ \mathrm{min}$ 收敛）。
* **【4分采分点】**：① 单台双频接收机非差伪距与载波相位定位（无需架设基准站）；② 采用 IGS 精密星历与精密钟差固定卫星轨道钟差；③ 无电离层组合消电离层 + 估计对流层湿延迟与实数模糊度 + 潮汐缠绕严密改正；④ 全球均匀厘米级精度，但常规初始化收敛较慢。

### 30. 实时动态定位（RTK）与网络 RTK（CORS / VRS）
* **标准定义**：**RTK** 是基准站通过无线数据链将观测数据实时发往流动站，流动站实时组建**载波相位双差方程**并利用 **OTF（在航模糊度解算）** 秒级固定整周模糊度、实时输出厘米级三维坐标的技术（单基站距离受限于 $10\sim 15\ \mathrm{km}$）。**网络 RTK（CORS）** 则在区域内按 $50\sim 100\ \mathrm{km}$ 布设多座永久连续运行参考站，控制中心统一固定基站网模糊度并建立**区域电离层、对流层和星历误差空间内插模型**，通过 **VRS（虚拟参考站）/ MAC / FKP** 与 4G/5G 网络向单机流动站播发定制虚拟差分数据，实现广域免架基站、全网均匀厘米级实时定位。
* **【4分采分点】**：① RTK 基于实时载波相位双差与 OTF 秒级模糊度固定达厘米级精度；② 传统单站 RTK 受大气去相关与电台限制仅 $10\sim 15\ \mathrm{km}$；③ 网络 RTK（CORS）多基站建模内插区域大气与轨道误差（站距 $50\sim 100\ \mathrm{km}$）；④ 用户单机借助 VRS 等协议免建基站获广域均匀厘米级精度。

### 31. 位置差分与伪距差分（距离差分，DGPS）
* **标准定义**：广义差分定位中两类伪距级实时修正方式：① **位置差分**：基准站直接计算自身单点定位坐标与已知真值之差 $(\Delta X, \Delta Y, \Delta Z)$ 发给流动站修正坐标，**缺点是要求基站与流动站必须同步观测完全相同的一组卫星**；② **伪距差分（距离差分）**：基准站反算至全部可见星的真实几何距与实测伪距之差，播发每颗星的**伪距改正数 $\mathrm{PRC}_i$ 及其变化率 $\mathrm{RRC}_i$**，流动站按自身可见的任意 $\ge 4$ 颗星修正伪距后独立交会定位，**无需观测相同星座、适用性广、精度达亚米至米级**。
* **【4分采分点】**：① 基准站测定强空间相关公共误差实时修正流动站；② 位置差分播发三维坐标改正数，强制要求两站观测完全相同卫星星座；③ 距离差分播发各星伪距改正数 PRC 与变化率 RRC；④ 距离差分不要求相同星座，灵活性与精度显著优于位置差分。

## 模块六：控制网设计、外业实验、网平差与 GPS 高程（对应作业 6～9 与实验）

### 32. 观测时段（Session）、独立基线、必要基线与多余基线
* **标准定义**：测站一次连续开机至停机观测的时间段称为**观测时段**。若全网共 $n$ 个点、用 $N$ 台接收机同步施测 $S$ 个时段：每时段同步产生 $\frac{N(N-1)}{2}$ 条基线，其中线性无关、不构成同步闭合回路的**独立基线**仅有 **$N - 1$ 条**（全网独立基线数 $B_I = S(N-1)$）；唯一确定全网 $n$ 个点相对位置最少需要的**必要基线数**为 **$B_N = n - 1$**；用于构成异步闭合环平差检核的**多余基线数**为 **$B_R = B_I - B_N$**。
* **【4分采分点】**：① 观测时段为开机至停机连续同步观测单元；② 每时段 $N$ 台接收机仅含 $N-1$ 条独立基线，全网 $B_I = S(N-1)$；③ 必要基线数 $B_N = n - 1$；④ 多余基线数 $B_R = B_I - B_N$（不可用总基线数减！）。

### 33. 同步观测环与异步观测环（独立环）
* **标准定义**：静态基线质量检核的两类闭合图形：① **同步环**：由同一观测时段 $\ge 3$ 台接收机的同步基线构成的闭合环，因观测数据同源，其理论闭合差**恒等于零**，**只能检核基线解算软件质量与数据同步性，绝对不能发现对中整平或量错天线高等外业粗差**；② **异步环（独立环）**：完全由**不同观测时段的独立基线**首尾相连构成的闭合环，能**全面暴露外业对中、天线高量取、多路径、大气残差及周跳修复失败等真实误差**，是控制网外业质量最核心的检核依据。
* **【4分采分点】**：① 同步环由同时段同步基线组成，理论闭合差恒为 $0$；② 同步环仅检核软件和数据同步性，无法发现对中与量错天线高；③ 异步环由不同时段独立基线组成；④ 异步环全面检核外业安置量高与真实观测质量。

### 34. 卫星截止高度角（Cut-off Elevation Angle）与零基线检验
* **标准定义**：① **卫星截止高度角**：为屏蔽低仰角斜穿长大气路径带来的严重电离层/对流层残余误差、地面强多路径效应及低信噪比周跳，接收机人为设定的最低跟踪仰角门限（静态与 RTK 常设 **$10^\circ \sim 15^\circ$**；设过低引入多路径大气粗差，设过高则可见星减少导致 $\mathrm{VDOP/PDOP}$ 恶化）；② **零基线检验**：将**同一台天线**接收信号经**功分器**分送两台接收机同步观测（理论基线长为 $0$），彻底消除星历、大气、多路径、天线 PCO 及安置误差，专门检验**接收机内部通道噪声与后处理软件质量**。
* **【4分采分点】**：① 截止高度角（常取 $10^\circ\sim 15^\circ$）滤除低仰角严重大气残差与多路径噪声；② 截止角过高会减少可见星、恶化垂直几何因子 VDOP；③ 零基线用 1 个天线加功分器接 2 台接收机，理论基线长为 $0$；④ 零基线彻底排除外部与天线误差，专检接收机内部噪声与软件精度。

### 35. 三维无约束平差与约束平差
* **标准定义**：GNSS 控制网平差的两个递进阶段：① **三维无约束平差（自由网最小约束平差）**：仅输入独立基线向量及协方差阵，在星历地心系中仅固定 1 个点的坐标提供位置基准而不引入任何改变网尺度与定向的外部起算约束，专门用于**评定 GNSS 基线网自身内符合精度并探测剔除基线粗差**；② **约束平差（三维/二维）**：引入国家或地方坐标系多个已知控制点坐标（边长、方位角）作强制或带权约束平差，用于**将网纳入目标实用坐标系、检核外部已知起算点兼容性（粗差）并评定外符合精度**。
* **【4分采分点】**：① 无约束平差仅固定 1 点位置基准，不引入外部尺度方位约束；② 无约束平差专检 GNSS 网自身内符合精度与基线粗差；③ 约束平差引入多个外部高等级已知起算点；④ 约束平差实现目标坐标系转换并检核起算点兼容性与外符合精度。

### 36. 大地高（$H$）、正常高（$H_\gamma$）、高程异常（$\zeta$）与 GPS 水准
* **标准定义**：**大地高 $H$** 是地面点沿参考椭球法线到**参考椭球面**的纯几何距离（GNSS 直接测定值）；**正常高 $H_\gamma$** 是采用正常重力平均值计算的地面点沿铅垂线到**似大地水准面**的距离（我国 1985 国家高程基准法定高程）；似大地水准面高出参考椭球面的距离称为**高程异常 $\zeta$**，三者满足核心关系 **$H = H_\gamma + \zeta$**（正高 $H_g$ 则相对大地水准面，满足 $H = H_g + N$）。利用测区均匀分布的公共水准联测点求 $\zeta_i = H_i - H_{\gamma,i}$，通过平面或二次曲面多项式拟合内插待定点 $\hat{\zeta}_P$ 进而求正常高 $\hat{H}_{\gamma,P} = H_P - \hat{\zeta}_P$ 的方法称为 **GPS 水准**。
* **【4分采分点】**：① 大地高 $H$ 沿法线至参考椭球面，正常高 $H_\gamma$ 沿铅垂线至似大地水准面（我国法定）；② 写出核心公式 $H = H_\gamma + \zeta$（及正高 $H = H_g + N$）；③ 高程异常 $\zeta = H - H_\gamma$ 为似大地水准面至椭球面间距；④ GPS 水准利用公共点拟合 $\zeta$ 曲面将大地高转化为实用正常高。</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
