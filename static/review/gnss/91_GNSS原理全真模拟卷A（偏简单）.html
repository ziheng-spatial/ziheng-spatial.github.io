**适用课程与考纲**：山东理工大学（SDUT）《GNSS 原理与应用》期末全真模拟（偏基础难度 · 对齐 `32 + 36 + 32 = 100 分` 试卷结构）

**背诵自测说明**：点击页面顶部「**背诵自测模式**」开关，所有答案区将自动模糊遮盖，作答后点击单题即可揭晓核对。

| :---: | :--- | :---: | :--- |
| **一** | 名词解释 | 8 题 × 4 分 = 32 分 | 限制政策、时间基准、坐标定向、误差源、差分与检核环 |

| **三** | 综合计算与应用题 | 2 题 × 16 分 = 32 分 | **控制网时段/基线/限差计算** + **静态网内外业方案与排查** |

## 一、名词解释（共 8 小题，每小题 4 分，共 32 分）

### 1. SA 政策（选择可用性）（4 分）

> **【参考答案与分步采分点】**：
> 1. **本质定义**（1 分）：美国国防部曾为限制非特许民用用户实时定位精度而实施的人为干扰政策（已于 2000 年 5 月 2 日取消）；
> 2. **$\varepsilon$ 技术**（1 分）：在广播星历中人为注入卫星轨道误差；
> 3. **$\delta$ 技术**（1 分）：人为使卫星钟频率产生高频随机抖动；
> 4. **影响与对策**（1 分）：将民用单点定位精度劣化至平面 $\pm 100\ \mathrm{m}$、高程 $\pm 156\ \mathrm{m}$，可通过同步差分定位有效削弱。

### 2. 国际原子时（TAI）（4 分）

> **【参考答案与分步采分点】**：
> 1. **物理基准**（1 分）：以原子内部能级跃迁辐射电磁波频率为基准建立的高精度均匀连续时间系统；
> 2. **秒长定义**（1 分）：位于海平面上的铯 133（$\mathrm{Cs}^{133}$）原子基态两超精细能级在零磁场中跃迁振荡 $9\,192\,631\,770$ 周所持续的时间；
> 3. **时间起点**（1 分）：定于 1958 年 1 月 1 日 $\mathrm{UT}\ 0^{\mathrm{h}}00^{\mathrm{m}}00^{\mathrm{s}}$；
> 4. **连续性特征**（1 分）：由 BIPM 综合全球原子钟维持，连续累计、不跳秒。

### 3. 极移（Polar Motion）（4 分）

> **【参考答案与分步采分点】**：
> 1. **成因**（1 分）：由大气环流、洋流海潮及地球内部核幔物质迁移运动引起；
> 2. **定义**（1 分）：地球瞬时自转轴与地面的交点（瞬时北极）在地球本体内部相对于国际协议原点（CIO / IERS 参考极）的缓慢漂移；
> 3. **描述参数**（1 分）：用极移坐标 $(X_p, Y_p)$ 定量描述；
> 4. **测绘影响**（1 分）：直接引起地面测站瞬时天文经纬度与方位角的周期性变化，是瞬时真地球系转协议地球系的必改参数。

### 4. 开普勒轨道六根数（4 分）

> **【参考答案与分步采分点】**：
> 1. **物理前提**（1 分）：在二体中心引力假设下，唯一确定卫星椭圆轨道空间姿态、大小及瞬时位置的 6 个独立参数；
> 2. **定轨道面方位**（1 分）：升交点赤经 $\Omega$ 与轨道倾角 $i$；
> 3. **定椭圆大小形状**（1 分）：轨道长半轴 $a$ 与轨道偏心率 $e$；
> 4. **定面内朝向与星位**（1 分）：近地点角距 $\omega$（定椭圆长轴方向）和过近地点时刻 $t_0$（或参考时刻平近点角 $M_0$，定卫星瞬时位置）。

### 5. 电离层折射延迟与无电离层组合（4 分）

> **【参考答案与分步采分点】**：
> 1. **介质特征**（1 分）：$60\sim 1000\ \mathrm{km}$ 高空自由电子构成的**色散介质**，延迟量与总电子含量 $\mathrm{TEC}$ 成正比、与信号频率平方 $f^2$ 成反比；
> 2. **码相反向效应**（1 分）：对测码伪距产生群延迟使测距变长（$+I$），对载波相位产生相超前使测距变短（$-I$）；
> 3. **单频改正**（1 分）：单频接收机采用导航电文 Klobuchar 模型改正约 $60\%\sim 70\%$；
> 4. **双频无电离层组合**（1 分）：利用双频观测值线性组合可消除 $>99\%$ 的一阶电离层延迟（代价是噪声放大约 3 倍）。

### 6. 多路径效应（4 分）

> **【参考答案与分步采分点】**：
> 1. **物理成因**（1 分）：卫星直射信号与经测站周围水面、玻璃幕墙、金属面或地面反射后进入天线的反射波发生干涉叠加，使跟踪相位发生偏移；
> 2. **误差量级**（1 分）：伪距误差可达米级至十米级，载波相位理论最大误差为 $\frac{1}{4}\lambda$（$L_1$ 约为 $4.8\ \mathrm{cm}$）；
> 3. **差分特性**（1 分）：完全取决于局部反射环境，无空间相关性，**站间单差与双差均无法消除**；
> 4. **抑制措施**（1 分）：靠选点避开强反射源、设 $10^\circ\sim 15^\circ$ 截止高度角、用右旋圆极化扼流圈（抑径板）天线及窄相关技术削弱。

### 7. 单差（SD）、双差（DD）与三差（TD）观测值（4 分）

> **【参考答案与分步采分点】**：
> 1. **总体构造**（1 分）：将同类型非差观测值在接收机间、卫星间、历元间求差以抵消强相关系统误差；
> 2. **单差（站间一次差）**（1 分）：**完全消除卫星钟差**与星端硬件延迟，大幅削弱轨道和大气误差（噪声放大 $\sqrt{2}$ 倍）；
> 3. **双差（站星二次差）**（1 分）：进一步**完全消除接收机钟差**与机端延迟，**恢复模糊度整数特性**（噪声放大 2 倍），是精密相对定位核心观测值；
> 4. **三差（历元三次差）**（1 分）：无周跳时**彻底消去整周模糊度参数**，专用于探测周跳和求初始坐标（噪声放大 $\sqrt{8}$ 倍）。

### 8. 同步观测环与异步观测环（独立环）（4 分）

> **【参考答案与分步采分点】**：
> 1. **同步环构成**（1 分）：由同一观测时段 $\ge 3$ 台接收机同步观测产生的基线构成的闭合环；
> 2. **同步环检核局限**（1 分）：因数据同源，理论闭合差恒为 $0$，**仅检核内业软件与数据同步性，不能发现对中或量高粗差**；
> 3. **异步环构成**（1 分）：完全由**不同观测时段**的独立基线首尾相连构成的闭合环；
> 4. **异步环作用**（1 分）：能全面暴露外业对中、量错天线高、多路径与周跳等真实误差，是外业控制网质量核心检核依据。

## 二、简答题（共 3 小题，每小题 12 分，共 36 分）

### 9. GNSS 由哪三大部分组成？详述地面监控部分的站点构成与功能，并说明用户接收机主要硬件模块的信号处理流程。（12 分）

> **【参考答案与分步采分点】**：
> 1. **GNSS 三大总体组成部分**（2 分）：由**空间星座部分**（持续播发导航信号的工作星与备用星）、**地面监控部分**（跟踪监测、定轨算钟与运行控制）和**用户设备部分**（接收机硬件及解算软件）协同构成。
> 2. **地面监控之监测站（Monitor Stations）**（2 分）：全球均匀分布的无人值守站，连续跟踪视场内全部可见星，采集双频伪距与载波相位观测值及测站气象（气压、温湿度）数据，初步编辑后实时传回主控站。
> 3. **地面监控之主控站（Master Control Station）**（2 分）：监控网的管理与计算中枢，汇总监测站数据**解算并外推预报广播星历、卫星钟差及电离层模型参数**，编排生成导航电文送注入站，并监控卫星健康状态发出轨道机动或启用备用星指令。
> 4. **地面监控之注入站（Upload Stations）**（2 分）：暂存主控站发来的导航电文与控制指令，在卫星过顶可视弧段内通过 S 波段上行天线将电文与指令定时注入卫星存储器。
> 5. **用户接收机前端——天线与射频前端（RF）**（2 分）：**天线单元**采用右旋圆极化（RHCP）天线捕获微弱信号并抑制一次反射多路径，经低噪声放大器（LNA）放大；**射频前端**将信号与本振混频下变频为中频（IF）并经 A/D 模数转换输出数字中频信号。
> 6. **用户接收机后端——基带处理通道与微处理器**（2 分）：**基带模块**完成二维搜索捕星后，由延迟锁定环（DLL）对齐复制码测伪距、锁相环（PLL）重建载波测相位小数周并累加整周，同步解调 $50\ \mathrm{bps}$ 导航电文；**微处理器与存储单元**执行单点/RTK 解算并记录 RINEX 数据与显示 PDOP、信噪比。

### 10. GNSS 定位中有哪些主要误差源？请按来源分类列出，并系统阐述消除或削弱这些误差的四大基本方法。（12 分）

> **【参考答案与分步采分点】**：
> 1. **第一类：与卫星有关的误差**（2 分）：① 卫星星历（轨道）误差；② 卫星钟误差；③ 相对论效应；④ 卫星内部硬件群延迟（$T_{GD}$）；⑤ 卫星天线相位中心偏差（PCO）与变化（PCV）。
> 2. **第二类：与信号传播路径有关的误差**（2 分）：① 电离层折射延迟；② 对流层折射延迟；③ 多路径效应；④ 信号传播期间地球自转（Sagnac）效应与天线相位缠绕。
> 3. **第三类：与接收机设备及安置有关的误差**（2 分）：① 接收机钟误差；② 接收机天线 PCO/PCV 及外业对中、整平、量高误差；③ 接收机内部通道延迟；④ 起算控制点误差；⑤ 测量热噪声与失锁周跳。
> 4. **对策一：模型改正法**（2 分）：利用广播钟差多项式、相对论周期项、地球自转旋转公式改正；单频电离层用 Klobuchar 模型，**双频用无电离层组合消 $>99\%$ 一阶电离层**；对流层干延迟用 Saastamoinen/Hopfield 模型；长基线引入 IGS 精密星历、钟差与 ANTEX 天线模型。
> 5. **对策二：同步求差法与参数估计法**（2 分）：**站间单差**消星钟，**站星双差**消机钟并恢复模糊度整数性，**历元三差**消模糊度探周跳；平差中将**接收机钟差、天顶对流层湿延迟（ZWD）与模糊度**设未知参数同步估计。
> 6. **对策三：外业选点与软硬件抗差措施**（2 分）：针对差分无法消除的多路径与安置粗差，选点避开水面幕墙并远离高压线/发射塔；设 **$10^\circ\sim 15^\circ$ 截止高度角**；用右旋圆极化抑径板天线并统一指北；三方向测前测后量取天线高并用窄相关与延长观测抑制噪声。

### 11. 在 GNSS 测量中，测定卫地距有哪两种基本方式？详述各自测距原理，并从精度、模糊度、周跳与应用场景全面对比。（12 分）

> **【参考答案与分步采分点】**：
> 1. **两种基本测距方式概述**（2 分）：GNSS 通过时间或相位延迟交会定位，测定卫星至接收机距离有**测码伪距测量（码相位测量）** 和**载波相位测量**两种基本方式。
> 2. **测码伪距测量原理**（2 分）：接收机机内产生与卫星结构相同的**复制码**，通过延迟锁定环（DLL）移动时延进行**自相关运算**，当相关系数最大时两码对齐，测定表面传播时延 $\tilde{t} = t_R - t^S$ 并乘光速得 $\tilde{\rho} = c(t_R - t^S)$。
> 3. **“伪距”成因及优缺点**（2 分）：因包含星钟差、机钟差和大气延迟，不等于真实几何距故称伪距。**优点**：无整周模糊度困扰，单历元瞬时定全距；**缺点**：码元较宽（C/A 码 $293\ \mathrm{m}$、P 码 $29.3\ \mathrm{m}$），精度仅**分米至米级（$0.3\sim 3\ \mathrm{m}$）** 且多路径误差大。
> 4. **载波相位测量原理**（2 分）：剥离调制码重建 L 波段正弦载波与本振混频，首锁瞬间由**鉴相器**测出不足一周的小数相位 $\operatorname{Fr}(\varphi)$，连续跟踪期间由**整周计数器**累计整周变化 $\operatorname{int}(\varphi)$，加上初始未知**整周模糊度 $N$** 构成观测值 $\tilde{\Phi}\lambda = [\operatorname{int}(\varphi)+\operatorname{Fr}(\varphi)+N]\lambda$。
> 5. **载波相位优缺点**（2 分）：因波长极短（$\sim 19\sim 25\ \mathrm{cm}$），**测距精度高达毫米级（$0.2\sim 3\ \mathrm{mm}$）**，多路径误差远小于伪距（最大 $\frac{1}{4}\lambda$）；**难点**是存在初始未知整周模糊度 $N$，且要求连续跟踪、遮挡失锁易发生**周跳**。
> 6. **核心对比总结**（2 分）：伪距为分米至米级、无模糊度不怕短暂失锁、电离层产生群延迟 $+I$，主要用于**单点定位 SPP 与伪距差分 DGPS**；载波相位为毫米级（高 3 个数量级）、有模糊度怕周跳、电离层产生相超前 $-I$，是**静态控制网、RTK 与 PPP 厘米/毫米级定位**的核心。

## 三、综合计算与应用题（共 2 小题，每小题 16 分，共 32 分）

### 12. 【基础必考 · GNSS 控制网时段数、四类基线数与五大质量限差计算】（16 分）

某 D 级 GNSS 控制网由 $n = 60$ 个控制点组成，投入 $N = 4$ 台标称精度为 $\pm(6\ \mathrm{mm} + 1\times 10^{-6}\cdot d)$ 的双频接收机进行同步静态观测，设计每点平均设站次数 $m = 3$ 次，全网平均边长 $d = 8\ \mathrm{km}$。

（1）计算该控制网的理论最少观测时段数 $S_{\min}$、全网基线总数 $B_A$、独立基线数 $B_I$、必要基线数 $B_N$、多余基线数 $B_R$ 及平均可靠性指标 $\eta$（实际按 $S = S_{\min}$ 施测）；（9 分）<br>
（2）计算该网基线向量弦长中误差 $\sigma$，以及三边同步环分量与全长闭合差限差、四边异步（独立）环分量与全长闭合差限差、复测基线长度较差限差（结果保留两位小数）。（7 分）

> **【参考答案与分步采分点】**：
>
> **（1）计算观测时段数与四类基线指标（9 分）**：
> - 理论最少观测时段数（2 分）：
>
> $$S_{\min} = \left\lceil \frac{n \cdot m}{N} \right\rceil = \left\lceil \frac{60 \times 3}{4} \right\rceil = \mathbf{45\ (\text{个时段})}$$
>
> - 全网基线总数（2 分）：$B_A = S \cdot \dfrac{N(N-1)}{2} = 45 \times \dfrac{4\times 3}{2} = \mathbf{270\ (\text{条})}$；
> - 全网独立基线数（2 分）：$B_I = S \cdot (N - 1) = 45 \times (4 - 1) = \mathbf{135\ (\text{条})}$；
> - 必要基线数（1 分）：$B_N = n - 1 = 60 - 1 = \mathbf{59\ (\text{条})}$；
> - 多余基线数与平均可靠性指标（2 分，注意不可用总基线数 $B_A$ 减 $B_N$）：
>
> $$B_R = B_I - B_N = 135 - 59 = \mathbf{76\ (\text{条})}, \qquad \eta = \frac{B_R}{B_I} = \frac{76}{135} \approx \mathbf{56.30\%}$$
>
> **（2）计算弦长中误差与质量检核限差（7 分）**：
> - 基线向量弦长中误差（2 分，$a = 6\ \mathrm{mm},\ b = 1\ \mathrm{ppm},\ d = 8\ \mathrm{km}$）：
>
> $$\sigma = \sqrt{a^2 + (b \cdot d)^2} = \sqrt{6^2 + (1 \times 8)^2} = \sqrt{36 + 64} = \mathbf{10.00\ \mathrm{mm}}$$
>
> - 三边同步环闭合差限差（2 分）：
>   - 坐标分量限差：$\lvert W_{X,Y,Z} \rvert \le \dfrac{\sqrt{3}}{5}\sigma = \dfrac{1.7321}{5}\times 10.00 \approx \mathbf{3.46\ \mathrm{mm}}$；
>   - 环全长限差：$W_S \le \dfrac{3}{5}\sigma = 0.6\times 10.00 = \mathbf{6.00\ \mathrm{mm}}$。
> - 四边异步（独立）环闭合差限差（$n_{\text{边}} = 4$，2 分）：
>   - 坐标分量限差：$\lvert W_{X,Y,Z} \rvert \le 3\sqrt{n_{\text{边}}}\,\sigma = 3\sqrt{4}\times 10.00 = \mathbf{60.00\ \mathrm{mm}}$；
>   - 环全长限差：$W_S \le 3\sqrt{3n_{\text{边}}}\,\sigma = 3\sqrt{12}\times 10.00 = 6\sqrt{3}\times 10.00 \approx \mathbf{103.92\ \mathrm{mm}}$。
> - 复测基线长度较差限差（1 分）：$d_s \le 2\sqrt{2}\,\sigma \approx 2.8284\times 10.00 = \mathbf{28.28\ \mathrm{mm}}$。

### 13. 【实验与工程综合 · 静态 GNSS 控制网内外业全流程方案与异常排查】（16 分）

结合静态 GNSS 控制网设计与内外业数据处理实验，回答以下问题：

（1）设计建立 D 级 GNSS 首级控制网从**技术设计与选点、外业仪器架设与观测记录、内业基线解算三级质检、两步网平差与高程转换**的完整技术方案；（12 分）<br>
（2）内业解算时，若发现某条基线解算 `Ratio < 1.8`（浮点未固定）或异步环闭合差超限，应如何分步排查并处理？（4 分）

> **【参考答案与分步采分点】**：
>
> **（1）静态 GNSS 控制网四阶段完整技术方案（12 分）**：
> - **阶段一：技术设计与野外选点**（3 分）：采用**边连式或混连式**构网（每点连接 $\ge 3$ 条独立基线，D 级独立环边数 $\le 8$ 条），四周均匀联测 $\ge 3\sim 5$ 个高等级平面控制点及水准点；选点要求视场 **$15^\circ$ 以上无成片遮挡**，避开水面玻璃幕墙，距高压线 $\ge 50\ \mathrm{m}$、无线电发射台 $\ge 200\ \mathrm{m}$。
> - **阶段二：外业架设与同步观测**（3 分）：严格对中整平，所有天线**指北线统一指向正北（$\le \pm 5^\circ$）**；同点连续观测两时段间**必须重新架设对中重测天线高**；沿互成 $120^\circ$ 三方向在**测前、测后各量一次天线高（互差 $\le 3\ \mathrm{mm}$）**，斜高按 $h=\sqrt{l^2-R^2}+h_0$ 归算；设截止角 $15^\circ$、采样间隔 $10\sim 30\ \mathrm{s}$、有效星 $\ge 4$、$\mathrm{PDOP}\le 6$，D 级观测 $\ge 60\ \mathrm{min}$，严守“五不准”。
> - **阶段三：数据转换与基线三级质检**（3 分）：转为标准 RINEX 文件核对站名、天线高与型号；① **单基线检查**：固定解且 $\mathrm{Ratio} \ge 2.0\sim 3.0$、RMS 合格；② **同步环闭合差**（$W_S \le \frac{3}{5}\sigma$）检软件与同步性；③ **异步环闭合差**（$W_S \le 3\sqrt{3n}\sigma$）与**复测基线较差**（$d_s \le 2\sqrt{2}\sigma$）检核外业安置与真实质量。
> - **阶段四：两步平差与高程转换**（3 分）：① **三维无约束平差**（固定 1 点，评定内符合精度并按 $\lvert V\rvert \le 3\sigma$ 剔粗差）；② **约束平差**（引入外部起算点转换至目标坐标系，按 $\lvert \mathrm{d}V\rvert \le 2\sigma$ 检核起算点兼容性）；③ 用公共水准点做 **GPS 水准曲面拟合**求正常高并输出成果。
>
> **（2）基线未固定或异步环超限的分步排查方法（4 分）**：
> - **第一步（查外业人为录入错误）**（1.5 分）：核对点名是否张冠李戴、天线高数值及量高方式（斜高/直高）、天线型号（PCO）是否选错；
> - **第二步（调整内业解算参数重算）**（1.5 分）：适当提高截止高度角（至 $20^\circ\sim 25^\circ$）滤除低仰角多路径，屏蔽周跳频发的劣质卫星或剔除受干扰起止历元，更换最优基准星并引入 IGS 精密星历与双频 LC 组合重算；
> - **第三步（删除或外业重测判定）**（1 分）：若仍不合格，在保证独立环边数上限与各点独立基线数达标前提下可剔除该基线；不满足网形规范时必须外业重测该同步图形。</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
</body>
