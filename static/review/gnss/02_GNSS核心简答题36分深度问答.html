## 第一专题：坐标与时间基准、系统组成及信号星历（第 2、3 章作业原题）

### 【问答 01】在 GNSS 测量与数据处理中，不同坐标系之间如何进行转换？（第 2 章作业原题 · 12 分标准架构）

**【12分标准六点作答】**：
1. **总体分类架构（2分）**：
   GNSS 涉及的坐标转换按物理性质分为两大类：一是用于卫星定轨与位置归算的**“协议天球坐标系（GCRS）与协议地球坐标系（ITRS）之间的转换”**；二是用于工程成果交付的**“不同地球（地心/参心/平面）坐标系之间的转换”**。
2. **天球系（GCRS）转至地球系（ITRS）的四步旋转矩阵链（2分）**：
   必须依次扣除**岁差、章动、地球自转和极移**四项空间运动，矩阵变换公式为：

   $$\begin{pmatrix} X \\ Y \\ Z \end{pmatrix}_{\mathrm{ITRS}} = [\boldsymbol{W}]^{-1}[\boldsymbol{R}]^{-1}[\boldsymbol{N}]^{-1}[\boldsymbol{P}]^{-1}\begin{pmatrix} X \\ Y \\ Z \end{pmatrix}_{\mathrm{GCRS}}$$

   具体四步物理路径：`J2000.0 协议天球系` $\xrightarrow{\text{岁差 } \boldsymbol{P}^{-1}}$ `瞬时平天球系` $\xrightarrow{\text{章动 } \boldsymbol{N}^{-1}}$ `瞬时真天球系` $\xrightarrow{\text{地球自转 } \boldsymbol{R}_Z(\mathrm{GAST})}$ `瞬时真地球系` $\xrightarrow{\text{极移 } \boldsymbol{W}^{-1}(X_p,Y_p)}$ `协议地球系（ITRS / WGS-84）`。
3. **同一参考椭球下不同坐标表达形式的严密数学换算（2分）**：
   - **大地坐标 $(B, L, H)$ 与空间直角坐标 $(X, Y, Z)$ 互换**：利用卯酉圈曲率半径 $N = \dfrac{a}{\sqrt{1 - e^2\sin^2 B}}$ 正算 $X = (N+H)\cos B\cos L,\ Y = (N+H)\cos B\sin L,\ Z = [N(1-e^2)+H]\sin B$，反算通过迭代求纬度 $B$；
   - **大地经纬度 $(B, L)$ 与高斯平面直角坐标 $(x, y)$ 互换**：按高斯-克吕格正反算投影公式（指定 $3^\circ$ 或 $6^\circ$ 带中央子午线 $L_0$）严密换算。
4. **不同三维空间直角坐标系间的转换——布尔莎（Bursa-Wolf）七参数模型（2分）**：
   用于地心系（WGS-84 / CGCS2000）与参心系（北京 54 / 西安 80）或不同 ITRF 框架间的三维基准转换，包含 **3 个平移参数** $(T_X, T_Y, T_Z)$、**3 个微小旋转角** $(\omega_X, \omega_Y, \omega_Z)$ 和 **1 个尺度因子** $m$：

   $$\boldsymbol{X}_A = \boldsymbol{T} + (1 + m)\boldsymbol{R}(\omega_X, \omega_Y, \omega_Z)\boldsymbol{X}_B$$

   至少需在测区四周均匀选取 **$3$ 个以上不共线的三维公共控制点**按最小二乘法求解（小区域且旋转尺度极小时可简化为三参数平移模型）。
5. **不同二维平面坐标系间的转换——平面四参数相似变换模型（2分）**：
   当中小测区（$<15\ \mathrm{km}$）旧控制点仅有高斯平面坐标而缺乏高精度大地高时，先将 GNSS 大地经纬度高斯投影至平面，采用含 **2 个平面平移量 $(\Delta X_0, \Delta Y_0)$、1 个平面旋转角 $\alpha$、1 个尺度因子 $m$** 的二维四参数模型转换（最少需 **2 个**公共平面点，工程常取 $\ge 3$ 个检核粗差）。
6. **高程基准独立转换——GPS 水准与似大地水准面精化（2分）**：
   因 GNSS 测定参考椭球面上的纯几何**大地高 $H$**，而我国法定采用似大地水准面上的**正常高 $H_\gamma$**，必须通过联测公共水准点求高程异常 $\zeta = H - H_\gamma$，利用**平面/二次曲面多项式拟合**或调用区域似大地水准面精化格网模型完成高程基准转换。

### 【问答 02】阐述我国常用三大国家大地坐标系（Beijing54、Xian80、CGCS2000）的基本特征，并对比它们与 WGS-84 坐标系的异同。（第 2 章作业专题报告原题 · 12 分）

**【12分标准六点作答】**：
1. **北京 54 坐标系（Beijing54）特征（2分）**：
   建国初期从前苏联引测建立的局部**参心坐标系**，采用克拉索夫斯基（Krassovsky 1940）椭球（$a = 6\,378\,245\ \mathrm{m},\ f = 1/298.3$），大地原点远在前苏联**普尔科沃天文台**，导致我国西部与边远地区高程异常和垂线偏差系统变形较大（现已停用）。
2. **西安 80 坐标系（Xian80）特征（2分）**：
   20 世纪 70 年代末我国自主天文大地网整体平差建立的**参心坐标系**，采用国际大地测量协会 **IAG 1975 椭球**（$a = 6\,378\,140\ \mathrm{m},\ f = 1/298.257$），大地原点设在我国腹地**陕西省泾阳县永乐镇**，实现了全国境内二维平面精度的均匀贴合（现已停用）。
3. **2000 国家大地坐标系（CGCS2000）特征（2分）**：
   2008 年 7 月正式启用的我国现行法定国家坐标标准（也是北斗 BDS 采用的基准），属于高精度、三维、动态全球**地心坐标系**（对准 ITRF97 框架，参考历元 2000.0），原点位于含海洋和大气的**地球质量中心**。
4. **参心坐标系（Beijing54 / Xian80）与 WGS-84 的本质差异（2分）**：
   Beijing54 和 Xian80 均为局部最佳贴合的**参心坐标系**，其椭球中心偏离真实地球质心达数十米至上百米，且椭球长半轴与扁率差异大；与全球地心系 WGS-84 之间**绝对不能直接混用**，同一地面点未转换前坐标差可达数十至百米，必须通过公共控制点严密解算七参数或四参数转换。
5. **CGCS2000 与 WGS-84 的高度一致性（2分）**：
   两者**同属全球地心地固右手直角坐标系**，坐标原点（地球质量中心）和 $X, Y, Z$ 三轴指向的国际协议定义完全一致；在相同参考历元下，厘米级及以下精度的常规测绘、RTK 与 GIS 应用中**两者坐标可直接视为等同**。
6. **CGCS2000 与 WGS-84 椭球参数的微小差异量化对比（2分）**：

| 对比参数 | Beijing54 | Xian80 | **CGCS2000** | **WGS-84** |
| :--- | :--- | :--- | :--- | :--- |
| **坐标系类型与原点** | 参心（苏联普尔科沃） | 参心（陕西泾阳） | **地心（地球质心）** | **地心（地球质心）** |
| **椭球长半轴 $a$** | $6\,378\,245.0\ \mathrm{m}$ | $6\,378\,140.0\ \mathrm{m}$ | **$6\,378\,137.0\ \mathrm{m}$** | **$6\,378\,137.0\ \mathrm{m}$** |
| **椭球扁率 $f$** | $1 / 298.3$ | $1 / 298.257$ | **$1 / 298.257222101$** | **$1 / 298.257223563$** |
| **核心差异影响** | 偏离地心百米级 | 偏离地心数十米级 | 因动力学扁率 $J_2$ 微差，**极半径仅相差约 $0.105\ \mathrm{mm}$**，工程完全可忽略 | GPS 法定基准 |

### 【问答 03】GNSS 由哪三大部分组成？详述地面监控部分的站点构成与功能，并说明用户接收机四大硬件模块的信号处理流程。（第 3 章作业第 1 题 + 实验一硬件原理合璧 · 12 分）

**【12分标准六点作答】**：
1. **GNSS 系统三大总体组成部分（2分）**：
   全球导航卫星系统由 **空间星座部分**（持续向全球播发导航测距信号的工作卫星与在轨备用星）、**地面监控部分**（跟踪监测、定轨算钟并控制卫星运行）和 **用户设备部分**（GNSS 接收机硬件及数据处理软件）三大部分协同组成。
2. **地面监控部分之一——监测站（Monitor Stations）（2分）**：
   均匀分布于全球的无人值守自动化数据采集站（如 GPS 设 17 个站）。连续跟踪视场内所有可见卫星，采集双频**测码伪距与载波相位观测值**，同步采集测站**气压、气温、相对湿度等气象数据**，经初步编辑后实时传往主控站。
3. **地面监控部分之二——主控站（Master Control Station）（2分）**：
   整个地面监控系统的**行政管理与数据处理核心中枢**。汇总各监测站观测资料，**精密解算并外推预报卫星广播星历参数、卫星钟差改正参数及电离层模型参数**，按规定格式编排生成导航电文送往注入站；同时实时监控卫星健康状态，签发轨道机动修正或启用备用星/件的控制指令。
4. **地面监控部分之三——注入站（Upload Stations）与通信辅助网（2分）**：
   注入站接收并暂存主控站发来的导航电文与控制指令，当卫星飞越其可视弧段时，利用大口径 **S 波段地面上行发射天线将导航电文和控制指令定时“注入”卫星存储器**；通信辅助网保障全网实时数据传输并与外部时间/地球定向基准机构协同。
5. **用户接收机前端——天线单元与射频前端（RF）（2分）**：
   - **天线单元**：采用**右旋圆极化（RHCP）**微带或扼流圈天线捕获极微弱卫星电磁波（抑制地面一次反射多路径），经**前置低噪声放大器（LNA）**就近放大并滤除带外干扰；
   - **射频前端**：将高频射频信号与机内本振信号**混频下变频为低频中频信号（IF）**，经高速 **A/D 模数转换器**采样量化为数字中频信号。
6. **用户接收机后端——基带数字信号处理通道与微处理器终端（2分）**：
   - **基带信号处理模块（核心）**：在码时延与多普勒频移二维空间搜索捕获卫星；由**延迟锁定环（DLL）**对齐复制码测定伪距，由**锁相环（PLL）**剥离调制码重建载波测定相位小数周并累计整周变化，同步解调 $50\ \mathrm{bps}$ 导航电文；
   - **微处理器、存储与电源**：执行实时单点/RTK 定位解算，按采样间隔和截止高度角将观测值记录为 RINEX 数据，通过手簿显示卫星数、PDOP 与信噪比。

### 【问答 04】什么是载波？什么是测距码？阐述 GPS 的载波与测距码种类，并说明在 AS 政策下测量型接收机重建载波的四种方法。（第 3 章作业第 2 题 + 第 5 章关联 · 12 分）

**【12分标准六点作答】**：
1. **载波的定义与三大核心作用（2分）**：
   载波是用于搭载调制测距码和导航电文的高频正弦微波（选用穿透电离层且抗雨衰优良的 **L 波段右旋圆极化波**）。三大作用：① 运载传递测距码与电文；② 直接作为毫米级高精度**载波相位测距信号**；③ 多频载波线性组合**消除一阶电离层延迟**并组成宽巷辅助固定模糊度。
2. **GPS 的三种载波频率与波长（基准频率 $f_0 = 10.23\ \mathrm{MHz}$）（2分）**：
   - **$L_1$ 载波**：$f_1 = 154 f_0 = \mathbf{1575.42\ \mathrm{MHz}}$，波长 $\lambda_1 \approx \mathbf{19.03\ \mathrm{cm}}$；
   - **$L_2$ 载波**：$f_2 = 120 f_0 = \mathbf{1227.60\ \mathrm{MHz}}$，波长 $\lambda_2 \approx \mathbf{24.42\ \mathrm{cm}}$；
   - **$L_5$ 载波**（现代化增设）：$f_5 = 115 f_0 = \mathbf{1176.45\ \mathrm{MHz}}$，波长 $\lambda_5 \approx \mathbf{25.48\ \mathrm{cm}}$。
3. **测距码（伪随机噪声码 PRN）的定义与双重特性（2分）**：
   调制在载波上用于测定信号传播时间的二进制伪随机序列。它一方面具有随机白噪声的优良相关特性——**自相关峰极尖锐**（便于精确对齐测定传播时延）且**互相关接近于零**（实现 CDMA 同频区分不同卫星）；另一方面按移位寄存器确定数学逻辑周期生成，**可在接收机内精确复制**。
4. **GPS 传统测距码（C/A 码与 P(Y) 码）参数对比（2分）**：
   - **C/A 码（粗捕获码）**：仅调制于 $L_1$，码率 **$1.023\ \mathrm{Mbps}$**、周期 **$1\ \mathrm{ms}$**、码元宽度 **$293.05\ \mathrm{m}$**，民用公开、周期短易快速搜索捕获，测距精度约 $0.3\sim 3\ \mathrm{m}$；
   - **P(Y) 码（精码）**：同时调制于 $L_1, L_2$，码率 **$10.23\ \mathrm{Mbps}$**、周期 **$7\ \text{天}$**、码元宽度 **$29.3\ \mathrm{m}$**，测距精度约 $0.3\ \mathrm{m}$，实施 AS 政策加 W 码后加密为军用保密 **Y 码**。
5. **GPS 现代化新增民用与军用测距码（2分）**：
   为实现民用双频/三频消电离层与军民频谱隔离，现代化增设了第二民用码 **$L_2\mathrm{C}$**（调制于 $L_2$）、第三民用码 **$L_5$**（高码率 $10.23\ \mathrm{Mbps}$，服务航空生命安全）、第四民用码 **$L_1\mathrm{C}$** 以及采用 BOC 调制的新一代军用保密 **M 码**。
6. **应对 AS 政策剥离调制码“重建载波”的四种技术对比（2分）**：
   ① **码相关法**（对公开 C/A 码直接复制相乘，恢复全波长 $L_1$ 载波、高信噪比且得伪距电文，但对未知保密 Y 码失效）；② **平方法**（信号自乘平方消调相，无需码结构，但**波长减半、信噪比暴跌 $>30\ \mathrm{dB}$ 且丢失伪距电文**）；③ **互相关法**（利用 $L_1, L_2$ 上 Y 码相同做交叉相关，恢复全波长 $L_2$ 但信噪比低）；④ **Z 跟踪技术**（分段相关剥离低速 W 码，**同时获取双频精密伪距与高信噪比全波长 $L_1, L_2$ 载波，现代测量型接收机主流方案**）。

### 【问答 05】什么是开普勒轨道六根数？逐一说明六个根数的物理意义与几何作用，并全方位对比卫星历书、广播星历与精密星历。（第 3 章作业第 3、4 题合璧 · 12 分）

**【12分标准六点作答】**：
1. **开普勒轨道根数的总体定义（2分）**：
   在忽略非球形引力与日月光压等摄动力的理想二体中心引力场假设下，卫星绕地球质心作平面椭圆轨道运动，用来**唯一确定椭圆轨道空间位置、形状大小、面内朝向及卫星瞬时位置**的 6 个独立参数称为开普勒轨道六根数。
2. **确定轨道平面空间方位的两个根数——$\Omega$ 与 $i$（2分）**：
   - **升交点赤经 $\Omega$**：天球赤道面上从春分点逆时针量至卫星由南向北穿过赤道面的升交点的角度；
   - **轨道倾角 $i$**：卫星轨道平面与天球赤道平面的夹角；两者共同锁死轨道平面在天球空间中的三维指向。
3. **确定椭圆大小形状及面内定向的三个根数——$a, e, \omega$（2分）**：
   - **轨道长半轴 $a$** 与 **偏心率 $e$**：共同决定椭圆轨道的尺度大小（及平均角速度 $n_0 = \sqrt{GM/a^3}$）和椭圆扁平程度；
   - **近地点角距 $\omega$**：轨道平面内从升交点沿运动方向量至近地点的角度，唯一确定椭圆长轴在轨道平面内的朝向。
4. **确定卫星瞬时位置的根数及广播星历 9 个摄动扩展项（2分）**：
   - **过近地点时刻 $t_0$（广播星历改用参考时刻 $t_{oe}$ 的平近点角 $M_0$）**：确定卫星在椭圆上的瞬时位置；
   - 真实卫星受地球扁率、日月引力与太阳光压摄动，故广播星历在 6 根数与 $t_{oe}$ 基础上增设 **9 个摄动参数**（$\Delta n, \dot{\Omega}, \mathrm{IDOT}$ 及 6 个二阶调和改正振幅 $C_{uc}, C_{us}, C_{rc}, C_{rs}, C_{ic}, C_{is}$），共构成 **16 参数广播星历**。
5. **广播星历与精密星历的本质生成机理差异（2分）**：
   **广播星历**由系统主控站利用少量监测站跟踪数据定轨并**向前外推预报**，经导航电文实时广播；**精密星历**由 **IGS** 等国际分析中心利用全球数百个跟踪站实测数据在**事后（或准实时）严密动力学解算**，按 **SP3 格式**（每 $15\ \mathrm{min}$ 给出 ITRF 系下卫星质心三维坐标与钟差）通过互联网发布。
6. **卫星历书、广播星历与精密星历全维度对比表（2分）**：

| 对比维度 | 卫星历书（Almanac） | 广播星历（Broadcast） | 精密星历（Precise / SP3） |
| :--- | :--- | :--- | :--- |
| **获取渠道与对象** | 电文第 4、5 子帧；全星座简化参数 | 电文第 2、3 子帧；仅本星 16 参数 | IGS 网络下载；全星座等间隔三维坐标表 |
| **坐标计算方式** | 简化开普勒公式粗算 | **16 参数摄动解析公式**（WGS84/CGCS2000） | **9～11 阶拉格朗日多项式内插**（ITRF 质心） |
| **轨道精度与时效** | 百米～公里级；有效期数月 | **$\sim 100\ \mathrm{cm}$（米级）**；**实时**外推预报 | **最终星历 $2.5\ \mathrm{cm}$**（钟差 $75\ \mathrm{ps}$）；事后为主 |
| **核心工程用途** | 测前可见星/DOP 预报、**辅助接收机快速捕星** | 实时导航、伪距单点定位、中短基线相对定位/RTK | **PPP 精密单点定位**、长基线高等级控制网解算 |

## 第二专题：GNSS 定位误差源机理、削弱对策与 IGS（第 4 章作业原题）

### 【问答 06】GNSS 定位中有哪些主要误差源？请按来源分类列出，并系统阐述消除或削弱这些误差的四大基本方法。（作业 4-1 & 第 4 章作业第 1 题核心母题 · 12 分）

**【12分标准六点作答】**：
1. **第一类误差：与卫星有关的误差（共 5 项）（2分）**：
   ① **卫星星历（轨道）误差**（广播星历约 $1\ \mathrm{m}$）；② **卫星钟误差**（广播钟差改正后残差约 $0.6\sim 1.5\ \mathrm{m}$）；③ **相对论效应**（椭圆轨道周期项最大约 $6.9\ \mathrm{m}$）；④ **卫星内部信号群延差（硬件延迟 $T_{GD}/\mathrm{ISC}$）**；⑤ **卫星天线相位中心偏差（PCO，达 $0.7\sim 2.6\ \mathrm{m}$）与变化（PCV）**。
2. **第二类误差：与信号传播路径有关的误差（共 3+2 项）（2分）**：
   ① **电离层折射延迟**（色散介质，天顶白天 $5\sim 15\ \mathrm{m}$，低仰角 $>50\ \mathrm{m}$）；② **对流层折射延迟**（非色散介质，天顶约 $2.3\ \mathrm{m}$，干分量占 $90\%$、湿分量占 $10\%$）；③ **多路径效应**（反射波干涉，伪距米级、载波最大 $\frac{1}{4}\lambda$）；此外地固系解算还包含信号传播期间的 **地球自转（Sagnac）效应** 与圆极化波 **天线相位缠绕**。
3. **第三类误差：与接收机设备及安置有关的误差（共 5 项）（2分）**：
   ① **接收机钟误差**（石英钟频偏大，等效百米至百公里级）；② **接收机天线 PCO/PCV 以及外业对中整平、天线高量取误差**；③ **接收机内部通道硬件延迟**；④ **起算控制点坐标误差**；⑤ **接收机通道测量随机热噪声**（及载波失锁引起的**周跳粗差**）。
4. **处理对策一：模型改正法（物理与经验数学模型修正）（2分）**：
   用广播钟差二阶多项式与 $T_{GD}$、相对论周期项公式、地球自转旋转公式直接修正；单频电离层用 Klobuchar 模型改正 $60\%\sim 70\%$，**双频观测构造无电离层线性组合（LC）消除 $>99\%$ 一阶电离层延迟**；对流层干延迟用 Saastamoinen/Hopfield 模型改正；长基线与 PPP 引入 IGS 精密星历/钟差、ANTEX 天线模型与固体潮/海潮改正。
5. **处理对策二：同步观测求差法（差分法）与参数估计法（2分）**：
   - **求差法**：利用空间时间强相关性，**站间单差**彻底消除卫星钟差与星端硬件延迟，大幅削弱轨道和大气延迟；**站星双差**进一步彻底消除接收机钟差与机端硬件延迟并恢复模糊度整数特性；**历元三差**消去整周模糊度辅助探测周跳；
   - **参数估计法**：在平差中将难以精确建模的**接收机钟差、天顶对流层湿延迟（ZWD）、整周模糊度及多系统偏差（ISB）**设为未知参数与坐标同步解算。
6. **处理对策三：选点回避与软硬件优化措施（专克多路径与安置误差）（2分）**：
   针对差分无法消除的多路径、电磁干扰及量高粗差：野外选点远离水面、玻璃幕墙、高压线与发射塔；设置 **$10^\circ \sim 15^\circ$ 卫星截止高度角**；选用带抑径板/扼流圈的右旋圆极化天线并统一指北安置；规范三方向前后两次量取天线高；采用窄相关器并适当延长观测时间平滑。

### 【问答 07】详细对比电离层折射延迟与对流层折射延迟在大气物理性质、对伪距与载波影响规律以及削弱处理方法上的核心差异。（第 4 章高频对比大题 · 12 分）

**【12分标准六点作答】**：
1. **大气层空间高度与介质色散性本质不同（2分）**：
   **电离层**位于地面以上 **$60 \sim 1000\ \mathrm{km}$**，由太阳紫外线与 X 射线电离产生的自由电子构成，对微波属于**色散介质**（折射率与信号频率 $f$ 有关）；**对流层**位于 **$50\ \mathrm{km}$ 以下**中性大气底层，对 $15\ \mathrm{GHz}$ 以下 GNSS 微波属于**非色散介质**（折射率与频率无关）。
2. **对测码伪距与载波相位的作用方向不同（2分）**：
   - **电离层等大反向**：相折射率 $n_P = 1 - 40.3\frac{N_e}{f^2} < 1$（载波相速度超光速，**相位超前，测距变短 $-I$**），群折射率 $n_G = 1 + 40.3\frac{N_e}{f^2} > 1$（测距码群速度变慢，**群延迟，伪距变长 $+I$**），一阶量 $I = \frac{40.3}{f^2}\mathrm{TEC}$；
   - **对流层同向等量**：相折射率与群折射率完全相等且大于 $1$，使测码伪距与载波相位**发生大小和符号完全一致的正延迟（测距均变长）**。
3. **误差量级与时空变化主导因素不同（2分）**：
   电离层受太阳黑子活动、昼夜（午后 14 时最大，夜间最小）、季节与磁纬剧烈支配，天顶延迟白天 **$5\sim 15\ \mathrm{m}$**、低仰角可超 **$50\ \mathrm{m}$**；对流层天顶总延迟约 **$2.3\ \mathrm{m}$**（低仰角超 $20\ \mathrm{m}$），由占 **$90\%$** 极其稳定的**干延迟（静力学分量）**与仅占 **$10\%$** 但随水汽剧烈波动的**湿延迟**组成。
4. **双频观测线性组合能否消除的根本差异（2分）**：
   因电离层延迟严格与 $1/f^2$ 成正比，双频接收机可构造**无电离层线性组合** $\rho_{\mathrm{IF}} = \frac{f_1^2}{f_1^2-f_2^2}\rho'_1 - \frac{f_2^2}{f_1^2-f_2^2}\rho'_2$ **直接消除 $>99\%$ 的一阶电离层延迟**；而对流层延迟与频率完全无关，**任何多频线性组合均无法消除对流层延迟**！
5. **经验模型与参数估计策略不同（2分）**：
   单频电离层采用导航电文播发的 **8 参数 Klobuchar 余弦模型**（或格网 VTEC 图）改正约 $60\%\sim 70\%$；对流层干延迟用测站气压代入 **Saastamoinen / Hopfield 模型**即可改正至毫米级，难以建模的**湿延迟则结合映射函数将天顶湿延迟（ZWD）设为分段随机参数在平差中与坐标一并解算**。
6. **同步相对定位差分削弱规律总结表（2分）**：

| 对比维度 | 电离层折射延迟 | 对流层折射延迟 |
| :--- | :--- | :--- |
| **色散性与码相符号** | **色散介质**：伪距 $+I$（变长），载波 $-I$（变短） | **非色散介质**：伪距与载波均变长（同号等值） |
| **双频 LC 组合效果** | **消除 $>99\%$ 一阶项**（中长基线与 PPP 必用） | **完全无效（无法通过双频消除）** |
| **站间差分削弱条件** | 短基线（$<15\ \mathrm{km}$）大幅抵消；长基线残差大须用双频 | 短基线**且两端高差较小**时抵消；**大高差测站间必须估计相对对流层参数** |

### 【问答 08】什么是多路径效应与卫星截止高度角？结合【实验一】分析为何外业选点既要避开水面幕墙又要远离高压线发射塔，且天线高量错为何最危险？（实验一思考题合集 · 12 分）

**【12分标准六点作答】**：
1. **多路径效应的物理机理与最大误差极值（2分）**：
   卫星直射波与经测站周围反射物反射后进入天线的反射波发生**干涉叠加**，引起测码跟踪环与载波锁相环平衡点偏移。其对伪距影响达米级（精码亦可达数米），对**载波相位的理论最大误差为 $\frac{1}{4}\lambda$**（全反射 $\alpha=1$ 时相差 $90^\circ$，对 $L_1$ 载波最大约 **$4.8\ \mathrm{cm}$**）。
2. **多路径效应的核心特性——差分无法消除（2分）**：
   多路径误差完全取决于测站周围数十米内的局部反射几何构型，随卫星运动呈周期性振荡，**不同测站之间毫无空间相关性**；因此站间求单差或双差不仅不能抵消多路径误差，反而会使两站多路径噪声合成增大，成为短基线静态测量与 RTK 最顽固的残余误差源。
3. **避开水面/玻璃幕墙 vs 远离高压线/发射塔的机理本质区别（2分）**：
   - **避开平静水面、玻璃幕墙、金属牌**：是为了消除强镜面反射源，抑制**多路径干涉偏差**；
   - **远离无线电发射塔（$\ge 200\ \mathrm{m}$）与高压输电线（$\ge 50\ \mathrm{m}$）**：是因为落地卫星信号极微弱（约 $-160\ \mathrm{dBW}$），强电磁辐射和谐波会急剧抬高接收机射频前端**底噪、压低信噪比（SNR）甚至阻塞低噪放**，导致锁相环频繁**失锁、产生密集连续周跳甚至信号中断**。
4. **抑制多路径效应的软硬件综合措施（2分）**：
   ① 选点避开反射面；② 硬件采用仅接收直射**右旋圆极化（RHCP）**的天线（一次反射后变为左旋圆极化被天然抑制）并加装**抑径板或扼流圈（Choke Ring）**阻挡地面低仰角反射波；③ 接收机基带采用**窄相关器技术**；④ 静态测量适当延长观测时间利用周期性均化平滑。
5. **卫星截止高度角（常设 $10^\circ \sim 15^\circ$）的双向权衡原理（2分）**：
   设置截止角是为了过滤低仰角信号斜穿超长大气路径引起的剧烈大气折射残差和地面强多路径粗差。**设过低（$<5^\circ$）**会引入严重多路径和周跳污染平差；**设过高（$>25^\circ\sim 30^\circ$）**则会人为剔除大量可用卫星，导致空间交会四面体扁平、**$\mathrm{PDOP}$ 与垂直因子 $\mathrm{VDOP}$ 急剧恶化**，高程精度严重下降。
6. **天线高规范量取及为何是“高程最隐蔽杀手”（2分）**：
   外业须沿护圈互成 $120^\circ$ 三方向并在测前、测后各量一次（互差均 $\le 3\ \mathrm{mm}$），斜高 $l$ 按 $h = \sqrt{l^2 - R^2} + h_0$ 归算至相位中心。一旦读错尺、内业误将斜高设成直高或选错天线型号（PCO 偏差 $5\sim 15\ \mathrm{cm}$），误差将 **1:1 直接传入大地高**，且**同一时段的同步环闭合差检验完全无法发现该错误**（在环内一进一出抵消），必须靠不同时段重新架设的**异步环或复测基线**才能检出！

### 【问答 09】什么是 IGS（国际 GNSS 服务）？简述其组织架构、核心科学工程职能以及向全球免费提供的六大精密数据产品。（第 4 章作业第 2 题原题 · 12 分）

**【12分标准六点作答】**：
1. **定义与发展背景（2分）**：
   **IGS（International GNSS Service，国际 GNSS 服务）** 是由国际大地测量协会（IAG）组建并于 **1994 年 1 月 1 日正式运行**的非营利性国际科学合作组织（原名国际 GPS 服务，后随多星座兼容扩展更名为国际 GNSS 服务）。
2. **全球六级协同组织架构（2分）**：
   由分布全球的 **400 余座永久连续运行卫星跟踪站网**、三级数据中心（区域/局部/全球数据中心）、各大权威**分析中心**（如 CODE、JPL、GFZ、武汉大学 WHU 等）、综合分析中心、中央局与管理委员会组成。
3. **核心职能一：支撑全球高精度定位与地学研究（2分）**：
   全天候采集、处理并向全球科研与工程用户**免费公开分发最高精度的 GNSS 原始观测资料与精密轨道钟差产品**，直接支撑精密单点定位（PPP）、洲际与国家级长基线控制网解算、板块运动、地壳形变及海平面变化监测。
4. **核心职能二：维持和精化国际地球参考框架（ITRF）（2分）**：
   通过全球跟踪站长期连续观测解算高精度站坐标与三维速度场，与 VLBI、SLR、DORIS 等空间大地测量技术联合维持并定期更新**国际地球参考框架（ITRF）**，同时高精度监测地球自转运动。
5. **核心职能三：制定并推广国际通用数据格式标准（2分）**：
   主导制定并维护全球通用的与接收机无关的观测数据交换格式 **RINEX**、精密星历标准格式 **SP3**、卫星与接收机绝对天线相位中心模型格式 **ANTEX**、全球电离层格网格式 **IONEX** 及解独立交换格式 **SINEX**。
6. **IGS 向全球提供的六大核心精密产品及精度指标（2分）**：
   - ① **精密卫星星历**（超快预报 IGU $5\ \mathrm{cm}$、快速 IGR 与最终星历 IGS 均达 **$2.5\ \mathrm{cm}$**）；
   - ② **精密卫星钟差与测站钟差**（最终精密星钟精度高达 **$75\ \mathrm{ps} \approx 2.3\ \mathrm{cm}$**）；
   - ③ **地球自转/定向参数（ERP）**（极移坐标 $X_p, Y_p$、极移速率与日长变化 LOD）；
   - ④ **全球跟踪站三维地心坐标及速度场**（坐标周解平面 $3\ \mathrm{mm}$、高程 $6\ \mathrm{mm}$）；
   - ⑤ **全球跟踪站天顶对流层总延迟（ZTD，精度 $4\ \mathrm{mm}$）**；
   - ⑥ **全球电离层总电子含量格网图（VTEC，IONEX 格式）**。

## 第三专题：卫地距测量、单双三差、周跳修复与模糊度固定（作业 5.1～5.3 原题）

### 【问答 10】在 GNSS 测量中，测定卫星至接收机距离有哪两种基本方式？详述各自测距原理，并从模糊度、精度、抗干扰等维度全面对比。（作业 5.1 原题 · 12 分）

**【12分标准六点作答】**：
1. **两种基本测距方式概述（2分）**：
   GNSS 本质是基于时间延迟或相位延迟的空间距离交会系统，测定卫星至接收机距离有 **测码伪距测量（码相位测量）** 和 **载波相位测量** 两种基本方式。
2. **测码伪距测量的基本原理（2分）**：
   卫星发射调制的伪随机测距码 $u(t)$，经传播时延到达接收机；接收机在机内时钟驱动下产生结构完全相同的**复制码** $u(t-\tau)$，利用延迟锁定环（DLL）移动延迟量 $\tau$ 进行**自相关运算**，当自相关系数达到**最大值（$R = \max$）**时两码严格对齐，测出表面传播时间 $\tilde{t} = t_R - t^S$，乘以光速得观测值 $\tilde{\rho} = c(t_R - t^S)$。
3. **为何称为“伪距”及其优缺点（2分）**：
   因接收机钟与卫星钟均存在钟差，且信号受电离层与对流层折射延迟影响，$\tilde{\rho}$ 不等于真实几何距离 $\rho$ 故称伪距。**优点**是直接测得全距离、**绝无整周模糊度困扰**、单历元瞬时可定位；**缺点**是码元较宽（C/A 码 $293\ \mathrm{m}$、P 码 $29.3\ \mathrm{m}$），测距精度仅达码宽的 $0.1\%\sim 1\%$（**分米级至米级**），且多路径误差较大。
4. **载波相位测量的基本原理（2分）**：
   接收机先剥离测距码和电文**重建连续载波**，与机内本振产生的基准载波混频得到拍频信号。在首次锁定瞬间 $t_0$，**鉴相器**精密测出不足一整周的相位小数部分 $\operatorname{Fr}(\varphi)$；在后续连续跟踪不失锁期间，**多普勒整周计数器**连续累加整周变化数 $\operatorname{int}(\varphi)$，加上初始未知的**整周模糊度 $N$**，构成相位距离观测值 $\tilde{\Phi}\lambda = [\operatorname{int}(\varphi) + \operatorname{Fr}(\varphi) + N]\lambda$。
5. **载波相位测量的核心优势与固有难点（2分）**：
   因 L 波段载波波长极短（约 $19\sim 25\ \mathrm{cm}$），鉴相精度达波长的 $0.1\%\sim 1\%$，**测距精度高达 $0.2\sim 3\ \mathrm{mm}$（毫米级）**，且载波多路径误差远小于伪距（最大仅 $\frac{1}{4}\lambda$）；**难点**是包含未知的**初始整周模糊度 $N$**，且要求锁相环连续跟踪，一旦遮挡失锁就会发生**整周跳变（周跳）**。
6. **测码伪距与载波相位测量全方位对比表（2分）**：

| 对比维度 | 测码伪距测量（Pseudorange） | 载波相位测量（Carrier Phase） |
| :--- | :--- | :--- |
| **测量信号与波长/码宽** | 伪随机测距码（C/A 码宽 $293\ \mathrm{m}$，P 码宽 $29.3\ \mathrm{m}$） | 重建 L 波段正弦载波（$\lambda_1 \approx 19.0\ \mathrm{cm},\ \lambda_2 \approx 24.4\ \mathrm{cm}$） |
| **测距随机噪声精度** | 较低：**$0.3 \sim 3\ \mathrm{m}$（分米至米级）** | 极高：**$0.2 \sim 3\ \mathrm{mm}$（毫米级，高 3 个数量级）** |
| **整周模糊度与周跳** | **无整周模糊度**，单历元瞬时解算，不怕短暂失锁 | **存在整周模糊度 $N$**，连续跟踪怕失锁（易生**周跳**） |
| **电离层一阶折射符号** | 测距码群速度变慢 $\implies$ **群延迟变长（$+I$）** | 载波相速度超光速 $\implies$ **相位超前变短（$-I$）** |
| **典型工程应用场景** | 导航单点定位（SPP）、伪距 DGPS、辅助宽巷解模糊度 | 静态基线控制网、RTK / 网络 RTK、精密单点定位（PPP） |

### 【问答 11】什么是差分观测值？求差方式有哪三种？详述单差、双差、三差观测值的构造原理、误差消除效果及噪声传播规律。（作业 5.2 原题 · 12 分）

**【12分标准六点作答】**：
1. **差分观测值的定义、三种求差方式与基本原理（2分）**：
   将两个或多个同类型的原始非差观测值相减所得的线性组合虚拟观测值称为**差分观测值**。包含**接收机间求差（站间差）、卫星间求差（星间差）、历元间求差（时差）**三种基本方式。其原理是利用公共钟差参数的严格一致性及星历、大气误差在**空间和时间上的强相关性**，通过相减彻底消除公共参数并大幅削弱系统误差。
2. **单差观测值（SD：接收机间一次差 $\Delta\varphi_{ij}^p$）构造与效果（2分）**：
   同一历元两台接收机 $i, j$ 对同一颗卫星 $p$ 的观测值相减：

   $$\Delta\varphi_{ij}^p(t_1) = \frac{f}{c}\Delta\rho_{ij}^p(t_1) - f V_{t_{ij}}(t_1) - \big[\Delta N_{ij}^p - (\varphi_{0,j} - \varphi_{0,i})\big] - \frac{f}{c}(V_{\mathrm{ion}})_{ij}^p - \frac{f}{c}(V_{\mathrm{trop}})_{ij}^p$$

   **完全消除了卫星钟差 $V_{t^p}$ 与卫星端硬件延迟**，大幅削弱星历、电离层与对流层误差；但残留两站相对接收机钟差 $V_{t_{ij}}$ 及机端硬件延迟差，单差模糊度非整数。
3. **双差观测值（DD：站间星间二次差 $\Delta\varphi_{ij}^{pq}$）构造与恢复整数性原理（2分）**：
   将同历元两颗卫星 $p, q$ 的站间单差再相减：

   $$\Delta\varphi_{ij}^{pq}(t_1) = \frac{f}{c}\Delta\rho_{ij}^{pq}(t_1) - \Delta N_{ij}^{pq} - \frac{f}{c}(V_{\mathrm{ion}})_{ij}^{pq} - \frac{f}{c}(V_{\mathrm{trop}})_{ij}^{pq}$$

   因同历元不同同频卫星共用完全相同的接收机相对钟差 $-f V_{t_{ij}}(t_1)$ 和机端通道硬件延迟差 $(\varphi_{0,j}-\varphi_{0,i})$，相减后**彻底消除了接收机钟差与机端硬件延迟，使双差模糊度 $\Delta N_{ij}^{pq} \in \mathbb{Z}$ 严格恢复整数特性**，成为精密相对定位与 RTK 最核心的基本观测值。
4. **三差观测值（TD：站间星间历元间三次差 $\Delta\varphi_{ij}^{pq}(t_1, t_2)$）构造与用途（2分）**：
   将相邻两历元 $t_1, t_2$ 的双差观测值再次相减。在连续跟踪无周跳时，$\Delta N_{ij}^{pq}(t_2) = \Delta N_{ij}^{pq}(t_1)$，相减后**完全消去了双差整周模糊度未知数**；若 $[t_1, t_2]$ 发生周跳，持续的阶跃偏差在三差序列中仅表现为一个单历元孤立尖峰粗差，故三差专门用于**周跳探测修复与求取基线初始近似坐标**。
5. **差分无法消除的误差与随机噪声放大副作用（2分）**：
   差分**绝对不能消除多路径效应、接收机内部随机噪声以及天线对中/量高错误**！设非差观测值独立等精度（中误差 $\sigma$），由误差传播律知：单差噪声放大为 **$\sqrt{2}\,\sigma$**（彼此仍独立）；双差噪声放大为 **$2\,\sigma$**；三差噪声剧烈放大为 **$\sqrt{8}\,\sigma = 2\sqrt{2}\,\sigma$**。
6. **双差观测值的数学相关性与权阵处理（2分）**：
   同历元观测 $n$ 颗星（选 1 颗基准星组成 $n-1$ 个双差）时，因所有双差共用同一颗基准星观测值，协方差阵 $\boldsymbol{D}_{\mathrm{DD}} = \sigma^2\begin{bmatrix}4 & 2 & \cdots \\ 2 & 4 & \cdots \\ \vdots & \vdots & \ddots\end{bmatrix}$ 非对角元不为零，**任意两个同历元双差观测值间的相关系数恒为 $\rho = +0.5$**，严密基线平差必须采用完备协方差求逆定权 $\boldsymbol{P}_{\mathrm{DD}} \propto \boldsymbol{D}_{\mathrm{DD}}^{-1}$。

### 【问答 12】什么是周跳？周跳有哪些特征和产生原因？阐述常用的周跳探测修复方法，并说明为何现代软件普遍联合采用“M-W 组合 + GF 组合”？（作业 5.3 原题 · 12 分）

**【12分标准六点作答】**：
1. **周跳（整周跳变）的定义（2分）**：
   在载波相位连续跟踪观测期间，因信号遮挡或干扰导致接收机锁相环暂时失锁、多普勒整周计数器中断正常累加，重新锁定后使**整周计数 $\operatorname{int}(\varphi)$ 发生固定整数周 $\delta N$ 的跳变丢失，而鉴相器测定的不足一周小数相位 $\operatorname{Fr}(\varphi)$ 依然正确**的现象称为周跳。
2. **周跳的三大核心特征（2分）**：
   - ① **整周性**：跳变量严格为整数周，不影响小数部分；
   - ② **阶跃继承（累积）性**：一旦某历元发生 $\delta N$ 周跳变，若不修复，其后所有连续历元的观测值都会持续携带这一固定整周偏差（曲线呈阶跃平移，区别于单点孤立噪声）；
   - ③ **严重粗差破坏性**：哪怕仅漏修 $1$ 周周跳也会引入约 $20\ \mathrm{cm}$ 测距偏差，直接导致模糊度固定失败、基线结果报废。
3. **引起周跳的四大主要原因（2分）**：
   ① **信号物理遮挡**（树木、高楼、桥梁、隧道或山体阻断卫星视线）；② **强外界电磁干扰与电离层异常闪烁**导致信噪比跌破跟踪门限；③ **接收机载体高动态急剧机动**（加速度超出锁相环带宽）；④ **卫星高度角过低**导致信号微弱或接收机/卫星通道瞬时故障。
4. **单频与几何类周跳探测方法（屏幕扫描、高次差、多项式拟合、三差法）（2分）**：
   ① **屏幕扫描法**直观但仅能看大周跳；② **历元间高次差法**（四次差将周跳放大为 $1:-3:+3:-1$ 正负交替尖峰）与 **多项式拟合法** 单频可用，但须先组星间/双差消除接收机钟频抖动；③ **历元间三差法**将持续阶跃周跳转化为仅单历元出现的孤立粗差，结合抗差迭代降权可自动定位修复；④ **平差后残差检验法**作为最后质量防线检查微小漏检周跳。
5. **双频非差核心方法——GF 电离层残差法与 M-W 码相宽巷组合法及各自盲区（2分）**：
   - **GF 无几何组合**（$\varphi_{nm} = \varphi_1 - \frac{f_1}{f_2}\varphi_2$）：消去几何距离、全部钟差与对流层，噪声极小、探测 1 周小周跳极灵敏，但存在**比例盲区 $\Delta N_1 / \Delta N_2 = f_1 / f_2$**（如 $77:60$）；
   - **M-W 宽巷码相组合**（宽巷相位减窄巷伪距求 $N_\Delta = N_1 - N_2$）：同时消去几何距离、钟差、对流层及一阶电离层延迟，不受动态与采样率限制，但存在**等值周跳盲区 $\Delta N_1 = \Delta N_2$**！
6. **“M-W + GF”双组合盲区正交互补与唯一解算原理（TurboEdit 核心）（2分）**：
   M-W 的盲区（$\Delta N_1 - \Delta N_2 = 0$）在 GF 中必产生剧烈跳变，GF 的盲区（$\Delta N_1 - \frac{f_1}{f_2}\Delta N_2 = 0$）在 M-W 中必产生显著跳变！将两方程联立：

   $$\begin{cases} \Delta N_1 - \Delta N_2 = \Delta N_\Delta \\ \Delta N_1 - \dfrac{f_1}{f_2}\Delta N_2 = \Delta\varphi_{nm} \end{cases}$$

   系数行列式 $1 - f_1/f_2 \neq 0$ 恒满秩，不仅彻底消除了探测盲区，还能单站非差直接唯一反解出双频各自独立的整数周跳 $(\Delta N_1, \Delta N_2)$ 完成精确修复。

### 【问答 13】什么是整周模糊度？详细阐述高精度相对定位中从“浮点解”到“固定解”的四步解算全过程（含 LAMBDA 原理与 Ratio 检验）。（作业 5.3 原题 · 12 分）

**【12分标准六点作答】**：
1. **整周模糊度的物理定义与核心地位（2分）**：
   在接收机首次锁定卫星载波的初始历元 $t_0$，鉴相器只能测出不足一周的相位小数部分，无法直接获知此刻卫星至接收机间包含的**未知整周波长个数 $N$**，称为整周模糊度。在双差观测方程中消除站星两端钟差与硬件延迟后，双差整周模糊度严格具备整数特性（$\Delta N_{ij}^{pq} \in \mathbb{Z}$），能否快速准确将其固定为真整数直接决定了定位精度是分米级还是厘米/毫米级。
2. **整周模糊度求解的三大技术流派（2分）**：
   ① **观测值域法**（如用精密双频码伪距直接辅助宽巷相位取整，快但受伪距多路径限制）；② **坐标域法**（模糊度函数法 AF，不怕周跳但网格搜索计算量极大且易有多峰）；③ **模糊度域最小二乘搜索法**（FARA、**LAMBDA 算法**，充分利用完整协方差矩阵统计信息，成功率最高，为现代工程绝对主流）。
3. **第一步：常规最小二乘平差获取“浮点解（Float Solution）”（2分）**：
   构建线性化双差载波相位误差方程 $\boldsymbol{y} = \boldsymbol{A}\boldsymbol{N} + \boldsymbol{B}\boldsymbol{b} + \boldsymbol{V}$，首先**放弃 $\boldsymbol{N}$ 的整数性质约束**，将双差模糊度与基线三维坐标分量 $\boldsymbol{b}$ 一并视作普通连续实数未知数进行最小二乘平差（或卡尔曼滤波），解得实数浮点模糊度估值 $\hat{\boldsymbol{N}}$、浮点基线解 $\hat{\boldsymbol{b}}$ 及协方差阵 $\boldsymbol{Q}_{\hat{\boldsymbol{N}}}$（短时段浮点解精度仅分米级）。
4. **第二步：LAMBDA 整数 $\boldsymbol{Z}$ 变换降相关（Decorrelation）（2分）**：
   短时段或单历元 RTK 观测卫星几何变化极小，导致浮点模糊度各分量强相关，原始搜索超椭球 $(\hat{\boldsymbol{N}}-\boldsymbol{N})^{\mathrm{T}}\boldsymbol{Q}_{\hat{\boldsymbol{N}}}^{-1}(\hat{\boldsymbol{N}}-\boldsymbol{N}) \le \chi^2$ **极度狭长倾斜**，直接搜索极慢。**LAMBDA 算法**引入变换 $\bar{\boldsymbol{N}} = \boldsymbol{Z}^{\mathrm{T}}\hat{\boldsymbol{N}},\ \boldsymbol{Q}_{\bar{\boldsymbol{N}}} = \boldsymbol{Z}^{\mathrm{T}}\boldsymbol{Q}_{\hat{\boldsymbol{N}}}\boldsymbol{Z}$（保体积整数矩阵 $\boldsymbol{Z}$ 须满足 **① 元素全为整数、② $\lvert \det\boldsymbol{Z} \rvert = 1$**），将狭长椭球变换为近似正交的类球形空间，大幅压缩搜索耗时。
5. **第三步：条件最小二乘序贯搜索与第四步 Ratio 显著性检验（2分）**：
   在降相关后的正交空间内按条件方差序贯收缩搜索半径，快速找出距离浮点解马氏距离最小的**最优整数候选组 $\boldsymbol{N}_{\mathrm{opt}}^0$** 和**次优整数候选组 $\boldsymbol{N}_{\mathrm{sub}}^0$**，并执行 **Ratio 检验**：

   $$\mathrm{Ratio} = \frac{\mu_{\text{次最小}}^2}{\mu_{\min}^2} \ge k_{\text{阈值}} \quad (\text{工程常取 } 2.0 \sim 3.0)$$

   确保最优整数解显著优于次优备选解，防止“错误固定（假固定）”。
6. **回代整数真值输出高精度“固定解（Fixed Solution）”（2分）**：
   一旦通过 Ratio 检验，即将 $\boldsymbol{N}_{\mathrm{opt}}^0$ 作为**精确无误差的已知整数常数**代回原双差方程消去模糊度未知数，按 $\check{\boldsymbol{b}} = \hat{\boldsymbol{b}} - \boldsymbol{Q}_{\hat{\boldsymbol{b}}\hat{\boldsymbol{N}}}\boldsymbol{Q}_{\hat{\boldsymbol{N}}}^{-1}(\hat{\boldsymbol{N}} - \boldsymbol{N}_{\mathrm{opt}}^0)$ 修正基线向量，坐标协方差阵同步大幅收缩，定位精度一举从分米级跃升至**厘米级（动态 RTK）乃至毫米级（静态网）固定解**。

## 第四专题：定位模式、差分定位与传统 RTK / 网络 RTK（作业 5.4 全部 7 题覆盖）

### 【问答 14】简述伪距单点定位的基本原理与 DOP 精度衰减因子的几何意义（解释为何 GNSS 高程精度总低于平面精度），并对比标准单点定位（SPP）与精密单点定位（PPP）的异同。（作业 5.4 第 1 题扩展 · 12 分）

**【12分标准六点作答】**：
1. **伪距单点定位（SPP）空间距离后方交会原理（2分）**：
   利用单台接收机同步测定至多颗可见卫星的测码伪距 $\tilde{\rho}_i$，以**广播星历**解算的信号发射时刻卫星三维坐标 $(X^i, Y^i, Z^i)$ 和广播星钟差为已知起算值，按空间距离交会解算测站地心三维坐标 $(X, Y, Z)$。
2. **为什么单系统单点定位至少需要同步观测 4 颗卫星？（2分）**：
   由于接收机内置石英钟存在难以预先获知的较大钟差 $V_{t_R}$，单历元观测方程 $\tilde{\rho}_i = \sqrt{(X^i-X)^2+(Y^i-Y)^2+(Z^i-Z)^2} - cV_{t_R} + \dots$ 中共含有 **$4$ 个未知参数 $(X, Y, Z, cV_{t_R})$**，故同一瞬间**至少需同步观测 4 颗卫星**才能列满 4 个方程求解（若为 GPS+BDS 双系统融合，因增加 1 个系统间偏差 ISB 共 **5 个未知数**，至少需 **5 颗星**）。
3. **DOP 精度衰减因子的定义与四面体体积反比律（2分）**：
   线性化误差方程协因数阵 $\boldsymbol{Q} = (\boldsymbol{B}^{\mathrm{T}}\boldsymbol{B})^{-1}$ 主对角元开方定义了 **GDOP、PDOP、HDOP、VDOP、TDOP**，满足定位误差 $m = m_0 \cdot \mathrm{DOP}$ 及 $\mathrm{GDOP}^2 = \mathrm{HDOP}^2 + \mathrm{VDOP}^2 + \mathrm{TDOP}^2$。几何上 $\mathrm{GDOP}$ 与测站指向各卫星单位视线矢量端点所围成的**空间四面体体积 $V$ 成反比**——卫星在天空分布越开阔均匀，体积 $V$ 越大、DOP 值越小，定位精度越高。
4. **为什么 GNSS 高程精度总是比平面精度差（通常差 $1.5 \sim 3$ 倍）？（2分）**：
   - ① **单侧半球几何受限（主因）**：受地球本体遮挡，接收机只能观测地平线以上（上半球）卫星；水平方向卫星可在四周 $360^\circ$ 对称分布抵消误差，而垂直方向所有卫星视线分量均朝上同号，导致高程参数与接收机钟差（及对流层参数）强相关，**$\mathrm{VDOP}$ 天然大于 $\mathrm{HDOP}$**；
   - ② **大气残差与量高误差集中于高程方向**：难以彻底模型化的对流层湿延迟残差主要投影在垂向，且天线 PCO 与外业天线高量取误差 1:1 直接进入高程。
5. **精密单点定位（PPP）的核心技术机理（2分）**：
   PPP 同样仅用**单台双频/多频接收机**（无需基准站），但改用毫米级**非差载波相位 + 伪距**作为观测值，引入 **IGS 厘米级精密星历与亚纳秒级精密钟差**固定卫星端，通过无电离层组合消电离层、参数估计天顶对流层湿延迟与实数模糊度，并严密模型改正**固体潮、海潮、星站天线 PCO/PCV、天线相位缠绕与相对论效应**，实现全球单机厘米级定位。
6. **SPP 与 PPP 核心特征横向对比表（2分）**：

| 对比维度 | 标准伪距单点定位（SPP） | 精密单点定位（PPP） |
| :--- | :--- | :--- |
| **核心观测值与设备** | 单频/双频**测码伪距**；普通单机 | 双频/多频**非差载波相位 + 伪距**；测量型单机 |
| **星历与钟差起算源** | 实时导航电文**广播星历 + 广播钟差** | **IGS 精密星历（$2.5\ \mathrm{cm}$）+ 精密钟差（$75\ \mathrm{ps}$）** |
| **精细地球物理改正** | 仅改地球自转、相对论与经验大气，忽略潮汐/PCO | **必须严密改正固体潮、海潮、星站 PCO/PCV、相位缠绕** |
| **定位精度与收敛时间** | **$2 \sim 10\ \mathrm{m}$（米级）**；单历元**瞬时定位** | **静态 $1\sim 3\ \mathrm{cm}$、动态分米～厘米级**；需 **$20\sim 30\ \mathrm{min}$ 初始化收敛** |

### 【问答 15】什么是相对定位与差分定位（DGPS）？详细对比“位置差分”与“距离差分（伪距差分）”的原理、公式及优缺点。（作业 5.4 第 2、5 题原题 · 12 分）

**【12分标准六点作答】**：
1. **相对定位的定义与高精度机理（2分）**：
   在基线两端（或多点）安置接收机**同步跟踪观测相同的一组卫星**，对同步载波相位（或伪距）构造单差、双差观测方程，抵消卫星钟差和接收机钟差并大幅削弱星历、电离层与对流层等空间强相关系统误差，精确解算测站间**三维基线向量 $(\Delta X, \Delta Y, \Delta Z)$** 进而推算待定点坐标的定位模式（是控制测量与 RTK 厘米/毫米级精度的基石）。
2. **广义差分定位（DGPS）的基本思想（2分）**：
   将一台接收机安置在精确已知坐标的**基准站**上连续观测，对比已知真值与实测计算值，实时分离出具有强空间相关性的公共系统误差改正数，通过无线数据链广播给周边**流动站**修正其定位结果或原始观测值，将实时伪距定位精度提升至亚米～米级（载波相位差分 RTK 则达厘米级）。
3. **位置差分（坐标差分）的基本原理（2分）**：
   基准站利用伪距单点定位实时解算出测量坐标 $(X', Y', Z')$，与其精确已知真值 $(X_0, Y_0, Z_0)$ 比较求得**三维坐标改正数** $(\Delta X, \Delta Y, \Delta Z) = (X_0 - X', Y_0 - Y', Z_0 - Z')$ 并发送给流动站；流动站直接将自身单点定位坐标加上该三维改正数即得修正坐标。
4. **位置差分的致命工程缺陷（2分）**：
   坐标误差取决于公共测距误差与**所选卫星星座几何矩阵（DOP）**的乘积！因此位置差分**强制要求基准站与流动站必须同步观测完全相同的一组卫星**——一旦流动站因树木楼房遮挡少看一颗星导致两边星座不一致，坐标改正数就会严重失配甚至引入更大粗差，工程极少采用。
5. **距离差分（伪距差分）的基本原理与改正公式（2分）**：
   基准站利用精确已知站坐标和星历卫星坐标反算出至视场内**全部可见卫星**的真实几何距离 $\rho_i^c$，与实测伪距 $\tilde{\rho}_i$ 相减求得每颗星在参考时刻 $t_0$ 的**伪距改正数 $\mathrm{PRC}_i(t_0) = \rho_i^c - \tilde{\rho}_i$ 及其距离变化率改正数 $\mathrm{RRC}_i(t_0)$**，按标准 RTCM 格式广播；流动站在任意时刻 $t$ 按 $\tilde{\rho}_{i,\text{改}}(t) = \tilde{\rho}_i(t) + \mathrm{PRC}_i(t_0) + \mathrm{RRC}_i(t - t_0)$ 修正自身观测到的卫星伪距后再独立平差定位。
6. **距离差分相对于位置差分的三大核心优势（2分）**：
   ① **彻底解除同星座束缚**：流动站只需从基准站广播的全视场卫星改正数中挑选自己可见的任意 $\ge 4$ 颗星修正即可，城市遮挡环境下可用性极高；② 顾及了改正数随时间的变化率 $\mathrm{RRC}$，克服了数据传输延迟误差；③ 可支持广域多用户单向广播，定位精度稳定达 **$0.5 \sim 2\ \mathrm{m}$**，是海事、航空与车载米级差分的主流标准。

### 【问答 16】全面对比传统单基站电台 RTK 与网络 RTK（CORS）的工作原理及优缺点，并分别写出两者的标准外业作业流程与“不固定”排错要点。（作业 5.4 第 3、4、6、7 题四题合一压轴题 · 12 分）

**【12分标准六点作答】**：
1. **传统单基站 RTK 原理及其优缺点（2分）**：
   - **原理**：在已知点自建基准站，通过 UHF 电台实时播发载波相位观测值与站坐标，流动站实时组**载波相位双差方程**并用 **OTF（LAMBDA）算法**在数秒内固定整周模糊度，实时获厘米级坐标；
   - **优缺点**：**优点**是实时厘米级（平面 $1\sim 2\ \mathrm{cm}$、高程 $2\sim 3\ \mathrm{cm}$）、无需点间通视、现场质检效率高；**缺点**是**作用距离短（$<10\sim 15\ \mathrm{km}$）**、随站距增大大气去相关导致精度线性衰减、电台易受地形建筑遮挡干扰、每次须耗费人力**自行架设并看守基准站**且单站无多余检核。
2. **网络 RTK（CORS）原理及其四大优势（2分）**：
   - **原理**：区域内按 **$50 \sim 100\ \mathrm{km}$** 站距建设多座永久连续运行参考站，控制中心实时固定整网基站模糊度，**解算建立区域电离层、对流层和星历残差空间内插模型**，通过 **VRS（虚拟参考站，双向发 GGA 生成旁侧虚拟站）/ MAC / FKP** 经 4G/5G 网络向流动站播发虚拟差分流；
   - **四大优势**：① **覆盖广**（站距扩大至 $50\sim 100\ \mathrm{km}$）；② **全网精度均匀一致**（$1\sim 3\ \mathrm{cm}$，消除距离衰减）；③ **单人单机轻便作业，免自建看守基站**；④ 多基站冗余完好性监控，可靠性极高（仅依赖移动通信信号）。
3. **传统单基站电台 RTK 六步标准外业流程（2分）**：
   `① 测前选点准备`（选地势高、视野开阔、无反射与强电磁干扰点作基站）$\longrightarrow$ `② 架设配置基准站`（对中整平、精确量天线高，设基站坐标、RTCM 格式及电台频率功率并启动发射）$\longrightarrow$ `③ 组装配置流动站`（手簿建工程设椭球与中央子午线，电台调至与基站完全同频段同协议）$\longrightarrow$ `④ OTF 初始化获固定解`（开阔处等待单点 $\to$ 浮点 $\to$ **固定解 Fixed**）$\longrightarrow$ `⑤ 求转换参数（点校正）与已知点检核`（联测 $\ge 3$ 个均匀控制点求四参数+高程拟合，赴独立已知点检核合限）$\longrightarrow$ `⑥ 碎部采点/放样与导出收工`。
4. **网络 RTK（CORS）五步标准外业流程（含南方手簿实操关键项）（2分）**：
   `① 准备单机与网络`（组装流动站主机+对中杆+手簿，确认 CORS 账号有效、SIM 卡/热点网络畅通）$\longrightarrow$ `② 新建工程配坐标系`（设 CGCS2000 椭球、高斯投影带中央子午线、截止角 $10^\circ\sim 15^\circ$ 并开启电子气泡）$\longrightarrow$ `③ 配置移动站网络数据链与 CORS 登录`（数据链切为移动网络/手簿网络，填 IP/域名、**对应坐标框架端口如 8003 对应 CGCS2000**、账号密码，获取源列表选五星十六频挂载点如 `RTCM33GRCEJ` 登录并开启自动发 GGA）$\longrightarrow$ `④ 秒级获固定解并已知点检核`（差分延迟 $1\sim 2\ \mathrm{s}$，获 **固定解 Fixed** 后务必先到测区已知控制点实测检核）$\longrightarrow$ `⑤ 全测区采集放样与备份导出`。
5. **外业常见故障排错一：一直卡在“单点解” vs 长期卡在“浮点解”（2分）**：
   - **卡“单点解”（无差分延迟）**：通信链路未通——排查电台掉电/频段协议不一致，或网络 RTK 的 SIM 卡断网、IP/端口/密码输错、未获取选中挂载点、未开启上传 NMEA-GGA；
   - **有差分但卡“浮点解”不固定**：卫星遮挡严重（树林/高楼峡谷）、水面幕墙强多路径、高压线干扰导致周跳频发，或单基站超距（$>15\ \mathrm{km}$）——应移至开阔处重初始化并切换全星座多频挂载点。
6. **外业常见故障排错二：显示“固定解”但已知点检核偏差数分米至数米（2分）**：
   原因包括：① 高斯投影**中央子午线或带号设错**；② **CORS 端口坐标框架选错**（如把 ITRF/WGS84 端口当 CGCS2000 用）；③ 四参数/七参数点校正选用了变形点；④ 单基站误用“单点自动启动”或三脚架被踢动；⑤ 遮挡边缘偶发模糊度**假固定（False Fix）**，需重置 RTK 解算引擎复测核对。

## 第五专题：控制网设计、外业规范、内业质检与 GPS 水准（作业 6～9 + 实验核心）

### 【问答 17】阐述 GNSS 静态控制网的布设原则、四种同步图形扩展连接方式对比，以及野外选点与外业观测关键技术规范。（控制网作业 + 外业实验必考 · 12 分）

**【12分标准六点作答】**：
1. **GNSS 控制网五大核心布设原则（2分）**：
   ① 分级布网、逐级控制（A～E 五级），构成独立异步闭合图形以保障高可靠性（每点至少连 $\ge 3$ 条独立基线，严禁单基站星形网用于等级控制网）；② 点间无需光学通视，但为便于后续全站仪测量常布设距离 **$\ge 300\ \mathrm{m}$ 的通视方位点**；③ 与不少于 **$3 \sim 5$ 个高等级原有地面控制点重合联测且均匀包围全网**；④ 均匀联测包围测区的水准点作 GPS 水准公共点；⑤ 最简独立环边数严守规范上限（C 级 $\le 6$、D 级 $\le 8$、E 级 $\le 10$）。
2. **同步图形扩展的四种连接方式优劣对比（2分）**：
   - **点连式**（相邻时段仅 $1$ 个公共点）：推进效率最高，但图形强度最弱，连接点出错则全网断裂；
   - **边连式**（相邻时段共享 $1$ 条公共边即 $2$ 个公共点）：自然形成大量异步三角/四边形闭合环，**兼顾高效率与高可靠性，是工程控制网首选方案**；
   - **网连式**（重叠 $\ge 3$ 个公共点）：图形强度与可靠性最高，但迁站推进最慢（用于高精度形变监测网）；
   - **混连式**：点连、边连、网连因地制宜结合，大中型复杂地形控制网最普遍采用。
3. **野外选点六大铁律（2分）**：
   ① 对空视场开阔，四周高度角 **$15^\circ$ 以上无成片障碍物**；② 远离大面积水面、玻璃幕墙等强反射物防多路径；③ 远离电磁干扰源（距大功率发射台 $\ge 200\ \mathrm{m}$，距高压输电线 $\ge 50\ \mathrm{m}$）；④ 土质坚实稳固、易于长期保存；⑤ 交通便利宜于架站；⑥ 测站局部微气象与大环境一致。
4. **外业仪器架设、指北与同点连测强制重架规定（2分）**：
   作业前严格对中（误差 $\le 1\sim 2\ \mathrm{mm}$）、整平；**所有接收机天线指北标志线必须统一指向正北（偏差 $\le \pm 5^\circ$）**以抵消同型号天线水平 PCO 偏差；若同一测站连续观测两个时段，**两时段之间必须重新对中、整平、定向并重测天线高**，严禁原封不动连测掩盖安置粗差！
5. **外业基本观测技术参数与天线高双检核制度（2分）**：
   C/D/E 级截止高度角设 **$15^\circ$**（B 级 $10^\circ$），同步有效卫星数 **$\ge 4$ 颗**（$\mathrm{PDOP} \le 6$），采样间隔 **$10 \sim 30\ \mathrm{s}$**；天线高必须沿圆周互成 $120^\circ$ 三个方向并在**开机前、关机后各量测一次，互差均须 $\le 3\ \mathrm{mm}$** 取均值记录。
6. **时段观测期间严守“五不准”纪律（2分）**：
   正式记录期间严禁：① 关闭接收机又重新启动；② 执行仪器自测试；③ 擅自更改卫星截止高度角与采样间隔；④ 移动天线或触碰震动三脚架；⑤ 按动关闭文件或删除数据键（且天线 $10\ \mathrm{m}$ 内禁用对讲机、$50\ \mathrm{m}$ 内禁用电台）。

### 【问答 18】详述静态基线解算的质量检核指标（重点剖析同步环与异步环的本质区别）、无约束平差与约束平差的作用，以及三类高程关系与 GPS 水准转换方法。（内业实验 + 高程作业综合题 · 12 分）

**【12分标准六点作答】**：
1. **单条基线解算初步质量判据——Ratio 值与 RMS（2分）**：
   ① **Ratio 值**（次最小方差与最小方差之比）：检验双差整周模糊度固定可靠性，工程要求 **$\mathrm{Ratio} \ge 3.0$（或 $\ge 2.0$）** 且解类型为固定解；② **RMS（观测值验后均方根残差）**：反映观测噪声与多路径水平，越小说明数据越干净（双差相位一般应 $< 1\sim 2\ \mathrm{cm}$）。
2. **核心必考对比：同步环闭合差 vs 异步环（独立环）闭合差的本质区别（2分）**：
   - **同步环**（同时段同步基线闭合环，限差 $W_S \le \frac{3}{5}\sigma$）：因各边采用同一时段同源观测值，**理论闭合差恒等于 $0$**；它**只能检核内业基线解算软件和单基线数据同步性，绝对发现不了量错天线高、对中偏心或上错点位等外业粗差**！
   - **异步环**（不同时段独立基线构成的闭合环，限差 $W_S \le 3\sqrt{3n}\sigma$）及**复测基线较差**（$d_s \le 2\sqrt{2}\sigma$）：能**全面暴露外业对中、量错天线高、多路径、大气残差与周跳修复失败等真实内外业误差**，是评定控制网外业质量最根本的铁证。
3. **三维无约束平差与约束平差的两步质检逻辑（2分）**：
   - **第一步三维无约束平差**：仅固定 1 点坐标提供位置基准，不引入外部尺度与方位约束，纯粹检验 **GNSS 基线网自身内符合精度**并按 $\lvert V \rvert \le 3\sigma$ 剔除基线粗差；
   - **第二步约束平差**：引入外部多个已知控制点强制约束转换至实用坐标系；若无约束平差合格而约束平差精度暴跌（$\lvert \mathrm{d}V \rvert > 2\sigma$），说明**外部已知起算点含有粗差或变形**，可通过轮换固定不同起算点组合定位剔除问题已知点。
4. **三大高程系统定义与核心数学转换关系（2分）**：
   - **大地高 $H$**：沿参考椭球法线至**参考椭球面**的纯几何高程（GNSS 直接测得）；
   - **正高 $H_g$**：沿真实铅垂线至**大地水准面**的距离（因地壳真实平均重力难测准而难严密求定，$H = H_g + N$）；
   - **正常高 $H_\gamma$（或 $H^*$）**：沿铅垂线至**似大地水准面**的距离（**我国 1985 国家高程基准法定系统**），满足核心公式 **$H = H_\gamma + \zeta$**（$\zeta$ 为高程异常）。
5. **为什么法线与铅垂线存在垂线偏差仍可直接相加减？（2分）**：
   铅垂线与椭球法线夹角（垂线偏差 $\theta$）极小（平地几角秒，高山最大 $< 60''$），不重合引起的余弦投影长度差 $H(1 - \cos\theta)$ 即使在 $5000\ \mathrm{m}$ 高山也 **小于 $0.1\ \mathrm{mm}$**，远小于水准与 GNSS 毫米级测量误差，故线性加减可视作严密成立。
6. **将 GNSS 大地高转换为实用正常高的三种工程方法（2分）**：
   ① **GPS 水准曲面拟合法**（中小测区最常用：联测均匀包围测区的公共水准点算 $\zeta_i = H_i - H_{\gamma,i}$，重心化后用**平面拟合［至少 3 个不共线点］**或**二次曲面拟合［至少 6 个点］**内插待定点 $\hat{\zeta}_P$，求 $\hat{H}_{\gamma,P} = H_P - \hat{\zeta}_P$）；② **区域/省市似大地水准面精化格网模型直接内插法**；③ **物理大地重力测量法**（Molodensky 重力积分法，结合 GNSS 与重力数据精化大区域似大地水准面）。</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
