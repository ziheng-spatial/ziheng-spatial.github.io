## 一、名词解释（共 6 小题，每小题 5 分，共 30 分）

### 1. ☆ 地物反射率与漫反射（朗伯体）（5 分）

> **【参考答案与分步采分点】**：
> 1. **定义与公式**（1.5 分）：地物反射率是表征地表物体反射电磁辐射能力的无量纲参数，定义为反射辐射通量与入射辐射通量之比 $\rho = \Phi_\rho / \Phi_0$，分谱表示为光谱反射率 $\rho(\lambda) = \Phi_\rho(\lambda) / \Phi_0(\lambda)$；
> 2. **漫反射与朗伯体机理**（2 分）：当表面粗糙度满足起伏均方根高度 $h \ge \lambda$ 时，入射电磁波向半球空间各方向均匀散射称为**漫反射**；其中各个方向辐射亮度 $L$ 均相等、辐射强度遵循朗伯余弦定律 $I(\theta) = I_0\cos\theta$ 的理想漫反射面称为**朗伯体**；
> 3. **遥感意义**（1.5 分）：朗伯体观测亮度不受观测视角影响，是构建地物光谱反射曲线进行植被/水体/岩矿识别与大气辐射校正的物理基础。

### 2. ☆ 地面控制点（GCP）（5 分）

> **【参考答案与分步采分点】**：
> 1. **本质定义**（1 分）：在待校正遥感影像与标准参考地图（或实地 GNSS 测量）上均能清晰识别定位的同名固定地物标志点；
> 2. **双坐标与选点原则**（2 分）：每个 GCP 同时具有原始影像行列坐标 $(x, y)$ 与地面地理参考坐标 $(X, Y)$，选点需满足**标志明显、位置稳定、分布均匀、高程相近及数量冗余**五原则（$n$ 次多项式至少需 $\frac{(n+1)(n+2)}{2}$ 对）；
> 3. **核心工程作用**（2 分）：通过最小二乘平差求解多项式变换系数，消除非系统几何畸变、实现地理编码与多源配准，并借独立检核点计算 RMSE 均方根误差评定校正精度。

### 3. ☆ 图像灰度直方图（5 分）

> **【参考答案与分步采分点】**：
> 1. **统计定义**（1 分）：描述数字图像中各灰度级与其像元出现频数或概率密度对应关系的离散统计函数图表；
> 2. **频率公式与三大性质**（2 分）：设总像元数为 $N$、灰度级 $r_k$ 像元数为 $n_k$，则频率 $P(r_k) = n_k / N$，具备**非负归一化性（$\sum P(r_k)=1$）、空间位置无关性（不同图像可同直方图）及子图可加性**；
> 3. **遥感应用**（2 分）：用于直观诊断偏暗/偏亮/低反差等图像质量，指导双峰波谷阈值分割、直方图均衡化/规定化增强及 DOS 暗目标大气去霾校正。

### 4. ☆ 图像融合（5 分）

> **【参考答案与分步采分点】**：
> 1. **定义**（1 分）：将同一区域多传感器获取的多幅配准遥感影像（如高空间分辨率全色 PAN 与多光谱 MS，或光学与 SAR）按一定算法综合生成新合成图像的数字图像处理技术；
> 2. **三个逻辑层次与代表方法**（2 分）：按信息抽象程度分为**像元级（像素级）**（如 IHS、Brovey、PCA、Gram-Schmidt）、**特征级**与**决策级**融合；
> 3. **工程目的**（2 分）：打破传感器空间分辨率与光谱分辨率的互斥瓶颈，生成兼备高空间细节纹理与丰富光谱信息的影像，提升目视解译与分类精度。

### 5. 比辐射率（发射率 $\varepsilon$）与亮温（5 分）

> **【参考答案与分步采分点】**：
> 1. **比辐射率定义与基尔霍夫定律**（2 分）：同温度、同波长下实际物体辐射出射度 $M$ 与绝对黑体辐射出射度 $M_0$ 之比称为比辐射率 $\varepsilon(\lambda) = M / M_0$；由基尔霍夫定律有 $\varepsilon(\lambda) = \alpha(\lambda)$，不透明物体满足 $\varepsilon(\lambda) = 1 - \rho(\lambda)$；
> 2. **亮度温度 $T_B$ 定义**（1.5 分）：传感器直接测得的热辐射能量假定地表为绝对黑体（$\varepsilon = 1$）换算出的等效温度（热红外 $M=\varepsilon\sigma T^4=\sigma T_B^4$，即 $T_B = \varepsilon^{1/4} T < T$）；
> 3. **热红外应用**（1.5 分）：比辐射率是区分岩矿类型并结合 $T_B$ 反演真实地表温度（LST）的关键物理参数。

### 6. 太阳同步轨道（5 分）

> **【参考答案与分步采分点】**：
> 1. **轨道类型**（1 分）：陆地资源与环境监测卫星最常用的近极地、近圆形逆行卫星轨道（如 Landsat、Sentinel-2、GF-1/2/6）；
> 2. **物理实现机理**（2 分）：将轨道倾角精确设计在 $98^\circ\sim 99^\circ$ 左右，利用地球扁率摄动使轨道平面绕地轴进动角速度恰好等于地球绕太阳公转平均角速度（约 $0.9856^\circ/\text{d}$），保持轨道面与日地连线夹角恒定；
> 3. **遥感优势**（2 分）：保证卫星每次过境同一纬度地区时地方太阳时基本一致（如 Landsat 约上午 10:00），使不同时期影像光照与阴影条件高度可比，极利于多时相动态变化检测。

## 二、问答题（共 8 小题，每小题 5 分，共 40 分）

### 7. ☆ 写出地物光谱反射率定义式，并从表面粗糙度条件、空间反射规律与遥感影像表现三方面系统辨析四种反射型式。（5 分）

> **【参考答案与分步采分点】**：
> 1. **定义与公式**（1 分）：光谱反射率是特定波长 $\lambda$ 处物体反射辐射通量与入射辐射通量之比，即 $\rho(\lambda) = \frac{\Phi_\rho(\lambda)}{\Phi_0(\lambda)}$。
> 2. **镜面反射**（1 分）：表面极为光滑（起伏高度 $h \ll \lambda$），遵循入射角等于反射角单向反射；平静水面在斜视雷达上无回波呈**纯暗黑色**，在光学顺光向产生太阳耀斑。
> 3. **漫反射（朗伯体）**（1 分）：表面足够粗糙（$h \ge \lambda$），向半球空间均匀散射；理想朗伯体各向辐射亮度 $L$ 相等（$I(\theta)=I_0\cos\theta$），观测亮度不受传感器观测倾角影响。
> 4. **方向反射**（1 分）：$h$ 与 $\lambda$ 可比且具三维冠层结构（绝大多数自然植被、波浪水面），兼具镜面与漫反射特性，反射率随太阳角和观测角各向异性变化（由 BRDF 刻画）。
> 5. **直角角反射**（1 分）：城市建筑墙面与地面等两个或三个互相垂直的光滑平面使入射雷达波经多次镜面反射后**沿原路径逆向强烈返回**，在 SAR 图像上形成极亮白色点/线靶标。

### 8. ☆ 按波长由短到长写出微波遥感八大子波段序列，并阐述微波遥感的优势、微波辐射的瑞利-金斯特征及主要局限性。（5 分）

> **【参考答案与分步采分点】**：
> 1. **微波波段范围与八大字母序列**（1 分）：波长范围 $1\ \mathrm{mm}\sim 1\ \mathrm{m}$，按波长由短到长依次为 **$Ka - K - Ku - X - C - S - L - P$**（星载 SAR 主力多用 $X, C, L$ 波段）。
> 2. **穿云透雾、全天候与全天时优势**（1 分）：微波波长远大于云雾雨滴粒径，大气透过率近 $100\%$ 实现全天候观测；主动雷达自带发射源不受太阳光照限制实现全天时成像。
> 3. **穿透与介电敏感探测优势**（1 分）：可穿透干燥沙土、积雪与稀疏植被（波长越长穿透越深，如 $L/P$ 波段），且后向散射对表面粗糙度、几何结构及含水量（水复介电常数 $\sim 80$ 远高于干土 $3\sim 4$）极为敏感。
> 4. **微波辐射特征——瑞利-金斯线性近似**（1 分）：长波低温满足 $hc \ll \lambda k T$，普朗克公式退化为瑞利-金斯近似，辐射亮度与温度呈一次线性正比，实际物体亮温满足简洁线性关系 **$T_B = \varepsilon \cdot T$**（且地物微波发射率变幅显著大于热红外）。
> 5. **主要局限性**（1 分）：天然微波热辐射能量微弱致被动辐射计空间分辨率较粗（公里级）；主动 SAR 存在乘性**相干斑噪声**与**斜距侧视地形畸变**（透视收缩、叠掩、阴影）。

### 9. ☆ 阐述图像灰度直方图的三大数学性质，并说明直方图在质量诊断、图像分割与去霾大气校正中的核心应用。（5 分）

> **【参考答案与分步采分点】**：
> 1. **归一化与非负性质**（1 分）：离散概率密度 $P(r_k) = n_k / N \ge 0$，且全灰度级累计和严格等于 $1$（$\sum_{k=0}^{L-1} P(r_k) = 1$）。
> 2. **空间位置无关性（多对一映射）**（1 分）：直方图仅统计灰度全局频数分布，丢失像元空间位置与拓扑结构——打乱像素位置直方图完全不变，不同空间内容影像也可具有同一直方图。
> 3. **子图可加性**（1 分）：将图像划为若干互不重叠子区域时，整幅图像各灰阶的频数直方图严格等于各子区域对应灰阶频数之和。
> 4. **质量诊断与双峰阈值分割**（1 分）：波形左偏为偏暗、右偏为偏亮、窄尖峰为低反差；含水体与陆地两类典型地物呈双峰时，**两峰之间的波谷灰度即为二值分割最佳阈值**。
> 5. **均衡化增强与 DOS 去霾校正**（1 分）：累计直方图（CDF）驱动直方图均衡化（拉大主体反差）与直方图匹配（消除镶嵌色差）；暗目标最小值非零截距用于 **DOS 暗目标法**扣除大气程辐射去霾。

### 10. ☆ 简述遥感数字图像几何畸变的内外来源，并阐述多项式间接法几何精校正的原理及 GCP 选点五原则与主要作用。（5 分）

> **【参考答案与分步采分点】**：
> 1. **内部与外部几何畸变来源**（1 分）：**内部误差**源自镜头畸变、探测元排列不均及扫描速率抖动；**外部误差**包括成像投影变形（全景畸变、斜距压缩）、平台轨道姿态角变化、地形起伏视差、**地球曲率**、**地球自转偏斜**（使极轨整景扭曲成平行四边形）及大气折射。
> 2. **多项式间接法几何精校正思路**（1 分）：回避复杂物理成像参数，用二维 $n$ 次多项式直接拟合标准地理坐标 $(X,Y)$ 与原图坐标 $(x,y)$ 映射关系；从输出规则地理网格 $(X,Y)$ 逐点反算原图浮点坐标 $(x,y)$ 并重采样，**彻底避免输出图像出现空白空洞或像素重叠**。
> 3. **GCP 选点五原则**（1 分）：必须坚持**标志清晰明显（路交角/坝角）、位置稳定不变、空间分布均匀（含四角与中心）、高程相近（无 DEM 时）及数量留有冗余**（二次多项式至少 6 对，整景常用 $\sim 30$ 对）。
> 4. **GCP 核心作用一（求解模型与消除非系统变形）**（1 分）：作为已知同名观测对按最小二乘平差解算多项式系数，吸收消除轨道漂移、姿态变化与自转残余非系统畸变。
> 5. **GCP 核心作用二（地理编码与 RMSE 质控）**（1 分）：将影像精确配准至标准地图投影坐标系，保障多时相变化检测与 GIS 叠合，并预留独立检核点计算均方根误差（RMSE）检验校正精度。

### 11. ☆ 对比像素级图像融合中 IHS 变换法、Brovey 比值法与 PCA 主成分法的处理步骤、波段限制及光谱保真特点。（5 分）

> **【参考答案与分步采分点】**：
> 1. **融合目的与三层次简述**（1 分）：融合高分全色 PAN 与低分多光谱 MS 以兼顾高空间分辨率与多光谱特性，分为**像元级、特征级、决策级**三层次。
> 2. **IHS 变换融合法**（1.5 分）：将 3 波段 MS 从 RGB 正变换为明度 $I$、色调 $H$、饱和度 $S$，把 PAN 与 $I$ 直方图匹配后**替换分量 $I$** 再逆变换回 RGB。**特点**：空间纹理极清晰，但**限 3 波段**且因光谱响应差异致**色彩（尤以植被）光谱失真较大**。
> 3. **Brovey 比值融合法**（1 分）：按 $B'_i = A \cdot PAN \cdot \dfrac{B_i}{B_R + B_G + B_B}$ 乘性加权并重采样。**特点**：运算最快、边缘反差高，但**限 3 波段**且改变辐射绝对值（仅保持波段比值）。
> 4. **PCA 主成分融合法**（1.5 分）：对任意 $n$ 个 MS 波段做 PCA 变换得 $PC_1\dots PC_n$，将 PAN 匹配均值方差后**替换第一主分量 $PC_1$** 再逆变换。**特点**：**支持任意 $n$ 波段**，光谱差异保存在 $PC_2\dots PC_n$ 中，**光谱保真明显优于 IHS**（工程定量常用更优的 Gram-Schmidt 法）。

### 12. 对比大气散射的三种物理类型，分析大气散射对遥感真彩色成像的影响及工程避害去霾对策。（5 分）

> **【参考答案与分步采分点】**：
> 1. **瑞利散射（Rayleigh）**（1 分）：气体分子粒径远小于波长（$a \ll \lambda$），散射强度 $I \propto \lambda^{-4}$，短波散射极强（解释晴空呈蔚蓝色）。
> 2. **米氏散射（Mie）**（1 分）：气溶胶、烟尘霾粒粒径与波长同数量级（$a \approx \lambda$），散射强度约 $I \propto \lambda^{-2}$，主导雾霾衰减。
> 3. **无选择性散射（均匀散射）**（1 分）：云滴、雾滴粒径远大于波长（$a \gg \lambda$），散射强度 $I \propto \lambda^0$ 与波长无关，云雾呈灰白色并阻断光学观测。
> 4. **对真彩色成像的不利影响**（1 分）：散射产生不携带地表信息的**大气程辐射**叠加在影像上降低对比度；因蓝光波长最短，瑞利散射最强，导致真彩色影像整体**发蓝偏灰**。
> 5. **工程避害与去霾对策**（1 分）：传感器舍弃紫/紫外波段，利用长波红外（SWIR）透霾或改用微波 SAR 穿云；定量处理采用 **6S/FLAASH 辐射传输模型、波段回归分析法或 DOS 暗目标直方图减法**剥离程辐射。

### 13. 对比光学机械摆扫式与固体线阵推扫式多光谱传感器的成像机理与性能优劣，并说明空间与光谱分辨率的内在矛盾及解决途径。（5 分）

> **【参考答案与分步采分点】**：
> 1. **光学机械摆扫式（物面扫描）**（1 分）：靠机械扫描镜横向逐像元摆扫、配合平台飞行成面（代表：Landsat MSS/TM/ETM+、MODIS）；全行共用少量探测器故**辐射一致性好**，但单像元驻留短致**信噪比低**、机械磨损致**几何稳定性较差**（有全景畸变）。
> 2. **固体线阵推扫式（像面扫描）**（1.5 分）：取消扫描镜，由焦平面长线阵 CCD 对整行同时曝光并随平台推扫成面（代表：Landsat-8/9 OLI、Sentinel-2 MSI、GF-1/2/6）；整行同步积分使**信噪比高、几何稳定性高、寿命长**，但上万像元定标微差易致**辐射一致性略低（垂直条带）**。
> 3. **空间与光谱分辨率的能量互斥矛盾**（1.5 分）：单个探测元捕获的入射能量 $E \propto \mathrm{IFOV}^2 \cdot \Delta\lambda \cdot \Delta t$；提高光谱分辨率（减小 $\Delta\lambda$）势必减少入射能量，为维持信噪比不得不增大瞬时视场角 $\mathrm{IFOV}$ 而降低空间分辨率。
> 4. **矛盾解决途径**（1 分）：① 采用线阵推扫及高灵敏度探测器延长积分驻留时间 $\Delta t$；② 借全色高分影像与多光谱/高光谱影像**图像融合**协同突破。

### 14. 阐述频率域增强中“低频信息”与“高频信息”分别代表的图像内容，并对比频率域低通/高通滤波与空间域中值滤波、拉普拉斯锐化的处理效果。（5 分）

> **【参考答案与分步采分点】**：
> 1. **频率域低频信息的物理意义**（1 分）：位于二维傅里叶频谱中心区域，代表图像中灰度变化平缓、空间跨度大的**整体亮度背景、大面积均质图斑与宏观趋势**。
> 2. **频率域高频信息的物理意义**（1 分）：位于频谱外围区域，代表灰度剧烈跳变的**地物边缘轮廓、道路断裂带、精细纹理细节以及随机/周期性噪声**。
> 3. **频率域低通滤波 vs 高通滤波效果**（1.5 分）：**低通滤波**让低频通过、阻挡高频，使随机噪声减弱但边缘趋于模糊（频域平滑）；**高通滤波**让高频通过、削弱低频平坦背景，显著锐化边缘细节（频域锐化，另陷波滤波可精准去周期条带）。
> 4. **空间域中值滤波效果**（0.75 分）：非线性排序取中位数替代中心像素，在彻底滤除孤立**椒盐脉冲噪声**的同时能较好**保护地物边缘不被模糊**。
> 5. **空间域拉普拉斯（Laplace）锐化效果**（0.75 分）：各向同性二阶微分模板（系数和为 0），平坦区输出为 0、仅在突变边缘响应强烈，常叠加原图突出线状地物与构造边界。

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
