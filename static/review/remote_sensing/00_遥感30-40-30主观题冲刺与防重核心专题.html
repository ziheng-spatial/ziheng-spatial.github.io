## 模块一：高频名词解释（6 题 × 5 分 = 30 分 · ☆ 必考置顶）

> **5 分三段式作答模板**：① **本质属类**（1 分：先定性属于什么物理量/几何模型/技术方法）＋ ② **物理/数学机理或公式**（2 分：写出核心定义式、波段或判定条件）＋ ③ **遥感意义与典型对比**（2 分：说明影像表现、局限性或工程应用）。

### 1.1 ☆ 地物反射率与四种反射型式（第 2 章 2.3.1，p.37 必考置顶）

* **5 分满分背诵版**：地物反射率是表征地表物体反射电磁辐射能力的无量纲光学参数，定义为反射辐射通量与入射辐射通量之比 $\rho = \Phi_\rho / \Phi_0$，分谱表示为光谱反射率 $\rho(\lambda) = \Phi_\rho(\lambda) / \Phi_0(\lambda)$。依表面粗糙度 $h$ 与波长 $\lambda$ 的关系分为：镜面反射（$h \ll \lambda$，遵循反射角等于入射角，平静水面在雷达上呈暗黑）、漫反射/朗伯体（$h \ge \lambda$，向半球均匀散射且辐射亮度 $L$ 与观测角无关）、方向反射（自然地物非朗伯各向异性 BRDF）及角反射（二/三面角原路强回波）。它是植被/水体/岩矿遥感识别与传感器波段设计的物理基础。
* **【5 分采分拆解】**：① 反射率无量纲参数及光谱反射率公式 $\rho(\lambda) = \Phi_\rho(\lambda) / \Phi_0(\lambda)$（1 分）；② 镜面反射、漫反射（朗伯体各向亮度相等）、方向反射与角反射的粗糙度条件及反射规律（2 分）；③ 解释水面暗黑/城镇角反射亮斑与地物光谱识别的物理基础（2 分）。

### 1.2 ☆ 地面控制点（GCP）（第 7 章 7.3，p.186 必考置顶）

* **5 分满分背诵版**：地面控制点（Ground Control Point, GCP）是在待校正遥感影像与标准参考地图（或 GNSS 实测坐标）上均能清晰识别定位的同名标志点。每个控制点同时具备原始影像行列坐标 $(x, y)$ 与地面地理参考坐标 $(X, Y)$，选点须遵循特征明显、位置稳定、分布均匀、高程相近及数量冗余原则（如二次多项式至少 6 对）。GCP 的核心作用是通过最小二乘平差解算多项式变换系数、消除影像非系统几何畸变、实现地理编码与多源配准，并借独立检核点检验均方根误差（RMSE）。
* **【5 分采分拆解】**：① 影像与参考图上同名标志点定义，兼有 $(x, y)$ 与 $(X, Y)$ 双坐标（1 分）；② 最小二乘解算变换系数、至少 $N_{\min} = (n+1)(n+2)/2$ 对及五大选点原则（2 分）；③ 消除非系统畸变、实现地图地理配准与 RMSE 精度检验的核心作用（2 分）。

### 1.3 ☆ 归一化植被指数（NDVI）（第 7 章 7.4.4，p.205 必考置顶）

* **5 分满分背诵版**：归一化植被指数（NDVI）是利用红光波段与近红外波段反射率非线性组合构建的表征绿色植被覆盖度与活力的无量纲光谱指数。其计算公式为 $\text{NDVI} = (\rho_{\text{NIR}} - \rho_{\text{Red}}) / (\rho_{\text{NIR}} + \rho_{\text{Red}})$，基于植物叶绿素在红光波段强烈吸收、海绵组织在近红外波段强烈反射的机制，理论取值范围为 $[-1, 1]$（健康植被多为 $0.2 \sim 0.8$，裸土近 $0$，水体常为负值）。归一化比值有效削弱了太阳高度角与地形阴影干扰，广泛用于植被物候、长势及旱情监测，但在高覆盖度森林区易出现饱和。
* **【5 分采分拆解】**：① 表征植被长势与覆盖度的无量纲光谱指数（1 分）；② 公式 $\text{NDVI} = (\rho_{\text{NIR}} - \rho_{\text{Red}}) / (\rho_{\text{NIR}} + \rho_{\text{Red}})$、取值 $[-1, 1]$ 及红光吸收/近红外反射机理（2 分）；③ 削弱地形与光照干扰，服务农林旱情监测，高生物量易饱和（2 分）。

### 1.4 ☆ 图像灰度直方图（第 7 章 7.1.2，p.180 必考置顶）

* **5 分满分背诵版**：图像灰度直方图是描述数字图像中各灰度级与其像元出现频数或概率密度对应关系的离散统计函数图表。设图像总像元数为 $N$、灰度级 $r_k$ 出现像元数为 $n_k$，则频率 $P(r_k) = n_k / N$，满足归一化性质 $\sum P(r_k) = 1$、子图可加性及空间位置无关性（不同图像可对应同一直方图）。它能直观诊断图像偏暗、偏亮或低反差等质量缺陷，并作为双峰波谷图像阈值分割、直方图均衡化非线性拉伸及多幅镶嵌直方图匹配的定量依据。
* **【5 分采分拆解】**：① 反映灰度级与像元概率/频数关系的统计直方图（1 分）；② 频率公式 $P(r_k) = n_k / N$ 及归一化、空间无关、可加性三大性质（2 分）；③ 诊断图像反差质量、确定分割阈值及指导均衡化/匹配增强（2 分）。

### 1.5 ☆ 图像融合（第 7 章 7.4.5，p.206 必考置顶）

* **5 分满分背诵版**：图像融合（信息融合）是将同一区域多传感器获取的多幅影像（如高空间分辨率全色 PAN 与多光谱 MS，或光学与 SAR 影像）在严格配准后按一定算法整合生成新合成图像的数字图像处理技术。按融合抽象程度分为像元级（像素级）、特征级与决策级三个层次，常用像元级算法包括 IHS 变换法、Brovey 比值法、PCA 主成分法及 Gram-Schmidt 变换法。图像融合旨在克服传感器空间分辨率与光谱分辨率的互斥矛盾，生成兼具高空间纹理细节与丰富光谱信息的影像，提升目视解译与计算机分类精度。
* **【5 分采分拆解】**：① 多传感器/多源影像协同整合成新图像的技术（1 分）；② 像元级（像素级）/特征级/决策级三层次及 IHS、Brovey、PCA 等代表算法（2 分）；③ 解决空间与光谱分辨率矛盾，提高清晰度、几何精度与分类精度（2 分）。

### 1.6 遥感（广义与狭义概念）（第 1 章，p.1）

* **5 分满分背诵版**：遥感（Remote Sensing, RS）在广义上泛指一切无接触的远距离探测技术；狭义（课程标准定义）则指在高空和外层空间的各种平台上，运用各类传感器获取反映地球表面特征的电磁波数据，通过传输、变换与计算机处理提取有用信息，从而研究地物空间形状、位置、性质及其与环境相互关系的现代应用技术科学。遥感按平台分为地面/航空/航天，按工作方式分为主动与被动，具有大范围宏观同步、多波段高时效动态监测的显著优势。
* **【5 分采分拆解】**：① 广义无接触远距探测与狭义基于平台/传感器/电磁波的对地观测科学（1 分）；② 核心链路“高空外层平台 + 传感器捕获反射/发射电磁波 + 传输处理解译”（2 分）；③ 研究地物空间位置/性质/环境关系，具备大范围、多波段与动态监测特征（2 分）。

### 1.7 绝对黑体与比辐射率（发射率 $\varepsilon$）（第 2 章，p.23）

* **5 分满分背诵版**：绝对黑体是在任何温度下对所有波长入射电磁辐射都能全部吸收（光谱吸收率 $\alpha(\lambda,T)=1$、反射率 $\rho=0$）的理想热辐射体。自然界实际物体均为发射率小于 1 的灰体或选择性辐射体；依据基尔霍夫定律，同温度同波长下实际物体辐射出射度 $M$ 与绝对黑体辐射出射度 $M_0$ 之比称为比辐射率（发射率），即 $\varepsilon(\lambda) = M / M_0 = \alpha(\lambda)$，不透明物体满足 $\varepsilon = 1 - \rho$。比辐射率是热红外遥感识别岩矿类型、并将亮温 $T_B$ 反演为真实地表温度 $T$ 的核心物理参数。
* **【5 分采分拆解】**：① 理想全吸收黑体定义及实际灰体发射能力无量纲参数（1 分）；② 基尔霍夫定律 $\varepsilon(\lambda) = M/M_0 = \alpha(\lambda)$ 及不透明体 $\varepsilon = 1 - \rho$（2 分）；③ 支撑热红外地物岩矿识别与由传感器亮温反演真实地表温度（2 分）。

### 1.8 颜色三要素与三原色（第 2 章，p.41–47）

* **5 分满分背诵版**：颜色三要素是人眼感知彩色视觉的三大基本物理量——明度（物体或光源明亮程度，黑白图像仅有明度又称灰阶）、色调（主波长决定的红绿蓝颜色类别）与饱和度（单色纯洁程度，掺白光越多越低），三者共同组成 IHS 颜色立体。不能由另外两种基色混合得到的三种基础色称为三原色（三基色），分为面向发光体合成的色光加色三原色（红 R、绿 G、蓝 B）与面向颜料/滤色片吸收的色料减色三原色（青 C、品红 M、黄 Y），二者呈互补色关系，构成遥感彩色增强与制图输出理论基础。
* **【5 分采分拆解】**：① 描述彩色视觉的三要素物理量与独立基础色概念（1 分）；② 明度/色调/饱和度物理含义 + 加色三原色（RGB）与减色三原色（CMY）互补体系（2 分）；③ 构成 IHS 解耦变换、彩色合成显示与专题图印刷的色彩学基础（2 分）。

### 1.9 标准假彩色合成（第 2 章，p.49–50）

* **5 分满分背诵版**：标准假彩色合成是将多光谱遥感图像中三个特定波段按色光加色法人为赋予红绿蓝显示通道，以突出植被与水体反差的经典彩色合成方式。其固定通道配置为：近红外波段（NIR）赋予红色（R）通道、红光波段（Red）赋予绿色（G）通道、绿光波段（Green）赋予蓝色（B）通道（对应 Landsat TM/ETM+ 4-3-2、Landsat-8/9 OLI 5-4-3、Sentinel-2 8-4-3）。合成图像中健康植被因近红外强反射呈鲜红色，清洁水体呈深蓝或黑色，浑浊水呈浅青色，城镇呈蓝灰色，极利于植被调查与水陆界线判读。
* **【5 分采分拆解】**：① 人为赋色的经典多波段假彩色合成方式（1 分）；② 通道映射（NIR $\rightarrow$ R、Red $\rightarrow$ G、Green $\rightarrow$ B）及主流卫星波段号（如 OLI 5-4-3）（2 分）；③ 健康植被鲜红、清水深黑、浑水浅青、城镇蓝灰的典型判读效应（2 分）。

### 1.10 传感器四大分辨率（第 3 章，p.57–60）

* **5 分满分背诵版**：传感器四大分辨率是衡量遥感探测器空间细节、光谱通道、辐射灰阶与时间频次探测能力的核心性能指标。空间分辨率指能分辨的最小地面单元尺寸（$D = H \cdot \text{IFOV}$ 或 GSD）；光谱分辨率指能区分的最小波长间隔 $\Delta\lambda$ 与波段数；辐射分辨率指能辨别的最小辐射能量差及量化比特等级数 $2^n$；时间分辨率指对同一目标相邻两次成像的重访周期。由于入射能量正比于 $\text{IFOV}^2 \cdot \Delta\lambda \cdot \Delta t$，空间与光谱分辨率天然互斥，工程上常借图像融合与多星组网协同突破。
* **【5 分采分拆解】**：① 评价传感器综合探测能力的四大核心指标体系（1 分）；② 逐一准确定义空间（$H\cdot\text{IFOV}$）、光谱（$\Delta\lambda$）、辐射（$2^n$）与时间（重访周期）分辨率（2 分）；③ 点明空间与光谱分辨率的能量互斥制约及图像融合/星座组网解决途径（2 分）。

### 1.11 数字高程模型（DEM）与数字表面模型（DSM）（第 3 章，p.73）

* **5 分满分背诵版**：数字高程模型（DEM）与数字表面模型（DSM）均是描述地球表面三维高程空间分布的数字栅格或矢量地面模型。核心区别在于：DEM 仅表达剔除了地表一切附着物后的纯粹自然裸地高程，而 DSM 则同时包含裸地地面以及建筑物屋顶、森林植被冠层顶部、桥梁等地物表面顶面的绝对高程。激光雷达（LiDAR）通过首次回波生成 DSM、利用穿透植被冠层到达地面的末次回波经点云滤波生成 DEM，二者作差得到的归一化数字表面模型（$\text{nDSM} = \text{DSM} - \text{DEM}$）可直接反演树高与建筑物高度。
* **【5 分采分拆解】**：① 表达地表三维高程分布的两类核心数字地形模型（1 分）；② 本质差异：DEM 为纯裸地地形高程，DSM 含植被冠层与建筑物等附着物顶面高程（2 分）；③ LiDAR 末次/首次回波获取路径及 $\text{nDSM} = \text{DSM} - \text{DEM}$ 提取树高/楼高应用（2 分）。

### 1.12 太阳同步轨道（第 5 章，p.102）

* **5 分满分背诵版**：太阳同步轨道（Sun-Synchronous Orbit, SSO）是陆地资源与环境监测卫星最常采用的近极地近圆形逆行轨道。通过将轨道倾角精确设计在 $98^\circ \sim 99^\circ$ 左右，利用地球扁率摄动使卫星轨道平面绕地轴进动的角速度恰好等于地球绕太阳公转的平均角速度（约 $0.9856^\circ/\text{d}$），从而保持轨道面与日地连线之间的夹角恒定不变。这确保卫星每次经过同一纬度地区时拥有基本一致的地方太阳时（如 Landsat 约上午 10:00），使不同时相获取的影像具有高度可比的光照与阴影条件。
* **【5 分采分拆解】**：① 陆地资源卫星常用的近极地、近圆形逆行卫星轨道类型（1 分）；② 轨道倾角 $98^\circ\sim 99^\circ$、轨道面进动与地球公转同步使轨道面与日地连线夹角恒定（2 分）；③ 保证过境同一纬度地方太阳时相同，实现多时相影像光照可比与动态变化监测（2 分）。

### 1.13 干涉合成孔径雷达（In-SAR）（第 6 章，p.156）

* **5 分满分背诵版**：干涉合成孔径雷达（In-SAR）是利用合成孔径雷达对同一地区获取两幅及以上高度相干影像来重建地表三维地形或微小形变的主动微波测量技术。其核心原理是采用单轨双天线或双轨重复平行轨道获取两幅单视复数（SLC）影像并进行复共轭干涉处理，将两波束至地面同一点的斜距差 $\Delta R$ 转化为干涉相位差 $\Delta\varphi = \frac{4\pi}{\lambda}\Delta R$（对应干涉条纹），再结合成像基线几何即可反演高精度三维 DEM。利用形变前后两幅干涉图做差分（D-InSAR），还可全天候监测毫米～厘米级地震与地面沉降。
* **【5 分采分拆解】**：① 基于相干微波干涉原理的三维地形与形变测量技术（1 分）；② 双天线/重复轨获取两幅 SLC 复影像干涉，由相位差 $\Delta\varphi = \frac{4\pi}{\lambda}\Delta R$ 与基线反演高程（2 分）；③ 全天候高精度生成 DEM，D-InSAR 广泛用于地震同震形变、地面沉降与滑坡监测（2 分）。

### 1.14 监督分类与非监督分类（第 8 章，p.214–218）

* **5 分满分背诵版**：监督分类与非监督分类是依据遥感像元多维光谱特征自动划分专题地物类别的两大计算机模式识别体制。监督分类遵循“先训练后判别”，需事先在已知地物区选取代表性训练样区（ROI）建立判别函数（如最大似然法、最小距离法）再逐像元判定归属；非监督分类遵循“先聚类后定名”，无需先验训练样本，直接依据特征空间点群相似性自动聚类成光谱类（如 K-Means、ISODATA）后再目视或外业赋予地学属性。前者类别可控性强但耗时耗样，后者客观省力能发现未知小类但光谱类与信息类未必一一对应。
* **【5 分采分拆解】**：① 依据光谱特征自动识别地物的两大遥感分类体制（1 分）；② 监督“选 ROI 训练建模 $\rightarrow$ 判别”（MLC/最小距离）vs 非监督“无样本聚类 $\rightarrow$ 定名”（K-Means/ISODATA）（2 分）；③ 精度可控性、先验依赖度与未知类发现能力的优缺点对比与互补应用（2 分）。

### 1.15 混淆矩阵与 Kappa 系数（第 8 章，p.238）

* **5 分满分背诵版**：混淆矩阵（误差矩阵）与 Kappa 系数是定量检验遥感图像分类精度的标准统计工具与综合评定指标。混淆矩阵是以 $r \times r$ 二维表交叉统计分类结果与地面参考真值样点数量的矩阵，主对角线元素 $x_{ii}$ 为正确像元数，非对角线元素直观揭示错分误差与漏分误差；Kappa 系数公式为 $K = \frac{N\sum x_{ii} - \sum (x_{i+} x_{+i})}{N^2 - \sum (x_{i+} x_{+i})}$，在总体精度基础上剔除了随机一致性的偶然影响。通常 $K \in [0.60, 0.80]$ 评价为很好，$K > 0.80$ 表示分类结果与真实地表极好一致。
* **【5 分采分拆解】**：① 分类精度定量验证的统计矩阵与综合一致性评价指标（1 分）；② 对角线正确像元/非对角线漏错分误差 + Kappa 完整数学公式（2 分）；③ 弥补总体精度忽略非对角线误差及随机一致的缺陷，明确 $[0.60, 0.80]$ 很好、$>0.80$ 极好的分级标准（2 分）。

### 2.1 ☆ 地物反射率定义式与四种反射型式特征（第 2 章 2.3.1，p.37 必考置顶）

| 反射型式 | 表面粗糙度 $h$ 与波长 $\lambda$ 关系 | 空间反射能量分布规律 | 典型自然/人工地物 | 遥感影像（尤其雷达/光学）表现 |
| :--- | :---: | :--- | :--- | :--- |
| **镜面反射** | $h \ll \lambda$（光滑平坦表面） | 反射能量集中在与入射角相等的反射方向上（入射角 = 反射角） | 平静无波的湖海冰面、沥青路面、光滑金属板 | 侧视雷达斜向照射时能量全向前方反射无回波，图像上呈**极暗黑色**；光学顺光向产生刺眼太阳耀斑 |
| **漫反射（朗伯体）** | $h \ge \lambda$（粗糙表面） | 入射能向半球空间各方向均匀散射，辐射亮度 $L$ 与观测角无关，强度满足 $I(\theta) = I_0 \cos\theta$ | 理想漫反射体、厚密沙砾、极粗糙植被/白粉墙 | 从任意观测视角观察地面亮度一致，是建立光谱反射率定义与大气辐射校正的理想简化假设 |
| **方向反射** | $h$ 与 $\lambda$ 可比且具三维结构 | 兼具镜面与漫反射特性，反射率随太阳入射角与传感器观测角变化（呈各向异性，用 BRDF 刻画） | 绝大多数自然植被冠层、波浪水面、城市建筑群 | 同一地物在不同观测角度和太阳方位下亮度存在明显差异（热点效应），需做 BRDF 角度归一化 |
| **角反射（补充重要）** | 两个或三个互相垂直的光滑平面 | 电磁波经两次或三次镜面反射后，**沿原入射路径逆向原路返回** | 城市高楼墙面与地面构成的二/三面角、金属桥梁、铁塔 | 雷达影像上产生极其强烈的回波，表现为刺眼的**高亮白色点/线斑** |

1. **地物反射率与光谱反射率定义式（1 分）**：物体反射辐射通量 $\Phi_\rho$ 与入射辐射通量 $\Phi_0$ 之比称为全波段反射率 $\rho = \frac{\Phi_\rho}{\Phi_0}$；限定在某一特定波长 $\lambda$ 处的比值称为**光谱反射率** $\rho(\lambda) = \frac{\Phi_\rho(\lambda)}{\Phi_0(\lambda)}$，其随波长变化绘出的曲线即为地物识别的依据。
2. **镜面反射机理与表现（1 分）**：当表面起伏均方根高度 $h \ll \lambda$ 时发生镜面反射，仅沿反射角等于入射角的单一方向反射；平静水面在斜视雷达上因无后向散射而呈纯黑色，在光学太阳直射方向易出现耀斑。
3. **漫反射与理想朗伯体特征（1 分）**：当表面足够粗糙（$h \ge \lambda$）时发生各向散射，其中各方向辐射亮度 $L$ 均相等、辐射强度遵循朗伯余弦定律 $I(\theta) = I_0\cos\theta$ 的理想漫反射表面称为**朗伯体**，其反射亮度不受传感器观测倾角影响。
4. **方向反射与 BRDF 实质（1 分）**：现实地表（如森林冠层、农田、耕作土壤）既非理想镜面也非绝对朗伯体，而是受光照角与观测角共同控制的**非朗伯方向反射**，需借助二向反射分布函数（BRDF）精确描述。
5. **直角角反射与工程识别意义（1 分）**：城市建筑墙体与街道构成的直角二面角或三面角会使入射雷达波经多次镜面反射后沿原路径强烈返回，形成 SAR 影像高亮建筑靶标；光学波段亦依托反射型式区别水体、植被与人工构筑物。

### 2.2 ☆ 微波波段划分、微波遥感优点及微波辐射特征（第 6 章 6.1，p.146–149 必考置顶）

| 微波子波段 | 波长范围（cm） | 频率范围（MHz） | 微波特性与典型卫星/应用举例 |
| :---: | :---: | :---: | :--- |
| **$Ka$** | $0.75 \sim 1.1$ | $40000 \sim 26500$ | 毫米波段，受大气水汽雨滴衰减较明显，用于短距高精度测绘、云雨雷达、辐射计 |
| **$K$** | $1.1 \sim 1.67$ | $26500 \sim 18000$ | 接近水汽吸收带（$1.35\text{ cm}$），常用于大气水汽与云水含量被动微波反演 |
| **$Ku$** | $1.67 \sim 2.4$ | $18000 \sim 12500$ | 降水雷达、海洋测高计（Jason/Sentinel-6）、雪水当量监测 |
| **$X$** | $2.4 \sim 3.75$ | $12500 \sim 8000$ | 波长短、极高空间分辨率，植被冠层散射为主，用于高精城市测绘（TerraSAR-X、SRTM X-SAR） |
| **$C$** | $3.75 \sim 7.5$ | $8000 \sim 4000$ | 兼顾分辨率与穿云透雨能力，**全天候对地主力波段**（**高分三号 GF-3**、Sentinel-1、RADARSAT-1/2） |
| **$S$** | $7.5 \sim 15$ | $4000 \sim 2000$ | 中等穿透深度，适合农作物、灾害应急与测控（环境减灾星 HJ-1C / HJ-2E/F、NISAR） |
| **$L$** | $15 \sim 30$ | $2000 \sim 1000$ | 波长较长，**可穿透森林冠层与干沙地表**，用于林下地形、生物量及 In-SAR 形变（ALOS-PALSAR） |
| **$P$** | $30 \sim 100$ | $1000 \sim 30$ | 分米波段，穿透力极强，可探测深厚植被林下隐伏构造与地下干燥古河道 |

1. **微波波段范围与八大字母序列划分（1 分）**：波长 **$1\text{ mm} \sim 1\text{ m}$** 的电磁波称为微波（细分毫米波、厘米波、分米波）；雷达与被动微波遥感按波长由短到长依次划分为 **$Ka - K - Ku - X - C - S - L - P$** 八个常用波段（记忆口诀：“卡卡库艾克斯，希埃斯爱尔皮”，主力星载 SAR 多用 $X, C, L$ 波段）。
2. **穿云透雾与全天候、全天时工作优势（1 分）**：微波波长远大于云雾雨滴粒径（仅受微弱吸收而无光学散射遮蔽），大气窗口透过率近 $100\%$，可穿透浓云雨雾实现**全天候**观测；且主动雷达自带发射源、不依赖太阳光照，可在夜间**全天时**成像。
3. **独特的地表穿透与地学敏感探测能力（1 分）**：微波对干燥沙土、积雪与植被冠层具有一定穿透深度（波长越长穿透越深，如 $L/P$ 波段可穿透干沙探测古河道与林下地形）；其后向散射对表面粗糙度、几何结构及含水量（复介电常数 $\varepsilon_r$，水约 80 远高于干土 3～4）极为敏感，特别适合海洋风浪、土壤湿度与洪涝监测。
4. **微波辐射特征——瑞利-金斯近似与线性亮温定律（1 分）**：在微波长波低温条件下满足 $hc \ll \lambda k T$，普朗克公式简化为**瑞利-金斯（Rayleigh-Jeans）近似**，黑体辐射亮度与热力学温度呈**一次线性正比**（而非四次方）；因此实际物体的微波亮度温度与真实物理温度满足简洁的线性关系 **$T_B = \varepsilon \cdot T$**。
5. **微波发射率高变幅与能量微弱局限（1 分）**：微波波段不同地物的比辐射率 $\varepsilon$ 变化幅度远大于热红外（如平静水面约 $0.4$，干燥裸土高达 $0.9\sim 0.95$），有利于反演土壤水分与海冰；但天然微波热辐射能量极其微弱，导致被动微波辐射计空间分辨率较粗（公里～数十公里级），且主动 SAR 存在**相干斑噪声与侧视地形畸变**。

### 2.3 ☆ 图像灰度直方图的性质与应用作用（第 7 章 7.1.2，p.180 必考置顶）

1. **统计定义与非负归一化性质（1 分）**：直方图横轴为灰度级 $r_k \in [0, L-1]$，纵轴为像元个数 $n_k$ 或出现概率密度 $P(r_k) = n_k / N$（其中 $N$ 为总像元数），满足非负性 $P(r_k) \ge 0$ 与**归一化性质 $\sum_{k=0}^{L-1} P(r_k) = 1$**。
2. **空间位置无关性（多对一映射）（1 分）**：直方图只统计全图灰度值的宏观分布频率，**完全丢失像元之间的空间位置与拓扑关系**——任意打乱同一图像中像元的位置其直方图完全不变，不同空间结构的两幅图像也可能拥有完全相同的直方图。
3. **子图可加性（线性叠加性质）（1 分）**：若将一幅遥感图像划分为若干互不重叠的子区域，则整幅图像在各灰度级的像元数直方图等于各子区域同灰度级像元频数直方图之和（概率直方图为各子区面积加权平均）。
4. **诊断图像质量与指导阈值分割（1 分）**：直方图波形直接揭示图像成像质量——峰聚左侧为**图像偏暗**、聚右侧为**图像偏亮**、分布狭窄集中为**低反差（灰蒙蒙）**、跨度宽广为**高反差**；当存在两大典型地物（如水体与陆地）时呈明显**双峰分布**，两峰之间的**波谷位置即为图像二值化分割的最佳阈值**。
5. **直方图均衡化、规定化及去霾校正基础（1 分）**：累计直方图（$\text{CDF}$）是执行**直方图均衡化**（非线性拉宽密集灰阶增强反差）与**直方图匹配/规定化**（多幅镶嵌去色差、IHS/PCA 融合前均值方差匹配）的核心变换函数；此外直方图最小值截距还用于**暗目标法（DOS）大气程辐射去霾校正**。

### 2.4 ☆ 遥感图像几何畸变来源、数字图像几何精校正方法与 GCP 的作用（第 7 章 7.3，p.184–189 必考置顶）

1. **内部与外部 8 大几何畸变来源（1 分）**：**内部误差（2 类）** 源自传感器自身性能，即光学镜头畸变/探测元排列不均与扫描镜转速/电子采样频率抖动；**外部误差（6 类）** 包括传感器成像投影变形（摆扫全景变形与雷达斜距压缩）、平台轨道位置及滚转/俯仰/偏航姿态角变化、地形起伏视差位移、**地球曲率**（等效高程降低 $\Delta h = \frac{D^2}{2R_0}$ 致边缘拉长）、**地球自转偏斜**（极轨自北向南成像叠加地球自西向东自转使整景扭曲成**平行四边形**）以及大气折射路径弯曲。
2. **数字图像几何精校正方法与多项式模型（1 分）**：系统粗校正仅能消除内部及星历系统误差，仍留存较大定位残差，需采用**数字图像几何精校正**。工程核心采用**多项式变换模型**，回避复杂传感器物理构像过程，直接用二维 $n$ 次多项式（$x = \sum a_{ij} X^i Y^j,\ y = \sum b_{ij} X^i Y^j$）拟合标准地理坐标 $(X, Y)$ 与原始畸变图像坐标 $(x, y)$ 的映射关系，并列法方程按最小二乘平差解算变换系数。
3. **GCP 地面控制点是什么及五大核心作用（重点必背，1 分）**：**GCP（地面控制点）** 是指在原始遥感影像与参考地图/实地测量上均能精确判读的同名固定地物特征点，同时记录影像坐标 $(x, y)$ 与地面地理坐标 $(X, Y)$。其**五大核心作用**为：① 提供建立几何变换方程的已知观测对，通过最小二乘求解多项式系数（$n$ 次至少需 $N_{\min} = \frac{(n+1)(n+2)}{2}$ 对，一次 3 对、二次 6 对、三次 10 对）；② 吸收并消除轨道漂移、地球自转等非系统残余变形；③ 将影像从行列坐标系严格配准至指定地图投影坐标系（地理编码）；④ 预留独立检核点计算 RMSE 均方根误差以评定与控制校正精度（如 $1:1$ 万图需 $\le \pm 5\text{ m}$）；⑤ 保障多时相变化检测、多源图像融合及与 GIS 矢量的严密叠合。
4. **GCP 选点五原则与间接法坐标反算（1 分）**：GCP 选点必须坚持**标志明显清晰（道路交角/坝角）、位置稳定不变（忌河滩农埂）、空间分布均匀（涵盖四角与中心）、高程相近（无 DEM 时避免山顶谷底混选）及数量留有冗余**五大原则；坐标变换采用**间接法（反解法）**，即从空白输出地理格网 $(X, Y)$ 逐点反算原始影像浮点坐标 $(x, y)$，从而彻底避免直接正算产生的像素空洞与重叠。
5. **灰度重采样与精度输出（1 分）**：因反算 $(x, y)$ 为非整数浮点坐标，须进行**灰度重采样**赋新灰度值——计算机分类前优选**最邻近法**（保原始光谱 DN 值不失真），常规目视或连续场优选**双线性内插**，高精度制图优选**三次卷积内插**（细节最锐利），最终经独立检核点 RMSE 合格后输出标准地理编码正射/精校正影像。

### 2.5 ☆ 图像融合的目的、三个层次及 IHS / Brovey / PCA 融合方法对比（第 7 章 7.4.5，p.206 必考置顶）

| 融合层次 | 信息抽象与处理对象 | 主要方法与典型代表 | 优势与局限 |
| :--- | :--- | :--- | :--- |
| **像元级（像素级）融合** | 直接对严格配准后的原始像元灰度/辐射值逐像元融合 | IHS 变换、PCA 主成分、Brovey 比值、Gram-Schmidt（GS）、小波变换 | **信息保留最完整、细节提升最显著**；但对配准精度（$<0.5$ 像元）与计算量要求最高 |
| **特征级融合（Feature-level）** | 从各源影像提取边缘、形状、纹理、植被指数等特征向量后综合 | 边缘增强融合、特征向量拼接、多源主成分/决策树特征输入 | 实现了信息压缩与特征互补，利于抗噪与计算机分类提取 |
| **决策级融合（Decision-level）** | 各传感器影像分别独立完成解译分类后，对专题类别决策结果综合 | 投票表决、贝叶斯推理、D-S 证据理论、模糊逻辑叠加 | 容错率最高、对不同体制数据（如光学+SAR+文本）兼容最好、数据通信量最低；但原始细节信息损失最大 |

| 像素级算法 | 核心变换步骤与公式 | 波段限制 | 空间提升与光谱保真特点 |
| :--- | :--- | :---: | :--- |
| **IHS 融合法** | RGB 正变换得 $(I, H, S)$ $\rightarrow$ 全色 PAN 直方图匹配后**替换明度分量 $I$** $\rightarrow$ IHS 逆变换 | **限 3 波段** | 空间纹理极清晰，但因 PAN 与 $I$ 光谱响应差异易造成**色彩（尤其植被）光谱失真较大** |
| **Brovey 法** | 乘性比值加权并重采样：$B'_i = A \cdot PAN \cdot \frac{B_i}{B_R + B_G + B_B}$ | **限 3 波段** | 计算极其简单快速、边缘反差高，但改变了辐射绝对值，**只保持波段比值关系，绝对光谱失真** |
| **PCA 融合法** | 多光谱正交变换得 $PC_1\dots PC_n$ $\rightarrow$ PAN 匹配方差后**替换第一主分量 $PC_1$** $\rightarrow$ PCA 逆变换 | **支持任意 $n$ 波段** | 不受 3 波段限制；$PC_1$ 承载共有亮度而光谱差异保存在 $PC_2\dots PC_n$ 中，**光谱保真优于 IHS**（ENVI 中进一步升级为保真最优的 **Gram-Schmidt 法**） |

1. **图像融合的六大工程目的（1 分）**：图像融合旨在协同高空间分辨率全色（PAN）与多光谱（MS）或微波（SAR）等多源数据，核心达到**提高图像空间分辨率、改善几何定位精度、增强地物边缘纹理特征显示能力、提升计算机分类精度、增强多时相变化检测能力以及修补单源云遮缺陷**六大目的。
2. **图像融合的三个逻辑层次（1 分）**：由底层至高层划分为**像元级（像素级）**（原始像元直接运算，细节保留最好）、**特征级**（提取边缘/纹理/指数特征后再合并，兼顾压缩与抗噪）与**决策级**（多源独立分类解译后再行证据推理表决，抗干扰最稳健）。
3. **IHS 变换融合机理与优缺点（1 分）**：先把 3 波段低分多光谱影像从 RGB 转换至 IHS 空间分离出明度 $I$、色调 $H$ 与饱和度 $S$，再将高分 PAN 经直方图匹配拉齐均值方差后替换 $I$ 并逆变换；空间锐度极佳但严格限 3 波段且光谱失真较明显。
4. **Brovey（比值加权）融合机理与优缺点（1 分）**：将 RGB 三波段各自分别乘以高分 PAN 与三波段之和的比值后再重采样至 PAN 尺度；运算快捷且城市地物边界反差显著，但限 3 波段且破坏了原始辐射绝对定量关系。
5. **PCA（主成分）融合机理及效果评价（1 分）**：对任意 $n$ 个多光谱波段做 PCA 变换，用匹配后的 PAN 替换方差最大的第一主分量 $PC_1$ 后逆变换，保留了后续主分量中的光谱差异信息，适用多波段融合；融合质量通过定性目视判读与定量指标（**信息熵、平均梯度、偏差指数、相关系数**）协同检验。

### 2.6 ☆ 图像变换核心方法：NDVI、比值变换、K-L（PCA）与 K-T（缨帽）变换对比（第 7 章 7.4.4，p.205 必考置顶）

| 图像变换方法 | 核心数学表达式 / 变换机理 | 主要物理意义与消除干扰 | 核心优势与遥感典型应用 |
| :--- | :--- | :--- | :--- |
| **比值变换（含 RVI）** | $f_r(x,y) = \text{Integer}\left[\frac{f_1(x,y)}{f_2(x,y)}\right]$；比值植被指数 $\text{RVI} = \frac{\rho_{\text{NIR}}}{\rho_{\text{Red}}}$ | 上下两波段同受地形起伏引起的太阳入射角余弦 $\cos\theta_s$ 缩放，相除使阴影因子相互抵消 | **有效消除地形阴影与光照坡度影响**；突出不同地物在两波段间的斜率差异（如铁染蚀变 $\text{Red}/\text{Blue}$、植被 $\text{RVI}$） |
| **NDVI（归一化植被指数）** | $\text{NDVI} = \frac{\rho_{\text{NIR}} - \rho_{\text{Red}}}{\rho_{\text{NIR}} + \rho_{\text{Red}}}$，取值 $[-1, 1]$ | 叶绿素吸收红光使 $\rho_{\text{Red}}$ 极低，海绵组织强散射使 $\rho_{\text{NIR}}$ 极高；比值和差值归一化抑制噪声 | 植被覆盖度（FVC）、长势、叶面积指数（LAI）、物候变化及干旱监测的**第一核心光谱指数** |
| **K-L 变换（主成分分析 PCA）** | **数据驱动**：求解波段协方差矩阵 $\Sigma$ 特征向量矩阵 $A$ 并投影 $Y = A^T X$（方差 $\lambda_1 > \lambda_2 > \dots > \lambda_n$） | 旋转坐标轴消除波段相关性：$PC_1$ 集中 $70\%\sim 90\%$ 共有反照率与地形方差；高阶分量 $PC_n$ 主为随机噪声 | 变换矩阵随景而变；用于**特征降维、数据压缩、舍弃高阶噪声分量去噪及 PCA 图像融合** |
| **K-T 变换（缨帽变换）** | **固定经验系数**：按特定传感器（MSS/TM/OLI）预先标定固定正交变换矩阵加权投影 | 分量具有**固定物理意义**：第一维**亮度（Brightness）** 表征土壤反照率；第二维**绿度（Greenness）** 表征植被生物量；第三维**湿度/黄度**表征土壤/冠层水分 | 矩阵不随景变化，**不同时空影像变换结果可直接定量对比**，服务农作物长势与土壤旱情监测 |

1. **NDVI 物理机制、范围与工程意义（1 分）**：利用植被红光吸收谷与近红外高反射平台的剧烈反差构建 $\text{NDVI} = (\rho_{\text{NIR}} - \rho_{\text{Red}}) / (\rho_{\text{NIR}} + \rho_{\text{Red}}) \in [-1, 1]$，负值多对应水体云雪，近零对应裸土岩体，正值随植被盖度与生物量增大而趋近 $0.8\sim 0.9$（密林区易饱和）。
2. **比值变换（含差值/加法/掩膜代数运算）原理（1 分）**：差值运算 $f_1 - f_2$ 突出多时相变化检测，加法平均削弱随机加性噪声，而**波段比值变换**利用相同地形阴影与辐射增益在两波段上成等比例因子的特性将其分子分母约去，是山区消除地形光照差异、突出植被或岩矿蚀变带的利器。
3. **K-L 变换（主成分分析 PCA）特征（1 分）**：属于依据影像自身统计协方差矩阵 $\Sigma$ 求解正交特征向量的数据驱动变换，彻底消除波段高度相关性，并将全图绝大部分有效方差压缩集中到前 $2\sim 3$ 个主分量中，舍弃方差极小的高阶分量可一举实现降维、去噪并提高分类精度。
4. **K-T 变换（缨帽变换）特征（1 分）**：针对农作物生长与土壤光谱特征空间形态设计的传感器固定系数正交变换，稳定输出**亮度（土壤裸露与反照率）、绿度（植被叶绿素与生物量）和湿度（土壤与叶片含水量，MSS 为黄度）** 三维正交物理分量。
5. **K-L 与 K-T 核心对比与选用原则（1 分）**：K-L 矩阵随每景图像数据而变、各分量无固定地学物理含义，适合**降维压缩、融合与去噪**；K-T 矩阵仅随传感器固定、物理意义恒定不变，适合**跨时空农情、旱情与生态动态直接对比**。

### 2.7 遥感探测的特点（第 1 章，p.6）

1. **大范围宏观同步观测（1 分）**：传感平台居高临下，单幅影像即可瞬间覆盖广阔区域（如单景 Landsat 影像覆盖 $185\text{ km} \times 185\text{ km} \approx 3.4\text{ 万 km}^2$，GF-1 宽幅可达 $800\text{ km}$），彻底克服地面逐点人工测量视野狭小与耗时久难题。
2. **多种传感器与多波段探测，受地面条件限制少（1 分）**：可综合使用可见光、近红外、热红外、主动微波 SAR 与激光雷达 LiDAR 穿透人迹罕至的高山、沼泽、沙漠与海洋获取多维物理信息，其中微波遥感更可穿云透雾、昼夜工作。
3. **获取信息周期短、动态监测能力极强（1 分）**：卫星按回归周期定期重访同一地区（如 Landsat-8/9 为 16 天、Sentinel-2 双星 5 天、MODIS 1～2 天、静止气象卫星仅 5～15 分钟），能实时追踪台风、洪涝、林火、作物生长与城市扩张。
4. **信息综合性强、经济与社会效益显著（1 分）**：集空间几何位置、光谱生化属性、热场温度与高程三维信息于一体，且一次获取可供土地、林业、农业、水利、环保等多部门共享复用，大幅降低外业成本。
5. **应用领域极其广泛（1 分）**：现已作为一级学科（1404 遥感科学与技术）深度服务国家国土调查、森林资源与火灾监测、海洋生态与溢油、地质找矿、地震洪涝防灾减灾及全球碳排放与气候变化监测。

### 2.8 黑体辐射三大定律、太阳辐射与地球辐射的特点对比（第 2 章，p.23–26）

| 对比维度 | 太阳辐射（被动光学主能源） | 地球自身辐射（热红外主能源） |
| :--- | :--- | :--- |
| **等效黑体温度** | 约 **$6000\text{ K}$**（表面高温辐射源） | 约 **$300\text{ K}$**（常温下垫面约 $27^\circ\text{C}$） |
| **主波长分布区间** | **$0.15 \sim 4.0\ \mu\text{m}$**（主集中于 **$0.3 \sim 2.5\ \mu\text{m}$** 占总能量 $85\%$；其中紫外 $5\%$、可见光 $50\%$、红外 $45\%$） | 主要集中于 **$6.0\ \mu\text{m}$ 以上**的热红外区段 |
| **峰值辐射波长 $\lambda_{\max}$** | 约 **$0.47 \sim 0.48\ \mu\text{m}$**（可见光蓝绿波段） | 约 **$9.66 \sim 9.7\ \mu\text{m}$**（热红外大气窗口核心） |
| **大气层与海平面差异** | 大气上界近似 $6000\text{ K}$ 连续平滑曲线；到达海平面后因 $\text{O}_3, \text{O}_2, \text{H}_2\text{O}, \text{CO}_2$ 吸收及大气散射而整体大幅衰减并出现多个深吸收凹谷 | 穿过对流层水汽与 $\text{CO}_2$、$9.6\ \mu\text{m}$ 臭氧吸收后，仅在 $8\sim 14\ \mu\text{m}$ 窗口高透过率逃逸至星载传感器 |

1. **普朗克定律揭示黑体分谱规律（1 分）**：$W(\lambda) = \frac{2\pi h c^2}{\lambda^5 (e^{hc/(\lambda kT)} - 1)}$ 定量给出绝对黑体分谱辐射通量密度随波长与温度的分布——温度越高全波段辐射能量越大，同温下随波长先升至峰值后下降，不同温度曲线互不相交。
2. **斯忒藩-玻尔兹曼定律与基尔霍夫发射率修正（1 分）**：黑体总辐射出射度与温度四次方成正比 $M_0 = \sigma T^4$；实际灰体满足 $M = \varepsilon \sigma T^4$（$\varepsilon = \alpha = 1-\rho$），微小温差即引起显著辐射能量变化，构成热红外反演温度与异常热源识别的物理基石。
3. **维恩位移定律锁定最佳探测窗口（1 分）**：$\lambda_{\max} T = 2897.8\ \mu\text{m}\cdot\text{K}$ 表明物体温度越高，辐射峰值波长越向短波方向移动，由此直接导出 $6000\text{ K}$ 太阳峰值在 $0.48\ \mu\text{m}$、$300\text{ K}$ 常温地表在 $9.66\ \mu\text{m}$（$8\sim 14\ \mu\text{m}$ 窗口）、高温林火在 $3\sim 5\ \mu\text{m}$。
4. **太阳辐射特征与太阳常数（1 分）**：太阳光谱连续且等效 $6000\text{ K}$ 黑体辐射，太阳常数 $I_0 = 1.353 \times 10^3\text{ W/m}^2$，能量高度集中于紫外至短波红外（$0.3\sim 2.5\ \mu\text{m}$），但经大气传输后海平面照度曲线因气体分子吸收和气溶胶散射明显下移并形成吸收谷。
5. **地球辐射特征及三波段分工（1 分）**：地球辐射等效 $300\text{ K}$ 黑体长波热辐射（峰值 $9.7\ \mu\text{m}$）；在 **$0.3\sim 2.5\ \mu\text{m}$** 遥感以探测**地表反射太阳辐射**为主，**$> 6\ \mu\text{m}$** 以**地球自身热辐射**为主，而 **$2.5\sim 6\ \mu\text{m}$ 中红外波段**两者能量相当、均不可忽略。

### 2.9 大气散射的三种类型、发生条件及对遥感成像的影响（第 2 章，p.31）

1. **瑞利散射（Rayleigh Scattering，1 分）**：发生于大气气体分子（$\text{N}_2, \text{O}_2$）粒径远小于入射波长（**$a \ll \lambda$**）时，散射强度与波长四次方成反比（**$I \propto \lambda^{-4}$**），波长越短散射越强（这是晴朗无云天空呈蔚蓝色的物理成因）。
2. **米氏散射（Mie Scattering，1 分）**：发生于烟尘、霾粒、气溶胶及小水滴粒径与入射波长同数量级（**$a \approx \lambda$**）时，散射强度近似与波长平方成反比（**$I \propto \lambda^{-2}$**），是近地面雾霾区定量遥感大气校正重点剔除的对象。
3. **无选择性散射（均匀散射，1 分）**：发生于云滴、雾滴与粗尘埃粒径远大于入射波长（**$a \gg \lambda$**）时，散射强度与波长无关（**$I \propto \lambda^0$**），可见光各波段被等量强散射使云雾呈现灰白色，彻底阻断光学传感器对云下地表的观测。
4. **产生程辐射降低反差并致真彩色发蓝（1 分）**：大气散射不仅衰减直射太阳入射和地表反射能量，还向传感器入瞳直接注入不携带任何地表属性信息的**大气程辐射**，显著降低影像对比度与清晰度；尤以波长最短的蓝光波段瑞利散射最强烈，叠加大量蓝色程辐射导致真彩色影像整体**发蓝偏灰**。
5. **工程避害与去霾校正对策（1 分）**：卫星传感器波段设计常舍弃紫光和紫外，并选用波长较长的近红外、短波红外（如 Landsat 7-6-5 组合）甚至微波 SAR 穿透薄霾云雾；定量处理则依据长波受散射极小的特点，采用 **DOS 暗目标直方图减法、波段线性回归法或 6S 辐射传输模型**剥离程辐射实现去霾。

| 色彩系统对比 | 三原色（三基色） | 混合物理机理 | 等量混合与两两叠合规则 | 遥感与制图核心应用场景 |
| :--- | :--- | :--- | :--- | :--- |
| **加色法（RGB）** | **红（R）、绿（G）、蓝（B）** | 独立彩色光源或屏幕三色电子枪发射光能量**相加叠加** | $\text{R}+\text{G}=\text{黄(Y)}$，$\text{G}+\text{B}=\text{青(C)}$，$\text{R}+\text{B}=\text{品红(M)}$；**$\text{R}+\text{G}+\text{B}=\text{白}$**；无光为黑 | 计算机屏幕彩色合成显示、多光谱真彩色与假彩色影像生成 |
| **减色法（CMY）** | **青（C）、品红（M）、黄（Y）**（互为 RGB 补色） | 颜料油墨或彩色滤色片从入射白光中**选择性吸收对应补色光**（C 吸红、M 吸绿、Y 吸蓝） | $\text{C}+\text{M}=\text{蓝(B)}$，$\text{C}+\text{Y}=\text{绿(G)}$，$\text{M}+\text{Y}=\text{红(R)}$；**$\text{C}+\text{M}+\text{Y}=\text{黑}$** | 彩色摄影胶片冲洗、遥感专题图彩色印刷制图（实际常加黑版成 CMYK） |

| 典型地物类型 | 标准假彩色 R（NIR） | 标准假彩色 G（Red） | 标准假彩色 B（Green） | 标准假彩色呈现颜色 | 判读核心物理解析 |
| :--- | :---: | :---: | :---: | :--- | :--- |
| **健康阔叶林 / 旺季作物** | **极高** | 极低 | 低 | **鲜红色 / 亮红色** | 叶片海绵组织近红外强反射主导 R 通道，叶绿素红光强吸收压低 G 通道 |
| **针叶林 / 受损衰败植被** | 中偏高 | 较低 | 极低 | **暗红色 / 棕红色** | 针叶冠层空隙阴影多或细胞萎缩，NIR 反射降为暗红 |
| **稀疏草地 / 城市绿地** | 中 | 低～中 | 低～中 | **粉红色 / 浅红色** | 土壤背景红绿反射升高稀释饱和度呈粉红 |
| **清洁深水体** | **极低（近 0）** | 极低 | 低 | **纯黑色 / 极深蓝** | 几乎全吸收红光与近红外，仅 B 通道保留微弱蓝绿反射 |
| **含沙浑浊水体** | 低～中 | 中 | 中偏高 | **浅蓝色 / 亮青色** | 悬浮泥沙米氏散射同时抬升绿光（B）与红光（G）分量 |
| **城镇建筑 / 水泥沥青路** | 中 | 中 | 中偏高 | **蓝灰色 / 青灰色** | 不透水面各波段反射率相当且可见光略偏高呈冷灰蓝 |
| **干燥裸土 / 沙漠** | 中偏高 | 中偏高 | 中 | **亮灰色 / 淡黄白** | 土壤反射率随波长平缓递增，三通道中高值均衡混合 |
| **云层与新雪** | **极高** | **极高** | **极高** | **纯白色** | 三通道均达极高反射等量叠加成白（需结合 $1.6\ \mu\text{m}$ SWIR 区分云雪） |

1. **颜色三要素与三大颜色模型（1 分）**：人眼颜色感知由**明度**（明亮程度，黑白图像仅有明度即灰度）、**色调**（主波长区分的红黄蓝色彩）与**饱和度**（单色纯洁度，掺白光越多越低）共同构成 **IHS 颜色立体**；此外还有面向显示的 **RGB 模型**与解决负系数问题的国际照明委员会 **CIE-XYZ 色度图模型**（$x+y+z=1$，中心 $C(1/3,1/3)$ 为白光点）。
2. **三原色定义与色光加色法规律（1 分）**：三原色是其中任一色均不能由另两色混合生成的基础色；**加色法**以红（R）、绿（G）、蓝（B）为三原色，由发光能量相加产生色彩，遵循两两相加出青/品红/黄、三色等量相加得白光的规律，是遥感多波段显示器合成的物理基础。
3. **色料减色法规律与互补色关系（1 分）**：**减色法**以青（C）、品红（M）、黄（Y）为三原色（互为 R、G、B 补色），靠油墨或滤色片从白光中选择性吸收其补色光（C 吸红、M 吸绿、Y 吸蓝）反射余光呈色，三色等量叠合全吸收呈黑色，广泛应用于彩色胶片与专题地图印刷。
4. **真彩色与假彩色影像合成原理（1 分）**：将多光谱黑白单波段图像分别输入显示器 R、G、B 三电子枪合成彩色影像——**真彩色合成**按“红 $\rightarrow$ R、绿 $\rightarrow$ G、蓝 $\rightarrow$ B”赋色（如 Landsat-8 OLI 4-3-2），色彩与自然景物一致但受蓝光瑞利散射干扰偏灰暗；**假彩色合成**则人为打破原波段对应关系，引入肉眼不可见的红外波段强化地物光谱差异。
5. **标准假彩色合成波段对应及典型地物呈色（1 分）**：行业公认的**标准假彩色合成**固定采用 **“近红外 $\rightarrow$ R、红光 $\rightarrow$ G、绿光 $\rightarrow$ B”**（即 TM/ETM+ **4-3-2**、Landsat-8/9 OLI **5-4-3**、Sentinel-2 **8-4-3**），使**健康植被呈鲜红、针叶林呈暗红、清水呈深蓝黑、浑水呈浅青蓝、城镇呈蓝灰、云雪呈纯白**，极大增强植被与水陆解译对比度。

### 2.11 传感器四大分辨率矛盾及光学机械摆扫式与推扫式多光谱传感器对比（第 3 章，p.57–65）

| 对比维度 | 光学机械摆扫式扫描仪（Whisk-broom） | 固体线阵推扫式扫描仪（Push-broom） |
| :--- | :--- | :--- |
| **别名与扫面方式** | 光机扫描仪、**物面扫描系统**（垂直航向逐像元逐行摆扫） | 线阵列扫描仪、**像面扫描系统**（垂直航向整行同时曝光） |
| **核心结构** | 机械旋转/摆动扫描反射镜 + 分光元件 + 少量离散探测器 | 光学镜头 + 分光棱镜 + 焦平面长线阵列 **CCD** 探测元件 |
| **瞬时观测范围** | 单个瞬时视场角（$\text{IFOV}$）对应的单个地面像元 | 一整行 CCD 线阵列（总视场角 $\text{FOV}$）对应的地面扫描带 |
| **驻留时间与信噪比** | 单像元驻留积分时间极短，**信噪比低** | 整行像元同步长时间积分，**信噪比高**（空间与光谱更易兼得） |
| **几何稳定性与辐射一致性** | 含高速往复机械部件易磨损、**几何稳定性低**（有全景畸变）；但全行共用少量探测器**辐射一致性高** | 固态电子自扫描无运动镜片、**几何稳定性高**、寿命长；但上万个 CCD 像元响应微差致**辐射一致性较低**（易产生垂直条带，需相对辐射定标） |
| **代表性传感器与卫星** | **MSS、TM、ETM+**（Landsat 1–7）、**AVHRR**（NOAA）、**MODIS**（Terra/Aqua） | **OLI/TIRS**（Landsat-8/9）、**MSI**（Sentinel-2）、**HRV**（SPOT）、**GF-1/2/6**、IKONOS、QuickBird、WorldView |

1. **传感器四大分辨率核心定义（1 分）**：**空间分辨率**为影像可辨最小地面单元（$D = H \cdot \text{IFOV}$ / GSD）；**光谱分辨率**为可区分的最小波长间隔 $\Delta\lambda$ 与波段数；**辐射分辨率**为可辨最小辐射能量差及量化位数 $2^n$（如 8-bit 256 级、11/12-bit）；**时间分辨率**为对同一地物相邻两次观测的重访周期。
2. **空间与光谱分辨率的内在矛盾及解决途径（1 分）**：单个探测元接收的能量 $E \propto \text{IFOV}^2 \cdot \Delta\lambda \cdot \Delta t$；提高光谱分辨率（缩小 $\Delta\lambda$）势必减少入射能量，为维持信噪比不得不扩大 $\text{IFOV}$（降低空间分辨率），故两者互斥。解决途径：① 采用线阵推扫与高灵敏度新型探测器延长驻留时间 $\Delta t$；② 借全色与多光谱/高光谱**图像融合**实现协同。
3. **光学机械摆扫式（物面扫描）原理与优缺点（1 分）**：靠机械摆动或旋转扫描镜横向逐像元扫描、配合平台飞行纵向推展，代表为 **Landsat 1–7 的 MSS / TM / ETM+ 与 NOAA AVHRR**；优点是幅宽宽、同探测元**辐射一致性好**，缺点是驻留时间短致**信噪比低**且机械运动易引发几何稳定性下降。
4. **固体线阵推扫式（像面扫描）原理与优缺点（1 分）**：取消机械扫描镜，利用焦平面长线阵 CCD 探测器对垂直航向整行地物同时曝光推扫成像，代表为 **Landsat-8/9 OLI、Sentinel-2 MSI、SPOT 与高分 GF-1/2/6**；优点是像元驻留久**信噪比极高、几何稳定性好、寿命长**，缺点是各探测元定标差异易导致**辐射一致性略低**（条带噪声）。
5. **时间与空间分辨率协同选型逻辑（1 分）**：星载工程中空间分辨率与幅宽/重访周期亦常互制（如 WorldView 亚米级幅宽仅十余公里）；实际需按任务选型（精细测图选高空间推扫星 GF-2，高频动态监测靠 **侧摆成像 + 多星组网**如 Sentinel-2A/B 5 天重访或宽幅 MODIS 每日覆盖）。

### 2.12 微波传感器分类与激光雷达（LiDAR）系统原理及 DEM / DSM 对比（第 3 章，p.72–73）

| 模型 / 传感器对比 | 核心物理含义与表达对象 | 激光雷达（LiDAR）回波提取机制 | 典型应用与相互关系 |
| :--- | :--- | :--- | :--- |
| **DEM（数字高程模型）** | 表达**剔除了树木、房屋、桥梁等一切地表附着物**后的纯粹自然裸地地形高程 | 利用激光脉冲穿透植被缝隙到达地面的**末次回波（Last Return）**，经滤波剔除地上点云后插值生成 | 水文汇流、河道断面、斜坡坡度、正射影像地形校正、洪水淹没基准面 |
| **DSM（数字表面模型）** | 表达包含裸地表面以及**建筑物顶面、森林冠层表面、构筑物等一切地表附着物顶面**的三维真实高程 | 直接利用激光雷达率先接触屋顶与树冠顶部返回的**首次回波（First Return）** 点云构建 | 城市三维建模、建筑容积率统计、森林冠层高度反演、视线通视分析 |

1. **微波传感器的五大系统分类（1 分）**：按是否主动发射信号及是否成像分为两类——**非成像微波传感器**包括被动探测地物反射散射特性的**微波散射计**和精密测量平台至海面/地表高度的**雷达高度计**；**成像微波传感器**包括被动接收天然微波亮温的**微波辐射计**，以及主动侧视成像的**真实孔径侧视雷达（RAR）** 和**合成孔径雷达（SAR / In-SAR）**。
2. **激光雷达（LiDAR）系统组成与工作机理（1 分）**：LiDAR 由**激光扫描测距系统（发射/接收脉冲）+ 差分 GNSS（实时定轨定位）+ INS/IMU 惯性测量单元（实时定姿）** 三大核心集成，属**主动逐点采样**三维成像技术，直接解算激光脚点高精度三维坐标 $(X, Y, Z)$，形成海量三维点云。
3. **LiDAR 相比光学与微波 SAR 的独特优势（1 分）**：光学摄影无法穿透茂密森林树冠，SAR 虽全天候但存在相干斑与地形叠掩；而机载 LiDAR 具备**毫米～厘米级超高垂直精度**、全天时作业且**激光束可穿透植被林冠间隙获取林下真实裸地地形**（如课程中的河道断面测量与航天 ICESat-2 / GEDI / GF-7 激光测高）。
4. **DEM 与 DSM 的本质定义差异（1 分）**：**DEM（数字高程模型）** 只记录剥离了地面所有植物与建筑后的纯粹地球表面（裸地）地形起伏；**DSM（数字表面模型）** 则忠实包含地面以及其上一切森林冠层、房屋建筑与构筑物的最外表面高度，即 DSM = 裸地地形 + 地表地物高度。
5. **LiDAR 生成机理差异与 nDSM 派生应用（1 分）**：机载 LiDAR 多回波激光脉冲的**首次回波**直接反映树冠顶或屋顶构成 **DSM**，而穿透林冠到达地面的**末次回波**经地面点滤波去噪后内插生成 **DEM**；两者相减即得**归一化数字表面模型（$\text{nDSM} = \text{DSM} - \text{DEM}$）**，用于精确估算森林树高、蓄积量与违建监测。

### 2.14 侧视雷达系统基础（RAR / SAR / In-SAR）、雷达图像几何特征及微波平台速览（第 6 章，p.151–172）

| 雷达几何畸变类型 | 几何发生条件（俯角 $\Phi$、入射角 $\theta$、坡度 $\alpha/\beta$） | 物理成因与影像特征表现 | 纠正与避害策略 |
| :--- | :--- | :--- | :--- |
| **斜距比例尺变化（失真）** | 平坦地面沿等斜距采样（$\theta + \Phi = 90^\circ$） | 地距微元对应斜距 $\Delta R = \Delta X \sin\theta$，近程入射角 $\theta$ 小导致**近程地面比远程严重压缩** | 通过**斜距—地距变换（斜地变换）** 即可严格纠正 |
| **透视收缩（Foreshortening）** | 迎向雷达的山坡坡度满足 **$0 < \alpha < \theta$** | 斜坡顶底斜距差 $\Delta R = L\sin(\theta - \alpha)$ 小于平地，表现为**迎坡长度大幅缩短、回波能量集中色调变亮** | 可结合高精度 DEM 进行正射辐射地形校正部分补偿 |
| **叠掩现象（Layover）** | 迎向雷达的山坡极为陡峭满足 **$\alpha > \theta$** | 雷达波束先于坡底抵达坡顶（$R_{\text{顶}} < R_{\text{底}}$），造成**坡顶与坡底位置颠倒**，且前坡/坡顶回波混叠在同一距离门内 | **不可逆信息混叠畸变**，无法仅靠单景影像恢复，需结合升降轨互补成像 |
| **雷达阴影（Shadow）** | 背向雷达的山坡坡度陡于俯角 **$\beta > \Phi$** | 脉冲波束被山脊完全遮挡无法到达背坡坡面，无任何回波信号，呈现边界锐利的**纯黑暗区** | 丢失背坡地表信息但**不可逆**；工程可利用阴影长度反算山峰或目标高度，换用对向轨道补充观测 |

1. **侧视雷达系统组成与基础几何参数（1 分）**：由脉冲发射机、接收机、收发转换开关、定向天线与显示记录器构成；航向为**方位向**，垂直航向为**距离向**，波束与水平方向夹角为**俯角 $\Phi$**，与铅垂线夹角为**入射角 $\theta$**（平坦地面 $\theta + \Phi = 90^\circ$）。
2. **真实孔径雷达（RAR）原理与瓶颈（1 分）**：靠脉冲发射方向窄波束扫描成像，地距分辨率靠窄脉冲宽度 $\tau$ 决定 $\Delta R_g = \frac{c\tau}{2\cos\Phi}$，方位分辨率由天线波瓣角决定 $\Delta R_a = \beta R = \frac{\lambda R}{D}$——在星载数百公里斜距下要实现米级分辨率需十余公里真实天线，**物理上完全不可行**。
3. **合成孔径雷达（SAR）核心突破（1 分）**：利用长为 $D$ 的小型真实天线沿航线飞行，连续发射相干脉冲并记录目标回波的振幅与**多普勒相位变化**，将长约 $L_s = \frac{\lambda R}{D}$ 的一段轨迹相干处理合成为虚拟超长天线；压缩后理论方位分辨率 $\rho_a = \frac{D}{2}$，**与波长 $\lambda$ 和斜距 $R$ 无关**（如 4 m 天线在卫星上即可得 2 m 方位分辨率）。
4. **干涉合成孔径雷达（In-SAR）简明核心原理（1 分）**：对同一测区采用单轨双天线或双轨重复平行观测获取两幅单视复数（SLC）SAR 影像进行复共轭干涉，利用干涉相位差 $\Delta\varphi = \frac{4\pi}{\lambda}\Delta R$ 精确量测斜距差并结合空间基线反演三维 DEM；做两期干涉图差分（**D-InSAR**）可实现毫米～厘米级震后与地面沉降监测。
5. **侧视雷达图像四大几何特征（1 分）**：侧视斜距成像必然伴随四大特有几何特征——平坦地面的**斜距比例尺近程压缩**、迎坡 $0 < \alpha < \theta$ 时的**透视收缩**（短而亮）、迎坡 $\alpha > \theta$ 时的**叠掩**（顶底颠倒不可逆混叠），以及背坡 $\beta > \Phi$ 时的**雷达阴影**（纯黑无回波）。

### 2.15 图像辐射校正目的及空间域增强 vs 频率域增强（高频与低频信息）（第 7 章，p.181–201）

| 对比维度 | 空间域平滑（去噪） | 空间域锐化（边缘增强） | 频率域低通滤波（平滑） | 频率域高通滤波（锐化） |
| :--- | :--- | :--- | :--- | :--- |
| **数学本质与模板** | 积分/排序（均值模板和 $=1$，中值排序） | 微分求导（梯度/Sobel/Laplacian 模板和 $=0$） | 经二维傅里叶变换 FT 至频域：传递函数保留中心低频、截断外围高频，再 IFT 反变换 | 经 FT 至频域：传递函数截断中心低频、放行外围高频，再 IFT 反变换（含去条带陷波滤波） |
| **高低频响应特性** | 抑制高频噪声，保留低频背景 | 突出高频边缘细节，消去低频平坦背景 | **让低频通过、阻挡高频** | **让高频通过、削弱低频** |
| **处理后图像效果** | 压制随机脉冲与椒盐噪声，均值法会模糊边缘，**中值滤波可较好保边去椒盐噪声** | 强烈突出断裂带、道路、田埂、建筑物轮廓，平坦区变暗 | **抑制边缘细节与随机噪声，整体呈模糊平滑效果**（理想低通会有振铃效应） | **显著锐化边缘轮廓与线性纹理细节**，但会同步放大高频随机噪声 |

1. **图像辐射校正的核心目的（1 分）**：消除传感器光电响应不均（条带/暗角）、太阳高度角及日地距离差异、地形坡度阴影以及**大气散射吸收（程辐射）** 引入的非地表真值畸变，将无量纲原始 DN 值依次定标并反演为具有严格物理量纲的**真实地表辐射亮度与地表反射率**。
2. **空间域对比度拉伸与平滑增强（1 分）**：对比度拉伸（线性、分段线性、对数/指数、直方图均衡/匹配）逐像元扩展动态范围；空间平滑通过邻域滑动窗口压制噪声——其中**邻域平均法**虽去高斯噪声但模糊边缘，**中值滤波法**对孤立**椒盐噪声**滤除极佳且有效保护地物边界。
3. **空间域锐化增强（一阶与二阶微分，1 分）**：基于微分凸显灰阶突变，常用一阶梯度算子（**Prewitt / Sobel** 检测垂直与水平边缘）及各向同性二阶微分 **Laplace 算子**（$\nabla^2 f = f(x+1,y)+f(x-1,y)+f(x,y+1)+f(x,y-1)-4f(x,y)$，模板和为 0），常与原图叠加突出地质断层与水系轮廓。
4. **频率域高频与低频分别代表的图像信息（核心必背，1 分）**：二维傅里叶频谱中心区域对应**低频信息**，代表图像中灰度变化平缓、空间跨度大的**整体亮度背景、大面积均匀图斑与宏观趋势**；频谱外围区域对应**高频信息**，代表图像中灰度剧烈跳变的**地物边缘轮廓、精细纹理细节与随机/周期性噪声**。
5. **频率域低通滤波与高通滤波的效果对比（1 分）**：**低通滤波**让低频通过、抑制高频，输出图像噪声减弱但边缘趋于模糊（实现**频率域平滑**）；**高通滤波**让高频通过、压制低频平坦背景，输出图像边缘锐利突出（实现**频率域锐化**，常加回原图补偿背景）；此外**频域陷波滤波**可精准消除全图周期性扫描条带噪声。

### 2.16 计算机分类基本原理、一般步骤及监督分类与非监督分类对比（第 8 章，p.212–218）

| 分类体制 | 代表算法 | 分类核心准则与原理 | 主要优点 | 主要缺点与局限 |
| :--- | :--- | :--- | :--- | :--- |
| **非监督分类（先聚类后定名）** | **K-Means**<br>**ISODATA** | **K-Means**：给定固定类别数 $k$，按最小误差平方和迭代更新中心；<br>**ISODATA**：全部调整完再重算均值，引入类别**动态合并与分裂**自动调优类数 | 无需先验样本、省去人工选样主观偏差、**能发现独特且面积小的未知类别** | 光谱类与实际信息类未必一一对应；输出类别难精准控制；事后需大量目视/外业定名归并 |
| **监督分类（先训练后判决）** | **最小距离法**<br>**最大似然法（MLC）** | **最小距离**：算待分像元到各类训练均值中心的欧氏/计程/马氏距离，近者归属；<br>**最大似然（MLC）**：基于**贝叶斯准则**并假定正态分布，同时利用均值、协方差阵与先验概率最大化后验概率 | 可按需求预先定义专题类别、人为可控训练样本质量、可预估样本分离度与分类误差 | 选纯训练样区耗费大量人力；依赖强统计分布假设（MLC）；**只能识别已定义类，未定义类必然错分漏分** |

1. **遥感计算机分类的物理与统计原理（1 分）**：地面同类地物在多波段中构成 $n$ 维**光谱特征向量** $X = [x_1, x_2, \dots, x_n]^T$，在多维光谱特征空间中自然聚集为不同点群（中心由均值向量刻画、离散度由协方差矩阵刻画）；分类器即利用统计距离或判别函数确立点群决策边界，实现逐像元专题自动归类。
2. **计算机分类的特点（1 分）**：相比传统目视解译，计算机分类实现了海量多波段、高光谱数据的高效自动化与可重复定量识别，充分利用全波段统计相关性；但传统逐像元分类易受“同物异谱、异物同谱”及混合像元干扰产生零星碎斑噪声（高分影像正逐步向面向对象 OBIA 与深度学习 CNN 发展）。
3. **计算机分类一般作业五步骤（1 分）**：① **分类预处理**（辐射定标、大气校正消除散射、几何配准）；② **特征选择与变换**（PCA 降维或提取 NDVI 等指数提高类间可分性）；③ **执行分类**（选用监督或非监督分类器判定像元类别）；④ **分类后处理**（采用 $3\times 3$ 或 $5\times 5$ **多数平滑滤波**等逻辑众数运算剔除椒盐碎斑）；⑤ **精度评定与专题制图**（建混淆矩阵算 OA 与 Kappa，合格后转矢量输出专题图）。
4. **监督分类典型算法深度对比（1 分）**：**最小距离法**计算速度极快但忽略各类方差椭圆形状与先验概率，类群方差悬殊时错分率高；**最大似然法（MLC）** 基于贝叶斯公式综合均值、协方差阵与先验概率平衡“存真”与“弃伪”，使总错分概率达到统计学理论最小，但要求每类具备足量且服从正态分布的样本。
5. **非监督分类典型算法深度对比（1 分）**：**K-Means** 算法简洁快速但初始中心敏感且类别数僵化固定；**ISODATA（迭代自组织算法）** 在 K-Means 基础上按类内标准差和类间距离阈值自动执行**分裂与合并**，能根据实际光谱分布动态确定最优类别数，是主流遥感软件标准非监督方法。

## 模块三：高危计算与算法专项（适配问答 / 综合题 5–10 分）

### 3.1 专项一：电磁辐射三大定律计算（普朗克 / 斯忒藩-玻尔兹曼 / 维恩位移定律）

#### 核心公式体系（解答必先列出公式与常数）
1. **普朗克定律（分谱黑体辐射定律）**：

   $$W(\lambda) = \frac{2\pi h c^2}{\lambda^5 \left( e^{\frac{hc}{\lambda k T}} - 1 \right)}$$

2. **斯忒藩-玻尔兹曼定律与实际物体灰体辐射出射度**：

   $$M_0 = \sigma T^4, \qquad M = \varepsilon \sigma T^4 = \sigma T_B^4$$

   式中：$\sigma = 5.67 \times 10^{-8}\text{ W}\cdot\text{m}^{-2}\cdot\text{K}^{-4}$；$\varepsilon \in (0, 1]$ 为比辐射率（发射率）；$T$ 为真实热力学温度（$T(\text{K}) = t(^\circ\text{C}) + 273$，部分题目取 $+273.15$）；$T_B$ 为热红外等效**亮度温度**。
3. **亮度温度 $T_B$ 与真实地表温度 $T$ 换算关系**：

   $$T_B = \varepsilon^{\frac{1}{4}} \cdot T, \qquad T = \varepsilon^{-\frac{1}{4}} \cdot T_B$$

   （特别提示：在微波段遵循瑞利-金斯近似，亮温为线性关系 $T_B = \varepsilon T$，切勿与热红外四次方根混用。）
4. **维恩位移定律**：

   $$\lambda_{\max} \cdot T = b = 2897.8\ \mu\text{m}\cdot\text{K}$$

#### 【完整带数字分步手算例题】
> **题目**：测得某城市水泥广场地表真实温度为 $t_1 = 27^\circ\text{C}$（热力学温度按 $T = t + 273\text{ K}$ 换算），其热红外比辐射率 $\varepsilon_1 = 0.92$；同期监测到一处林火燃烧高温点近似看作绝对黑体（$\varepsilon_2 = 1.0$），绝对温度 $T_2 = 600\text{ K}$（另已知太阳表面温度 $T_s = 6000\text{ K}$）。取 $\sigma = 5.67 \times 10^{-8}\text{ W}\cdot\text{m}^{-2}\cdot\text{K}^{-4}$、$b = 2897.8\ \mu\text{m}\cdot\text{K}$，试分步计算：
> （1）水泥广场的实际总辐射出射度 $M_1$、传感器测得的亮度温度 $T_{B1}$，以及由 $T_{B1}$ 反演真实温度 $T_1$ 的校验过程；
> （2）高温点辐射出射度 $M_2$ 及其与水泥广场辐射能量之比 $M_2 / M_1$；
> （3）水泥广场、高温林火点与太阳的辐射峰值波长 $\lambda_{\max}$，并指出各自对应的遥感探测最佳大气窗口。

* **【满分分步手算解答】**
  1. **计算水泥广场实际总辐射出射度 $M_1$、亮度温度 $T_{B1}$ 与真温反演校验**：
     * 温度换算：$T_1 = 27 + 273 = 300\text{ K}$。
     * 同温绝对黑体总辐射出射度：

       $$M_0(300\text{ K}) = \sigma T_1^4 = 5.67 \times 10^{-8} \times 300^4 = 5.67 \times 10^{-8} \times 8.1 \times 10^9 = 459.27\text{ W/m}^2$$

     * 水泥广场实际总辐射出射度（灰体发射率修正）：

       $$M_1 = \varepsilon_1 M_0 = 0.92 \times 459.27 \approx 422.53\text{ W/m}^2$$

     * 传感器测得亮度温度 $T_{B1}$（由 $\sigma T_{B1}^4 = \varepsilon_1 \sigma T_1^4$ 解得）：

       $$T_{B1} = \varepsilon_1^{\frac{1}{4}} \cdot T_1 = (0.92)^{0.25} \times 300 \approx 0.97936 \times 300 \approx 293.81\text{ K}\ (20.81^\circ\text{C})$$

     * **工程反演校验**：因自然界地物 $\varepsilon_1 < 1$，遥感直接测得的亮温（$293.81\text{ K}$）系统性地低于真实地表温度（偏低 $6.19\text{ K}$），实际热红外温度反演必须代入已知发射率逆推恢复真温：

       $$T_1 = \varepsilon_1^{-\frac{1}{4}} \cdot T_{B1} = (0.92)^{-0.25} \times 293.81 \approx 300.00\text{ K}\ (27.00^\circ\text{C})$$

  2. **计算高温火点辐射出射度 $M_2$ 及两者总辐射能量比值**：
     * 黑体火点（$\varepsilon_2 = 1.0,\ T_2 = 600\text{ K}$）辐射出射度：

       $$M_2 = \varepsilon_2 \sigma T_2^4 = 1.0 \times 5.67 \times 10^{-8} \times 600^4 = 5.67 \times 10^{-8} \times 1.296 \times 10^{11} = 7348.32\text{ W/m}^2$$

     * 辐射能量比值：

       $$\frac{M_2}{M_1} = \frac{\varepsilon_2 \sigma T_2^4}{\varepsilon_1 \sigma T_1^4} = \frac{1.0}{0.92} \times \left(\frac{600}{300}\right)^4 = \frac{16}{0.92} \approx 17.39\text{ 倍}$$

     * **物理结论**：绝对温度翻倍（$300\text{ K} \rightarrow 600\text{ K}$）导致黑体总辐射能量陡增 $2^4 = 16$ 倍，叠加比辐射率差异后高温点能量达常温水泥地表的 $17.39$ 倍，解释了红外传感器捕获热异常极高的灵敏度。
  3. **计算三者峰值波长 $\lambda_{\max}$ 并判定遥感最佳探测窗口**：
     * 水泥广场（$300\text{ K}$）：$\lambda_{\max 1} = \frac{2897.8}{300} \approx \mathbf{9.66\ \mu\text{m}}$ $\rightarrow$ 落入 **$8\sim 14\ \mu\text{m}$ 远红外（热红外）大气窗口**（如 Landsat TIRS 10/11）。
     * 林火高温点（$600\text{ K}$）：$\lambda_{\max 2} = \frac{2897.8}{600} \approx \mathbf{4.83\ \mu\text{m}}$ $\rightarrow$ 落入 **$3\sim 5\ \mu\text{m}$ 中红外大气窗口**（如 NOAA AVHRR 通道 3b / GF-4 中红外），温度升高峰值向短波位移。
     * 太阳（$6000\text{ K}$）：$\lambda_{\max,s} = \frac{2897.8}{6000} \approx \mathbf{0.483\ \mu\text{m}}$ $\rightarrow$ 落入 **$0.3\sim 1.3\ \mu\text{m}$ 可见光蓝绿波段大气窗口**。

### 3.2 专项二：☆ 图像直方图统计、累计直方图与直方图均衡化手算全流程（第 7 章 7.1.2，p.180 必考置顶）

#### 四步标准计算公式链
设图像总像元数为 $N$、总灰度级数为 $L$（灰度级 $r_k \in \{0, 1, \dots, L-1\}$，如 3-bit 图像 $L=8$，8-bit 图像 $L=256$）：
1. **统计频率（归一化直方图）**：$P(r_k) = \frac{n_k}{N}$
2. **求累计直方图（累积分布函数 $\text{CDF}$）**：$s_k = \text{CDF}(r_k) = \sum_{j=0}^{k} P(r_j) = \frac{1}{N} \sum_{j=0}^{k} n_j$
3. **灰度级映射与四舍五入取整**：$g_k = \text{round}\big((L - 1) \cdot s_k\big)$
4. **合并相同新灰度级的像元频数**：统计每个新灰度级 $g \in [0, L-1]$ 对应的总像元数，绘出均衡化后直方图。

#### 【完整带数字分步手算例题】
> **题目**：某 $8 \times 8$ 像元（总像元数 $N = 64$）、量化位数为 $3\text{ bit}$（灰度级数 $L = 8$，取值 $0 \sim 7$）的偏暗低反差遥感子图，各原始灰度级像元个数统计为：$n_0 = 4,\ n_1 = 16,\ n_2 = 20,\ n_3 = 12,\ n_4 = 6,\ n_5 = 4,\ n_6 = 2,\ n_7 = 0$。试计算各灰度级频率直方图、累计直方图（CDF），完成直方图均衡化灰度映射表并统计均衡化后的新直方图分布。

* **【满分分步手算解答表】**（乘以最大灰度级 $L - 1 = 7$ 后四舍五入取整）

| 原始灰度 $r_k$ | 像元数 $n_k$ | 出现频率 $P(r_k) = n_k / 64$ | 累计像元数 | 累计直方图 $s_k = \text{CDF}(r_k)$ | 浮点映射 $(L-1)s_k = 7 s_k$ | 取整后新灰度 $g_k$ |
| :---: | :---: | :---: | :---: | :---: | :---: | :---: |
| **$0$** | $4$ | $4/64 = 0.0625$ | $4$ | $4/64 = 0.0625$ | $7 \times 0.0625 = 0.4375$ | **$0$** |
| **$1$** | $16$ | $16/64 = 0.2500$ | $20$ | $20/64 = 0.3125$ | $7 \times 0.3125 = 2.1875$ | **$2$** |
| **$2$** | $20$ | $20/64 = 0.3125$ | $40$ | $40/64 = 0.6250$ | $7 \times 0.6250 = 4.3750$ | **$4$** |
| **$3$** | $12$ | $12/64 = 0.1875$ | $52$ | $52/64 = 0.8125$ | $7 \times 0.8125 = 5.6875$ | **$6$** |
| **$4$** | $6$ | $6/64 = 0.09375$ | $58$ | $58/64 = 0.90625$ | $7 \times 0.90625 = 6.34375$ | **$6$**（合并） |
| **$5$** | $4$ | $4/64 = 0.0625$ | $62$ | $62/64 = 0.96875$ | $7 \times 0.96875 = 6.78125$ | **$7$** |
| **$6$** | $2$ | $2/64 = 0.03125$ | $64$ | $64/64 = 1.0000$ | $7 \times 1.0000 = 7.0000$ | **$7$**（合并） |
| **$7$** | $0$ | $0/64 = 0.0000$ | $64$ | $64/64 = 1.0000$ | $7 \times 1.0000 = 7.0000$ | **$7$**（合并） |

* **合并统计均衡化后新直方图**：
  * $g = 0$：$4$ 个（原 $r_0$）
  * $g = 1$：$0$ 个
  * $g = 2$：$16$ 个（原 $r_1$）
  * $g = 3$：$0$ 个
  * $g = 4$：$20$ 个（原 $r_2$）
  * $g = 5$：$0$ 个
  * $g = 6$：**$12 + 6 = 18$ 个**（原 $r_3, r_4$ 合并）
  * $g = 7$：**$4 + 2 + 0 = 6$ 个**（原 $r_5, r_6, r_7$ 合并）
  * 总像元数校验：$4 + 16 + 20 + 18 + 6 = 64$，全部无损保留。
* **物理结论与性质验证**：像元高度集中的暗部主体灰度 $r_0 \to r_1 \to r_2$ 经均衡化后被拉伸为 $0 \to 2 \to 4$（灰阶间隔由 $1$ 扩大至 $2$），**显著拉开了大面积地物的视觉反差**；而像元稀少的亮尾灰度 $r_3/r_4$ 与 $r_5/r_6$ 发生**灰度级简并**（实际非零灰度级由 7 级减为 5 级），充分印证了离散直方图均衡化“拉开大面积主体反差、合并低频细节灰度”的非线性拉伸本质。

### 3.3 专项三：☆ 数字图像几何精校正全流程、GCP 最少点数与三种重采样算法对比（第 7 章 7.3，p.184–189 必考置顶）

#### 1. 多项式变换模型与最少 GCP 数量
* **多项式间接法数学模型**：工程上常从输出规则地理网格坐标 $(X, Y)$ 出发，用 $n$ 次二维多项式直接映射其对应的原始畸变图像浮点坐标 $(x, y)$（以下给出最常用的二次多项式完整形式）：

  $$x = a_0 + a_1 X + a_2 Y + a_3 X^2 + a_4 XY + a_5 Y^2$$

  $$y = b_0 + b_1 X + b_2 Y + b_3 X^2 + b_4 XY + b_5 Y^2$$

  选取 $m$ 个 GCP 列误差方程 $V_x = A\Delta a - L_x$ 与 $V_y = A\Delta b - L_y$，构成法方程并按最小二乘平差解得变换系数：

  $$\Delta a = (A^T A)^{-1} A^T L_x, \qquad \Delta b = (A^T A)^{-1} A^T L_y$$

* **最少控制点对数公式**：$n$ 次二维多项式单坐标方向未知系数之和即所需**最少 GCP 对数**：

  $$N_{\min} = 1 + 2 + \dots + (n+1) = \frac{(n+1)(n+2)}{2}$$

  * **一次多项式（$n=1$，纠正平移、缩放、旋转、错切仿射变换）**：$N_{\min} = \frac{2 \times 3}{2} = \mathbf{3\text{ 对}}$（实操常选 $6\sim 10$ 对以上）；
  * **二次多项式（$n=2$，工程最常用，可消除弯曲非线性扭曲）**：$N_{\min} = \frac{3 \times 4}{2} = \mathbf{6\text{ 对}}$（整景 Landsat 影像常选 **30 个左右**均匀 GCP）；
  * **三次多项式（$n=3$，高阶易出现法矩阵病态与边缘振荡）**：$N_{\min} = \frac{4 \times 5}{2} = \mathbf{10\text{ 对}}$。

#### 2. 间接法与三种灰度重采样算法对比

| 重采样方法 | 邻域窗口 | 核心数学公式与权重计算 | 优点 | 缺点 | 最佳工程适用场景 |
| :--- | :---: | :--- | :--- | :--- | :--- |
| **最邻近内插法** | $1 \times 1$ | 坐标四舍五入，直接取距浮点点 $(x, y)$ 最近的 1 个整数像元灰度：<br>$g(x, y) = f(\text{round}(x),\ \text{round}(y))$ | **计算最快、百分之百保留原始光谱 DN 值不失真** | 几何误差可达 $\pm 0.5$ 像元，线状地物边缘呈 **“锯齿状”断裂** | **计算机监督/非监督分类前预处理**、已分类专题图配准 |
| **双线性内插法** | $2 \times 2$ | 设 $i = \lfloor x \rfloor,\ j = \lfloor y \rfloor$，小数偏量 $u = x - i,\ v = y - j$，取四周 4 像元加权：<br>$g(x, y) = (1-u)(1-v)f(i,j) + u(1-v)f(i+1,j) + (1-u)v f(i,j+1) + uv f(i+1,j+1)$ | 消除锯齿断裂，画面平滑自然，运算量适中 | 低通平滑效应**改变原始光谱数值**并轻度模糊尖锐边缘 | 常规目视解译底图、DEM 与连续温度场重采样 |
| **三次卷积内插法** | $4 \times 4$ | 取周边 16 像元，借分段三次样条核 $W(d)$（当 $\lvert d \rvert \le 1$ 取 $(a+2)\lvert d \rvert^3 - (a+3)\lvert d \rvert^2 + 1$；当 $1 < \lvert d \rvert < 2$ 取 $a\lvert d \rvert^3 - 5a\lvert d \rvert^2 + 8a\lvert d \rvert - 4a$，常取 $a=-0.5$）双向加权：<br>$g(x, y) = \sum_{m=-1}^{2}\sum_{n=-1}^{2} f(i+m,\ j+n)\, W(m-u)\, W(n-v)$ | **几何定位精度最高、视觉最清晰锐利**，无锯齿且保边缘 | **计算耗时最大**，会轻微改变原始 DN 极值 | 高精度制图、印刷级正射影像图（DOM）生产 |

#### 【带数字微型重采样手算例题】
> **题目**：利用二次多项式间接法反算某输出栅格中心在原始影像上的浮点坐标为 $(10.4,\ 20.6)$，已知周围四个整数像元灰度值分别为 $f(10, 20) = 40$、$f(11, 20) = 60$、$f(10, 21) = 80$、$f(11, 21) = 120$。分别用**最邻近内插法**与**双线性内插法**计算输出像元灰度值，并说明两者工程选用的根本差异。

* **【满分分步解答】**
  1. **最邻近内插法**：
     * 坐标四舍五入：$\text{round}(10.4) = 10$，$\text{round}(20.6) = 21$，最近整数像元为 $(10, 21)$。
     * 直接赋灰度：**$g_{\text{NN}} = f(10, 21) = \mathbf{80}$**。
  2. **双线性内插法**：
     * 取左下基准整数 $i = 10,\ j = 20$，计算小数偏移 $u = 10.4 - 10 = 0.4$，$v = 20.6 - 20 = 0.6$（故 $1-u = 0.6,\ 1-v = 0.4$）。
     * 代入四周 4 像元双线性加权公式：

       $$g_{\text{BL}} = 0.6 \times 0.4 \times 40 + 0.4 \times 0.4 \times 60 + 0.6 \times 0.6 \times 80 + 0.4 \times 0.6 \times 120 = 9.6 + 9.6 + 28.8 + 28.8 = \mathbf{76.8 \approx 77}$$

  3. **工程选用结论**：若该影像用于后续**监督/非监督光谱分类**，应选用**最邻近法**（输出 $80$，未篡改原始波谱特征）；若用于**目视制图或连续高程/温度内插**，应选用**双线性（输出 $77$）或三次卷积法**以消除台阶锯齿。

### 3.4 专项四：☆ NDVI 计算与分类精度评价（混淆矩阵 + 总体精度 + 制图/用户精度 + Kappa 系数手算例题）

#### Part A：NDVI 计算与地物类型判读例题
> **题目**：测得某地物四个典型像元（A、B、C、D）经过大气校正后的红光波段反射率 $\rho_{\text{Red}}$ 与近红外反射率 $\rho_{\text{NIR}}$ 分别为：A（$0.06,\ 0.54$）、B（$0.12,\ 0.28$）、C（$0.24,\ 0.26$）、D（$0.06,\ 0.01$）。计算各像元 NDVI 并判别所属典型地物类型。

* **【满分分步解答】**（核心公式：$\text{NDVI} = \frac{\rho_{\text{NIR}} - \rho_{\text{Red}}}{\rho_{\text{NIR}} + \rho_{\text{Red}}}$）
  * **像元 A**：$\text{NDVI}_A = \frac{0.54 - 0.06}{0.54 + 0.06} = \frac{0.48}{0.60} = \mathbf{+0.800}$ $\rightarrow$ 近红外极强反射且红光被叶绿素强烈吸收，判定为**健康茂密林地或旺季农作物**。
  * **像元 B**：$\text{NDVI}_B = \frac{0.28 - 0.12}{0.28 + 0.12} = \frac{0.16}{0.40} = \mathbf{+0.400}$ $\rightarrow$ 中等植被光谱响应，判定为**稀疏草地或低覆盖度农田**。
  * **像元 C**：$\text{NDVI}_C = \frac{0.26 - 0.24}{0.26 + 0.24} = \frac{0.02}{0.50} = \mathbf{+0.040}$ $\rightarrow$ 红光与近红外反射率相近且近红外略高，数值贴近 $0$，判定为**干燥裸土或城镇水泥建筑**。
  * **像元 D**：$\text{NDVI}_D = \frac{0.01 - 0.06}{0.01 + 0.06} = \frac{-0.05}{0.07} \approx \mathbf{-0.714}$ $\rightarrow$ 近红外几乎全吸收低于可见红光反射，呈典型深负值，判定为**清洁水体**。

#### Part B：混淆矩阵精度指标与 Kappa 系数完整手算例题（第 8 章 8.5，p.238 必考）
* **核心计算公式体系（设总样本 $N$、类别数 $m$，行合计 $x_{i+}$、列合计 $x_{+i}$、主对角线正确样本 $x_{ii}$）**：

  $$\text{总体精度（OA）} = \frac{\sum_{i=1}^{m} x_{ii}}{N}, \qquad \text{制图精度（PA}_i\text{）} = \frac{x_{ii}}{x_{\text{真实类合计}}}, \qquad \text{用户精度（UA}_i\text{）} = \frac{x_{ii}}{x_{\text{分类类合计}}}$$

  $$\text{总体 Kappa（}K\text{）} = \frac{N \sum_{i=1}^{m} x_{ii} - \sum_{i=1}^{m} (x_{i+} \cdot x_{+i})}{N^2 - \sum_{i=1}^{m} (x_{i+} \cdot x_{+i})}, \qquad \text{条件 Kappa（}K_i\text{）} = \frac{N \cdot x_{ii} - x_{i+} \cdot x_{+i}}{N \cdot x_{+i} - x_{i+} \cdot x_{+i}}$$

  （注：漏分误差 $\text{OE}_i = 1 - \text{PA}_i$，错分误差 $\text{CE}_i = 1 - \text{UA}_i$。）

> **题目**：某县土地利用遥感监督分类后随机抽取 $N = 200$ 个地面验证样点，统计得到如下混淆矩阵（**行为地面真实参考类别，列为遥感分类结果类别**）。试计算：① **总体分类精度（OA）**；② 各类别的**制图精度（PA）与用户精度（UA）**（附漏分/错分误差）；③ **总体 Kappa 系数 $K$** 及林地类条件 Kappa 系数 $K_1$，并依据课程标准评价分类质量等级。
>
> | 真实参考类 \ 遥感分类类 | 林地（列 1） | 耕地（列 2） | 水体（列 3） | 真实类行合计 $x_{i+}$ |
> | :--- | :---: | :---: | :---: | :---: |
> | **林地（行 1）** | **$68$** | $7$ | $0$ | **$75$** |
> | **耕地（行 2）** | $8$ | **$62$** | $5$ | **$75$** |
> | **水体（行 3）** | $2$ | $3$ | **$45$** | **$50$** |
> | **分类类列合计 $x_{+i}$** | **$78$** | **$72$** | **$50$** | **总样本 $N = 200$** |

* **【满分分步手算解答】**
  1. **计算总体分类精度（OA）**：
     * 主对角线正确分类样本总和：$\sum x_{ii} = 68 + 62 + 45 = 175$。

     $$\text{OA} = \frac{175}{200} = 0.8750 = \mathbf{87.50\%}$$

  2. **计算各类制图精度（PA / 漏分）与用户精度（UA / 错分）**：
     * **林地**：$\text{PA}_1 = \frac{68}{75} \approx \mathbf{90.67\%}$（漏分误差 $9.33\%$）；$\text{UA}_1 = \frac{68}{78} \approx \mathbf{87.18\%}$（错分误差 $12.82\%$）。
     * **耕地**：$\text{PA}_2 = \frac{62}{75} \approx \mathbf{82.67\%}$（漏分误差 $17.33\%$）；$\text{UA}_2 = \frac{62}{72} \approx \mathbf{86.11\%}$（错分误差 $13.89\%$）。
     * **水体**：$\text{PA}_3 = \frac{45}{50} = \mathbf{90.00\%}$（漏分误差 $10.00\%$）；$\text{UA}_3 = \frac{45}{50} = \mathbf{90.00\%}$（错分误差 $10.00\%$）。
  3. **计算总体 Kappa 系数 $K$ 与林地条件 Kappa $K_1$**：
     * 计算边际乘积之和：

       $$\sum_{i=1}^{3} (x_{i+} \cdot x_{+i}) = 75 \times 78 + 75 \times 72 + 50 \times 50 = 5850 + 5400 + 2500 = 13750$$

     * 代入总体 Kappa 公式：

       $$K = \frac{200 \times 175 - 13750}{200^2 - 13750} = \frac{35000 - 13750}{40000 - 13750} = \frac{21250}{26250} \approx \mathbf{0.8095\ (80.95\%)}$$

     * 林地条件 Kappa 系数检验（对应分类结果列合计 $x_{+1} = 78$）：

       $$K_1 = \frac{200 \times 68 - 75 \times 78}{200 \times 78 - 75 \times 78} = \frac{13600 - 5850}{15600 - 5850} = \frac{7750}{9750} \approx \mathbf{79.49\%}$$

  4. **分类质量评价**：依据课程 Kappa 分类质量分级标准（$<0$ 很差、$0.00\sim 0.20$ 一般、$0.20\sim 0.40$ 较差、$0.40\sim 0.60$ 中等、$0.60\sim 0.80$ 很好、$0.80\sim 1.00$ **极好**），本例 $K = 80.95\% > 0.80$，说明分类结果与地表真实情况处于**极好一致**水平，可用于专题制图交付。

## 模块四：第 9 章遥感技术应用开放性综合题万能模板（10 分保底框架）

### 4.1 “六步满分工程设计框架”（通杀第 9 章任意开放性应用大题）

> **考场套用说明**：老师明确提示“第 9 章综合题不定考哪些领域”。无论试卷给出**洪涝灾害、森林监测、土地利用调查、城市热岛、农业旱情还是海洋生态**，直接严格按以下 **“六步满分工程设计框架”** 逐条展开并填入选定传感器与关键光谱指标，即可稳拿 9～10 分！

1. **第一步：明确应用目标与关键遥感指标（1.5 分）**
   * 点明监测对象、空间尺度与时效要求，锁定 1～2 个核心定量物理/光谱指标（如植被/生态用 **NDVI**、水体/洪涝用 **NDWI / MNDWI 或 SAR 后向散射系数 $\sigma^0$**、热场/林火用 **亮温 $T_B$ / 地表温度 LST**、地震滑坡用 **In-SAR 干涉形变相位**）。
2. **第二步：遥感数据源与传感器协同选型（2 分）**
   * 紧扣第 3、5、6 章卫星载荷特性按“空间 + 光谱 + 时间 + 气候穿透”多源搭配：
     * 精细斑块/城市调查选 **GF-2（$0.8\text{ m}$ 亚米级）/ GF-1（$2\text{ m}$ / $800\text{ km}$ 超宽幅）**；
     * 农林植被长时序定量监测选 **Landsat-8/9（$30\text{ m} / 16\text{ d}$ + 热红外）**、**Sentinel-2（$10\text{ m}/5\text{ d}$ + 红边）** 或 **GF-6（红边精准农业）**；
     * 高时效应急盯防选 **GF-4（$50\text{ m}/5\sim 20\text{ s}$ 静止凝视）** 或 **MODIS（每日覆全球）**；
     * 阴雨多云或形变监测选全天候穿云的 **GF-3 / Sentinel-1（C 波段 SAR）**；精细三维地形与林下高程选 **机载 LiDAR**。
3. **第三步：多源图像系统预处理（2 分）**
   * **辐射校正**：开展辐射定标（DN $\rightarrow$ 辐射亮度）与 **6S / DOS 大气校正**（剥离程辐射得地表反射率），SAR 数据需做辐射定标与**相干斑滤波（如 Lee/Frost 滤波）**；
   * **几何校正**：以标准参考底图为基准均匀选取 **GCP 地面控制点**，采用二次多项式与**间接法 + 最邻近/双线性重采样**（山区结合 DEM 正射校正）实现多期多源影像亚像元级配准（RMSE $< 0.5\sim 1$ 像元）；
   * **图像融合与镶嵌裁剪**：对同源高分全色 PAN 与多光谱 MS 采用 **PCA / Gram-Schmidt / IHS** 融合提高空间分辨率，跨景用直方图匹配无缝镶嵌并按研究区矢量边界裁剪。
4. **第四步：图像增强、信息提取与变化检测方法（2 分）**
   * 合成**标准假彩色影像**（如 OLI 5-4-3）建立目视解译标志，辅以空间/频域滤波增强与 PCA / K-T 变换降维去噪；
   * 联合**阈值法/指数法**（NDVI/NDWI 分割）、**最大似然监督分类 / ISODATA 非监督聚类**或面向对象/深度学习分类提取专题要素；多时相动态监测采用**波段差值或分类后比较法**生成转移变化图斑。
5. **第五步：分类后处理与定量精度评价（1.5 分）**
   * 对逐像元分类结果施以 $3 \times 3$ 或 $5 \times 5$ **多数平滑滤波（Majority Filter）** 消除零星“椒盐”碎斑，结合小斑块合并完成栅格矢量化；
   * 通过野外 GNSS 实地调查与高分样本独立抽样构建**混淆矩阵**，定量计算 **总体精度（OA）、制图精度（PA）、用户精度（UA）与 Kappa 系数**（要求 $K > 0.80$ 达极好一致），对超限类别迭代补充训练样本修正。
6. **第六步：专题制图与 3S 协同辅助决策输出（1 分）**
   * 依托 **GIS** 空间分析功能，将遥感专题图斑与行政界线、DEM 坡度、人口路网矢量叠加统计，完成受灾面积量算、空间演变趋势分析，最终输出标准专题分布图、统计报表与应急/监管决策建议报告（构成 RS+GNSS+GIS **3S 闭环**）。

### 4.3 典型套用示范一（10 分）：洪涝灾害全天候应急遥感监测与灾损评估方案

> **模拟设问（10 分）**：某流域夏季遭遇持续特大暴雨引发严重洪涝灾害，灾区上空长期被浓厚云雨层覆盖。试设计一套利用多源遥感与 3S 技术开展**洪水淹没范围动态提取与灾情评估**的完整技术方案。

* **【10 分满分标准作答示范】**
  1. **应用目标与核心指标（1.5 分）**：针对暴雨云雨覆盖下**全天候快速锁定新增淹没区与灾损评估**的迫切需求，核心以灾中 **SAR 后向散射系数 $\sigma^0$** 识别水体为抓手，辅以灾前光学 **归一化水体指数（NDWI / MNDWI）** 界定常态河湖本底。
  2. **多源传感器协同选型（2 分）**：因无选择性散射导致可见光/红外无法穿云，灾中应急监测核心选用具备**全天候穿云透雾、全天时成像能力的 C 频段星载雷达——中国高分三号（GF-3，条带/扫描模式）与欧空局 Sentinel-1（IW 模式）**；灾前常态水体底图选用 **GF-1（$2\text{ m}/8\text{ m}$）或 Sentinel-2（$10\text{ m}$）** 光学影像，辅以区域 **DEM** 数据。
  3. **图像系统预处理（2 分）**：对灾前光学影像实施辐射定标、6S/DOS 大气校正及 GCP 精校正；对灾中 GF-3 / Sentinel-1 SAR 影像依次进行**辐射定标、相干斑滤波（如 Lee 滤波压制斑点噪声）、结合 DEM 的斜距-地距正射地形校正**（消除山地透视收缩与叠掩），并借 GCP 配准使灾前、灾中影像严格套合（RMSE $< 0.5$ 像元）。
  4. **水体信息提取与变化检测（2 分）**：利用平静洪水表面发生**镜面反射**导致无后向散射回波、在 SAR 影像呈典型低值纯暗区的物理机制，采用直方图双峰波谷阈值分割法精准提取灾中全水体范围（结合斜坡坡度掩膜剔除雷达山体阴影伪警）；利用灾前光学 NDWI 提取常态水体，经二值图层**空间差值叠置变化检测**，剥离原有河湖即可锁定新增洪涝淹没区。
  5. **分类后处理与精度评定（1.5 分）**：对初步提取的洪水二值图施以 $3 \times 3$ **多数平滑滤波**消除零星椒盐碎斑；借助无人机灾区低空遥感影像及救援实地 GNSS 采样点建立**混淆矩阵**，计算 **OA、水体 PA/UA 及 Kappa 系数**（要求 $K > 0.80$）以保证水陆边界精度达标。
  6. **专题制图与 3S 应急决策输出（1 分）**：在 **GIS** 平台中将精准提取的洪涝淹没矢量多边形与行政区划、耕地分布、居民点及道路水系图层叠加分析，自动统计分县受灾面积、淹没农田与受困村镇清单，及时产出洪涝动态演变专题图与抢险救灾辅助决策报告。

### 4.4 典型套用示范二（10 分）：区域土地利用 / 森林资源动态遥感调查与覆盖度监测方案

> **模拟设问（10 分）**：试结合课程所学遥感数据源、图像处理、分类与精度评定方法，设计一套针对某县域开展**土地利用现状与森林资源覆盖动态调查**的标准遥感工程技术路线。

* **【10 分满分标准作答示范】**
  1. **应用目标与监测指标（1.5 分）**：旨在摸清区域耕地、林地（乔木/灌木）、草地、水体与建设用地的空间分布及年度动态转移规律，核心采用**标准假彩色合成特征、归一化植被指数（NDVI）、K-T 绿度/亮度分量与植被覆盖度（FVC）** 作为监测定量指标。
  2. **遥感数据源选型（2 分）**：遵循“高精度 + 广覆盖 + 时相一致”原则，县域精细地块勾绘选用亚米级光学星 **GF-2（$0.8\text{ m}$ 全色 / $3.2\text{ m}$ 多光谱）** 与精准农林红边星 **GF-6 / Sentinel-2**；历史长时序趋势对比协同 **Landsat-8/9 OLI**（同选夏季生长旺季太阳同步过境影像以保持太阳光照角与物候可比性）。
  3. **多源数据预处理（2 分）**：对各期影像进行**辐射定标与 6S 大气校正**统一反射率尺度；均匀选取稳固道路交叉口、桥梁角点作为 **GCP 地面控制点**，采用二次多项式与间接法执行精密地理配准（若用于自动分类优选**最邻近重采样**保留原始 DN 值，若先做目视底图与融合则用双线性/三次卷积），再采用 **PCA 或 Gram-Schmidt 变换**将高分全色与多光谱影像融合，同时兼顾亚米级边界清晰度与多波段光谱保真度。
  4. **特征增强、分类与动态变化提取（2 分）**：对融合后影像做 **5-4-3 标准假彩色合成**（植被呈鲜红/暗红、水体呈深黑、建筑呈蓝灰）建立九大目视解译标志，同时计算 **NDVI 与 PCA 主成分**作为辅助分类通道；选取分布均匀纯正的 ROI 训练样本执行**最大似然监督分类（MLC）**（高分辨率精细区辅以面向对象分割 OBIA 抑制椒盐效应）；对前后两期分类专题图执行**分类后比较叠加**，生成地类转移矩阵（如林地净增减、耕地转建设用地）。
  5. **后处理与定量精度评价（1.5 分）**：采用 $3 \times 3$ **多数平滑滤波**剔除分类碎斑并对符合制图规范的图斑矢量化；采取分层随机采样并结合 GNSS 外业实地核查点构建**混淆矩阵**，逐一核算 **总体精度（OA）、各类制图精度（PA）与用户精度（UA）及 Kappa 系数**，确保总体精度 $\ge 85\%$ 且 $K > 0.80$ 满足国土/林业验收标准。
  6. **专题制图与综合决策应用（1 分）**：借助 **GIS** 将调查成果与地形 DEM 坡度图叠加，分析退耕还林、毁林侵占或城市扩张空间规律，最终形成标准土地利用/森林现状专题图、各级地类面积及动态变化统计报表与生态监管决策建议报告。
</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
