## 模块一：高危未考名词解释精选（5 分三段式 · 每条 100～130 字）

> **5 分答题模板**：① **本质属类**（1 分：先定性是什么参数/现象/方法）＋ ② **物理/数学机理或公式**（2 分：写清定量公式或核心作用机制）＋ ③ **遥感特征与工程应用**（2 分：说明影像表现或实际用途）。

### 1.1 瑞利散射与米氏散射

* **5 分满分背诵版**：瑞利散射与米氏散射是电磁波穿过大气层时偏离原方向传播的非吸收散射衰减机制。当大气气体分子直径 $a \ll \lambda$ 时发生瑞利散射，强度 $I \propto \lambda^{-4}$；气溶胶粒径 $a \approx \lambda$ 时发生米氏散射，强度 $I \propto \lambda^{-2}$。二者产生程辐射使真彩色偏蓝发灰，多光谱常舍短波或用暗目标与 6S 模型校正。
* **【5 分采分拆解】**：① 电磁波大气散射衰减机制（1 分）；② 粒径条件 $a \ll \lambda$、$a \approx \lambda$ 及关系式 $I \propto \lambda^{-4}$、$I \propto \lambda^{-2}$（2 分）；③ 产生程辐射致图像偏蓝降反差，需舍短波或大气校正（2 分）。

### 1.2 比辐射率（发射率 $\varepsilon$）

* **5 分满分背诵版**：比辐射率是表征实际灰体物体热辐射发射能力与理想黑体差异的无量纲热物理参数。依基尔霍夫定律，同温同波长下实际与黑体辐射出射度之比为 $\varepsilon(\lambda) = M / M_0 = \alpha(\lambda)$，不透明体满足 $\varepsilon = 1 - \rho$。它是热红外识别岩矿地物特征、并将亮度温度反演为真实地表温度的核心参数。
* **【5 分采分拆解】**：① 灰体热辐射能力无量纲参数（1 分）；② 基尔霍夫定律 $\varepsilon = M/M_0 = \alpha$ 与 $\varepsilon = 1 - \rho$（2 分）；③ 识别热红外地物、由亮温反演真实地表温度（2 分）。

### 1.3 四大分辨率（空间 / 光谱 / 辐射 / 时间分辨率）

* **5 分满分背诵版**：四大分辨率是评价传感器探测空间细节、光谱通道、能量灰阶与时间动态能力的核心指标。空间分辨率指可辨最小地面单元（$D = H \cdot \text{IFOV}$）；光谱为最小波长间隔 $\Delta\lambda$；辐射为可辨能量差及量化数 $2^n$；时间为重访周期。受能量制约，空间与光谱分辨率互斥，工程常靠图像融合协同。
* **【5 分采分拆解】**：① 评价传感器综合探测能力的四大核心指标（1 分）；② 分别准确定义空间、光谱、辐射、时间分辨率（2 分）；③ 空间与光谱能量互制及通过融合、多星组网折中解决（2 分）。

### 1.4 侧摆角与重访周期

* **5 分满分背诵版**：侧摆角与重访周期是衡量卫星跨轨机动能力与时间观测频率的轨道几何指标。侧摆角指传感器光轴垂直飞行方向左右偏转的角度（如 $\pm 35^\circ$），借扩大可观走廊缩短同一地区相邻两次成像的间隔即重访周期。侧摆技术可在保证高空间分辨率下将重访压缩至数天，满足灾害应急监测。
* **【5 分采分拆解】**：① 评价卫星跨轨机动与观测频率的轨道指标（1 分）；② 垂直航向偏转角定义及缩短相邻两次成像间隔机制（2 分）；③ 兼顾高空间分辨率与短周期重访，支撑灾害应急监测（2 分）。

### 1.5 几何精校正与灰度重采样

* **5 分满分背诵版**：几何精校正与灰度重采样是消除影像非系统畸变并重建标准栅格的预处理技术。精校正利用地面控制点建多项式或共线方程映射坐标，再按间接法反算原始浮点坐标并以最邻近、双线性或三次卷积法插值重采样。该过程使影像严格配准至地图坐标系，支撑变化检测与 GIS 融合。
* **【5 分采分拆解】**：① 消除非系统畸变与重建栅格的预处理技术（1 分）；② GCP 建坐标变换模型 + 间接法反算坐标 + 三种内插重采样赋灰度（2 分）；③ 实现严格地图地理配准，支撑变化检测与 GIS 融合（2 分）。

### 1.6 主成分变换（PCA / K-L 变换）

* **5 分满分背诵版**：主成分变换（PCA）是基于多波段协方差统计特征的数据驱动正交线性变换。通过求解 $\lvert \Sigma - \lambda I \rvert = 0$ 得正交特征向量矩阵 $A$ 并投影 $Y = A^T X$，消除波段间相关性并将总方差高度集中于前几个主分量。高阶分量多为随机噪声，故该变换广泛用于图像降维压缩、去噪及多源融合。
* **【5 分采分拆解】**：① 数据驱动的正交线性特征变换（1 分）；② $\lvert \Sigma - \lambda I \rvert = 0$ 求特征向量及 $Y = A^T X$ 去相关集中方差（2 分）；③ 前分量保留主体信息、舍高阶去噪，用于降维与 PCA 融合（2 分）。

### 1.7 缨帽变换（K-T 变换）

* **5 分满分背诵版**：缨帽变换（K-T）是基于作物生长与土壤光谱空间结构设计的经验固定系数正交变换。按特定传感器预先标定的固定旋转矩阵对多波段加权，投影出亮度（土壤反照率）、绿度（植被生物量）与湿度/黄度分量。因矩阵固定且物理意义明确，可直接跨时空对比，用于农业旱情与生态退化监测。
* **【5 分采分拆解】**：① 传感器固定系数的经验正交线性变换（1 分）；② 固定旋转矩阵生成亮度、绿度、湿度/黄度正交分量（2 分）；③ 分量物理意义明确且可跨时空直接对比，服务农林与旱情监测（2 分）。

### 1.8 归一化植被指数（NDVI）

* **5 分满分背诵版**：归一化植被指数是利用红光与近红外反射率组合表征绿色植被覆盖与活力的无量纲指数。其公式为 $NDVI = (\rho_{\text{NIR}} - \rho_{\text{Red}}) / (\rho_{\text{NIR}} + \rho_{\text{Red}})$，基于海绵组织近红外强反射与叶绿素红光吸收构建，取值 $[-1, 1]$。比值形式削弱地形阴影与光照干扰，常用于植被覆盖度与干旱监测，高覆盖易饱和。
* **【5 分采分拆解】**：① 表征绿色植被长势与覆盖度的无量纲光谱指数（1 分）；② 公式、取值 $[-1, 1]$ 及红光吸收/近红外强反射物理机制（2 分）；③ 削弱地形光照干扰，用于 FVC 反演与物候监测，高生物量易饱和（2 分）。

### 1.9 监督分类与非监督分类

* **5 分满分背诵版**：监督与非监督分类是依据光谱特征自动划分遥感专题类别的两大模式识别体制。监督分类先选已知训练样区建立判别函数（如最大似然、最小距离法）再逐像元判决；非监督分类无须先验样本，直接按特征空间距离自动聚类（如均值、迭代自组织）后人工定名。二者常协同互补用于精确制图。
* **【5 分采分拆解】**：① 计算机自动识别专题类别的两大分类体制（1 分）；② 监督“先训练 ROI 建判别函数后判决”与非监督“无样本先聚类后定名”（2 分）；③ 典型算法列举与先验可控 vs 发现未知类的互补应用（2 分）。

### 1.10 混合像元与高光谱遥感

* **5 分满分背诵版**：混合像元与高光谱分别描述像元光谱混杂现象及精细光谱探测技术。单瞬时视场含两种以上地物的像元即混合像元，致光谱平均失真；高光谱指用纳米级窄波段（$<10\text{ nm}$）连续成像获取“图谱合一”立方体。其连续曲线可捕捉矿物羟基与植被红边，并支撑混合像元亚像元丰度解混。
* **【5 分采分拆解】**：① 像元光谱混杂现象与连续窄波段成像技术（1 分）；② 混合像元定义 + 高光谱“图谱合一”三维立方体与 $<10\text{ nm}$ 连续波谱（2 分）；③ 捕捉诊断窄吸收带，实现精细矿物/植被识别与亚像元混合分解（2 分）。

### 1.11 3S 集成

* **5 分满分背诵版**：3S 集成是将遥感、地理信息系统与全球导航卫星系统融为一体的现代对地观测空间信息技术体系。其中全球导航卫星系统提供精密三维定位与控制坐标，遥感快速大范围获取动态影像及专题信息，地理信息系统负责空间管理、建模与辅助决策。三者构成实时闭环，服务国土调查与减灾。
* **【5 分采分拆解】**：① RS、GIS、GNSS 融合的一体化空间信息体系（1 分）；② 分别阐明 GNSS 定位、RS 探测获取信息、GIS 管理建模分析的核心分工（2 分）；③ 形成实时动态业务闭环，服务国土调查、防灾减灾与智慧城市（2 分）。

## 模块二：高危未考核心问答题预测（5 分 5 点采分结构）

> **5 分问答题作答策略**：阅卷实行“踩点给分”，每题直接写出 **5 个加粗采分点**（每点 1 分），做到“先抛核心术语 + 后补机制或数字”，篇幅控制在 180～250 字，5 分钟稳拿 5 分。

### 2.1 大气散射的三种类型发生条件及对遥感成像的影响（含真彩色发蓝与多波段去霾原理）

1. **瑞利散射（1 分）**：发生于大气气体分子粒径远小于入射波长（$a \ll \lambda$）时，散射强度与波长的四次方成反比（$I \propto \lambda^{-4}$），波长越短散射越强（晴朗天空呈蔚蓝色）。
2. **米氏散射（1 分）**：发生于气溶胶、烟尘与霾粒粒径与波长相近（$a \approx \lambda$）时，散射强度近似与波长平方成反比（$I \propto \lambda^{-2}$），是雾霾区定量遥感大气校正的重点消除对象。
3. **无选择性散射（1 分）**：发生于云滴、雾滴与大尘埃粒径远大于波长（$a \gg \lambda$）时，散射强度与波长无关（$I \propto \lambda^0$），使云雾呈灰白色并彻底阻挡可见光与红外传感。
4. **对成像的影响及真彩色发蓝成因（1 分）**：散射会衰减地物反射能量并向传感器注入不携带地表信息的**程辐射**，显著降低图像反差与清晰度；其中蓝光波段（$0.45\sim 0.52\ \mu\text{m}$）波长最短、瑞利散射最强烈，叠加大量蓝色程辐射导致真彩色影像整体**发蓝偏灰**。
5. **多波段去霾原理解释（1 分）**：工程上常舍弃紫/蓝短波，优先选用波长更长的近红外、短波红外（SWIR1/2）或微波（SAR）波段穿透薄霾与云雾；或利用长波段受散射极小的特点，通过**暗目标法（DOS）、波段回归分析法或 6S 辐射传输模型**剥离短波程辐射实现多波段去霾增强。

### 2.2 水体、土壤、岩石的典型反射波谱特征及主要影响因素

1. **清洁水体波谱特征（1 分）**：整体反射率极低（$< 10\%$，平均约 $3\%$），在**蓝绿光波段（$0.4\sim 0.6\ \mu\text{m}$）** 反射率略高（$4\%\sim 5\%$）且有一定透射水深能力；过 $0.6\ \mu\text{m}$ 急剧衰减，在**近红外至短波红外波段（$> 0.76\ \mu\text{m}$）几乎全吸收、反射率趋近于 $0$**，影像呈极暗黑色（水陆边界清晰）。
2. **浑浊与富营养化水体影响因素（1 分）**：水体波谱受**泥沙悬浮物、藻类叶绿素及水深**控制——含沙量增加时散射增强，反射率全面升高且峰值波长向黄红长波移动（**红移**）；含叶绿素藻华水体在绿光（$550\sim 570\text{ nm}$）和近红外（$0.7\sim 0.8\ \mu\text{m}$）出现类似植被的抬升峰（严重时呈现“红边”）。
3. **土壤典型反射波谱特征（1 分）**：自然土壤反射曲线**整体平缓光滑、无剧烈突变峰谷**，在可见光至短波红外区间（$0.4\sim 2.0\ \mu\text{m}$）反射率随波长增加呈**总体单调递增趋势**。
4. **土壤波谱四大影响因素（1 分）**：① **土壤含水量**越大整体反射率越低（湿土比干土暗），并在 $1.4\ \mu\text{m}$ 与 $1.9\ \mu\text{m}$ 出现水分吸收谷；② **有机质含量**越高反射率越低；③ **颗粒质地**越细越平整反射率越高（粗砂因微阴影效应偏暗）；④ **三价氧化铁（$\text{Fe}^{3+}$）** 在 $0.85\sim 0.9\ \mu\text{m}$ 产生吸收带并抬高红光反射率。
5. **岩石与矿物反射波谱特征（1 分）**：岩浆岩整体反射率随二氧化硅酸性程度增大而升高（花岗岩 $>$ 安山岩 $>$ 玄武岩）；矿物在**可见光–近红外（$0.4\sim 1.2\ \mu\text{m}$）** 受铁锰金属离子电子跃迁控制，在**短波红外（$1.3\sim 2.5\ \mu\text{m}$）** 受羟基（$-\text{OH}$）、碳酸根（$\text{CO}_3^{2-}$）分子振动控制产生窄吸收谷，在**热红外（$8\sim 14\ \mu\text{m}$）** 则受硅氧键（$\text{Si}-\text{O}$）振动控制识别硅酸盐矿物。

### 2.3 遥感图像几何变形的内部与外部 8 大误差源及几何精校正完整作业流程

1. **内部误差（2 大类，1 分）**：来源于传感器自身性能畸变——① **光学与探测器静态畸变**（镜头径向/切向畸变、焦平面探测元排列不均匀）；② **扫描与采样动态误差**（扫描镜转速波动、电子采样速率抖动引起的行列错位）。
2. **外部误差（6 大类，合计构成 8 大误差源，2 分）**：① **成像投影方式变形**（光机摆扫全景畸变与雷达斜距压缩）；② **平台外方位元素变化**（位置偏移及滚转/俯仰/偏航角抖动）；③ **地形起伏引起的中心投影视差位移**（$\delta_h = \frac{r \cdot h}{H}$）；④ **地球曲率变形**（等效高程降低 $\Delta h = \frac{D^2}{2R_0}$ 导致边缘径向拉伸）；⑤ **地球自转偏斜**（极轨自北向南扫描叠加地球自西向东自转，使整景影像扭曲成**平行四边形**）；⑥ **大气折射误差**（电磁波路径弯曲引起像点偏移）。
3. **步骤一～二：选点与构建变换模型（1 分）**：依据**特征清晰、位置不变、高程接近、分布均匀、数量充足**原则在影像与基准图上选取同名**地面控制点（GCP）**；按一次、二次或三次多项式（或共线方程）采用最小二乘平差解算坐标变换系数，并检验残差均方根误差（RMSE，通常需控制在 $0.5\sim 1$ 个像元内，超限点予以剔除迭代）。
4. **步骤三：间接法坐标反算（1 分）**：从空白规则输出图像网格出发，逐行逐列对每个输出地理坐标 $(X, Y)$ 代入逆变换方程，反求其在原始畸变影像上的非整数浮点坐标 $(x, y)$，从而彻底避免直接法带来的像素空洞或重叠漏洞。
5. **步骤四：灰度重采样与精度检核输出（1 分）**：依据后续用途选择**最邻近法**（保光谱供分类）、**双线性内插**（平滑适中）或**三次卷积内插**（高精度制图）为输出像元赋灰度值；最后用独立检核点（Check Points）验证几何定位精度并输出标准地理编码图像。

### 2.4 遥感图像三种存储格式（BSQ、BIL、BIP）的数据组织结构与适用场景对比

| 格式缩写 | 英文全称 | 数据存储排列顺序 | 空间维与光谱维访问效率 | 典型适用场景 |
| :---: | :--- | :--- | :--- | :--- |
| **BSQ** | Band Sequential（波段顺序） | 按**波段**连续存放整幅二维数组 | 单波段空间读取**最快**；提取单像元多波段光谱最慢 | 单波段显示、空间滤波、空间裁剪 |
| **BIL** | Band Interleaved by Line（按行交叉） | 按**扫描行**交替存放各波段该行数据 | 空间行与光谱读取效率**居中折中** | 线阵推扫实时记录、常规综合处理 |
| **BIP** | Band Interleaved by Pixel（按像元交叉） | 按**像元**依次紧邻存放全波段光谱值 | 单个像元光谱向量读取**最快**；单波段空间读取慢 | 逐像元分类、光谱曲线提取、端元分解 |

1. **BSQ（波段顺序格式）组织结构（1 分）**：先完整存储第 1 波段全部 $m$ 行 $n$ 列像元，再依次紧接着存储第 2 至第 $p$ 波段（波段内空间连续，波段间分块隔离）。
2. **BIL（波段按行交叉格式）组织结构（1 分）**：以扫描行为基本单位，先存第 1 行的第 1 至第 $p$ 波段行数据，再存第 2 行的第 1 至第 $p$ 波段，兼顾行内空间连续与波段同步存取。
3. **BIP（波段按像元交叉格式）组织结构（1 分）**：以单个像元为单位，把像元 $(i, j)$ 的第 1 至第 $p$ 波段数值紧邻排列后再存下一个像元 $(i, j+1)$，同一像元的光谱向量在磁盘上物理连续。
4. **访存性能核心对比（1 分）**：**空间邻域操作效率**：$\text{BSQ} > \text{BIL} > \text{BIP}$；**逐像元多波段光谱运算效率**：$\text{BIP} > \text{BIL} > \text{BSQ}$。
5. **工程适用场景选择（1 分）**：空间卷积滤波、几何重采样与单波段浏览优选 **BSQ**；卫星下行流逐行实时传输与兼顾空间/光谱的常规处理优选 **BIL**；最大似然分类、高光谱端元解混与单点波谱曲线读取优选 **BIP**。

### 2.5 监督分类与非监督分类的流程对比、典型算法及精度评价指标

1. **工作流程根本差异（1 分）**：**监督分类**属于“先训练后判别”（先选已知地物训练样区 ROI $\rightarrow$ 统计光谱参数构建判别函数 $\rightarrow$ 全图逐像元判别归属）；**非监督分类**属于“先聚类后定名”（无需先验样本 $\rightarrow$ 按特征空间相似度自动聚类成光谱类 $\rightarrow$ 事后目视或实地调查赋予地学属性）。
2. **监督分类典型算法（1 分）**：**最小距离法**（计算到各类均值中心的欧氏/计程/马氏距离，速度快但未用先验概率与多波段协方差结构）；**最大似然法（MLC）**（基于贝叶斯准则并假定各类服从多元正态分布，综合利用均值、协方差矩阵与先验概率使总错分概率最小，理论精度最优）。
3. **非监督分类典型算法（1 分）**：**K-均值（K-Means）算法**（设定固定类别数 $k$，按最小误差平方和迭代更新聚类中心，简单快速但类别数僵化、受初值影响大）；**ISODATA 算法**（在 K-均值基础上引入类别**动态合并与分裂**机制，可根据内部方差与类间距离自动调整类别总数）。
4. **混淆矩阵与基础精度指标（1 分）**：将分类图与实地/高分真值样点交叉统计形成 $r \times r$ 混淆矩阵（对角线 $x_{ii}$ 为正确样本数，总样本 $N$）：**总体精度（OA）** $= \frac{\sum x_{ii}}{N}$；**制图精度（PA，对应漏分误差）** $= \frac{x_{ii}}{x_{i+}}$；**用户精度（UA，对应错分误差）** $= \frac{x_{ii}}{x_{+i}}$。
5. **Kappa 系数公式与分级评价（1 分）**：扣除随机一致性影响的综合指标 $K = \frac{N\sum x_{ii} - \sum (x_{i+} x_{+i})}{N^2 - \sum (x_{i+} x_{+i})}$；通常 $K \in [0.60, 0.80]$ 表示分类精度**很好**，$K > 0.80$ 表示与真实地表**极好一致**。

| **高分二号（GF-2）** | 太阳同步；$\pm 35^\circ$ 侧摆重访 **$5\text{ d}$**（无侧摆 $69\text{ d}$） | 全色 + 蓝绿红近红外 **4 波段** | 全色 **$0.8\text{ m}$**（标称 $1\text{ m}$）<br>多光谱 **$3.2\text{ m}$**（标称 $4\text{ m}$） | $45\text{ km}$（双机） | 我国首颗民用**亚米级**光学卫星，适合 $1:10000$ 土地调查、违建识别与精细测图 |
| **Sentinel-2（MSI）** | 太阳同步；单星 $10\text{ d}$ / **双星组网 $5\text{ d}$** | **13 个波段**（含 **3 个红边波段** + 双 SWIR + 卷云） | **$10\text{ m}$**（RGB+NIR）、**$20\text{ m}$**（红边/SWIR）、**$60\text{ m}$**（大气） | **$290\text{ km}$** | 全球免费开放的**红边多光谱主力星**，极擅长作物叶绿素、生态监测与植被分类 |

1. **GF-1 核心特征（1 分）**：搭载两台 $2\text{ m}$ 全色/$8\text{ m}$ 多光谱相机（幅宽 $60\text{ km}$）与四台 $16\text{ m}$ 多光谱宽幅相机（**幅宽达 $800\text{ km}$，重访 $4\text{ d}$**），实现高分辨率与大范围快速覆盖兼顾。
2. **GF-2 核心特征（1 分）**：我国首颗空间分辨率优于 $1\text{ m}$ 的民用光学卫星，达 **$0.8\text{ m}$ 全色 / $3.2\text{ m}$ 多光谱**（幅宽 $45\text{ km}$，侧摆重访 $5\text{ d}$），支撑高精度城市制图与国土监管。
3. **Sentinel-2 核心特征（1 分）**：欧空局哥白尼计划双星组网 **5 天重访**、幅宽 **$290\text{ km}$**，共 **13 波段**，在 **$20\text{ m}$ 分辨率提供 3 个独特红边波段（B5/B6/B7）** 与 $10\text{ m}$ 四波段，大幅提升植被与水体反演精度。
4. **MODIS 核心特征（1 分）**：兼具 **36 个光谱通道**（覆盖可见光至热红外）与 **$2330\text{ km}$ 超宽刈幅**，每 **1～2 天**实现全球覆盖，提供标准 NDVI/EVI、地表温度与气溶胶产品，但空间分辨率较粗（$250\sim 1000\text{ m}$）。
5. **工程选星接替策略（1 分）**：相比传统 Landsat-8（$30\text{ m}$ / $16\text{ d}$），现代工程按尺度互补搭配——县市精细地块用 **GF-2（亚米级）**，流域高频长势用 **Sentinel-2（$10\text{ m}/5\text{ d}$ + 红边）** 或 **GF-1（$16\text{ m}/4\text{ d}$）**，大尺度全球连续动态监测用 **MODIS（每日过境）**。

### 2.7 合成孔径雷达（SAR）成像原理、极化方式与典型几何畸变

1. **合成孔径成像核心原理（1 分）**：SAR 利用搭载于运动平台上的**小尺寸真实天线（长度 $D$）** 在飞行轨迹上连续发射相干微波脉冲并接收记录各点回波的**振幅与多普勒相位**，通过相干信号处理将长约 $L_s = \frac{\lambda R}{D}$ 的一段轨迹合成为等效大孔径天线，实现全天候、全天时高分辨率二维成像。
2. **SAR 双维分辨率物理优势（1 分）**：距离向靠发射宽带窄脉冲压缩获取高地距分辨率 $\Delta R_g = \frac{c \tau}{2\cos\Phi}$；方位向经过合成孔径压缩后，理论分辨率 $\rho_a = \frac{D}{2}$，**与波长 $\lambda$ 和斜距 $R$ 无关**，彻底突破了真实孔径雷达在卫星高轨下需数公里天线的物理极限。
3. **四种雷达极化方式及散射敏感性（1 分）**：以电场矢量相对于入射面的方向划分为水平（H）与垂直（V）极化，组合为**同极化（$HH$、$VV$）** 和**交叉极化（$HV$、$VH$）**。其中 $HH$ 对水平地物与建筑角反射器更敏感，$VV$ 对平静水面与垂直植被茎秆敏感，而交叉极化 $HV/VH$ 主要源自森林冠层**体散射**（多次去极化）。
4. **迎坡畸变——透视收缩与叠掩（1 分）**：雷达按斜距 $R$ 成像，当波束照射迎坡且坡度 $\alpha < \Phi$（俯角）时，坡顶与坡底斜距差缩小，表现为山坡变短变亮的**透视收缩**；当迎坡极陡满足 $\alpha > \Phi$ 时，坡顶比坡底更早返回回波，造成顶底次序颠倒且回波混叠不可逆的**叠掩现象（Layover）**。
5. **平坦斜距压缩与背坡畸变——雷达阴影（1 分）**：平坦地面按等斜距采样使近程比远程横向比例尺压缩，即**斜距比例尺失真**（可通过斜地变换纠正）；当背向雷达的山坡坡度 $\beta > \Phi$ 时波束被山脊完全遮挡，形成无任何回波信号、边界锐利的**雷达阴影（纯黑暗区）**。

## 模块三：高危未考综合题三大 10 分专项模板（手算例题 + 答题套路）

### 3.1 母题一（10 分）：斯忒藩-玻尔兹曼定律亮温反演 + 空间分辨率与幅宽推算

#### 核心公式体系（必写得分点）
1. **斯忒藩-玻尔兹曼定律与实际物体辐射出射度**：

   $$M_0 = \sigma T^4, \qquad M = \varepsilon \sigma T^4 = \sigma T_B^4$$

   式中：$\sigma = 5.67 \times 10^{-8}\text{ W}\cdot\text{m}^{-2}\cdot\text{K}^{-4}$ 为斯忒藩-玻尔兹曼常数；$\varepsilon \in (0, 1]$ 为比辐射率（发射率）；$T$ 为物体真实热力学温度（$T(\text{K}) = t(^\circ\text{C}) + 273$ 或 $273.15$）；$T_B$ 为假定为黑体时的**亮度温度**。
2. **亮度温度 $T_B$ 与真实地表温度 $T$ 相互换算关系**：

   $$T_B = \varepsilon^{\frac{1}{4}} \cdot T, \qquad T = \varepsilon^{-\frac{1}{4}} \cdot T_B$$

3. **传感器星下点空间分辨率 $R$ 与扫描幅宽 $W$**：

   $$R = H \cdot \text{IFOV}, \qquad W_{\text{弧长}} = H \cdot \text{FOV}(\text{rad}) = H \cdot \text{FOV}(^\circ) \cdot \frac{\pi}{180^\circ}, \qquad W_{\text{严密}} = 2H \tan\left(\frac{\text{FOV}}{2}\right)$$

   （注意单位换算：$1\ \mu\text{rad} = 10^{-6}\text{ rad}$，$1\text{ mrad} = 10^{-3}\text{ rad}$。）

#### 【10 分完整手算标准例题】
> **题目**：某极轨对地观测光学/热红外卫星轨道高度 $H = 705\text{ km}$，多光谱探测器的瞬时视场角 $\text{IFOV} = 42.5\ \mu\text{rad}$，总视场角 $\text{FOV} = 15^\circ$。卫星过境某城市工业区时，测得一处水泥广场表面真实温度 $t = 27^\circ\text{C}$（热力学换算取 $T = t + 273\text{ K}$），其热红外比辐射率 $\varepsilon_1 = 0.92$；相邻处有一高温烟囱口可近似看作绝对黑体（$\varepsilon_2 = 1.0$），绝对温度 $T_2 = 600\text{ K}$。已知斯忒藩-玻尔兹曼常数 $\sigma = 5.67 \times 10^{-8}\text{ W}\cdot\text{m}^{-2}\cdot\text{K}^{-4}$，试分步计算：
> （1）水泥广场的实际总辐射出射度 $M_1$ 及传感器测得的亮度温度 $T_{B1}$（并写出已知 $T_{B1}$ 反求真温 $T_1$ 的校验式）；（4 分）
> （2）高温烟囱口的辐射出射度 $M_2$ 及其与水泥广场总辐射能量之比 $M_2 / M_1$；（3 分）
> （3）该卫星星下点空间分辨率 $R$ 与垂直飞行方向的扫描幅宽 $W$。（3 分）

* **【10 分满分分步解答】**

  1. **计算水泥广场实际总辐射出射度 $M_1$ 与亮度温度 $T_{B1}$（4 分）**：
     * 温度换算：$T_1 = 27 + 273 = 300\text{ K}$（注：若严格取 $+273.15$，则 $T_1 = 300.15\text{ K}$，以下按课程惯例取 $300\text{ K}$ 并附严密参考值）。
     * 同温绝对黑体辐射出射度：

       $$M_0(300\text{ K}) = \sigma T_1^4 = 5.67 \times 10^{-8} \times (300)^4 = 5.67 \times 10^{-8} \times 8.1 \times 10^9 = 459.27\text{ W/m}^2$$

     * 水泥广场实际辐射出射度（灰体修正）：

       $$M_1 = \varepsilon_1 M_0 = 0.92 \times 459.27 \approx 422.53\text{ W/m}^2 \quad (\text{取 } 300.15\text{ K 时为 } 423.37\text{ W/m}^2)$$

     * 等效亮度温度 $T_{B1}$（由 $\sigma T_{B1}^4 = \varepsilon_1 \sigma T_1^4$）：

       $$T_{B1} = \varepsilon_1^{\frac{1}{4}} \cdot T_1 = (0.92)^{0.25} \times 300 \approx 0.97936 \times 300 \approx 293.81\text{ K}\ (20.81^\circ\text{C})$$

     * **反演校验（工程逆推思路）**：实际热红外遥感中由传感器先测出亮温 $T_{B1} = 293.81\text{ K}$，因 $\varepsilon_1 = 0.92 < 1$，亮温总比真温偏低 $6.19\text{ K}$，必须利用下式恢复真实地表温度：

       $$T_1 = \varepsilon_1^{-\frac{1}{4}} \cdot T_{B1} = (0.92)^{-0.25} \times 293.81 \approx 300.00\text{ K}\ (27.00^\circ\text{C})$$

  2. **计算高温烟囱辐射出射度 $M_2$ 及能量比值（3 分）**：
     * 绝对黑体（$\varepsilon_2 = 1.0$）在 $T_2 = 600\text{ K}$ 下的总辐射出射度：

       $$M_2 = \varepsilon_2 \sigma T_2^4 = 1.0 \times 5.67 \times 10^{-8} \times (600)^4 = 5.67 \times 10^{-8} \times 1.296 \times 10^{11} = 7348.32\text{ W/m}^2$$

     * 两者总辐射出射度之比：

       $$\frac{M_2}{M_1} = \frac{\varepsilon_2 \sigma T_2^4}{\varepsilon_1 \sigma T_1^4} = \frac{1.0}{0.92} \times \left(\frac{600}{300}\right)^4 = \frac{16}{0.92} \approx 17.39\text{ 倍}$$

     * **物理结论**：绝对温度升高 1 倍（$300\text{ K} \rightarrow 600\text{ K}$），仅温度项就令黑体总辐射能量猛增 $2^4 = 16$ 倍，叠加比辐射率差异后高温烟囱辐射出射度达常温水泥地表的 $17.39$ 倍，这正是热红外传感器能够极其敏锐地捕获高热异常点的物理基础。

  3. **计算卫星星下点空间分辨率 $R$ 与扫描幅宽 $W$（3 分）**：
     * 单位换算：$H = 705\text{ km} = 7.05 \times 10^5\text{ m}$，$\text{IFOV} = 42.5\ \mu\text{rad} = 42.5 \times 10^{-6}\text{ rad}$。
     * 星下点空间分辨率 $R$：

       $$R = H \cdot \text{IFOV} = 7.05 \times 10^5 \times 42.5 \times 10^{-6} = 29.9625\text{ m} \approx 30\text{ m}$$

     * 地面扫描带幅宽 $W$：
       * 按小角度弧长近似法：

         $$W_{\text{弧长}} = 705\text{ km} \times 15^\circ \times \frac{\pi}{180^\circ} \approx 184.57\text{ km} \approx 185\text{ km}$$

       * 按平坦地面严密三角公式：

         $$W_{\text{严密}} = 2 \times 705 \times \tan\left(\frac{15^\circ}{2}\right) = 1410 \times \tan 7.5^\circ \approx 185.63\text{ km}$$

### 3.2 母题二（10 分）：多项式几何精校正、GCP 数量与选点原则及三种重采样对比

#### 1. 多项式几何精校正方程与最少 GCP 数量（4 分）
* **数学模型与系数求解**：直接回避复杂的成像空间几何过程，用 $n$ 次多项式直接拟合原始图像坐标 $(x, y)$ 与输出地理坐标 $(X, Y)$ 之间的映射（工程常采用**间接法**反解 $x = f_1(X, Y),\ y = f_2(X, Y)$，以下写出标准二次多项式一般形式）：

  $$x = a_0 + a_1 X + a_2 Y + a_3 X^2 + a_4 XY + a_5 Y^2$$

  $$y = b_0 + b_1 X + b_2 Y + b_3 X^2 + b_4 XY + b_5 Y^2$$

  选取 $m$ 个地面控制点（GCP，$m > N_{\min}$）列误差方程 $V_x = A\Delta a - L_x$ 与 $V_y = A\Delta b - L_y$，构成法方程并通过最小二乘平差解得变换系数：

  $$\Delta a = (A^T A)^{-1} A^T L_x, \qquad \Delta b = (A^T A)^{-1} A^T L_y$$

* **最少地面控制点（GCP）对数推导公式**：$n$ 次二维多项式的未知系数项数为从 $0$ 次到 $n$ 次各阶齐次项之和，即：

  $$N_{\min} = 1 + 2 + \dots + (n+1) = \frac{(n+1)(n+2)}{2}$$

  * **一次多项式（$n=1$，仿射变换，纠正平移、缩放、旋转）**：$N_{\min} = \frac{2 \times 3}{2} = \mathbf{3\text{ 对}}$（实操常选 $6\sim 10$ 对以上）；
  * **二次多项式（$n=2$，常用，兼顾非线性扭曲与边缘弯曲）**：$N_{\min} = \frac{3 \times 4}{2} = \mathbf{6\text{ 对}}$（如整景 Landsat TM 影像常选 **30 个左右**）；
  * **三次多项式（$n=3$，高阶易产生法矩阵病态与边缘振荡）**：$N_{\min} = \frac{4 \times 5}{2} = \mathbf{10\text{ 对}}$。

#### 2. GCP 地面控制点选点五大原则（2 分）
1. **标志明显清晰**：首选道路交叉口、桥梁端点、水库坝角、机场跑道角点等在图像与参考底图上均能亚像元级精确定位的点位。
2. **位置稳定不变**：严禁选易受季节或人类活动迁移的河岸沙洲、农田田埂、林缘或施工边界，应选长年稳固人工建筑或基岩标志。
3. **空间分布均匀**：应遍布整幅影像四周边缘及中心区域形成良好控制网，避免成簇聚集于局部导致未控制区剧烈外推发散。
4. **高程接近基准**：多项式本身不改正地形视差，在无 DEM 辅助的常规多项式精校正中应尽量选取位于相近高程平面上的控制点，避免高山顶与深谷底混选。
5. **数量留有冗余**：控制点总数须远大于 $N_{\min}$ 以抑制单点误差并能预留独立检核点计算均方根误差（RMSE）。

#### 3. 三种灰度重采样方法公式与优缺点对比（4 分）

| 重采样方法 | 邻域窗口 | 核心数学公式与权重计算 | 优点 | 缺点 | 工程最佳适用场景 |
| :--- | :---: | :--- | :--- | :--- | :--- |
| **最邻近内插法** | $1 \times 1$ | 直接将坐标四舍五入，取距离浮点坐标 $(x, y)$ 最近的 1 个整数像元灰度：<br>$g(x, y) = f(\text{round}(x),\ \text{round}(y))$ | **计算最快、完全保留原始 DN 光谱值不发生畸变** | 最大产生 $\pm 0.5$ 像元几何偏移，斜向线状地物出现严重 **“锯齿”断裂** | **计算机分类前预处理**、已分类专题图几何配准 |
| **双线性内插法** | $2 \times 2$ | 设 $i = \lfloor x \rfloor,\ j = \lfloor y \rfloor$，小数偏移 $u = x - i,\ v = y - j$，取周围 4 个像元双线性加权：<br>$g(x, y) = \frac{\sum_{k=1}^{4} p_k g_k}{\sum_{k=1}^{4} p_k} = (1-u)(1-v)f(i,j) + u(1-v)f(i+1,j) + (1-u)v f(i,j+1) + uv f(i+1,j+1)$ | 消除了锯齿断裂，图像过渡平滑自然，计算量适中 | 具有低通滤波效应，**会改变原始光谱灰度值**并使高频边缘细节轻微模糊 | 常规目视判读底图、DEM 或连续温度场重采样 |
| **三次卷积内插法** | $4 \times 4$ | 取周边 16 个像元，利用分段三次多项式核 $W(d)$（当 $\lvert d \rvert \le 1$ 取 $(a+2)\lvert d \rvert^3 - (a+3)\lvert d \rvert^2 + 1$；当 $1 < \lvert d \rvert < 2$ 取 $a\lvert d \rvert^3 - 5a\lvert d \rvert^2 + 8a\lvert d \rvert - 4a$，常取 $a = -0.5$）在行列双向加权：<br>$g(x, y) = \sum_{m=-1}^{2}\sum_{n=-1}^{2} f(i+m,\ j+n)\, W(m-u)\, W(n-v)$ | **几何定位精度最高、视觉最清晰锐利**，兼顾去锯齿与边缘保持 | **计算量极大（耗时长）**，且轻微改变像元光谱极值并可能产生微弱过冲 | 高精度制图、印刷级数字正射影像图（DOM）生产 |

* **【微型手算考题示例】**：反算得某输出像元在原图坐标为 $(10.4,\ 20.6)$，周围四个整数像元灰度为 $f(10,20)=40$，$f(11,20)=60$，$f(10,21)=80$，$f(11,21)=120$。分别求最邻近法与双线性内插输出值：
  * **最邻近法**：四舍五入得整数坐标 $(10, 21)$，直接取 **$f(10, 21) = 80$**。
  * **双线性内插法**：$u = 0.4,\ v = 0.6$，则 $g = 0.6 \times 0.4 \times 40 + 0.4 \times 0.4 \times 60 + 0.6 \times 0.6 \times 80 + 0.4 \times 0.6 \times 120 = 9.6 + 9.6 + 28.8 + 28.8 = \mathbf{76.8 \approx 77}$。

### 3.3 母题三（10 分）：波谱曲线判读三步法模板与标准假彩色合成解译

#### 1. 10 分波谱曲线判读“黄金三步答题模板”（每步紧扣得分关键词）
* **第一步：看宏观总趋势定大类（3 分）**：比较全波段反射率量级（高/中/低）及在关键区间（可见光 $0.4\sim 0.7\ \mu\text{m}$、近红外 $0.76\sim 1.3\ \mu\text{m}$、短波红外 $1.3\sim 2.5\ \mu\text{m}$）的总体升降走势——**“蓝高红近趋零”定水体，“红低近高陡峭跃升”定植被，“全程平滑缓慢递增”定土壤/岩石，“可见光极高但短波骤降”定新雪/积雪**。
* **第二步：精准定位特征峰谷波长（3 分）**：依次点出横坐标波长处的诊断性极值——如植被 **$0.45\ \mu\text{m}$ 蓝谷、$0.55\ \mu\text{m}$ 绿峰、$0.67\ \mu\text{m}$ 红谷、$0.68\sim 0.75\ \mu\text{m}$ 红边陡坡、$0.8\sim 1.1\ \mu\text{m}$ 近红外高台**以及 **$1.45/1.95\ \mu\text{m}$ 水汽吸收谷**；浑水峰移至 **$0.6\sim 0.7\ \mu\text{m}$**；矿物短波红外 **$2.16\sim 2.40\ \mu\text{m}$** 窄吸收谷。
* **第三步：阐明物理/生化成因与同族状态对比（4 分）**：结合色素（叶绿素光合吸收）、细胞海绵组织（近红外多重散射）、水分吸收（$1.45/1.95\ \mu\text{m}$）、泥沙悬浊散射或分子振动解释波形变化机理，点出曲线偏移方向（如植物胁迫红边蓝移、泥沙升高红移、湿土全波段下移）。

#### 2. 四大细分地物波谱曲线判读速查表（直接对接 10 分作答）

| 地物大类 | 细分类型 | 曲线总体趋势与关键数值特征 | 诊断性峰谷与状态演变规律 | 物理 / 生化核心成因 |
| :--- | :--- | :--- | :--- | :--- |
| **水体** | **清水（深水/清洁）** | 总体反射率极低（$<5\%$），自蓝绿向红与近红外迅速降至 $0$ | 峰在 **$0.4\sim 0.55\ \mu\text{m}$**；**$> 0.76\ \mu\text{m}$ 反射率趋近 $0$** | 水体对红光及近红外辐射强烈吸收，蓝绿光弱反射并可透射浅底质 |
| **水体** | **浑浊含沙水体** | 可见光至近红外反射率显著高于清水（可达 $10\%\sim 25\%$） | 含沙量越高反射率越高，**峰值波段向长波移动（红移至 $0.6\sim 0.75\ \mu\text{m}$）** | 悬浮泥沙颗粒产生强烈体散射与米氏散射，遮蔽水体吸收 |
| **水体** | **富营养化/藻华水体** | 呈现“水体低底 + 植被特征”混合双峰曲线 | **$0.44\sim 0.49\ \mu\text{m}$ 蓝光谷**、**$0.55\sim 0.57\ \mu\text{m}$ 绿峰**、**$0.7\sim 0.8\ \mu\text{m}$ 近红外抬升（显出红边）** | 浮游植物/藻类叶绿素强烈吸收蓝红光，细胞结构在近红外高反射 |
| **植被** | **健康绿色植被** | 可见光低（$<15\%$），红边陡升，近红外达高台（$40\%\sim 60\%$） | **$0.45/0.67\ \mu\text{m}$ 两谷**、**$0.55\ \mu\text{m}$ 一峰**、**$0.68\sim 0.75\ \mu\text{m}$ 红边**、**$1.45/1.95\ \mu\text{m}$ 水谷** | 色素吸收控制可见光，海绵组织多次散射主导近红外，含水量主导短波 |

| **植被** | **衰老/枯黄植被** | 红边陡坡趋于平缓，呈近乎单调上升的类似干土曲线 | **红光吸收谷消失（反射率升高）、近红外反射大幅跌落** | 叶绿素完全降解，类胡萝卜素显色，叶片干枯失水 |

| **岩石** | **典型岩石矿物** | 酸性花岗岩 $>$ 中性安山岩 $>$ 基性玄武岩；整体光滑平缓 | **$0.85\sim 0.9\ \mu\text{m}$（$\text{Fe}^{3+}$）**、**$2.2\ \mu\text{m}$（$\text{Al}-\text{OH}$）**、**$2.3\ \mu\text{m}$（$\text{CO}_3^{2-}/\text{Mg}-\text{OH}$）** 窄谷 | 金属阳离子电子跃迁（VNIR）、羟基/碳酸根振转（SWIR）及 $\text{Si}-\text{O}$ 振动（TIR） |

#### 3. 标准假彩色合成（$\text{NIR} \rightarrow \text{R},\ \text{R} \rightarrow \text{G},\ \text{G} \rightarrow \text{B}$）典型地物颜色速查表

| :--- | :---: | :---: | :---: | :--- | :--- |
| **健康阔叶林 / 旺季农作物** | **极高** | 极低 | 低 | **鲜红色 / 亮红色** | 近红外海绵组织反射极强主导 R 通道，红光叶绿素强吸收压低 G 通道 |
| **针叶林 / 衰败受损植被** | 较高（略低于阔叶） | 较低 | 极低 | **暗红色 / 棕红色** | 针叶空隙阴影多、细胞散射弱于阔叶林，R 通道亮度降为暗红 |
| **城市绿地 / 稀疏草地** | 中偏高 | 低 | 低～中 | **粉红色 / 浅红色** | 植被覆盖度较低、土壤背景抬高红绿光分量，呈现粉红调 |
| **清洁深水体（湖海深潭）** | **极低（趋近 0）** | 极低 | 低 | **黑色 / 极深蓝色** | 几乎全吸收近红外与红光，仅蓝通道保留微弱绿光反射呈深蓝黑 |
| **含沙浑水（浅滩/河口）** | 低～中 | 中 | 中偏高 | **浅蓝色 / 亮青色 / 灰蓝** | 泥沙散射同时抬升绿光（B）与红光（G），形成亮蓝或浅青色 |
| **富营养化水体（藻华/浒苔）** | **高** | 低 | 中 | **水面浮现红色或粉红条带** | 藻类近红外高反射使局部 R 通道突增，在暗蓝水背景中呈鲜红絮带 |
| **城镇建筑 / 水泥沥青道路** | 中 | 中 | 中 | **蓝灰色 / 青灰色** | 人工不透水面可见光与近红外反射相当且绿红光略高，呈冷灰蓝色 |
| **干燥裸土 / 沙漠** | 中偏高 | 中偏高 | 中 | **黄白色 / 浅灰褐 / 亮灰** | 各波段反射率均较高且随波长缓慢递增，红绿蓝混成亮灰或淡黄 |
| **湿地 / 潮湿沼泽** | 低～中（水＋草混合） | 低 | 低 | **暗蓝黑色夹杂暗红斑块** | 积水压低全波段背景呈暗色，挺水植被提供局域暗红响应 |
| **云层与新雪** | **极高** | **极高** | **极高** | **纯白色** | 三通道全部极高反射等量叠加呈纯白（需借 $1.6\ \mu\text{m}$ SWIR 才能区分云与雪） |
</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
</body>
</html>
