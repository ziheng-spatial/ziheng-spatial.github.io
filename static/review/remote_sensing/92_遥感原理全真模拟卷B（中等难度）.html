## 一、名词解释（共 6 小题，每小题 5 分，共 30 分）

### 1. ☆ 归一化植被指数（NDVI）（5 分）

> **【参考答案与分步采分点】**：
> 1. **定义与属类**（1 分）：利用红光波段与近红外波段反射率非线性组合构建的表征绿色植被覆盖度与活力的无量纲光谱指数；
> 2. **公式与物理机理**（2 分）：$\mathrm{NDVI} = \dfrac{\rho_{\mathrm{NIR}} - \rho_{\mathrm{Red}}}{\rho_{\mathrm{NIR}} + \rho_{\mathrm{Red}}}$，基于叶绿素在红光强烈吸收、叶片海绵组织在近红外强烈散射的巨大反差，理论取值 $[-1, 1]$（健康植被 $0.2\sim 0.8$，裸土近 $0$，水体为负）；
> 3. **应用与局限**（2 分）：归一化削弱了太阳高度角与地形阴影干扰，广泛用于植被物候、长势与旱情监测，但在高覆盖度森林区易饱和。

### 2. 标准假彩色合成（5 分）

> **【参考答案与分步采分点】**：
> 1. **定义**（1 分）：将多光谱图像中三个特定波段按色光加色法人为赋予红绿蓝显示通道，以强化植被与水体反差的经典彩色合成方式；
> 2. **波段映射配置**（2 分）：固定采用**近红外（NIR）$\to$ R、红光（Red）$\to$ G、绿光（Green）$\to$ B**（对应 TM/ETM+ 4-3-2、Landsat-8/9 OLI 5-4-3、Sentinel-2 8-4-3）；
> 3. **典型地物呈色**（2 分）：健康植被呈鲜红色（针叶林呈暗红），清洁水体呈深蓝或黑色，浑浊水呈浅青色，城镇呈蓝灰色，极利于植被调查与水陆界线判读。

### 3. 数字高程模型（DEM）与数字表面模型（DSM）（5 分）

> **【参考答案与分步采分点】**：
> 1. **基本定位**（1 分）：均是描述地球表面三维高程空间分布的数字栅格或矢量地面模型；
> 2. **核心本质差异**（2 分）：**DEM** 仅表达剔除了地表一切附着物后的纯粹自然**裸地地形高程**；**DSM** 则同时包含裸地地面以及建筑物屋顶、森林冠层顶部、桥梁等一切地表物体顶面的绝对高程；
> 3. **LiDAR 提取与派生应用**（2 分）：LiDAR 首次回波构建 DSM、穿透冠层的末次回波经滤波生成 DEM，二者作差得归一化数字表面模型 $\mathrm{nDSM}=\mathrm{DSM}-\mathrm{DEM}$，可直接反演树高与楼高。

### 4. 干涉合成孔径雷达（In-SAR）（5 分）

> **【参考答案与分步采分点】**：
> 1. **定义**（1 分）：利用合成孔径雷达对同一地区获取两幅及以上高度相干影像来重建地表三维地形或监测微小形变的主动微波测量技术；
> 2. **物理成像机理**（2 分）：采用单轨双天线或双轨重复平行观测获取两幅单视复数（SLC）影像做复共轭干涉，将斜距差 $\Delta R$ 转化为干涉相位差 $\Delta\varphi = \frac{4\pi}{\lambda}\Delta R$（形成干涉条纹），结合基线几何反演高程；
> 3. **工程应用**（2 分）：可全天候大范围生产高精度 DEM；利用形变前后两幅干涉图做差分（**D-InSAR**），可监测毫米～厘米级地震同震形变、地面沉降与滑坡。

### 5. 监督分类与非监督分类（5 分）

> **【参考答案与分步采分点】**：
> 1. **共同本质**（1 分）：依据遥感像元多维光谱特征向量自动划分专题地物类别的两大计算机模式识别体制；
> 2. **核心体制差异**（2 分）：**监督分类**遵循“先训练后判别”，需选取代表性训练样区（ROI）建立判别函数（如最大似然法 MLC、最小距离法）再逐像元判别；**非监督分类**遵循“先聚类后定名”，无需先验样本直接自动聚类（如 K-Means、ISODATA）再赋地学属性；
> 3. **优缺点对比**（2 分）：前者类别可控但耗时耗样且无法识别未定义类；后者客观省力能发现未知小类，但光谱类与信息类未必一一对应。

### 6. 混淆矩阵与 Kappa 系数（5 分）

> **【参考答案与分步采分点】**：
> 1. **属类定位**（1 分）：定量检验遥感图像分类精度的标准统计工具与综合一致性评定指标；
> 2. **结构与数学公式**（2 分）：混淆矩阵以 $r\times r$ 表交叉统计分类结果与地面参考真值样点数（主对角线 $x_{ii}$ 为正确像元，非对角线揭示错分与漏分误差）；总体 Kappa 系数公式为 $K = \dfrac{N\sum x_{ii} - \sum(x_{i+}x_{+i})}{N^2 - \sum(x_{i+}x_{+i})}$；
> 3. **评价意义与等级**（2 分）：在总体精度基础上剔除了随机一致性的偶然影响；通常 $K\in[0.60, 0.80]$ 评价为“很好”，$K > 0.80$ 为“极好一致”。

## 二、问答题（共 8 小题，每小题 5 分，共 40 分）

### 7. ☆ 写出多项式几何精校正的最少 GCP 数量公式，说明间接法相对直接法的优势，并对比三种灰度重采样算法的原理与适用场景。（5 分）

> **【参考答案与分步采分点】**：
> 1. **最少 GCP 公式与各阶点数**（1 分）：$n$ 次二维多项式至少需要 $N_{\min} = \dfrac{(n+1)(n+2)}{2}$ 对 GCP——一次多项式至少 **3 对**，二次多项式至少 **6 对**，三次多项式至少 **10 对**（工程常留冗余）。
> 2. **间接法相对直接法的优势**（1 分）：直接法从原片正算易产生输出像素重叠或空白漏洞；**间接法**从空白输出格网反算原片浮点坐标并重采样，**每个输出格网必定有唯一灰度值，彻底杜绝空洞与重叠**。
> 3. **最邻近内插法**（1 分）：取几何距离最近的 1 个像元灰度（四舍五入）；计算最快且**100% 保留原始光谱 DN 值不失真**，但误差可达 $\pm 0.5\ \mathrm{px}$ 且边缘呈锯齿，**专用于计算机分类前预处理与专题图配准**。
> 4. **双线性内插法**（1 分）：取周围 $2\times 2 = 4$ 个像元按距离双向加权；消除锯齿、视觉平滑且运算量适中，但有低通平滑效应改变原值，**适于常规目视底图与连续场（DEM/温度）重采样**。
> 5. **三次卷积内插法**（1 分）：取周围 $4\times 4 = 16$ 个像元按三次样条核加权；**几何定位精度与边缘锐度最高**，但计算耗时最大，**适于高精度制图与印刷级正射影像生产**。

### 8. ☆ 对比比值变换（含 NDVI）、K-L 变换（主成分分析 PCA）与 K-T 变换（缨帽变换）的数学机理、物理意义及工程选用原则。（5 分）

> **【参考答案与分步采分点】**：
> 1. **波段比值变换与 RVI**（1 分）：两波段像元相除，利用相同地形起伏坡度引起的入射角余弦 $\cos\theta_s$ 在分子分母成比例约去，**有效消除地形阴影与光照差异**，突出植被（$\mathrm{RVI}=\rho_{\mathrm{NIR}}/\rho_{\mathrm{Red}}$）或铁染蚀变差异。
> 2. **NDVI 机理与特性**（1 分）：$\mathrm{NDVI} = (\rho_{\mathrm{NIR}}-\rho_{\mathrm{Red}})/(\rho_{\mathrm{NIR}}+\rho_{\mathrm{Red}}) \in [-1, 1]$，结合红光叶绿素吸收与近红外海绵组织强反射，抗阴影与大气噪声能力强，是植被覆盖度（FVC）与旱情监测第一指标（高盖度易饱和）。
> 3. **K-L 变换（PCA）机理与物理意义**（1 分）：**数据驱动**正交变换，求解图像协方差矩阵 $\Sigma$ 特征向量投影 $Y = A^{\mathrm{T}}X$；去波段相关性，将 $70\%\sim 90\%$ 以上共有反照率与地形方差集中至 $PC_1$，高阶分量主要为随机噪声（变换矩阵随景而变，无固定地学含义）。
> 4. **K-T 变换（缨帽变换）机理与物理意义**（1 分）：按特定传感器预先标定**固定经验正交系数矩阵**，各分量具有**恒定明确的地学物理意义**——第一维**亮度**（土壤反照率）、第二维**绿度**（植被生物量）、第三维**湿度/黄度**（土壤与冠层水分）。
> 5. **工程选用原则**（1 分）：需**降维压缩、舍噪去相关或 PCA 图像融合**时选用 K-L 变换；需开展**跨时相、跨区域农情长势与旱情定量对比**时选用 K-T 变换与 NDVI。

### 9. 阐述斯忒藩-玻尔兹曼定律、维恩位移定律与基尔霍夫定律的核心内涵，并对比太阳辐射与地球自身辐射在遥感探测波段上的分工。（5 分）

> **【参考答案与分步采分点】**：
> 1. **斯忒藩-玻尔兹曼定律**（1 分）：黑体总辐射出射度与绝对温度四次方成正比 $M_0 = \sigma T^4$（灰体 $M = \varepsilon\sigma T^4$），微温变化引发总能量剧变，构成热红外测温基础。
> 2. **维恩位移定律**（1 分）：辐射峰值波长与绝对温度成反比 $\lambda_{\max}\cdot T = 2897.8\ \mu\mathrm{m}\cdot\text{K}$——温度越高峰值向短波移动，据此锁定常温地表（$300\ \mathrm{K} \to 9.66\ \mu\mathrm{m}$）用 $8\sim 14\ \mu\mathrm{m}$ 窗口、林火（$600\sim 1000\ \mathrm{K}$）用 $3\sim 5\ \mu\mathrm{m}$ 窗口。
> 3. **基尔霍夫定律**（1 分）：同温同波长下实际物体比辐射率等于其吸收率 $\varepsilon(\lambda) = \alpha(\lambda)$，不透明物体满足 $\varepsilon(\lambda) = 1 - \rho(\lambda)$，可用于由亮温反演真温及波谱推算发射率。
> 4. **太阳辐射与地球辐射差异**（1 分）：太阳等效 $6000\ \mathrm{K}$ 高温辐射（峰值 $0.47\sim 0.48\ \mu\mathrm{m}$，能量集中在 $0.3\sim 2.5\ \mu\mathrm{m}$ 占 $85\%$）；地球等效 $300\ \mathrm{K}$ 低温长波辐射（峰值 $9.66\ \mu\mathrm{m}$，主要集中在 $>6\ \mu\mathrm{m}$）。
> 5. **遥感三波段探测分工**（1 分）：$0.3\sim 2.5\ \mu\mathrm{m}$ 以**地表反射太阳辐射**为主；$> 6\ \mu\mathrm{m}$ 以**地球自身热辐射**为主；$2.5\sim 6\ \mu\mathrm{m}$ 中红外波段两者能量相当、均不可忽略。

### 10. 阐述颜色三要素及加色法（RGB）、减色法（CMY）的混合与互补规律，并说明标准假彩色合成中健康植被、清水、浑水与城镇的呈色物理机理。（5 分）

> **【参考答案与分步采分点】**：
> 1. **颜色三要素**（1 分）：人眼彩色感知由**明度**（明亮程度，黑白图像仅有明度）、**色调**（主波长决定的颜色类别）与**饱和度**（单色纯洁程度）构成 IHS 立体。
> 2. **加色法（RGB）规律**（1 分）：面向发光体与屏幕显示，以红 R、绿 G、蓝 B 为三原色光能量叠加（$\mathrm{R+G=Y},\ \mathrm{G+B=C},\ \mathrm{R+B=M},\ \mathrm{R+G+B=白}$）。
> 3. **减色法（CMY）与互补规律**（1 分）：面向颜料油墨与胶片，以青 C、品红 M、黄 Y（互为 RGB 补色）选择性吸收补色光反射余光（C 吸红、M 吸绿、Y 吸蓝，三色等量叠合呈黑）。
> 4. **标准假彩色通道配置与植被/水体机理**（1 分）：以 NIR $\to$ R、Red $\to$ G、Green $\to$ B（如 OLI 5-4-3）。**健康植被**因叶绿素吸红光（G 低）而海绵组织强反射近红外（R 极高）呈**鲜红色**；**清洁水体**近红外与红光几乎全吸收呈**深蓝/纯黑色**。
> 5. **浑水与城镇呈色机理**（1 分）：**浑浊含沙水体**因泥沙散射抬升绿光（B）与红光（G）呈**浅青蓝色**；**城镇水泥建筑**各波段反射相当且可见光略高呈**蓝灰色**。

### 11. 简述我国高分专项系列卫星（GF-1、GF-2、GF-3、GF-4、GF-5、GF-6）各自的轨道或载荷核心特色及典型应用。（5 分）

> **【参考答案与分步采分点】**：
> 1. **GF-1 与 GF-6（高分宽幅与精准农业协同，1.5 分）**：**GF-1** 为首发星，搭载 $2\ \mathrm{m}/8\ \mathrm{m}$ 相机及 $800\ \mathrm{km}$ 超宽幅 $16\ \mathrm{m}$ 相机（侧摆 4 天重访）；**GF-6** 载荷与 GF-1 组网（重访缩至 2 天），**新增紫光、黄光及两个红边波段**专攻精准农业与林业监测。
> 2. **GF-2（民用亚米级精细光学，1 分）**：太阳同步轨道，空间分辨率达 **$0.8\ \mathrm{m}$ 全色 / $3.2\ \mathrm{m}$ 多光谱**（幅宽 $45\ \mathrm{km}$），是我国首颗亚米级民用光学星，用于城市地籍与大比例尺制图。
> 3. **GF-3（全天候全极化 SAR，1 分）**：我国首颗 **$1\ \mathrm{m}$ 分辨率 C 频段多极化合成孔径雷达卫星**（12 种模式），穿云透雾专用于海洋监测与洪涝灾害应急。
> 4. **GF-4（地球静止轨道实时凝视，0.75 分）**：居 $36000\ \mathrm{km}$ 地球静止轨道，具备 $50\ \mathrm{m}$ 可见光与 $400\ \mathrm{m}$ 中波红外 **$5\sim 20\ \mathrm{s}$ 凝视盯防**能力，专攻台风、林火与洪涝实时监测。
> 5. **GF-5（全谱段高光谱与大气环境，0.75 分）**：搭载 330 波段高光谱相机（AHSI，$5\sim 10\ \mathrm{nm}$）及大气痕量气体/$\text{PM}_{2.5}$ 载荷，兼顾高光谱找矿与大气污染监测。

### 12. 阐明合成孔径雷达（SAR）突破真实孔径雷达（RAR）方位分辨率瓶颈的物理机理（写出两者方位分辨率公式），并分析侧视雷达四大几何畸变的产生条件与影像表现。（5 分）

> **【参考答案与分步采分点】**：
> 1. **RAR 瓶颈与 SAR 突破机理**（1.5 分）：RAR 方位分辨率 $R_\beta = \dfrac{\lambda R}{D}$，星载百公里斜距下要达米级需十余公里天线，物理不可行；**SAR** 利用长度 $D$ 的小天线飞行一段轨迹 $L_s = \dfrac{\lambda R}{D}$ 连续相干记录回波振幅与多普勒相位并合成为虚拟长天线，方位分辨率为 **$\rho_a = \dfrac{D}{2}$**，**与波长 $\lambda$ 和斜距 $R$ 无关**。
> 2. **斜距比例尺失真**（0.75 分）：雷达按等斜距 $\Delta R = \Delta X_g\sin\theta$ 采样，平坦地面**近程（入射角 $\theta$ 小）横向严重压缩**，可用斜地变换纠正。
> 3. **透视收缩**（1 分）：迎向雷达的山坡坡度 $0 < \alpha < \theta$（小于波束俯角 $\Phi$ 或入射角条件）时，坡顶坡底斜距差缩小，表现为**迎坡长度大幅缩短且回波集中呈极亮窄带**。
> 4. **叠掩现象**（1 分）：迎坡极陡（$\alpha > \theta$）使波束先于坡底到达坡顶（$R_{\text{顶}} < R_{\text{底}}$），造成**顶底空间位置倒置且回波不可逆混叠**为亮白斑。
> 5. **雷达阴影**（0.75 分）：背向雷达的山坡坡度陡于俯角（$\beta > \Phi$）时脉冲波束被完全遮挡，背坡无任何回波信号而呈边界锐利的**纯黑暗区**（远程阴影更长）。

### 13. 简述激光雷达（LiDAR）的系统组成与工作机理，说明其如何通过多回波分别生成 DSM 与 DEM，并列举微波传感器的五大系统分类。（5 分）

> **【参考答案与分步采分点】**：
> 1. **LiDAR 系统三大集成组成**（1 分）：由**激光扫描测距仪**（主动发射脉冲测距 $R = c\Delta t / 2$）+ **差分 GNSS**（实时定轨定位）+ **惯性测量单元 INS/IMU**（实时定姿）组成。
> 2. **主动三维采样工作机理**（1 分）：融合测距值、安装角、瞬时平台位置与姿态，直接高频率解算激光脚点高精度三维坐标 $(X, Y, Z)$，生成高密度三维点云。
> 3. **多回波分别生成 DSM 与 DEM 及 $\mathrm{nDSM}$**（2 分）：激光束具备穿透植被林冠间隙的能力——率先接触屋顶与树冠顶部返回的**首次回波**点云直接构建包含地上附着物的 **DSM**；穿透林冠到达真实地面的**末次回波**经地面点滤波去噪后内插生成裸露地表 **DEM**；二者作差 $\mathrm{nDSM} = \mathrm{DSM} - \mathrm{DEM}$ 可直接反演树高与建筑物高度。
> 4. **微波传感器五大系统分类**（1 分）：非成像主动雷达有**微波散射计**和**雷达高度计**；被动传感器为**微波辐射计**；主动侧视成像雷达为**真实孔径侧视雷达（RAR）** 和**合成孔径雷达（SAR / In-SAR）**。

### 14. 阐述遥感图像计算机分类的统计原理与一般作业五步骤，并对比监督分类（最小距离法 vs 最大似然法）与非监督分类（K-Means vs ISODATA）及多数平滑滤波。（5 分）

> **【参考答案与分步采分点】**：
> 1. **统计原理与作业五步骤**（1.5 分）：同类地物在 $n$ 维光谱特征空间聚为独立点群，分类器据此划定决策边界；作业五步为**① 分类预处理 $\to$ ② 特征选择变换 $\to$ ③ 执行分类 $\to$ ④ 分类后处理 $\to$ ⑤ 精度评定与制图**。
> 2. **监督分类：最小距离法 vs 最大似然法（MLC）**（1.5 分）：**最小距离法**仅算像元到均值中心距离，计算极快但忽略方差形状与先验概率；**最大似然法（MLC）** 基于贝叶斯准则综合均值、协方差阵与先验概率，总错分率理论最小，但要求样本足量且服从多元正态分布。
> 3. **非监督分类：K-Means vs ISODATA**（1 分）：**K-Means** 类别数固定且受初始中心影响大；**ISODATA** 在全样本重算后增加**动态合并与分裂**机制自动优化类别数，是软件主流算法。
> 4. **分类后处理——多数平滑滤波**（1 分）：采用 $3\times 3$ 或 $5\times 5$ 窗口统计众数类别替换中心像元以消除“椒盐”碎斑，属于**逻辑统计众数替换运算，严禁对类别编码做算术平均**。

### 15. 【辐射定律热红外反演与侧视雷达分辨率综合计算】（10 分）

（1）（6 分）某城市水泥路面真实地表温度为 $t_1 = 27^\circ\mathrm{C}$（按 $T = t + 273\ \mathrm{K}$ 换算），其热红外比辐射率 $\varepsilon_1 = 0.90$（已知 $0.90^{0.25} \approx 0.9740$）；同期一处林火高温点近似看作绝对黑体（$\varepsilon_2 = 1.0$），绝对温度 $T_2 = 900\ \mathrm{K}$。取 $\sigma = 5.67\times 10^{-8}\ \mathrm{W\cdot m^{-2}\cdot K^{-4}}$、维恩常数 $b = 2897.8\ \mu\mathrm{m\cdot K}$。试计算：① 水泥路面的实际总辐射出射度 $M_1$ 及传感器测得的亮度温度 $T_{B1}$；② 高温点与水泥路面的总辐射能量之比 $M_2 / M_1$；③ 两者的辐射峰值波长 $\lambda_{\max}$ 并指出各自最佳探测大气窗口。<br>
（2）（4 分）某星载 C 波段侧视雷达发射脉冲宽度 $\tau = 0.1\ \mu\mathrm{s}$，地面目标处波束俯角 $\Phi = 60^\circ$（$\cos 60^\circ = 0.5$），斜距 $R = 500\ \mathrm{km}$，雷达工作波长 $\lambda = 5\ \mathrm{cm}$，真实天线孔径 $D = 5\ \mathrm{m}$，光速 $c = 3\times 10^8\ \mathrm{m/s}$。计算斜距分辨率 $\Delta R_s$、地距分辨率 $\Delta R_g$，以及真实孔径（RAR）与合成孔径（SAR）模式下的方位分辨率和分辨率提升倍数。

> **【参考答案与分步采分点】**：
>
> **（1）热红外辐射定律计算（6 分）**：
> - 温度换算：$T_1 = 27 + 273 = 300\ \mathrm{K}$；同温黑体出射度 $M_0(300) = 5.67\times 10^{-8}\times 300^4 = 459.27\ \mathrm{W/m}^2$。
> - 水泥路面实际出射度与亮温（2.5 分）：
>
> $$M_1 = \varepsilon_1 \sigma T_1^4 = 0.90 \times 459.27 = \mathbf{413.343\ \mathrm{W/m}^2}, \qquad T_{B1} = \varepsilon_1^{0.25} T_1 = 0.9740 \times 300 = \mathbf{292.20\ \mathrm{K}\ (19.20^\circ\mathrm{C})}$$
>
>   （可见自然灰体亮温低于真实物理温度 $7.80\ \mathrm{K}$，反演真温必除以 $\varepsilon_1^{0.25}$。）
> - 总辐射能量之比（1.5 分）：
>
> $$\frac{M_2}{M_1} = \frac{\varepsilon_2 \sigma T_2^4}{\varepsilon_1 \sigma T_1^4} = \frac{1.0}{0.90}\times \left(\frac{900}{300}\right)^4 = \frac{81}{0.90} = \mathbf{90.00\text{ 倍}}$$
>
> - 峰值波长与最佳大气窗口（2 分）：
>   - 水泥路面：$\lambda_{\max 1} = \dfrac{2897.8}{300} \approx \mathbf{9.66\ \mu\mathrm{m}}$，落入 **$8\sim 14\ \mu\mathrm{m}$ 远红外（热红外）大气窗口**；
>   - 林火高温点：$\lambda_{\max 2} = \dfrac{2897.8}{900} \approx \mathbf{3.22\ \mu\mathrm{m}}$，温度升高峰值向短波移动，对应 **$3.5\sim 5.0\ \mu\mathrm{m}$（$3\sim 5\ \mu\mathrm{m}$）中红外大气窗口**。
>
> **（2）侧视雷达空间分辨率计算（4 分）**：
> - 距离向分辨率（1.5 分）：
>
> $$\Delta R_s = \frac{c\tau}{2} = \frac{3\times 10^8\times 0.1\times 10^{-6}}{2} = \mathbf{15.0\ \mathrm{m}}, \qquad \Delta R_g = \frac{\Delta R_s}{\cos\Phi} = \frac{15.0}{\cos 60^\circ} = \frac{15.0}{0.5} = \mathbf{30.0\ \mathrm{m}}$$
>
> - RAR vs SAR 方位分辨率与提升倍数（2.5 分，$\lambda = 0.05\ \mathrm{m},\ R = 5\times 10^5\ \mathrm{m}$）：
>
> $$R_\beta(\mathrm{RAR}) = \frac{\lambda R}{D} = \frac{0.05\times 5\times 10^5}{5} = \mathbf{5000\ \mathrm{m}}, \qquad \rho_a(\mathrm{SAR}) = \frac{D}{2} = \frac{5}{2} = \mathbf{2.5\ \mathrm{m}}$$
>
>   分辨率提升倍数为 $\dfrac{5000}{2.5} = \mathbf{2000\text{ 倍}}$。

### 17. 【第 9 章遥感技术应用工程综合设计 · 城市热岛效应定量反演与评估方案】（10 分）

某大城市夏季高温热浪频发、城市热岛效应显著。试结合课程热红外物理原理与多源遥感技术，设计一套开展**城市地表温度（LST）定量反演、热岛强度空间分级及绿地/水体降温效应评估**的完整工程技术方案。

> **【参考答案与分步采分点（六步满分工程框架）】**：
> 1. **明确应用目标与定量指标**（1.5 分）：围绕“城市地表温度（LST）反演与热岛空间格局成因评估”目标，锁定**热红外亮度温度 $T_B$、地表比辐射率 $\varepsilon$、真实地表温度（LST）、NDVI、水体指数 MNDWI 及不透水面比例（ISA）** 作为核心监测指标。
> 2. **多源传感器协同选型**（2 分）：选用兼具可见光/近红外多光谱（$30\ \mathrm{m}$）与 **$8\sim 14\ \mu\mathrm{m}$ 热红外通道（$100\ \mathrm{m}$）的 Landsat-8/9 OLI+TIRS（Band 10/11）** 作为 LST 反演主数据源；协同 **GF-2（$0.8\ \mathrm{m}/3.2\ \mathrm{m}$）** 亚米级影像精细提取城市不透水面、公园绿地与内陆水体边界，辅以同期气象站气温资料。
> 3. **多源数据系统预处理**（2 分）：对 OLI 多光谱波段执行辐射定标与 6S/FLAASH 大气校正得真实地表反射率；对 TIRS 热红外波段执行辐射定标将 DN 值转为入瞳热辐射亮度 $L_\lambda = M_L\cdot DN + A_L$；利用均匀 **GCP** 与二次多项式间接法完成 OLI/TIRS 与 GF-2 的亚像元地理配准（RMSE $< 0.5$ 像元），并对 GF-2 做 **Gram-Schmidt（GS）或 PCA 融合**提升城建区边界清晰度。
> 4. **地表温度（LST）反演与热岛分级**（2 分）：由 OLI 计算 NDVI 与植被覆盖度（FVC），采用混合像元法估算全区**地表比辐射率 $\varepsilon$**；结合大气上下行辐射与透过率（或利用 TIRS 10/11 两通道**劈窗算法**）扣除大气效应反解黑体辐射亮度 $B(T_s)$，再代入**普朗克逆公式** $T_s = K_2 / \ln(K_1/B(T_s)+1)$ 求解真实地表温度 LST；最后用**均值-标准差法**将城市温度场划分为低温、次低温、中温、次高温与高温热岛核心区 5 个等级。
> 5. **后处理与定量精度检验**（1.5 分）：对 GF-2 土地覆被监督分类结果施以 $3\times 3$ **多数平滑滤波**去除碎斑，并抽样建**混淆矩阵**验证 OA 与 Kappa 系数（$K > 0.80$）；将反演 LST 与地面同步实测地表温或 MODIS LST 产品交叉比对计算决定系数 $R^2$ 与 RMSE，确保热场定量精度可靠。
> 6. **GIS 空间叠加分析与规划决策输出**（1 分）：在 **GIS** 中将热岛分级图与土地利用、不透水面比例（ISA）、绿地及水体分布叠加做空间相关性与缓冲区分析，定量揭示工业区/密集建筑呈强热岛、大型公园绿地与河湖呈冷岛的规律，输出城市热岛专题图及**增绿补水、打通夏季主导风向通风廊道**的决策建议报告。</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
