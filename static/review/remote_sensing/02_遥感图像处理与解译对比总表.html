<script type="text/plain" id="md-raw"># 02 遥感图像处理与解译对比总表（SDUT《遥感原理与应用》宽表横向对比）

> **复习说明**：本文档针对山东理工大学《遥感原理与应用》第6章至第8章（遥感数字图像存储、辐射与几何校正、图像增强与变换、图像融合、目视解译与计算机分类及精度评定）构建了全方位 Markdown 宽表横向对比体系，便于应对比较题、简答题、选择题及算法辨析题。

---

## 一、 遥感数据存储格式、产品分级与彩色合成对比

### 1. LTWG 标准存储格式（BSQ / BIL / BIP）与主流文件格式对比
| 格式名称 | 英文全称 | 数据排列组织方式 | 核心优势 | 局限性 | 典型适用场景 |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **BSQ** | Band Sequential（波段顺序格式） | 按波段顺序完整存储：先存完第 $1$ 波段全部 $m \times n$ 个像素（第 $1$ 至第 $m$ 行），再依次存第 $2$ 波段至第 $p$ 波段。 | 单波段空间连续性极佳，存取和显示单波段图像速度最快，结构最简单直观。 | 提取同一像素的多波段光谱向量时需跨大块数据寻址，多波段光谱联合处理效率低。 | 单波段空间滤波、单波段空间裁剪、单通道图像浏览与空间特征分析。 |
| **BIP** | Band Interleaved by Pixel（波段按像元交叉格式） | 以单个像元为单位按波段交叉排列：先存 $(1,1)$ 像元的全部 $p$ 个波段值 $B_1(1,1)\dots B_p(1,1)$，再存 $(1,2)$ 像元的全部波段值。 | 同一像元的所有波段集中连续存储，**光谱维访问速度最快**。 | 彻底打断了同一波段像素在空间上的连续性，单波段显示或空间邻域处理慢。 | 逐像元多光谱/高光谱分类（如最大似然、光谱角匹配）、波谱曲线提取与光谱运算。 |
| **BIL** | Band Interleaved by Line（波段按行交叉格式） | 以行为单位按波段交叉排列：先存第 $1$ 行的第 $1$ 波段至第 $p$ 波段，再存第 $2$ 行的第 $1$ 波段至第 $p$ 波段。 | 折中了 BSQ 与 BIP 的优点，兼顾同一行内的空间连续性与多波段同步读取。 | 空间全局访问略逊于 BSQ，单像元光谱访问略逊于 BIP，灵活性居中。 | 推扫式/摆扫式传感器逐行实时记录、兼顾空间与光谱的常规遥感图像处理。 |
| **GeoTIFF** | Geographic Tag Image File Format | 在标准 TIFF（标签图像文件格式）基础上嵌入 **6 个标准地理标签（GeoTag）**：变换矩阵（34264）、控制点（33922）、像元比例（33550）、双精度参数（34736）、ASCII参数（34737）、地理键目录（34735）。 | 独立于操作系统、支持多色彩与多波段、直接内嵌投影/坐标系/椭球体/仿射变换等地理编码信息。 | 单文件难以高效组织异构的多维科学数据集与说明文档。 | GIS 与遥感软件（ENVI、ArcGIS、QGIS）最通用的正射影像与栅格成果交换标准。 |
| **HDF / HDF5** | Hierarchical Data Format（层次数据格式） | 采用类似树状文件系统的**容器（Container）**结构，包含根组（Root Group）、组（Group）、数据集（Dataset = 元数据 Metadata + 数据数组 Data Array + 数据空间 Dataspace）与属性（Attribute）。 | 可同时容纳多分辨率遥感图像、定标参数表、经纬度查找表、文本说明等异构科学数据，支持分块（Chunked）与压缩。 | 结构较复杂，需专用解析库或遥感软件读取子数据集。 | MODIS、风云卫星（FY-3/4）、高光谱与气象海洋科学标准数据产品分发。 |

### 2. 光学遥感影像与 SAR 雷达影像产品分级对比
| 产品级别 | 光学遥感影像产品定义与处理内容 | SAR（合成孔径雷达）影像产品定义与处理内容 |
| :--- | :--- | :--- |
| **Level 0** | **原始数据产品**：卫星下行原始数据流经解同步、解扰和数据分离后的原始图像数据，未经任何辐射与几何校正。 | **原始信号数据产品**：下行数据经解同步、解扰和分离后**未经合成孔径成像处理**的原始回波信号数据，以复数形式存储。 |
| **Level 1A** | **辐射校正产品**：经过系统辐射校正（消除传感器自身响应畸变），但**未经过几何校正**，扫描行按标称位置排列。 | **单视复型影像产品（SLC）**：经天线方向图与增益校正、距离向压缩和方位向压缩成像后的**斜距向单视复数产品**，完整保留幅度与相位信息（用于 InSAR 干涉测量）。 |
| **Level 1B** | **系统几何校正产品**：在 Level 1A 基础上经过**系统几何校正（粗校正）**，并映射到指定地图投影坐标系下的产品。 | **多视复型/强度影像产品**：在 Level 1A 基础上进行多视平均处理以抑制相干斑噪声的斜距向产品，保留平均幅度与相位信息。 |
| **Level 2** | **几何精校正产品**：在 Level 1B 基础上引入**地面控制点（GCP）**进行几何精校正，具有高精度的平面地理坐标。 | **系统几何校正产品**：对 Level 1 级图像进行**斜距—地距变换（斜地变换）**、系统辐射校正和系统几何校正后的地距产品。 |
| **Level 3** | **高程校正（正射）产品**：在 Level 2 基础上引入**数字高程模型（DEM）**纠正地形起伏引起的像点视差位移，按地理编码标准生成的正射投影产品（DOM）。 | **几何精校正产品**：利用地面控制点（GCP）对 Level 2 级 SAR 产品进行几何精校正后的产品。 |
| **Level 4** | —（光学产品通常至 Level 3 即为正射产品） | **高程校正（地理编码正射）产品**：利用 DEM 数据对 Level 3 级 SAR 产品纠正地形起伏导致的透视收缩/叠掩畸变，生成正射投影雷达影像。 |

### 3. 多波段彩色合成方案对比（以 Landsat TM/ETM+ 与 Landsat-8/9 OLI 为例）
| 合成类型 | RGB 通道波段赋予原则 | Landsat 5/7 (TM/ETM+) 波段组合 | Landsat 8/9 (OLI) 波段组合 | Sentinel-2 (MSI) 波段组合 | 典型地物色彩表现与核心用途 |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **真彩色合成** | R $\leftarrow$ 红光波段<br>G $\leftarrow$ 绿光波段<br>B $\leftarrow$ 蓝光波段 | R: Band 3<br>G: Band 2<br>B: Band 1 | R: Band 4<br>G: Band 3<br>B: Band 2 | R: Band 4<br>G: Band 3<br>B: Band 2 | 色彩与人眼观察的自然景物一致（植被呈绿色、水体呈蓝黑色）；但受短波蓝光瑞利散射影响，图像反差较小、色调偏灰暗。 |
| **标准假彩色合成** | R $\leftarrow$ **近红外（NIR）**<br>G $\leftarrow$ **红光波段（R）**<br>B $\leftarrow$ **绿光波段（G）** | R: Band 4<br>G: Band 3<br>B: Band 2 | R: Band 5<br>G: Band 4<br>B: Band 3 | R: Band 8<br>G: Band 4<br>B: Band 3 | **遥感最经典组合**：健康植被在 NIR 反射极强而呈**鲜红色/品红色**，水体呈深蓝或黑色，城镇与裸地呈灰蓝色/青灰色。广泛用于植被分类、长势分析与水体识别。 |
| **非标准假彩色（陆水/海岸带）** | R $\leftarrow$ 近红外（NIR）<br>G $\leftarrow$ 短波红外1（SWIR1）<br>B $\leftarrow$ 红光波段（R） | R: Band 4<br>G: Band 5<br>B: Band 3 | R: Band 5<br>G: Band 6<br>B: Band 4 | R: Band 8<br>G: Band 11<br>B: Band 4 | 水体对近红外和短波红外均强烈吸收，呈极深暗色，**水陆边界极其清晰**，利于海岸线提取、湿地与内陆水体精细识别。 |
| **非标准假彩色（农业/植被类型）** | R $\leftarrow$ 短波红外1（SWIR1）<br>G $\leftarrow$ 近红外（NIR）<br>B $\leftarrow$ 蓝光波段（B） | R: Band 5<br>G: Band 4<br>B: Band 1 | R: Band 6<br>G: Band 5<br>B: Band 2 | R: Band 11<br>G: Band 8<br>B: Band 2 | 融合了细胞结构（NIR）、叶片水分（SWIR1）与叶绿素（Blue）信息，健康的阔叶林、针叶林、农作物呈现层次丰富的亮绿色调，便于精细植被分类。 |
| **短波红外大气穿透合成** | R $\leftarrow$ 短波红外2（SWIR2）<br>G $\leftarrow$ 短波红外1（SWIR1）<br>B $\leftarrow$ 近红外（NIR） | R: Band 7<br>G: Band 5<br>B: Band 4 | R: Band 7<br>G: Band 6<br>B: Band 5 | R: Band 12<br>G: Band 11<br>B: Band 8A | 全采用红外长波段，**对薄云、雾霾、烟尘穿透能力极强**，常用于消除薄云干扰、观察森林火烧迹地与高温火点（火点在 SWIR 呈亮红色）。 |

## 二、 辐射校正（辐射定标与大气校正）与几何校正及重采样横向对比

### 1. 遥感图像辐射处理四阶段与大气校正方法全对比
**辐射处理总体链路**：传感器原始记录值 $DN \xrightarrow{\text{辐射定标}} \text{传感器入瞳处辐射亮度 } L_\lambda \xrightarrow{\text{大气上界转换}} \text{表观反射率 } \rho_{\text{TOA}} \xrightarrow{\text{大气校正}} \text{地表真实反射率 } \rho_{\text{surface}}$。

| 处理阶段 / 方法 | 校正对象（误差来源） | 数学模型与核心原理 | 所需输入参数 | 优缺点与适用场景 |
| :--- | :--- | :--- | :--- | :--- |
| **系统辐射定标（Radiometric Calibration）** | 传感器自身光学系统（镜头边缘暗角）、光电转换系统非线性、多探测元响应不一致（条带）及量化无量纲化。 | 利用元数据定标增益 $Gain$ 与偏置 $Bias$ 将无量纲灰度值 $DN$ 转化为入瞳绝对辐射亮度：<br>$L_\lambda = Gain \cdot DN + Bias$ | 影像头文件（MTL/XML）中的辐射定标系数（$L_{\max}, L_{\min}$ 或 $Gain, Bias$）。 | 计算简单、物理量纲明确（$\text{W}\cdot\text{m}^{-2}\cdot\text{sr}^{-1}\cdot\mu\text{m}^{-1}$），是所有定量遥感反演的第一步。 |
| **太阳位置（表观反射率 TOA）校正** | 不同成像季节、不同纬度、不同时刻引起的**太阳高度角（或天顶角 $\theta_s$）**与**日地天文距离 $d$** 导致的入射辐照度差异。 | 将入瞳辐射亮度归一化到大气顶层（TOA）表观反射率：<br>$\rho_{\text{TOA}} = \frac{\pi \cdot L_\lambda \cdot d^2}{ESUN_\lambda \cdot \cos\theta_s}$ | 大气上界平均太阳光谱辐照度 $ESUN_\lambda$、太阳天顶角 $\theta_s = 90^\circ - \theta_e$（$\theta_e$ 为太阳高度角）、日地距离因子 $d$。 | 消除了太阳几何位置差异，但**未消除大气吸收与程辐射散射**。 |
| **大气校正法一：辐射传输模型法（6S / MODTRAN / LOWTRAN / FLAASH）** | 大气分子与气溶胶的瑞利散射、米氏散射产生的**程辐射 $L_p$** 以及水汽、臭氧、二氧化碳的双程吸收衰减。 | 求解大气辐射传输方程，剥离大气程辐射与环境漫反射，反演地表真实反射率 $\rho_{\text{surface}}$。 | 实时大气剖面参数（气溶胶光学厚度 AOD、水汽含量、臭氧含量、能见度、传感器几何角）。 | **物理机制最严密、反演精度最高**、普适性强；但计算量大，且同步大气参数往往难以精确获取。 |
| **大气校正法二：地面场地经验线性回归法** | 大气散射与吸收的综合线性附加效应。 | 同步测量地面典型靶标（亮目标与暗目标）的真实反射率 $R$，与影像对应像元亮度 $L$ 建立线性回归：<br>$L = a + bR$（其中截距 $a$ 即代表大气程辐射）。 | 卫星过境同步的大量野外地面实测光谱数据。 | 原理直观、计算简便、局部精度高；但**外业工作量极大、成本高昂**，无法用于历史存档影像。 |
| **大气校正法三：波段回归分析法（影像内部辅助法）** | 短波段（可见光 $B_i$）受大气瑞利/米氏散射产生的程辐射。 | 假定近红外波段 $B_{\text{nir}}$ 波长较长、几乎不受大气散射影响。以 $B_{\text{nir}}$ 为横轴、待校可见光波段 $B_i$ 为纵轴进行最小二乘线性拟合：$B_i = a_i + k_i B_{\text{nir}}$，截距 $a_i$ 即为第 $i$ 波段的程辐射，从原波段中减去 $a_i$ 即可。 | 仅需多光谱影像自身的可见光波段与近红外波段（无需地面实测）。 | 完全基于影像自身，零外业成本；但属于相对经验校正，假定近红外无散射在浓霾下存在偏差。 |
| **大气校正法四：暗目标直方图最小值去除法（DOS）** | 整幅影像各波段均匀叠加的大气程辐射偏移量。 | 假定影像中存在反射率为 $0$ 的暗目标（如深海清洁水体、浓密地形阴影）。无大气影响时其最小灰度应为 $0$；实际直方图上的最小非零灰度截距 $a_i$ 即由大气散射程辐射引起，将该波段所有像元减去 $a_i$。 | 影像内需包含深水体或阴影等理想暗目标。 | 操作极简便、工程最常用；但若影像内无纯粹暗目标或大气空间分布极不均匀时精度受限。 |

### 2. 遥感图像几何畸变来源、粗校正与精校正方法对比
| 畸变/校正类别 | 具体项目 / 方法 | 物理机制 / 数学模型 | 变形特征 / 所需条件 | 优缺点与适用范围 |
| :--- | :--- | :--- | :--- | :--- |
| **几何畸变：内部误差** | 传感器自身性能误差 | 光学镜头径向/切向畸变、焦平面探测元件排列不均匀、扫描镜转速不稳定、采样速率抖动。 | 具有系统性、规律性，常表现为图像行列错位、局部比例尺微变。 | 可通过实验室检校参数和星上定标在系统粗校正中有效消除。 |
| **几何畸变：外部误差** | ① 成像投影方式变形 | **全景投影变形**（光机摆扫）：$dy = y'_p - y_p = f(\theta / \rho - \tan\theta)$，扫描角 $\theta$ 越大，边缘挤压变形越大（像元由中心向两侧拉长呈哑铃形）。<br>**斜距投影变形**（侧视雷达）：$dy = y_p - y'_p = f(\sec\theta - \tan\theta)$，近程压缩严重。 | 传感器扫描体制固有的系统性非线性几何畸变。 | 随视场角/侧视角增大而急剧加剧，需通过构像方程或斜地变换纠正。 |
| **几何畸变：外部误差** | ② 外方位元素变化 | 平台位置 $(dX_s, dY_s, dZ_s)$ 与姿态角 $(d\varphi, d\omega, d\kappa)$ 偏离标称值。其中 $dX_s, dY_s, dZ_s, d\kappa$ 引起**线性变化**（平移、比例缩放、旋转）；俯仰角 $d\varphi$ 与滚动角 $d\omega$ 引起**非线性畸变**。 | 航空遥感因气流颠簸畸变显著；卫星平台姿态相对稳定。 | 需借助星历表、GNSS（GPS/北斗）和惯性导航系统（INS/IMU）测定的外方位元素纠正。 |
| **几何畸变：外部误差** | ③ 地形起伏位移 | 高于或低于基准面 $h$ 的地面点产生中心投影辐射状像点位移：$\delta_h = \frac{r \cdot h}{H}$。 | 离像主点距离 $r$ 越大、高差 $h$ 越大、航高 $H$ 越低，地形视差位移越大。 | 普通多项式校正无法彻底消除山区地形位移，**必须结合 DEM 进行正射校正**。 |
| **几何畸变：外部误差** | ④ 地球曲率、大气折射与地球自转 | **地球曲率**：等效于高程降低 $\Delta h = \frac{D^2}{2R_0}$，引起向外径向位移；<br>**大气折射**：电磁波路径弯曲引起位移；<br>**地球自转**：卫星由北向南扫描时地球自西向东自转，导致各扫描线向西错位，整幅图像扭曲成**平行四边形（斜方形）**。 | 幅宽越大（如 MODIS、AVHRR）、轨道越高，地球曲率影响越显著；地球自转畸变随纬度降低（赤道附近）而增大。 | 均属于可建模的外部系统误差，在 Level 1B 系统几何校正中予以改正。 |
| **系统几何校正（粗校正）** | 基于通用构像方程 | 利用星历表与姿态测量获取外方位元素 $[X_s, Y_s, Z_s, \varphi, \omega, \kappa]$，代入通用构像方程纠正系统误差。 | 无需地面控制点（GCP），仅依赖平台遥测参数与传感器内部参数。 | 处理速度快，对内部畸变和系统误差有效，但**处理后残差仍较大**（米至百米级）。 |
| **几何精校正法一** | **共线方程严密几何校正** | 基于中心投影共线条件方程（投影中心、像点、地面点三点共线），结合少量 GCP 反求外方位元素并进行严密解算。 | 需要传感器内方位元素、外方位元素初值、GCP 以及高程数据（DEM）。 | **物理几何意义最严密、校正精度极高**；但模型复杂、计算量大，且依赖传感器参数与高程。 |
| **几何精校正法二** | **多项式几何校正法** | 回避复杂的空间成像几何过程，直接用 $n$ 次多项式拟合图像坐标 $(x,y)$ 与地面坐标 $(X,Y)$ 的映射关系，利用 GCP 按最小二乘平差求解系数：$\Delta a = (A^T A)^{-1} A^T L_x$。 | **最少控制点对数**：$N_{\min} = \frac{(n+1)(n+2)}{2}$。<br>一次多项式至少 **3对**；二次多项式至少 **6对**；三次多项式至少 **10对**（实际工程中一幅 TM 影像常选 30 个左右均匀分布的 GCP）。 | **与传感器类型无关、数学形式简单、计算速度快**；但高次多项式易出现法方程病态矩阵及边缘振荡，且不能消除局部地形起伏误差（高分辨率卫星现常用有理函数模型 RFM/RPC 替代）。 |

### 3. 几何校正坐标变换方案（直接法 vs 间接法）与三种灰度重采样方法对比
| 类别 | 方法名称 | 核心计算原理與数学公式 | 优点 | 缺点 | 适用场景 |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **坐标变换方向** | **直接法（正解法）** | 从**原始畸变图像阵列**出发，按行列顺序依次将每个像素 $(x,y)$ 代入正变换公式求取地面/输出坐标 $(X,Y)$，并赋灰度值。 | 正向逻辑直观。 | 投影到输出网格上的点分布不均匀，会出现**像素重叠或空白漏洞（无值空洞）**，还需二次内插。 | 仅用于理论推导或离散控制点正算，实际栅格校正极少直接采用。 |
| **坐标变换方向** | **间接法（反解法，工程标准）** | 从**空白的规则输出图像网格**出发，按行列顺序依次对每个输出格网点 $(X,Y)$ 代入逆变换方程反求其在原始图像中的浮点坐标 $(x,y)$，再通过重采样赋灰度值。 | **彻底避免输出图像出现空白像素或重叠现象**，每个输出格网点必有唯一确定的灰度值。 | 反求出的原始坐标 $(x,y)$ 一般不是整数，必须配合灰度重采样内插。 | **所有主流遥感软件几何精校正的标准实现方式**。 |
| **灰度重采样** | **最邻近内插法（Nearest Neighbor）** | $1 \times 1$ 邻域：直接取距离反算投影点 $(x,y)$ **几何距离最近的 1 个原始整数像元**的灰度值作为输出像元灰度值。 | **计算最简单、速度最快**；**完全不改变原始像元灰度值（百分之百保留原始光谱信息）**。 | 几何精度最差（最大可产生 $\pm 0.5$ 个像元的位置偏移），校正后图像地物边缘会出现明显的**“锯齿状”断裂（阶梯效应）**。 | **计算机分类前预处理**、训练样本提取、已分类专题图的几何变换（严禁改变原始光谱或类别编码时必选）。 |
| **灰度重采样** | **双线性内插法（Bilinear Interpolation）** | $2 \times 2$ 邻域：取投影点周围最邻近的 **4 个像元**，按距离远近赋予权重 $p_i$ 进行双线性加权平均：<br>$g_{x,y} = \frac{\sum_{i=1}^4 p_i g_i}{\sum_{i=1}^4 p_i}$ | 消除了锯齿现象，图像视觉效果平滑自然，计算量适中。 | 属于低通滤波平均过程，**改变了原始像元的光谱灰度值**，并使图像高频边缘和细节产生一定程度的**平滑模糊**。 | 常规目视解译、正射影像制图、连续变化的地学参数场（如 DEM、温度场）重采样。 |
| **灰度重采样** | **三次卷积内插法（Cubic Convolution）** | $4 \times 4$ 邻域：取投影点周围最邻近的 **16 个像元**，利用三次样条逼近理想 $\text{sinc}$ 函数的权重核进行加权内插：<br>$g_{x,y} = \frac{\sum_{i=1}^{16} p_i g_i}{\sum_{i=1}^{16} p_i}$ | **几何精度最高，图像视觉效果最清晰**，既消除了锯齿，又很好地保持了边缘锐度与纹理反差。 | **计算量最大、耗时最长**（运算量约为最邻近法的十余倍），且同样会轻微改变原始光谱值。 | 高精度制图、印刷级数字正射影像图（DOM）生产、高空间分辨率目视判读。 |

## 三、 空间域增强、频率域滤波、图像融合与特征变换（K-L / K-T）对比

### 1. 辐射对比度增强与彩色增强方法对比
| 增强类别 | 方法名称 | 核心变换机制与数学表达 | 视觉与统计效果 | 典型应用场景 |
| :--- | :--- | :--- | :--- | :--- |
| **对比度拉伸** | **线性对比度拉伸** | $y = ax + b$（将原始狭窄灰度区间 $[x_{\min}, x_{\max}]$ 线性扩展至 $[0, 255]$）。 | 整体均匀拉开灰阶间距，增强全局反差，不改变直方图基本轮廓形态。 | 原始影像动态范围窄、整体偏暗或偏亮时的常规首选增强。 |
| **对比度拉伸** | **分段线性拉伸** | 对感兴趣灰度区间设置斜率 $a > 1$（拉伸），对非感兴趣背景区间设置斜率 $a < 1$（压缩）。 | 极具针对性地突出特定地物（如水体内部微弱差异或暗部阴影细节），同时抑制背景。 | 已知目标地物灰度分布区间时的精细目标突出。 |
| **对比度拉伸** | **非线性拉伸（指数/对数）** | **指数变换**：$y = b e^{ax} + c$（拉伸高灰度亮部，压缩暗部）；<br>**对数变换**：$y = b \lg(ax+1) + c$（拉伸低灰度暗部，压缩高灰度亮部）。 | 选择性扩展亮区或暗区的细节层次。 | 对数变换常用于增强阴影区细节或显示动态范围极大的傅立叶频谱图；指数变换用于突出高反射率云雪或亮目标。 |
| **直方图变换** | **直方图均衡化（Histogram Equalization）** | 基于累积分布函数（CDF）进行非线性单调映射，使变换后各灰度级出现的概率近似相等（直方图趋于平坦均匀）。 | 频率小的灰度级被合并，频率大的灰度级被拉开；**自动大幅增强大面积地物与周围背景的反差**，但会减少实际有效灰度级数并增加图像颗粒感。 | 低反差图像的快速自动增强、初步分类视觉预览。 |
| **直方图变换** | **直方图规定化（直方图匹配，Matching）** | 将待处理图像的直方图强制变换为某一**参考图像（标准图像）**或指定形态的直方图，从而调整各像元灰度。 | 使不同图像具有几乎一致的均值、方差和色调分布。 | **多幅相邻遥感影像无缝镶嵌（消除接边色差）**、多时相变化检测、**IHS/PCA 图像融合中全色波段与分量替换前的匹配**。 |
| **直方图变换** | **直方图正态化** | 将随机或偏态分布的原图像直方图变换为符合高斯正态分布的直方图（中间灰阶多，两端极亮极暗少）。 | 色调柔和自然，最符合人类视觉系统的生理习惯，避免均衡化带来的过度饱和或颗粒噪声。 | 高质量人机交互目视解译底图制作。 |
| **彩色增强** | **伪彩色密度分割 vs 假彩色合成 vs IHS 变换** | **伪彩色密度分割**：针对**单波段**黑白图像，按灰度阈值划分为若干层级并人工赋予彩虹色；<br>**假彩色合成**：针对**多波段**图像，任选3个波段赋予 R、G、B；<br>**IHS 变换**：将 RGB 耦合空间解耦为**明度（Intensity，空间细节与总能量）**、**色调（Hue，平均波长/颜色类别）**、**饱和度（Saturation，颜色纯度/白光掺入度）**。 | 伪彩色将人眼仅能分辨的几十级灰度转化为上千种彩色；IHS 变换实现了空间信息（I）与光谱色彩信息（H、S）的完美分离。 | 伪彩色用于单波段热红外温度场、DEM 高程场、NDVI 专题渲染；IHS 变换广泛用于彩色饱和度独立增强与多源遥感图像融合。 |

### 2. 空间域滤波（平滑 vs 锐化）与频率域滤波横向对比
| 维度 | 空间域平滑（去噪） | 空间域锐化（边缘增强） | 频率域低通滤波（平滑） | 频率域高通/陷波滤波（锐化/去条带） |
| :--- | :--- | :--- | :--- | :--- |
| **处理域与核心算子** | 空间域 $f(x,y)$，属于**积分（平均/排序）过程**。 | 空间域 $f(x,y)$，属于**微分（差分求导）过程**。 | 频率域 $F(u,v)$（经二维傅立叶变换 FT 进入频域）。 | 频率域 $F(u,v)$（经 FT 滤波后再经逆变换 IFT 回空间域）。 |
| **空间频率物理对应** | 抑制高频分量（噪声、突变点），保留低频分量（大面积均色图斑）。 | 突出高频分量（地物边界、线状构造、纹理细节），削弱或抵消低频平坦背景。 | 让低频信号（图像整体轮廓、大图斑）通过，截断高频信号（细节、边缘、随机噪声）。 | 高通让高频边缘通过；**陷波（点阻）滤波**精准滤除频谱图上特定频率的对称亮点。 |
| **模板系数特征** | 线性平滑模板各权重均为正数，且**模板系数之和 $= 1$**（保证平坦区均值不变）。 | 微分锐化算子含正负权重，且**模板系数之和 $= 0$**（平坦均色区输出为 $0$，仅在灰度突变处有响应）。 | 频域传递函数 $H(u,v)$ 在中心低频区为 $1$，向外围高频区衰减为 $0$（理想、巴特沃斯、高斯低通）。 | 高通传递函数中心为 $0$、外围为 $1$；去条带直接抹除频谱中定频共轭脉冲点。 |
| **代表算法与公式** | ① **邻域平均法**（$3\times 3$ 权重均为 $1/9$）：简单快速，但严重模糊图像边缘；<br>② **中值滤波法**：取滑动窗口（$3\times 3$ 或 $5\times 5$）内像素排序后的**中位数**替代中心像素。**对椒盐噪声（孤立脉冲噪声）滤除效果极佳，且能较好保护图像边缘不模糊**。 | ① **一阶梯度算子（Roberts / Prewitt / Sobel）**：利用一阶差分检测水平与垂直边缘（Sobel 对中心行/列赋权重 $2$，抗噪性更好）；<br>② **二阶拉普拉斯算子（Laplace）**：各向同性二阶微分 $\nabla^2 f = f(x+1,y)+f(x-1,y)+f(x,y+1)+f(x,y-1)-4f(x,y)$。常将原图加上拉普拉斯边缘得到锐化增强图像。 | 理想低通滤波器（有振铃效应）、巴特沃斯低通滤波器、高斯低通滤波器。 | 理想/巴特沃斯/高斯高通滤波器、**频域陷波（去周期性条带/正弦网纹）滤波器**。 |
| **核心优势与不可替代性** | 局部小窗口卷积计算直观，中值滤波是非线性保边去噪首选。 | 算法简单、实时性强，广泛用于线性地质断层、道路水系边界提取。 | 物理意义清晰，可设计任意频率响应曲线。 | **解决空间域极难处理的周期性噪声**：如摆扫/推扫传感器产生的**周期性黑色条带或正弦网纹**，在频域中浓缩为一对对称的定频亮点，只需在频域抹除该点对再做 IFT，即可无损消除全图条带！ |

### 3. 四大图像融合（Pan-sharpening）算法对比
**图像融合定义**：将高空间分辨率的全色影像（PAN，如 $0.5 \sim 15\text{ m}$）与低空间分辨率的多光谱影像（MS，如 $2 \sim 30\text{ m}$）在像素级、特征级或决策级进行协同处理，生成兼具**高空间分辨率（清晰纹理细节）**与**多光谱色彩信息**的新图像。
* **融合效果评价体系**：
  * **定性评价**：目视判读法（对比融合前后空间细节清晰度与色彩失真度，直观但有主观性）。
  * **定量评价**：① **信息量与清晰度指标**：信息熵（Entropy，越大信息越丰富）、平均梯度（Average Gradient，越大边缘越清晰）、标准差；② **光谱保真度指标**：偏差指数（Bias Index，越小越好）、相关系数（CC，与原多光谱越接近 $1$ 光谱保持越好）、光谱角（SAM）。

| 融合算法 | 核心处理步骤（标准三步法） | 波段数限制 | 空间细节提升效果 | 光谱保真度（色彩失真情况） | 适用场景 |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **IHS 变换融合法** | ① 将重采样后的 3 个低分多光谱波段由 RGB 正变换至 IHS 空间；<br>② 将高分全色波段（PAN）与明度分量 $I$ 进行**直方图匹配**，并**用拉伸后的 PAN 替换 $I$ 分量**；<br>③ 将新的 $(PAN, H, S)$ 进行 IHS 逆变换回 RGB 空间。 | **严格受限于 3 个波段** | 极高（纹理边缘极其清晰锐利） | **光谱失真较大**（因全色波段波长范围往往与 3 个多光谱波段合成的 $I$ 分量不一致，植被色彩易发生偏移）。 | 仅用于 3 波段目视解译底图制作，不适合用于后续定量反演。 |
| **PCA（主成分分析）融合法** | ① 对任意 $n$ 个低分多光谱波段进行 PCA 正变换，得到互不相关的 $PC_1, PC_2, \dots, PC_n$；<br>② 将高分 PAN 波段与集中了绝大部分空间与共同方差信息的**第一主分量 $PC_1$** 进行**直方图匹配**（使其均值和方差一致），并用匹配后的 PAN **替换 $PC_1$**；<br>③ 与其余分量 $PC_2 \dots PC_n$ 一起进行 PCA 逆变换。 | **不受波段数限制（支持 $n$ 波段）** | 高 | 光谱失真小于 IHS 法（因为 $PC_1$ 代表所有波段的共同反照率，而光谱差异主要保存在 $PC_2 \dots PC_n$ 中未受破坏）。 | 多波段（$>3$ 波段）遥感影像融合与综合分类前增强。 |
| **Brovey（比值加权）融合法** | 将 RGB 三个多光谱波段分别乘以高分 PAN 波段与三波段之和的比值：<br>$B'_i = A \cdot PAN \cdot \frac{B_i}{B_R + B_G + B_B}$ | 仅限 3 个波段 | 较高（地物边界反差显著） | 改变了各波段辐射绝对值，但保持了波段间的比值关系，色彩鲜艳但绝对光谱失真。 | 城市地物识别、目视制图增强。 |
| **Gram-Schmidt（GS 正交化）融合法** | ① 利用低分多光谱波段模拟出一个低分全色波段作为 $GS_1$，并对各波段进行 Gram-Schmidt 正交变换；<br>② 根据 $GS_1$ 的均值和标准差对高分 PAN 进行匹配修正，**用修正后的 PAN 替换 $GS_1$**；<br>③ 进行 GS 逆变换得到 $n$ 个高分多光谱波段。 | **不受波段数限制（支持 $n$ 波段）** | 极高 | **光谱保真度最高**，最大程度保留了原始多光谱影像的光谱反射特性。 | **高空间分辨率多光谱定量分析、计算机分类及 ENVI 标准工程融合首选**。 |

### 4. K-L 变换（主成分分析 PCA）与 K-T 变换（缨帽变换 Tasseled Cap）深度对比
| 对比维度 | K-L 变换（Karhunen-Loeve Transform / 主成分分析 PCA） | K-T 变换（Kauth-Thomas Transform / 缨帽变换 Tasseled Cap） |
| :--- | :--- | :--- |
| **数学本质** | 基于图像自身统计特征的**数据驱动正交线性变换**。通过求解多波段协方差矩阵 $\Sigma$ 的特征值 $\lambda_i$（按从大到小排序 $\lambda_1 > \lambda_2 > \dots > \lambda_n$）及对应的正交特征向量矩阵 $A$，将原相关波段投影到正交主轴：$Y = A^T X$。 | 基于农作物生长与土壤光谱物理机制的**经验固定系数正交线性变换**。旋转矩阵系数根据传感器（如 MSS、TM、ETM+、OLI）预先标定固定，因为植被生长轨迹在特征空间呈带穗帽子状而得名。 |
| **变换矩阵特点** | **随图像而变（Scene-dependent）**：不同景、不同区域的图像协方差矩阵不同，计算出的特征向量（旋转矩阵）完全不同。 | **固定不变（Sensor-dependent）**：只要传感器相同，无论哪一景图像，变换矩阵的权重系数均固定不变。 |
| **各分量物理意义** | **无固定地学物理意义**（需根据载荷系数具体分析）：<br>• **$PC_1$（第一主分量）**：方差最大（常占总信息量的 $70\% \sim 90\%$ 以上），反映各波段共同的地表总辐射反照率与地形明暗信息；<br>• **$PC_2, PC_3$**：包含次要光谱差异信息；<br>• **高阶主分量（如 $PC_n$）**：方差极小，基本全为随机噪声。 | **具有极其明确、固定的地学物理意义**（以 TM/OLI 前三/四分量为例）：<br>• **第一分量——亮度（Brightness）**：各波段正加权和，反映**土壤裸露程度与地表总反照率**（土壤亮度轴）；<br>• **第二分量——绿度（Greenness）**：近红外波段正权重与可见光红光波段负权重之差，强烈反映**绿色植被覆盖度、叶面积指数与生物量**（绿度轴）；<br>• **第三分量——湿度（Wetness，TM） / 黄度（Yellowness，MSS）**：TM 中为可见光/近红外与短波红外（SWIR）之差，反映**土壤水分与植被冠层含水量**。 |
| **核心优势与用途** | **去波段相关性**（各主分量协方差为 $0$）、**信息高度集中**、**数据降维与压缩**（舍弃高阶噪声分量可同时实现降维与去噪）、PCA 图像融合、提高后续分类器运行效率与精度。 | 直接服务于**农业遥感、森林生态与土地退化/干旱监测**，无需每次重新统计协方差，不同时相、不同区域的 K-T 分量可直接进行定量对比。 |

## 四、 遥感图像解译与计算机分类算法全维对比

### 1. 目视解译与计算机分类对比及九大目视解译标志
* **直接解译标志（9项，必背）**：**色调（Tone，黑白图像的明暗程度，最基本标志）**、**颜色（Color，真/假彩色特征）**、**阴影（Shadow，本影提供地物高度与侧面轮廓，落影可计算建筑物/树木高度，但遮挡背光面地物）**、**形状（Shape，俯视几何外形，区分人工地物与自然地物）**、**大小（Size，结合比例尺确定地物实际尺寸）**、**纹理（Texture，内部色调变化的粗糙/细腻周期性结构）**、**模式/图型（Pattern，地物有规律的空间排列组合，如水系网、果园网格）**、**位置（Site，所处地理环境位置）**、**相关布局（Association，多个地物间的空间配置关系，如铁轨与站台）**。
* **间接解译标志**：与目标地物存在内在自然或社会逻辑联系，能通过相关性推理间接反映目标属性的特征（如：由河湖相邻推断沼泽湿地、由潮间带养殖推断红树林、由夏季 NDVI 突降推断森林火灾、由阴坡阳坡推断土壤湿度与植被类型）。
* **目视解译五种常用方法**：直接判读法、对比分析法（多波段/多时相对比）、多种信息复合法（结合 GIS/DEM）、综合推理法、地理相关分析法。
* **目视解译六大标准步骤**：① 准备工作阶段 $\rightarrow$ ② 搜集相关资料 $\rightarrow$ ③ 初步解译与判读区的野外考察（建立解译标志） $\rightarrow$ ④ 室内详细判读（统筹规划、分区判读、由表及里、循序渐进） $\rightarrow$ ⑤ 野外验证与补判 $\rightarrow$ ⑥ 成果转绘与制图。

### 2. 监督分类、非监督分类与现代智能分类算法全景对比总表
| 分类大类 | 具体算法名称 | 分类原理、判别函数与核心准则 | 优点 | 缺点与限制条件 | 适用场景 |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **非监督分类（Unsupervised，聚类分析）** | **宏观共性** | **无需先验知识与训练样本**，仅凭影像光谱特征空间中的自然点群分布（“物以类聚”）进行盲目自动聚类；聚类完成后再通过目视判读或实地调查赋予地学属性。 | 无需预先广泛了解测区；**减少人为选样主观误差**；只需设定少量初始参数；**能识别出独特、面积小但光谱差异显著的未知类别**。 | 形成的光谱类（Spectral Class）与信息类（Information Class）**并非一一对应**（同物异谱/异物同谱）；分析者难以控制生成的类别；事后归类定性工作量大。 | 测区缺乏先验资料、辅助监督分类前探索光谱结构、客观快速初分。 |
| **非监督分类** | **K-均值算法（K-Means）** | ① 任选 $m$ 个初始聚类中心；② 按最小欧氏距离准则将所有像元分配给最近的中心（使误差平方和最小）；③ 重新计算各类的均值中心；④ 循环迭代直至聚类中心不再变化。 | 算法极其简单、收敛快、易于编程实现。 | **类别数 $m$ 一旦设定在迭代中固定不变**；结果严重依赖初始中心选择、样本输入次序和数据几何形状，易陷入局部最优。 | 类别数明确、点群呈球状紧凑分布的简单图像聚类。 |
| **非监督分类** | **ISODATA 算法（迭代自组织数据分析）** | K-均值的全面改进版：① 每次将**全部样本调整完毕后**才统一重算均值；② 引入**“合并（Merge）”**（当两类中心距离过近或样本过少时合并）和**“分裂（Split）”**（当某类内部方差过大且样本过多时分裂）机制，动态调整类别总数。 | 克服了 K-均值类别数僵化的缺陷，能根据数据自身分布动态获得更合理的聚类数与中心位置。 | 需人为设定的控制参数较多（期望类别数、最小样本数、最大标准差、最小中心距、最大迭代次数），计算耗时较长。 | **遥感软件中最主流、最常用的非监督分类标准算法**。 |
| **监督分类（Supervised，先训练后判别）** | **宏观共性** | **基于先验知识**：先在已知地物区选取代表性**训练样区（ROI）**，统计各类光谱特征以确定**判别函数和判别准则**（训练/学习阶段）；再将全图未知像元代入判别函数逐一判定归属类别。 | **可根据应用目的有选择地指定所需信息类别**；可人工控制训练样本质量；可通过检验训练样本预估分类精度；避免了非监督分类事后繁琐的光谱类重归并。 | 训练样本获取与提纯耗费大量人力物力；受混合像元影响样本代表性可能不足；**只能识别训练集中已定义的类别**，未定义类别会被强行错分遗漏。 | 测区先验知识充足、有明确专题制图分类体系（如三调土地利用分类）的工程任务。 |
| **监督分类** | **最小距离分类法（Minimum Distance）** | 用训练样本求出各类均值中心 $M_i$，计算未知像元 $X$ 到各类中心的距离 $d_i(X)$，距离最小者即为归属类：<br>• **计程距离（曼哈顿）**：$d = \sum \lvert x_k - \mu_k \rvert$（无乘法开方，最快）；<br>• **欧氏距离**：$d = \|X - M_i\|_2$（假定各波段独立且方差相等）；<br>• **马氏距离**：$d^2 = (X - M_i)^T \Sigma_i^{-1} (X - M_i)$（考虑了协方差相关性）。 | 原理直观、**计算速度极快**；对训练样本数量要求不高（不会因样本少导致协方差矩阵奇异）。 | 欧氏/计程距离**完全忽略了各类别点群的方差（离散程度）和波段间协方差**，也未考虑各类别出现的先验概率，当各类分布方差差异大时分类精度较低。 | 快速粗分类、类别间均值距离远且点群方差相近的场景。 |
| **监督分类** | **最大似然分类法（Maximum Likelihood, MLC / 贝叶斯分类器）** | 基于**贝叶斯准则**（将先验概率 $P(\omega_i)$ 与类条件概率密度 $p(X \mid \omega_i)$ 转化为后验概率 $P(\omega_i \mid X)$）。**假定各类光谱特征服从多元正态分布**，取对数判别函数：<br>$d_i(X) = \ln P(\omega_i) - \frac{1}{2}\ln\lvert\Sigma_i\rvert - \frac{1}{2}(X - M_i)^T \Sigma_i^{-1}(X - M_i)$<br>取 $d_i(X)$ 最大者所属类别。 | 同时考虑了均值向量、协方差矩阵（点群形状与方向）和先验概率，较好平衡了“存真”与“弃伪”错误概率，是**统计学理论上分类精度最优（总错分概率最小）的分类器**。 | **强假设数据必须服从多元正态分布**（实际地物如城镇常呈多峰偏态分布）；计算量大；需计算协方差逆矩阵 $\Sigma_i^{-1}$，要求每类训练样本数必须足够多（否则出现奇异矩阵或休斯现象）。 | 传统多光谱遥感像素级监督分类的基准高精度算法。 |
| **现代机器学习与智能分类** | **支持向量机（SVM）** | 基于统计学习理论与结构风险最小化准则，寻找使两类样本边界支持向量**分类间隔（Margin）最大化**的最优分类超平面；对非线性可分问题通过**核函数（Kernel Trick）**映射至高维特征空间实现线性分割。 | **彻底摆脱正态分布假设**；天生擅长解决**小样本、非线性、高维数据（如高光谱数百波段）**分类问题，泛化能力极强。 | 对核函数类型及惩罚参数选择较敏感，超大样本集下核矩阵计算内存开销大。 | 高光谱遥感分类、训练样本稀缺条件下的高精度分类。 |
| **现代机器学习与智能分类** | **决策树（Decision Tree）与专家系统** | **决策树**：由根节点、分枝节点、叶节点构成，通过阈值规则（如 `Band4 < 0.1128`、`NDVI > 0.56`、`SLOPE < 8.18°`）逐级二分或多分；<br>**专家系统**：由**知识库**（地物光谱/空间/经验/多源规则）和**推理机**（正向/反向推理，`IF...AND...THEN...`）组成。 | 规则透明可解释（白盒模型），**极易融合非遥感辅助数据（DEM 坡度、坡向、距离道路远近、物候历）**，有效破解“同物异谱、异物同谱”。 | 单棵决策树易过拟合（工程中常集成多棵树构建**随机森林 Random Forest**）；专家系统知识库构建依赖领域专家经验。 | 复杂地形区多源数据协同分类、宏观生态制图。 |
| **现代机器学习与智能分类** | **模糊聚类 / 软分类（Fuzzy Classification）** | 针对中低分辨率影像中普遍存在的**混合像元**（一个像元内包含房屋、草地、道路等多种地物），不再将像元硬性归入唯一类别，而是计算其对所有类别的**隶属度向量** $a_{ij} \in [0, 1]$，且满足 $\sum_j a_{ij} = 1$。 | 真实反映了混合像元内各类地物的丰度比例，避免了硬分类的信息丢失与边界武断。 | 隶属度函数确定较复杂，结果需解译或设阈值才能转回传统矢量图斑。 | 中低分辨率影像亚像元丰度分解、过渡带生态边界提取。 |
| **现代机器学习与智能分类** | **面向对象分类（OBIA，图斑级分类）** | 分两阶段：① **多尺度影像分割**：根据灰度均匀性与纹理/形状均匀性将相邻同质像元合并为有意义的“影像对象（图斑）”；② **图斑特征分类**：综合提取图斑的**光谱、形状、纹理、面积、上下文拓扑特征**进行分类。 | **彻底消除了传统逐像素分类在高分辨率影像上产生的“椒盐噪声（碎斑）”**；充分挖掘了几何形状与空间上下文信息，分类结果直接形成圆滑图斑，易于与 GIS 矢量融合。 | 分割尺度参数选择直接决定分类成败（过分割或欠分割）。 | **高空间分辨率影像（如 $< 2\text{ m}$ 的 WorldView、GF-2、无人机影像）分类的标准首选方法**。 |
| **现代机器学习与智能分类** | **人工神经网络（ANN / BP）与卷积神经网络（CNN）** | **BP 网络**：含输入层、隐含层、输出层，通过正向传播与**误差反向传播（梯度下降）**修正权值；<br>**CNN（深度学习）**：利用**局部连接、权重共享、池化下采样**，通过多层**卷积层（提取空间-光谱特征） $\rightarrow$ 激活函数（ReLU） $\rightarrow$ 池化层（降维防过拟合） $\rightarrow$ 全连接层 $\rightarrow$ Softmax 输出层**实现端到端特征学习与分类。 | 不受任何概率分布限制，具备极强的非线性拟合与高阶空间上下文语义提取能力，在海量数据下精度远超传统统计分类。 | 属于“黑箱模型”，可解释性弱；**极度依赖海量高质量标注样本**（样本标注工作量巨大），训练计算资源消耗高，隐含层过多易过拟合。 | 海量高分遥感影像智能解译、目标检测、地物语义分割与变化检测。 |

## 五、 分类后处理与混淆矩阵（误差矩阵）精度评价指标对比

### 1. 分类后处理（消除“椒盐噪声”小碎斑）
* **分类结果“噪声”三大来源**：① 原始遥感影像本身的辐射噪声；② 边界处混合像元辐射量造成的错分；③ 分类本身正确，但该地物零星散布、面积过小，不符合专题制图最小上图图斑面积要求。
* **多数平滑滤波（Majority Filter / 主类滤波）**：采用 $3 \times 3$ 或 $5 \times 5$ 邻域滑动窗口，统计窗口内各类别出现的像元个数，**将中心像元的类别直接改为窗口内占绝对优势（出现频次最多）的类别**。
  * **核心考点注意**：分类后处理的多数平滑**不是代数运算（严禁对类别编号求算术平均！），而是逻辑统计运算（众数替换）**。

### 2. 混淆矩阵（Confusion Matrix）五大精度评价指标对比
设共有 $m$ 个类别，检验样本总数为 $N$，混淆矩阵中第 $i$ 行、第 $j$ 列元素为 $x_{ij}$（假设**行为分类结果类别 Predicted，列为地面真实参考类别 Actual**；注：若题目表格定义行为实际类、列为分类类，则行和与列和含义互换，但对角线 $x_{ii}$ 永远代表被正确分类的样本数！以下按课程讲义通用记号：$x_{ii}$ 为第 $i$ 类对角线正确样本数，$x_{i+}$ 为第 $i$ 行总和，$x_{+i}$ 为第 $i$ 列总和）：

| 精度评价指标 | 英文名称与缩写 | 数学计算公式 | 物理与统计含义 | 优缺点与评价重点 |
| :--- | :--- | :--- | :--- | :--- |
| **总体分类精度** | Overall Accuracy ($OA$ 或 $p_c$) | $p_c = \frac{\sum_{k=1}^{m} x_{kk}}{N} \times 100\%$ | 被正确分类的样本总数（主对角线元素之和）占全部检验样本总数 $N$ 的百分比。 | 最直观、最基础的全局指标；但**只考虑了对角线上的像元，完全忽略了非对角线上的错分与漏分分布**，且易受大面积优势类别的掩盖。 |
| **制图精度（生产者精度）** | Producer's Accuracy ($PA_i$) | $PA_i = \frac{x_{ii}}{x_{\text{真实列(或行)总和}}} \times 100\%$ | 地面真实属于第 $i$ 类的参考样本中，被分类器正确判别为第 $i$ 类的比例。 | 反映分类方法对该地物的提取能力，与**漏分误差（Omission Error）**互补：$PA_i + OE_i = 100\%$。 |
| **用户精度（使用者精度）** | User's Accuracy ($UA_i$) | $UA_i = \frac{x_{ii}}{x_{\text{分类行(或列)总和}}} \times 100\%$ | 分类图上被标为第 $i$ 类的图斑样本中，地面真实验证确实属于第 $i$ 类的比例（即用户拿到图件去实地考察的可靠度）。 | 反映图件使用者的信任度，与**错分误差/虚警误差（Commission Error）**互补：$UA_i + CE_i = 100\%$。 |
| **Kappa 系数** | Kappa Coefficient ($K$) | $K = \frac{N \sum_{i=1}^{m} x_{ii} - \sum_{i=1}^{m} (x_{i+} \cdot x_{+i})}{N^2 - \sum_{i=1}^{m} (x_{i+} \cdot x_{+i})}$ | 衡量实际分类结果与随机分类结果相比减少误差的比例，取值通常在 $[0, 1]$ 之间。 | **不仅考虑了对角线上正确分类的像元，还全面纳入了非对角线上的各种漏分和错分误差**，评价更客观严密。<br>**课程质量等级标准**：$<0$ 很差；$0.00\sim 0.20$ 极低；$0.20\sim 0.40$ 一般；$0.40\sim 0.60$ 中等；$0.60\sim 0.80$ 很好；$0.80\sim 1.00$ 极好。 |
| **条件 Kappa 系数** | Conditional Kappa ($K_i$) | $K_i = \frac{N \cdot x_{ii} - x_{i+} \cdot x_{+i}}{N \cdot x_{+i} - x_{i+} \cdot x_{+i}}$<br>（注：分母中 $x_{+i}$ 取该类所在的边际和，课程例题中取分类列和或真实行和） | 单独评价第 $i$ 个特定类别在剔除随机偶然性后的分类精度。 | 用于精细诊断某单一地物类别（如“玉米”类）的分类可靠性。 |
</script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const raw = document.getElementById("md-raw").textContent;
    const codeMasks = [];
    const mathBlocks = [];
    const mathInlines = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    let safe = raw.replace(/```[\s\S]*?```|`[^`\n]+`/g, function(m) {
      const id = "KATEXCODEMASK" + codeMasks.length + "END";
      codeMasks.push(m);
      return id;
    });

    safe = safe.replace(/\$\$([\s\S]*?)\$\$/g, function(m) {
      const id = "KATEXMATHBLOCK" + mathBlocks.length + "END";
      mathBlocks.push(m);
      return id;
    });
    safe = safe.replace(/\$([^\$\n]+?)\$/g, function(m) {
      const id = "KATEXMATHINLINE" + mathInlines.length + "END";
      mathInlines.push(m);
      return id;
    });

    safe = safe.replace(/KATEXCODEMASK(\d+)END/g, function(_, i) {
      return codeMasks[Number(i)];
    });

    let html = marked.parse(safe);

    html = html.replace(/KATEXMATHBLOCK(\d+)END/g, function(_, i) {
      return escapeHtml(mathBlocks[Number(i)]);
    });
    html = html.replace(/KATEXMATHINLINE(\d+)END/g, function(_, i) {
      return escapeHtml(mathInlines[Number(i)]);
    });

    const container = document.getElementById("content");
    container.innerHTML = html;
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  });
</script>
</body>
</html>
