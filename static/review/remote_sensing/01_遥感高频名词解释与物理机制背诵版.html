<script type="text/plain" id="md-raw"># 01 遥感高频名词解释与物理机制背诵版（SDUT《遥感原理与应用》核心考点）

> **复习说明**：本文档基于山东理工大学（SDUT）《遥感原理与应用》课程讲义（第1章至第6章核心物理与传感器部分）整理，已自动修正讲义 OCR 识别错别字（如“分瓣率 $\rightarrow$ 分辨率”、“透射收缩 $\rightarrow$ 透视收缩”、“汞镉谛 $\rightarrow$ 汞镉碲”等）及残缺数学符号，按**“标准定义 + 物理机制/数学表达 + 遥感应用意义”**三段式结构编排，适合名词解释与简答题直接背诵。

---

## 一、 遥感基本概念与技术系统

### 1. 遥感（Remote Sensing, RS）
* **广义定义**：泛指一切无接触的远距离探测技术（对象为一切物体，媒介包括视觉、听觉、嗅觉等）。
* **狭义（课程标准）定义**：在高空和外层空间的各种平台上，运用各种传感器获取反映地表特征的电磁波数据，通过传输、变换和处理，提取有用信息，实现研究地物空间形状、位置、性质及其与环境的相互关系的一门现代应用技术科学（2022年9月正式成为一级学科，学科代码 `1404`）。
* **遥感技术系统六大组成**：
  1. **信息源**：遥感的电磁波来源（太阳辐射、地球自身热辐射、人工发射微波/激光源）。
  2. **信息获取**：各类遥感平台（地面、航空、航天）与传感器（收集器、探测器、处理器、输出器）。
  3. **遥感信息**：获取的胶片影像和数字影像。
  4. **信息传输**：通过地面接收站及中继卫星进行实时或非实时星地数传。
  5. **信息处理**：包括预处理（辐射校正、几何校正、图像编码/分幅）、图像增强与变换、图像融合与信息解译（目视解译与计算机分类）。
  6. **信息应用**：生成专题图、正射影像（DOM）、数字高程模型（DEM）及反演地学定量参数（LAI、地表温度、二氧化碳浓度等）。
* **遥感探测四大特点**：
  1. **大范围获取数据资料**（宏观性强，如一景 Landsat 影像覆盖 $185\text{ km} \times 185\text{ km}$）。
  2. **获取信息手段多、波段广**（可见光、红外、微波、LiDAR 多传感器协同）。
  3. **获取信息周期短、动态监测能力强**（如静止气象卫星 5~15 分钟一次，MODIS 1~2 天，Landsat-8/9 单星 16 天、双星 8 天）。
  4. **应用领域广泛**（军事、气象、农业、林业、海洋、地质、灾害监测等）。

### 2. 主动遥感与被动遥感
* **被动遥感（Passive Remote Sensing）**：传感器本身不向目标发射电磁波，仅被动接收地面物体反射的太阳辐射（$0.3\sim 3.0\ \mu\text{m}$）或地物自身发射的热辐射（$3.0\sim 15\ \mu\text{m}$）及微弱天然微波辐射。代表传感器：可见光/近红外多光谱扫描仪（MSS、TM、OLI、MSI）、热红外扫描仪（TIRS）、微波辐射计。
* **主动遥感（Active Remote Sensing）**：由遥感平台上的传感器主动向目标物发射一定波长和极化方式的电磁波（微波束或激光脉冲），然后接收并记录目标物后向散射或反射回来的回波信号。代表传感器：合成孔径雷达（SAR）、激光雷达（LiDAR）、雷达高度计、微波散射计。

## 二、 电磁波谱、大气散射与大气窗口

### 1. 电磁波与偏振（极化）
* **电磁波（Electromagnetic Wave）**：由麦克斯韦电磁场理论描述，变化的电场和变化的磁场相互激发、相互垂直并在空间以光速 $c$ 传播的横波。电场强度矢量 $\vec{E}$、磁场强度矢量 $\vec{H}$ 与传播方向三者两两垂直，波长 $\lambda$、频率 $f$ 与光速 $c$ 满足 $c = \lambda f$。
* **偏振（Polarization，微波中称极化）**：在光波中将电场矢量 $\vec{E}$ 称为光矢量。若光矢量 $\vec{E}$ 在一个固定平面内只沿一个固定方向振动，则称为**线偏振光（线极化波）**；与振动方向相互垂直且包含传播方向的平面称为**偏振面**。
* **雷达极化方式**：
  * **水平极化（H）**：电场矢量与雷达波束入射面垂直。
  * **垂直极化（V）**：电场矢量与雷达波束入射面平行。
  * **四种极化组合**：同极化包括 $HH$（水平发射、水平接收）、$VV$（垂直发射、垂直接收）；交叉极化包括 $HV$（水平发射、垂直接收）、$VH$（垂直发射、水平接收）。不同地物对不同极化波的散射响应不同，常用于合成极化伪彩色图像以增强地物识别能力。

### 2. 遥感常用电磁波谱划分（严格背诵波长区间）
按电磁波在真空中波长 $\lambda$ 递增顺序排列：$\gamma$ 射线 $\rightarrow$ X 射线 $\rightarrow$ 紫外线 $\rightarrow$ 可见光 $\rightarrow$ 红外线 $\rightarrow$ 微波 $\rightarrow$ 无线电波。遥感常用波段为紫外线至微波：
* **紫外线（UV）**：$0.30 \sim 0.38\ \mu\text{m}$
* **可见光（Visible）**：$0.38 \sim 0.76\ \mu\text{m}$，细分为：
  * 紫：$0.38 \sim 0.43\ \mu\text{m}$；靛：$0.43 \sim 0.47\ \mu\text{m}$；**蓝（B）**：$0.47 \sim 0.50\ \mu\text{m}$（广义蓝光波段常取 $0.45 \sim 0.52\ \mu\text{m}$）
  * **绿（G）**：$0.50 \sim 0.56\ \mu\text{m}$（广义绿光波段常取 $0.52 \sim 0.60\ \mu\text{m}$）
  * 黄：$0.56 \sim 0.59\ \mu\text{m}$；橙：$0.59 \sim 0.62\ \mu\text{m}$
  * **红（R）**：$0.62 \sim 0.76\ \mu\text{m}$（广义红光波段常取 $0.63 \sim 0.69\ \mu\text{m}$）
* **红外线（Infrared）**：$0.76 \sim 1000\ \mu\text{m}$，细分为：
  * **近红外（NIR）**：$0.76 \sim 3.0\ \mu\text{m}$（其中 $1.3 \sim 3.0\ \mu\text{m}$ 常称短波红外 SWIR，以太阳反射辐射为主）
  * **中红外（MIR）**：$3.0 \sim 6.0\ \mu\text{m}$（在 $2.5 \sim 6.0\ \mu\text{m}$ 区间内，地表反射太阳辐射与地表自身热辐射均不能忽略）
  * **远红外（FIR / 热红外 TIR）**：$6.0 \sim 15.0\ \mu\text{m}$（地物自身热辐射主导）
  * **超远红外**：$15.0 \sim 1000\ \mu\text{m}$
* **微波（Microwave）**：$1\text{ mm} \sim 1\text{ m}$，细分为毫米波（$1 \sim 10\text{ mm}$）、厘米波（$1 \sim 10\text{ cm}$）、分米波（$10\text{ cm} \sim 1\text{ m}$）。雷达常用子波段按波长由短到长依次为：
  * $Ka$（$0.75 \sim 1.1\text{ cm}$）$\rightarrow K$（$1.1 \sim 1.67\text{ cm}$）$\rightarrow Ku$（$1.67 \sim 2.4\text{ cm}$）$\rightarrow X$（$2.4 \sim 3.75\text{ cm}$）$\rightarrow C$（$3.75 \sim 7.5\text{ cm}$）$\rightarrow S$（$7.5 \sim 15\text{ cm}$）$\rightarrow L$（$15 \sim 30\text{ cm}$）$\rightarrow P$（$30 \sim 100\text{ cm}$）。

### 3. 大气垂直分层与大气吸收
* **大气垂直分层（由下至上）**：
  1. **对流层（$0 \sim 12\text{ km}$）**：温度随高度上升而下降（每上升 $1\text{ km}$ 下降约 $6^\circ\text{C}$），集中了几乎全部水汽和云雨尘埃，航空遥感主要在此层或平流层底部作业，受大气散射和气象干扰最大。
  2. **平流层（$12 \sim 80\text{ km}$）**：气流以水平运动为主，其中 $25 \sim 30\text{ km}$ 处臭氧含量最大，称为**臭氧层**（强烈吸收紫外线）。
  3. **电离层（$80 \sim 1000\text{ km}$）**：空气稀薄，受太阳高能辐射发生电离，温度高达 $600 \sim 800^\circ\text{C}$。**陆地资源卫星与极轨气象卫星（$500 \sim 900\text{ km}$）主要运行于此层**。
  4. **外大气层（$> 1000\text{ km}$）**：亦称散逸层，地球同步静止轨道卫星（约 $35860\text{ km} / 36000\text{ km}$）运行于此。
* **大气吸收的主要成分**：
  * **水汽（$\text{H}_2\text{O}$）**：吸收带最广，分布在近红外与红外波段（如 $1.4\ \mu\text{m}$、$1.9\ \mu\text{m}$、$2.7\ \mu\text{m}$ 及 $5 \sim 8\ \mu\text{m}$）。
  * **二氧化碳（$\text{CO}_2$）**：主要吸收区在红外波段（$2.7\ \mu\text{m}$、$4.3\ \mu\text{m}$ 及 $14 \sim 16\ \mu\text{m}$）。
  * **臭氧（$\text{O}_3$）**：强烈吸收 $< 0.3\ \mu\text{m}$ 的紫外线，并在 $9.6\ \mu\text{m}$ 热红外窗口内有一个窄吸收带。
  * **氧气（$\text{O}_2$）**：主要吸收 $< 0.2\ \mu\text{m}$ 的极紫外线及 $0.76\ \mu\text{m}$ 附近的窄带。

### 4. 大气散射的三种物理机制（必考对比）
**大气散射定义**：电磁波穿过大气层时遇到气体分子、气溶胶、云滴等微粒，使传播方向发生改变并向各个方向弥散的现象。大气散射是太阳辐射衰减的主要原因，且会产生不携带地表信息的**程辐射（Path Radiance）**，降低遥感影像对比度并造成图像模糊。

| 散射类型 | 发生物理条件（粒子直径 $a$ 与波长 $\lambda$） | 散射强度 $I$ 与波长关系 | 主要散射介质 | 典型自然现象与遥感影响 |
| :--- | :--- | :--- | :--- | :--- |
| **瑞利散射（Rayleigh）** | $a \ll \lambda$（颗粒直径远小于入射波长，通常 $a < 0.1\lambda$） | $I \propto \lambda^{-4}$（与波长四次方成反比，波长越短散射越强） | 大气气体分子（$\text{N}_2$、$\text{O}_2$ 等） | 晴朗无云天空呈蔚蓝色；导致多光谱遥感通常舍弃紫外和紫光波段（蓝光波段受程辐射影响最大）。 |
| **米氏散射（Mie）** | $a \approx \lambda$（颗粒直径与入射波长同数量级） | $I \propto \lambda^{-2}$（随颗粒增大，指数由 $-4$ 过渡到 $-2$ 至 $0$） | 烟尘、埃粒、霾、气溶胶、小水滴 | 雾霾天呈灰黄色或暗白色；是近地面大气校正（气溶胶光学厚度反演）重点消除的对象。 |
| **无选择性散射（均匀散射）** | $a \gg \lambda$（颗粒直径远大于入射波长） | $I \propto \lambda^{0}$（散射强度与波长无关，各波段等量散射） | 云滴、雾滴、雨滴、大颗粒尘埃（$5 \sim 100\ \mu\text{m}$） | 阴天云层、浓雾呈灰白色；导致可见光和红外遥感无法穿透云雾，需改用微波遥感（SAR）。 |

### 5. 大气窗口（Atmospheric Window）
* **定义**：电磁辐射通过大气层时被吸收和散射较少、衰减较小、**大气透过率较高**的电磁波段。遥感传感器的波段设计必须落入大气窗口内。
* **遥感五大常用大气窗口（严格对应课程讲义）**：
  1. **近紫外—可见光—近红外窗口（$0.3 \sim 1.3\ \mu\text{m}$）**：透过率 $> 90\%$，是光学遥感最常用的窗口（Landsat、Sentinel-2、高分辨率商业卫星、资源与环境监测）。
  2. **短波红外窗口（$1.3 \sim 2.5\ \mu\text{m}$，含 $1.5 \sim 1.8\ \mu\text{m}$ 和 $2.05 \sim 2.4\ \mu\text{m}$ 子窗口）**：透过率约 $80\%$，对植物叶片水分、旱情及含羟基（$-\text{OH}$）/碳酸盐矿物敏感，广泛用于地质遥感与农业监测（如 TM5、TM7，OLI6、OLI7）。
  3. **中红外窗口（$3.5 \sim 5.0\ \mu\text{m}$）**：透过率 $60\% \sim 70\%$，用于探测森林火灾、火山喷发等**地表高温目标**（如 NOAA/AVHRR 通道3b、GF-4 中波红外）。
  4. **远红外（热红外）窗口（$8.0 \sim 14.0\ \mu\text{m}$）**：透过率 $60\% \sim 70\%$，对应常温地球表面（约 $300\text{ K}$）热辐射峰值波长（$9.66\ \mu\text{m}$），用于反演常温地表温度与城市热岛（如 TM6、Landsat-8 TIRS 10/11）。
  5. **微波窗口（$1\text{ mm} \sim 1\text{ m}$）**：透过率接近 $100\%$，具有全天时、全天候、穿云透雾能力（如 Radarsat、Sentinel-1、GF-3）。

## 三、 辐射基本定律与太阳/地球辐射特征

### 1. 绝对黑体与实际物体辐射定律
* **绝对黑体（Blackbody）**：对任何波长的入射电磁辐射都全部吸收、既不反射也不透射的理想物体，即光谱吸收率 $\alpha(\lambda, T) = 1$，光谱反射率 $\rho(\lambda, T) = 0$。自然界中黑色的烟煤（吸收率约 $99\%$）、恒星与太阳可近似看作黑体；实验室用带小孔的不透明空腔模拟绝对黑体。
* **普朗克定律（Planck's Law，黑体辐射定律）**：描述绝对黑体的分谱辐射通量密度（出射度）$W(\lambda)$ 与波长 $\lambda$、绝对温度 $T$ 之间的定量关系：
  $$W(\lambda) = \frac{2\pi h c^2}{\lambda^5 \left( e^{\frac{hc}{\lambda k T}} - 1 \right)}$$
  **物理意义**：温度越高，各波长的辐射通量密度越大；同一温度下，辐射通量密度随波长先增大到峰值后减小，且不同温度的黑体辐射曲线互不相交。
* **斯蒂芬-玻尔兹曼定律（Stefan-Boltzmann Law）**：对普朗克公式在全波长范围（$0 \rightarrow \infty$）积分，得到黑体总辐射通量密度 $W$ 与绝对温度 $T$ 的四次方成正比：
  $$W = \sigma T^4$$
  **物理意义**：总辐射能量随温度升高而急剧增加，微小温度变化即可引起显著的总辐射通量变化，是热红外遥感测温的能量基础。
* **维恩位移定律（Wien's Displacement Law）**：对普朗克公式关于 $\lambda$ 求一阶导数并令其为 $0$，得到黑体辐射峰值波长 $\lambda_{\max}$ 与绝对温度 $T$ 成反比：
  $$\lambda_{\max} \cdot T = b = 2897.8\ \mu\text{m}\cdot\text{K}$$
  **物理意义**：随着物体温度升高，其辐射能量密度的峰值波长向短波方向移动。由此决定了常温地物（$300\text{ K}$）探测选用 $8 \sim 14\ \mu\text{m}$ 热红外窗口，而森林林火（$500 \sim 800^\circ\text{C}$，即 $773 \sim 1073\text{ K}$）探测选用 $3 \sim 5\ \mu\text{m}$ 中红外窗口。
* **基尔霍夫定律（Kirchhoff's Law）与发射率（比辐射率 $\varepsilon$）**：
  * 实际物体的辐射出射度 $M(\lambda, T)$ 与同温度、同波长绝对黑体辐射出射度 $M_0(\lambda, T)$ 之比称为发射率（比辐射率）$\varepsilon(\lambda)$，且等于其吸收率 $\alpha(\lambda)$：
    $$M(\lambda, T) = \varepsilon(\lambda) \cdot M_0(\lambda, T), \quad \varepsilon(\lambda) = \alpha(\lambda)$$
  * **不透明物体能量守恒关系**：由于透射率 $\tau(\lambda) = 0$，故 $\alpha(\lambda) + \rho(\lambda) = 1$，从而：
    $$\varepsilon(\lambda) = 1 - \rho(\lambda)$$
    **遥感意义**：反射率越高的地物其发射率越低，因此可以通过测定不透明地物的反射波谱特征间接推算其热红外发射率。

### 2. 太阳辐射与地球辐射特征
* **太阳常数（Solar Constant, $I_0$）**：不受大气影响，在日地平均距离（1个天文单位，$R \approx 1.5 \times 10^{11}\text{ m}$）处，垂直于太阳光辐射方向上，单位面积、单位时间内黑体所接收的太阳辐射能量，标准值为 $I_0 = 1.353 \times 10^3\text{ W/m}^2$。
* **太阳辐射特征**：等效于 $T \approx 6000\text{ K}$ 的黑体辐射，波长范围主要集中在 $0.15 \sim 4.0\ \mu\text{m}$（其中近紫外到中红外 $0.3 \sim 2.5\ \mu\text{m}$ 占太阳总辐射能量的 $85\%$，可见光占约 $50\%$，红外占 $45\%$，紫外占 $5\%$），辐射峰值波长位于 $\lambda_{\max} \approx 0.47 \sim 0.48\ \mu\text{m}$（可见光蓝绿波段）。海平面太阳辐照度曲线因大气中 $\text{O}_3$、$\text{O}_2$、$\text{H}_2\text{O}$、$\text{CO}_2$ 的选择性吸收而呈现多个凹谷，与大气上界曲线显著不同。
* **地球辐射特征**：等效于 $T \approx 300\text{ K}$（约 $27^\circ\text{C}$）的黑体辐射，主要集中在 $6\ \mu\text{m}$ 以上的热红外区段，辐射峰值波长位于 $\lambda_{\max} \approx 9.66 \sim 9.7\ \mu\text{m}$。在 $0.3 \sim 2.5\ \mu\text{m}$ 以地表反射太阳辐射为主；在 $> 6\ \mu\text{m}$ 以地球自身热辐射为主；在 $2.5 \sim 6\ \mu\text{m}$ 中红外波段，太阳反射与地球自身热辐射均不能忽略。

## 四、 典型地物的反射波谱特征与物理机制（简答/论述高频）

**反射率（$\rho$）与反射波谱曲线**：物体反射辐射通量 $E_\rho$ 与入射辐射通量 $E_0$ 之比称为反射率 $\rho = E_\rho / E_0$。地物的光谱反射率 $\rho(\lambda)$ 随波长 $\lambda$ 变化的规律曲线称为**地物反射波谱曲线**，是遥感波段选择、传感器设计、外业飞行时间规划和图像分类判读的直接物理依据。

### 1. 健康绿色植被的反射波谱特征（“两谷一峰一高台一陡坡两吸收”）
健康植被的反射波谱曲线受**叶绿素等色素（控制可见光）、叶片内部海绵组织细胞构造（控制近红外）和叶片含水量（控制短波红外）**三大因素共同主导：
1. **可见光波段（$0.4 \sim 0.7\ \mu\text{m}$）——“两谷一峰”（色素主导）**：
   * 在 **$0.45\ \mu\text{m}$（蓝光）** 和 **$0.65 \sim 0.67\ \mu\text{m}$（红光）** 处存在两个强烈的**叶绿素吸收谷**（用于光合作用），反射率极低（$< 10\%$）。
   * 在 **$0.54 \sim 0.55\ \mu\text{m}$（绿光）** 处因叶绿素吸收较少，形成一个小的**绿色反射峰**（反射率约 $10\% \sim 20\%$），使健康植物呈绿色。
2. **红边（Red Edge，$0.68 \sim 0.75\ \mu\text{m}$）——“一陡坡”**：
   * 从红光吸收谷到近红外高反射平台之间，反射率在短短几十纳米内从 $< 10\%$ 急剧飙升至 $40\% \sim 50\%$ 以上，形成斜率极大的陡坡，称为**“红边”**。当植被受病虫害、重金属胁迫或衰老时，叶绿素含量下降，红边斜率减小且位置向短波方向移动（**红边蓝移**）；长势旺盛时向长波移动（**红边红移**）。
3. **近红外波段（$0.76 \sim 1.1\ \mu\text{m}$）——“一高台”（细胞构造主导）**：
   * 叶片内部多孔的**海绵组织（薄壁细胞组织）与细胞壁-空气界面**发生强烈的多次折射与漫反射，形成反射率高达 $40\% \sim 60\%$ 的**近红外高反射峰（高台）**，这是区分植被与其他地物（水体、土壤）最显著的独有特征，也是构建 $NDVI$、$RVI$、$EVI$ 的核心物理基础。
4. **短波红外波段（$1.3 \sim 2.5\ \mu\text{m}$）——“两强水汽吸收谷”（含水量主导）**：
   * 受叶片内部水分强烈吸收影响，反射率整体随含水量增加而显著下降，并在 **$1.45\ \mu\text{m}$** 和 **$1.95\ \mu\text{m}$**（以及 $2.6\ \mu\text{m}$ 附近）形成深邃的**水分吸收谷**，可用于监测植被旱情与可燃物含水量。

### 2. 水体的反射波谱特征
水体的反射主要发生在蓝绿光波段，整体反射率极低（一般 $< 10\%$，平均仅 $3\%$ 左右），其波谱特征取决于**水体自身吸收、泥沙悬浮物浓度、叶绿素浓度及水深**：
1. **清洁水体（纯净水）**：
   * 在**蓝绿光波段（$0.4 \sim 0.6\ \mu\text{m}$）**反射率相对较高（约 $4\% \sim 5\%$），且具有一定的水体透射能力（可探测浅水底质）；
   * 在 $0.6\ \mu\text{m}$ 以上的红光波段反射率迅速下降；
   * 进入**近红外与短波红外波段（$> 0.76\ \mu\text{m}$）**，水体几乎吸收全部入射能量，**反射率趋近于 $0$**（在近红外单波段影像上呈极暗黑色，据此可构建 $NDWI$ 并轻松区分水陆边界）。
2. **浑浊含沙水体（如黄河水）**：
   * 随着水中悬浮泥沙含量增加（如由 $210\text{ mg/L}$ 增至 $7156\text{ mg/L}$），泥沙颗粒散射增强，可见光至近红外反射率整体显著升高，且**反射峰值波长向长波方向移动（紅移，峰值移至黄红波段 $0.6 \sim 0.7\ \mu\text{m}$ 甚至 $0.8\ \mu\text{m}$ 附近）**，课程中常利用 $620\text{ nm}$ 波段反演泥沙含量。
3. **含叶绿素水体（富营养化/藻类爆发/赤潮/绿潮）**：
   * 蓝光波段（$440 \sim 490\text{ nm}$）因藻类叶绿素吸收而反射率下降，绿光波段（$550 \sim 570\text{ nm}$）反射率升高，并在近红外（$0.7 \sim 0.8\ \mu\text{m}$）出现类似植被的抬升峰（严重浒苔爆发时表现出明显“红边”特征，可用 $NDVI > 0.2$ 或浮游藻类指数 $FAI$ 提取）。课程中常用 $490\text{ nm}$ 反演叶绿素浓度，$670\text{ nm}$ 检测黄色物质。
4. **城市黑臭水体**：整体反射率低于正常水体，且在可见光波段变化平缓，近红外无明显抬升。

### 3. 土壤与岩石的反射波谱特征
1. **土壤波谱特征**：
   * 自然状态下土壤表面反射率曲线整体**比较平滑，无明显的突发峰谷**，在可见光至短波红外（$0.4 \sim 2.0\ \mu\text{m}$）反射率**随波长增加而总体单调递增**。
   * **四大影响因素**：
     * **土壤含水量**：含水量越高，土壤整体反射率越低（湿土比干土暗），且在 $1.4\ \mu\text{m}$ 和 $1.9\ \mu\text{m}$ 处出现明显的水分吸收谷。
     * **有机质（腐殖质）含量**：有机质含量越高（如腐泥），反射率越低，土壤呈深褐色或黑色。
     * **土壤质地（颗粒大小）**：粒径越小（如粉砂、干黏土），表面越平滑紧密，反射率越高；颗粒越粗，阴影效应越强，反射率越低。
     * **氧化铁含量**：三价铁离子（$\text{Fe}^{3+}$）在 $0.85 \sim 0.9\ \mu\text{m}$ 有吸收带，同时使红光波段反射率相对升高。
2. **岩石与矿物高光谱特征**：
   * 岩浆岩反射率随二氧化硅（酸性程度）增加而升高（长石砂岩/花岗岩 $>$ 安山岩 $>$ 玄武岩）；
   * **高光谱诊断性吸收谱带（必考）**：
     * **可见光—近红外（$0.4 \sim 1.2\ \mu\text{m}$）**：由 $\text{Fe}^{2+}$、$\text{Fe}^{3+}$、$\text{Mn}$、$\text{Ni}$ 等**金属阳离子电子跃迁**引起，用于识别赤铁矿、镜铁矿等铁锰氧化物。
     * **短波红外（$1.3 \sim 2.5\ \mu\text{m}$）**：由羟基（$-\text{OH}$）、碳酸根（$\text{CO}_3^{2-}$）、硫酸根（$\text{SO}_4^{2-}$）等**分子团振动与旋转**引起。例如：$1.47 \sim 1.82\ \mu\text{m}$ 识别明矾石；$2.16 \sim 2.24\ \mu\text{m}$ 识别含 $\text{Al}-\text{OH}$ 矿物（高岭石、白云母、蒙脱石）；$2.26 \sim 2.32\ \mu\text{m}$ 识别碳酸盐类（方解石、白云石）；$2.30 \sim 2.40\ \mu\text{m}$ 识别含 $\text{Mg}-\text{OH}$ 矿物（绿泥石、滑石）。
     * **热红外（$8.0 \sim 14.0\ \mu\text{m}$）**：由硅氧键（$\text{Si}-\text{O}$）基本振动引起，用于识别石英、长石、辉石、橄榄石等**硅酸盐矿物**。

### 4. 积雪与云的波谱鉴别（新雪 vs 陈雪 vs 云）
* **新雪与陈雪**：在可见光波段（$0.4 \sim 0.7\ \mu\text{m}$）新雪反射率高达 $90\% \sim 100\%$，随波长进入近红外和短波红外（$> 1.4\ \mu\text{m}$）反射率急剧下降至接近 $0$；陈雪因粒径变大及杂质污染，全波段反射率均低于新雪。
* **云雪区分机制**：云和雪在可见光波段均呈高反射率（亮白色），但在 **$1.55 \sim 1.75\ \mu\text{m}$ 短波红外波段（如 TM5 / OLI6）**，雪对太阳辐射强烈吸收（反射率极低，呈暗色），而云滴散射依然强烈（反射率高，呈亮白色），利用该波段或归一化积雪指数 $NDSI$ 可有效区分云与积雪。

## 五、 卫星轨道参数与传感器成像特性

### 1. 遥感卫星姿态角与开普勒轨道六根数
* **卫星姿态角（外方位角元素）**：以卫星质心为原点，沿轨道前进切线方向为 $x$ 轴，垂直轨道面为 $y$ 轴，垂直 $xy$ 平面（指向地心/天底）为 $z$ 轴：
  * **滚动角（Roll, $\omega$）**：绕 $x$ 轴（飞行方向）旋转的姿态角，引起图像跨轨方向（横向）位移。
  * **俯仰角（Pitch, $\varphi$）**：绕 $y$ 轴旋转的姿态角，引起图像沿轨方向（纵向）位移。
  * **航偏角（Yaw, $\kappa$）**：绕 $z$ 轴旋转的姿态角，引起图像扭曲与旋转变形。
* **卫星轨道六参数（开普勒六根数）**：
  * 决定轨道面与赤道面相对位置的3个参数：**升交点赤经 $\Omega$**（升交点与春分点之间的地心角距）、**近地点角距 $\omega$**（近地点与升交点之间的角距）、**轨道倾角 $i$**（卫星轨道面与地球赤道面之间的夹角）。
  * 决定轨道形状、大小与卫星位置的3个参数：**长半轴 $a$**、**偏心率 $e$**、**过近地点时刻 $T$**。

### 2. 陆地资源卫星轨道的四大特点（太阳同步轨道必考）
陆地资源卫星（如 Landsat、SPOT、Sentinel-2、高分系列、资源系列）普遍采用**近圆形、近极地、太阳同步、可重复轨道**：
1. **近圆形轨道**：偏心率极小（如 $e \approx 0.0006$），保证卫星在全球不同纬度获取的遥感影像具有**近似一致的比例尺和空间分辨率**。
2. **近极地轨道**：轨道倾角 $i$ 设计在 $90^\circ \sim 100^\circ$ 之间（如 Landsat 约 $98.2^\circ$，Sentinel-2 约 $98.6^\circ$），倾角接近 $90^\circ$ 有利于借助地球自转实现**全球绝大部分陆地表面（除极点附近极小区域外）的全覆盖观测**。
3. **太阳同步轨道（Sun-Synchronous Orbit, SSO）**：卫星轨道面与日地连线在黄道面内的夹角保持恒定，使轨道平面绕地轴进动的角速度恰好等于地球绕太阳公转的平均角速度（约 $0.9856^\circ/\text{d}$）。**物理意义**：保证卫星每次经过同一纬度地区时的**地方太阳时（如降交点时刻上午 10:00 或 10:30）基本相同**，从而使不同时期获取的同地区影像具有相似的太阳高度角和光照条件，便于多时相动态对比。
4. **可重复轨道（回归轨道）**：卫星按固定周期回归同一地点上空（重访周期，如 Landsat 16天，Sentinel-2 单星10天/双星5天），有利于对地表变化进行**周期性动态监测**。

### 3. 传感器“四大分辨率”及其内在矛盾
1. **空间分辨率（Spatial Resolution）**：遥感影像能区分的最小地面单元尺寸，常用**像素大小（Pixel Size）**、**地面采样间隔（GSD，相邻两像素中心点在地面上的距离）**和**瞬时视场角（IFOV，单个探测元件的受光角度，单位 $\text{mrad}$）**表示，满足 $D = H \cdot \text{IFOV}$。
2. **光谱分辨率（Spectral Resolution）**：传感器接收目标辐射光谱时能区分的**最小波长间隔 $\Delta\lambda$**。波段范围越窄、通道数越多，光谱分辨率越高（多光谱一般为几十至上百 $\text{nm}$，高光谱达到 $5 \sim 10\text{ nm}$ 甚至纳米级）。
3. **辐射分辨率（Radiometric Resolution）**：传感器能区分的**最小辐射能量之差**，取决于探测器的信噪比（动态范围）和量化比特位数 $n$（量化等级数 $N = 2^n$，如 $8\text{ bit} = 256$ 级，$10\text{ bit} = 1024$ 级，$12\text{ bit} = 4096$ 级）。$n$ 越大，对地物细微亮暗差异的刻画能力越强。
4. **时间分辨率（Temporal Resolution）**：对同一地面目标相邻两次成像的时间间隔，亦称**重访周期（Revisit Period）**。分为短周期（小时级，如静止气象卫星）、中周期（天级，如资源卫星）、长周期（年级）。
5. **四大分辨率之间的物理制约与折中**：
   * **空间分辨率与光谱分辨率的矛盾**：单个探测元件在单位时间内捕获的辐射能量 $E \propto \text{IFOV}^2 \cdot \Delta\lambda \cdot \Delta t$。由于探测器信噪比要求最小入射能量一定，若提高光谱分辨率（减小 $\Delta\lambda$），则必须增大瞬时视场角 $\text{IFOV}$（从而降低空间分辨率）或延长驻留时间 $\Delta t$。
   * **解决途径**：① 研发具有更高光谱灵敏度的新型探测器与采用线阵/面阵推扫技术（增加积分驻留时间 $\Delta t$）；② 将高空间分辨率全色影像（PAN）与高光谱/多光谱影像（MS/HSI）进行**图像融合（Pan-sharpening）**。
   * **空间分辨率与时间分辨率的矛盾**：空间分辨率越高，扫描幅宽（Swath Width）通常越窄，导致全球覆盖所需的重访周期变长。解决途径：采用**传感器侧摆成像**（如 SPOT、高分系列）或组建**多星星座组网**（如 Sentinel-2A/B/C、Landsat-8/9）。

### 4. 摆扫式扫描仪与推扫式扫描仪（核心对比）
| 对比维度 | 摆扫式扫描仪（Whiskbroom Scanner） | 推扫式扫描仪（Pushbroom Scanner） |
| :--- | :--- | :--- |
| **别名** | 光机扫描仪、物面扫描仪（Across-track Scanner） | 线阵列扫描仪、像面扫描仪（Along-track Scanner） |
| **核心结构** | 机械旋转/摆动扫描镜 + 分光元件 + 少量离散探测器 | 光学镜头 + 分光棱镜/滤光片 + 焦平面长线阵列 CCD 探测器 |
| **成像过程** | 依靠机械扫描镜左右摆动实现垂直航向**逐像元、逐行扫描**，配合平台前飞完成二维覆盖 | 无机械摆动镜，对垂直航向**整行线阵列所有 CCD 探测元件同时曝光成像**，随平台前飞推扫成面 |
| **瞬时观测范围** | 单个瞬时视场角（$\text{IFOV}$）对应的单个地面像元 | 一整行 CCD 线阵列（总视场角 $\text{FOV}$）对应的地面扫描线 |
| **驻留时间与信噪比** | 单个像元驻留积分时间极短，**信噪比低** | 整行同时积分，像元驻留时间长，**信噪比高**（故能同时提高空间与光谱分辨率） |
| **几何与机械稳定性** | 含高速运动机械部件，易磨损，**机械稳定性低**，易产生全景畸变与扫描行错位 | 固态电子自扫描，无运动扫描镜，体积小、重量轻、**几何稳定性高**、寿命长 |
| **辐射一致性** | 所有像元共用同一探测器，**辐射一致性高**，定标容易 | 成千上万个 CCD 探测元响应函数存在微小差异，**辐射一致性较低**（易产生垂直条带噪声，需严密相对辐射定标） |
| **代表传感器（卫星）** | MSS、TM、ETM+（Landsat 1~7）、AVHRR（NOAA）、MODIS（Terra/Aqua） | OLI/TIRS（Landsat-8/9）、MSI（Sentinel-2）、HRV（SPOT）、IKONOS、QuickBird、WorldView、高分系列（GF-1/2/6） |

### 5. 国内外主流遥感卫星核心参数速查（选择/填空必背）
* **Landsat 系列**：
  * **1972年 ERTS-1（Landsat-1）**：空间分辨率 $79\text{ m}$（常称 $80\text{ m}$），开启现代航天遥感第一个里程碑。
  * **Landsat-4/5（TM）**：7个波段，可见光/近红外/短波红外分辨率 $30\text{ m}$，热红外 Band 6（$10.4 \sim 12.5\ \mu\text{m}$）分辨率 $120\text{ m}$。
  * **Landsat-7（ETM+）**：新增 Band 8 全色波段（PAN，$15\text{ m}$），热红外 Band 6 分辨率提升至 $60\text{ m}$。
  * **Landsat-8/9（OLI + TIRS）**：首次采用**推扫式**传感器，重访周期 $16\text{ d}$，轨道高度 $705\text{ km}$，幅宽 $185\text{ km}$。共 11 个波段：OLI 含 Band 1 海岸/气溶胶（$0.43 \sim 0.45\ \mu\text{m}$，用于近海与气溶胶监测）、Band 2 蓝、Band 3 绿、Band 4 红、Band 5 近红外、Band 6 SWIR1、Band 7 SWIR2（以上均为 $30\text{ m}$）、Band 8 全色（$15\text{ m}$）、Band 9 卷云（$1.36 \sim 1.38\ \mu\text{m}$，$30\text{ m}$，专门检测高空卷云）；TIRS 含 Band 10、Band 11 两个热红外波段（$100\text{ m}$，用于劈窗算法反演地表温度）。
* **Sentinel（哨兵）系列（欧空局哥白尼计划）**：
  * **Sentinel-1**：C 波段合成孔径雷达（SAR）卫星，具备条带（SM）、干涉宽幅（IW，$20\text{ m}@250\text{ km}$）、超宽幅（EW）、波模式（WV）四种模式。
  * **Sentinel-2**：搭载多光谱成像仪（MSI），共 13 个波段，幅宽 $290\text{ km}$，双星重访周期 $5\text{ d}$。空间分辨率包含 **$10\text{ m}$（B2蓝、B3绿、B4红、B8近红外）**、**$20\text{ m}$（含 B5/B6/B7 三个红边波段、B8A 窄近红外、B11/B12 短波红外，是全球首个免费提供3个红边波段的陆地卫星）**、**$60\text{ m}$（B1气溶胶、B9水汽、B10卷云）**。
* **中国高分专项（GF-1 至 GF-7，必考匹配题）**：
  * **GF-1（2013）**：高分首发星，太阳同步轨道，搭载 $2\text{ m}$ 全色 / $8\text{ m}$ 多光谱相机（幅宽 $60\text{ km}$）及 4 台 $16\text{ m}$ 宽幅多光谱相机（幅宽高达 $800\text{ km}$，重访 $4\text{ d}$）。
  * **GF-2（2014）**：我国首颗空间分辨率优于 $1\text{ m}$ 的民用光学遥感卫星（$0.8\text{ m}$/标称 $1\text{ m}$ 全色，$3.2\text{ m}$/标称 $4\text{ m}$ 多光谱，幅宽 $45\text{ km}$）。
  * **GF-3（2016）**：我国首颗分辨率达到 $1\text{ m}$ 的 **C 频段全极化合成孔径雷达（SAR）** 卫星（12种成像模式）。
  * **GF-4（2015）**：我国第一颗**地球同步静止轨道（$36000\text{ km}$）**高分辨光学遥感卫星，可见光分辨率 $50\text{ m}$，中波红外 $400\text{ m}$，时间分辨率达 $5 \sim 20\text{ s}$（凝视模式），适合防灾减灾与林火实时监测。
  * **GF-5（2018）**：**全谱段高光谱卫星**（搭载可见短波红外高光谱相机 AHSI，330个波段，光谱分辨率 $5 \sim 10\text{ nm}$，空间分辨率 $30\text{ m}$），并搭载多部大气痕量气体与气溶胶探测仪。
  * **GF-6（2018）**：中国首颗实现**精准农业观测**的高分卫星（新增红边波段，载荷配置与 GF-1 相似，与之组网）。
  * **GF-7（2019）**：我国首颗民用**亚米级双线阵光学立体测绘 + 激光测高仪（LiDAR）**卫星，用于 $1:10000$ 立体测图。
* **中国资源、环境与风云气象卫星**：
  * **资源一号（CBERS / ZY-1）**：中巴地球资源卫星，我国第一代传输型资源卫星；**资源三号（ZY-3）**：我国首颗民用高分辨三线阵（前视 $3.5\text{ m}$、后视 $3.5\text{ m}$、正视 $2.1\text{ m}$）立体测绘卫星。
  * **环境一号（HJ-1A/1B/1C）**：“$2+1$”星座（HJ-1A/1B 为光学星，其中 1A 含 HSI 高光谱、1B 含 IRS 红外；HJ-1C 为 S 波段 SAR 星）。
  * **风云气象卫星（FY）**：**奇数系列（FY-1、FY-3）为极轨气象卫星**；**偶数系列（FY-2、FY-4）为地球静止轨道气象卫星**（其中 FY-4 采用三轴稳定，搭载 14 通道辐射计、干涉式大气垂直探测仪与闪电成像仪，全圆盘观测仅需 $15\text{ min}$）。
  * **夜间灯光与碳卫星**：武汉大学“**珞珈一号**”为全球首颗专业夜光遥感卫星；中国“**可持续发展科学卫星1号（SDGSAT-1）**”搭载微光、热红外和多谱段成像仪；中国首颗碳卫星为 **TanSat**（利用近红外/短波红外气体吸收池原理反演 $\text{CO}_2$ 柱浓度，国外同类卫星有日本 GOSAT、美国 OCO-2/3）。
